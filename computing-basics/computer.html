      "figure": {
        "custom": true,
        "changed": [
          "saved-recording"
        ]
      },
      "predict": {
        "prompt": "같은 녹음을 위에서는 저장 안 하고 닫고, 아래에서는 저장하고 닫았습니다. 다시 열었을 때 같은 소리 무늬가 나오는 줄은 어디일까요?",
        "options": [
          {
            "text": "아래 '저장하고 닫기' 줄",
            "why": "소리 파일이 남은 쪽만 그 파일을 작업 창으로 다시 불러올 수 있습니다.",
            "correct": true
          },
          {
            "text": "두 줄 모두",
            "why": "녹음은 끝내기만 하면 저절로 보관된다고 본 것인데, 이 앱은 자동 저장을 꺼 두어 저장하지 않은 녹음은 파일이 없습니다."
          },
          {
            "text": "어느 줄도 아니다",
            "why": "소리는 그림과 달리 파일로 남길 수 없다고 본 것인데, 소리도 그림처럼 파일로 저장됩니다."
          }
        ],
        "before": {
          "custom": true,
          "hide": [
            "result"
          ],
          "description": "위아래 줄은 같은 녹음으로 시작합니다. 파일 목록에는 아래 줄에만 파일이 있습니다. 오른쪽 두 창에는 아직 열지 않음이라고 적혀 있습니다."

    }
  ],
  "review": {
    "own": [
      "computer-1",
      "computer-3"
    ],
    "prereq": {

      "id": "computer-tasks-4"

const byId = id => document.getElementById(id);
const viewport = byId('scene');
const drawing = byId('figure');
const viewWidth = 620;
const viewHeight = 280;
const center = {x: viewWidth / 2, y: viewHeight / 2};
const camera = {x: 0, y: 0, zoom: 1};
const maxZoom = 2.2;
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
const columnCenters = {2: [157, 462], 3: [106, 310, 514], 4: [85, 235, 385, 535]};

function text(parent, x, y, value, className = 'caption') {
  const label = svg('text', {x, y, class: className}, parent);
  label.textContent = value;
  return label;
}

function rect(parent, x, y, width, height, className, rx = 7) {
  return svg('rect', {x, y, width, height, rx, class: className}, parent);
}

function flow(parent, d, kind = '') {
  return svg('path', {d, class: 'flow ' + kind}, parent);
}

function thumbnail(parent, work, x, y, size = 38) {
  svg('use', {href: '#storage-' + work, x: x - size / 2, y: y - size / 2, width: size, height: size}, parent);
}

function workWindow(parent, x, y, content, compact = false, highlight = false) {
  const height = compact ? 51 : 62;
  const top = y - height / 2;
  const bar = compact ? 10 : 13;
  if (content === closed || content === off || content === pending) {
    mark(rect(parent, x - 55, top, 110, height, 'empty'), highlight);
    const label = content === pending ? '아직 열지 않음' : content === closed ? '창 닫힘' : '비어 있음';
    text(parent, x, y + 5, label, 'caption quiet');
    return;
  }
  mark(rect(parent, x - 55, top, 110, height, 'window'), highlight === true);
  rect(parent, x - 54, top + 1, 108, bar, 'window-bar', 5);
  svg('circle', {cx: x - 44, cy: top + bar / 2 + 1, r: 2, class: 'icon-stroke'}, parent);
  svg('circle', {cx: x - 37, cy: top + bar / 2 + 1, r: 2, class: 'icon-stroke'}, parent);
  if (content) {
    const size = compact ? 32 : 38;
    if (highlight === 'star') mark(rect(parent, x - size / 2, y + bar / 2 - size / 2, size, size, 'star-outline'), true);
    thumbnail(parent, content, x, y + bar / 2, size);
  }
  else rect(parent, x - 18, y + bar / 2 - 13, 36, 26, 'empty', 4);
}

function fileFolder(parent, x, y, content, compact = false, highlight = false) {
  if (!content) {
    rect(parent, x - 53, y - 17, 106, 34, 'empty');
    text(parent, x, y + 5, '비어 있음', 'small quiet');
    return;
  }
  mark(svg('path', {d: `M ${x - 55} ${y - 11} v -9 h 32 l 7 7 h 66 q 5 0 5 5 v 22 q 0 5 -5 5 h -100 q -5 0 -5 -5 Z`, class: 'folder'}, parent), highlight);
  thumbnail(parent, content, x - 32, y + 1, compact ? 24 : 27);
  text(parent, x + 17, y + 6, content === star ? starFile : audioFile, 'small');
}

function mark(element, highlight) {
  if (highlight) element.setAttribute('data-changed', '');
}

function columnDiagram(step, lastVisible, index, changed) {
  const centers = columnCenters[step.moments.length];
  const named = index === 3 || index === 4;
  const saveAndOpen = changed.includes('save-and-open');
  step.moments.slice(0, lastVisible + 1).forEach(([label, work, file], position) => {
    const x = centers[position];
    const parent = svg('g', {}, drawing);
    mark(text(parent, x, 33, label, 'heading'), saveAndOpen && (position === 1 || position === 3));
    const highlightWindow = (changed.includes('closed-and-new') && position >= 2)
      || (saveAndOpen && position === 3) || (changed.includes('empty-memory') && position === 1);
    const highlightStar = changed.includes('drawn-star') && position === 1;
    workWindow(parent, x, 110, work, false, highlightStar ? 'star' : highlightWindow);
    fileFolder(parent, x, 225, file, false, saveAndOpen && position > 0);
    if (!position) {
      const namesChanged = changed.includes('row-names');
      mark(text(parent, x, 64, named ? '메모리 · 작업 중' : '작업 창'), namesChanged);
      mark(text(parent, x, 194, named ? '저장장치 · 보관' : '파일 목록'), namesChanged);
      return;
    }
    const previousX = centers[position - 1];
    const previousFile = step.moments[position - 1][2];
    flow(parent, `M ${previousX + 59} 110 H ${x - 61}`);
    if (file && previousFile) mark(flow(parent, `M ${previousX + 59} 225 H ${x - 61}`), saveAndOpen && position === 2);
    if (file && !previousFile) {
      mark(flow(parent, `M ${x} 145 V 198`, 'copy'), saveAndOpen);
      text(parent, x + 47, 174, '파일로 복사', 'small');
    }
    if (work && file && previousFile && position === step.moments.length - 1) {
      mark(flow(parent, `M ${x} 198 V 146`, 'copy reading'), saveAndOpen);
      text(parent, x - 57, 175, '파일 불러오기', 'small');
    }
  });
}

function recordingRow(y, saved, reopened, highlight = false) {
  workWindow(drawing, 106, y, wave, true);
  fileFolder(drawing, 310, y, saved ? wave : null, true, highlight);
  text(drawing, 310, y - 34, saved ? '저장하고 닫기' : '저장 안 하고 닫기');
  flow(drawing, `M 166 ${y} H 250`);
  workWindow(drawing, 514, y, reopened ? (saved ? wave : null) : pending, true, highlight);
  if (reopened) flow(drawing, `M 370 ${y} H 452`);
}

function compareRecordings(reopened, changed) {
  text(drawing, 106, 31, '녹음한 소리', 'heading');
  text(drawing, 310, 31, '파일 목록', 'heading');
  text(drawing, 514, 31, '다시 연 창', 'heading');
  recordingRow(104, false, reopened);
  svg('line', {x1: 29, y1: 151, x2: 590, y2: 151, class: 'rule'}, drawing);
  recordingRow(213, true, reopened, changed.includes('saved-recording'));
}

function drawFigure(index, {hide, changed}) {
  const step = lesson.steps[index];
  const hidden = hide.includes('result');
  if (step.moments) columnDiagram(step, hidden ? (index === 4 ? 0 : 1) : step.moments.length - 1, index, changed);
  else compareRecordings(!hidden, changed);
}

byId('zoom-in').onclick = () => zoomBy(.3);
byId('zoom-out').onclick = () => zoomBy(-.3);
enableCameraDrag();

viewport.addEventListener('keydown', event => {
  if (camera.zoom === 1) return;
  const direction = {ArrowLeft: [-1, 0], ArrowUp: [0, -1], ArrowRight: [1, 0], ArrowDown: [0, 1]}[event.key];
  if (!direction) return;
  event.preventDefault();
  setCamera(camera.x + direction[0] * 18, camera.y + direction[1] * 18, camera.zoom);
});

window.addEventListener('keydown', event => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  const zoom = {'+': () => zoomBy(.3), '-': () => zoomBy(-.3), '0': resetView}[event.key];
  if (zoom) {
    event.preventDefault();
    zoom();
  }
});
setCamera(0, 0, 1);
</script>
