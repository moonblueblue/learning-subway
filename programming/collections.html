<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="리스트와 딕셔너리가 메모리 칸에 값을 어떻게 담고, 어떻게 찾아 읽는지 코드를 한 줄씩 실행하며 비교해 보세요.">
<title>리스트와 딕셔너리 · 레슨 1.4</title>
<style>
:root{color-scheme:light;--ink:#142620;--muted:#43574f;--border:#cbd9d0;--paper:#f4f7ef;--panel:#fff;--accent:#12634b;--request:#187959;--response:#5362a0;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.65 system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled,button[aria-disabled=true]{cursor:default;opacity:.5}
:focus-visible{outline:3px solid #a24c14;outline-offset:3px}
.shell{max-width:1280px;margin:auto;padding:clamp(16px,2.5vw,32px)}
header{margin-bottom:20px}
h1,h2,p{margin:0}
.eyebrow{color:var(--accent);font-size:.875rem;font-weight:700;margin-bottom:6px}
h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.12;letter-spacing:-.065em}
header p.lead{color:var(--muted);margin-top:10px}
.workspace{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(360px,1fr);gap:20px;align-items:stretch}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:18px;overflow:hidden}
.stage-top,.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;flex-wrap:wrap}
.stage-top h2,.timeline h2{font-size:1rem}
.status{color:var(--accent);font-size:.875rem;font-weight:700}
.stage{background:#eaf3eb;border-block:1px solid var(--border)}
svg{display:block;width:100%;height:auto;max-height:520px}
#scene{touch-action:pan-y;user-select:none}
#scene:focus-visible{outline-offset:-4px}
#scene.is-zoomed{cursor:grab;touch-action:none}
#scene.is-dragging{cursor:grabbing}
.hands-on{padding:14px 18px;border-bottom:1px solid var(--border);display:grid;gap:12px}
.try{display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:#eef5ed;border-left:3px solid var(--accent);border-radius:0 9px 9px 0;min-height:64px}
.try strong{color:var(--accent);font-size:.875rem;margin-right:6px}
.try-result{color:var(--accent);font-weight:700}
.try-result:empty{display:none}
.try.solved{background:#d2f4dd}
.readout{font-size:1rem;color:var(--muted)}
.readout b{color:var(--ink);font:700 1.1rem var(--mono);letter-spacing:.04em}
.readout .total{color:var(--accent);font-size:1.3rem}
.switch-area{display:flex;gap:10px 14px;align-items:stretch;flex-wrap:wrap}
.switch-row{display:grid;grid-template-columns:repeat(var(--n,8),minmax(0,1fr));gap:6px;flex:1 1 320px;max-width:calc(var(--n,8) * 66px)}
.bit-button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:54px;padding:4px 2px;border:1px solid #9fb7a9;border-radius:10px;background:#f6f8f5;line-height:1.2}
.bit-button .place{font:600 .75rem var(--mono);color:var(--muted)}
.bit-button .bit{font:700 1.15rem var(--mono);color:#7c8c85}
.bit-button:hover{border-color:var(--accent)}
.bit-button[aria-pressed=true]{background:#d2f4dd;border-color:var(--accent)}
.bit-button[aria-pressed=true] .place,.bit-button[aria-pressed=true] .bit{color:#0f5a3c}
.switch-actions{display:flex;gap:8px;align-items:center}
.view-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--border)}
.view-scale{min-width:4ch;text-align:center;color:var(--muted);font:700 .875rem var(--mono)}
.view-hint{color:var(--muted);font-size:.875rem;margin-inline-start:auto}
.touch-hint{display:none}
@media(pointer:coarse){.mouse-hint{display:none}.touch-hint{display:inline}}
.iso-grid{fill:none;stroke:#86ad97;stroke-width:.6;stroke-opacity:.24}
.node .face{stroke-width:.8;stroke-linejoin:round}
.node .shadow{fill:#1f4434;opacity:.16}
.node .highlight{fill:none;stroke:#fff;stroke-opacity:.75;stroke-width:1.1;stroke-linecap:round}
.switch{cursor:pointer}
.switch .face,.switch .glow,.switch .digit,.switch .tag rect,.switch .tag text{transition:fill .18s,stroke .18s,opacity .18s}
.switch .left{fill:#d3dad6;stroke:#8c9d96}
.switch .right{fill:#b9c4be;stroke:#8c9d96}
.switch .top{fill:#eef1ef;stroke:#8c9d96}
.switch.on .left{fill:#a5d6b6;stroke:#4f8f6b}
.switch.on .right{fill:#78b592;stroke:#4f8f6b}
.switch.on .top{fill:#d2f4dd;stroke:#4f8f6b}
.switch .glow{fill:#4fcf87;opacity:0}
.switch.on .glow{opacity:.55}
.switch .digit{font:700 12px var(--mono);text-anchor:middle;dominant-baseline:central;fill:#7c8c85}
.switch.on .digit{fill:#0f5a3c}
.switch.on .tag rect{stroke:var(--accent)}
.switch.on .tag text{fill:var(--accent)}
.casing{fill:none;stroke:#eaf3eb;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.wire{fill:none;stroke-linecap:round;stroke-linejoin:round}
.wire.signal{stroke:var(--request);stroke-width:2.6}
.chevron{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chevron.signal{stroke:var(--request)}
.tag rect{fill:#fff;fill-opacity:.94;stroke:#c9d6ce;stroke-width:.8}
.tag text{font:600 12px system-ui,sans-serif;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.tag.place text{font:700 11.5px var(--mono)}
.total rect{fill:#fff;stroke:var(--accent);stroke-width:1.2}
.total text{font:700 20px var(--mono);fill:var(--accent);text-anchor:middle;dominant-baseline:central}
.total.max rect{fill:#fff6ef;stroke:#a24c14}
.total.max text{fill:#a24c14}
.total{transform-box:fill-box;transform-origin:center}
.total.bump{animation:bump .32s ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
.note{animation:note 1.6s ease-out forwards}
.note path{fill:none;stroke:#43574f;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.note .arc{stroke-dasharray:3 3.5}
.note text{font:700 9.5px system-ui,sans-serif;fill:#43574f;text-anchor:middle;paint-order:stroke;stroke:#eaf3eb;stroke-width:3.5px;stroke-linejoin:round}
@keyframes note{0%{opacity:0}10%{opacity:1}72%{opacity:1}100%{opacity:0}}
.packet{stroke:white;stroke-width:1.6;fill:var(--request)}
.packet-halo{opacity:.22;fill:var(--request)}
.packet-label{font:700 9.5px var(--mono);fill:#0f5a3c;text-anchor:middle;paint-order:stroke;stroke:#eaf3eb;stroke-width:3px;stroke-linejoin:round}
@media(max-width:600px){.tag text{font-size:16px}.tag.place text{font-size:15px}.switch .digit{font-size:14px}.total text{font-size:26px}.packet-label{font-size:13px}.note text{font-size:13px}}
@media(prefers-reduced-motion:reduce){.switch .face,.switch .glow,.switch .digit,.switch .tag rect,.switch .tag text{transition:none}.note,.total.bump{animation:none}}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.875rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sample{width:22px;border-top:3px solid var(--request)}
.dot{width:13px;height:13px;border-radius:4px;border:1px solid #8c9d96;background:#eef1ef}
.dot.on{border-color:#4f8f6b;background:#bfecce}
.actions,.navigation{display:flex;gap:8px;flex-wrap:wrap}
.action{border:1px solid #9fb7a9;background:white;border-radius:9px;padding:7px 12px;min-height:44px;font-size:.875rem;font-weight:650}
.action:hover:not(:disabled):not([aria-disabled=true]){background:#e8f4eb}
.primary{background:var(--accent);color:white;border-color:var(--accent)}
.primary:hover:not(:disabled){background:#0a4c3a}
.timeline{padding:15px 18px}
.timeline-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.timeline-top span{font:700 .875rem var(--mono);color:var(--muted)}
.steps{list-style:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0;margin:0;gap:8px}
.steps button{height:100%;min-height:52px;text-align:left;width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:#f6f8f5;font-size:.875rem;line-height:1.45;display:flex;gap:7px;align-items:center}
.steps button:hover{border-color:var(--accent)}
.steps button[aria-current=step]{background:#d9efe2;border-color:var(--accent);font-weight:750}
.step-number{font:700 .875rem var(--mono);color:var(--accent)}
.explanation{padding:clamp(20px,2.4vw,32px);display:flex;flex-direction:column;gap:20px}
.explanation h2{font-size:clamp(1.5rem,2.3vw,2.1rem);letter-spacing:-.055em;line-height:1.3}
.explanation p{color:var(--muted);font-size:1.0625rem;line-height:1.75}
.takeaway p{font-size:1rem}
.takeaway{padding:12px 14px;background:#eef5ed;border-left:3px solid var(--accent);border-radius:0 9px 9px 0}
.takeaway strong{display:block;color:var(--accent);font-size:.875rem}
.navigation{justify-content:space-between;margin-top:auto;padding-top:8px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(max-width:980px){.workspace{grid-template-columns:1fr}.navigation{margin-top:0}}
@media(max-width:560px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){.shell{padding:18px 12px}.stage-top,.controls,.timeline,.view-controls,.hands-on{padding-inline:12px}.view-hint{flex-basis:100%;margin-inline-start:0}.steps{gap:5px}.steps button{padding-inline:6px}.switch-row{gap:4px}}

@media(max-width:640px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cell .face{stroke:#8c9d96;stroke-width:.8;transition:fill .2s}
.cell.empty .left{fill:#d3dad6}.cell.empty .right{fill:#b9c4be}.cell.empty .top{fill:#eef1ef}
.cell.used .left{fill:#e6ebe8}.cell.used .right{fill:#cfd8d4}.cell.used .top{fill:#ffffff}
.cell.changed .top{animation:flash 1s ease-out}
@keyframes flash{0%{fill:#bfeccc}100%{fill:#ffffff}}
.cell-value{font:700 12px var(--mono);text-anchor:middle;dominant-baseline:central;fill:#142620}
.cell.empty .cell-value{fill:#9aa8a2}
.address{font:600 9px var(--mono);fill:#6b7d76;text-anchor:start}
.tag.name{transition:opacity .25s}
.tag.name rect{stroke:var(--accent);stroke-width:1.1}
.tag.name text{fill:var(--accent);font-weight:700;font-family:var(--mono);font-size:10.5px}
.bus{fill:none;stroke:#b9cdc2;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bus.active{stroke:#7fa891}
.packet-group.read .packet,.packet-group.read .packet-halo{fill:var(--response)}
.packet-group.write .packet,.packet-group.write .packet-halo{fill:var(--request)}
.packet-group.read .packet-label{fill:#3b4880}
.code-area{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
.code{list-style:none;counter-reset:line;margin:0;padding:10px 0;background:#1f2d29;border-radius:12px;color:#e8f2ec;font:600 1rem/1.5 var(--mono);flex:1 1 300px}
.code li{counter-increment:line;padding:5px 14px 5px 46px;position:relative}
.code li::before{content:counter(line);position:absolute;left:16px;color:#6f8a80}
.code li.done{color:#8fa79c}
.code li.current{background:#2f4a41;color:#ffffff}
.code li.current::after{content:'다음';position:absolute;right:14px;color:#9fe3b6;font-size:.8125rem}
.code-actions{display:flex;flex-direction:column;gap:8px;justify-content:flex-start}
.try-choices{display:flex;gap:6px;flex-wrap:wrap}
.try-choices:empty{display:none}
.dot.read{background:var(--response);border-color:var(--response)}
.dot.write{background:var(--request);border-color:var(--request)}
@media(prefers-reduced-motion:reduce){.cell .face,.tag.name{transition:none}.cell.changed .top{animation:none}}
</style>

<body>
<main class="shell">
  <header>
    <p class="eyebrow">1장 프로그래밍 입문 · 레슨 1.4 · 실습</p>
    <h1>리스트와 딕셔너리</h1>
    <p class="lead">값 여러 개를 담는 두 방법은 무엇이 다를까요? 칸에 붙는 이름표와, 찾을 때 읽는 칸 수를 비교해 보세요.</p>
  </header>
  <div class="workspace">
    <div>
      <section class="panel" aria-labelledby="stage-heading">
        <div class="stage-top"><h2 id="stage-heading">메모리와 CPU</h2><span class="status" id="status">재생 중</span></div>
        <div class="stage">
          <svg id="scene" viewBox="0 0 620 280" role="img" tabindex="0" aria-labelledby="scene-title scene-desc">
            <title id="scene-title">리스트와 딕셔너리가 메모리 칸에 값을 담고 읽는 장면</title><desc id="scene-desc"></desc>
            <defs>
              <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
              <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
              <radialGradient id="grid-fade"><stop offset=".45" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
              <mask id="grid-mask"><rect x="-460" y="-260" width="920" height="520" fill="url(#grid-fade)"/></mask>
            </defs>
            <g id="world" aria-hidden="true">
              <path id="grid" class="iso-grid" mask="url(#grid-mask)"></path>
              <g id="casings"></g><g id="links"></g><g id="nodes"></g><g id="packets"></g>
            </g>
          </svg>
        </div>
        <div class="hands-on">
          <div class="try" id="try">
            <p><strong>해 보기</strong><span id="try-text"></span></p>
            <p class="try-result" id="try-result" role="status"></p>
            <div class="try-choices" id="try-choices" role="group" aria-label="예측 고르기"></div>
          </div>
          <p class="readout" id="readout"></p>
          <div class="code-area">
            <ol class="code" id="code" aria-label="프로그램"></ol>
            <div class="code-actions">
              <button class="action primary" id="run-line" type="button">한 줄 실행</button>
              <button class="action" id="restart" type="button">처음부터</button>
            </div>
          </div>
        </div>
        <div class="view-controls" role="group" aria-label="장면 보기">
          <button class="action" id="zoom-out" type="button" aria-label="장면 축소">−</button>
          <output class="view-scale" id="view-scale" aria-label="현재 배율" aria-live="off">100%</output>
          <button class="action" id="zoom-in" type="button" aria-label="장면 확대">+</button>
          <button class="action" id="view-reset" type="button">원래 보기</button>
          <span class="view-hint"><span class="mouse-hint">확대 후 드래그로 이동</span><span class="touch-hint">두 손가락으로 확대</span></span>
        </div>
        <div class="controls">
          <div class="legend" aria-label="범례"><span><i class="dot read"></i>읽기 · 칸 → CPU</span><span><i class="dot write"></i>쓰기 · CPU → 칸</span><span><i class="dot"></i>빈 칸</span></div>
          <div class="actions"><button class="action" id="pause" type="button">일시정지</button><button class="action" id="replay" type="button">다시 보기</button></div>
        </div>
        <nav class="timeline" aria-labelledby="timeline-heading">
          <div class="timeline-top"><h2 id="timeline-heading">타임라인</h2><span id="count"></span></div>
          <ol class="steps" id="steps"></ol>
        </nav>
      </section>
    </div>
    <section class="panel explanation" aria-labelledby="step-title">
      <h2 id="step-title"></h2><p id="body"></p>
      <div class="takeaway"><strong>관찰 포인트</strong><p id="takeaway"></p></div>
      <nav class="navigation" aria-label="이전 및 다음 단계"><button class="action" id="prev" type="button">이전 단계</button><button class="action primary" id="next" type="button">다음 단계</button></nav>
    </section>

  <div class="sr-only" id="announcement" role="status"></div>
</main>
<script>
const byId = (id) => document.getElementById(id);
const viewport = byId('scene');
const viewWidth = 620;
const viewHeight = 280;
const maxZoom = 3;
const center = { x: viewWidth / 2, y: viewHeight / 2 };
const camera = { x: 0, y: 0, zoom: 1 };
const pointers = new Map();
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));



// Convert from screen pixels to fixed viewport coordinates, accounting for SVG letterboxing.


// A press that starts on a scene object and ends without moving counts as a tap on it.
// Tracked separately from the camera pointers so it also works when the pointer is captured.
let tap = null;
viewport.addEventListener('pointerdown', (event) => {
  const target = event.target.closest?.('[data-hit]');
  tap = target && event.button === 0 && pointers.size === 0
    ? { hit: target.dataset.hit, x: event.clientX, y: event.clientY, id: event.pointerId }
    : null;
});
viewport.addEventListener('pointerup', (event) => {
  if (tap && tap.id === event.pointerId && Math.hypot(event.clientX - tap.x, event.clientY - tap.y) < 8) {
    sceneTap(tap.hit);
  }
  tap = null;
});
viewport.addEventListener('pointercancel', () => { tap = null; });

viewport.addEventListener('pointerdown', (event) => {
  if (event.button !== 0 || pointers.size >= 2) return;
  if (event.pointerType !== 'touch' && camera.zoom === 1) return;
  pointers.set(event.pointerId, viewportPoint(event));
  viewport.setPointerCapture(event.pointerId);
});
viewport.addEventListener('pointermove', (event) => {
  if (!pointers.has(event.pointerId)) return;
  const before = pointerGeometry();
  pointers.set(event.pointerId, viewportPoint(event));
  const after = pointerGeometry();
  const pinch = pointers.size === 2;
  if (pinch && (before.distance < 1 || after.distance < 1)) return;
  const zoom = pinch ? camera.zoom * after.distance / before.distance : camera.zoom;
  zoomBetween(zoom, before.point, after.point);
  viewport.classList.toggle('is-dragging', !pinch && camera.zoom > 1);
});
for (const eventName of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  viewport.addEventListener(eventName, (event) => {
    if (pointers.delete(event.pointerId)) viewport.classList.remove('is-dragging');
  });
}



byId('zoom-in').onclick = () => zoomBy(.25);
byId('zoom-out').onclick = () => zoomBy(-.25);
byId('view-reset').onclick = resetView;
viewport.addEventListener('keydown', (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const directions = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const direction = directions[event.key];
  if (direction && camera.zoom > 1) {
    event.preventDefault();
    setCamera(camera.x + direction[0] * 28 / camera.zoom, camera.y + direction[1] * 28 / camera.zoom, camera.zoom);
  } else if (event.key === '+' || event.key === '=' || event.key === '-') {
    event.preventDefault();
    zoomBy(event.key === '-' ? -.25 : .25);
  } else if (event.key === '0') {
    event.preventDefault();
    resetView();
  }
});
setCamera(0, 0, 1);

const motion = matchMedia('(prefers-reduced-motion: reduce)');
const storageKey = 'collections-lab:v1:step';
const cellCount = 8;
const firstAddress = 100;

// A program is a list of lines. A line reads some cells (`reads`, by cell name), then writes cells:
// `writes(v)` returns { cellName: value }. `show` is what the CPU displays. `ask` is a prediction.
const line = (code, reads, writes, show, ask = null) => ({ code, reads, writes, show, ask });
const lesson = [
  {
    label: '리스트 만들기',
    readingMemory: [["점수[0]", 70], ["점수[1]", 85], ["점수[2]", 90], ["둘째", 85]],
    example: ["점수 = [70, 85, 90]", "인덱스 1 읽기", "두 번째 값 85"],
    title: '리스트는 값을 이웃한 칸에 차례로 담는다',

const step = () => lesson[state.index];
const state = { index: 0, playing: !motion.matches, userPaused: false, wait: 0, pc: 0, busy: false,
  cells: Array(cellCount).fill(null), names: Array(cellCount).fill(null), wrong: '', solvedText: '' };
const progress = lesson.map(() => 0);
const asksOf = (s) => s.program.filter((l) => l.ask);

const project = (x, y, z = 0) => [14 * (x + y), 7 * (x - y) - z];
const point = (x, y, z) => project(x, y, z).map((value) => +value.toFixed(2)).join(',');
const mix = (a, b, t) => a + (b - a) * t;
const gridLines = [];
for (let i = -22; i <= 22; i += 2) {
  gridLines.push(`M${point(i, -22, 0)}L${point(i, 22, 0)}M${point(-22, i, 0)}L${point(22, i, 0)}`);
}
byId('grid').setAttribute('d', gridLines.join(''));


function drawFaces(node, h, H, fills) {
  const faces = {
    left: [[-h, -h, 0], [h, -h, 0], [h, -h, H], [-h, -h, H]],
    right: [[h, -h, 0], [h, h, 0], [h, h, H], [h, -h, H]],
    top: [[-h, -h, H], [h, -h, H], [h, h, H], [-h, h, H]],
  };
  for (const [name, corners] of Object.entries(faces)) {
    const attrs = { class: 'face ' + name, points: corners.map((p) => point(...p)).join(' ') };
    if (fills) Object.assign(attrs, { fill: fills[name], stroke: fills.stroke });
    svg('polygon', attrs, node);
  }
  svg('path', { class: 'highlight', d: `M${point(-h, -h, H)}L${point(h, -h, H)}L${point(h, h, H)}` }, node);
}

// Plates are small labels whose box is sized to the text.
let plates = [];
function addPlate(node, className, x, y, text, { pad = 1.5, round = true } = {}) {
  const group = svg('g', { class: className }, node);
  const plate = { group, rect: svg('rect', {}, group), label: svg('text', {}, group), x, y, pad, round };
  plate.label.textContent = text;
  plates.push(plate);
  sizePlate(plate);
  return plate;
}
matchMedia('(max-width: 600px)').addEventListener('change', () => plates.forEach(sizePlate));

// ---------- Memory cells in a row, the CPU at the end of the row ----------
// Same arrangement as lesson 0.1: the row lies on the floor diagonal and V-shaped wires join each cell to the CPU.
const spacing = 1.8;
const cpuGap = 3.8;
const cellHalf = .82, cellHeight = 14;
const start = -((cellCount - 1) * spacing + cpuGap) / 2 + 1.2;
const cellAt = (k) => start + spacing * k;
const cpuAt = start + spacing * (cellCount - 1) + cpuGap;
const laneHeight = 3;
const cells = [];
let cpu;
function buildScene() {
  for (let k = 0; k < cellCount; k++) {
    const c = cellAt(k);
    const d = 'M' + [[c, c], [cpuAt, c], [cpuAt, cpuAt]].map(([x, y]) => project(x, y, laneHeight).join(' ')).join('L');
    svg('path', { class: 'casing', d }, byId('casings'));
    const wire = svg('path', { class: 'bus', d }, byId('links'));
    const node = svg('g', { class: 'node cell empty', transform: `translate(${28 * c} 0)` }, byId('nodes'));
    drawShadow(node, cellHalf);
    drawFaces(node, cellHalf, cellHeight);
    const value = svg('text', { class: 'cell-value', x: 0, y: -cellHeight + .5 }, node);
    const [ax, ay] = project(cellHalf, -cellHalf, 0);
    const address = svg('text', { class: 'address', x: ax - 6, y: ay + 13 }, node);
    address.textContent = `${firstAddress + k}번지`;
    // Alternate name tags between two heights so long names do not overlap.
    const name = addPlate(node, 'tag name', 0, -cellHeight - 14 * cellHalf - 14 - (k % 2) * 20, '');
    cells.push({ node, value, name, wire });
  }
  const node = svg('g', { class: 'node cpu', transform: `translate(${28 * cpuAt} 0)` }, byId('nodes'));
  const h = 1.6, H = 9;
  drawShadow(node, h);
  drawFaces(node, h, H, { top: '#5d6f69', left: '#3f4f4a', right: '#2f3d39', stroke: '#26322e' });
  for (let k = 1; k < 7; k++) {
    const t = -h + k * 2 * h / 7;
    svg('path', { d: `M${point(t, -h, 2)}L${point(t, -h - .45, 0)}`, stroke: '#b8a25f', 'stroke-width': 1.3, 'stroke-linecap': 'round' }, node);
    svg('path', { d: `M${point(h, t, 2)}L${point(h + .45, t, 0)}`, stroke: '#9a8749', 'stroke-width': 1.3, 'stroke-linecap': 'round' }, node);
  }
  const mark = [[-.7, -.7, H], [.7, -.7, H], [.7, .7, H], [-.7, .7, H]];
  svg('polygon', { points: mark.map((p) => point(...p)).join(' '), fill: '#c9b46b', opacity: .85 }, node);
  const [cx, cy] = project(h, -h, 0);
  addPlate(node, 'tag', cx, cy + 16, 'CPU');
  const work = addPlate(node, 'total', 0, -H - 14 * h - 18, '대기', { pad: 1.1, round: false });
  cpu = { node, work };
}

// ---------- Packets: reads travel cell → CPU, writes travel CPU → cell ----------
let packets = [];
function sendPacket(k, kind, label, delay = 0) {
  if (motion.matches) return;
  const group = svg('g', { class: `packet-group ${kind}` }, byId('packets'));
  svg('circle', { class: 'packet-halo', r: 9 }, group);
  svg('circle', { class: 'packet', r: 4.6 }, group);
  svg('text', { class: 'packet-label', y: -10 }, group).textContent = label;
  group.setAttribute('visibility', 'hidden');
  packets.push({ group, wire: cells[k].wire, reverse: kind === 'write', start: performance.now() + delay, duration: 760 });
  kick();
}
function movePackets(now) {
  packets = packets.filter((packet) => {
    const t = (now - packet.start) / packet.duration;
    if (t >= 1) { packet.group.remove(); return false; }
    if (t < 0) return true;
    const total = packet.wire.getTotalLength();
    const along = mix(16, total - 22, packet.reverse ? 1 - t : t);
    const at = packet.wire.getPointAtLength(along);
    packet.group.setAttribute('visibility', 'visible');
    packet.group.setAttribute('transform', `translate(${at.x} ${at.y})`);
    return true;
  });
}

// ---------- Running a line ----------
const valuesByName = () => Object.fromEntries(state.names.map((name, k) => [name, state.cells[k]]).filter(([name]) => name));
function cellOf(name) {
  const k = state.names.indexOf(name);
  return k >= 0 ? k : state.names.indexOf(null);
}
function runLine(done) {
  const l = step().program[state.pc];
  if (!l) return;
  const before = valuesByName();
  const stagger = 300;
  const readMs = l.reads.length && !motion.matches ? 820 + stagger * (l.reads.length - 1) : 0;
  state.busy = true;
  l.reads.forEach((name, i) => sendPacket(state.names.indexOf(name), 'read', String(before[name]), i * stagger));
  setPlate(cpu.work, l.reads.length ? '읽는 중' : '대기');
  later(readMs, () => {
    const writes = Object.entries(l.writes(before));
    setPlate(cpu.work, l.show(before));
    // A new name gets the next free cell; reserve each one before looking up the next.
    const targets = writes.map(([name]) => {
      const k = cellOf(name);
      state.names[k] = name;
      return k;
    });
    writes.forEach(([, value], i) => sendPacket(targets[i], 'write', String(value), i * 160));
    later(motion.matches ? 0 : 780 + 160 * (writes.length - 1), () => {
      writes.forEach(([name, value], i) => { state.names[targets[i]] = name; state.cells[targets[i]] = value; });
      state.pc++;
      state.busy = false;
      paint(targets[targets.length - 1]);
      done?.();
    });
  });
  paintCode();
}
// Timers that a step change or reset cancels.
let timers = [];
function later(ms, fn) {
  if (ms === 0) { fn(); return; }
  timers.push(setTimeout(fn, ms));
}
function cancelTimers() {
  timers.forEach(clearTimeout);
  timers = [];
  packets.forEach((packet) => packet.group.remove());
  packets = [];
  state.busy = false;
}
function setPlate(plate, text) {
  plate.label.textContent = text;
  sizePlate(plate);
}

// ---------- Drawing ----------
function paint(changed = -1) {
  const preview = document.querySelector(motion.matches ? '.workspace.course-reading' : '.workspace.course-reading.course-step-preview') ? step().readingMemory : null;
  cells.forEach((cell, k) => {
    const name = preview ? preview[k]?.[0] : state.names[k];
    cell.node.setAttribute('class', `node cell ${name ? 'used' : 'empty'}${k === changed ? ' changed' : ''}`);
    cell.value.textContent = name ? String(preview ? preview[k][1] : state.cells[k]) : '–';
    setPlate(cell.name, name ?? '');
    cell.name.group.style.opacity = name ? 1 : 0;
    cell.wire.classList.toggle('active', Boolean(name));
  });
  if (changed >= 0) {
    const node = cells[changed].node;
    node.classList.remove('changed');
    node.getBBox();
    node.classList.add('changed');
  }
  paintCode();
  syncTask();
  byId('readout').replaceChildren(...readout());
}
function paintCode() {
  const program = step().program;
  [...byId('code').children].forEach((li, i) => {
    li.classList.toggle('done', i < state.pc);
    li.classList.toggle('current', i === state.pc);
    li.setAttribute('aria-current', i === state.pc ? 'step' : 'false');
  });
  const finished = state.pc >= program.length;
  // While the demo plays the button stays enabled, so a click can take over from it.
  byId('run-line').disabled = !state.playing && (finished || state.busy || Boolean(program[state.pc]?.ask && !answered(state.pc)));
  byId('run-line').textContent = finished ? '끝까지 실행했습니다' : '한 줄 실행';
}
function readout() {
  const strong = (text, className) => {
    const element = document.createElement('b');
    if (className) element.className = className;
    element.textContent = text;
    return element;
  };
  const used = state.names.map((name, k) => [name, k]).filter(([name]) => name);
  if (!used.length) return ['메모리가 비어 있습니다.'];
  const parts = ['메모리 '];
  used.forEach(([name, k], i) => {
    if (i) parts.push(' · ');
    parts.push(`${firstAddress + k}번지 `, strong(`${name} = ${state.cells[k]}`, i === used.length - 1 ? 'total' : ''));
  });
  return parts;
}

// ---------- Code panel and predictions ----------
function buildCode() {
  const list = byId('code');
  list.replaceChildren();
  step().program.forEach((l) => {
    const li = document.createElement('li');
    const code = document.createElement('code');
    code.textContent = l.code;
    li.append(code);
    list.append(li);
  });
}
const answeredLines = lesson.map(() => new Set());
const answered = (i) => answeredLines[state.index].has(i);
function syncTask() {
  const program = step().program;
  const l = program[state.pc];
  const choices = byId('try-choices');
  choices.replaceChildren();
  const allDone = progress[state.index] >= asksOf(step()).length;
  if (l?.ask && !answered(state.pc) && !state.playing && !state.busy) {
    // The next line needs a prediction. The last result, if any, stays visible underneath.
    byId('try').classList.remove('solved');
    byId('try-text').textContent = `${state.pc + 1}번째 줄 "${l.code}" · ${l.ask.q}`;
    byId('try-result').textContent = state.wrong || state.solvedText;
    for (const choice of l.ask.choices) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'action choice-button';
      button.textContent = choice;
      button.addEventListener('click', () => answer(choice));
      choices.append(button);
    }
  } else if (state.solvedText) {
    byId('try').classList.add('solved');
    byId('try-text').textContent = state.solvedText;
    byId('try-result').textContent = '';
  } else {
    byId('try').classList.remove('solved');
    byId('try-result').textContent = '';
    byId('try-text').textContent = state.pc >= program.length
      ? (allDone ? '이 단계의 예측을 모두 맞혔습니다. 처음부터 다시 실행해 볼 수도 있습니다.' : '처음부터를 눌러 다시 해 보세요.')
      : '"한 줄 실행"을 눌러 다음 줄을 실행해 보세요. 예측 문제가 있는 줄에서는 먼저 답을 고릅니다.';
  }
}
function answer(choice) {
  const l = step().program[state.pc];
  if (choice !== l.ask.answer) {
    state.wrong = `✗ ${choice}이(가) 아닙니다. 다시 골라 보세요.`;
    byId('announcement').textContent = state.wrong;
    syncTask();
    return;
  }
  state.wrong = '';
  answeredLines[state.index].add(state.pc);
  progress[state.index] = answeredLines[state.index].size;
  state.solvedText = `✓ 맞았습니다. ${l.ask.why}`;
  byId('announcement').textContent = state.solvedText;
  runLine(() => syncTask());
  syncTask();
}

function takeOver() {
  if (!state.playing) return;
  state.playing = false;
  resetProgram();
  syncPlayback();
}
function resetProgram() {
  cancelTimers();
  state.pc = 0;
  state.cells = Array(cellCount).fill(null);
  state.names = Array(cellCount).fill(null);
  state.wrong = '';
  state.solvedText = '';
  setPlate(cpu.work, '대기');
  paint();
}
byId('run-line').onclick = () => {
  takeOver();
  if (state.busy) return;
  state.solvedText = '';
  runLine(() => syncTask());
  syncTask();
  byId('announcement').textContent = `${state.pc + 1}번째 줄 실행: ${step().program[state.pc]?.code ?? ''}`;
};
byId('restart').onclick = () => {
  state.playing = false;
  resetProgram();
  syncPlayback();
  byId('announcement').textContent = '처음부터 다시 시작합니다.';
};

// ---------- Demo playback ----------
let frame = null, lastFrame = null;
function demoTick() {
  document.querySelector('.course-step-preview')?.dispatchEvent(new Event('course-playback-start'));
  if (state.busy) { state.wait = 200; return; }
  if (state.pc >= step().program.length) {
    resetProgram();
    state.wait = 900;
    return;
  }
  runLine();
  state.wait = state.pc + 1 >= step().program.length ? 3600 : 2400;
}
function syncPlayback() {
  const reduced = motion.matches;
  if (reduced) state.playing = false;
  byId('status').textContent = reduced ? '모션 감소 · 직접 실행' : state.playing ? '자동 실행 중' : '직접 실행';
  byId('pause').textContent = state.playing ? '일시정지' : '자동 실행';
  byId('pause').disabled = reduced;
  byId('replay').disabled = reduced;
  if (state.playing) kick();
  syncTask();
}
function sceneTap() {}

// ---------- Steps and routing ----------
function showStep(index, announce = true) {
  state.index = index;
  if (!state.userPaused) state.playing = !motion.matches;
  const s = step();
  byId('step-title').textContent = s.title;
  byId('body').textContent = s.body;
  byId('takeaway').textContent = s.takeaway;
  byId('scene-desc').textContent = s.description;
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  stepButtons.forEach((button, i) => {
    if (i === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  try { localStorage.setItem(storageKey, String(index)); } catch {}
  buildCode();
  resetProgram();
  state.wait = 1000;
  syncPlayback();
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${s.title}`;
}
function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/collections/${index + 1}`);
  showStep(index);
}
function routeIndex() {
  const match = /^#\/collections\/(\d+)$/.exec(location.hash);
  const routed = match ? Number(match[1]) - 1 : -1;
  if (routed >= 0 && routed < lesson.length) return routed;
  try {
    const stored = localStorage.getItem(storageKey);
    const index = Number(stored);
    if (stored !== null && Number.isInteger(index) && index >= 0 && index < lesson.length) return index;
  } catch {}
  return 0;
}
const stepButtons = lesson.map(({ label }, index) => {
  const listItem = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  const number = document.createElement('span');
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.addEventListener('click', () => goToStep(index));
  listItem.append(button);
  byId('steps').append(listItem);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
byId('pause').onclick = () => {
  state.playing = !state.playing;
  state.userPaused = !state.playing;
  if (state.playing) { resetProgram(); state.wait = 400; }
  syncPlayback();
  byId('announcement').textContent = byId('status').textContent;
};
byId('replay').onclick = () => {
  state.playing = true;
  state.userPaused = false;
  resetProgram();
  state.wait = 400;
  syncPlayback();
  byId('announcement').textContent = '처음부터 자동 실행';
};
window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
motion.addEventListener('change', () => {
  if (!motion.matches && !state.userPaused) state.playing = true;
  syncPlayback();
});
window.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});

buildScene();
byId('world').setAttribute('transform', 'translate(268 160) scale(.94)');
const initial = routeIndex();
history.replaceState(null, '', `#/collections/${initial + 1}`);
state.index = initial;
showStep(initial, false);
</script>
