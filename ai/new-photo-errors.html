<script>
const lesson = [
  {
    label: '새 사진 준비', title: '기준을 고른 예시와 처음 보는 사진을 나눕니다',
    body: '앞에서는 앱이 예시를 보고 기준을 고르는 과정을 봤습니다. 이번 앱에는 사진을 고르는 기준이 이미 있습니다. 검토하는 동안 그 기준을 고정해 두고 처음 보는 사진 1–6을 줍니다.',
    takeaway: '왼쪽의 A–D는 이미 기준을 고르는 데 썼습니다. 오른쪽의 1–6으로 그 기준이 새 사진에서도 맞는지 살펴봅니다.',
    description: '왼쪽에 기준 고르기에 쓴 정답 있는 예시 A부터 D가 있습니다. 사진 1부터 6은 오른쪽에 따로 있고, 이미 고른 기준을 이 새 사진의 제안에 사용합니다.',
    example: ['정답이 있는 예시 A–D', '기준을 고름', '처음 보는 사진 1–6'],
    practiceDescription: '왼쪽 A–D는 기준을 고를 때 이미 사용했습니다. 오른쪽 7–12는 프로그램이 아직 보지 않았습니다.',
    quiz: ['기준을 고른 뒤 처음 보는 사진에서 앱이 잘 맞히는지 확인하려면 어느 묶음을 줄까요?', '새 사진 7–12', '예시 A–D', '7–12는 아직 기준을 고르는 데 사용한 적이 없습니다.'],
  },
  {
    label: '앱이 고른 사진', title: '앱이 먼저 후보를 고릅니다',
    body: '앱이 같은 기준으로 1–6을 살펴보고 1번, 2번, 5번을 제안합니다. 사람은 아직 어느 사진도 열어 확인하지 않았습니다.',
    takeaway: '위쪽 제안 줄은 채워졌습니다. 아래쪽 실제 줄은 모두 확인 전입니다.',
    description: '사진 1, 2, 5에는 제안 표시가 있고 3, 4, 6은 제안에서 빠졌습니다. 사람이 확인할 실제 줄은 모두 확인 전입니다.',
    example: ['새 사진 1–6', '앱이 고양이 후보를 제안', '1·2·5 제안 · 실제 미확인'],
    practiceDescription: '이번 새 묶음의 7과 8은 제안, 9부터 12는 제외라고 표시됩니다. 실제는 모두 확인 전입니다.',
    quiz: ['이번에 앱이 제안한 번호는 어느 쪽일까요?', '7번과 8번', '9번과 10번', '7번과 8번의 위쪽 칸에 제안이 표시되어 있습니다.'],
  },
  {
    label: '제안한 사진 확인', title: '제안만 살펴봐도 잘못 고른 사진을 발견합니다',
    body: '사람이 앱의 제안에 나온 1번, 2번, 5번만 엽니다. 2번에 보인 고양이 얼굴은 받침에 놓인 장난감이었습니다. 아직 나머지 사진은 열어 보지 않았습니다.',
    takeaway: '2번 아래에 받침과 장난감이 보입니다. 3·4·6은 여전히 확인 전입니다.',
    description: '제안된 1번, 2번, 5번을 사람이 열었습니다. 1번과 5번은 고양이, 2번은 받침 달린 장난감이므로 잘못 골랐습니다. 3번, 4번, 6번은 확인 전입니다.',
    example: ['제안한 사진 1·2·5', '사람이 제안 목록만 확인', '2번 장난감을 잘못 고름'],
    practiceDescription: '이번에 사람이 제안된 7과 8을 확인합니다. 7은 고양이이고 8은 받침에 놓인 장난감입니다. 9부터 12는 확인 전입니다.',
    quiz: ['고양이 사진으로 잘못 고른 것은 어느 번호일까요?', '8번', '7번', '8번을 열어 보니 고양이 모양 장난감이었습니다.'],
  },
  {
    label: '빠진 사진 확인', title: '제안에서 빠진 사진을 열면 놓친 고양이도 찾습니다',
    body: '제안에 없던 3번, 4번, 6번까지 모두 엽니다. 3번에는 상자 뒤 고양이가 있었습니다. 2번은 잘못 골랐고, 3번은 고양이인데 놓쳤습니다.',
    takeaway: '2번과 3번은 어긋나는 방향이 다릅니다. 각각의 제안 줄과 실제 줄을 위아래로 비교하세요.',
    description: '제안에서 빠졌던 3은 고양이, 4는 나무, 6은 개로 확인됐습니다. 2는 골랐는데 장난감이어서 잘못 고른 경우입니다. 3은 고르지 않았는데 고양이여서 놓친 경우입니다.',
    example: ['제안에 없던 사진 3·4·6', '사람이 나머지도 확인', '3번 고양이를 놓침'],
    practiceDescription: '이번 묶음에서 9, 10, 11에는 고양이가 있고 12에는 개가 있습니다. 네 장은 모두 앱이 제안하지 않았습니다.',
    quiz: ['앱이 놓친 고양이 사진 세 장은 무엇일까요?', '9·10·11번', '8·9·10번', '9, 10, 11번은 실제 고양이인데 앱 제안에서 빠졌습니다.'],
  },
  {
    label: '두 오류 세기', title: '놓친 사진과 잘못 고른 사진을 따로 셉니다',
    body: '윗줄은 실제 고양이 사진을 펼칩니다. 아랫줄은 앱이 제안한 사진을 펼칩니다. 각각에서 무엇이 어긋났는지 셉니다.',
    takeaway: '실제 고양이 3장 중 2장을 찾았습니다. 앱이 제안한 3장 중 1장은 장난감이었습니다.',
    description: '실제 고양이 묶음은 1, 3, 5의 세 장입니다. 그중 두 장을 찾고 3을 놓쳤습니다. 앱 제안 묶음은 1, 2, 5의 세 장입니다. 고양이 두 장이 들어 있고 2는 장난감입니다.',
    example: ['실제 고양이 묶음과 앱 제안 묶음', '각 묶음에서 어긋난 사진을 셈', '고양이 1장 놓침 · 장난감 1장 잘못 고름'],
    practiceDescription: '새 묶음에는 실제 고양이 7, 9, 10, 11 네 장이 있습니다. 앱 제안은 7과 8 두 장입니다. 8은 장난감입니다.',
    quiz: ['두 줄에서 전체 수를 읽으면 실제 고양이와 앱 제안은 각각 몇 장일까요?', '실제 4장 · 제안 2장', '실제 2장 · 제안 4장', '위쪽 실제 고양이 줄은 7·9·10·11 네 장, 아래쪽 제안 줄은 7과 8 두 장입니다.'],
  },
].map((step, index) => ({...step, readingDiagram: {
  figure: `check-photo-${index}`, staticOnly: true, title: step.label, description: step.description,
}}));

const slug = 'new-photo-errors';
const byId = id => document.getElementById(id);
const state = {index: -1, answers: new Map()};
const feedbackMessages = ['✓ 맞았습니다.', '✗ 다시 생각해 보세요.'];
const scene = byId('scene');
const workspace = scene.closest('.workspace');

const positions = [124, 201, 278, 355, 432, 509];
const gallery = [[1,'slate',true], [2,'toy',true], [3,'hidden',false], [4,'tree',false], [5,'gold',true], [6,'dog',false]];
const otherGallery = [[7,'cream',true], [8,'plush',true], [9,'hidden',false], [10,'slate',false], [11,'gold',false], [12,'dog',false]];
const art = {
  slate: ['#dbe7ed', '#8293a0', '고양이'], toy: ['#e9e1f1', '#d9a277', '장난감'], hidden: ['#e9e3d6', '#d49e64', '고양이'],
  tree: ['#dbecee', '#648a64', '나무'], gold: ['#e7ead7', '#e7b969', '고양이'], dog: ['#e4e4ef', '#b98660', '개'],
  cream: ['#ede8d7', '#e4c89b', '고양이'], plush: ['#e1e8f2', '#a77baf', '장난감'],
  trainingAmber: ['#f9edd3','#db9d62','고양이'], trainingFolded: ['#e1ecf5','#8293a7','고양이'],
  trainingPointed: ['#dcf0e5','#ca9c64','장난감'], trainingRound: ['#f0e5ec','#bd9dbb','장난감'],
};
const isCat = kind => art[kind][2] === '고양이';

function text(group, x, y, value, style = '') {
  svg('text', {x, y, class: 'check-text ' + style, 'text-anchor': 'middle'}, group).textContent = value;
}

function box(group, x, y, width, height, tone = '') {
  svg('rect', {x, y, width, height, rx: 6, class: 'check-box ' + tone}, group);
}

function arrow(group, x, y, end) {
  svg('path', {d:`M${x} ${y}H${end - 8}`, class:'check-line'}, group);
  svg('polygon', {points:`${end - 8},${y - 5} ${end},${y} ${end - 8},${y + 5}`, class:'check-tip'}, group);
}

function photo(group, x, y, kind, opened = false, scale = 1) {
  const [background, body, content] = art[kind];
  const image = svg('g', {transform:`translate(${x} ${y}) scale(${scale})`}, group);
  svg('rect', {x:-27,y:-20,width:54,height:40,rx:5,fill:background,stroke:'#768981'}, image);
  if (kind === 'tree') {
    svg('circle', {cx:12,cy:-8,r:4,fill:'#eace82'}, image);
    svg('path', {d:'M-23 14Q-11 6 -2 13Q7 2 21 12V17H-23Z',fill:'#a2bd8c'}, image);
    svg('path', {d:'M-12 15V-2',stroke:'#70584a','stroke-width':3}, image);
    svg('path', {d:'M-24 5L-12 -14L0 5Z',fill:body}, image);
    return;
  }
  const stand = opened && content === '장난감';
  if (stand) {
    svg('ellipse', {cx:0,cy:15,rx:16,ry:3.5,fill:'#9e4c28'}, image);
    svg('path', {d:'M-3 6H3V16H-3Z',fill:'#60443a'}, image);
  }
  const face = svg('g', {transform:stand ? 'translate(0 -5) scale(.78)' : ''}, image);
  const dog = kind === 'dog';
  const rounded = ['plush','trainingFolded','trainingRound'].includes(kind);
  const shape = dog || rounded ? 'M-16 -5Q-21 -18-11 -15L-7 -10Q0 -13 7 -10L11 -15Q21 -18 16 -5Q21 13 0 14Q-21 13-16 -5Z' :
    'M-16 -2L-17 -15L-7 -10Q0 -13 7 -10L17 -15L16 -2Q20 13 0 14Q-20 13-16 -2Z';
  svg('path', {d:shape,fill:body,stroke:'#6a5141'}, face);
  if (kind === 'trainingFolded') svg('path', {d:'M-18 -10L-11 -5L-10 -10M18 -10L11 -5L10 -10',stroke:'#495971',fill:'none'}, face);
  if (dog) svg('path', {d:'M-13 -11Q-27 -12-23 6Q-18 8-15 1M13 -11Q27 -12 23 6Q18 8 15 1',fill:'#796158'}, face);
  if (kind === 'toy' || kind === 'gold') svg('path', {d:'M-5 -10L-4 -4M0 -11V-4M5 -10L4 -4',stroke:'#ae704d','stroke-width':1.7}, face);
  for (const eye of [-6,6]) svg('circle', {cx:eye,cy:0,r:1.7,fill:'#302d29'}, face);
  svg('path', {d:'M-3 5H3L0 8Z',fill:'#634737'}, face);
  if (kind === 'hidden' && !opened) svg('path', {d:'M-22 -4L4 1V17H-22Z',fill:'#aa8055',stroke:'#795636'}, image);
}

function separatePhotos(group, trial) {
  const set = trial ? otherGallery : gallery;
  box(group, 26, 63, 185, 148, 'check-examples');
  text(group, 118.5, 86, '이미 쓴 예시와 정답');
  for (const [i, [kind, name]] of [['trainingAmber','A'],['trainingFolded','B'],['trainingPointed','C'],['trainingRound','D']].entries()) {
    const x = 77 + i % 2 * 82;
    const y = 113 + Math.floor(i / 2) * 51;
    photo(group, x, y, kind, true, .78);
    text(group, x, y + 31, `${name} · ${art[kind][2]}`, 'check-small');
  }
  arrow(group, 213, 137, 237);
  box(group, 242, 105, 112, 64, 'check-logic');
  text(group, 298, 131, '예시에서 고른');
  text(group, 298, 153, '기준');
  arrow(group, 357, 137, 382);
  box(group, 387, 63, 207, 148, 'check-input');
  text(group, 490.5, 86, '확인에 쓸 새 사진');
  for (const [i, [id, kind]] of set.entries()) {
    const x = 425 + i % 3 * 65;
    const y = 113 + Math.floor(i / 3) * 51;
    photo(group, x, y, kind, false, .78);
    text(group, x, y + 31, id, 'check-small');
  }
}

function comparisons(group, set, step, trial) {
  text(group, 62, 83, '새 사진');
  text(group, 62, 136, '프로그램 제안');
  text(group, 62, 189, '사람이 확인한');
  text(group, 62, 207, '실제');
  for (const [i, [id, kind, picked]] of set.entries()) {
    const x = positions[i];
    const mid = x + 36;
    const opened = step === 3 || (step === 2 && picked);
    const cat = isCat(kind);
    const error = opened && picked !== cat;
    const wrong = error && picked;
    const miss = error && !picked;
    text(group, mid, 61, id, 'check-small');
    photo(group, mid, 91, kind, false, .87);
    box(group, x, 116, 72, 33, picked ? 'check-pick' : 'check-skip');
    text(group, mid, 138, picked ? '제안' : '제외', 'check-small');
    const resultTone = !opened ? 'check-unknown' : wrong ? 'check-wrong' : miss ? 'check-miss' : 'check-found';
    box(group, x, 157, 72, 58, resultTone);
    if (opened) {
      photo(group, mid, 176, kind, true, .67);
      text(group, mid, 207, art[kind][2], 'check-small');
    } else {
      text(group, mid, 191, '확인 전', 'check-small');
    }
    if (error && !trial) {
      text(group, mid, 236, wrong ? '× 잘못 고름' : '! 놓침', wrong ? 'check-small check-wrong-text' : 'check-small check-miss-text');
    }
  }
}

function countErrors(group, set, trial) {
  const rows = [
    ['실제 고양이', set.filter(([,kind]) => isCat(kind)), '✓ 찾음', '! 놓침'],
    ['앱이 제안한 사진', set.filter(([, ,picked]) => picked), '✓ 고양이', '× 잘못 고름'],
  ];
  for (const [row, [name, items, matchLabel, errorLabel]] of rows.entries()) {
    const y = 70 + row * 86;
    box(group, 25, y, 565, 73, row ? 'check-examples' : 'check-input');
    text(group, 91, y + 29, name, 'check-small');
    if (!trial) text(group, 91, y + 51, `전체 ${items.length}장`, 'check-small');
    for (const [i, [id, kind, picked]] of items.entries()) {
      const x = 189 + i * 96;
      const matches = row ? isCat(kind) : picked;
      photo(group, x, y + 26, kind, true, .83);
      text(group, x - 28, y + 31, id, 'check-small');
      text(group, x, y + 59, matches ? matchLabel : errorLabel,
        'check-small ' + (matches ? '' : row ? 'check-wrong-text' : 'check-miss-text'));
    }
    if (!trial) {
      const same = items.filter(([, kind, picked]) => row ? isCat(kind) : picked).length;
      const count = items.length - same;
      box(group, 470, y + 9, 109, 55, row ? 'check-wrong' : 'check-miss');
      text(group, 524.5, y + 33, row ? `${same}장 맞음` : `${same}장 찾음`, 'check-small');
      text(group, 524.5, y + 54, row ? `${count}장 잘못 고름` : `${count}장 놓침`, 'check-small');
    }
  }
}

for (const [index, step] of lesson.entries()) {
  const template = document.createElement('template');
  template.id = step.readingDiagram.figure;
  const canvas = svg('svg', {viewBox:'0 0 620 280'}, template.content);
  const figure = svg('g', {}, canvas);
  for (const trial of [false,true]) {
    const group = svg('g', {class: trial ? 'check-practice' : 'check-reading'}, figure);
    const set = trial ? otherGallery : gallery;
    if (index === 0) separatePhotos(group, trial);
    else if (index === 4) countErrors(group, set, trial);
    else comparisons(group, set, index, trial);
    if (trial) {
      const y = index === 0 || index === 4 ? 232 : 226;
      box(group, 166, y, 288, 32, 'check-unknown check-practice-result');
      text(group, 310, y + 21, '선택 대기', 'check-answer');
    }
  }
  document.body.append(template);
}

function updatePhotoCheck() {
  const practice = scene.querySelector('.check-practice');
  if (!practice || state.index < 0) return;
  const step = lesson[state.index];
  const selected = state.answers.get(state.index);
  const correct = selected === step.quiz[1];
  const status = correct ? 'correct' : selected === undefined ? 'waiting' : 'retry';
  if (practice.dataset.status !== status) {
    practice.dataset.status = status;
    practice.querySelector('.check-answer').textContent = correct ? selected : selected === undefined ? '선택 대기' : '다시 선택';
    const card = practice.querySelector('.check-practice-result');
    card.classList.toggle('check-found', correct);
    card.classList.toggle('check-wrong', status === 'retry');
    card.classList.toggle('check-unknown', status === 'waiting');
  }
  const reading = workspace.classList.contains('course-reading');
  const parts = reading ? [step.description] : [step.practiceDescription,
    correct ? step.quiz[3] : status === 'retry' ? feedbackMessages[1] : ''];
  const localized = parts.filter(Boolean).map(part => window.courseI18n?.translate(part) ?? part).join(' ');
  for (const id of ['scene-desc', 'course-diagram-desc']) {
    const node = byId(id);
    if (node && node.textContent !== localized) node.textContent = localized;
  }
}

const practiceChanges = new MutationObserver(updatePhotoCheck);
practiceChanges.observe(scene, {childList:true});
practiceChanges.observe(workspace, {attributes:true, attributeFilter:['class']});
practiceChanges.observe(byId('choices'), {childList:true, subtree:true, attributes:true, attributeFilter:['aria-pressed']});
window.addEventListener('course:lang', updatePhotoCheck);
</script>
