const EMPTY = {label: '비어 있음'};
function storageAndMemory({file, memory, cells, kinds, changed = [], hide}) {
  const figure = {
    part: 'map',
    columns: [
      {title: '저장 장치 · 파일', cells: [
        {id: 'f-os', label: '운영체제 파일'},
        {id: 'f-app', label: '사진 앱 파일'},
        {id: 'f-sea', label: '바다.jpg', sub: file}
      ]},
      {title: memory, cells: ['m-os', 'm-app', 'm-sea'].map((id, row) => ({id, ...cells[row]}))}
    ],
    links: [['f-os', 'm-os'], ['f-app', 'm-app'], ['f-sea', 'm-sea']].map(([from, to], row) => ({from, to, kind: kinds[row]})),
    changed
  };
  if (hide) figure.hide = hide;
  return figure;
}

const APP = {label: '사진 앱'};

const running = (file, photo, changed) => storageAndMemory({file, memory: '메모리 · 실행 중', cells: [OS, APP, sea(photo)],

const off = hide => storageAndMemory({file: '바다 · 별', memory: '메모리 · 꺼짐', cells: [EMPTY, EMPTY, EMPTY],
  kinds: ['faded', 'faded', 'faded'], changed: hide ? [] : ['m-os', 'm-app', 'm-sea', 'f-os→m-os', 'f-app→m-app', 'f-sea→m-sea'], hide});
const backOn = (cells, kinds, changed, hide) => storageAndMemory({file: '바다 · 별', memory: '메모리 · 다시 켬', cells, kinds,
  changed: hide ? [] : changed, hide});

const byId = id => document.getElementById(id);
const viewport = byId('scene');
const viewWidth = 620;
const viewHeight = 280;
const center = {x: viewWidth / 2, y: viewHeight / 2};
const camera = {x: 0, y: 0, zoom: 1};
const maxZoom = 2.2;
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

byId('zoom-in').onclick = () => zoomBy(.3);
byId('zoom-out').onclick = () => zoomBy(-.3);
enableCameraDrag();

viewport.addEventListener('keydown', event => {
  if (camera.zoom === 1) return;
  const direction = {ArrowLeft: [-1, 0], ArrowUp: [0, -1], ArrowRight: [1, 0], ArrowDown: [0, 1]}[event.key];
  if (!direction) return;
  event.preventDefault();
  setCamera(camera.x + direction[0] * 18, camera.y + direction[1] * 18, camera.zoom);
});

window.addEventListener('keydown', event => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === '+') zoomBy(.3);
  else if (event.key === '-') zoomBy(-.3);
  else if (event.key === '0') resetView();
  else return;
  event.preventDefault();
});
setCamera(0, 0, 1);
</script>
