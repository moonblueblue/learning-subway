.step-number{color:var(--accent);font-weight:bold;margin-inline-end:.4em}
.explanation p{color:var(--muted)}
.takeaway{background:#e9f5f3;border-inline-start:3px solid var(--accent);padding:.5rem .75rem}
.try,.readout{margin-block:.5rem}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

const slug = 'fault-inspection';
const storageKey = 'learning-subway:step:' + slug;
const byId = (id) => document.getElementById(id);
const state = {index: -1};

function showStep(index, announce = true) {
  state.index = index;
  const step = lesson[index];
  byId('step-title').textContent = step.title;
  byId('body').textContent = step.body;
  byId('takeaway').textContent = step.takeaway;
  byId('scene-desc').textContent = step.readingDiagram.description;
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  for (const [position, button] of stepButtons.entries()) {
    if (position === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  }
  try { localStorage.setItem(storageKey, String(index)); } catch {}
  document.dispatchEvent(new Event('inspection:step'));
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${step.title}`;
}

function routeIndex() {
  const match = new RegExp('^#/' + slug + '/(\\d+)$').exec(location.hash);
  const index = match ? Number(match[1]) - 1 : -1;
  if (index >= 0 && index < lesson.length) return index;
  try {
    const saved = Number(localStorage.getItem(storageKey));
    if (Number.isInteger(saved) && saved >= 0 && saved < lesson.length) return saved;
  } catch {}
  return 0;
}

function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/${slug}/${index + 1}`);
  showStep(index);
}

const stepButtons = lesson.map(({label}, index) => {
  const item = document.createElement('li');
  const button = document.createElement('button');
  const number = document.createElement('span');
  button.type = 'button';
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.onclick = () => goToStep(index);
  item.append(button);
  byId('steps').append(item);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
window.addEventListener('popstate', syncRoute);
window.addEventListener('hashchange', syncRoute);
window.addEventListener('keydown', event => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});
const initial = routeIndex();
history.replaceState(null, '', `#/${slug}/${initial + 1}`);
showStep(initial, false);
const fixed = window.inspectionFixtures;
const reference = window.faultInspection;
let lockedPolicy;
let evidence;

function downloadJson(name, contents) {
  const file = new Blob([JSON.stringify(contents, null, 2) + '\n'], {type: 'application/json'});
  const url = URL.createObjectURL(file);
  const link = document.createElement('a');
  link.href = url;
  link.download = name;
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function showEvidence(...lines) {
  const status = byId('feedback');
  status.replaceChildren();
  for (const line of lines) {
    if (status.childNodes.length) status.append(document.createElement('br'));
    status.append(document.createTextNode(line));
  }
}

function practiceButton(label, action) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'action';
  button.textContent = label;
  button.onclick = action;
  byId('choices').append(button);
}

function getPolicy() {
  if (!lockedPolicy) showEvidence('검증 단계에서 정책을 먼저 고정하세요.');
  return lockedPolicy;
}

function showRunSummary() {
  showEvidence('미탐·오탐 비용', `80°C: ${evidence.baseline.counts.cost} · τ=${evidence.cutoff}: ${evidence.candidate.counts.cost}`,
    '센서 확인이 필요한 설비', evidence.review.map(row => row.equipment_id).join(' · '));
}

const scenarios = ['open', 'close-j', 'isolate-d'];
function showRoute(index) {
  if (!evidence) {
    showEvidence('시험 단계에서 미사용 자료를 먼저 평가하세요.');
    return;
  }
  const result = evidence.routes.find(row => row.scenario === scenarios[index]);
  showEvidence(...result.inspections.map(({equipment_id: unit, path, minutes, status}) =>
    path ? `${unit}: ${path.join(' → ')} · ${minutes} min` : `${unit}: ${status} → inspection-lead`));
}

const problems = [
  '개발 자료와 참조 코드를 받고 입력 시각을 확인하세요.',
  '학습행에서 조합별 빈도를 계산해 보세요.',
  '2월 비용이 가장 낮은 임계값을 선택하세요.',
  '정책을 고정한 뒤 3월 시험 자료를 여세요.',
  '공장 지도를 받고 열린 통로의 경로를 확인하세요.',
  'J-D를 닫고 같은 두 설비에 경로를 다시 구하세요.',
  'J-D와 K-D를 닫고 D 도달 여부를 확인하세요.',
  '세 경로 상태와 시험 비용을 보고서 파일에 기록하세요.'
];

function renderProject() {
  const {index} = state;
  byId('choices').replaceChildren();
  byId('prompt').textContent = problems[index];
  showEvidence();
  switch (index) {
    case 0: {
      practiceButton('개발 자료 받기', () => downloadJson('development.json', fixed.development));
      const link = document.createElement('a');
      link.className = 'action';
      link.href = './fault-inspection/reference.js';
      link.download = 'reference.js';
      link.textContent = '참조 코드 받기';
      const instructions = document.createElement('a');
      instructions.className = 'action';
      instructions.href = './fault-inspection/instructions.md';
      instructions.download = 'instructions.md';
      instructions.textContent = '과제 안내 받기';
      byId('choices').append(link, instructions);
      break;
    }
    case 1:
      practiceButton('학습 빈도 계산', () => {
        const {frequencies} = reference.lock(fixed.development);
        showEvidence(...['00', '10', '01', '11'].map(key => {
          const {failures, total, score} = frequencies[key];
          return `${key}: (${failures}+1)/(${total}+2) = ${score.toFixed(3)}`;
        }));
      });
      break;
    case 2:
      if (lockedPolicy) {
        showEvidence('정책 고정', `τ = ${lockedPolicy.cutoff}`);
        practiceButton('정책 파일 받기', () => downloadJson('policy.json', lockedPolicy));
        break;
      }
      for (const cutoff of [0.35, 0.55, 0.75]) {
        practiceButton(String(cutoff), () => {
          const policy = reference.lock(fixed.development);
          if (policy.cutoff === cutoff) {
            lockedPolicy = policy;
            renderProject();
          } else {
            const result = policy.validation.find(row => row.cutoff === cutoff);
            showEvidence('다른 기준과 비용을 비교하세요.', `${result.fn} × 5 + ${result.fp} = ${result.cost}`);
          }
        });
      }
      break;
    case 3:
      if (getPolicy()) {
        practiceButton('시험 비용 계산', () => {
          evidence = reference.evaluate(lockedPolicy, fixed.holdout, fixed.map);
          showRunSummary();
        });
        practiceButton('시험 자료 받기', () => downloadJson('holdout.json', fixed.holdout));
        if (evidence) showRunSummary();
      }
      break;
    case 4:
    case 5:
    case 6:
      practiceButton('경로 실행', () => showRoute(index - 4));
      if (index === 4) practiceButton('지도 받기', () => downloadJson('plant-map.json', fixed.map));
      break;
    default:
      if (evidence) practiceButton('보고서 받기', () => downloadJson('report.json', evidence));
      else showEvidence('시험 단계에서 미사용 자료를 먼저 평가하세요.');
  }
}

document.addEventListener('inspection:step', renderProject);
renderProject();
