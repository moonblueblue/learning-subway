      '고장과 정상은 14:20 현장 점검 뒤에 기록됐습니다.'],

    practiceDescriptions: [
      "실습은 어제 08:00 온도 기록과 14:20 현장 점검 기록을 대조합니다. 오전에 알았던 정보를 고르세요.",
      "실습은 어제 08:00 기록과 14:20 점검 기록을 대조합니다. 오전에 있던 정보를 다시 고르세요.",
      "어제 08:00에는 두 설비의 온도만 알았습니다. 실제 상태는 14:20에 확인되었습니다.",

    label: '오늘의 후보',

    body: '오늘 08:00의 A는 83°C, B는 74°C입니다. A의 점이 어제 고장이었던 A의 높은 온도에 더 가깝습니다. 이 예에서는 A를 먼저 확인하기로 합니다.',
    takeaway: '온도는 점검 순서를 고르는 근거입니다. 오늘 실제 상태는 아직 빈칸입니다.',

    quiz: ['다른 날 A가 76°C, B가 85°C라면 같은 비교로 누구를 먼저 볼까요?', 'B 먼저 확인', 'A 먼저 확인',

    ],

  {

    title: '프로그램은 경보를 보내고 반장이 점검을 배정합니다',
    body: '알림 프로그램은 A의 경보를 점검 반장에게 보냅니다. 작업 가능 여부를 확인한 반장이 A를 먼저 살펴보도록 배정합니다. 이때 실제 고장 여부는 두 설비 모두 확인 전입니다.',

    quiz: ['경보를 받고 작업 가능 여부를 확인한 뒤 점검을 배정하는 쪽은 어디일까요?', '점검 반장', '알림 프로그램',
      '프로그램이 경보를 보내면 반장이 작업 조건을 확인하고 사람에게 점검을 맡깁니다.'],
    practice: ['A 경보 도착', '반장이 A 점검 배정', '경보와 작업을 구분'],
    practiceDescriptions: [
      "실습에 A 경보가 도착했습니다. 경보 프로그램과 점검 반장의 역할을 보고 점검을 배정하는 쪽을 고르세요.",
      "실습에 A 경보가 도착했습니다. 프로그램이 알림을 전하는 일과 점검을 배정하는 일을 다시 구분하세요.",

    example: ['08:00에 A 경보', '14:20 현장 점검', 'A 고장 · B 정상'],
    readingDiagram: {figure: 'inspection-outcome', staticOnly: true, title: '점검 뒤 확인',
      description: '08:00 A 경보와 B 대기에서 각각 A와 B의 현장 점검을 거친 뒤, 14:20에 A 고장과 B 정상으로 이어집니다.'},
    quiz: ['다른 날 A에 경보가 났지만 현장 점검에서 정상이라면 무엇을 기록할까요?', 'A 정상 확인', 'A 고장 확인',
      '경보 기록을 남기고 실제 상태 칸에는 현장에서 확인한 정상을 적습니다.'],
    practice: ['A 경보 · 점검 뒤 정상', 'A 정상 확인', '현장 결과를 기록'],

      "다른 날에도 A에 경보가 났지만 14:20 현장 점검에서는 정상이었습니다. A의 실제 상태 칸에 기록할 결과를 고르세요.",
      "다른 날 A에 경보가 났지만 14:20 현장 점검에서는 정상이었습니다. 실제 상태 칸에 남길 결과를 다시 고르세요.",
      "다른 날 A에 경보가 난 기록은 남아 있습니다. 14:20 점검에서 확인한 A 정상도 실제 상태 칸에 기록됐습니다.",
    ],

const slug = 'decision-owner';
const byId = id => document.getElementById(id);
const state = {index: -1, answers: new Map()};
const feedbackMessages = ['✓ 맞았습니다.', '✗ 다시 생각해 보세요.'];
const inspectionWorkspace = byId('scene').closest('.workspace');

function inspectionText(group, x, y, value, className = 'inspection-label', anchor = 'start') {
  svg('text', {x, y, class: className, 'text-anchor': anchor}, group).textContent = value;
}

function inspectionCard(group, x, y, width, label, tone = '') {
  svg('rect', {x, y, width, height: 30, rx: 6, class: 'inspection-card ' + tone}, group);
  if (label) inspectionText(group, x + width / 2, y + 20, label, 'inspection-label', 'middle');
}

function buildInspectionFigure(step, index) {
  const template = document.createElement('template');
  template.id = step.readingDiagram.figure;
  const canvas = svg('svg', {viewBox: '0 0 620 280'}, template.content);
  const group = svg('g', {class: 'inspection-diagram'}, canvas);
  const old = index === 0;
  const final = index === 3;
  const confirmed = old || final;
  const readings = old ? [86, 68] : [83, 74];
  const position = value => 86 + (value - 60) * 6.8;
  const ticks = [60, 70, 80, 90];

  const practiceDate = index === 1 || final;
  inspectionText(group, 24, 62, old ? '어제 08:00' : '오늘 08:00',
    practiceDate ? 'inspection-column inspection-base' : 'inspection-column');
  if (practiceDate) inspectionText(group, 24, 62, '다른 날 08:00', 'inspection-column inspection-alt');
  if (final) {
    inspectionText(group, 321, 62, '08:00 기록', 'inspection-column');
    inspectionText(group, 429, 62, '현장 확인', 'inspection-column');
    inspectionText(group, 513, 62, '14:20 확인', 'inspection-column');
  } else {
    inspectionText(group, 329, 62, old ? '현장 점검' : '08:00 점검 순서', 'inspection-column');
    inspectionText(group, 462, 62, old ? '14:20 점검 뒤' : '실제 상태 · 확인 전', 'inspection-column');
  }
  if (index === 1) svg('path', {d: `M${position(86)} 83V221`, class: 'inspection-reference'}, group);

  function drawReading(parent, value, y) {
    svg('circle', {cx: position(value), cy: y, r: 6, class: 'inspection-current'}, parent);
    inspectionText(parent, position(value), y + 19, `${value}°C`, 'inspection-number', 'middle');
    if (index !== 1) return;
    const start = position(value), end = position(86), lineY = y + 29;
    svg('path', {d: `M${start} ${lineY - 3}v6M${start} ${lineY}H${end}m0 -3v6`, class: 'inspection-distance'}, parent);
    inspectionText(parent, end + 7, lineY + 4, `${86 - value}°C`, 'inspection-note');
  }

  for (const [row, current] of readings.entries()) {
    const y = 110 + row * 78;
    const pump = row ? 'B' : 'A';
    inspectionText(group, 24, y + 5, '설비 ' + pump, 'inspection-column');
    svg('path', {d: `M${position(60)} ${y}H${position(90)}`, class: 'inspection-axis'}, group);
    for (const tick of ticks) svg('path', {d: `M${position(tick)} ${y - 5}v10`, class: 'inspection-axis'}, group);
    if (!old) {
      const previous = row ? 68 : 86;
      svg('circle', {cx: position(previous), cy: y - 17, r: 5, class: 'inspection-previous'}, group);
      inspectionText(group, position(previous), y - 27, row ? '어제 68°C · 정상' : '어제 86°C · 고장', 'inspection-note', 'middle');
    }
    const currentReading = index === 1 ? svg('g', {class: 'inspection-base'}, group) : group;
    drawReading(currentReading, current, y);
    if (index === 1) drawReading(svg('g', {class: 'inspection-alt'}, group), row ? 85 : 76, y);
    const outcome = final && !row ? svg('g', {class: 'inspection-base'}, group) : group;
    inspectionCard(outcome, final ? 514 : 462, y - 14, final ? 81 : 133,
      confirmed ? (row ? '✓ 정상' : '! 고장') : '', confirmed ? (row ? 'inspection-normal' : 'inspection-fault') : 'inspection-unknown');
    if (final && !row) {
      const alternate = svg('g', {class: 'inspection-alt inspection-practice-outcome'}, group);
      inspectionCard(alternate, 514, y - 14, 81, '', 'inspection-unknown');
      inspectionText(alternate, 554.5, y + 6, '', 'inspection-label', 'middle');
    }
    if (final) {
      inspectionCard(group, 320, y - 14, 92, row ? '순서 대기' : 'A 경보');
      inspectionCard(group, 427, y - 14, 72, row ? 'B 점검' : 'A 점검', 'inspection-normal');
      for (const [start, end] of [[413, 424], [500, 511]]) {
        svg('path', {d: `M${start} ${y}H${end}m-4 -4 4 4-4 4`, class: 'inspection-flow'}, group);
      }
    } else if (old) {
      inspectionText(group, 378, y + 5, '직접 확인', 'inspection-note', 'middle');
      svg('path', {d: `M439 ${y}h16m-5 -4 5 4-5 4`, class: 'inspection-flow'}, group);
    } else if (row) {
      inspectionCard(index === 1 ? svg('g', {class: 'inspection-base'}, group) : group, 329, y - 14, 120, '순서 대기');
      if (index === 1) {
        const choice = svg('g', {class: 'inspection-alt inspection-choice', visibility: 'hidden'}, group);
        svg('path', {d: `M${position(85) + 10} ${y}H320m-5 -4 5 4-5 4`, class: 'inspection-flow'}, choice);
        inspectionCard(choice, 329, y - 14, 120, 'B 먼저 확인', 'inspection-normal');
      }
    } else if (index === 1) {
      const preview = svg('g', {class: 'inspection-base'}, group);
      svg('path', {d: `M${position(current) + 10} ${y}H320m-5 -4 5 4-5 4`, class: 'inspection-flow'}, preview);
      inspectionCard(preview, 329, y - 14, 120, 'A 먼저 확인', 'inspection-normal');
    } else {
      inspectionCard(group, 329, 78, 120, '프로그램 · A 경보', 'inspection-normal');
      svg('path', {d: 'M389 108v12m-4 -4 4 4 4-4', class: 'inspection-flow'}, group);
      inspectionCard(group, 329, 122, 120, '반장 · A 배정', 'inspection-normal');
    }
  }
  for (const tick of ticks) inspectionText(group, position(tick), 235, String(tick), 'inspection-note', 'middle');
  inspectionText(group, 305, 235, '°C', 'inspection-note');

  const practiceLine = svg('g', {class: 'inspection-practice'}, group);
  inspectionCard(practiceLine, 24, 240, 190, step.practice[0]);
  svg('path', {d: 'M219 255h16m-5 -4 5 4-5 4', class: 'inspection-flow'}, practiceLine);
  inspectionCard(practiceLine, 240, 240, 207, '', 'inspection-result inspection-unknown');
  inspectionText(practiceLine, 343.5, 260, '선택 대기', 'inspection-label inspection-answer', 'middle');
  inspectionText(practiceLine, 456, 260, '', 'inspection-note inspection-evidence');
  document.body.append(template);
}

lesson.forEach(buildInspectionFigure);

function updateInspectionPractice() {
  const diagram = byId('scene').querySelector('.inspection-practice');
  if (!diagram || !lesson[state.index]) return;
  const step = lesson[state.index];
  const selected = state.answers.get(state.index);
  const status = selected === undefined ? 'waiting' : selected === step.quiz[1] ? 'correct' : 'retry';
  const reading = !document.body.classList.contains('course-shell') || inspectionWorkspace.classList.contains('course-reading');
  const description = reading ? step.readingDiagram.description : step.practiceDescriptions[['waiting','retry','correct'].indexOf(status)];
  const localizedDescription = window.courseI18n?.translate(description) ?? description;
  for (const id of ['scene-desc','course-diagram-desc']) {
    const node = byId(id);
    if (node && node.textContent !== description && node.textContent !== localizedDescription) node.textContent = description;
  }
  if (diagram.dataset.status === status) return;
  diagram.dataset.status = status;
  diagram.querySelector('.inspection-answer').textContent =
    status === 'correct' ? step.practice[1] : status === 'waiting' ? '선택 대기' : '다시 선택';
  diagram.querySelector('.inspection-evidence').textContent = status === 'correct' ? step.practice[2] : '';
  diagram.parentElement.querySelector('.inspection-choice')?.setAttribute('visibility', status === 'correct' ? 'visible' : 'hidden');
  const outcome = diagram.parentElement.querySelector('.inspection-practice-outcome');
  if (outcome) {
    const confirmed = status === 'correct';
    outcome.querySelector('text').textContent = confirmed ? '✓ 정상' : '';
    outcome.querySelector('rect').classList.toggle('inspection-normal', confirmed);
    outcome.querySelector('rect').classList.toggle('inspection-unknown', !confirmed);
  }
  const result = diagram.querySelector('.inspection-result');
  result.classList.toggle('inspection-unknown', status === 'waiting');
  result.classList.toggle('inspection-normal', status === 'correct');
  result.classList.toggle('inspection-fault', status === 'retry');
}
const inspectionUpdates = new MutationObserver(updateInspectionPractice);
inspectionUpdates.observe(byId('scene'), {childList: true});
