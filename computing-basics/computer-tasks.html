<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="../shared/device-access.js?v=1f73c765843f36b1"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="키를 눌러 글자를 띄우고 같은 수 카드에 다른 일을 맡기며 입력, 처리, 출력을 살펴보세요.">
<title>컴퓨터에 어떤 일을 맡길 수 있을까?</title>
<link rel="stylesheet" href="../shared/reading-lesson.css">
<style>
#task-drawing { text-anchor: middle; fill: var(--ink); }
#task-drawing .heading { font: 750 19px system-ui, sans-serif; }
#task-drawing .caption { font: 650 15px system-ui, sans-serif; }
#task-drawing .operation { font: 720 19px system-ui, sans-serif; }
#task-drawing .value { font: 750 30px system-ui, sans-serif; }
#task-drawing .key-label { font: 750 22px system-ui, sans-serif; }
#task-drawing .surface { fill: #f8fcf9; stroke: #819b8b; stroke-width: 1.5; }
#task-drawing .instruction { fill: #e2f1eb; stroke: #417b67; stroke-width: 1.5; }
#task-drawing .selected { fill: #c4e9d8; stroke: #116a55; stroke-width: 2.5; }
#task-drawing .screen { fill: #163b35; }
#task-drawing .screen-text { fill: #fff; }
#task-drawing .foot { fill: #163b35; }
#task-drawing .flow { stroke: #166a56; stroke-width: 2.8; marker-end: url(#task-tip); }
#task-drawing .waiting { fill: #596860; }
#scene.is-zoomed { cursor: grab; touch-action: none; }
#scene.is-dragging { cursor: grabbing; }
#task-drawing .expectation { fill: #edf5ee; stroke: #889e90; stroke-dasharray: 5 4; }
#task-drawing .comparison-rule { stroke: #a5b9ad; stroke-width: 1; }
.task-actions .action { min-height: 44px; }
</style>
<link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../shared/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="../shared/course.css?v=d9c4c7ece46ac390">
<script src="../shared/engine.js?v=18f6c6ea5ff4412f"></script>
<script defer blocking="render" src="../shared/catalog.js"></script>
<script defer blocking="render" src="./computer-tasks.en.js"></script>
<script defer blocking="render" src="../shared/i18n.js"></script>
<script defer blocking="render" src="../shared/course.js?v=42f6f4d09f421784"></script>
</head>
<body>
<main class="shell">
  <header>
    <p class="eyebrow">0장 컴퓨팅 둘러보기</p>
    <h1>컴퓨터에 어떤 일을 맡길 수 있을까?</h1>
    <p>같은 것을 주어도 맡긴 일이 달라지면 어떤 결과가 나올까요?</p>
  </header>
  <div class="workspace">
    <div>
      <section class="panel" aria-labelledby="stage-heading">
        <div class="stage-top"><h2 id="stage-heading">받은 것과 맡긴 일, 그리고 결과</h2></div>
        <div class="stage">
          <svg id="scene" viewBox="0 0 620 280" role="img" tabindex="0" aria-labelledby="scene-title scene-desc">
            <title id="scene-title">컴퓨터가 받은 것에서 결과까지</title>
            <desc id="scene-desc"></desc>
            <defs>
              <marker id="task-tip" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto">
                <path d="M 0 0 L 9 5 L 0 10 Z" fill="#166a56"/>
              </marker>
              <symbol id="task-photo" viewBox="0 0 96 56">
                <rect width="96" height="56" rx="5" fill="#bddff2"/>
                <path d="M0 36 22 16 44 37 70 14 96 36V51Q96 56 91 56H5Q0 56 0 51Z" fill="#4f875a"/>
                <circle cx="33" cy="26" r="6" fill="#f6c9a1"/>
                <path d="M24 49V42a9 9 0 1 1 18 0v7Z" fill="#a93255"/>
                <circle cx="62" cy="28" r="6" fill="#e6ad84"/>
                <path d="M53 49V44a9 9 0 1 1 18 0v5Z" fill="#275684"/>
                <rect x=".5" y=".5" width="95" height="55" rx="5" fill="none" stroke="#496058"/>
              </symbol>
            </defs>
            <g id="task-drawing" aria-hidden="true"></g>
          </svg>
        </div>
        <div class="view-controls" role="group" aria-label="장면 보기">
          <button class="action" id="zoom-out" type="button" aria-label="장면 축소">−</button>
          <output id="view-scale" aria-label="현재 배율" aria-live="off">100%</output>
          <button class="action" id="zoom-in" type="button" aria-label="장면 확대">+</button>
        </div>
        <div class="controls"></div>
        <nav class="timeline" aria-labelledby="timeline-heading">
          <div class="timeline-top"><h2 id="timeline-heading">타임라인</h2><span id="count"></span></div>
          <ol class="steps" id="steps"></ol>
        </nav>
      </section>
      <div class="hands-on">
        <p id="task-prompt" class="try"></p>
        <p id="task-status" class="readout" role="status"></p>
        <div id="choices" class="task-actions"></div>
        <button class="action primary" id="run-photo" type="button" hidden>사진에 적용</button>
      </div>
    </div>
    <section class="panel explanation" aria-labelledby="step-title">
      <h2 id="step-title"></h2>
      <p id="body"></p>
      <div class="takeaway"><strong>관찰 포인트</strong><p id="takeaway"></p></div>
      <nav class="navigation" aria-label="이전 및 다음 단계">
        <button class="action" id="prev" type="button">이전 단계</button>
        <button class="action primary" id="next" type="button">다음 단계</button>
      </nav>
    </section>
  </div>
  <div id="announcement" class="sr-only" role="status"></div>
</main>
<script>
const keyboard = {task: '누른 글자 띄우기'};
const twoCards = [2, 3];
const sum = {task: '두 수 더하기', detail: '2 + 3', result: twoCards[0] + twoCards[1]};
const larger = {task: '큰 수 고르기', detail: '2 < 3', result: Math.max(...twoCards)};
const smallerPhoto = {task: '작게 만들기', result: '작은 사진', width: 57, height: 33};
const grayPhoto = {task: '회색으로 바꾸기', result: '회색 사진', width: 96, height: 56, gray: true};
const keyPrompt = 'A나 B를 눌러 화면에 뜨는 글자를 보세요.';
const cardPrompt = '같은 2와 3을 주고 다른 일을 고르세요. 화면에 나타날 수를 먼저 생각해 보세요.';

const lesson = [
  {
    label: 'A 키',
    title: 'A 키를 누르면 화면에 A가 뜹니다',
    body: '왼쪽 키보드에서 A를 누릅니다. 컴퓨터는 누른 글자를 화면에 띄우라는 지시에 따라 오른쪽 화면에 A를 보여 줍니다.',
    takeaway: '눌린 A 키에서 가운데 지시를 거쳐 오른쪽 화면의 A까지 화살표를 따라가 보세요.',
    example: ['A 키', '누른 글자 띄우기', '화면 A'],
    kind: 'key', rows: ['A'], options: ['A', 'B'], prompt: keyPrompt,
    description: '왼쪽 키보드의 A 키에서 가운데의 누른 글자 띄우기 상자를 거쳐 오른쪽 화면의 A로 화살표가 이어집니다.'
  },
  {
    label: 'B 키',
    title: '같은 일을 맡기고 누르는 키를 바꿔 봅니다',
    body: '이번에는 B 키를 누릅니다. 누른 글자를 띄우는 일은 같지만 나오는 글자는 B로 바뀝니다.',
    takeaway: '위아래 가운데 상자는 같습니다. 눌린 키와 화면의 글자를 각각 짝지어 보세요.',
    example: ['B 키', '누른 글자 띄우기', '화면 B'],
    kind: 'key', rows: ['A', 'B'], options: ['A', 'B'], prompt: keyPrompt,
    description: '위에서는 눌린 A 키가 누른 글자 띄우기를 거쳐 화면 A가 됩니다. 아래에서는 같은 지시에 B 키를 눌러 화면 B가 됩니다.'
  },
  {
    label: '두 수 더하기',
    title: '두 수를 더하라고 맡기면 5가 나옵니다',
    body: '이번에는 컴퓨터에 2와 3을 줍니다. 두 수를 더하라고 시키면 컴퓨터가 2와 3을 더해 5를 띄웁니다.',
    takeaway: '두 카드가 가운데의 2 + 3을 거쳐 화면 5로 이어집니다.',
    example: ['수 카드 2와 3', '두 수 더하기', '화면 5'],
    kind: 'card', rows: [sum], options: [sum, larger], prompt: cardPrompt,
    description: '왼쪽의 수 카드 2와 3이 가운데 두 수 더하기 상자의 2 더하기 3을 거쳐 오른쪽 화면의 5로 이어집니다.'
  },
  {
    label: '큰 수 고르기',
    title: '수 카드를 그대로 두고 맡긴 일을 바꿉니다',
    body: '같은 2와 3을 주고, 이번에는 두 수 중 큰 수를 고르라고 합니다. 2보다 3이 커서 화면에 3이 나옵니다.',
    takeaway: '두 줄의 카드가 같습니다. 위는 더해서 5, 아래는 큰 수를 골라 3입니다.',
    example: ['수 카드 2와 3', '큰 수 고르기', '화면 3'],
    kind: 'card', rows: [sum, larger], options: [sum, larger], prompt: cardPrompt,
    description: '위아래에 같은 수 카드 2와 3이 있습니다. 위에서 더하기를 맡기면 5가 나옵니다. 아래에서 큰 수 고르기를 맡기면 2가 3보다 작아서 3이 나옵니다.'
  },
  {
    label: '세 자리의 이름',
    title: '받은 것, 하는 일, 내놓은 결과에 이름을 붙입니다',
    body: '컴퓨터가 받은 수 카드는 입력입니다. 더하거나 큰 수를 고르는 일은 처리입니다. 마지막에 화면이 보여 주는 수는 출력입니다.',
    takeaway: '왼쪽부터 카드, 지시 상자, 화면의 위에 붙은 이름을 읽어 보세요.',
    kind: 'card', rows: [sum, larger], options: [sum, larger], prompt: cardPrompt,
    example: ['입력 · 2와 3', '처리 · 두 수 더하기', '출력 · 5'],
    headings: [['입력', '받은 것'], ['처리', '하는 일'], ['출력', '내놓은 결과']],
    description: '입력은 왼쪽 수 카드 2와 3입니다. 처리는 가운데의 두 수 더하기와 큰 수 고르기입니다. 출력은 오른쪽 화면의 5와 3입니다.'
  },
  {
    label: '사진 맡기기',
    title: '사진을 바꿀 일도 사람이 정합니다',
    body: '컴퓨터 공학에서는 우리가 원하는 일을 컴퓨터가 할 수 있게 설계하고, 결과를 확인하는 법을 배웁니다. 예를 들어 사진을 보내기 전에 어떤 일을 맡기면 좋을지 정할 수 있습니다.',
    takeaway: '입력은 같은 사진입니다. 위에서는 크기가, 아래에서는 색이 바뀌었습니다. 원하는 출력에 맞는 일을 골라 보세요.',
    example: ['컬러 사진', '작게 만들기', '작은 사진'],
    kind: 'photo', rows: [smallerPhoto, grayPhoto], options: [smallerPhoto, grayPhoto],
    prompt: '친구에게 같은 색의 작은 사진을 보내려면 어떤 일을 맡길까요? 할 일을 고른 뒤 사진에 적용해 보세요.',
    headings: [['입력', '사진 주기'], ['처리', '할 일 정하기'], ['출력', '결과 확인하기']],
    description: '같은 두 사람이 그려진 컬러 사진을 받습니다. 위에서는 작게 만들어 색이 같은 작은 사진이 나옵니다. 아래에서는 회색으로 바꿔 크기가 같은 회색 사진이 나옵니다.'
  }
];

const slug = 'computer-tasks';
const byId = id => document.getElementById(id);
const workspace = document.querySelector('.workspace');
const viewport = byId('scene');
const drawing = byId('task-drawing');
const viewWidth = 620;
const viewHeight = 280;
const center = {x: viewWidth / 2, y: viewHeight / 2};
const camera = {x: 0, y: 0, zoom: 1};
const maxZoom = 2.2;
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
const state = {index: -1, selection: null, result: null};
const columns = [111, 310, 509];

function text(parent, x, y, value, className) {
  svg('text', {x, y, class: className}, parent).textContent = value;
}

function rect(parent, x, y, width, height, className, rx = 8) {
  return svg('rect', {x, y, width, height, rx, class: className}, parent);
}

function picture(parent, x, y, width, height, gray = false) {
  svg('use', {href: '#task-photo', x: x - width / 2, y: y - height / 2, width, height,
    ...(gray ? {style: 'filter: grayscale(1)'} : {})}, parent);
}

function drawInput(parent, kind, value, y) {
  if (kind === 'key') {
    rect(parent, 49, y - 32, 124, 64, 'surface', 12);
    ['A', 'B'].forEach((key, i) => {
      const selected = key === value;
      const x = 63 + i * 51;
      const top = y - 20 + (selected ? 4 : 0);
      rect(parent, x, top, 44, 40, selected ? 'selected' : 'surface', 6);
      text(parent, x + 22, top + 27, key, 'key-label');
    });
  } else if (kind === 'card') {
    twoCards.forEach((number, i) => {
      const x = 63 + i * 51;
      rect(parent, x, y - 25, 44, 50, 'surface');
      text(parent, x + 22, y + 11, number, 'value');
    });
  } else {
    picture(parent, columns[0], y, 96, 56);
  }
}

function drawOutput(parent, kind, operation, y) {
  const x = columns[2];
  if (kind === 'photo') {
    rect(parent, x - 62, y - 35, 124, 70, 'expectation');
    if (operation) picture(parent, x, y, operation.width, operation.height, operation.gray);
    else text(parent, x, y + 5, '대기 중', 'caption waiting');
    return;
  }
  rect(parent, x - 61, y - 30, 122, 57, 'screen');
  rect(parent, x - 17, y + 31, 34, 4, 'foot', 2);
  const result = operation?.result;
  text(parent, x, y + (result == null ? 5 : 9), result ?? '빈 화면', result == null ? 'caption screen-text' : 'value screen-text');
}

function drawRow(kind, option, result, y) {
  const row = svg('g', {}, drawing);
  const instruction = kind === 'key' ? keyboard : option;
  const outcome = kind === 'key' && result ? {result} : result;
  drawInput(row, kind, option, y);
  if (kind === 'key' ? option : instruction) svg('line', {x1: 180, y1: y, x2: 224, y2: y, class: 'flow'}, row);
  if (outcome) svg('line', {x1: 395, y1: y, x2: 438, y2: y, class: 'flow'}, row);
  rect(row, 231, y - 33, 158, 66, instruction ? 'instruction' : 'expectation', 11);
  const detail = instruction?.detail;
  text(row, columns[1], y + (detail ? -4 : 6), instruction?.task ?? '할 일 고르기', 'operation');
  if (detail) text(row, columns[1], y + 19, detail, 'caption');
  drawOutput(row, kind, outcome, y);
}

function describePractice(step) {
  if (step.kind === 'key') {
    return state.result === 'A'
      ? 'A 키를 눌렀습니다. 화면에 A가 표시됩니다.'
      : state.result === 'B' ? 'B 키를 눌렀습니다. 화면에 B가 표시됩니다.'
      : '키를 누르기 전입니다. 화면은 비어 있습니다.';
  }
  if (step.kind === 'card') {
    return state.result === sum
      ? '같은 수 카드 2와 3. 더해서 5가 나왔습니다.'
      : state.result === larger ? '같은 수 카드 2와 3. 더 큰 수 3을 골랐습니다.'
      : '수 카드 2와 3을 받았습니다. 할 일을 고르면 결과가 표시됩니다.';
  }
  if (state.result === smallerPhoto) return '색이 같은 작은 사진이 나왔습니다. 보내려던 사진입니다.';
  if (state.result === grayPhoto) return '크기가 같은 회색 사진이 나왔습니다. 색을 그대로 두려면 다른 일을 골라 보세요.';
  if (state.selection === smallerPhoto) return '작게 만들기를 골랐습니다. 적용하기 전에는 결과가 비어 있습니다.';
  if (state.selection === grayPhoto) return '회색으로 바꾸기를 골랐습니다. 적용하기 전에는 결과가 비어 있습니다.';
  return '컬러 사진 한 장이 준비됐습니다. 할 일을 고르고 적용하면 결과가 표시됩니다.';
}

function renderScene() {
  const step = lesson[state.index];
  const practicing = coursePracticeStarted && !workspace.classList.contains('course-reading');
  drawing.replaceChildren();
  if (step.headings) {
    step.headings.forEach(([name, meaning], i) => {
      text(drawing, columns[i], 35, name, 'heading');
      text(drawing, columns[i], 55, meaning, 'caption');
    });
  }

  const rows = practicing && step.rows.length === 2 && step.kind !== 'photo'
    ? [step.rows[0], state.selection]
    : practicing ? [state.selection] : step.rows;
  const rowHeights = rows.length === 1 ? [143] : [112, 215];
  if (rows.length === 2) svg('line', {x1: 38, y1: 164, x2: 582, y2: 164, class: 'comparison-rule'}, drawing);
  rows.forEach((option, i) => {
    const result = practicing && i === rows.length - 1 ? state.result : option;
    drawRow(step.kind, option, result, rowHeights[i]);
  });

  const description = practicing ? describePractice(step) : step.description;
  const reference = practicing && rows.length === 2
    ? (step.kind === 'key' ? '위의 예시는 A 키를 눌러 화면에 A를 띄웁니다.'
      : '위의 예시는 수 카드 2와 3을 더해 5를 얻습니다.')
    : '';
  byId('scene-desc').replaceChildren(
    ...(reference ? [document.createTextNode(reference), document.createTextNode(' ')] : []),
    document.createTextNode(description)
  );
}

function updatePractice(announce) {
  for (const [i, button] of [...byId('choices').children].entries()) {
    button.setAttribute('aria-pressed', String(lesson[state.index].options[i] === state.selection));
  }
  byId('run-photo').disabled = !state.selection;
  byId('task-status').textContent = announce ? describePractice(lesson[state.index]) : '';
  renderScene();
}

function renderPractice(step) {
  byId('task-prompt').textContent = step.prompt;
  byId('run-photo').hidden = step.kind !== 'photo';
  byId('choices').replaceChildren(...step.options.map(option => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'action';
    button.textContent = option.task ?? option;
    button.onclick = () => {
      state.selection = option;
      state.result = step.kind === 'photo' ? null : option;
      updatePractice(true);
    };
    return button;
  }));
  updatePractice(false);
}

byId('run-photo').onclick = () => {
  if (!state.selection) return;
  state.result = state.selection;
  updatePractice(true);
};

function showStep(index, announce = true) {
  state.index = index;
  state.selection = null;
  state.result = null;
  const step = lesson[index];
  byId('step-title').textContent = step.title;
  byId('body').textContent = step.body;
  byId('takeaway').textContent = step.takeaway;
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  for (const [position, button] of stepButtons.entries()) {
    if (position === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  }
  renderPractice(step);
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${step.title}`;
}

function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/${slug}/${index + 1}`);
  showStep(index);
}

const stepButtons = lesson.map(({label}, index) => {
  const item = document.createElement('li');
  const button = document.createElement('button');
  const number = document.createElement('span');
  button.type = 'button';
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.onclick = () => goToStep(index);
  item.append(button);
  byId('steps').append(item);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
byId('zoom-in').onclick = () => zoomBy(.3);
byId('zoom-out').onclick = () => zoomBy(-.3);
enableCameraDrag();

viewport.addEventListener('keydown', event => {
  if (camera.zoom === 1) return;
  const direction = {ArrowLeft: [-1, 0], ArrowUp: [0, -1], ArrowRight: [1, 0], ArrowDown: [0, 1]}[event.key];
  if (!direction) return;
  event.preventDefault();
  setCamera(camera.x + direction[0] * 18, camera.y + direction[1] * 18, camera.zoom);
});

window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
window.addEventListener('keydown', event => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  const action = {
    ArrowLeft: () => goToStep(state.index - 1),
    ArrowRight: () => goToStep(state.index + 1),
    '+': () => zoomBy(.3),
    '-': () => zoomBy(-.3),
    '0': resetView
  }[event.key];
  if (!action) return;
  event.preventDefault();
  action();
});

new MutationObserver(renderScene).observe(workspace, {attributes: true, attributeFilter: ['class']});
const initial = routeIndex();
history.replaceState(null, '', `#/${slug}/${initial + 1}`);
setCamera(0, 0, 1);
showStep(initial, false);
</script>
</body>
</html>
