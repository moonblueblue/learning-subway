<body>
<main class="shell">
  <header>
    <p class="eyebrow">1장 프로그래밍 입문 · 레슨 1.1</p>
    <h1>변수와 값</h1>
    <p class="lead">변수에 값을 넣으면 컴퓨터 안에서는 무슨 일이 생길까요? 코드를 한 줄씩 실행하며 메모리 칸을 지켜보세요.</p>
  </header>
  <div class="workspace">

        <div class="stage-top"><h2 id="stage-heading">메모리와 CPU</h2></div>
        <div class="stage">
          <svg id="scene" viewBox="0 0 620 280" role="img" tabindex="0" aria-labelledby="scene-title scene-desc">
            <title id="scene-title">코드 한 줄이 메모리 칸을 읽고 쓰는 장면</title><desc id="scene-desc"></desc>
            <defs>
              <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
              <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
              <radialGradient id="grid-fade"><stop offset=".45" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
              <mask id="grid-mask"><rect x="-460" y="-260" width="920" height="520" fill="url(#grid-fade)"/></mask>
            </defs>
            <g id="world" aria-hidden="true">
              <path id="grid" class="iso-grid" mask="url(#grid-mask)"></path>

            </g>
          </svg>

<script>
const byId = (id) => document.getElementById(id);
const viewport = byId('scene');
const viewWidth = 620;
const viewHeight = 280;
const maxZoom = 3;
const center = { x: viewWidth / 2, y: viewHeight / 2 };
const camera = { x: 0, y: 0, zoom: 1 };
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));



// Convert from screen pixels to fixed viewport coordinates, accounting for SVG letterboxing.


// A press that starts on a scene object and ends without moving counts as a tap on it.
// Track the press separately so clicking still works after a drag captures the pointer.
let tap = null;
viewport.addEventListener('pointerdown', (event) => {
  const target = event.target.closest?.('[data-hit]');
  tap = target && event.button === 0 && event.isPrimary
    ? { hit: target.dataset.hit, x: event.clientX, y: event.clientY, id: event.pointerId }
    : null;
});
viewport.addEventListener('pointerup', (event) => {
  if (tap && tap.id === event.pointerId && Math.hypot(event.clientX - tap.x, event.clientY - tap.y) < 8) {
    sceneTap(tap.hit);
  }
  tap = null;
});
viewport.addEventListener('pointercancel', () => { tap = null; });

enableCameraDrag();



byId('zoom-in').onclick = () => zoomBy(.25);
byId('zoom-out').onclick = () => zoomBy(-.25);
viewport.addEventListener('keydown', (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const directions = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const direction = directions[event.key];
  if (direction && camera.zoom > 1) {
    event.preventDefault();
    setCamera(camera.x + direction[0] * 28 / camera.zoom, camera.y + direction[1] * 28 / camera.zoom, camera.zoom);
  } else if (event.key === '+' || event.key === '=' || event.key === '-') {
    event.preventDefault();
    zoomBy(event.key === '-' ? -.25 : .25);
  } else if (event.key === '0') {
    event.preventDefault();
    resetView();
  }
});
setCamera(0, 0, 1);

const motion = matchMedia('(prefers-reduced-motion: reduce)');
const cellCount = 6;
const firstAddress = 100;

// A program is a list of lines. Each line may read variables, then writes one variable with `calc`.
// `show` is what the CPU displays while it works. `ask` is a prediction the learner answers before the line runs.
const line = (code, write, calc, reads = [], show = null, ask = null) => ({ code, write, calc, reads, show, ask });
const lesson = [
  {
    label: '변수 만들기',
    readingDiagram: {
      title: "같은 칸에 이름과 값이 붙는다",
      description: "나이 = 15 → 100번지 빈 칸에 쓰기 → 100번지 나이: 15",
      nodes: [
        ["a", 102, 142, 126, 26, ["나이 = 15"]],
        ["b", 310, 142, 126, 46, ["100번지", "빈 칸에 쓰기"]],
        ["c", 517, 142, 126, 46, ["100번지", "나이: 15"], "active"],
      ],
      edges: [
        ["a", "b", "active"],
        ["b", "c", "active"],
      ],
    },
    readingMemory: [["나이", 15]],
    // The still picture lights the routes of the line that decided this step: reads purple, writes green.
    readingRoutes: {write: ["나이"]},
    example: ["나이 = 15", "빈 칸에 이름과 값 저장", "이름 ‘나이’로 15 읽기"],
    title: '변수는 메모리 칸에 붙인 이름이다',
    body: '메모리는 번호(주소)가 붙은 칸이 줄지어 있는 곳입니다. "나이 = 15"라고 쓰면 컴퓨터는 빈 칸 하나를 골라 15를 적고, 그 칸에 "나이"라는 이름표를 붙입니다. 이름표 덕분에 우리는 100번지 같은 주소를 외우지 않고 이름으로 값을 다룰 수 있습니다.',
    takeaway: 'CPU에서 메모리 칸으로 값이 가고, 칸 위에 이름표가 붙습니다. 왼쪽부터 빈 칸을 차례로 씁니다.',
    description: '메모리 칸 여섯 개(100–105번지)와 CPU가 있습니다. 한 줄을 실행할 때마다 CPU가 값을 빈 칸에 적고 그 칸에 변수 이름표를 붙입니다.',
    program: [
      line('나이 = 15', '나이', () => 15, [], () => '15 적기'),
      line('키 = 160', '키', () => 160, [], () => '160 적기',
        { q: '"키"는 몇 번지 칸에 들어갈까요?', choices: ['100번지', '101번지', '102번지'], answer: '101번지', why: '100번지는 "나이"가 쓰고 있으니 다음 빈 칸인 101번지를 씁니다.' }),
    ],
  },
  {
    label: '값 바꾸기',
    readingDiagram: {
      title: "나이를 읽고 같은 주소에 다시 쓴다",
      description: "100번지 나이: 15 → CPU 15 + 1 = 16 → 100번지 나이: 16",
      nodes: [

const step = () => lesson[state.index];
const state = { index: 0, playing: !motion.matches, wait: 0, pc: 0, busy: false,
  cells: Array(cellCount).fill(null), names: Array(cellCount).fill(null), wrong: '', solvedText: '' };
const progress = lesson.map(() => 0);
const asksOf = (s) => s.program.filter((l) => l.ask);

const project = (x, y, z = 0) => [14 * (x + y), 7 * (x - y) - z];
const point = (x, y, z) => project(x, y, z).map((value) => +value.toFixed(2)).join(',');
const mix = (a, b, t) => a + (b - a) * t;
const gridLines = [];
for (let i = -22; i <= 22; i += 2) {
  gridLines.push(`M${point(i, -22, 0)}L${point(i, 22, 0)}M${point(-22, i, 0)}L${point(22, i, 0)}`);
}
byId('grid').setAttribute('d', gridLines.join(''));


function drawFaces(node, h, H, fills) {
  const faces = {
    left: [[-h, -h, 0], [h, -h, 0], [h, -h, H], [-h, -h, H]],
    right: [[h, -h, 0], [h, h, 0], [h, h, H], [h, -h, H]],
    top: [[-h, -h, H], [h, -h, H], [h, h, H], [-h, h, H]],
  };
  for (const [name, corners] of Object.entries(faces)) {
    const attrs = { class: 'face ' + name, points: corners.map((p) => point(...p)).join(' ') };
    if (fills) Object.assign(attrs, { fill: fills[name], stroke: fills.stroke });
    svg('polygon', attrs, node);
  }
  svg('path', { class: 'highlight', d: `M${point(-h, -h, H)}L${point(h, -h, H)}L${point(h, h, H)}` }, node);
}

// Plates are small labels whose box is sized to the text.
let plates = [];
function addPlate(node, className, x, y, text, { pad = 1.5, round = true } = {}) {
  const group = svg('g', { class: className }, node);
  const plate = { group, rect: svg('rect', {}, group), label: svg('text', {}, group), x, y, pad, round };
  plate.label.textContent = text;
  plates.push(plate);
  sizePlate(plate);
  return plate;
}

// ---------- Memory cells in a row, the CPU at the end of the row ----------
// The cells lie in a row across the screen with the CPU at the end. One shared bus runs just in front of the row:
// each cell drops straight onto it, and it rises into the CPU (visual-language.md "메모리와 CPU").
const spacing = 2.1;
const cpuGap = 3.8;
const cellHalf = .82, cellHeight = 14;
const start = -((cellCount - 1) * spacing + cpuGap) / 2 + 1.2;
const cellAt = (k) => start + spacing * k;
const cpuAt = start + spacing * (cellCount - 1) + cpuGap;
const laneHeight = 3;
const busFront = 2.1;   // how far in front of the row the shared bus runs (straight down on screen)
const writeLane = .75;   // writes run on their own lane just below the bus, shown only while lit, so a read
                         // and a write in one picture never share (and hide) a stretch of line
const cells = [];
let cpu;
function buildScene() {
  for (let k = 0; k < cellCount; k++) {
    const c = cellAt(k);
    const d = 'M' + [[c, c], [c + busFront, c - busFront], [cpuAt + busFront, cpuAt - busFront], [cpuAt, cpuAt]].map(([x, y]) => project(x, y, laneHeight).join(' ')).join('L');
    svg('path', { class: 'casing', d }, byId('casings'));
    const wire = svg('path', { class: 'bus', d }, byId('links'));
    const w = busFront + writeLane;
    const writeWire = svg('path', { class: 'bus write-lane', d: 'M' + [[c, c], [c + w, c - w], [cpuAt + w, cpuAt - w], [cpuAt, cpuAt]].map(([x, y]) => project(x, y, laneHeight).join(' ')).join('L') }, byId('links'));
    const node = svg('g', { class: 'node cell empty', transform: `translate(${28 * c} 0)` }, byId('nodes'));
    drawShadow(node, cellHalf);
    drawFaces(node, cellHalf, cellHeight);
    const value = svg('text', { class: 'cell-value', x: 0, y: -cellHeight + .5 }, node);
    // The address sits under both lanes, straight below its cell, so no wire crosses it.
    const address = svg('text', { class: 'address', x: 0, y: project(busFront + writeLane, -busFront - writeLane, 0)[1] + 14, 'text-anchor': 'middle' }, node);
    address.textContent = `${firstAddress + k}번지`;
    const name = addPlate(node, 'tag name', 0, -cellHeight - 14 * cellHalf - 14, '');
    cells.push({ node, value, name, wire, writeWire });
  }
  const node = svg('g', { class: 'node cpu', transform: `translate(${28 * cpuAt} 0)` }, byId('nodes'));
  const h = 1.6, H = 9;
  drawShadow(node, h);
  drawFaces(node, h, H, { top: '#5d6f69', left: '#3f4f4a', right: '#2f3d39', stroke: '#26322e' });
  for (let k = 1; k < 7; k++) {
    const t = -h + k * 2 * h / 7;
    svg('path', { d: `M${point(t, -h, 2)}L${point(t, -h - .45, 0)}`, stroke: '#b8a25f', 'stroke-width': 1.3, 'stroke-linecap': 'round' }, node);
    svg('path', { d: `M${point(h, t, 2)}L${point(h + .45, t, 0)}`, stroke: '#9a8749', 'stroke-width': 1.3, 'stroke-linecap': 'round' }, node);
  }
  const mark = [[-.7, -.7, H], [.7, -.7, H], [.7, .7, H], [-.7, .7, H]];
  svg('polygon', { points: mark.map((p) => point(...p)).join(' '), fill: '#c9b46b', opacity: .85 }, node);
  const [cx, cy] = project(h, -h, 0);
  addPlate(node, 'tag', cx + 30, cy + 6, 'CPU');   // right of the wires that rise into the chip
  const work = addPlate(node, 'total', 0, -H - 14 * h - 18, '대기', { pad: 1.1, round: false });
  cpu = { node, work };
}

// ---------- Packets: reads travel cell → CPU, writes travel CPU → cell ----------
let packets = [];
function sendPacket(k, kind, label, delay = 0) {
  if (motion.matches) return;
  const group = svg('g', { class: `packet-group ${kind}` }, byId('packets'));
  svg('circle', { class: 'packet-halo', r: 9 }, group);
  svg('circle', { class: 'packet', r: 4.6 }, group);
  svg('text', { class: 'packet-label', y: -10 }, group).textContent = label;
  group.setAttribute('visibility', 'hidden');
  const route = kind === 'write' ? cells[k].writeWire : cells[k].wire;
  packets.push({ group, wire: route, reverse: kind === 'write', start: performance.now() + delay, duration: 760 });
  // The route lights in the legend's colour (read purple, write green) only while its packet travels.
  setTimeout(() => { route.parentNode.append(route); route.classList.add('live', kind); }, delay);
  setTimeout(() => route.classList.remove('live', kind), delay + 760);
  kick();
}
function movePackets(now) {
  packets = packets.filter((packet) => {
    const t = (now - packet.start) / packet.duration;
    if (t >= 1) { packet.group.remove(); return false; }
    if (t < 0) return true;
    const total = packet.wire.getTotalLength();
    const along = mix(16, total - 22, packet.reverse ? 1 - t : t);
    const at = packet.wire.getPointAtLength(along);
    packet.group.setAttribute('visibility', 'visible');
    packet.group.setAttribute('transform', `translate(${at.x} ${at.y})`);
    return true;
  });
}

// ---------- Running a line ----------
const valuesByName = () => Object.fromEntries(state.names.map((name, k) => [name, state.cells[k]]).filter(([name]) => name));
function cellOf(name) {
  const k = state.names.indexOf(name);
  return k >= 0 ? k : state.names.indexOf(null);
}
function runLine(done) {
  const l = step().program[state.pc];
  if (!l) return;
  const before = valuesByName();
  const target = cellOf(l.write);
  const result = l.calc(before);
  const readMs = l.reads.length && !motion.matches ? 820 : 0;
  state.busy = true;
  l.reads.forEach((name) => sendPacket(state.names.indexOf(name), 'read', String(before[name])));
  setPlate(cpu.work, l.reads.length ? '읽는 중' : '대기');
  later(readMs, () => {
    setPlate(cpu.work, l.show ? l.show(before) : String(result));
    sendPacket(target, 'write', String(result));
    later(motion.matches ? 0 : 780, () => {
      state.names[target] = l.write;
      state.cells[target] = result;
      state.pc++;
      state.busy = false;
      paint(target);
      done?.();
    });
  });
  paintCode();
}
// Timers that a step change or reset cancels.
let timers = [];
function later(ms, fn) {
  if (ms === 0) { fn(); return; }
  timers.push(setTimeout(fn, ms));
}
function cancelTimers() {
  timers.forEach(clearTimeout);
  timers = [];
  packets.forEach((packet) => packet.group.remove());
  packets = [];
  state.busy = false;
}
function setPlate(plate, text) {
  plate.label.textContent = text;
  sizePlate(plate);
}

// ---------- Drawing ----------
function paint(changed = -1) {
  const preview = document.querySelector(motion.matches ? '.workspace.course-reading' : '.workspace.course-reading.course-step-preview') ? step().readingMemory : null;
  cells.forEach((cell, k) => {
    const name = preview ? preview[k]?.[0] : state.names[k];
    cell.node.setAttribute('class', `node cell ${name ? 'used' : 'empty'}${k === changed ? ' changed' : ''}`);
    cell.value.textContent = name ? String(preview ? preview[k][1] : state.cells[k]) : '–';
    setPlate(cell.name, name ?? '');
    cell.name.group.style.opacity = name ? 1 : 0;
    // In the still picture the routes that decided the step stay lit in the legend's colours (visual-language.md).
    const routes = preview ? step().readingRoutes : null;
    cell.wire.classList.toggle('held-read', Boolean(name && routes?.read?.includes(name)));
    cell.writeWire.classList.toggle('held-write', Boolean(name && routes?.write?.includes(name)));
  });
  // Lit routes share the bus with grey ones: draw them last, reads then writes, so no grey wire covers them.
  for (const cell of cells) if (cell.wire.classList.contains('held-read')) cell.wire.parentNode.append(cell.wire);
  for (const cell of cells) if (cell.writeWire.classList.contains('held-write')) cell.writeWire.parentNode.append(cell.writeWire);
  if (changed >= 0) {
    const node = cells[changed].node;
    node.classList.remove('changed');
    node.getBBox();
    node.classList.add('changed');
  }
  paintCode();
  syncTask();
  byId('readout').replaceChildren(...readout());
}
function paintCode() {
  const program = step().program;
  [...byId('code').children].forEach((li, i) => {
    li.classList.toggle('done', i < state.pc);
    li.classList.toggle('current', i === state.pc);
    li.setAttribute('aria-current', i === state.pc ? 'step' : 'false');
  });
  const finished = state.pc >= program.length;
  // While the demo plays the button stays enabled, so a click can take over from it.
  byId('run-line').disabled = !state.playing && (finished || state.busy || Boolean(program[state.pc]?.ask && !answered(state.pc)));
  byId('run-line').textContent = finished ? '끝까지 실행했습니다' : '한 줄 실행';
}
function readout() {
  const strong = (text, className) => {
    const element = document.createElement('b');
    if (className) element.className = className;
    element.textContent = text;
    return element;
  };
  const used = state.names.map((name, k) => [name, k]).filter(([name]) => name);
  if (!used.length) return ['메모리가 비어 있습니다.'];
  const parts = ['메모리 '];
  used.forEach(([name, k], i) => {
    if (i) parts.push(' · ');
    parts.push(`${firstAddress + k}번지 `, strong(`${name} = ${state.cells[k]}`, i === used.length - 1 ? 'total' : ''));
  });
  return parts;
}

// ---------- Code panel and predictions ----------
function buildCode() {
  const list = byId('code');
  list.replaceChildren();
  step().program.forEach((l) => {
    const li = document.createElement('li');
    const code = document.createElement('code');
    code.textContent = l.code;
    li.append(code);
    list.append(li);
  });
}
const answeredLines = lesson.map(() => new Set());
const answered = (i) => answeredLines[state.index].has(i);
function syncTask() {
  const program = step().program;
  const l = program[state.pc];
  const choices = byId('try-choices');
  choices.replaceChildren();
  const allDone = progress[state.index] >= asksOf(step()).length;
  if (l?.ask && !answered(state.pc) && !state.playing && !state.busy) {
    // The next line needs a prediction. The last result, if any, stays visible underneath.
    byId('try').classList.remove('solved');
    byId('try-text').textContent = `${state.pc + 1}번째 줄 "${l.code}" · ${l.ask.q}`;
    byId('try-result').textContent = state.wrong || state.solvedText;
    for (const choice of l.ask.choices) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'action choice-button';
      button.textContent = choice;
      button.addEventListener('click', () => answer(choice));
      choices.append(button);
    }
  } else if (state.solvedText) {
    byId('try').classList.add('solved');
    byId('try-text').textContent = state.solvedText;
    byId('try-result').textContent = '';
  } else {
    byId('try').classList.remove('solved');
    byId('try-result').textContent = '';
    byId('try-text').textContent = state.pc >= program.length
      ? (allDone ? '이 단계의 예측을 모두 맞혔습니다. 처음부터 다시 실행해 볼 수도 있습니다.' : '처음부터를 눌러 다시 해 보세요.')
      : '"한 줄 실행"을 눌러 다음 줄을 실행해 보세요. 예측 문제가 있는 줄에서는 먼저 답을 고릅니다.';
  }
}
function answer(choice) {
  const l = step().program[state.pc];
  if (choice !== l.ask.answer) {
    state.wrong = `✗ ${choice}이(가) 아닙니다. 다시 골라 보세요.`;
    byId('announcement').textContent = state.wrong;
    syncTask();
    return;
  }
  state.wrong = '';
  answeredLines[state.index].add(state.pc);
  progress[state.index] = answeredLines[state.index].size;
  state.solvedText = `✓ 맞았습니다. ${l.ask.why}`;
  byId('announcement').textContent = state.solvedText;
  runLine(() => syncTask());
  syncTask();
}

function takeOver() {
  if (!state.playing) return;
  state.playing = false;
  resetProgram();
  syncPlayback();
}
function resetProgram() {
  cancelTimers();
  state.pc = 0;
  state.cells = Array(cellCount).fill(null);
  state.names = Array(cellCount).fill(null);
  state.wrong = '';
  state.solvedText = '';
  setPlate(cpu.work, '대기');
  paint();
}
byId('run-line').onclick = () => {
  takeOver();
  if (state.busy) return;
  state.solvedText = '';
  runLine(() => syncTask());
  syncTask();
  byId('announcement').textContent = `${state.pc + 1}번째 줄 실행: ${step().program[state.pc]?.code ?? ''}`;
};
byId('restart').onclick = () => {
  state.playing = false;
  resetProgram();
  syncPlayback();
  byId('announcement').textContent = '처음부터 다시 시작합니다.';
};

// ---------- Demo playback ----------
let frame = null, lastFrame = null;
function demoTick() {
  document.querySelector('.course-step-preview')?.dispatchEvent(new Event('course-playback-start'));
  if (state.busy) { state.wait = 200; return; }
  if (state.pc >= step().program.length) {
    resetProgram();
    state.wait = 900;
    return;
  }
  runLine();
  state.wait = state.pc + 1 >= step().program.length ? 3600 : 2400;
}
function syncPlayback() {
  const reduced = motion.matches;
  if (reduced) state.playing = false;
  if (state.playing) kick();
  syncTask();
}
function sceneTap() {}

// ---------- Steps and routing ----------
function showStep(index, announce = true) {
  state.index = index;
  state.playing = lessonDemoEnabled();
  const s = step();
  byId('step-title').textContent = s.title;
  byId('body').textContent = s.body;
  byId('takeaway').textContent = s.takeaway;
  byId('scene-desc').textContent = s.description;
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  stepButtons.forEach((button, i) => {
    if (i === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  buildCode();
  resetProgram();
  state.wait = 1000;
  syncPlayback();
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${s.title}`;
}
function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/variables/${index + 1}`);
  showStep(index);
}
const stepButtons = lesson.map(({ label }, index) => {
  const listItem = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  const number = document.createElement('span');
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.addEventListener('click', () => goToStep(index));
  listItem.append(button);
  byId('steps').append(listItem);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
motion.addEventListener('change', () => {
  if (lessonDemoEnabled()) state.playing = true;
  syncPlayback();
});
window.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});

buildScene();
byId('world').setAttribute('transform', 'translate(300 152) scale(1.02)');
const initial = routeIndex();
history.replaceState(null, '', `#/variables/${initial + 1}`);
state.index = initial;
showStep(initial, false);
</script>
