const byId = id => document.getElementById(id);
const viewport = byId('scene');
const viewWidth = 620;
const viewHeight = 280;
const center = {x: viewWidth / 2, y: viewHeight / 2};
const camera = {x: 0, y: 0, zoom: 1};
const maxZoom = 2.2;
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
document.getElementById('zoom-in').onclick = () => zoomBy(.25);
document.getElementById('zoom-out').onclick = () => zoomBy(-.25);
enableCameraDrag();
viewport.addEventListener('keydown', event => {
  if (event.altKey || event.ctrlKey || event.metaKey) return;
  const pan = {ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1]}[event.key];
  if (pan && camera.zoom > 1) {
    event.preventDefault();
    setCamera(camera.x + pan[0] * 18, camera.y + pan[1] * 18, camera.zoom);
  } else if (event.key === '+' || event.key === '-' || event.key === '0') {
    event.preventDefault();
    if (event.key === '0') resetView();
    else zoomBy(event.key === '+' ? .25 : -.25);
  }
});
setCamera(0, 0, 1);
const project = (x, y, z = 0) => [14 * (x + y), 7 * (x - y) - z];
const point = (x, y, z) => project(x, y, z).map((value) => +value.toFixed(2)).join(',');
function drawFaces(node, h, H, fills) {
  const faces = {
    left: [[-h, -h, 0], [h, -h, 0], [h, -h, H], [-h, -h, H]],
    right: [[h, -h, 0], [h, h, 0], [h, h, H], [h, -h, H]],
    top: [[-h, -h, H], [h, -h, H], [h, h, H], [-h, h, H]],
  };
  for (const [name, corners] of Object.entries(faces)) {
    const attrs = { class: 'face ' + name, points: corners.map((p) => point(...p)).join(' ') };
    if (fills) Object.assign(attrs, { fill: fills[name], stroke: fills.stroke });
    svg('polygon', attrs, node);
  }
  svg('path', { class: 'highlight', d: `M${point(-h, -h, H)}L${point(h, -h, H)}L${point(h, h, H)}` }, node);
}

// Plates are small labels whose box is sized to the text.
let plates = [];
function makeStackPlate(node, className, x, y, text, { pad = 1.5, round = true } = {}) {
  const group = svg('g', { class: className }, node);
  const plate = { group, rect: svg('rect', {}, group), label: svg('text', {}, group), x, y, pad, round };
  plate.label.textContent = stackText(text);
  plates.push(plate);
  sizePlate(plate);
  return plate;
}



// ---------- The call stack: frames piled up as flat slabs ----------
// Frames are 23 apart and their labels 16.5 high, so a frame's label never touches the one below.
const slabHalf = 2.3, slabHeight = 15, slabGap = 8;
// The stack sits in the middle of the figure; it grows upward from a fixed floor so frames keep their places.
const worldX = 277, worldY = 254, worldScale = .92;
const sceneRight = (620 - worldX) / worldScale - 14, sceneTop = -worldY / worldScale + 4;   // edges of the view, in world units
const slabZ = (k) => 6 + k * (slabHeight + slabGap);
const frameViews = [];
let work;
function buildScene() {
  const base = svg('g', { class: 'node stack-base' }, stackNodes);

  drawFaces(base, slabHalf + .4, 5, { top: '#e9eeeb', left: '#cfd8d3', right: '#b7c3bd', stroke: '#93a39b' });
  const [bx, by] = project(-slabHalf - .4, -slabHalf - .4, 0);
  makeStackPlate(base, 'tag', bx - 30, by + 6, '호출 스택');
  const holder = svg('g', { class: 'board' }, stackBoards);
  work = makeStackPlate(svg('g', {}, holder), 'total', 0, 0, '', { pad: 1.1, round: false });
  work.holder = holder;
  placeBoard();
}
// The board says what the top frame is doing, so it stands just above that frame's label, starting where the
// labels start, and moves with the top of the stack. Fixed at the top right, it floated far from a short stack.
function placeBoard() {
  if (!work?.holder) return;
  const k = Math.max(frameViews.length - 1, 0), z1 = slabZ(k) + slabHeight;
  const [labelX, labelY] = project(slabHalf, 0, slabZ(k) + slabHeight / 2);
  const [cornerX, cornerY] = project(slabHalf, slabHalf, z1);   // right corner of the top face
  const width = Number(work.rect.getAttribute('width')), height = Number(work.rect.getAttribute('height'));
  const left = Math.min(labelX + 16, sceneRight - width);
  // Clear the top label and the top face: its edge rises from the right corner to the back corner above x = 0.
  const edgeY = cornerY - Math.min(Math.max(cornerX - left, 0), cornerX) / 2;
  const y = Math.max(Math.min(labelY - 38, edgeY - height / 2 - 4), sceneTop + height / 2);
  work.holder.style.transform = `translate(${left.toFixed(1)}px, ${y.toFixed(1)}px)`;
  work.group.parentNode.setAttribute('transform', `translate(${(width / 2).toFixed(1)} 0)`);
}
function slabFaces(node, z0, fills) {
  const h = slabHalf, z1 = z0 + slabHeight;
  const faces = {
    left: [[-h, -h, z0], [h, -h, z0], [h, -h, z1], [-h, -h, z1]],
    right: [[h, -h, z0], [h, h, z0], [h, h, z1], [h, -h, z1]],
    top: [[-h, -h, z1], [h, -h, z1], [h, h, z1], [-h, h, z1]],
  };
  for (const [name, corners] of Object.entries(faces)) {
    svg('polygon', { class: 'face ' + name, points: corners.map((p) => point(...p)).join(' '), ...(fills ? { fill: fills[name], stroke: fills.stroke } : {}) }, node);
  }
  svg('path', { class: 'highlight', d: `M${point(-h, -h, z1)}L${point(h, -h, z1)}L${point(h, h, z1)}` }, node);
}
function frameLabel(f) {
  const vars = Object.entries(f.vars).map(([k, v]) => `${k} = ${v}`).join(', ');
  return `${f.name}${vars ? ' · ' + vars : ''}`;
}
function pushView(f, k) {
  const node = svg('g', { class: `node frame ${k === 0 ? 'outer' : 'inner'}` }, stackNodes);
  slabFaces(node, slabZ(k));
  const [x, y] = project(slabHalf, 0, slabZ(k) + slabHeight / 2);
  const label = makeStackPlate(node, 'tag frame-label', x + 16, y, frameLabel(f));
  label.left = true;
  sizePlate(label);
  frameViews.push({ node, label });
  placeBoard();
  return node;
}
function sizePlate(plate) {
  if (plate.left) { sizePlateLeft(plate); return; }
  const size = parseFloat(getComputedStyle(plate.label).fontSize);
  const width = plate.label.getComputedTextLength() + size * plate.pad;
  const height = size + 8;
  plate.label.setAttribute('x', plate.x);
  plate.label.setAttribute('y', plate.y);
  Object.entries({ x: plate.x - width / 2, y: plate.y - height / 2, width, height, rx: plate.round ? height / 2 : 6 })
    .forEach(([key, value]) => plate.rect.setAttribute(key, value));
  if (plate === work) placeBoard();
}
// Frame labels grow to the right from their left edge.
function sizePlateLeft(plate) {
  const size = parseFloat(getComputedStyle(plate.label).fontSize);
  const width = plate.label.getComputedTextLength() + size * 1.5;
  const height = size + 5;   // 16.5 against 23 between frames: a clear 6.5 gap, so neighbouring labels read apart
  plate.label.setAttribute('x', plate.x + width / 2);
  plate.label.setAttribute('y', plate.y);
  Object.entries({ x: plate.x, y: plate.y - height / 2, width, height, rx: height / 2 }).forEach(([key, value]) => plate.rect.setAttribute(key, value));
}

function drawFigure(index, {hide, changed}) {
  const layer = svg('g', {transform: `translate(${worldX} ${worldY}) scale(${worldScale})`}, byId('figure'));
  stackNodes = svg('g', {}, layer);
  stackBoards = svg('g', {}, layer);
  frameViews.length = 0;
  plates = [];
  buildScene();
  const [frames, note] = stackSlots[index];
  for (const [position, frame] of frames.entries()) {
    const id = '층 ' + (position + 1);
    if (hide.includes(id)) continue;
    const input = index === 4 && hide.includes('안내판') && position === 1
      ? {name: frame.name, vars: {x: 1}} : frame;
    const node = pushView(input, position);
    if (changed.includes(id)) for (const face of node.querySelectorAll('.face, .frame-label rect'))
      face.setAttribute('data-changed', '');
  }
  frameViews.at(-1)?.node.classList.add('top');
  if (hide.includes('안내판')) stackBoards.setAttribute('visibility', 'hidden');
  const before = index === 2 && hide.length ? '더하기(a, b) 부르기'
    : index === 6 && hide.length ? '세기(3) 부르기' : note;
  setPlate(work, stackText(before));
  placeBoard();
  if (changed.includes('안내판')) work.rect.setAttribute('data-changed', '');
