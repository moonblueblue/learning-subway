<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="시계 계산, 짝수와 자릿수, 해시의 칸 고르기, 암호의 바탕까지 나머지 연산을 문제로 익혀 보세요.">
<title>나머지 연산 · 레슨 2.6</title>
<style>
:root{color-scheme:light;--ink:#142620;--muted:#43574f;--border:#cbd9d0;--paper:#f4f7ef;--panel:#fff;--accent:#0f766e;--request:#187959;--response:#5362a0;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.65 system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled,button[aria-disabled=true]{cursor:default;opacity:.5}
:focus-visible{outline:3px solid #a24c14;outline-offset:3px}
.shell{max-width:1280px;margin:auto;padding:clamp(16px,2.5vw,32px)}
header{margin-bottom:20px}
h1,h2,p{margin:0}
.eyebrow{color:var(--accent);font-size:.875rem;font-weight:700;margin-bottom:6px}
h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.12;letter-spacing:-.065em}
header p.lead{color:var(--muted);margin-top:10px}
.workspace{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(360px,1fr);gap:20px;align-items:stretch}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:18px;overflow:hidden}
.actions,.navigation{display:flex;gap:8px;flex-wrap:wrap}
.action{border:1px solid #9fb7a9;background:white;border-radius:9px;padding:7px 12px;min-height:44px;font-size:.875rem;font-weight:650}
.action:hover:not(:disabled):not([aria-disabled=true]){background:#e4f3f1}
.primary{background:var(--accent);color:white;border-color:var(--accent)}
.primary:hover:not(:disabled){background:#115e59}
.timeline{padding:15px 18px}
.timeline-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.timeline-top span{font:700 .875rem var(--mono);color:var(--muted)}
.steps{list-style:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0;margin:0;gap:8px}
.steps button{height:100%;min-height:52px;text-align:left;width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:#f6f8f5;font-size:.875rem;line-height:1.45;display:flex;gap:7px;align-items:center}
.steps button:hover{border-color:var(--accent)}
.steps button[aria-current=step]{background:#d5efeb;border-color:var(--accent);font-weight:750}
.step-number{font:700 .875rem var(--mono);color:var(--accent)}
.explanation{padding:clamp(20px,2.4vw,32px);display:flex;flex-direction:column;gap:20px}
.explanation h2{font-size:clamp(1.5rem,2.3vw,2.1rem);letter-spacing:-.055em;line-height:1.3}
.explanation p{color:var(--muted);font-size:1.0625rem;line-height:1.75}
.takeaway p{font-size:1rem}
.takeaway{padding:12px 14px;background:#e9f5f3;border-left:3px solid var(--accent);border-radius:0 9px 9px 0}
.takeaway strong{display:block;color:var(--accent);font-size:.875rem}
.navigation{justify-content:space-between;margin-top:auto;padding-top:8px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(max-width:980px){.workspace{grid-template-columns:1fr}.navigation{margin-top:0}}
@media(max-width:560px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}

.stage-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.stage-top h2{font-size:1rem}
.score{color:var(--accent);font:700 .875rem var(--mono)}
.case{margin:18px;padding:16px 18px;border-radius:14px;background:#e9f5f3;border:1px solid var(--border);display:grid;gap:6px}
.case strong{color:var(--accent);font-size:.875rem}
.case p{font-size:1.125rem;line-height:1.6;color:var(--ink)}
.items{list-style:none;margin:0;padding:0 18px 18px;display:grid;gap:10px}
.item{border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:grid;gap:8px;background:#fff}
.item-top{display:flex;gap:10px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.item-text{font-size:1rem;font-weight:600;flex:1 1 280px}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choice{min-width:68px}
.choice[aria-pressed=true]{border-color:var(--accent);background:#d2f4dd;color:#0f5a3c}
.choice.risk[aria-pressed=true]{border-color:#a24c14;background:#fff1e4;color:#8a3d0f}
.feedback{font-size:.9375rem;color:var(--muted);line-height:1.6}
.feedback:empty{display:none}
.feedback b{margin-right:4px}
.item.right{border-color:var(--accent);background:#f6fbf7}
.item.right .feedback b{color:var(--accent)}
.item.wrong{border-color:#a24c14;background:#fffaf5}
.item.wrong .feedback b{color:#a24c14}
.think{margin:0 18px 18px;padding:14px 16px;border-radius:12px;border:1px dashed #9fb7a9;display:grid;gap:10px}
.think label{font-weight:700}
.think textarea{font:inherit;min-height:84px;padding:10px 12px;border:1px solid #9fb7a9;border-radius:10px;resize:vertical}
.think .sample-answer{color:var(--muted);line-height:1.7}
.think .sample-answer[hidden]{display:none}
.done{margin:0 18px 18px;padding:12px 14px;border-radius:10px;background:#d2f4dd;color:#0f5a3c;font-weight:700}
.done[hidden]{display:none}
.timeline{border-top:1px solid var(--border)}
.truth{margin:0 18px 14px}
.truth[hidden]{display:none}
.truth table{border-collapse:collapse;font:700 1rem var(--mono);margin:0 auto}
.truth th,.truth td{border:1px solid var(--border);padding:6px 18px;text-align:center}
.truth th{background:#e9f5f3;color:var(--accent);font-family:system-ui,sans-serif}
.truth td.blank{color:#9aa8a2}
.truth td.filled{background:#d2f4dd;color:#0f5a3c}

.worked-example { min-width: 0; margin: 0; }
.worked-example table { width: 100%; table-layout: auto; border-collapse: separate; border-spacing: 0;
  border: 1px solid var(--border); border-radius: 8px; font-size: .85rem; line-height: 1.3; }
.worked-example caption { padding: 0 0 4px; font-weight: 700; text-align: start; }
.worked-example :is(th, td) { padding: 3px 6px; border-bottom: 1px solid var(--border);
  text-align: start; overflow-wrap: anywhere; }
.worked-example thead { background: #eff6f1; }
.worked-example tbody tr:last-child :is(th, td) { border-bottom: 0; }
.worked-example tr.is-key :is(th, td) { background: #e3f1e9; font-weight: 700; }
.worked-example:has(.remainder-clock) { display: grid; grid-template-columns: 96px 1fr; gap: 8px; align-items: center; }
.remainder-clock { width: 96px; height: 96px; color: #165744; }
.remainder-clock text { fill: currentColor; font: 9px system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; }
.remainder-clock .clock-key { fill: white; font-weight: 700; }
.remainder-slots { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px;
  margin: 5px 0 0; padding: 0; list-style: none; font-size: .85rem; text-align: center; }
.remainder-slots li { border: 1px solid var(--border); border-radius: 4px; }
.remainder-slots .is-target { background: #e3f1e9; color: #165744; font-weight: 700; border-color: currentColor; }
.worked-example .worked-note { margin-top: 4px; font-size: .85rem; font-weight: 700; }
@media (max-height: 720px) and (min-width: 641px) {
  .explanation:has(.worked-example:not([hidden])) .takeaway { display: none; }
}
</style>

<body>
<main class="shell">
  <header>
    <p class="eyebrow">2장 CS를 위한 수학 · 레슨 2.6 · 실습</p>
    <h1>나머지 연산</h1>
    <p class="lead">시계처럼 도는 수는 암호와 해시에서 어떻게 쓰일까요? 나머지 연산을 문제로 익혀 보세요.</p>
  </header>
  <div class="workspace">
    <div>
      <section class="panel" aria-labelledby="practice-heading">
        <div class="stage-top"><h2 id="practice-heading">참일까, 거짓일까</h2><span class="score" id="score" aria-live="polite"></span></div>
        <div class="case"><strong>문제</strong><p id="case"></p></div>
        <div class="truth" id="table" hidden></div>
        <ol class="items" id="items"></ol>
        <p class="done" id="done" role="status" hidden></p>
        <div class="think">
          <label for="answer">생각해 보기 · <span id="question"></span></label>
          <textarea id="answer" placeholder="자유롭게 적어 보세요. 저장되거나 채점되지 않습니다."></textarea>
          <div><button class="action" id="reveal" type="button" aria-expanded="false">예시 답 보기</button></div>
          <p class="sample-answer" id="sample" hidden></p>
        </div>
        <nav class="timeline" aria-labelledby="timeline-heading">
          <div class="timeline-top"><h2 id="timeline-heading">타임라인</h2><span id="count"></span></div>
          <ol class="steps" id="steps"></ol>
        </nav>
      </section>
    </div>
    <section class="panel explanation" aria-labelledby="step-title">
      <h2 id="step-title"></h2><p id="body"></p>
      <figure class="worked-example" id="worked-example" hidden></figure>
      <div class="takeaway"><strong>앞 레슨과 이어 보기</strong><p id="takeaway"></p></div>
      <nav class="navigation" aria-label="이전 및 다음 단계"><button class="action" id="prev" type="button">이전 단계</button><button class="action primary" id="next" type="button">다음 단계</button></nav>
    </section>
  </div>
  <div class="sr-only" id="announcement" role="status"></div>
</main>
<script>
const storageKey = 'modular-lab:v1:step';
const BENEFIT = 'true', RISK = 'false';
const yes = '참', no = '거짓';
// Each step is one exercise. `choices` are the two answers; items are statements or truth-table rows.
// A step with `table` shows its items as a truth table whose last column the learner fills in.
const row = (p, q, answer, why) => ({ cells: [p, q], answer: answer ? 'true' : 'false', why });
const TF = [['true', '참'], ['false', '거짓']];
const lesson = [
  {
    worked: {"head": ["출발", "세 시간 뒤", "나머지"], "rows": [["11시", "12 → 1 → 2", "14 = 12 + 2"]], "mark": [], "clock": true},
    label: '시계 계산',
    example: ["11시에서 3시간 전진", "12 → 1 → 2를 지남", "14 % 12 = 2 · 2시"],
    title: '나머지 연산은 시계처럼 돌아간다',
    body: '지금 10시에서 5시간 뒤는 15시가 아니라 3시입니다(12시간 시계). 12로 나눈 나머지만 보기 때문입니다. 이것을 나머지 연산이라 하고, 파이썬에서는 %로 씁니다. 15 % 12 = 3, 7 % 2 = 1처럼 나눈 뒤 남는 수를 줍니다.',
    link: '1.2의 while 반복에서 i를 1씩 늘렸습니다. i % 2를 쓰면 반복할 때마다 0, 1, 0, 1로 번갈아 바뀌는 값을 얻을 수 있습니다.',
    case: '다음 식이 맞는지 고르세요.',
    choices: [['true', '맞다'], ['false', '틀리다']],
    items: [
      { text: '15 % 12 == 3', answer: 'true', why: '15를 12로 나누면 몫 1, 나머지 3입니다.' },
      { text: '10시에서 30시간 뒤는 4시다 (12시간 시계)', answer: 'true', why: '(10 + 30) % 12 = 40 % 12 = 4입니다.' },
      { text: '7 % 7 == 1', answer: 'false', why: '7은 7로 나누어떨어지므로 나머지는 0입니다.' },
      { text: '어떤 수를 5로 나눈 나머지는 0부터 4 중 하나다', answer: 'true', why: '나머지는 언제나 나누는 수보다 작습니다.' },
    ],
    question: '오늘이 수요일이면 100일 뒤는 무슨 요일일까요?',
    sample: '100 % 7 = 2이므로 수요일에서 이틀 뒤인 금요일입니다. 일주일이 7일마다 돌아오기 때문입니다.',
  },
  {
    label: '짝수와 자릿수',
    example: ["17을 2로 나눔", "나머지 1", "홀수"],
    title: '나머지로 성질을 빠르게 알아낸다',
    body: 'n % 2가 0이면 짝수, 1이면 홀수입니다. n % 10은 맨 끝 자릿수입니다. 0.1에서 본 이진수로 보면, n % 2는 맨 오른쪽 비트이고 n % 256은 맨 아래 8비트(1바이트)입니다. 나머지는 수의 "끝부분"을 잘라 보는 도구입니다.',
    link: '0.1에서 가장 오른쪽 스위치(1을 맡은 비트)가 켜져 있으면 홀수였습니다. 그것이 바로 n % 2 == 1입니다.',
    case: '다음 문장이 참인지 고르세요.',
    choices: TF,
    items: [
      { text: '2024 % 2 == 0이므로 2024는 짝수다.', answer: 'true', why: '2로 나누어떨어지면 짝수입니다.' },
      { text: '12345 % 10 == 5', answer: 'true', why: '10으로 나눈 나머지는 끝 자릿수입니다.' },
      { text: '홀수의 이진수는 맨 오른쪽 비트가 0이다.', answer: 'false', why: '홀수는 1을 맡은 맨 오른쪽 비트가 1입니다.' },
      { text: '300 % 256 == 44', answer: 'true', why: '300 − 256 = 44. 1바이트에 담으면 넘친 부분이 잘리고 44만 남습니다.' },
    ],
    question: '3의 배수인지 빠르게 확인하려면 어떤 식을 쓸까요?',
    sample: 'n % 3 == 0입니다. 같은 방식으로 n % k == 0이면 n은 k의 배수입니다.',
  },
  {
    worked: {"head": ["값", "10으로 나눈 식", "나머지와 위치"], "rows": [[27, "27 = 2 × 10 + 7", "7번 칸"], [37, "37 = 3 × 10 + 7", "7번 칸"]], "mark": [0, 1], "slot": 7},
    label: '해시의 칸 고르기',
    example: ["27 % 10 · 37 % 10", "두 나머지 모두 7", "둘 다 7번 칸"],
    title: '나머지로 값을 정해진 칸에 나눠 담는다',
    body: '칸이 10개인 표에 이름을 나눠 담는다고 해 봅시다. 이름을 어떤 규칙으로 수로 바꾼 뒤(해시) % 10을 하면, 결과는 항상 0–9 중 하나라 바로 칸 번호가 됩니다. 다시 찾을 때도 같은 계산으로 그 칸 하나만 보면 됩니다. 1.4에서 딕셔너리가 한 칸만 읽었던 비밀이 이것입니다.',
    link: '1.4에서 딕셔너리는 키로 한 칸만 읽었고, 2.4의 생일 문제처럼 칸이 적으면 두 키가 같은 칸에 들어가는 충돌이 생각보다 자주 일어납니다. 자세한 구조는 4.5에서 다룹니다.',
    case: '칸이 10개인 표에서 칸 번호 = 해시값 % 10일 때 다음 문장이 참인지 고르세요.',
    choices: TF,
    items: [
      { text: '해시값 1234인 키는 4번 칸에 들어간다.', answer: 'true', why: '1234 % 10 = 4입니다.' },
      { text: '해시값 57과 87인 키는 같은 칸에 들어간다.', answer: 'true', why: '둘 다 % 10이 7입니다. 이것이 충돌입니다.' },
      { text: '칸 번호는 10이 나올 수도 있다.', answer: 'false', why: '% 10의 결과는 0–9뿐이라 칸 0–9에 꼭 맞습니다.' },
      { text: '같은 키는 언제 계산해도 같은 칸 번호가 나온다.', answer: 'true', why: '해시와 나머지가 정해진 계산이라 같은 입력에는 같은 결과가 나옵니다. 그래서 다시 찾을 수 있습니다.' },
    ],
    question: '칸을 10개에서 100개로 늘리면 충돌은 어떻게 될까요?',
    sample: '같은 수의 키를 담을 때 칸이 많을수록 같은 칸에 몰릴 확률이 줄어 충돌이 줄어듭니다. 대신 빈 칸이 늘어 메모리를 더 씁니다.',
  },
  {
    worked: {"head": ["양의 지수 n", "1", "2", "3", "4"], "rows": [["3ⁿ % 7", "3", "2", "6", "4"]], "mark": [], "note": "목표 나머지 4가 처음 나오는 지수는 4"},
    label: '암호 맛보기',
    example: ["n = 1, 2, 3, 4를 차례로 대입", "3ⁿ % 7 → 3, 2, 6, 4", "목표 4의 첫 지수는 4"],
    title: '나머지 연산은 거꾸로 풀기 어렵게 만든다',
    body: '3⁴ % 7 = 81 % 7 = 4처럼 거듭제곱의 나머지는 계산하기 쉽습니다. 그런데 "3을 몇 번 곱해야 7로 나눈 나머지가 4가 될까?"를 거꾸로 찾기는 수가 커질수록 엄청나게 어려워집니다. 인터넷의 자물쇠(6.11, 8C.1)는 이런 "한쪽은 쉽고 거꾸로는 어려운" 나머지 계산 위에 만들어졌습니다.',
    link: '0.7에서 패킷이 여러 기계를 거치는 동안 누구나 엿볼 수 있었습니다. 내용을 지키려면 이런 수학이 필요합니다.',
    case: '다음 문장이 참인지 고르세요.',
    choices: TF,
    items: [
      { text: '3⁴ % 7 == 4', answer: 'true', why: '3⁴ = 81, 81 = 7 × 11 + 4입니다.' },
      { text: '(a × b) % n은 (a % n) × (b % n)을 다시 % n 한 것과 같다.', answer: 'true', why: '나머지끼리 곱해도 결과의 나머지는 같습니다. 그래서 큰 거듭제곱도 중간중간 나머지를 내며 작은 수로 계산할 수 있습니다.' },

    ],
    question: '시계에서 지금 몇 시인지만 보고 "몇 시간이 흘렀는지" 알 수 있을까요?',
    sample: '알 수 없습니다. 3시는 3시간 뒤일 수도, 15시간이나 27시간 뒤일 수도 있습니다. 나머지만 보면 정보가 사라지는 이 성질이 암호에서 쓰입니다.',
  },
];

const byId = (id) => document.getElementById(id);
const state = { index: 0, picks: lesson.map((step) => step.items.map(() => null)) };


function drawRemainderClock() {
  const namespace = 'http://www.w3.org/2000/svg';
  const clock = document.createElementNS(namespace, 'svg');
  clock.setAttribute('class', 'remainder-clock');
  clock.setAttribute('viewBox', '0 0 96 96');
  clock.setAttribute('aria-hidden', 'true');
  function shape(tag, attributes, text) {
    const element = document.createElementNS(namespace, tag);
    for (const [name, value] of Object.entries(attributes)) element.setAttribute(name, value);
    if (text !== undefined) element.textContent = text;
    clock.append(element);
  }
  shape('circle', { cx: 48, cy: 48, r: 46, fill: 'white', stroke: '#9ab7a9' });
  shape('path', { d: 'M34 24 A28 28 0 0 1 72 34 M66 31 L72 34 L71 27',
    fill: 'none', stroke: 'currentColor', 'stroke-width': 2 });
  shape('path', { d: 'M48 48 L70 35', stroke: 'currentColor', 'stroke-width': 2 });
  shape('circle', { cx: 48, cy: 48, r: 2.5, fill: 'currentColor' });
  for (let hour = 1; hour <= 12; hour++) {
    const angle = hour * Math.PI / 6;
    const x = 48 + Math.sin(angle) * 37;
    const y = 48 - Math.cos(angle) * 37;
    const marked = hour === 11 || hour === 2;
    if (marked) shape('circle', { cx: x, cy: y, r: 7, fill: 'currentColor' });
    shape('text', { x, y, class: marked ? 'clock-key' : '' }, hour);
  }
  return clock;
}

function showWorkedExample(worked) {
  const figure = byId('worked-example');
  figure.hidden = !worked;
  figure.replaceChildren();
  if (!worked) return;
  const table = document.createElement('table');
  table.createCaption().textContent = '계산 예시';
  const header = table.createTHead().insertRow();
  for (const name of worked.head) {
    const cell = document.createElement('th');
    cell.scope = 'col';
    cell.textContent = name;
    header.append(cell);
  }
  const body = table.createTBody();
  worked.rows.forEach((values, index) => {
    const row = body.insertRow();
    row.classList.toggle('is-key', worked.mark.includes(index));
    values.forEach((value, column) => {
      const cell = document.createElement(column === 0 ? 'th' : 'td');
      if (column === 0) cell.scope = 'row';
      cell.textContent = value;
      row.append(cell);
    });
  });
  if (worked.clock) figure.append(drawRemainderClock());
  figure.append(table);
  if (worked.slot !== undefined) {
    const slots = document.createElement('ol');
    slots.className = 'remainder-slots';
    slots.setAttribute('aria-label', '표의 0번부터 9번까지');
    for (let index = 0; index < 10; index++) {
      const slot = document.createElement('li');
      slot.textContent = index;
      slot.classList.toggle('is-target', index === worked.slot);
      if (index === worked.slot) slot.setAttribute('aria-current', 'true');
      slots.append(slot);
    }
    figure.append(slots);
  }
  if (worked.note) {
    const note = document.createElement('p');
    note.className = 'worked-note';
    note.textContent = worked.note;
    figure.append(note);
  }
}

function showStep(index, announce = true) {
  state.index = index;
  const step = lesson[index];
  showWorkedExample(step.worked);
  byId('step-title').textContent = step.title;
  byId('body').textContent = step.body;
  byId('takeaway').textContent = step.link;
  byId('case').textContent = step.case;
  byId('question').textContent = step.question;
  byId('sample').textContent = step.sample;
  byId('sample').hidden = true;
  byId('reveal').setAttribute('aria-expanded', 'false');
  byId('reveal').textContent = '예시 답 보기';
  byId('answer').value = '';
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  stepButtons.forEach((button, i) => {
    if (i === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  buildItems();
  try { localStorage.setItem(storageKey, String(index)); } catch {}
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${step.title}`;
}

function buildItems() {
  const step = lesson[state.index];
  const list = byId('items');
  list.replaceChildren();
  step.items.forEach((item, i) => {
    const li = document.createElement('li');
    li.className = 'item';
    const top = document.createElement('div');
    top.className = 'item-top';
    const text = document.createElement('span');
    text.className = 'item-text';
    text.id = `item-${i}`;
    text.textContent = step.table ? `${step.table[0]} ${item.cells[0]} · ${step.table[1]} ${item.cells[1]}` : item.text;
    const choices = document.createElement('div');
    choices.className = 'choices';
    choices.setAttribute('role', 'group');
    choices.setAttribute('aria-labelledby', text.id);
    for (const [value, label] of step.choices) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = `action choice ${value === 'false' ? 'risk' : 'benefit'}`;
      button.textContent = label;
      button.dataset.value = value;
      button.addEventListener('click', () => pick(i, value));
      choices.append(button);
    }
    const feedback = document.createElement('p');
    feedback.className = 'feedback';
    feedback.setAttribute('role', 'status');
    top.append(text, choices);
    li.append(top, feedback);
    list.append(li);
  });
  syncItems();
}

// For table steps, a compact truth table mirrors the answers so far.
function syncTable() {
  const step = lesson[state.index];
  const box = byId('table');
  box.hidden = !step.table;
  if (!step.table) return;
  const picks = state.picks[state.index];
  const label = (v) => step.choices.find(([value]) => value === v)?.[1] ?? '?';
  box.innerHTML = '';
  const table = document.createElement('table');
  const head = table.createTHead().insertRow();
  step.table.forEach((h) => { const th = document.createElement('th'); th.textContent = h; head.append(th); });
  const body = table.createTBody();
  step.items.forEach((item, i) => {
    const tr = body.insertRow();
    item.cells.forEach((c) => { tr.insertCell().textContent = c; });
    const cell = tr.insertCell();
    cell.textContent = picks[i] === item.answer ? label(item.answer) : '?';
    cell.className = picks[i] === item.answer ? 'filled' : 'blank';
  });
  box.append(table);
}

function pick(i, value) {
  state.picks[state.index][i] = value;
  syncItems();
  const item = lesson[state.index].items[i];
  byId('announcement').textContent = value === item.answer ? '맞았습니다.' : '다시 생각해 보세요.';
}

function syncItems() {
  const step = lesson[state.index];
  const picks = state.picks[state.index];
  [...byId('items').children].forEach((li, i) => {
    const item = step.items[i];
    const picked = picks[i];
    li.classList.toggle('right', picked === item.answer);
    li.classList.toggle('wrong', picked !== null && picked !== item.answer);
    for (const button of li.querySelectorAll('.choice')) button.setAttribute('aria-pressed', String(button.dataset.value === picked));
    const feedback = li.querySelector('.feedback');
    feedback.replaceChildren();
    if (picked !== null) {
      const mark = document.createElement('b');
      mark.textContent = picked === item.answer ? '✓ 맞았습니다.' : '✗ 다시 생각해 보세요.';
      feedback.append(mark, picked === item.answer ? item.why : '');
    }
  });
  const right = picks.filter((p, i) => p === step.items[i].answer).length;
  byId('score').textContent = `${right} / ${step.items.length} 맞힘`;
  byId('done').hidden = right !== step.items.length;
  byId('done').textContent = step.table ? '✓ 진리표를 모두 채웠습니다. 아래 질문도 생각해 보세요.' : '✓ 모두 맞게 골랐습니다. 아래 질문도 생각해 보세요.';
  syncTable();
}

byId('reveal').onclick = () => {
  const open = byId('sample').hidden;
  byId('sample').hidden = !open;
  byId('reveal').setAttribute('aria-expanded', String(open));
  byId('reveal').textContent = open ? '예시 답 숨기기' : '예시 답 보기';
};

function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/modular/${index + 1}`);
  showStep(index);
}
function routeIndex() {
  const match = /^#\/modular\/(\d+)$/.exec(location.hash);
  const routed = match ? Number(match[1]) - 1 : -1;
  if (routed >= 0 && routed < lesson.length) return routed;
  try {
    const stored = localStorage.getItem(storageKey);
    const index = Number(stored);
    if (stored !== null && Number.isInteger(index) && index >= 0 && index < lesson.length) return index;
  } catch {}
  return 0;
}
const stepButtons = lesson.map(({ label }, index) => {
  const listItem = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  const number = document.createElement('span');
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.addEventListener('click', () => goToStep(index));
  listItem.append(button);
  byId('steps').append(listItem);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
window.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});
const initial = routeIndex();
history.replaceState(null, '', `#/modular/${initial + 1}`);
showStep(initial, false);
</script>
</body>
</html>
