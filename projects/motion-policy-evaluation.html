<body>
<main class="shell">
  <header><p class="eyebrow">강화학습·로봇 · 졸업 과제</p><h1>이동 정책 평가</h1><p>같은 미사용 지도에서 두 정책의 이동과 정지를 어떻게 확인할까요?</p></header>
  <div class="workspace">
    <div>
      <section class="panel" aria-labelledby="stage-heading">
        <div class="stage-top"><h2 id="stage-heading">계산과 판단</h2></div>
        <div class="stage"><svg id="scene" viewBox="0 0 620 280" role="img" aria-labelledby="scene-title scene-desc"><title id="scene-title">이동 정책 평가</title><desc id="scene-desc"></desc></svg></div>
        <div class="controls"></div>
        <nav class="timeline" aria-labelledby="timeline-heading">
          <div class="timeline-top"><h2 id="timeline-heading">타임라인</h2><span id="count"></span></div>
          <ol class="steps" id="steps"></ol>
        </nav>
      </section>
      <div class="hands-on">
        <p class="try"><strong>다른 입력으로 확인</strong></p>
        <div class="motion-actions">
          <button id="motion-results" class="action primary" type="button">시험 결과</button>
          <button id="motion-edit" class="action" type="button">입력 편집</button>
        </div>
        <p id="prompt" class="try"></p>
        <p id="feedback" class="readout" role="status"></p>
        <div id="choices"></div>
      </div>
    </div>
    <section class="panel explanation" aria-labelledby="step-title">
      <h2 id="step-title"></h2><p id="body"></p>
      <div class="takeaway"><strong>관찰 포인트</strong><p id="takeaway"></p></div>
      <nav class="navigation" aria-label="이전 및 다음 단계"><button class="action" id="prev" type="button">이전 단계</button><button class="action primary" id="next" type="button">다음 단계</button></nav>
    </section>
  </div>
  <div class="sr-only" id="announcement" role="status"></div>
</main>
<dialog id="motion-dialog" class="motion-dialog" aria-labelledby="motion-heading">
  <header>
    <h2 id="motion-heading">시험 결과</h2>
    <form method="dialog"><button class="action">닫기</button></form>
  </header>
  <section data-motion-panel="results">
    <div class="motion-fields">
      <label>사례<select id="motion-case"></select></label>
      <label>보기<select id="motion-view">
        <option value="compare">짝 비교</option>
        <option value="trace">이동 기록</option>
        <option value="summary">시험 집계</option>
      </select></label>
    </div>
    <section data-motion-view="compare">
      <p id="motion-case-meta"></p>
      <table><thead><tr><th scope="col">정책</th><th scope="col">종료</th><th scope="col">충돌</th><th scope="col">틱</th><th scope="col">원점수</th></tr></thead>
      <tbody id="motion-comparison"></tbody></table>
    </section>
    <section data-motion-view="trace" hidden>
      <div class="motion-fields">
        <label>정책<select id="motion-policy"></select></label>
        <label>기록 틱<select id="motion-tick"></select></label>
      </div>
      <div class="motion-trace">
        <svg id="motion-map" role="img" aria-label="수레 이동 지도"></svg>
        <div id="motion-record" aria-live="polite">
          <p id="motion-move"></p>
          <p id="motion-sensor"></p>
          <p id="motion-observation"></p>
          <p id="motion-event"></p>
        </div>
      </div>
    </section>
    <section data-motion-view="summary" hidden>
      <p id="motion-split"></p>
      <table><thead><tr><th scope="col">정책</th><th scope="col">성공률</th><th scope="col">충돌률</th><th scope="col">평균 틱</th></tr></thead>
      <tbody id="motion-summary"></tbody></table>
    </section>
    <div class="motion-actions">
      <button class="action" id="motion-edit-from-results" type="button">입력 편집</button>
      <button class="action" id="motion-downloads" type="button">파일 받기</button>
    </div>
  </section>
  <section data-motion-panel="edit" hidden>
    <form id="motion-form">
      <label for="motion-input">실험 설정 JSON</label>
      <textarea id="motion-input" rows="5" spellcheck="false" aria-describedby="motion-format"></textarea>
      <p id="motion-format">지도 기호 # . S G B · 틱 100 ms</p>
      <p id="motion-error" role="status"></p>
      <div class="motion-actions">
        <button type="submit" id="motion-run" class="action primary">학습하고 실행</button>
        <button type="button" id="motion-reset" class="action">기본 입력</button>
      </div>
    </form>
  </section>
  <section data-motion-panel="downloads" hidden>
    <p>설정, 실행 코드, 결과를 받아 같은 실험을 재생합니다.</p>
    <div class="motion-actions">
      <button class="action" id="motion-download-input" type="button">입력 JSON</button>
      <button class="action" id="motion-download-code" type="button">실행 코드</button>
      <button class="action" id="motion-download-report" type="button">보고서 JSON</button>
      <button class="action" id="motion-back" type="button">시험 결과</button>
    </div>
  </section>
</dialog>
