const slug = 'rules-and-examples';
const byId = id => document.getElementById(id);
const state = {index: -1, answers: new Map()};
const feedbackMessages = ['✓ 맞았습니다.', '✗ 다시 생각해 보세요.'];
const scene = byId('scene');
const workspace = scene.closest('.workspace');

function ruleText(group, x, y, value, type = '') {
  const text = svg('text', {x, y, class: 'rule-text ' + type, 'text-anchor': 'middle'}, group);
  text.textContent = value;
  return text;
}

function ruleCard(group, x, y, w, h, tone = '') {
  svg('rect', {x, y, width: w, height: h, rx: 6, class: 'rule-card ' + tone}, group);
}

function ruleArrow(group, x1, y1, x2, y2, tone = '') {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const tipLength = 8;
  const shaftInset = (tipLength - 1) / Math.hypot(dx, dy);
  svg('line', {x1, y1, x2: x2 - dx * shaftInset, y2: y2 - dy * shaftInset, class: 'rule-line ' + tone}, group);
  svg('polygon', {'data-arrowhead': '', points: `${-tipLength},-5 0,0 ${-tipLength},5`, class: 'rule-tip ' + tone,
    transform: `translate(${x2} ${y2}) rotate(${Math.atan2(dy, dx) * 180 / Math.PI})`}, group);
}

const animals = {
  amber: {fur: '#db9d62', shade: '#91532c', background: '#f9edd3', pointed: true},
  gray: {fur: '#8293a7', shade: '#495971', background: '#e1ecf5'},
  sampleToy: {fur: '#ca9c64', shade: '#73543c', background: '#dcf0e5', pointed: true, toy: true},
  grayNew: {fur: '#a0a39a', shade: '#5b625f', background: '#f3e7d8'},
  striped: {fur: '#efbc8d', shade: '#985d42', background: '#dae1f1', pointed: true, toy: true},
  round: {fur: '#bd9dbb', shade: '#715f80', background: '#f0e5ec', toy: true},
};

function animal(group, x, y, type, crop = false, scale = 1) {
  const {fur, shade, background, pointed, toy} = animals[type];
  const image = svg('g', {transform: `translate(${x} ${y}) scale(${scale})`}, group);
  svg('rect', {x: -32, y: -25, width: 64, height: 50, rx: 5, fill: background, stroke: '#89938a'}, image);
  if (toy && !crop) {
    svg('path', {d: 'M-20 16Q0 10 20 16V21Q0 26-20 21Z', fill: '#a34c2e'}, image);
    svg('rect', {x: -3, y: 10, width: 6, height: 9, fill: '#674338'}, image);
  }
  const face = svg('g', {transform: (crop ? 'translate(0 3) scale(1.15)' : 'translate(0 -3)') + (type === 'striped' ? ' rotate(-10)' : '')}, image);
  svg('path', {d: pointed ? 'M-19 -2L-19 -17L-9 -11Q0 -14 9 -11L19 -17L19 -2Q20 13 0 14Q-20 13-19 -2Z' :
    'M-19 -2Q-25 -16-13 -16L-7 -11Q0 -15 7 -11L13 -16Q25 -16 19 -2Q20 13 0 14Q-20 13-19 -2Z', fill: fur, stroke: shade}, face);
  if (type === 'gray' || type === 'grayNew') svg('path', {d: 'M-20 -12L-12 -7L-11 -12M20 -12L12 -7L11 -12', fill: 'none', stroke: shade, 'stroke-width': 1.7}, face);
  if (type === 'striped') svg('path', {d: 'M-5 -11L-4 -5M0 -12V-5M5 -11L4 -5M18 1L13 0', fill: 'none', stroke: shade, 'stroke-width': 1.8}, face);
  for (const eye of [-7, 7]) svg('circle', {cx: eye, cy: 0, r: 1.9, fill: '#302c2a'}, face);
  svg('path', {d: 'M-3 5H3L0 8Z', fill: shade}, face);
  svg('path', {d: 'M-6 8L-14 6M6 8L14 6', fill: 'none', stroke: shade}, face);
}

const cat = '고양이';
const notCat = '고양이 아님';
const earRule = '귀 기준';
const standRule = '받침 기준';
const personRule = '사람이 써 준 귀 기준';
const learnedRule = '예시에서 고른 받침 기준';
const training = [
  {id: 'A', animal: 'amber'}, {id: 'B', animal: 'gray'},
  {id: 'C', animal: 'sampleToy'}, {id: 'D', animal: 'round'},
];
const practiceTraining = [
  {id: 'E', animal: 'amber'}, {id: 'F', animal: 'striped'}, {id: 'G', animal: 'gray'},
];
const actual = item => !animals[item.animal].toy;
const byEar = item => Boolean(animals[item.animal].pointed);
const showsStand = item => Boolean(animals[item.animal].toy && !item.crop);
const byStand = item => !showsStand(item);
const predictionName = value => value ? cat : notCat;

function writtenRule(group, trial) {
  ruleCard(group, 34, 48, 128, 37, 'rule-input');
  ruleText(group, 98, 72, '사람이 씀');
  ruleArrow(group, 166, 66.5, 188, 66.5);
  ruleCard(group, 193, 48, 390, 37, 'rule-person');
  ruleText(group, 388, 72, '뾰족귀가 보이면 고양이 · 안 보이면 아님');
  const inputs = trial ? [{id:'4', animal:'grayNew'}] : [{id:'1', animal:'amber'}, {id:'2', animal:'round'}];
  for (const [i, item] of inputs.entries()) {
    const y = 122 + i * 68;
    animal(group, 105, y, item.animal);
    ruleText(group, 52, y + 5, item.id);
    ruleArrow(group, 142, y, 205, y);
    ruleCard(group, 212, y - 19, 166, 38, 'rule-person');
    ruleText(group, 295, y + 5, byEar(item) ? '뾰족귀 보임' : '뾰족귀 안 보임');
    ruleArrow(group, 385, y, 446, y);
    ruleCard(group, 453, y - 19, 130, 38, trial ? 'rule-pending rule-response-panel' : 'rule-output');
    ruleText(group, 518, y + 5, trial ? '선택 대기' : predictionName(byEar(item)), trial ? 'rule-response' : '');
  }
}

function labeledPhotos(group, trial) {
  ruleText(group, 310, 66, '사람이 확인하고 붙인 정답');
  const items = trial ? [{id:'E', animal:'gray'}, {id:'F', animal:'striped'}] : training;
  const start = trial ? 167 : 25;
  for (const [i, item] of items.entries()) {
    const x = start + i * 145;
    const correct = actual(item);
    ruleCard(group, x, 81, 135, 132, 'rule-input');
    ruleText(group, x + 67.5, 104, item.id);
    animal(group, x + 67.5, 135, item.animal);
    const pending = trial && i === 1;
    ruleCard(group, x + 10, 174, 115, 28, pending ? 'rule-pending rule-response-panel' : 'rule-match');
    ruleText(group, x + 67.5, 193, pending ? '선택 대기' : predictionName(correct), pending ? 'rule-response rule-small' : 'rule-small');
  }
}

function compareCriteria(group, trial) {
  const items = trial ? practiceTraining : training;
  const start = trial ? 212 : 184;
  const gap = trial ? 95 : 80;
  ruleText(group, 83, 107, '사람이 준 정답');
  ruleText(group, 543, 107, '일치 수');
  for (const [i, item] of items.entries()) {
    const x = start + i * gap;
    ruleText(group, x - 28, 70, item.id, 'rule-small');
    animal(group, x + 3, 65, item.animal, false, .67);
    ruleText(group, x, 106, predictionName(actual(item)), 'rule-small');
  }
  const criteria = [[earRule, byEar, 'rule-person'], [standRule, byStand, 'rule-learned']];
  for (const [index, [name, predict, tone]] of criteria.entries()) {
    const y = 119 + index * 47;
    ruleCard(group, 26, y, 114, 38, tone);
    ruleText(group, 83, y + 24, name);
    for (const [i, item] of items.entries()) {
      const x = start + i * gap;
      const prediction = predict(item);
      const match = prediction === actual(item);
      ruleCard(group, x - 37, y, 74, 38, match ? 'rule-match' : 'rule-miss');
      ruleText(group, x, y + 15, match ? '✓' : '×', 'rule-small');
      ruleText(group, x, y + 30, predictionName(prediction), 'rule-small');
    }
    const correct = items.filter(item => predict(item) === actual(item)).length;
    ruleCard(group, 494, y, 98, 38, tone);
    ruleText(group, 543, y + 24, `${correct} / ${items.length}`);
  }
  if (!trial) ruleArrow(group, 543, 207, 543, 219);
  ruleCard(group, 462, 222, 131, 30, trial ? 'rule-pending rule-response-panel' : 'rule-learned');
  ruleText(group, 527.5, 242, trial ? '선택 대기' : '받침 기준 선택', trial ? 'rule-response rule-small' : 'rule-small');
}

function newPhoto(group, trial) {
  const item = trial ? {id:'4', animal:'grayNew'} : {id:'3', animal:'striped'};
  ruleText(group, 89, 81, '같은 새 사진');
  animal(group, 89, 139, item.animal, false, 1.4);
  ruleText(group, 89, 193, item.id);
  const criteria = [
    [personRule, byEar(item) ? '뾰족귀 보임' : '뾰족귀 안 보임', byEar(item), 'rule-person'],
    [learnedRule, showsStand(item) ? '받침 보임' : '받침 안 보임', byStand(item), 'rule-learned'],
  ];
  for (const [index, [method, observation, prediction, tone]] of criteria.entries()) {
    const y = 74 + index * 85;
    ruleArrow(group, 140, 139, 208, y + 32);
    ruleCard(group, 213, y, 223, 64, tone);
    ruleText(group, 324.5, y + 24, method);
    ruleText(group, 324.5, y + 47, observation);
    ruleArrow(group, 441, y + 32, 460, y + 32);
    ruleCard(group, 465, y + 10, 127, 44, trial ? 'rule-pending rule-response-panel' : 'rule-output');
    ruleText(group, 528.5, y + 37, trial ? '선택 대기' : predictionName(prediction), trial ? 'rule-response rule-small' : '');
  }
}

function cropPhoto(group, trial) {
  const type = trial ? 'round' : 'striped';
  const id = trial ? '7' : '3';
  ruleText(group, 88, 69, '같은 장난감');
  ruleText(group, 231, 69, earRule);
  ruleText(group, 375, 69, standRule);
  ruleText(group, 524, 69, '사람이 확인한 실제');
  ruleCard(group, 459, 82, 131, 139, 'rule-match');
  animal(group, 524, 137, type, false, 1.18);
  ruleText(group, 524, 184, '실제는 장난감');
  for (const [index, crop] of [false, true].entries()) {
    const y = 116 + index * 67;
    const item = {animal: type, crop};
    animal(group, 88, y, type, crop);
    ruleText(group, 44, y + 4, crop ? `${id}′` : id, 'rule-small');
    ruleArrow(group, 122, y, 157, y);
    ruleCard(group, 162, y - 18, 136, 36, 'rule-person');
    ruleText(group, 230, y + 5, predictionName(byEar(item)), 'rule-small');
    const pending = trial && crop;
    ruleCard(group, 307, y - 18, 136, 36, pending ? 'rule-pending rule-response-panel' : 'rule-learned');
    ruleText(group, 375, y + 5, pending ? '선택 대기' : predictionName(byStand(item)), pending ? 'rule-response rule-small' : 'rule-small');
    if (!pending) ruleArrow(group, 445, y, 457, y);
  }
  ruleText(group, 88, 225, '아래쪽 자름', 'rule-small');
}

const draw = [writtenRule, labeledPhotos, compareCriteria, newPhoto, cropPhoto];
for (const [index, step] of lesson.entries()) {
  const template = document.createElement('template');
  template.id = step.readingDiagram.figure;
  const canvas = svg('svg', {viewBox: '0 0 620 280'}, template.content);
  const figure = svg('g', {}, canvas);
  draw[index](svg('g', {class: 'rule-reading'}, figure), false);
  draw[index](svg('g', {class: 'rule-practice'}, figure), true);
  document.body.append(template);
}

function syncRulePractice() {
  const practice = scene.querySelector('.rule-practice');
  if (!practice || state.index < 0) return;
  const step = lesson[state.index];
  const selected = state.answers.get(state.index);
  const correct = selected === step.quiz[1];
  const status = correct ? 'correct' : selected === undefined ? 'waiting' : 'retry';
  if (practice.dataset.status !== status) {
    practice.dataset.status = status;
    const results = state.index === 3 ? [notCat, cat] : state.index === 4 ? [cat] : [step.quiz[1]];
    practice.querySelectorAll('.rule-response').forEach((label, i) => {
      label.textContent = correct ? results[i] : selected === undefined ? '선택 대기' : '다시 선택';
    });
    for (const card of practice.querySelectorAll('.rule-response-panel')) {
      card.classList.toggle('rule-match', correct);
      card.classList.toggle('rule-miss', status === 'retry');
      card.classList.toggle('rule-pending', status === 'waiting');
    }
  }
  const reading = workspace.classList.contains('course-reading');
  const parts = reading ? [step.description] : [step.practiceDescription,
    correct ? step.quiz[3] : status === 'retry' ? feedbackMessages[1] : ''];
  const localized = parts.filter(Boolean).map(part => window.courseI18n?.translate(part) ?? part).join(' ');
  for (const id of ['scene-desc', 'course-diagram-desc']) {
    const node = byId(id);
    if (node && node.textContent !== localized) node.textContent = localized;
  }
}

const practiceChanges = new MutationObserver(syncRulePractice);
practiceChanges.observe(scene, {childList: true});
practiceChanges.observe(workspace, {attributes: true, attributeFilter: ['class']});
practiceChanges.observe(byId('choices'), {childList: true, subtree: true, attributes: true, attributeFilter: ['aria-pressed']});
window.addEventListener('course:lang', syncRulePractice);
</script>
