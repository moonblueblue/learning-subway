<script>
const lesson = {
  "question": "평균 하나로 줄여 저장한 그림은 펼치면 어떻게 될까?",
  "terms": [
    {
      "term": "압축",
      "meaning": "같은 내용을 더 적은 비트로 적는 일",
      "step": 1
    },
    {
      "term": "묶음",
      "meaning": "같은 색이 끊기지 않고 이어진 칸들",
      "step": 1
    },
    {
      "term": "런 길이 부호화(RLE)",
      "meaning": "묶음마다 색과 칸 수를 적는 방법. 이 레슨에서는 색 1비트, 칸 수에서 1을 뺀 값 3비트, 한 묶음 4비트",
      "step": 1
    },
    {
      "term": "값 비트",
      "meaning": "묶음의 앞 1비트. 펼칠 색(0 어두움, 1 밝음)",
      "step": 2
    },
    {
      "term": "길이 필드",
      "meaning": "묶음의 뒤 3비트. 여기에 1을 더한 만큼 칸을 펼친다(000은 1칸, 111은 8칸)",
      "step": 2
    },
    {
      "term": "펼치기(복원)",
      "meaning": "저장한 묶음만 보고 원래 칸을 다시 만드는 일",
      "step": 2
    },
    {
      "term": "손실 압축",
      "meaning": "일부 정보를 버려 더 작게 적는 압축. 펼쳐도 원래대로 돌아오지 않는다",
      "step": 5
    },
    {
      "term": "무손실 압축",
      "meaning": "펼치면 원본이 한 칸도 다르지 않게 돌아오는 압축. 이 레슨의 RLE",
      "step": 5
    }
  ],
  "steps": [
    {
      "label": "같은 색 묶기",
      "title": "같은 색은 한 묶음으로 적을 수 있습니다",
      "body": "친구에게 보낼 카드에 검은색 칸이 여덟 개 이어집니다. 한 칸씩 적는 대신 색과 이어진 칸 수를 한 묶음으로 적을 수 있습니다. 이 방법을 런 길이 부호화(RLE)라고 합니다. 이 예에서는 색에 1비트, 칸 수에서 1을 뺀 값에 3비트를 써서 한 묶음을 4비트로 저장합니다. 3비트로 1~8칸을 담으려면 칸 수에서 1을 뺍니다. 0칸짜리 묶음은 없기 때문입니다. | 표시는 두 필드의 경계이며 저장하지 않습니다.",
      "takeaway": "여덟 칸을 한 번에 감싼 괄호를 보세요. 저장한 한 묶음을 펼치면 위와 같은 줄이 돌아옵니다.",
      "description": "위의 0 여덟 칸을 한 묶음 0111로 저장합니다. 이를 펼친 아래 줄에도 0이 여덟 칸 있습니다.",
      "bookmark": 1,
      "figure": {
        "custom": true
      }
    },
    {
      "label": "4비트 펼치기",
      "title": "두 필드로 같은 여덟 칸을 복원합니다",
      "body": "저장된 0111에서 첫 비트 0은 반복할 값입니다. 뒤의 111은 7을 뜻합니다. 저장할 때 1을 뺐으므로 다시 1을 더해 8칸을 만듭니다. 0을 여덟 번 놓으면 원본이 그대로 돌아옵니다.",
      "takeaway": "앞 비트 0은 색을, 뒤의 111은 반복할 칸 수를 정합니다. 길이 필드에 1을 더한 여덟 칸이 아래에 있습니다.",
      "description": "저장한 0111을 값 0과 길이 필드 111로 나눕니다. 111은 7이고 1을 더하면 길이 8입니다. 값 0을 여덟 칸 펼쳐 원래 행을 복원합니다.",
      "bookmark": 4,
      "figure": {
        "custom": true
      },
      "predict": {
        "prompt": "저장한 0|111의 뒤 세 자리 111은 7입니다. 몇 칸으로 펼쳐질까요?",
        "options": [
          {
            "text": "8칸",
            "why": "저장할 때 칸 수 8에서 1을 빼 7을 적었으니 펼칠 때 1을 더합니다.",
            "correct": true
          },
          {
            "text": "7칸",
            "why": "필드 값을 그대로 칸 수로 읽은 것입니다. 1단계에서 칸 수에서 1을 뺀 값을 적었습니다."
          },
          {
            "text": "3칸",
            "why": "1이 세 개라 세 칸이라고 본 것입니다. 111은 이진수 7입니다."
          }
        ],
        "before": {
          "custom": true,
          "hide": [
            "result"
          ],
          "description": "저장한 4비트의 앞 칸은 0, 뒤 칸은 111입니다. 앞 칸은 반복할 값 0을 가리킵니다."
        }
      }
    },
    {
      "label": "번갈아 나오는 줄",
      "title": "색이 칸마다 바뀌면 묶음이 여덟 개입니다",
      "body": "이번 카드도 여덟 칸이지만 색이 칸마다 바뀝니다. 한 칸이 한 묶음이 되어 4비트짜리 묶음이 여덟 개 필요합니다. 묶음이 여덟 개라 4비트씩 32비트입니다.",
      "takeaway": "저장 칸마다 원본 한 칸이 대응합니다. 떨어져 있는 같은 색은 한 묶음이 되지 않습니다.",
      "description": "01010101의 각 칸이 묶음 하나가 됩니다. 저장에는 32비트가 들고, 펼친 아래 줄은 위의 원래 줄과 같습니다.",
      "bookmark": 2,
      "figure": {
        "custom": true
      },
      "predict": {
        "prompt": "같은 규칙(묶음마다 4비트)으로 01010101을 적으면 몇 비트일까요?",
        "options": [
          {
            "text": "32비트",
            "why": "색이 칸마다 바뀌어 묶음이 여덟 개이고, 8 × 4 = 32입니다.",
            "correct": true
          },
          {
            "text": "8비트",
            "why": "0끼리 한 묶음, 1끼리 한 묶음으로 본 것입니다. 묶음은 이어진 칸만 합칩니다."
          },
          {
            "text": "4비트",
            "why": "앞 줄과 칸 수가 같으니 크기도 같다고 본 것입니다. 크기는 칸 수가 아니라 묶음 수가 정합니다."
          }
        ],
        "before": {
          "custom": true,
          "hide": [
            "result"
          ],
          "description": "원본의 여덟 칸이 0, 1 순서로 번갈아 보입니다."
        }
      }
    },
    {
      "label": "크기 비교",
      "title": "반복이 없으면 오히려 커집니다",
      "bookmark": 5,
      "body": "원본은 8비트입니다. 같은 색 줄은 4비트로 줄었지만, 번갈아 나오는 줄은 32비트로 네 배가 되었습니다. 압축이 늘 줄여 주는 것은 아닙니다. 같은 색이 길게 이어져야 줄어듭니다.",
      "takeaway": "같은 색 줄의 막대는 원본의 절반입니다. 번갈아 나오는 줄의 4비트 조각 여덟 개를 세어 보세요.",
      "description": "원본은 8비트, 같은 색 줄은 4비트, 번갈아 나오는 줄은 32비트입니다. 맨 아래 막대는 4비트 묶음 여덟 개입니다.",
      "figure": {
        "part": "bars",
        "unit": "비트",
        "labelWidth": 146,
        "exactLabels": true,
        "bars": [
          {
            "label": "원본 한 줄",
            "total": 8,
            "segments": [
              {
                "id": "raw",
                "label": "8칸 × 1비트",
                "value": 8,
                "kind": "a"
              }
            ]
          },
          {
            "label": "같은 색 줄 저장",
            "total": 4,
            "segments": [
              {
                "id": "run1",
                "label": "0|111",
                "value": 4,
                "kind": "b"
              }
            ]
          },
          {
            "label": "번갈아 줄 저장",
            "total": 32,
            "segments": [
              {
                "id": "alt1",
                "label": "0|000",
                "value": 4,

const byId = id => document.getElementById(id);
const viewport = byId('scene');
const viewWidth = 620;
const viewHeight = 280;
const center = {x: viewWidth / 2, y: viewHeight / 2};
const camera = {x: 0, y: 0, zoom: 1};
const maxZoom = 2.2;
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
const size = 8;
// Runs of equal values in one row: [[value, count], ...].
function runs(row) {
  const result = [];
  for (const value of row) {
    const last = result[result.length - 1];
    if (last && last[0] === value) last[1]++;
    else result.push([value, 1]);
  }
  return result;
}

const lengthBits = count => (count - 1).toString(2).padStart(3, '0');
const encodeRun = ([value, count]) => `${value}|${lengthBits(count)}`;
const decodeRun = word => ({value: Number(word[0]), count: Number.parseInt(word.slice(1), 2) + 1});
const pixelShades = {
  2: ['#22352f', '#e3f6e9'],
  4: ['#22352f', '#557366', '#9fc2b0', '#e8f8ee'],
};

function figureText(group, x, y, content, className = '') {
  const text = svg('text', { x, y, class: className }, group);
  text.textContent = content;
}

function figureBox(group, cx, cy, width, height, className) {
  svg('rect', { x: cx - width / 2, y: cy - height / 2, width, height, rx: 5, class: className }, group);
}

function verticalArrow(group, x, from, to) {
  svg('path', { d: `M${x} ${from}V${to - 4}`, class: 'figure-wire' }, group);
  svg('path', { d: `M${x - 4} ${to - 7}h8L${x} ${to}Z`, class: 'figure-tip' }, group);
}

function horizontalArrow(group, from, to, y) {
  svg('path', { d: `M${from} ${y}H${to - 4}`, class: 'figure-wire' }, group);
  svg('path', { d: `M${to - 7} ${y - 4}v8L${to} ${y}Z`, class: 'figure-tip' }, group);
}

const rowCenter = (index) => 68 + index * 69;

function pixelTile(group, cx, cy, length, value, levels) {
  const shade = pixelShades[levels][value];
  svg('rect', { x: cx - length / 2, y: cy - length / 2, width: length, height: length,
    rx: 3, fill: shade, stroke: '#799688' }, group);
  const dark = levels === 2 ? value === 0 : value < 2;
  figureText(group, cx, cy + 6, value, `figure-digit${dark ? ' figure-light-text' : ''}`);
}

function drawGroupedRow(group, row, accepted, expanded) {
  const parts = runs(row);
  const stored = parts.slice(0, accepted).map(encodeRun);
  figureText(group, 310, 53, '원본 8비트');
  row.forEach((bit, i) => {
    pixelTile(group, rowCenter(i), 95, 36, bit, 2);
    figureText(group, rowCenter(i), 75, i + 1, 'figure-index');
  });
  let position = 0;
  parts.slice(0, accepted).forEach(([value, count], i) => {
    const left = rowCenter(position) - 17;
    const right = rowCenter(position + count - 1) + 17;
    const center = (left + right) / 2;
    svg('path', { d: `M${left} 116v6H${right}v-6`, class: 'figure-bracket' }, group);
    verticalArrow(group, center, 122, 140);
    figureBox(group, center, 158, 62, 32, 'figure-field');
    figureText(group, center, 164, stored[i], 'figure-bit');
    figureText(group, center, 191, `${value}×${count}`, 'figure-bit');
    position += count;
  });
  if (accepted === parts.length) {
    const sizeLabel = parts.length === 1 ? '저장 4비트' : '저장 32비트';
    figureText(group, 310, 213, sizeLabel);
  }
  if (!expanded) return;
  const restored = stored.flatMap((code) => {
    const {value, count} = decodeRun(code.replace('|', ''));
    return Array(count).fill(value);
  });
  restored.forEach((bit, i) => pixelTile(group, rowCenter(i), 242, 32, bit, 2));
  figureText(group, 310, 275, restored.join('') === row.join('') ? '펼친 줄 = 원본 8칸' : '펼친 줄이 원본과 다릅니다');
}

function drawRestoreRow(group, word, hidden) {
  const { value, count } = decodeRun(word);
  figureText(group, 310, 63, '저장 4비트');
  figureText(group, 170, 100, '값 1비트');
  // Before the answer the field is only 'the last 3 bits': its name 'length−1' would say to add one (card).
  figureText(group, 450, 100, hidden ? '뒤 3비트' : '길이−1 (3비트)');
  figureBox(group, 170, 126, 76, 32, 'figure-field');
  figureBox(group, 450, 126, 109, 32, 'figure-length');
  figureText(group, 170, 132, value, 'figure-digit');
  figureText(group, 450, 132, word.slice(1), 'figure-digit');
  figureText(group, 170, 173, `반복할 값 ${value}`);
  verticalArrow(group, 170, 144, 156);
  if (hidden) return;
  figureText(group, 450, 173, `${count - 1} + 1 = ${count}`, 'figure-bit');
  verticalArrow(group, 450, 144, 156);
  svg('path', { d: 'M170 178v13H450v-13', class: 'figure-wire' }, group);
  verticalArrow(group, 310, 191, 209);
  for (let i = 0; i < size; i++) {
    if (i < count) pixelTile(group, rowCenter(i), 234, 38, value, 2);
    else figureBox(group, rowCenter(i), 234, 38, 38, 'figure-empty');
  }
  figureText(group, 310, 276, `복원 ${count}비트`);
}

function drawBlock(group, values, cx, cy, tileSize) {
  for (let i = 0; i < 4; i++) {
    const x = cx + (i % 2 - .5) * (tileSize + 3);
    const y = cy + (Math.floor(i / 2) - .5) * (tileSize + 3);
    if (values) pixelTile(group, x, y, tileSize, values[i], 4);
    else figureBox(group, x, y, tileSize, tileSize, 'figure-empty');
  }
}

function drawLossyBlock(group, hidden) {
  figureText(group, 99, 86, '원본 · 8비트');
  figureText(group, 310, 86, '저장값 · 2비트');
  figureText(group, 521, 86, '펼친 뒤');
  drawBlock(group, [0, 2, 2, 0], 99, 151, 44);
  drawBlock(group, hidden ? null : [1, 1, 1, 1], 521, 151, 44);
  figureBox(group, 310, 151, 206, 59, 'figure-result');
  figureText(group, 310, 144, '(0 + 2 + 2 + 0) ÷ 4', 'figure-bit');
  figureText(group, 310, 168, '저장: 평균 1');
  horizontalArrow(group, 152, 198, 151);
  horizontalArrow(group, 422, 466, 151);
  if (!hidden) figureText(group, 521, 224, '0 → 1 · 2 → 1');
  figureText(group, 310, 260, '8×8 전체: 2×2 칸 16개 × 2비트 = 32비트');
}

function drawFigure(index, {hide}) {
  const group = svg('g', {class: 'compression-figure'}, byId('figure'));
  const hidden = hide.includes('result');
  if (index === 0) drawGroupedRow(group, [0, 0, 0, 0, 0, 0, 0, 0], 1, true);
  else if (index === 1) drawRestoreRow(group, '0111', hidden);
  else if (index === 2) drawGroupedRow(group, [0, 1, 0, 1, 0, 1, 0, 1], hidden ? 0 : 8, !hidden);
  else drawLossyBlock(group, hidden);
}
byId('zoom-in').onclick = () => zoomBy(.3);
byId('zoom-out').onclick = () => zoomBy(-.3);
enableCameraDrag();
viewport.addEventListener('keydown', event => {
  if (event.altKey || event.ctrlKey || event.metaKey) return;
  const pan = {ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1]}[event.key];
  if (pan && camera.zoom > 1) {
    event.preventDefault();
    setCamera(camera.x + pan[0] * 18, camera.y + pan[1] * 18, camera.zoom);
  } else if (event.key === '+' || event.key === '-' || event.key === '0') {
    event.preventDefault();
    if (event.key === '0') resetView();
    else zoomBy(event.key === '+' ? .3 : -.3);
  }
});
setCamera(0, 0, 1);
</script>
