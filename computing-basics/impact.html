<style>
:root{color-scheme:light;--ink:#142620;--muted:#43574f;--border:#cbd9d0;--paper:#f4f7ef;--panel:#fff;--accent:#0f766e;--request:#187959;--response:#5362a0;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.65 system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled,button[aria-disabled=true]{cursor:default;opacity:.5}
:focus-visible{outline:3px solid #a24c14;outline-offset:3px}
.shell{max-width:1280px;margin:auto;padding:clamp(16px,2.5vw,32px)}
header{margin-bottom:20px}
h1,h2,p{margin:0}
.eyebrow{color:var(--accent);font-size:.875rem;font-weight:700;margin-bottom:6px}
h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.12;letter-spacing:-.065em}
header p.lead{color:var(--muted);margin-top:10px}
.workspace{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(360px,1fr);gap:20px;align-items:stretch}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:18px;overflow:hidden}
.actions,.navigation{display:flex;gap:8px;flex-wrap:wrap}
.action{border:1px solid #9fb7a9;background:white;border-radius:9px;padding:7px 12px;min-height:44px;font-size:.875rem;font-weight:650}
.action:hover:not(:disabled):not([aria-disabled=true]){background:#e4f3f1}
.primary{background:var(--accent);color:white;border-color:var(--accent)}
.primary:hover:not(:disabled){background:#115e59}
.timeline{padding:15px 18px}
.timeline-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.timeline-top span{font:700 .875rem var(--mono);color:var(--muted)}
.steps{list-style:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:0;margin:0;gap:8px}
.steps button{height:100%;min-height:52px;text-align:left;width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:#f6f8f5;font-size:.875rem;line-height:1.45;display:flex;gap:7px;align-items:center}
.steps button:hover{border-color:var(--accent)}
.steps button[aria-current=step]{background:#d5efeb;border-color:var(--accent);font-weight:750}
.step-number{font:700 .875rem var(--mono);color:var(--accent)}
.explanation{padding:clamp(20px,2.4vw,32px);display:flex;flex-direction:column;gap:20px}
.explanation h2{font-size:clamp(1.5rem,2.3vw,2.1rem);letter-spacing:-.055em;line-height:1.3}
.explanation p{color:var(--muted);font-size:1.0625rem;line-height:1.75}
.takeaway p{font-size:1rem}
.takeaway{padding:12px 14px;background:#e9f5f3;border-left:3px solid var(--accent);border-radius:0 9px 9px 0}
.takeaway strong{display:block;color:var(--accent);font-size:.875rem}
.navigation{justify-content:space-between;margin-top:auto;padding-top:8px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.stage-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.stage-top h2{font-size:1rem}
.score{color:var(--accent);font:700 .875rem var(--mono)}
.case{margin:18px;padding:16px 18px;border-radius:14px;background:#e9f5f3;border:1px solid var(--border);display:grid;gap:6px}
.case strong{color:var(--accent);font-size:.875rem}
.case p{font-size:1.125rem;line-height:1.6;color:var(--ink)}
.items{list-style:none;margin:0;padding:0 18px 18px;display:grid;gap:10px}
.item{border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:grid;gap:8px;background:#fff}
.item-top{display:flex;gap:10px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.item-text{font-size:1rem;font-weight:600;flex:1 1 280px}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choice{min-width:68px}
.choice[aria-pressed=true]{border-color:var(--accent);background:#d2f4dd;color:#0f5a3c}
.choice.risk[aria-pressed=true]{border-color:#a24c14;background:#fff1e4;color:#8a3d0f}
.feedback{font-size:.9375rem;color:var(--muted);line-height:1.6}
.feedback:empty{display:none}
.feedback b{margin-right:4px}
.item.right{border-color:var(--accent);background:#f6fbf7}

.item.wrong{border-color:#a24c14;background:#fffaf5}

.think{margin:0 18px 18px;padding:14px 16px;border-radius:12px;border:1px dashed #9fb7a9;display:grid;gap:10px}
.think label{font-weight:700}
.think textarea{font:inherit;min-height:84px;padding:10px 12px;border:1px solid #9fb7a9;border-radius:10px;resize:vertical}
.think .sample-answer{color:var(--muted);line-height:1.7}
.think .sample-answer[hidden]{display:none}
.done{margin:0 18px 18px;padding:12px 14px;border-radius:10px;background:#d2f4dd;color:#0f5a3c;font-weight:700}
.done[hidden]{display:none}
.timeline{border-top:1px solid var(--border)}
.cause-map{display:grid;gap:8px;margin:12px 0}
.cause-row{display:grid;grid-auto-columns:minmax(0,1fr);grid-auto-flow:column;gap:12px;margin:0;padding:0;list-style:none}
.cause-row li{position:relative;display:grid;place-items:center;min-height:42px;padding:6px;border:1px solid var(--border);border-radius:8px;background:#ecf4ed;text-align:center;font-size:.9rem;line-height:1.35}
.cause-row li+li::before{content:"→";position:absolute;left:-13px;color:var(--accent)}
.cause-row li:last-child{border-color:#9db5a6;background:#d9eee4;font-weight:650}
.location-trail{display:block;width:100%;max-height:88px;background:#edf5ee;border-radius:8px}
.location-trail text{fill:var(--ink);font:600 19px system-ui,sans-serif;text-anchor:middle}
</style>

<main class="shell">
  <header>
    <p class="eyebrow">0장 컴퓨팅 둘러보기 · 레슨 0.8 · 실습</p>
    <h1>컴퓨팅의 영향</h1>
    <p class="lead">기술이 사람과 사회에 주는 이익과 위험은 무엇일까요? 실제로 있을 법한 사례를 읽고, 문장마다 이익인지 위험인지 골라 보세요.</p>
  </header>
  <div class="workspace">
    <div>
      <section class="panel" aria-labelledby="practice-heading">
        <div class="stage-top"><h2 id="practice-heading">이익일까, 위험일까</h2><span class="score" id="score" aria-live="polite"></span></div>
        <div class="case"><strong>사례</strong><p id="case"></p></div>
        <ol class="items" id="items"></ol>
        <p class="done" id="done" role="status" hidden></p>

          <div><button class="action" id="reveal" type="button" aria-expanded="false">예시 답 보기</button></div>

          <ol class="steps" id="steps"></ol>

      </section>
    </div>
    <section class="panel explanation" aria-labelledby="step-title">

      <div class="takeaway"><strong>앞 레슨과 이어 보기</strong><p id="takeaway"></p></div>
      <nav class="navigation" aria-label="이전 및 다음 단계"><button class="action" id="prev" type="button">이전 단계</button><button class="action primary" id="next" type="button">다음 단계</button></nav>
    </section>
  </div>
  <div class="sr-only" id="announcement" role="status"></div>
</main>
<script>
const storageKey = 'impact-lab:v1:step';
const BENEFIT = 'benefit', RISK = 'risk';

// Each step is one case. Every statement has the expected answer and an explanation shown after a choice.
const lesson = [
  {
    label: '개인정보',
    locationTrail: true,
    example: ["위치를 1분마다 전송", "서버에 시각과 위치가 누적", "한 사람의 이동 경로 추정 가능"],
    title: '편리함 뒤에는 쌓이는 기록이 있다',
    body: '앱이 편리해질수록 우리에 대한 데이터를 더 많이 모읍니다. 데이터는 한 번 보내면 여러 기계를 거쳐 저장되고, 지우기 어렵습니다. 그래서 무엇을 모으는지, 누가 볼 수 있는지, 얼마나 오래 두는지를 따져야 합니다.',
    link: '0.7에서 패킷이 여러 라우터와 서버를 거치는 것을 보았습니다. 위치 기록도 그렇게 서버까지 가서 저장됩니다.',
    case: '친구 찾기 앱이 내 위치를 1분마다 서버로 보내 친구들에게 보여 준다.',
    items: [
      { text: '약속 장소에서 서로를 쉽게 찾을 수 있다.', answer: BENEFIT, why: '실시간 위치는 만남과 안전에 실제로 도움이 됩니다.' },
      { text: '내가 매일 어디에 가는지 기록이 계속 쌓인다.', answer: RISK, why: '집, 학교, 병원처럼 민감한 장소까지 드러나는 생활 기록이 됩니다.' },
      { text: '서버가 해킹되면 위치 기록이 통째로 새어 나갈 수 있다.', answer: RISK, why: '모아 둔 데이터가 많을수록 유출되었을 때 피해도 큽니다.' },
      { text: '길을 잃은 아이를 보호자가 바로 찾을 수 있다.', answer: BENEFIT, why: '같은 기능이 사람을 보호하는 데 쓰이기도 합니다.' },
    ],
    question: '이 앱을 쓴다면 어떤 설정이 있으면 좋을까요?',
    sample: '친구마다 공유 여부를 따로 정하기, 정해진 시간에만 공유하기, 위치 기록을 일정 기간 뒤 자동으로 지우기, 정확한 위치 대신 "근처" 정도만 보여 주기 같은 설정이 있습니다. 필요한 만큼만 모으는 것을 "데이터 최소화"라고 합니다.',
  },
  {
    label: '공정성',
    causeRows: [["과거 합격 기록", "선별 기준 학습", "새 지원서 선별"], ["한 집단의 합격 기록이 적음", "같은 치우침이 이어질 수 있음"]],
    example: ["과거 합격자에 한 집단이 적음", "과거 선택을 학습", "새 지원자에게 편향이 이어질 수 있음"],
    title: '데이터로 배운 규칙은 데이터의 치우침도 배운다',
    body: '프로그램이 과거 데이터에서 규칙을 스스로 배우면, 데이터에 섞인 사람들의 치우침까지 그대로 따라 할 수 있습니다. 게다가 수천 건을 한꺼번에 처리하므로, 사람 한 명의 실수보다 훨씬 넓게 퍼집니다.',
    link: '0.6에서 알고리즘은 문제를 푸는 정확한 절차라고 했습니다. 절차가 정확해도 그 절차를 만든 데이터가 치우쳐 있으면 결과도 치우칩니다.',
    case: '지원서를 자동으로 걸러 주는 프로그램이 지난 10년 동안의 합격자 자료로 규칙을 배웠다.',
    items: [
      { text: '지원서 수천 장을 몇 분 만에 읽는다.', answer: BENEFIT, why: '사람이 며칠 걸릴 일을 빠르게 처리합니다.' },
      { text: '과거 합격자가 한쪽 성별에 치우쳐 있었다면 그 치우침도 배운다.', answer: RISK, why: '실제로 이런 이유로 사용을 멈춘 채용 프로그램 사례가 있습니다.' },
      { text: '떨어진 사람에게 왜 떨어졌는지 설명하기 어렵다.', answer: RISK, why: '스스로 배운 규칙은 사람이 읽기 어려워 이의를 제기하기도 어렵습니다.' },
      { text: '모든 지원서에 같은 기준을 똑같이 적용한다.', answer: BENEFIT, why: '기분이나 피로에 흔들리지 않는 일관성은 장점입니다. 다만 그 기준 자체가 공정한지는 따로 확인해야 합니다.' },
    ],
    question: '이 프로그램을 공정하게 쓰려면 무엇을 확인해야 할까요?',
    sample: '배운 데이터가 여러 집단을 고르게 담고 있는지, 집단별 합격률에 큰 차이가 없는지 정기적으로 검사하기, 최종 결정은 사람이 하기, 떨어진 사람이 이유를 묻고 다시 검토를 요청할 수 있게 하기 같은 방법이 있습니다.',
  },
  {
    label: '접근성',
    causeRows: [["같은 영상", "음성만", "듣기 어려우면 내용 놓침"], ["같은 영상", "음성과 자막", "같은 내용을 읽음"]],

    title: '설계에 따라 기술은 사람을 잇기도, 막기도 한다',
    body: '화면 낭독기, 자막, 글자 크기 조절 같은 기술은 장애가 있는 사람도 컴퓨터를 쓸 수 있게 합니다. 하지만 만드는 사람이 이를 고려하지 않으면 같은 기술이 오히려 누군가를 밀어냅니다. 접근성은 처음부터 설계에 넣어야 합니다.',

    case: '시각장애가 있는 사람이 화면 낭독기로 쇼핑 앱을 쓰고, 청각장애가 있는 사람이 자동 자막으로 강의를 본다.',
    items: [
      { text: '앞이 보이지 않아도 글을 소리로 들으며 웹을 쓸 수 있다.', answer: BENEFIT, why: '화면 낭독기는 화면의 글을 읽어 주고 키보드로 조작하게 해 줍니다.' },
      { text: '상품 사진에 설명 글이 없으면 낭독기는 "이미지"라고만 읽는다.', answer: RISK, why: '만드는 사람이 대체 설명을 빠뜨리면 그 정보는 전달되지 않습니다.' },

  {

    example: ["클라우드에 계산 요청", "서버가 전력·냉각 사용", "사용자 화면 밖에서도 비용 발생"],

      { text: '온라인 회의가 늘어 출장과 이동이 줄었다.', answer: BENEFIT, why: '이동이 줄면 시간과 탄소 배출이 함께 줄어듭니다.' },
      { text: '데이터센터가 많은 전기와 냉각수를 쓴다.', answer: RISK, why: '전 세계 데이터센터의 전력 사용은 계속 늘고 있습니다.' },
      { text: '바꾼 지 몇 년 안 된 기기들이 버려져 전자 폐기물이 쌓인다.', answer: RISK, why: '전자 폐기물에는 해로운 물질과 귀한 금속이 함께 들어 있어 재활용이 중요합니다.' },
    ],
    question: '개발자로서 줄일 수 있는 영향은 무엇일까요?',
    sample: "불필요한 계산과 데이터 전송을 줄이고, 오래된 기기에서도 돌아가게 만들어 기기 교체를 늦출 수 있습니다.",
  },
  {
    label: "일",
    title: "자동화하면 사람이 맡는 업무가 달라진다",
    causeRows: [["같은 서류", "자동화 전", "사람이 반복 입력과 예외를 모두 처리"], ["같은 서류", "자동화 후", "프로그램이 입력 · 사람이 예외 검토"]],
    example: ["반복되는 서류 입력", "프로그램이 기본 입력을 맡음", "사람은 예외를 검토"],
    body: "반복되는 서류 입력을 자동화하면 프로그램이 정해진 입력을 처리합니다. 규칙에 맞지 않는 예외는 사람이 검토할 수 있습니다. 자동화는 기존 직무를 없애거나 새 역할을 만들 수도 있습니다.",
    link: "0.6에서 본 것처럼 컴퓨터는 정해진 절차를 반복합니다. 어느 일을 맡길지는 사람이 결정합니다.",
    case: "회사가 반복되는 서류 입력을 프로그램으로 자동화하고 예외는 담당자에게 보낸다.",
    items: [
      { text: '반복 업무를 하던 사람의 일자리가 바뀌거나 줄어든다.', answer: RISK, why: '새로운 일자리도 생기지만, 바뀌는 사람에게는 배울 기회와 지원이 필요합니다.' },
      { text: "담당자가 반복 입력 대신 예외 검토에 시간을 쓸 수 있다.", answer: BENEFIT, why: "정해진 입력이 줄어들면 판단이 필요한 업무에 시간을 쓸 수 있습니다." },
    ],
    question: "사람이 계속 검토해야 할 서류는 어떤 것일까요?",
    sample: "규칙에 맞지 않는 서류나 한 번의 실수가 큰 영향을 주는 서류를 담당자가 검토할 수 있습니다.",
  },
];

const byId = (id) => document.getElementById(id);
const state = { index: 0, picks: lesson.map((step) => step.items.map(() => null)) };

function drawLocationTrail() {
  const scene = document.createElement('template');
  scene.innerHTML = `<svg class="location-trail" viewBox="0 0 420 100" role="img" aria-label="1분마다 위치가 기록되어 한 사람의 이동 경로가 드러납니다.">
    <path d="M56 49 L196 24 L361 57" fill="none" stroke="#187959" stroke-width="4" stroke-dasharray="8 5"/>
    <g fill="#187959"><circle cx="56" cy="49" r="7"/><circle cx="196" cy="24" r="7"/><circle cx="361" cy="57" r="7"/></g>
    <text x="56" y="79">12:00 · 광장</text><text x="196" y="54">12:01 · 길목</text><text x="361" y="87">12:02 · 도서관</text>
  </svg>`;
  return scene.content;
}

function showStep(index, announce = true) {
  state.index = index;
  const step = lesson[index];
  byId('step-title').textContent = step.title;
  byId('body').textContent = step.body;
  byId('takeaway').textContent = step.link;
  byId('case').textContent = step.case;
  const causeMap = byId('cause-map');
  if (step.locationTrail) causeMap.replaceChildren(drawLocationTrail());
  else causeMap.replaceChildren(...step.causeRows.map((labels) => {
    const list = document.createElement('ol');
    list.className = 'cause-row';
    for (const label of labels) {
      const cell = document.createElement('li');
      cell.textContent = label;
      list.append(cell);
    }
    return list;
  }));
  byId('question').textContent = step.question;
  byId('sample').textContent = step.sample;
  byId('sample').hidden = true;
  byId('reveal').setAttribute('aria-expanded', 'false');
  byId('reveal').textContent = '예시 답 보기';
  byId('answer').value = '';
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  stepButtons.forEach((button, i) => {
    if (i === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  buildItems();
  try { localStorage.setItem(storageKey, String(index)); } catch {}
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${step.title}`;
}

function buildItems() {
  const step = lesson[state.index];
  const list = byId('items');
  list.replaceChildren();
  step.items.forEach((item, i) => {
    const li = document.createElement('li');
    li.className = 'item';
    const top = document.createElement('div');
    top.className = 'item-top';
    const text = document.createElement('span');
    text.className = 'item-text';
    text.id = `item-${i}`;
    text.textContent = item.text;
    const choices = document.createElement('div');
    choices.className = 'choices';
    choices.setAttribute('role', 'group');
    choices.setAttribute('aria-labelledby', text.id);
    for (const [value, label] of [[BENEFIT, '이익'], [RISK, '위험']]) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = `action choice ${value}`;
      button.textContent = label;
      button.dataset.value = value;
      button.addEventListener('click', () => pick(i, value));
      choices.append(button);
    }
    const feedback = document.createElement('p');
    feedback.className = 'feedback';
    feedback.setAttribute('role', 'status');
    top.append(text, choices);
    li.append(top, feedback);
    list.append(li);
  });
  syncItems();
}

function pick(i, value) {
  state.picks[state.index][i] = value;
  syncItems();
  const item = lesson[state.index].items[i];
  byId('announcement').textContent = value === item.answer ? '맞았습니다.' : '다시 생각해 보세요.';
}

function syncItems() {
  const step = lesson[state.index];
  const picks = state.picks[state.index];
  [...byId('items').children].forEach((li, i) => {
    const item = step.items[i];
    const picked = picks[i];
    li.classList.toggle('right', picked === item.answer);
    li.classList.toggle('wrong', picked !== null && picked !== item.answer);
    for (const button of li.querySelectorAll('.choice')) button.setAttribute('aria-pressed', String(button.dataset.value === picked));
    const feedback = li.querySelector('.feedback');
    feedback.replaceChildren();
    if (picked !== null) {
      const mark = document.createElement('b');
      mark.textContent = picked === item.answer ? '✓ 맞았습니다.' : '✗ 다시 생각해 보세요.';
      feedback.append(mark, picked === item.answer ? item.why : '');
    }
  });
  const right = picks.filter((p, i) => p === step.items[i].answer).length;
  byId('score').textContent = `${right} / ${step.items.length} 맞힘`;
  byId('done').hidden = right !== step.items.length;
  byId('done').textContent = '✓ 이 사례의 문장을 모두 맞게 나눴습니다. 아래 질문도 생각해 보세요.';
}

byId('reveal').onclick = () => {
  const open = byId('sample').hidden;
  byId('sample').hidden = !open;
  byId('reveal').setAttribute('aria-expanded', String(open));
  byId('reveal').textContent = open ? '예시 답 숨기기' : '예시 답 보기';
};

function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/impact/${index + 1}`);
  showStep(index);
}
function routeIndex() {
  const match = /^#\/impact\/(\d+)$/.exec(location.hash);
  const routed = match ? Number(match[1]) - 1 : -1;
  if (routed >= 0 && routed < lesson.length) return routed;
  try {
    const stored = localStorage.getItem(storageKey);
    const index = Number(stored);
    if (stored !== null && Number.isInteger(index) && index >= 0 && index < lesson.length) return index;
  } catch {}
  return 0;
}
const stepButtons = lesson.map(({ label }, index) => {
  const listItem = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  const number = document.createElement('span');
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.addEventListener('click', () => goToStep(index));
  listItem.append(button);
  byId('steps').append(listItem);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
window.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});
const initial = routeIndex();
history.replaceState(null, '', `#/impact/${initial + 1}`);
showStep(initial, false);
</script>
</body>
</html>
