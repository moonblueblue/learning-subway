<title>페이지 테이블 · 레슨 3.2</title>
<style>
:root{color-scheme:light;--ink:#142620;--muted:#43574f;--border:#cbd9d0;--paper:#f4f7ef;--panel:#fff;--accent:#0f766e;--request:#187959;--response:#5362a0;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.65 system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled,button[aria-disabled=true]{cursor:default;opacity:.5}
:focus-visible{outline:3px solid #a24c14;outline-offset:3px}
.shell{max-width:1280px;margin:auto;padding:clamp(16px,2.5vw,32px)}
header{margin-bottom:20px}
h1,h2,p{margin:0}
.eyebrow{color:var(--accent);font-size:.875rem;font-weight:700;margin-bottom:6px}
h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.12;letter-spacing:-.065em}
header p.lead{color:var(--muted);margin-top:10px}
.workspace{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(360px,1fr);gap:20px;align-items:stretch}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:18px;overflow:hidden}
.stage-top,.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;flex-wrap:wrap}
.stage-top h2,.timeline h2{font-size:1rem}
.status{color:var(--accent);font-size:.875rem;font-weight:700}
.stage{background:#eaf3eb;border-block:1px solid var(--border)}
svg{display:block;width:100%;height:auto;max-height:520px}
#scene{user-select:none}
#scene:focus-visible{outline-offset:-4px}
#scene.is-zoomed{cursor:grab;touch-action:none}

.hands-on{padding:14px 18px;border-bottom:1px solid var(--border);display:grid;gap:12px}
.try{display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:#e9f5f3;border-left:3px solid var(--accent);border-radius:0 9px 9px 0;min-height:64px}

.switch-actions{display:flex;gap:8px;align-items:center}

.view-scale{min-width:4ch;text-align:center;color:var(--muted);font:700 .875rem var(--mono)}

.switch .left{fill:#d3dad6;stroke:#8c9d96}
.switch .right{fill:#b9c4be;stroke:#8c9d96}
.switch .top{fill:#eef1ef;stroke:#8c9d96}

.switch.on .right{fill:#78b592;stroke:#4f8f6b}
.switch.on .top{fill:#d2f4dd;stroke:#4f8f6b}
.switch .glow{fill:#4fcf87;opacity:0}
.switch.on .glow{opacity:.55}
.switch .digit{font:700 12px var(--mono);text-anchor:middle;dominant-baseline:central;fill:#7c8c85}
.switch.on .digit{fill:#0f5a3c}
.switch.on .tag rect{stroke:var(--accent)}
.switch.on .tag text{fill:var(--accent)}
.casing{fill:none;stroke:#eaf3eb;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;opacity:.9}

.wire.signal{stroke:var(--request);stroke-width:2.6}

.steps{list-style:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0;margin:0;gap:8px}
.steps button{height:100%;min-height:52px;text-align:left;width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:#f6f8f5;font-size:.875rem;line-height:1.45;display:flex;gap:7px;align-items:center}

.step-number{font:700 .875rem var(--mono);color:var(--accent)}
.explanation{padding:clamp(20px,2.4vw,32px);display:flex;flex-direction:column;gap:20px}
.explanation h2{font-size:clamp(1.5rem,2.3vw,2.1rem);letter-spacing:-.055em;line-height:1.3}
.explanation p{color:var(--muted);font-size:1.0625rem;line-height:1.75}
.takeaway p{font-size:1rem}

.takeaway strong{display:block;color:var(--accent);font-size:.875rem}
.navigation{justify-content:space-between;margin-top:auto;padding-top:8px}

.cell .face{stroke:#8c9d96;stroke-width:.8;transition:fill .2s}
.cell.empty .left{fill:#d3dad6}.cell.empty .right{fill:#b9c4be}.cell.empty .top{fill:#eef1ef}
.cell.used .left{fill:#e6ebe8}.cell.used .right{fill:#cfd8d4}.cell.used .top{fill:#ffffff}
.cell.changed .top{animation:flash 1s ease-out}
@keyframes flash{0%{fill:#bfeccc}100%{fill:#ffffff}}
.cell-value{font:700 12px var(--mono);text-anchor:middle;dominant-baseline:central;fill:#142620}
.cell.empty .cell-value{fill:#9aa8a2}
.address{font:600 9px var(--mono);fill:#6b7d76;text-anchor:start}
.tag.name{transition:opacity .25s}
.tag.name rect{stroke:var(--accent);stroke-width:1.1}
.tag.name text{fill:var(--accent);font-weight:700}
.bus{fill:none;stroke:#b9cdc2;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bus.active{stroke:#7fa891}
.packet-group.read .packet,.packet-group.read .packet-halo{fill:var(--response)}
.packet-group.write .packet,.packet-group.write .packet-halo{fill:var(--request)}
.packet-group.read .packet-label{fill:#3b4880}
.code-area{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
.code{list-style:none;counter-reset:line;margin:0;padding:10px 0;background:#1f2d29;border-radius:12px;color:#e8f2ec;font:600 1rem/1.5 var(--mono);flex:1 1 300px}
.code li{counter-increment:line;padding:5px 14px 5px 46px;position:relative}
.code li::before{content:counter(line);position:absolute;left:16px;color:#6f8a80}
.code li.done{color:#8fa79c}
.code li.current{background:#2f4a41;color:#ffffff}
.code li.current::after{content:'다음';position:absolute;right:14px;color:#9fe3b6;font-size:.8125rem}
.code-actions{display:flex;flex-direction:column;gap:8px;justify-content:flex-start}
.try-choices{display:flex;gap:6px;flex-wrap:wrap}

.dot.read{background:var(--response);border-color:var(--response)}
.dot.write{background:var(--request);border-color:var(--request)}

.part.control .left{fill:#eadcf0;stroke:#9a77ad}.part.control .right{fill:#d9c4e3;stroke:#9a77ad}.part.control .top{fill:#f7f0fa;stroke:#9a77ad}

.packet-group.inner .packet-label{fill:#5f3a73}

.memory-list li.ir{background:#2f4a41}

.memory-list .mark{margin-left:auto;color:#9fe3b6;font-size:.8125rem}

.packet{stroke:white;stroke-width:1.6;fill:var(--request)}

.station.cpu.active .top{fill:#8a7d4a}
.station.error.error .top{fill:#f6b893;stroke:#a24c14}

.tag.holds.error rect{stroke:#a24c14;fill:#fff6ef}.tag.holds.error text{fill:#a24c14}

.packet-halo{opacity:.22;fill:var(--request)}
.packet-label{font:700 9.5px var(--mono);fill:#0f5a3c;text-anchor:middle;paint-order:stroke;stroke:#eaf3eb;stroke-width:3px;stroke-linejoin:round}

<body>
<main class="shell">
  <header>
    <p class="eyebrow">운영체제 3장 메모리 · 레슨 3.2</p>
    <h1>페이지 테이블</h1>
    <p class="lead">가상 주소 하나를 실제 주소로 바꾸려면 MMU는 어떤 표를 몇 번 읽을까요? 주소가 표를 차례로 지나 RAM에 닿는 길을 한 정거장씩 따라가 보세요.</p>
  </header>
  <div class="workspace">
    <div>
      <section class="panel" aria-labelledby="stage-heading">
        <div class="stage-top"><h2 id="stage-heading">프로그램, MMU, 페이지 표, RAM</h2></div>
        <div class="stage">
          <svg id="scene" viewBox="0 0 620 280" role="img" tabindex="0" aria-labelledby="scene-title scene-desc">
            <title id="scene-title">MMU가 가상 주소를 나눠 페이지 표를 차례로 읽고 RAM의 실제 주소에 닿는 장면</title><desc id="scene-desc"></desc>
            <defs>
              <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
              <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
              <radialGradient id="grid-fade"><stop offset=".45" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
              <mask id="grid-mask"><rect x="-460" y="-260" width="920" height="520" fill="url(#grid-fade)"/></mask>
            </defs>
            <g id="world" aria-hidden="true">
              <path id="grid" class="iso-grid" mask="url(#grid-mask)"></path>
              <g id="casings"></g><g id="links"></g><g id="nodes"></g><g id="packets"></g>
            </g>
          </svg>
        </div>
        <div class="hands-on">
          <div class="try" id="try">
            <p><strong>해 보기</strong><span id="try-text"></span></p>
            <p class="try-result" id="try-result" role="status"></p>
            <div class="try-choices" id="try-choices" role="group" aria-label="예측 고르기"></div>
          </div>
          <p class="readout" id="readout"></p>
          <div class="code-area">
            <div class="memory-panel work-panel" id="work-panel">
              <ol class="stage-list" id="stage-list" aria-label="정거장"></ol>
              <p class="work-title" id="work-title"></p>
              <ol class="code memory-list work" id="work" aria-label="지금 코드의 모습"></ol>
            </div>
            <div class="code-actions">
              <button class="action primary" id="run-stage" type="button">다음 단계</button>
              <button class="action" id="restart" type="button">처음부터</button>
            </div>
          </div>
        </div>
        <div class="view-controls" role="group" aria-label="장면 보기">
          <button class="action" id="zoom-out" type="button" aria-label="장면 축소">−</button>
          <output class="view-scale" id="view-scale" aria-label="현재 배율" aria-live="off">100%</output>
          <button class="action" id="zoom-in" type="button" aria-label="장면 확대">+</button>
          <span class="view-hint">확대 후 드래그로 이동</span>
        </div>
        <div class="controls">
          <div class="legend" aria-label="범례"><span><i class="dot userdot"></i>사용자 영역</span><span><i class="dot kerneldot"></i>커널 영역</span></div>
        </div>
        <nav class="timeline" aria-labelledby="timeline-heading">
          <div class="timeline-top"><h2 id="timeline-heading">타임라인</h2><span id="count"></span></div>
          <ol class="steps" id="steps"></ol>
        </nav>
      </section>
    </div>
    <section class="panel explanation" aria-labelledby="step-title">

function buildScene() {
  for (const id of ['casings', 'links', 'nodes', 'packets']) byId(id).replaceChildren();
  plates = [];
  packets = [];
  views = {};
  const stations = lesson[state.index].stations;
  const far = (stations.length - 1) * gap;
  // User space and kernel space, split between the first station and the system-call gate.
  const border = (lesson[state.index].kernelFrom - .5) * gap;
  const zone = (u0, u1, cls, label) => {
    svg('polygon', { class: 'zone ' + cls, points: [[u0, -4.6], [u1, -4.6], [u1, 4.6], [u0, 4.6]].map(([u, v]) => flat(u, v).join(',')).join(' ') }, byId('casings'));
    // The zone name sits in its own group, apart from the zone's floor.
    const t = svg('text', { class: 'zone-label', x: 14 * (u0 + u1) / 2, y: flat(0, 4.6)[1] + 26, 'text-anchor': 'middle' }, svg('g', { class: 'zone-name' }, byId('casings')));
    t.textContent = label;
  };
  zone(-2.6, border, 'user-zone', '사용자 영역');
  zone(border, far + 2.6, 'kernel-zone', '커널 영역 · 하드웨어');
  svg('path', { class: 'border-line', d: `M${flat(border, -4.6).join(' ')}L${flat(border, 4.6).join(' ')}` }, byId('casings'));
  // One rail per pair of neighbouring stations, each ending at the two stations, so no rail runs under a station
  // it does not serve.
  for (let k = 0; k + 1 < stations.length; k++) {
    const d = 'M' + [[k * gap, 0], [(k + 1) * gap, 0]].map(([u, v]) => flat(u, v, laneHeight).join(' ')).join('L');
    svg('path', { class: 'casing', d }, byId('casings'));
    svg('path', { class: 'bus', d }, byId('links'));
  }
  stations.forEach(([id, name, kind], k) => {
    const [h, H] = shapeOf[kind];
    const node = svg('g', { class: `node station ${kind}`, transform: `translate(${flat(k * gap, 0).join(' ')})` }, byId('nodes'));
    drawShadow(node, h);
    drawBox(node, h, H);
    if (kind === 'file') {
      // Lines of text on a sheet.
      for (let r = 0; r < 3; r++) {
        const y = -h + .45 + r * .5;
        svg('path', { class: 'sheet-line', d: `M${point(-h + .35, y, H)}L${point(h - .35 - (r === 2 ? .5 : 0), y, H)}` }, node);
      }
    }
    if (kind === 'cpu') {
      const mark = [[-.45, -.45, H], [.45, -.45, H], [.45, .45, H], [-.45, .45, H]];
      svg('polygon', { points: mark.map((p) => point(...p)).join(' '), fill: '#c9b46b', opacity: .85 }, node);
    }
    addPlate(node, 'tag station-tag', 0, 14 * h + 16, name, { round: true });
    const holds = addPlate(node, 'tag holds', 0, -H - 14 * h - 14, '', { pad: 1.2 });
    views[id] = { node, holds };
  });
  const left = -60, right = 14 * far + 60, top = -104, bottom = 70;
  const scale = Math.min(1.9, 590 / (right - left), 268 / (bottom - top));
  const x = 310 - scale * (left + right) / 2, y = 140 - scale * (top + bottom) / 2;
  byId('world').setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${scale.toFixed(3)})`);
}

// ---------- The moving dot ----------
function travel(fromU, toU, label, done) {
  if (motion.matches) { done(); return; }
  const group = svg('g', { class: 'packet-group' }, byId('packets'));
  svg('circle', { class: 'packet-halo', r: 8.5 }, group);
  svg('circle', { class: 'packet', r: 4.4 }, group);
  svg('text', { class: 'packet-label', y: -10 }, group).textContent = label;
  packets.push({ group, fromU, toU, start: performance.now(), ms: 950, done });
  kick();
}
// Callbacks run after the list is updated, so a callback that starts a new trip is not lost.
function movePackets(now) {
  const finished = [];
  packets = packets.filter((packet) => {
    const t = (now - packet.start) / packet.ms;
    if (t >= 1) { packet.group.remove(); finished.push(packet.done); return false; }
    const ease = t * t * (3 - 2 * t);
    // Start and end just inside the two stations, on whichever side faces the other, so a trip to the left stays on the rail.
    const dir = packet.toU < packet.fromU ? -1 : 1;
    const [x, y] = flat(mix(packet.fromU + 2.2 * dir, packet.toU - 2.2 * dir, ease), 0, laneHeight);
    packet.group.setAttribute('transform', `translate(${x} ${y})`);
    return true;
  });
  finished.forEach((done) => done());
}

// ---------- State after s stages ----------
function paint() {
  const step = lesson[state.index];
  const preview = document.querySelector(motion.matches ? '.workspace.course-reading' : '.workspace.course-reading.course-step-preview');
  const shown = preview ? step.readingStage : state.s;
  const { holds, errors, view } = snapshot(shown);
  const last = step.stages[shown - 1];
  for (const [id] of step.stations) {
    setPlate(views[id].holds, holds[id] ?? '');
    views[id].holds.group.classList.toggle('error', errors.has(id));
    views[id].node.classList.toggle('error', errors.has(id));
    views[id].node.classList.toggle('active', last ? last.to === id : id === step.stations[0][0]);
  }
  // The still picture says in one line what happened up to the reading stage, so the badges read as its result.
  byId('example-note')?.remove();
  if (preview) exampleNote(step.note, step.noteTone);
  byId('work-title').textContent = view.title;
  byId('work').replaceChildren(...view.lines.map((line) => Object.assign(document.createElement('li'), { textContent: line })));
  byId('work-panel').classList.toggle('error', Boolean(last?.error));
  byId('readout').textContent = last ? last.text : '"다음 단계"를 누르면 신호가 한 정거장씩 움직입니다.';
  const finished = state.s >= step.stages.length;
  const blocked = !state.playing && (finished || state.busy || Boolean(pendingAsk()));
  byId('run-stage').disabled = blocked;
  byId('run-stage').textContent = finished ? '끝까지 왔습니다' : '다음 단계';
  [...byId('stage-list').children].forEach((li, k) => {
    li.classList.toggle('done', k < state.s);
    li.classList.toggle('current', k === state.s);
  });
}

function runStage(done) {
  const step = lesson[state.index];
  const stage = step.stages[state.s];
  if (!stage || state.busy) return;
  state.busy = true;
  views[stage.from].node.classList.add('active');
  travel(stationU(stage.from), stationU(stage.to), stage.label, () => {
    state.s++;
    state.busy = false;
    paint();
    byId('announcement').textContent = stage.text;
    done?.();
  });
  paint();
}

// ---------- Predictions ----------
function pendingAsk() {
  if (state.playing) return null;
  const stage = lesson[state.index].stages[state.s];
  return stage?.ask && !answered[state.index].has(state.s) ? stage.ask : null;
}
const asksCount = () => lesson[state.index].stages.filter((stage) => stage.ask).length;
function syncTask() {
  const choices = byId('try-choices');
  choices.replaceChildren();
  const ask = pendingAsk();
  if (ask && !state.busy) {
    byId('try').classList.remove('solved');
    byId('try-text').textContent = ask.q;
    byId('try-result').textContent = state.wrong || state.solvedText;
    for (const choice of ask.choices) {
      const button = Object.assign(document.createElement('button'), { type: 'button', className: 'action choice-button', textContent: choice });
      button.addEventListener('click', () => answer(choice));
      choices.append(button);
    }
  } else if (state.solvedText) {
    byId('try').classList.add('solved');
    byId('try-text').textContent = state.solvedText;
    byId('try-result').textContent = '';
  } else {
    byId('try').classList.remove('solved');
    byId('try-result').textContent = '';
    byId('try-text').textContent = state.s >= lesson[state.index].stages.length
      ? (progress[state.index] >= asksCount() ? '이 단계의 예측을 모두 맞혔습니다. 처음부터 다시 볼 수도 있습니다.' : '처음부터를 눌러 다시 해 보세요.')
      : '"다음 단계"를 눌러 신호를 한 정거장씩 옮겨 보세요. 중간에 예측 문제가 나옵니다.';
  }
}
function answer(choice) {
  const ask = pendingAsk();
  if (!ask) return;
  if (choice !== ask.answer) {
    state.wrong = `✗ ${choice}이(가) 아닙니다. 다시 골라 보세요.`;
    byId('announcement').textContent = state.wrong;
    syncTask();
    return;
  }
  state.wrong = '';
  answered[state.index].add(state.s);
  progress[state.index] = answered[state.index].size;
  state.solvedText = `✓ 맞았습니다. ${ask.why}`;
  byId('announcement').textContent = state.solvedText;
  runStage(() => syncTask());
  syncTask();
}

// Taking over from the demo starts the learner's own run from the beginning, so no prediction is skipped.
byId('run-stage').onclick = () => {
  takeOver();
  if (state.busy || pendingAsk()) { syncTask(); return; }
  state.solvedText = '';
  runStage(() => syncTask());
  syncTask();
};
byId('restart').onclick = () => {
  state.playing = false;
  resetRun();
  syncPlayback();
  byId('announcement').textContent = '처음부터 다시 시작합니다.';
};

// ---------- Demo ----------

// ---------- Steps and routing ----------
function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/pagetable/${index + 1}`);
  showStep(index);
}
const stepButtons = lesson.map(({ label }, index) => {
  const listItem = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  const number = document.createElement('span');
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.addEventListener('click', () => goToStep(index));
  listItem.append(button);
  byId('steps').append(listItem);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
motion.addEventListener('change', () => {
  if (lessonDemoEnabled()) state.playing = true;
  syncPlayback();
});
window.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});
const initial = routeIndex();
history.replaceState(null, '', `#/pagetable/${initial + 1}`);
state.index = -1;
showStep(initial, false);
</script>
