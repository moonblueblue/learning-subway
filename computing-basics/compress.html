<style>

<body>

  <header>
    <p class="eyebrow">0장 컴퓨팅 둘러보기 · 레슨 0.4</p>
    <h1>압축</h1>
    <p class="lead">같은 정보를 더 적은 비트로 담을 수 있을까요? 그림을 바꿔 가며 압축 결과가 어떻게 달라지는지 보세요.</p>

<script>
const byId = (id) => document.getElementById(id);
const viewport = byId('scene');
const viewWidth = 620;
const viewHeight = 280;
const maxZoom = 3;
const center = { x: viewWidth / 2, y: viewHeight / 2 };
const camera = { x: 0, y: 0, zoom: 1 };
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));



// Convert from screen pixels to fixed viewport coordinates, accounting for SVG letterboxing.


// A press that starts on a scene object and ends without moving counts as a tap on it.
// Track the press separately so clicking still works after a drag captures the pointer.
let tap = null;
viewport.addEventListener('pointerdown', (event) => {
  const target = event.target.closest?.('[data-hit]');
  tap = target && event.button === 0 && event.isPrimary
    ? { hit: target.dataset.hit, x: event.clientX, y: event.clientY, id: event.pointerId }
    : null;
});
viewport.addEventListener('pointerup', (event) => {
  if (tap && tap.id === event.pointerId && Math.hypot(event.clientX - tap.x, event.clientY - tap.y) < 8) {
    sceneTap(tap.hit);
  }
  tap = null;
});
viewport.addEventListener('pointercancel', () => { tap = null; });

enableCameraDrag();



byId('zoom-in').onclick = () => zoomBy(.25);
byId('zoom-out').onclick = () => zoomBy(-.25);
viewport.addEventListener('keydown', (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const directions = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const direction = directions[event.key];
  if (direction && camera.zoom > 1) {
    event.preventDefault();
    setCamera(camera.x + direction[0] * 28 / camera.zoom, camera.y + direction[1] * 28 / camera.zoom, camera.zoom);
  } else if (event.key === '+' || event.key === '=' || event.key === '-') {
    event.preventDefault();
    zoomBy(event.key === '-' ? -.25 : .25);
  } else if (event.key === '0') {
    event.preventDefault();
    resetView();
  }
});
setCamera(0, 0, 1);

const motion = matchMedia('(prefers-reduced-motion: reduce)');
const size = 8;  // the picture is 8 × 8 pixels

// Demo pictures, one byte per row (1 = lit).
const pictures = {
  heart: [0x00, 0x66, 0xFF, 0xFF, 0xFF, 0x7E, 0x3C, 0x18],
  smile: [0x3C, 0x42, 0xA5, 0x81, 0xA5, 0x99, 0x42, 0x3C],
  letter: [0x18, 0x24, 0x42, 0x42, 0x7E, 0x42, 0x42, 0x00],
};
const fromBytes = (rows) => rows.flatMap((row) => Array.from({ length: size }, (_, c) => row >> (size - 1 - c) & 1));
// Four-level pictures: a left-to-right gradient, and the heart with a shaded edge.
const gradient = Array.from({ length: size * size }, (_, i) => Math.floor((i % size) / 2));
const shadedHeart = fromBytes(pictures.heart).map((on, i) => {
  if (!on) return 0;
  const r = Math.floor(i / size), c = i % size;
  return r <= 2 && c <= 3 ? 3 : r >= 5 ? 1 : 2;
});

// Each step picks a `mode`: `rle` counts runs in a black-and-white picture,
// `lossy` averages blocks of a four-level picture. `tasks` are try-it problems.
const stripes = Array.from({ length: size * size }, (_, i) => Math.floor(i / size) % 2);
const checker = Array.from({ length: size * size }, (_, i) => (Math.floor(i / size) + i % size) % 2);
const horizon = Array.from({ length: size * size }, (_, i) => (Math.floor(i / size) >= 5 ? 1 : 0));
const lesson = [
  {
    label: '반복 세기',
    readingDiagram: {
      title: "같은 값 8개를 묶으면 4비트",
      description: "00000000 한 줄은 1묶음이며, 묶음당 4비트라 결과는 4비트입니다.",
      nodes: [
        ["b0", 67, 78, 54, 26, ["0"]],
        ["b1", 135, 78, 54, 26, ["0"]],
        ["b2", 203, 78, 54, 26, ["0"]],
        ["b3", 271, 78, 54, 26, ["0"]],
        ["b4", 339, 78, 54, 26, ["0"]],
        ["b5", 407, 78, 54, 26, ["0"]],
        ["b6", 475, 78, 54, 26, ["0"]],
        ["b7", 543, 78, 54, 26, ["0"]],
        ["g", 305, 159, 530, 26, ["한 묶음: 0이 8개"], "active"],
        ["size", 310, 230, 265, 26, ["원본 8비트 → 저장 4비트"], "active"],
      ],
      edges: [
        ["b0", "g", "undirected"],
        ["b1", "g", "undirected"],
        ["b2", "g", "undirected"],
        ["b3", "g", "undirected"],
        ["b4", "g", "undirected"],
        ["b5", "g", "undirected"],
        ["b6", "g", "undirected"],
        ["b7", "g", "undirected"],
      ],
      labels: [
        [28, 268, "묶음 하나 = 값 1비트 + (개수 − 1) 3비트 · 0~7이 1~8개"],
      ],
    },
    example: ["00000000 한 줄", "0 한 묶음 × 8칸", "8비트 → 4비트"],
    mode: 'rle',
    levels: 2,
    title: '같은 값이 이어지면 개수만 적는다',
    body: '"0 0 0 0 0 1 1 1" 대신 "0이 5개, 1이 3개"라고 적어도 같은 정보입니다. 이렇게 반복을 세어 적는 방법을 런 길이 부호화(RLE)라고 합니다. 여기서는 묶음 하나를 4비트(값 1비트 + 개수 3비트)로 적습니다. 3비트는 0~7까지라서 개수에서 1을 뺀 값을 적고, 1~8개를 나타냅니다. 한 줄이 모두 같으면 8비트가 4비트로 줄어듭니다.',
    takeaway: '화면 왼쪽에 줄마다 묶음("0×5 1×3")과 그 줄의 압축 크기가 나옵니다. 아래 줄에서 원본 64비트와 압축 결과를 비교해 보세요.',
    description: '8 × 8 흑백 화면과, 줄마다 같은 값이 이어지는 묶음을 센 결과가 있습니다. 묶음이 적을수록 압축 결과가 작습니다.',
    initial: () => ({ image: [...horizon] }),
    demo: { frames: [horizon, fromBytes(pictures.heart), fromBytes(pictures.letter)].map((image) => ({ image: [...image] })), interval: 2800 },

const rowValue = (s, r) => s.image.slice(r * size, r * size + size).reduce((value, bit) => value * 2 + (bit ? 1 : 0), 0);
// Runs of equal values in one row: [[value, count], ...].
function runs(row) {
  const result = [];
  for (const value of row) {
    const last = result[result.length - 1];
    if (last && last[0] === value) last[1]++;
    else result.push([value, 1]);
  }
  return result;
}
const rowOf = (image, r) => image.slice(r * size, r * size + size);
const rleBits = (image) => [...Array(size).keys()].reduce((sum, r) => sum + runs(rowOf(image, r)).length * 4, 0);
// Average each block of the four-level picture, rounded to the nearest level.
function blocked(image, block) {
  if (block === 1) return [...image];
  return image.map((_, i) => {
    const r0 = Math.floor(Math.floor(i / size) / block) * block, c0 = Math.floor(i % size / block) * block;
    let sum = 0;
    for (let r = r0; r < r0 + block; r++) for (let c = c0; c < c0 + block; c++) sum += image[r * size + c];
    return Math.round(sum / (block * block));
  });
}
const step = () => lesson[state.index];
const state = { index: 0, playing: !motion.matches, wait: 0, demoPosition: 0, solved: '',
  image: Array(size * size).fill(0), block: 1 };
const progress = lesson.map(() => 0);

const project = (x, y, z = 0) => [14 * (x + y), 7 * (x - y) - z];
const point = (x, y, z) => project(x, y, z).map((value) => +value.toFixed(2)).join(',');
const mix = (a, b, t) => a + (b - a) * t;

const gridLines = [];
for (let i = -20; i <= 20; i += 2) {
  gridLines.push(`M${point(i, -20, 0)}L${point(i, 20, 0)}M${point(-20, i, 0)}L${point(20, i, 0)}`);
}
byId('grid').setAttribute('d', gridLines.join(''));


function drawFaces(node, h, H, fills) {
  const faces = {
    left: [[-h, -h, 0], [h, -h, 0], [h, -h, H], [-h, -h, H]],
    right: [[h, -h, 0], [h, h, 0], [h, h, H], [h, -h, H]],
    top: [[-h, -h, H], [h, -h, H], [h, h, H], [-h, h, H]],
  };
  for (const [name, corners] of Object.entries(faces)) {
    const attrs = { class: 'face ' + name, points: corners.map((p) => point(...p)).join(' ') };
    if (fills) Object.assign(attrs, { fill: fills[name], stroke: fills.stroke });
    svg('polygon', attrs, node);
  }
  svg('path', { class: 'highlight', d: `M${point(-h, -h, H)}L${point(h, -h, H)}L${point(h, h, H)}` }, node);
}

// Plates are small labels whose box is sized to the text.
let plates = [];
function addPlate(node, className, x, y, text, { pad = 1.5, round = true } = {}) {
  const group = svg('g', { class: className }, node);
  const plate = { group, rect: svg('rect', {}, group), label: svg('text', {}, group), x, y, pad, round };
  plate.label.textContent = text;
  plates.push(plate);
  sizePlate(plate);
  return plate;
}

// ---------- The monitor: an 8 × 8 pixel screen on the front-left face of a box ----------
// h 4.0 makes a pixel row 14px tall, enough for a 10.5px row label leaning with the row without touching the next.
const monitor = { h: 4, H: 132, margin: .32, base: 10 };
const cell = (2 * monitor.h - 2 * monitor.margin) / size;   // pixel width in floor units
const rowHeight = cell * 15.6;                              // pixel height in screen pixels, so pixels look square
const pixelShades = {
  2: ['#22352f', '#e3f6e9'],
  4: ['#22352f', '#557366', '#9fc2b0', '#e8f8ee'],
};

const groups = {};
const pixelViews = [];
let rowLabels = [];
function buildMonitor() {
  const group = svg('g', { class: 'node' }, byId('nodes'));
  const { h, H, margin, base } = monitor;
  drawShadow(group, h);
  drawFaces(group, h, H, { top: '#f4f7f5', left: '#d7dfdb', right: '#b8c6c0', stroke: '#8c9d96' });
  // Dark bezel behind the pixels.
  const bezel = [[-h + margin * .6, -h, base - 4], [h - margin * .6, -h, base - 4], [h - margin * .6, -h, base + rowHeight * size + 4], [-h + margin * .6, -h, base + rowHeight * size + 4]];
  svg('polygon', { points: bezel.map((p) => point(...p)).join(' '), fill: '#1b2b26' }, group);
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      const x0 = -h + margin + c * cell + .03, x1 = x0 + cell - .06;
      const z0 = base + (size - 1 - r) * rowHeight + .8, z1 = z0 + rowHeight - 1.6;
      const quad = [[x0, -h, z0], [x1, -h, z0], [x1, -h, z1], [x0, -h, z1]];
      const pixel = svg('polygon', { class: 'pixel', 'data-hit': `p${r * size + c}`, points: quad.map((p) => point(...p)).join(' ') }, group);
      pixelViews.push(pixel);
    }
  }
  // Row labels to the left of the screen: bits and the row's value.
  rowLabels = [];
  for (let r = 0; r < size; r++) {
    const [x, y] = project(-h, -h, base + (size - 1 - r) * rowHeight + rowHeight / 2);
    // The screen's rows run down to the right along the face (half as steep as they are wide), so each
    // label leans the same way and sits on its row's line, 16px left of the screen.
    rowLabels.push(svg('text', { class: 'row-label', transform: `translate(${x - 16} ${y - 8}) skewY(26.565)` }, group));
  }
  const [lx, ly] = project(h, -h, 0);
  addPlate(group, 'tag', lx, ly + 16, '화면');
  groups.screen = group;
}

// ---------- Drawing the current state ----------
function shownImage() {
  return step().mode === 'lossy' ? blocked(state.image, state.block) : state.image;
}
function paint() {
  const s = step();
  const shades = pixelShades[s.levels];
  const image = shownImage();
  pixelViews.forEach((pixel, i) => {
    pixel.setAttribute('fill', shades[image[i]]);
    pixel.classList.toggle('lit', image[i] > 0);
  });
  rowLabels.forEach((label, r) => {
    const row = rowOf(image, r);
    if (s.mode === 'rle') {
      const parts = runs(row);
      label.textContent = `${parts.map(([v, n]) => `${v}×${n}`).join(' ')} → ${parts.length * 4}비트`;
    } else if (r % state.block === 0) {
      label.textContent = row.filter((_, c) => c % state.block === 0).map((v) => v.toString(2).padStart(2, '0')).join(' ');
    } else label.textContent = '';
  });
  syncControls();
}

// ---------- HTML controls ----------
const pixelButtons = [];
function buildControls() {
  const grid = byId('pixel-grid');
  for (let i = 0; i < size * size; i++) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'pixel-button';
    button.addEventListener('click', () => cyclePixel(i));
    grid.append(button);
    pixelButtons.push(button);
  }
  byId('pixels-clear').onclick = () => userChange(() => { state.image.fill(0); }, '그림을 모두 지웠습니다.');
  byId('pixels-invert').onclick = () => userChange(() => {
    const top = step().levels - 1;
    state.image = state.image.map((v) => top - v);
  }, '밝기를 반전했습니다.');
  for (const block of [1, 2, 4]) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'action choice-button';
    button.textContent = `${block}×${block}`;
    button.dataset.value = block;
    button.addEventListener('click', () => userChange(() => { state.block = block; }, `${block}×${block}로 묶었습니다.`));
    byId('block-choices').append(button);
  }
}

function syncControls() {
  const s = step();
  byId('block-choice').hidden = s.mode !== 'lossy';
  const shades = pixelShades[s.levels];
  pixelButtons.forEach((button, i) => {
    const v = state.image[i];
    button.style.background = shades[v];
    button.setAttribute('aria-pressed', String(v > 0));
    button.setAttribute('aria-label', `${Math.floor(i / size) + 1}행 ${i % size + 1}열, ${s.levels === 2 ? (v ? '켜짐' : '꺼짐') : '밝기 ' + v.toString(2).padStart(2, '0')}`);
  });
  for (const button of document.querySelectorAll('#block-choices button')) button.setAttribute('aria-pressed', String(Number(button.dataset.value) === state.block));
  byId('readout').replaceChildren(...readout());
}

function readout() {
  const s = step();
  const strong = (text, className) => {
    const element = document.createElement('b');
    if (className) element.className = className;
    element.textContent = text;
    return element;
  };
  if (s.mode === 'rle') {
    const bits = rleBits(state.image);
    const ratio = Math.round(bits / 64 * 100);
    return ['원본 ', strong('64비트'), ' → 압축 ', strong(`${bits}비트`, 'total'), ` (원본의 ${ratio}%${bits > 64 ? ', 더 커짐' : ''})`];
  }
  const blocks = (size / state.block) ** 2;
  return ['원본 ', strong('128비트'), ` → ${state.block}×${state.block} 블록 ${blocks}개 × 2비트 = `, strong(`${blocks * 2}비트`, 'total')];
}
// ---------- Changes ----------
function cyclePixel(i) {
  const levels = step().levels;
  userChange(() => { state.image[i] = (state.image[i] + 1) % levels; },
    `${Math.floor(i / size) + 1}행 ${i % size + 1}열 ${levels === 2 ? (state.image[i] ? '끔' : '켬') : '밝기 바꿈'}.`);
}
function sceneTap(hit) {
  if (hit?.startsWith('p')) cyclePixel(Number(hit.slice(1)));
}

function userChange(change, message, quiet = false) {
  state.playing = false;
  state.solved = '';
  change();
  paint();
  syncPlayback();
  if (!quiet) byId('announcement').textContent = message;
  syncTask();
  checkTask();
}

// ---------- Try-it problems ----------
function syncTask() {
  const tasks = step().tasks;
  const done = progress[state.index];
  const allDone = done >= tasks.length;
  byId('try').classList.toggle('solved', state.solved !== '');
  byId('try-text').textContent = state.solved !== '' ? tasks[done - 1].text
    : allDone ? '이 단계의 문제를 모두 풀었습니다. 자유롭게 바꿔 보세요.' : tasks[done].text;
  byId('try-result').textContent = state.solved === '' ? ''
    : `✓ 맞았습니다. ${state.solved}${allDone ? ' · 이 단계의 문제를 모두 풀었습니다.' : ''}`;
  byId('try-next').hidden = state.solved === '' || allDone;
}
function checkTask() {
  const tasks = step().tasks;
  const done = progress[state.index];
  if (state.solved !== '' || done >= tasks.length || !tasks[done].check(state)) return;
  progress[state.index] = done + 1;
  state.solved = tasks[done].result?.(state) ?? byId('readout').textContent;
  syncTask();
}
byId('try-next').onclick = () => { state.solved = ''; syncTask(); };

// ---------- Demo playback ----------
let frame = null, lastFrame = null;
function applyFrame(frameState) {
  if (frameState.image) state.image = [...frameState.image];
  if (frameState.block) state.block = frameState.block;
  paint();
}
function demoTick() {
  const demo = step().demo;
  state.demoPosition = (state.demoPosition + 1) % demo.frames.length;
  applyFrame(demo.frames[state.demoPosition]);
  state.wait = demo.interval;
}
function tick(now) {
  frame = null;
  const elapsed = lastFrame === null ? 0 : Math.min(now - lastFrame, 80);
  lastFrame = now;
  if (state.playing) {
    state.wait -= elapsed;
    if (state.wait <= 0) demoTick();
    frame = requestAnimationFrame(tick);
  } else lastFrame = null;
}
function syncPlayback() {
  const reduced = motion.matches;
  if (reduced) state.playing = false;
  if (state.playing && frame === null) frame = requestAnimationFrame(tick);
}
// ---------- Steps and routing ----------
const legends = {
  rle: '<span><i class="dot on"></i>1 (켜진 칸)</span><span><i class="dot"></i>0 (꺼진 칸)</span><span>0×5 = 0이 5개</span>',
  lossy: '<span><i class="dot on"></i>밝은 칸</span><span><i class="dot"></i>어두운 칸</span><span>화면 = 묶어서 평균 낸 그림</span>',
};
function startStep() {
  const s = step();
  Object.assign(state, s.initial());
  state.demoPosition = 0;
  state.wait = s.demo.interval;
}
function showStep(index, announce = true) {
  const previous = lesson[state.index];
  const keep = previous.mode === 'rle' && lesson[index].mode === 'rle' && index !== state.index && announce;
  const kept = keep ? state.image.map((v) => (v * (lesson[index].levels - 1) / (previous.levels - 1)) | 0) : null;
  state.index = index;
  state.playing = lessonDemoEnabled();
  startStep();
  if (kept && !state.playing && !document.querySelector('.workspace.course-reading')) state.image = kept;
  const s = step();
  byId('step-title').textContent = s.title;
  byId('body').textContent = s.body;
  byId('takeaway').textContent = s.takeaway;
  byId('scene-desc').textContent = s.description;
  byId('legend').innerHTML = legends[s.mode];
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  stepButtons.forEach((button, i) => {
    if (i === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  byId('world').setAttribute('transform', 'translate(430 200) scale(.88)');
  state.solved = '';
  syncTask();
  paint();
  syncPlayback();
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${s.title}`;
}
function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/compress/${index + 1}`);
  showStep(index);
}
const stepButtons = lesson.map(({ label }, index) => {
  const listItem = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  const number = document.createElement('span');
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.addEventListener('click', () => goToStep(index));
  listItem.append(button);
  byId('steps').append(listItem);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
motion.addEventListener('change', () => {
  if (lessonDemoEnabled()) state.playing = true;
  syncPlayback();
});
window.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});

buildMonitor();
buildControls();
const initial = routeIndex();
history.replaceState(null, '', `#/compress/${initial + 1}`);
state.index = initial;
showStep(initial, false);
</script>
</body>
</html>
