<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="shared/device-access.js?v=1f73c765843f36b1"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
// The browser loaded a fresh view. Keep shared links and history on the public map URL.
const address = new URL(location.href);
address.pathname = new URL('./ai-map.html', address).pathname;
address.searchParams.delete('visit');
address.searchParams.delete('v');
history.replaceState(null, '', address);
addEventListener('pageshow', event => {
  if (event.persisted) location.replace(location.href);
});
</script>
<meta name="theme-color" content="#f4f7ef">
<title>AI 노선도</title>
<link rel="icon" href="./shared/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./shared/ai-map.css?v=6f4062b634f816a8">
<link rel="stylesheet" href="./shared/map-topics.css?v=c313ec6c639ff811">
<script defer src="./shared/catalog.js?v=e30570c60bc43648"></script>
<script defer src="./shared/ai-stations.js?v=6c5757deedef0b06"></script>
<script>window.lessonText = {"역 선택":"Station"};</script>
<script defer src="./shared/i18n.js?v=78a030e446786b47"></script>
<script defer src="./shared/map-topics.js?v=f14d199ef5481549"></script>
<script defer src="./shared/ai-map.js?v=51a5315028dd32d7"></script>
</head>
<body data-ai-map class="map-shell">
<header class="map-mast">
  <h1><a href="./index.html" class="home" aria-label="전체 노선도">Learning Subway</a></h1>
  <div class="mast-center"><p class="tagline">AI 노선도</p></div>
  <div data-lang-switch></div>
</header>
<div class="map-workspace">
<nav class="map-topics" data-no-i18n aria-label="학습 주제"></nav>
<main>
  <div class="sheet">
    <svg class="network" role="group" aria-label="AI 노선도"></svg>
    <nav class="legend" aria-label="노선"><div id="trunk"></div><div id="branches"></div></nav>
  </div>
  <section class="stop" aria-label="선택한 노선">
    <div class="summary"><h2 id="line-name"></h2><span>졸업 과제</span> <strong id="destination"></strong></div>
    <div class="boarding"><label for="lessons">역 선택</label><select id="lessons"></select>
      <a id="enter">레슨 열기</a><span id="planned" hidden>준비 중</span>
    </div>
  </section>
</main>
</div>
</body>
</html>
