<style>

header{margin-bottom:20px}

.bit-button .place{font:600 .75rem var(--mono);color:var(--muted)}

.switch-actions{display:flex;gap:8px;align-items:center}

@media(pointer:coarse){.mouse-hint{display:none}.touch-hint{display:inline}}
.iso-grid{fill:none;stroke:#86ad97;stroke-width:.6;stroke-opacity:.24}
.node .face{stroke-width:.8;stroke-linejoin:round}
.node .shadow{fill:#1f4434;opacity:.16}
.node .highlight{fill:none;stroke:#fff;stroke-opacity:.75;stroke-width:1.1;stroke-linecap:round}

.switch .left{fill:#d3dad6;stroke:#8c9d96}

.casing{fill:none;stroke:#eaf3eb;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.wire{fill:none;stroke-linecap:round;stroke-linejoin:round}
.wire.signal{stroke:var(--request);stroke-width:2.6}

.cell .face{stroke:#8c9d96;stroke-width:.8;transition:fill .2s}

.code-area{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}

.try-choices:empty{display:none}

@media(prefers-reduced-motion:reduce){.cell .face,.tag.name{transition:none}.cell.changed .top{animation:none}}
</style>

<body>
<main class="shell">
  <header>
    <p class="eyebrow">1장 프로그래밍 입문 · 레슨 1.6 · 실습</p>
    <h1>디버깅</h1>
    <p class="lead">버그가 있는 곳을 어떻게 좁혀 갈까요? 2, 4, 6의 평균을 구하려다 틀리는 프로그램을 한 줄씩 실행하며 찾아보세요.</p>
  </header>
  <div class="workspace">
    <div>
      <section class="panel" aria-labelledby="stage-heading">
        <div class="stage-top"><h2 id="stage-heading">메모리와 CPU</h2><span class="status" id="status">재생 중</span></div>
        <div class="stage">
          <svg id="scene" viewBox="0 0 620 280" role="img" tabindex="0" aria-labelledby="scene-title scene-desc">
            <title id="scene-title">버그가 있는 프로그램이 실행되며 메모리 칸이 바뀌는 장면</title><desc id="scene-desc"></desc>
            <defs>
              <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
              <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
              <radialGradient id="grid-fade"><stop offset=".45" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
              <mask id="grid-mask"><rect x="-460" y="-260" width="920" height="520" fill="url(#grid-fade)"/></mask>
            </defs>
            <g id="world" aria-hidden="true">
              <path id="grid" class="iso-grid" mask="url(#grid-mask)"></path>
              <g id="casings"></g><g id="links"></g><g id="nodes"></g><g id="packets"></g>
            </g>
          </svg>
        </div>
        <div class="hands-on">
          <div class="try" id="try">
            <p><strong>해 보기</strong><span id="try-text"></span></p>
            <p class="try-result" id="try-result" role="status"></p>
            <div class="try-choices" id="try-choices" role="group" aria-label="예측 고르기"></div>
          </div>
          <p class="readout" id="readout"></p>
          <div class="code-area">
            <ol class="code" id="code" aria-label="프로그램"></ol>
            <div class="code-actions">
              <button class="action primary" id="run-line" type="button">한 줄 실행</button>
              <button class="action" id="restart" type="button">처음부터</button>
            </div>
          </div>
        </div>

          <button class="action" id="zoom-out" type="button" aria-label="장면 축소">−</button>
          <output class="view-scale" id="view-scale" aria-label="현재 배율" aria-live="off">100%</output>
          <button class="action" id="zoom-in" type="button" aria-label="장면 확대">+</button>
          <button class="action" id="view-reset" type="button">원래 보기</button>
          <span class="view-hint"><span class="mouse-hint">확대 후 드래그로 이동</span><span class="touch-hint">두 손가락으로 확대</span></span>
        </div>
        <div class="controls">
          <div class="legend" aria-label="범례"><span><i class="dot read"></i>읽기 · 칸 → CPU</span><span><i class="dot write"></i>쓰기 · CPU → 칸</span><span><i class="dot"></i>빈 칸</span></div>

<script>
const byId = (id) => document.getElementById(id);
const viewport = byId('scene');
const viewWidth = 620;
const viewHeight = 280;
const maxZoom = 3;
const center = { x: viewWidth / 2, y: viewHeight / 2 };
const camera = { x: 0, y: 0, zoom: 1 };
const pointers = new Map();
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));



// Convert from screen pixels to fixed viewport coordinates, accounting for SVG letterboxing.


// A press that starts on a scene object and ends without moving counts as a tap on it.
// Tracked separately from the camera pointers so it also works when the pointer is captured.
let tap = null;
viewport.addEventListener('pointerdown', (event) => {
  const target = event.target.closest?.('[data-hit]');
  tap = target && event.button === 0 && pointers.size === 0
    ? { hit: target.dataset.hit, x: event.clientX, y: event.clientY, id: event.pointerId }
    : null;
});
viewport.addEventListener('pointerup', (event) => {
  if (tap && tap.id === event.pointerId && Math.hypot(event.clientX - tap.x, event.clientY - tap.y) < 8) {
    sceneTap(tap.hit);
  }
  tap = null;
});
viewport.addEventListener('pointercancel', () => { tap = null; });

viewport.addEventListener('pointerdown', (event) => {
  if (event.button !== 0 || pointers.size >= 2) return;
  if (event.pointerType !== 'touch' && camera.zoom === 1) return;
  pointers.set(event.pointerId, viewportPoint(event));
  viewport.setPointerCapture(event.pointerId);
});
viewport.addEventListener('pointermove', (event) => {
  if (!pointers.has(event.pointerId)) return;
  const before = pointerGeometry();
  pointers.set(event.pointerId, viewportPoint(event));
  const after = pointerGeometry();
  const pinch = pointers.size === 2;
  if (pinch && (before.distance < 1 || after.distance < 1)) return;
  const zoom = pinch ? camera.zoom * after.distance / before.distance : camera.zoom;
  zoomBetween(zoom, before.point, after.point);
  viewport.classList.toggle('is-dragging', !pinch && camera.zoom > 1);
});
for (const eventName of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  viewport.addEventListener(eventName, (event) => {
    if (pointers.delete(event.pointerId)) viewport.classList.remove('is-dragging');
  });
}



byId('zoom-in').onclick = () => zoomBy(.25);
byId('zoom-out').onclick = () => zoomBy(-.25);
byId('view-reset').onclick = resetView;
viewport.addEventListener('keydown', (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const directions = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const direction = directions[event.key];
  if (direction && camera.zoom > 1) {
    event.preventDefault();
    setCamera(camera.x + direction[0] * 28 / camera.zoom, camera.y + direction[1] * 28 / camera.zoom, camera.zoom);
  } else if (event.key === '+' || event.key === '=' || event.key === '-') {
    event.preventDefault();
    zoomBy(event.key === '-' ? -.25 : .25);
  } else if (event.key === '0') {
    event.preventDefault();
    resetView();
  }
});
setCamera(0, 0, 1);

const motion = matchMedia('(prefers-reduced-motion: reduce)');
const storageKey = 'debugging-lab:v1:step';
const cellCount = 6;
const firstAddress = 100;

// A program is a list of lines in Python. Each line has a `kind`:
//   set   – reads variables, writes one variable with `calc`
//   if    – tests `test`; true goes to the next line, false jumps to `to`
//   else  – reached after the true branch, jumps to `to` (past the else branch)
//   while – tests `test`; true enters the loop body, false jumps to `to`
// A line with `back` jumps back to that line after it runs (the end of a loop body).
// `asks` are predictions; each names the line it belongs to and, optionally, `when` it applies.
const set = (code, write, calc, reads = [], show = null, extra = {}) => ({ kind: 'set', code, write, calc, reads, show, ...extra });
const test = (kind, code, fn, reads, show, to) => ({ kind, code, test: fn, reads, show, to });
// Every step runs a short program that should compute the average of 2, 4 and 6 (which is 4.0).
// The programs differ only in a bug or its fix.
const lesson = [
  {
    label: '증상 확인',
    readingMemory: [["합계", 12], ["i", 4], ["평균", "6.0"]],

const step = () => lesson[state.index];
const state = { index: 0, playing: !motion.matches, userPaused: false, wait: 0, pc: 0, busy: false,
  cells: Array(cellCount).fill(null), names: Array(cellCount).fill(null), wrong: '', solvedText: '', loops: 0, halted: false, lastJump: null };
const progress = lesson.map(() => 0);
const asksOf = (s) => s.asks;

const project = (x, y, z = 0) => [14 * (x + y), 7 * (x - y) - z];
const point = (x, y, z) => project(x, y, z).map((value) => +value.toFixed(2)).join(',');
const mix = (a, b, t) => a + (b - a) * t;
const gridLines = [];
for (let i = -22; i <= 22; i += 2) {
  gridLines.push(`M${point(i, -22, 0)}L${point(i, 22, 0)}M${point(-22, i, 0)}L${point(22, i, 0)}`);
}
byId('grid').setAttribute('d', gridLines.join(''));


function drawFaces(node, h, H, fills) {
  const faces = {
    left: [[-h, -h, 0], [h, -h, 0], [h, -h, H], [-h, -h, H]],
    right: [[h, -h, 0], [h, h, 0], [h, h, H], [h, -h, H]],
    top: [[-h, -h, H], [h, -h, H], [h, h, H], [-h, h, H]],
  };
  for (const [name, corners] of Object.entries(faces)) {
    const attrs = { class: 'face ' + name, points: corners.map((p) => point(...p)).join(' ') };
    if (fills) Object.assign(attrs, { fill: fills[name], stroke: fills.stroke });
    svg('polygon', attrs, node);
  }
  svg('path', { class: 'highlight', d: `M${point(-h, -h, H)}L${point(h, -h, H)}L${point(h, h, H)}` }, node);
}

// Plates are small labels whose box is sized to the text.
let plates = [];
function addPlate(node, className, x, y, text, { pad = 1.5, round = true } = {}) {
  const group = svg('g', { class: className }, node);
  const plate = { group, rect: svg('rect', {}, group), label: svg('text', {}, group), x, y, pad, round };
  plate.label.textContent = text;
  plates.push(plate);
  sizePlate(plate);
  return plate;
}
matchMedia('(max-width: 600px)').addEventListener('change', () => plates.forEach(sizePlate));

// ---------- Memory cells in a row, the CPU at the end of the row ----------
// Same arrangement as lesson 0.1: the row lies on the floor diagonal and V-shaped wires join each cell to the CPU.
const spacing = 2.1;
const cpuGap = 3.8;
const cellHalf = .82, cellHeight = 14;
const start = -((cellCount - 1) * spacing + cpuGap) / 2 + 1.2;
const cellAt = (k) => start + spacing * k;
const cpuAt = start + spacing * (cellCount - 1) + cpuGap;
const laneHeight = 3;
const cells = [];
let cpu;
function buildScene() {
  for (let k = 0; k < cellCount; k++) {
    const c = cellAt(k);
    const d = 'M' + [[c, c], [cpuAt, c], [cpuAt, cpuAt]].map(([x, y]) => project(x, y, laneHeight).join(' ')).join('L');
    svg('path', { class: 'casing', d }, byId('casings'));
    const wire = svg('path', { class: 'bus', d }, byId('links'));
    const node = svg('g', { class: 'node cell empty', transform: `translate(${28 * c} 0)` }, byId('nodes'));
    drawShadow(node, cellHalf);
    drawFaces(node, cellHalf, cellHeight);
    const value = svg('text', { class: 'cell-value', x: 0, y: -cellHeight + .5 }, node);
    const [ax, ay] = project(cellHalf, -cellHalf, 0);
    const address = svg('text', { class: 'address', x: ax - 6, y: ay + 13 }, node);
    address.textContent = `${firstAddress + k}번지`;
    const name = addPlate(node, 'tag name', 0, -cellHeight - 14 * cellHalf - 14, '');
    cells.push({ node, value, name, wire });
  }
  const node = svg('g', { class: 'node cpu', transform: `translate(${28 * cpuAt} 0)` }, byId('nodes'));
  const h = 1.6, H = 9;
  drawShadow(node, h);
  drawFaces(node, h, H, { top: '#5d6f69', left: '#3f4f4a', right: '#2f3d39', stroke: '#26322e' });
  for (let k = 1; k < 7; k++) {
    const t = -h + k * 2 * h / 7;
    svg('path', { d: `M${point(t, -h, 2)}L${point(t, -h - .45, 0)}`, stroke: '#b8a25f', 'stroke-width': 1.3, 'stroke-linecap': 'round' }, node);
    svg('path', { d: `M${point(h, t, 2)}L${point(h + .45, t, 0)}`, stroke: '#9a8749', 'stroke-width': 1.3, 'stroke-linecap': 'round' }, node);
  }
  const mark = [[-.7, -.7, H], [.7, -.7, H], [.7, .7, H], [-.7, .7, H]];
  svg('polygon', { points: mark.map((p) => point(...p)).join(' '), fill: '#c9b46b', opacity: .85 }, node);
  const [cx, cy] = project(h, -h, 0);
  addPlate(node, 'tag', cx, cy + 16, 'CPU');
  const work = addPlate(node, 'total', 0, -H - 14 * h - 18, '대기', { pad: 1.1, round: false });
  cpu = { node, work };
  new MutationObserver(() => requestAnimationFrame(placeReadingCpu)).observe(work.label, { childList: true, characterData: true, subtree: true });
}

// ---------- Packets: reads travel cell → CPU, writes travel CPU → cell ----------
let packets = [];
function sendPacket(k, kind, label, delay = 0) {
  if (motion.matches) return;
  const group = svg('g', { class: `packet-group ${kind}` }, byId('packets'));
  svg('circle', { class: 'packet-halo', r: 9 }, group);
  svg('circle', { class: 'packet', r: 4.6 }, group);
  svg('text', { class: 'packet-label', y: -10 }, group).textContent = label;
  group.setAttribute('visibility', 'hidden');
  packets.push({ group, wire: cells[k].wire, reverse: kind === 'write', start: performance.now() + delay, duration: 760 });
  kick();
}
function movePackets(now) {
  packets = packets.filter((packet) => {
    const t = (now - packet.start) / packet.duration;
    if (t >= 1) { packet.group.remove(); return false; }
    if (t < 0) return true;
    const total = packet.wire.getTotalLength();
    const along = mix(16, total - 22, packet.reverse ? 1 - t : t);
    const at = packet.wire.getPointAtLength(along);
    packet.group.setAttribute('visibility', 'visible');
    packet.group.setAttribute('transform', `translate(${at.x} ${at.y})`);
    return true;
  });
}

// ---------- Running a line ----------
const valuesByName = () => Object.fromEntries(state.names.map((name, k) => [name, state.cells[k]]).filter(([name]) => name));
function cellOf(name) {
  const k = state.names.indexOf(name);
  return k >= 0 ? k : state.names.indexOf(null);
}
function runLine(done) {
  const s = step();
  const l = s.program[state.pc];
  if (!l || state.halted) return;
  const before = valuesByName();
  const readMs = l.reads.length && !motion.matches ? 820 : 0;
  state.busy = true;
  l.reads.forEach((name) => sendPacket(state.names.indexOf(name), 'read', String(before[name])));
  setPlate(cpu.work, l.reads.length ? '읽는 중' : '다음 줄로');
  paintCode();
  const finish = (next, changed = -1) => {
    state.lastJump = next < state.pc + 1 || next > state.pc + 1 ? state.pc : null;
    state.pc = next;
    state.busy = false;
    if (s.limit && state.pc === s.program.findIndex((x) => x.kind === 'while') && ++state.loops > s.limit) {
      state.halted = true;
      setPlate(cpu.work, '강제로 멈춤');
      cpu.work.group.classList.add('max');
    }
    paint(changed);
    done?.();
  };
  later(readMs, () => {
    if (l.kind === 'set') {
      const result = l.calc(before);
      const target = cellOf(l.write);
      setPlate(cpu.work, l.show ? l.show(before) : String(result));
      sendPacket(target, 'write', String(result));
      later(motion.matches ? 0 : 780, () => {
        state.names[target] = l.write;
        state.cells[target] = result;
        finish(l.back ?? state.pc + 1, target);
      });
    } else if (l.kind === 'else') {
      setPlate(cpu.work, 'else 건너뛰기');
      later(motion.matches ? 0 : 500, () => finish(l.to));
    } else {
      const ok = l.test(before);
      setPlate(cpu.work, `${l.show(before)} → ${ok ? '참' : '거짓'}`);
      later(motion.matches ? 0 : 700, () => finish(ok ? state.pc + 1 : l.to));
    }
  });
}
// Timers that a step change or reset cancels.
let timers = [];
function later(ms, fn) {
  if (ms === 0) { fn(); return; }
  timers.push(setTimeout(fn, ms));
}
function cancelTimers() {
  timers.forEach(clearTimeout);
  timers = [];
  packets.forEach((packet) => packet.group.remove());
  packets = [];
  state.busy = false;
}
function setPlate(plate, text) {
  plate.label.textContent = text;
  sizePlate(plate);
}

// ---------- Drawing ----------
// Anchor the long CPU plate's right end at the chip. The page translation swaps the text (and resizes the plate)
// after paint, so the plate is placed again whenever its text changes.
function placeReadingCpu() {
  if (!cpu.work.group.classList.contains('long')) return;
  cpu.work.x = 0;
  sizePlate(cpu.work);
  cpu.work.x = 30 - Number(cpu.work.rect.getAttribute('width')) / 2;
  cpu.work.y = cpu.work.home - 46;
  sizePlate(cpu.work);
}

function paint(changed = -1) {
  const preview = document.querySelector(motion.matches ? '.workspace.course-reading' : '.workspace.course-reading.course-step-preview') ? step().readingMemory : null;
  cells.forEach((cell, k) => {
    const name = preview ? preview[k]?.[0] : state.names[k];
    cell.node.setAttribute('class', `node cell ${name ? 'used' : 'empty'}${k === changed ? ' changed' : ''}`);
    cell.value.textContent = name ? String(preview ? preview[k][1] : state.cells[k]) : '–';
    setPlate(cell.name, name ?? '');
    cell.name.group.style.opacity = name ? 1 : 0;
    cell.wire.classList.toggle('active', Boolean(name));
  });
  // The reading preview shows the step's computation and the expected value on the CPU
  // (rules in references/visual-language.md, 1장 "정지 화면의 CPU 판"). Smaller, growing left, above the name tags.
  cpu.work.group.classList.toggle('long', Boolean(preview && step().readingCpu));
  cpu.work.home ??= cpu.work.y;
  cpu.work.x = 0;
  cpu.work.y = cpu.work.home;
  if (preview) setPlate(cpu.work, step().readingCpu ?? '대기');
  placeReadingCpu();
  if (changed >= 0) {
    const node = cells[changed].node;
    node.classList.remove('changed');
    node.getBBox();
    node.classList.add('changed');
  }
  paintCode();
  syncTask();
  byId('readout').replaceChildren(...readout());
}
function paintCode() {
  const program = step().program;
  [...byId('code').children].forEach((li, i) => {
    li.classList.toggle('done', i < state.pc);
    li.classList.toggle('current', i === state.pc);
    li.setAttribute('aria-current', i === state.pc ? 'step' : 'false');
  });
  const finished = state.pc >= program.length || state.halted;
  // While the demo plays the button stays enabled, so a click can take over from it.
  byId('run-line').disabled = !state.playing && (finished || state.busy || Boolean(pendingAsk()));
  byId('run-line').textContent = state.halted ? '강제로 멈췄습니다' : finished ? '끝까지 실행했습니다' : '한 줄 실행';
  [...byId('code').children].forEach((li, i) => li.classList.toggle('jumped', i === state.lastJump));
}
function readout() {
  const strong = (text, className) => {
    const element = document.createElement('b');
    if (className) element.className = className;
    element.textContent = text;
    return element;
  };
  const used = state.names.map((name, k) => [name, k]).filter(([name]) => name);
  if (!used.length) return ['메모리가 비어 있습니다.'];
  const parts = ['메모리 '];
  used.forEach(([name, k], i) => {
    if (i) parts.push(' · ');
    parts.push(`${firstAddress + k}번지 `, strong(`${name} = ${state.cells[k]}`, i === used.length - 1 ? 'total' : ''));
  });
  return parts;
}

// ---------- Code panel and predictions ----------
function buildCode() {
  const list = byId('code');
  list.replaceChildren();
  step().program.forEach((l) => {
    const li = document.createElement('li');
    const code = document.createElement('code');
    code.textContent = l.code;
    li.classList.toggle('block', l.kind !== 'set');
    li.append(code);
    list.append(li);
  });
}
// Asks answered in this step, by their position in `asks`. An ask is pending when the next line to run is
// its line and its `when` holds. Several asks on one line are asked in order before the line runs.
const answeredAsks = lesson.map(() => new Set());
function pendingAsk() {
  if (state.playing || state.busy || state.halted) return null;
  const v = valuesByName();
  const asks = step().asks;
  const i = asks.findIndex((ask, k) => !answeredAsks[state.index].has(k) && ask.line === state.pc && (!ask.when || ask.when(v)));
  return i >= 0 ? { ...asks[i], id: i } : null;
}
function syncTask() {
  const program = step().program;
  const ask = pendingAsk();
  const choices = byId('try-choices');
  choices.replaceChildren();
  const allDone = answeredAsks[state.index].size >= step().asks.length;
  if (ask) {
    byId('try').classList.remove('solved');
    byId('try-text').textContent = `${ask.line + 1}번째 줄 "${program[ask.line].code.trim()}" · ${ask.q}`;
    byId('try-result').textContent = state.wrong || state.solvedText;
    for (const choice of ask.choices) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'action choice-button';
      button.textContent = choice;
      button.addEventListener('click', () => answer(ask, choice));
      choices.append(button);
    }
  } else if (state.solvedText) {
    byId('try').classList.add('solved');
    byId('try-text').textContent = state.solvedText;
    byId('try-result').textContent = '';
  } else {
    byId('try').classList.remove('solved');
    byId('try-result').textContent = '';
    byId('try-text').textContent = state.halted ? '반복이 끝나지 않아 강제로 멈췄습니다. 처음부터 다시 볼 수 있습니다.'
      : state.pc >= program.length
        ? (allDone ? '이 단계의 예측을 모두 맞혔습니다. 처음부터 다시 실행해 볼 수도 있습니다.' : '처음부터를 눌러 다시 해 보세요.')
        : '"한 줄 실행"을 눌러 다음 줄을 실행해 보세요. 예측 문제가 나오면 먼저 답을 고릅니다.';
  }
}
function answer(ask, choice) {
  if (choice !== ask.answer) {
    state.wrong = `✗ ${choice}이(가) 아닙니다. 다시 골라 보세요.`;
    byId('announcement').textContent = state.wrong;
    syncTask();
    return;
  }
  state.wrong = '';
  answeredAsks[state.index].add(ask.id);
  progress[state.index] = answeredAsks[state.index].size;
  state.solvedText = `✓ 맞았습니다. ${ask.why}`;
  byId('announcement').textContent = state.solvedText;
  if (!pendingAsk()) runLine(() => syncTask());
  syncTask();
  paintCode();
}

function takeOver() {
  if (!state.playing) return;
  state.playing = false;
  resetProgram();
  syncPlayback();
}
function resetProgram() {
  cancelTimers();
  state.pc = 0;
  state.cells = Array(cellCount).fill(null);
  state.names = Array(cellCount).fill(null);
  state.wrong = '';
  state.solvedText = '';
  state.loops = 0;
  state.halted = false;
  state.lastJump = null;
  cpu.work.group.classList.remove('max');
  setPlate(cpu.work, '대기');
  paint();
}
byId('run-line').onclick = () => {
  takeOver();
  if (state.busy) return;
  state.solvedText = '';
  runLine(() => syncTask());
  syncTask();
  byId('announcement').textContent = `${state.pc + 1}번째 줄 실행: ${step().program[state.pc]?.code ?? ''}`;
};
byId('restart').onclick = () => {
  state.playing = false;
  resetProgram();
  syncPlayback();
  byId('announcement').textContent = '처음부터 다시 시작합니다.';
};

// ---------- Demo playback ----------
let frame = null, lastFrame = null;
function demoTick() {
  document.querySelector('.course-step-preview')?.dispatchEvent(new Event('course-playback-start'));
  if (state.busy) { state.wait = 200; return; }
  if (state.pc >= step().program.length || state.halted) {
    resetProgram();
    state.wait = 900;
    return;
  }
  runLine();
  state.wait = 1900;
}
function syncPlayback() {
  const reduced = motion.matches;
  if (reduced) state.playing = false;
  byId('status').textContent = reduced ? '모션 감소 · 직접 실행' : state.playing ? '자동 실행 중' : '직접 실행';
  byId('pause').textContent = state.playing ? '일시정지' : '자동 실행';
  byId('pause').disabled = reduced;
  byId('replay').disabled = reduced;
  if (state.playing) kick();
  syncTask();
}
function sceneTap() {}

// ---------- Steps and routing ----------
function showStep(index, announce = true) {
  state.index = index;
  if (!state.userPaused) state.playing = !motion.matches;
  const s = step();
  byId('step-title').textContent = s.title;
  byId('body').textContent = s.body;
  byId('takeaway').textContent = s.takeaway;
  byId('scene-desc').textContent = s.description;
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  stepButtons.forEach((button, i) => {
    if (i === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  try { localStorage.setItem(storageKey, String(index)); } catch {}
  buildCode();
  resetProgram();
  state.wait = 1000;
  syncPlayback();
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${s.title}`;
}
function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/debugging/${index + 1}`);
  showStep(index);
}
function routeIndex() {
  const match = /^#\/debugging\/(\d+)$/.exec(location.hash);
  const routed = match ? Number(match[1]) - 1 : -1;
  if (routed >= 0 && routed < lesson.length) return routed;
  try {
    const stored = localStorage.getItem(storageKey);
    const index = Number(stored);
    if (stored !== null && Number.isInteger(index) && index >= 0 && index < lesson.length) return index;
  } catch {}
  return 0;
}
const stepButtons = lesson.map(({ label }, index) => {
  const listItem = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  const number = document.createElement('span');
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.addEventListener('click', () => goToStep(index));
  listItem.append(button);
  byId('steps').append(listItem);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
byId('pause').onclick = () => {
  state.playing = !state.playing;
  state.userPaused = !state.playing;
  if (state.playing) { resetProgram(); state.wait = 400; }
  syncPlayback();
  byId('announcement').textContent = byId('status').textContent;
};
byId('replay').onclick = () => {
  state.playing = true;
  state.userPaused = false;
  resetProgram();
  state.wait = 400;
  syncPlayback();
  byId('announcement').textContent = '처음부터 자동 실행';
};
window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
motion.addEventListener('change', () => {
  if (!motion.matches && !state.userPaused) state.playing = true;
  syncPlayback();
});
window.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});

buildScene();
byId('world').setAttribute('transform', 'translate(300 152) scale(1.02)');
const initial = routeIndex();
history.replaceState(null, '', `#/debugging/${initial + 1}`);
state.index = initial;
showStep(initial, false);
</script>
