<body>
<main class="shell">
  <header>
    <p class="eyebrow">5장 운영체제와 네트워크 · 레슨 5.1</p>

    <p class="lead">실행 중인 프로그램은 무엇을 가지고 있을까요? 프로그램을 실행해 프로세스를 띄우고, 메모리 구역과 스레드를 살펴보세요.</p>
  </header>

<script>
const byId = (id) => document.getElementById(id);
const viewport = byId('scene');
const viewWidth = 620;
const viewHeight = 280;
const maxZoom = 3;
const center = { x: viewWidth / 2, y: viewHeight / 2 };
const camera = { x: 0, y: 0, zoom: 1 };
const pointers = new Map();
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));



// Convert from screen pixels to fixed viewport coordinates, accounting for SVG letterboxing.


// A press that starts on a switch and ends without moving toggles that switch.
// Tracked separately from the camera pointers so it also works when the pointer is captured.
let tap = null;
viewport.addEventListener('pointerdown', (event) => {
  const target = event.target.closest?.('[data-input]');
  tap = target && event.button === 0 && pointers.size === 0
    ? { input: target.dataset.input, x: event.clientX, y: event.clientY, id: event.pointerId }
    : null;
});
viewport.addEventListener('pointerup', (event) => {
  if (tap && tap.id === event.pointerId && Math.hypot(event.clientX - tap.x, event.clientY - tap.y) < 8) {
    toggleInput(tap.input);
  }
  tap = null;
});
viewport.addEventListener('pointercancel', () => { tap = null; });

viewport.addEventListener('pointerdown', (event) => {
  if (event.button !== 0 || pointers.size >= 2) return;
  if (event.pointerType !== 'touch' && camera.zoom === 1) return;
  pointers.set(event.pointerId, viewportPoint(event));
  viewport.setPointerCapture(event.pointerId);
});
viewport.addEventListener('pointermove', (event) => {
  if (!pointers.has(event.pointerId)) return;
  const before = pointerGeometry();
  pointers.set(event.pointerId, viewportPoint(event));
  const after = pointerGeometry();
  const pinch = pointers.size === 2;
  if (pinch && (before.distance < 1 || after.distance < 1)) return;
  const zoom = pinch ? camera.zoom * after.distance / before.distance : camera.zoom;
  zoomBetween(zoom, before.point, after.point);
  viewport.classList.toggle('is-dragging', !pinch && camera.zoom > 1);
});
for (const eventName of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  viewport.addEventListener(eventName, (event) => {
    if (pointers.delete(event.pointerId)) viewport.classList.remove('is-dragging');
  });
}



byId('zoom-in').onclick = () => zoomBy(.25);
byId('zoom-out').onclick = () => zoomBy(-.25);
viewport.addEventListener('keydown', (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const directions = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const direction = directions[event.key];
  if (direction && camera.zoom > 1) {
    event.preventDefault();
    setCamera(camera.x + direction[0] * 28 / camera.zoom, camera.y + direction[1] * 28 / camera.zoom, camera.zoom);
  } else if (event.key === '+' || event.key === '=' || event.key === '-') {
    event.preventDefault();
    zoomBy(event.key === '-' ? -.25 : .25);
  } else if (event.key === '0') {
    event.preventDefault();
    resetView();
  }
});
setCamera(0, 0, 1);
// Processes and threads. A process is drawn as a memory tower: code at the bottom, then data, the heap
// growing up, free space, and the stack growing down from the top. Threads stand beside their process,
// each with its own small stack and program counter (PC), sharing everything in the tower.
const lesson = [
  {
    label: '프로그램과 프로세스',
    example: ["SSD의 메모장 파일", "프로그램 실행", "RAM에 프로세스 생성"],
    title: '실행 중인 프로그램이 프로세스다',
    body: '프로그램은 SSD에 저장된 실행 파일(3.8)일 뿐입니다. 실행하면 운영체제가 RAM에 자리를 마련해 코드를 올리고, 번호(PID)를 붙여 하나의 프로세스로 관리합니다. 같은 프로그램을 두 번 실행하면 프로세스가 둘 생기고, 각자 자기 메모리를 따로 가집니다.',
    takeaway: '"메모장 실행"을 두 번 누르면 PID가 다른 탑이 둘 섭니다. 코드는 같은 파일에서 왔지만, 한쪽에 글을 써도 다른 쪽에는 나타나지 않습니다. 각자 메모리가 따로이기 때문입니다.',
    description: '왼쪽 SSD에 메모장 실행 파일이 있습니다. 실행하면 오른쪽 RAM 위에 프로세스의 메모리 탑이 하나씩 섭니다.',
    mode: 'launch',
    tasks: [
      { text: '"메모장 실행"을 두 번 눌러 보세요.', test: (s) => s.procs.length >= 2, ok: 'PID가 다른 프로세스가 둘 생겼습니다.' },
      { ask: '두 메모장 중 하나에 글을 쓰면 다른 메모장의 메모리는?', choices: ['같이 바뀐다', '그대로다'], answer: '그대로다', why: '프로세스마다 메모리가 따로라 서로의 데이터를 볼 수 없습니다.' },
    ],
  },
  {
    label: '프로세스의 메모리',
    readingDiagram: {
      title: "호출하면 쌓이고 반환하면 사라진다",
      description: "호출하면 쌓이고 반환하면 사라진다",
      nodes: [
        ["base", 100, 125, 154, 54, ["호출 전", "호출자 · PC 12"], "active"],
        ["call", 310, 125, 163, 74, ["호출 중", "함수 · PC 28", "호출자 · PC 12"], "active"],
        ["end", 520, 125, 153, 54, ["반환 후", "호출자 · PC 12"], "active"],
      ],
      edges: [

const motion = matchMedia('(prefers-reduced-motion: reduce)');
const storageKey = 'process-lab:v1:step';
const state = { index: 0, procs: [], nextPid: 101, crashed: false, corrupted: false, playing: !motion.matches,
  wait: 0, solved: '', wrong: '', demoPosition: 0, fresh: null };
const progress = lesson.map(() => 0);

const project = (x, y, z = 0) => [14 * (x + y), 7 * (x - y) - z];
const point = (x, y, z) => project(x, y, z).map((value) => +value.toFixed(2)).join(',');
const flat = (u, v, z = 0) => [14 * u, 7 * v - z];
const gridLines = [];
for (let i = -24; i <= 40; i += 2) gridLines.push(`M${point(i, -24, 0)}L${point(i, 40, 0)}M${point(-24, i, 0)}L${point(40, i, 0)}`);
byId('grid').setAttribute('d', gridLines.join(''));
function drawBox(node, h, H, z0 = 0, cls = '') {
  const g = svg('g', { class: 'seg ' + cls }, node);
  const faces = {
    left: [[-h, -h, z0], [h, -h, z0], [h, -h, z0 + H], [-h, -h, z0 + H]],
    right: [[h, -h, z0], [h, h, z0], [h, h, z0 + H], [h, -h, z0 + H]],
    top: [[-h, -h, z0 + H], [h, -h, z0 + H], [h, h, z0 + H], [-h, h, z0 + H]],
  };
  for (const [name, corners] of Object.entries(faces)) svg('polygon', { class: 'face ' + name, points: corners.map((p) => point(...p)).join(' ') }, g);
  return g;
}
function label(node, x, y, text, cls = 'seg-label') {
  const t = svg('text', { class: cls, x, y }, node);
  t.textContent = text;
  return t;
}

// ---------- Model ----------
const towerH = 112;
function newProc(name, threads = 1) {
  return { pid: state.nextPid++, name, frames: 1, heap: 1, threads: Array.from({ length: threads }, (_, i) => ({ id: i + 1, frames: 1, pc: 4 + i * 3 })), dead: false };
}

// ---------- Scene ----------
function buildScene() {
  for (const id of ['casings', 'links', 'nodes', 'packets']) byId(id).replaceChildren();
  const mode = lesson[state.index].mode;
  // RAM floor area.
  const ramLeft = mode === 'launch' ? 4 : 1;
  const ramRight = { launch: 27.5, memory: 11, threads: 19, isolation: 30 }[mode];
  const area = [[ramLeft, -5], [ramRight, -5], [ramRight, 6.5], [ramLeft, 6.5]];
  svg('polygon', { class: 'ram-floor', points: area.map(([u, v]) => flat(u, v).join(',')).join(' ') }, byId('casings'));
  const ramTag = svg('text', { class: 'area-tag', x: flat(ramLeft + 1.2, 6.5)[0], y: flat(ramLeft + 1.2, 6.5)[1] + 16 }, svg('g', { class: 'area-name' }, byId('casings')));
  ramTag.textContent = 'RAM';
  if (mode === 'launch') {
    const ssd = svg('g', { class: 'node ssd', transform: `translate(${flat(-2.5, 1).join(' ')})` }, byId('nodes'));
    drawShadow(ssd, 1.7);
    drawBox(ssd, 1.7, 12, 0, 'ssd-box');
    label(ssd, 0, 34, 'SSD', 'area-tag');
    const file = svg('g', { transform: 'translate(0 -12)' }, ssd);
    drawBox(file, .8, 4, 0, 'file');
    label(file, 0, -16, '메모장.exe', 'file-label');
  }
  // Towers.
  // Towers stand a full width apart, so one tower never hides the next one's name plate.
  const spots = mode === 'launch' ? [7.5, 15.5, 23.5] : mode === 'isolation' ? [4, 18.5] : [5];
  state.procs.forEach((proc, k) => drawProcess(proc, spots[k], mode));
  const left = mode === 'launch' ? 14 * -5 - 30 : 14 * -2 - 30, right = 14 * (ramRight + 1) + 10;
  const top = -towerH - 60, bottom = 7 * 6.5 + 34;
  // A still picture keeps a strip at the top for the example note.
  const strip = motion.matches ? 30 : 0;
  const scale = Math.min(1.6, 590 / (right - left), (268 - strip) / (bottom - top));
  const x = 310 - scale * (left + right) / 2, y = 140 + strip / 2 - scale * (top + bottom) / 2;
  byId('world').setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${scale.toFixed(3)})`);
}
function drawProcess(proc, u, mode) {
  const h = 1.9;
  const node = svg('g', { class: 'node proc' + (proc.dead ? ' dead' : '') + (state.fresh === proc.pid ? ' fresh' : ''), transform: `translate(${flat(u, 0).join(' ')})` }, byId('nodes'));
  drawShadow(node, h);
  const codeH = 20, dataH = 15, frameH = 13, heapUnit = 12;
  let z = 0;
  drawBox(node, h, codeH, z, 'code'); z += codeH;
  drawBox(node, h, dataH, z, 'data' + (state.corrupted && proc.name === 'A' ? ' broken' : '')); z += dataH;
  const heapH = proc.heap * heapUnit;
  drawBox(node, h, heapH, z, 'heap'); z += heapH;
  const stackTotal = (mode === 'threads' || mode === 'isolation') ? 0 : proc.frames * frameH;
  const free = towerH - z - stackTotal;
  if (free > 0) drawBox(node, h, free, z, 'free');
  for (let f = 0; f < stackTotal / frameH; f++) drawBox(node, h, frameH - .6, towerH - (f + 1) * frameH + .3, 'stack' + (f === proc.frames - 1 ? ' top-frame' : ''));
  // Region names on the front face.
  const face = (zMid, text) => label(node, -14 * h + 2, 7 * h - zMid + 2, text);
  face(codeH / 2, '코드');
  const dataValue = state.corrupted && proc.name === 'A' ? 9 : 7;
  face(codeH + dataH / 2, mode === 'isolation' ? `x = ${dataValue}` : '데이터');
  face(codeH + dataH + heapH / 2, '힙');
  if (stackTotal) face(towerH - stackTotal / 2, '스택');
  if (free > 18 && !proc.dead) face(codeH + dataH + heapH + free / 2, '빈 공간');
  // Name plate.
  const plate = svg('g', { class: 'proc-plate', transform: `translate(0 ${-towerH - 14 * h - 16})` }, node);
  svg('rect', { x: -52, y: -11, width: 104, height: 22, rx: 6 }, plate);
  label(plate, 0, 1, `${proc.name} · PID ${proc.pid}`, 'plate-text');
  if (mode === 'memory') {
    const pc = svg('g', { class: 'pc-tag', transform: `translate(${14 * h + 34} ${-towerH + 10})` }, node);
    svg('rect', { x: -30, y: -10, width: 60, height: 20, rx: 10 }, pc);
    label(pc, 0, 1, `PC = ${proc.pc ?? 12}`, 'plate-text');
  }
  if (proc.dead) label(node, 0, -towerH / 2, '종료됨', 'dead-label');
  // Threads.
  if (mode === 'threads' || mode === 'isolation') {
    proc.threads.forEach((t, i) => {
      // Threads stand clear of the tower's box and shadow, so the line between them touches neither.
      const tu = u + 5.2 + i * (mode === 'threads' ? 4.4 : 3.6), tv = 3.4;
      const tn = svg('g', { class: 'node thread' + (state.corrupted && proc.name === 'A' ? ' hurt' : '') + (proc.dead ? ' dead' : ''), transform: `translate(${flat(tu, tv).join(' ')})` }, byId('nodes'));
      drawShadow(tn, .6);
      for (let f = 0; f < t.frames; f++) drawBox(tn, .55, 6, f * 6.6, 'stack');
      label(tn, 0, -t.frames * 6.6 - 22, `스레드 ${t.id}`, 'thread-label');
      const pc = svg('g', { class: 'pc-tag', transform: `translate(0 ${-t.frames * 6.6 - 8})` }, tn);
      svg('rect', { x: -21, y: -8, width: 42, height: 16, rx: 8 }, pc);
      label(pc, 0, 1, `PC ${t.pc}`, 'pc-text');
      if (mode === 'isolation') label(tn, 0, 15, `x = ${dataValue}`, 'pc-text');
      // Line to the tower it shares code, data and heap with: on the floor, in a lane in front of the threads. It
      // runs just in front of the threads' and the tower's shadows, so it never runs under a box or its names.
      const lane = 6;
      const d = [[tu, lane], [u + 1.2, lane]].map(([a, b], k) => (k ? 'L' : 'M') + flat(a, b).join(' ')).join('');
      svg('path', { class: 'share' + (proc.dead ? ' dead' : ''), d }, byId('links'));
    });
  }
}

// ---------- Actions ----------
function act(kind, user) {
  const mode = lesson[state.index].mode;
  const p = state.procs[0];
  let text = '';
  state.fresh = null;
  if (kind === 'launch') {
    if (state.procs.length >= 3) { report('이 장면에서는 세 개까지 띄웁니다.'); return; }
    const proc = newProc('메모장');
    state.procs.push(proc);
    state.fresh = proc.pid;
    text = `메모장을 실행했습니다. 운영체제가 RAM에 자리를 만들고 PID ${proc.pid}를 붙였습니다. 프로세스 ${state.procs.length}개.`;
  }
  if (kind === 'call') {
    if (p.frames + p.heap >= 9) { text = '스택과 힙이 만났습니다. 더 부르면 스택 넘침입니다.'; }
    else { p.frames++; p.pc = 20 + p.frames * 4; text = `함수를 불러 스택에 층이 쌓였습니다(${p.frames}층). PC는 함수의 코드 ${p.pc}번지로 갑니다.`; }
  }
  if (kind === 'return') {
    if (p.frames <= 1) text = '맨 바깥 층만 남아 돌아갈 곳이 없습니다.';
    else { p.frames--; p.pc = p.frames === 1 ? 12 : 20 + p.frames * 4; text = `함수가 끝나 스택 맨 위 층이 사라졌습니다(${p.frames}층).`; }
  }
  if (kind === 'alloc') {
    if (p.frames + p.heap >= 9) text = '힙과 스택이 만났습니다. 메모리가 부족합니다.';
    else { p.heap++; text = `새 값을 만들어 힙이 커졌습니다(${p.heap}칸). 지역 변수와 달리 함수가 끝나도 남습니다.`; }
  }
  if (kind === 'thread') {
    if (p.threads.length >= 3) text = '이 장면에서는 스레드를 셋까지 둡니다.';
    else { p.threads.push({ id: p.threads.length + 1, frames: 1 + p.threads.length % 2, pc: 7 + p.threads.length * 5 }); text = `스레드 ${p.threads.length}를 만들었습니다. 자기 스택과 PC를 가지고, 코드·데이터·힙은 함께 씁니다.`; }
  }
  if (kind === 'crash') {
    const b = state.procs[1];
    if (!b || b.dead) text = 'B는 이미 끝났습니다.';
    else { b.dead = true; state.crashed = true; text = 'B에서 0으로 나누기 오류가 나 운영체제가 B를 끝냈습니다. A는 메모리가 따로라 아무 일 없이 계속 돕니다.'; }
  }
  if (kind === 'corrupt') {
    state.corrupted = true;
    text = 'A의 스레드 1이 데이터 구역의 값을 잘못 덮어썼습니다. 같은 데이터를 쓰는 A의 다른 스레드도 망가진 값을 읽게 됩니다. B는 영향이 없습니다.';
  }
  if (kind === 'reset') { resetStep(); text = '처음 상태로 되돌렸습니다.'; }
  buildScene();
  report(text);
  if (user) afterUser();
}
function report(text) { byId('readout').textContent = text; byId('announcement').textContent = text; }
function resetStep() {
  const mode = lesson[state.index].mode;
  state.nextPid = 101;
  state.crashed = false;
  state.corrupted = false;
  state.fresh = null;
  // The same notepad as step 1 carries on into steps 2 and 3, so the label names the process, not "a program".
  state.procs = mode === 'launch' ? [] : mode === 'isolation' ? [newProc('A', 2), newProc('B', 2)] : [newProc('메모장')];
  if (mode === 'memory') state.procs[0].pc = 12;
}
function buildControls() {
  const mode = lesson[state.index].mode;
  const row = byId('ops');
  row.replaceChildren();
  const add = (text, kind, primary = false) => {
    const b = Object.assign(document.createElement('button'), { type: 'button', className: 'action' + (primary ? ' primary' : ''), textContent: text });
    b.addEventListener('click', () => { takeOver(); act(kind, true); });
    row.append(b);
  };
  if (mode === 'launch') add('메모장 실행', 'launch', true);
  if (mode === 'memory') { add('함수 호출', 'call', true); add('함수 반환', 'return'); add('새 값 만들기', 'alloc', true); }
  if (mode === 'threads') add('스레드 추가', 'thread', true);
  if (mode === 'isolation') { add('B에서 오류 내기', 'crash', true); add('A의 스레드가 데이터 망가뜨리기', 'corrupt', true); }
  add('처음 상태로', 'reset');
}

// ---------- Tasks ----------
const currentTask = () => lesson[state.index].tasks[progress[state.index]];
function syncTask() {
  const tasks = lesson[state.index].tasks;
  const task = currentTask();
  const choices = byId('try-choices');
  choices.replaceChildren();
  byId('try').classList.toggle('solved', Boolean(state.solved) && !task?.ask);
  if (task?.ask) {
    byId('try-text').textContent = task.ask;
    byId('try-result').textContent = state.wrong || (state.solved ? `✓ 맞았습니다. ${state.solved}` : '');
    for (const choice of task.choices) {
      const b = Object.assign(document.createElement('button'), { type: 'button', className: 'action choice-button', textContent: choice });
      b.addEventListener('click', () => answer(choice));
      choices.append(b);
    }
    return;
  }
  byId('try-text').textContent = task ? task.text : (state.solved ? '' : '이 단계의 문제를 모두 풀었습니다. 자유롭게 해 보세요.');
  byId('try-result').textContent = state.solved ? `✓ 맞았습니다. ${state.solved}${progress[state.index] >= tasks.length ? ' · 이 단계의 문제를 모두 풀었습니다.' : ''}` : '';
}
// Only the learner's own actions count, so the demo cannot solve a problem.
function afterUser() {
  const task = currentTask();
  if (task && !task.ask && task.test(state)) { progress[state.index]++; state.solved = task.ok; state.wrong = ''; }
  syncTask();
}
function answer(choice) {
  const task = currentTask();
  if (choice !== task.answer) { state.wrong = `✗ ${choice}이(가) 아닙니다. 다시 골라 보세요.`; syncTask(); return; }
  progress[state.index]++;
  state.wrong = '';
  state.solved = task.why;
  syncTask();
}

// ---------- Demo ----------
let frame = null, lastFrame = null;
function takeOver() {
  if (!state.playing) return;
  state.playing = false;
  resetStep();
  buildScene();
  syncPlayback();
}
const demoPlans = {
  launch: ['launch', 'launch', 'launch', 'reset'],
  memory: ['call', 'call', 'alloc', 'call', 'return', 'alloc', 'return', 'return', 'reset'],
  threads: ['thread', 'thread', 'reset'],
  isolation: ['corrupt', 'reset', 'crash', 'reset'],
};
function demoTick() {
  const plan = demoPlans[lesson[state.index].mode];
  act(plan[state.demoPosition++ % plan.length], false);
  state.wait = 2200;
}
function tick(now) {
  frame = null;
  const elapsed = lastFrame === null ? 0 : Math.min(now - lastFrame, 80);
  lastFrame = now;
  if (state.playing) {
    state.wait -= elapsed;
    if (state.wait <= 0) demoTick();
    frame = requestAnimationFrame(tick);
  } else lastFrame = null;
}
function syncPlayback() {
  const reduced = motion.matches;
  if (reduced) state.playing = false;
  if (state.playing && frame === null) frame = requestAnimationFrame(tick);
}

// ---------- Steps and routing ----------
function showStep(index, announce = true) {
  state.index = index;
  state.playing = !motion.matches;
  const s = lesson[index];
  state.solved = '';
  state.wrong = '';
  state.demoPosition = 0;
  byId('step-title').textContent = s.title;
  byId('body').textContent = s.body;
  byId('takeaway').textContent = s.takeaway;
  byId('scene-desc').textContent = s.description;
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  stepButtons.forEach((button, i) => {
    if (i === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  try { localStorage.setItem(storageKey, String(index)); } catch {}
  buildControls();
  resetStep();
  buildScene();
  report('버튼을 눌러 보세요.');
  syncTask();
  state.wait = 900;
  syncPlayback();
  // Nothing plays with reduced motion, so the still picture runs the step's example once and notes it at the top.
  byId('example-note')?.remove();
  if (motion.matches) {
    const example = {
      launch: ['launch', '메모장.exe 실행 → 운영체제가 RAM에 자리를 만들어 프로세스 PID 101'],
      memory: ['call', '함수 호출 → 스택에 층이 하나 쌓임 (2층) · 함수가 끝나면 그 층이 사라짐'],
      threads: ['thread', '스레드 2개: 코드·데이터·힙은 함께 쓰고 · 스택과 PC는 각자'],
      isolation: ['corrupt', 'PID 101의 쓰기 x: 7 → 9 · PID 102는 7 유지'],
    }[s.mode];
    act(example[0], false);
    exampleNote(example[1]);
  }
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${s.title}`;
}
function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/process/${index + 1}`);
  showStep(index);
}
function routeIndex() {
  const match = /^#\/process\/(\d+)$/.exec(location.hash);
  const routed = match ? Number(match[1]) - 1 : -1;
  if (routed >= 0 && routed < lesson.length) return routed;
  try {
    const stored = localStorage.getItem(storageKey);
    const index = Number(stored);
    if (stored !== null && Number.isInteger(index) && index >= 0 && index < lesson.length) return index;
  } catch {}
  return 0;
}
const stepButtons = lesson.map(({ label }, index) => {
  const listItem = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  const number = document.createElement('span');
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.addEventListener('click', () => goToStep(index));
  listItem.append(button);
  byId('steps').append(listItem);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
motion.addEventListener('change', () => {
  if (!motion.matches) state.playing = true;
  syncPlayback();
});
window.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});
const initial = routeIndex();
history.replaceState(null, '', `#/process/${initial + 1}`);
state.index = -1;
showStep(initial, false);
</script>
</body>
