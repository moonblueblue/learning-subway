<script>
const byId = (id) => document.getElementById(id);
const viewport = byId('scene');
const viewWidth = 620;
const viewHeight = 280;
const maxZoom = 3;
const center = { x: viewWidth / 2, y: viewHeight / 2 };
const camera = { x: 0, y: 0, zoom: 1 };
const pointers = new Map();
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));



// Convert from screen pixels to fixed viewport coordinates, accounting for SVG letterboxing.


// A press that starts on a scene object and ends without moving counts as a tap on it.
// Tracked separately from the camera pointers so it also works when the pointer is captured.
let tap = null;
viewport.addEventListener('pointerdown', (event) => {
  const target = event.target.closest?.('[data-hit]');
  tap = target && event.button === 0 && pointers.size === 0
    ? { hit: target.dataset.hit, x: event.clientX, y: event.clientY, id: event.pointerId }
    : null;
});
viewport.addEventListener('pointerup', (event) => {
  if (tap && tap.id === event.pointerId && Math.hypot(event.clientX - tap.x, event.clientY - tap.y) < 8) {
    sceneTap(tap.hit);
  }
  tap = null;
});
viewport.addEventListener('pointercancel', () => { tap = null; });

viewport.addEventListener('pointerdown', (event) => {
  if (event.button !== 0 || pointers.size >= 2) return;
  if (event.pointerType !== 'touch' && camera.zoom === 1) return;
  pointers.set(event.pointerId, viewportPoint(event));
  viewport.setPointerCapture(event.pointerId);
});
viewport.addEventListener('pointermove', (event) => {
  if (!pointers.has(event.pointerId)) return;
  const before = pointerGeometry();
  pointers.set(event.pointerId, viewportPoint(event));
  const after = pointerGeometry();
  const pinch = pointers.size === 2;
  if (pinch && (before.distance < 1 || after.distance < 1)) return;
  const zoom = pinch ? camera.zoom * after.distance / before.distance : camera.zoom;
  zoomBetween(zoom, before.point, after.point);
  viewport.classList.toggle('is-dragging', !pinch && camera.zoom > 1);
});
for (const eventName of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  viewport.addEventListener(eventName, (event) => {
    if (pointers.delete(event.pointerId)) viewport.classList.remove('is-dragging');
  });
}



byId('zoom-in').onclick = () => zoomBy(.25);
byId('zoom-out').onclick = () => zoomBy(-.25);
viewport.addEventListener('keydown', (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const directions = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const direction = directions[event.key];
  if (direction && camera.zoom > 1) {
    event.preventDefault();
    setCamera(camera.x + direction[0] * 28 / camera.zoom, camera.y + direction[1] * 28 / camera.zoom, camera.zoom);
  } else if (event.key === '+' || event.key === '=' || event.key === '-') {
    event.preventDefault();
    zoomBy(event.key === '-' ? -.25 : .25);
  } else if (event.key === '0') {
    event.preventDefault();
    resetView();
  }
});
setCamera(0, 0, 1);

const motion = matchMedia('(prefers-reduced-motion: reduce)');
const storageKey = 'recursion-lab:v1:step';

// Program lines (Python). Kinds:
//   def    – a function header; running it just skips its body (to `skip`)
//   if     – tests `test`; true goes to the next line, false jumps to `to`
//   call   – pushes a frame for `fn` with `params` bound to `args`, jumps to `entry`;
//            the returned value goes into `write` of the calling frame
//   return – computes a value, pops the frame and hands the value back
const def = (code, skip) => ({ kind: 'def', code, skip });
const when = (code, test, show, to) => ({ kind: 'if', code, test, show, to });
const call = (code, write, fn, args, params, entry) => ({ kind: 'call', code, write, fn, args, params, entry });
const ret = (code, calc, show) => ({ kind: 'return', code, calc, show });
const lesson = [

const step = () => lesson[state.index];
const state = { index: 0, playing: !motion.matches, wait: 0, pc: 0, busy: false,
  frames: [], wrong: '', solvedText: '', halted: false, lastJump: null, ran: new Set(), calls: new Map() };
const progress = lesson.map(() => 0);
const project = (x, y, z = 0) => [14 * (x + y), 7 * (x - y) - z];
const point = (x, y, z) => project(x, y, z).map((value) => +value.toFixed(2)).join(',');
const mix = (a, b, t) => a + (b - a) * t;
const gridLines = [];
for (let i = -22; i <= 22; i += 2) {
  gridLines.push(`M${point(i, -22, 0)}L${point(i, 22, 0)}M${point(-22, i, 0)}L${point(22, i, 0)}`);
}

function drawFaces(node, h, H, fills) {
  const faces = {
    left: [[-h, -h, 0], [h, -h, 0], [h, -h, H], [-h, -h, H]],
    right: [[h, -h, 0], [h, h, 0], [h, h, H], [h, -h, H]],
    top: [[-h, -h, H], [h, -h, H], [h, h, H], [-h, h, H]],
  };
  for (const [name, corners] of Object.entries(faces)) {
    const attrs = { class: 'face ' + name, points: corners.map((p) => point(...p)).join(' ') };
    if (fills) Object.assign(attrs, { fill: fills[name], stroke: fills.stroke });
    svg('polygon', attrs, node);
  }
  svg('path', { class: 'highlight', d: `M${point(-h, -h, H)}L${point(h, -h, H)}L${point(h, h, H)}` }, node);
}

// Plates are small labels whose box is sized to the text.
let plates = [];
function addPlate(node, className, x, y, text, { pad = 1.5, round = true } = {}) {
  const group = svg('g', { class: className }, node);
  const plate = { group, rect: svg('rect', {}, group), label: svg('text', {}, group), x, y, pad, round };
  plate.label.textContent = text;
  plates.push(plate);
  sizePlate(plate);
  return plate;
}
matchMedia('(max-width: 600px)').addEventListener('change', () => plates.forEach(sizePlate));



// ---------- The call stack: frames piled up as flat slabs ----------
const slabHalf = 2.3, slabHeight = 15, slabGap = 1.5;
const slabZ = (k) => 6 + k * (slabHeight + slabGap);
const frameViews = [];
let work;
function buildScene() {
  const base = svg('g', { class: 'node stack-base' }, byId('nodes'));
  drawShadow(base, slabHalf + .4);
  drawFaces(base, slabHalf + .4, 5, { top: '#e9eeeb', left: '#cfd8d3', right: '#b7c3bd', stroke: '#93a39b' });
  const [bx, by] = project(-slabHalf - .4, -slabHalf - .4, 0);
  addPlate(base, 'tag', bx - 30, by + 6, '호출 스택');
  work = addPlate(byId('packets'), 'total', 190, -196, '대기', { pad: 1.1, round: false });
}
function slabFaces(node, z0, fills) {
  const h = slabHalf, z1 = z0 + slabHeight;
  const faces = {
    left: [[-h, -h, z0], [h, -h, z0], [h, -h, z1], [-h, -h, z1]],
    right: [[h, -h, z0], [h, h, z0], [h, h, z1], [h, -h, z1]],
    top: [[-h, -h, z1], [h, -h, z1], [h, h, z1], [-h, h, z1]],
  };
  for (const [name, corners] of Object.entries(faces)) {
    svg('polygon', { class: 'face ' + name, points: corners.map((p) => point(...p)).join(' '), ...(fills ? { fill: fills[name], stroke: fills.stroke } : {}) }, node);
  }
  svg('path', { class: 'highlight', d: `M${point(-h, -h, z1)}L${point(h, -h, z1)}L${point(h, h, z1)}` }, node);
}
function frameLabel(f) {
  if (!f.ret) return `${f.name}${Object.keys(f.vars).length ? ' · ' + Object.entries(f.vars).map(([k, v]) => `${k} = ${v}`).join(', ') : ''}`;
  const [first, ...rest] = Object.entries(f.vars);
  return `${f.name}(${first[1]})${rest.length ? ' · ' + rest.map(([k, v]) => `${k} = ${v}`).join(', ') : ''}`;
}
function pushView(f, k) {
  const node = svg('g', { class: `node frame ${k === 0 ? 'outer' : 'inner'} entering` }, byId('nodes'));
  slabFaces(node, slabZ(k));
  const [x, y] = project(slabHalf, 0, slabZ(k) + slabHeight / 2);
  const label = addPlate(node, 'tag frame-label', x + 16, y, frameLabel(f));
  label.x = x + 16;
  frameViews.push({ node, label });
  node.getBBox();
  requestAnimationFrame(() => node.classList.remove('entering'));
}
function popView() {
  const view = frameViews.pop();
  view.node.classList.add('leaving');
  later(motion.matches ? 0 : 400, () => view.node.remove());
}
function syncViews() {
  frameViews.forEach((view, k) => {
    view.label.label.textContent = frameLabel(state.frames[k]);
    sizePlateLeft(view.label);
    view.node.classList.toggle('top', k === frameViews.length - 1);
  });
}
// Frame labels grow to the right from their left edge.
function sizePlateLeft(plate) {
  const size = parseFloat(getComputedStyle(plate.label).fontSize);
  const width = plate.label.getComputedTextLength() + size * 1.5;
  const height = size + 8;
  plate.label.setAttribute('x', plate.x + width / 2);
  plate.label.setAttribute('y', plate.y);
  Object.entries({ x: plate.x, y: plate.y - height / 2, width, height, rx: height / 2 }).forEach(([key, value]) => plate.rect.setAttribute(key, value));
}

// A returned value drops from the finished frame to the frame below.
let packets = [];
function sendDown(fromK, value) {
  if (motion.matches) return;
  const [x, y0] = project(slabHalf * .2, -slabHalf * .2, slabZ(fromK) + slabHeight + 4);
  const [, y1] = project(slabHalf * .2, -slabHalf * .2, slabZ(fromK - 1) + slabHeight + 4);
  const group = svg('g', { class: 'packet-group write' }, byId('packets'));
  svg('circle', { class: 'packet-halo', r: 9 }, group);
  svg('circle', { class: 'packet', r: 4.6 }, group);
  svg('text', { class: 'packet-label', y: -10 }, group).textContent = value;
  packets.push({ group, x, y0, y1, start: performance.now(), duration: 700 });
  kick();
}
function movePackets(now) {
  packets = packets.filter((p) => {
    const t = (now - p.start) / p.duration;
    if (t >= 1) { p.group.remove(); return false; }
    p.group.setAttribute('transform', `translate(${p.x} ${mix(p.y0, p.y1, t)})`);
    return true;
  });
}

// ---------- Running a line ----------
const valuesByName = () => ({ ...(state.frames[state.frames.length - 1]?.vars ?? {}) });
function runLine(done) {
  const s = step();
  const l = s.program[state.pc];
  if (!l || state.halted) return;
  const top = state.frames[state.frames.length - 1];
  const v = { ...top.vars };
  state.busy = true;
  state.ran.add(state.pc);
  const finish = (next) => {
    state.lastJump = next !== state.pc + 1 ? state.pc : null;
    state.pc = next;
    state.busy = false;
    paint();
    done?.();
  };
  if (l.kind === 'def') {
    setPlate(work, '함수 정의만 기억');
    later(motion.matches ? 0 : 450, () => finish(l.skip));
  } else if (l.kind === 'if') {
    const ok = l.test(v);
    setPlate(work, `${l.show(v)} → ${ok ? '참' : '거짓'}`);
    later(motion.matches ? 0 : 500, () => finish(ok ? state.pc + 1 : l.to));
  } else if (l.kind === 'call') {
    const args = l.args(v);
    const frame = { name: l.fn, vars: Object.fromEntries(l.params.map((p, i) => [p, args[i]])), ret: { pc: state.pc, write: l.write } };
    state.frames.push(frame);
    const key = `${l.fn}(${args.join(', ')})`;
    state.calls.set(key, (state.calls.get(key) ?? 0) + 1);
    setPlate(work, `${l.fn}(${args.join(', ')}) 부르기`);
    pushView(frame, state.frames.length - 1);
    if (s.limit && state.frames.length >= s.limit) {
      state.halted = true;
      setPlate(work, '스택 넘침 · RecursionError');
      work.group.classList.add('max');
    }
    later(motion.matches ? 0 : 600, () => finish(state.halted ? state.pc : l.entry));
  } else {
    const value = l.calc(v);
    setPlate(work, `${l.show(v)} 돌려주기`);
    const done = state.frames.pop();
    sendDown(state.frames.length, String(value));
    popView();
    later(motion.matches ? 0 : 720, () => {
      const caller = state.frames[state.frames.length - 1];
      if (done.ret.write) caller.vars[done.ret.write] = value;
      finish(done.ret.pc + 1);
    });
  }
  paintCode();
}

let timers = [];
function later(ms, fn) {
  if (ms === 0) { fn(); return; }
  timers.push(setTimeout(fn, ms));
}
function cancelTimers() {
  timers.forEach(clearTimeout);
  timers = [];
  packets.forEach((packet) => packet.group.remove());
  packets = [];
  state.busy = false;
}
function setPlate(plate, text) {
  plate.label.textContent = text;
  sizePlate(plate);
}

// ---------- Drawing ----------
function paint() {
  syncViews();
  paintCode();
  syncTask();
  byId('readout').replaceChildren(...readout());
}
function paintCode() {
  const program = step().program;
  [...byId('code').children].forEach((li, i) => {
    li.classList.toggle('done', state.ran.has(i) && i !== state.pc);
    li.classList.toggle('current', i === state.pc);
    li.classList.toggle('jumped', i === state.lastJump);
    li.setAttribute('aria-current', i === state.pc ? 'step' : 'false');
  });
  const finished = state.pc >= program.length || state.halted;
  // While the demo plays the button stays enabled, so a click can take over from it.
  byId('run-line').disabled = !state.playing && (finished || state.busy || Boolean(pendingAsk()));
  byId('run-line').textContent = state.halted ? '스택이 넘쳤습니다' : finished ? '끝까지 실행했습니다' : '한 줄 실행';
}
function readout() {
  const strong = (text, className) => {
    const element = document.createElement('b');
    if (className) element.className = className;
    element.textContent = text;
    return element;
  };
  const top = state.frames[state.frames.length - 1];
  const total = [...state.calls.values()].reduce((a, b) => a + b, 0);
  const repeated = [...state.calls].filter(([, n]) => n > 1).map(([k, n]) => `${k} ${n}번`).join(', ');
  return ['스택 ', strong(`${state.frames.length}층`, 'total'), ' · 부른 횟수 ', strong(`${total}번`), ...(repeated ? [` (${repeated})`] : []), ' · 맨 위 ', strong(top ? top.name : '없음'),
    ...(top && Object.keys(top.vars).length ? [' · ', Object.entries(top.vars).map(([k, v]) => `${k} = ${v}`).join(', ')] : [])];
}

// ---------- Code panel and predictions ----------
function buildCode() {
  const list = byId('code');
  list.replaceChildren();
  step().program.forEach((l) => {
    const li = document.createElement('li');
    const code = document.createElement('code');
    code.textContent = l.code;
    li.classList.toggle('block', l.kind !== 'set');
    li.append(code);
    list.append(li);
  });
}
// Asks answered in this step, by their position in `asks`. An ask is pending when the next line is
// its line and its `when` holds. `at: 'before-next'` asks about the line after a branch, so it belongs to the next line.
const answeredAsks = lesson.map(() => new Set());
function pendingAsk() {
  if (state.playing || state.busy || state.halted) return null;
  const v = valuesByName();
  const asks = step().asks;
  const i = asks.findIndex((ask, k) => !answeredAsks[state.index].has(k) && ask.line === state.pc && (!ask.when || ask.when(v)));
  return i >= 0 ? { ...asks[i], id: i } : null;
}
function syncTask() {
  const program = step().program;
  const ask = pendingAsk();
  const choices = byId('try-choices');
  choices.replaceChildren();
  const allDone = answeredAsks[state.index].size >= step().asks.length;
  if (ask) {
    byId('try').classList.remove('solved');
    byId('try-text').textContent = `${ask.line + 1}번째 줄 "${program[ask.line].code.trim()}" · ${ask.q}`;
    byId('try-result').textContent = state.wrong || state.solvedText;
    for (const choice of ask.choices) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'action choice-button';
      button.textContent = choice;
      button.addEventListener('click', () => answer(ask, choice));
      choices.append(button);
    }
  } else if (state.solvedText) {
    byId('try').classList.add('solved');
    byId('try-text').textContent = state.solvedText;
    byId('try-result').textContent = '';
  } else {
    byId('try').classList.remove('solved');
    byId('try-result').textContent = '';
    byId('try-text').textContent = state.halted ? '스택이 넘쳐 멈췄습니다. 처음부터 다시 볼 수 있습니다.'
      : state.pc >= program.length
        ? (allDone ? '이 단계의 예측을 모두 맞혔습니다. 처음부터 다시 실행해 볼 수도 있습니다.' : '처음부터를 눌러 다시 해 보세요.')
        : '"한 줄 실행"을 눌러 다음 줄을 실행해 보세요. 예측 문제가 나오면 먼저 답을 고릅니다.';
  }
}
function answer(ask, choice) {
  if (choice !== ask.answer) {
    state.wrong = `✗ ${choice}이(가) 아닙니다. 다시 골라 보세요.`;
    byId('announcement').textContent = state.wrong;
    syncTask();
    return;
  }
  state.wrong = '';
  answeredAsks[state.index].add(ask.id);
  progress[state.index] = answeredAsks[state.index].size;
  state.solvedText = `✓ 맞았습니다. ${ask.why}`;
  byId('announcement').textContent = state.solvedText;
  if (!pendingAsk()) runLine(() => syncTask());
  syncTask();
  paintCode();
}


function takeOver() {
  if (!state.playing) return;
  state.playing = false;
  resetProgram();
  syncPlayback();
}
function resetProgram() {
  cancelTimers();
  frameViews.length = 0;
  byId('nodes').querySelectorAll('.frame').forEach((node) => node.remove());
  state.frames = [{ name: '맨 바깥', vars: {}, ret: null }];
  pushView(state.frames[0], 0);
  state.pc = step().start;
  state.wrong = '';
  state.solvedText = '';
  state.halted = false;
  state.lastJump = null;
  state.ran = new Set();
  state.calls = new Map();
  work.group.classList.remove('max');
  setPlate(work, '대기');
  paint();
}
byId('run-line').onclick = () => {
  takeOver();
  if (state.busy) return;
  state.solvedText = '';
  runLine(() => syncTask());
  syncTask();
  byId('announcement').textContent = `${state.pc + 1}번째 줄 실행: ${step().program[state.pc]?.code ?? ''}`;
};
byId('restart').onclick = () => {
  state.playing = false;
  resetProgram();
  syncPlayback();
  byId('announcement').textContent = '처음부터 다시 시작합니다.';
};


// ---------- Demo playback ----------
let frame = null, lastFrame = null;
function demoTick() {
  document.querySelector('.course-step-preview')?.dispatchEvent(new Event('course-playback-start'));
  if (state.busy) { state.wait = 200; return; }
  if (state.pc >= step().program.length || state.halted) {
    resetProgram();
    state.wait = 900;
    return;
  }
  runLine();
  state.wait = 1700;
}
function syncPlayback() {
  const reduced = motion.matches;
  if (reduced) state.playing = false;
  if (state.playing) kick();
  syncTask();
}
function sceneTap() {}
// ---------- Steps and routing ----------
function showStep(index, announce = true) {
  state.index = index;
  state.playing = !motion.matches;
  const s = step();
  byId('step-title').textContent = s.title;
  byId('body').textContent = s.body;
  byId('takeaway').textContent = s.takeaway;
  byId('scene-desc').textContent = s.description;
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  stepButtons.forEach((button, i) => {
    if (i === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  try { localStorage.setItem(storageKey, String(index)); } catch {}
  buildCode();
  resetProgram();
  state.wait = 1000;
  syncPlayback();
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${s.title}`;
}
function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/recursion/${index + 1}`);
  showStep(index);
}
function routeIndex() {
  const match = /^#\/recursion\/(\d+)$/.exec(location.hash);
  const routed = match ? Number(match[1]) - 1 : -1;
  if (routed >= 0 && routed < lesson.length) return routed;
  try {
    const stored = localStorage.getItem(storageKey);
    const index = Number(stored);
    if (stored !== null && Number.isInteger(index) && index >= 0 && index < lesson.length) return index;
  } catch {}
  return 0;
}
const stepButtons = lesson.map(({ label }, index) => {
  const listItem = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  const number = document.createElement('span');
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.addEventListener('click', () => goToStep(index));
  listItem.append(button);
  byId('steps').append(listItem);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
motion.addEventListener('change', () => {
  if (!motion.matches) state.playing = true;
  syncPlayback();
});
window.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});

buildScene();
byId('world').setAttribute('transform', 'translate(300 152) scale(1.02)');
buildScene();
byId('world').setAttribute('transform', 'translate(282 236) scale(.92)');
const initial = routeIndex();
history.replaceState(null, '', `#/recursion/${initial + 1}`);
state.index = initial;
showStep(initial, false);
</script>
