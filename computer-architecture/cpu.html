<body>
<main class="shell">
  <header>
    <p class="eyebrow">3장 컴퓨터를 바닥부터 · 레슨 3.5</p>
    <h1>CPU의 한 사이클</h1>
    <p class="lead">명령 하나를 가져오고, 해석하고, 실행하는 동안 무슨 일이 생길까요? 작은 CPU를 클럭 한 번씩 움직여 보세요.</p>
  </header>

        <div class="stage-top"><h2 id="stage-heading">메모리와 CPU 내부</h2></div>
        <div class="stage">
          <svg id="scene" viewBox="0 0 620 280" role="img" tabindex="0" aria-labelledby="scene-title scene-desc">
            <title id="scene-title">메모리의 명령을 CPU가 가져와 해석하고 실행하는 장면</title><desc id="scene-desc"></desc>
            <defs>
              <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
              <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
              <radialGradient id="grid-fade"><stop offset=".45" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
              <mask id="grid-mask"><rect x="-460" y="-260" width="920" height="520" fill="url(#grid-fade)"/></mask>

<script>
const byId = (id) => document.getElementById(id);
// A tiny CPU with 8 memory cells. Each step loads a program (`memory`: instructions and numbers)
// and the engine works out every clock tick in advance: fetch (2 ticks), decode (1), execute (1–2).
// Instructions: ['LOAD', r, addr], ['STORE', r, addr], ['ADD'], ['SUB'] (A = A ± B, sets Z),
// ['JUMP', addr], ['JZ', addr] (jump if Z), ['HALT']. Numbers are plain values.
// `asks` are predictions the learner answers before a tick runs; `at(tick)` picks that tick,
// where tick has kind (F1 F2 D E1 E2), op, n (how many instructions ran before it) and the machine before it.
const lesson = [
  {
    label: '가져오기',
    readingDiagram: {
      title: "주소는 메모리로, 명령은 IR로",
      description: "PC의 주소 0으로 메모리의 LOAD A, [5]를 읽어 IR에 넣습니다. PC는 1이 되고 A는 아직 바뀌지 않습니다.",
      nodes: [
        ["pc", 102, 122, 126, 46, ["PC", "주소 0"]],
        ["mem", 310, 122, 126, 46, ["메모리 0번지", "LOAD A, [5]"], "active"],
        ["ir", 517, 122, 126, 46, ["IR", "LOAD A, [5]"], "active"],
        ["next", 102, 224, 126, 46, ["다음 PC", "주소 1"], "active"],
        ["a", 517, 224, 126, 46, ["A = 0", "아직 그대로"], "muted"],
      ],
      edges: [
        ["pc", "mem", "active"],
        ["mem", "ir", "active"],
        ["pc", "next", "muted", ""],
      ],
      labels: [
        [35, 262, "명령을 가져온 뒤 PC + 1"],
      ],
    },
    example: ["PC가 명령 주소를 가리킴", "메모리에서 명령 읽기", "IR에 실행할 명령"],
    title: 'CPU는 먼저 명령을 가져온다',
    body: '프로그램은 데이터와 똑같이 메모리 칸에 들어 있습니다. CPU의 프로그램 카운터(PC)는 다음에 실행할 명령의 주소를 기억합니다. 가져오기 단계에서 CPU는 PC의 주소를 메모리로 보내고, 그 칸의 명령을 명령 레지스터(IR)로 받아 온 뒤 PC를 1 늘립니다.',
    takeaway: '주소가 PC에서 메모리로 가고, 명령이 메모리에서 IR로 돌아옵니다. 명령을 가져오자마자 PC가 다음 칸을 가리킵니다. 명령 하나가 끝나면 다시 가져오기로 돌아갑니다.',
    description: '위쪽에 0–7번지 메모리 칸이 있고, 아래 CPU 판 위에 PC, IR, 제어 장치, 레지스터 A와 B, ALU가 있습니다. 메모리와 CPU는 버스로 이어져 있습니다.',
    memory: [['LOAD', 'A', 5], ['HALT'], 0, 0, 0, 3, 0, 0],
    asks: [
      { at: (t) => t.kind === 'F2' && t.n === 0, q: '명령을 가져온 뒤 PC는 몇이 될까요?', choices: ['0', '1', '5'], answer: '1', why: '가져오자마자 PC는 다음 칸인 1번지를 가리킵니다.' },
      { at: (t) => t.kind === 'E2' && t.n === 0, q: '레지스터 A에는 무엇이 들어갈까요?', choices: ['5', '3', 'LOAD'], answer: '3', why: 'LOAD A, [5]는 5번지의 값 3을 A에 넣습니다.' },
    ],

// Memory cells in a row at the top, the bus under them, the CPU board below with its parts.

  PC: { u: 0, v: 0, name: 'PC', kind: 'register' },

  CU: { u: 11.5, v: 0, name: '제어 장치', kind: 'control' },
  A: { u: 1.5, v: 7, name: 'A', kind: 'register', below: true },
  B: { u: 6.5, v: 7, name: 'B', kind: 'register', below: true },
  ALU: { u: 12, v: 7, name: 'ALU', kind: 'alu', below: true },
};
const isCell = (name) => name[0] === 'M';
const at = (name) => isCell(name) ? { u: cellU(Number(name.slice(1))), v: cellV } : parts[name];

// The path a value takes between two places, as (u, v) points on the floor.
function route(from, to) {
  if (isCell(from) && !isCell(to)) return route(to, from).reverse();
  const a = at(from), b = at(to);
  if (isCell(to)) {
    if (from === 'A') return [[a.u, a.v], [leftBus, a.v], [leftBus, busV], [b.u, busV], [b.u, b.v]];
    if (from === 'B') return [[a.u, a.v], [a.u, 10.4], [leftBus, 10.4], [leftBus, busV], [b.u, busV], [b.u, b.v]];
    return [[a.u, a.v], [a.u, busV], [b.u, busV], [b.u, b.v]];
  }
  const key = from + '>' + to;
  if (key === 'ALU>A') return route('A', 'ALU').reverse();
  if (key === 'A>ALU') return [[a.u, a.v], [a.u, 9.4], [b.u, 9.4], [b.u, b.v]];
  if (key === 'CU>PC') return [[a.u, a.v], [a.u, 3.5], [b.u, 3.5], [b.u, b.v]];
  return [[a.u, a.v], [b.u, b.v]];
}

// ---------- The machine ----------
const regName = { A: 'A', B: 'B' };
function instrText(word) {
  if (!Array.isArray(word)) return String(word);
  const [op, x, y] = word;
  if (op === 'LOAD' || op === 'STORE') return `${op} ${x}, [${y}]`;
  if (op === 'ADD' || op === 'SUB') return `${op} A, B`;
  if (op === 'JUMP' || op === 'JZ') return `${op} ${x}`;
  return op;
}
const meaning = {
  LOAD: ([, r, a]) => `${r} ← ${a}번지`, STORE: ([, r, a]) => `${a}번지 ← ${r}`,
  ADD: () => 'A ← A + B', SUB: () => 'A ← A − B',
  JUMP: ([, a]) => `PC ← ${a}`, JZ: ([, a]) => `Z면 PC ← ${a}`, HALT: () => '멈춤',
};

// Work out every clock tick: each one records what moves (transfers), what it means, and the machine after it.
function buildTimeline(memory) {
  const m = { pc: 0, ir: null, a: 0, b: 0, z: 0, mem: memory.map((w) => Array.isArray(w) ? [...w] : w), cu: '', alu: '', halted: false };
  const copy = () => ({ ...m, mem: [...m.mem] });
  const ticks = [];
  let n = 0;
  const push = (kind, op, transfers, text, apply, cell = null) => {
    const before = copy();
    apply();
    ticks.push({ kind, op, n, before, after: copy(), transfers, text, cell,
      phase: kind[0] === 'F' ? 'fetch' : kind === 'D' ? 'decode' : 'execute' });
  };
  for (let guard = 0; !m.halted && guard < 40; guard++) {
    const pc = m.pc;
    const word = m.mem[pc];
    const op = word[0];
    push('F1', op, [{ from: 'PC', to: 'M' + pc, label: `주소 ${pc}` }], `가져오기: PC가 주소 ${pc}를 메모리로 보냅니다.`, () => { m.alu = ''; }, pc);
    push('F2', op, [{ from: 'M' + pc, to: 'IR', label: instrText(word) }], `가져오기: ${pc}번지의 명령 "${instrText(word)}"가 IR로 오고, PC는 ${pc + 1}이 됩니다.`,
      () => { m.ir = pc; m.pc = pc + 1; }, pc);
    push('D', op, [{ from: 'IR', to: 'CU', label: op }], `해석: 제어 장치가 "${instrText(word)}"를 "${meaning[op](word)}"로 읽습니다.`,
      () => { m.cu = meaning[op](word); });
    if (op === 'LOAD') {
      const [, r, a] = word;
      push('E1', op, [{ from: 'CU', to: 'M' + a, label: `주소 ${a}` }], `실행: ${a}번지에 값을 달라고 주소를 보냅니다.`, () => {}, a);
      push('E2', op, [{ from: 'M' + a, to: r, label: String(m.mem[a]) }], `실행: ${a}번지의 값 ${m.mem[a]}이 레지스터 ${r}에 들어갑니다.`,
        () => { m[r.toLowerCase()] = m.mem[a]; }, a);
    } else if (op === 'STORE') {
      const [, r, a] = word;
      const value = m[r.toLowerCase()];
      push('E1', op, [{ from: 'CU', to: 'M' + a, label: `주소 ${a}` }], `실행: 값을 적을 ${a}번지에 주소를 보냅니다.`, () => {}, a);
      push('E2', op, [{ from: r, to: 'M' + a, label: String(value) }], `실행: 레지스터 ${r}의 값 ${value}을 ${a}번지에 적습니다.`,
        () => { m.mem[a] = value; }, a);
    } else if (op === 'ADD' || op === 'SUB') {
      const result = op === 'ADD' ? m.a + m.b : m.a - m.b;
      const sign = op === 'ADD' ? '+' : '−';
      push('E1', op, [{ from: 'A', to: 'ALU', label: String(m.a) }, { from: 'B', to: 'ALU', label: String(m.b) }],
        `실행: A의 ${m.a}와 B의 ${m.b}이 ALU로 갑니다.`, () => { m.alu = `${m.a} ${sign} ${m.b} = ${result}`; });
      push('E2', op, [{ from: 'ALU', to: 'A', label: String(result) }], `실행: ALU의 결과 ${result}이 A에 들어갑니다. 결과가 ${result === 0 ? '0이라 Z = 1' : '0이 아니라 Z = 0'}입니다.`,
        () => { m.a = result; m.z = result === 0 ? 1 : 0; });
    } else if (op === 'JUMP') {
      push('E1', op, [{ from: 'CU', to: 'PC', label: String(word[1]) }], `실행: PC에 ${word[1]}을 넣습니다. 다음 명령은 ${word[1]}번지입니다.`, () => { m.pc = word[1]; });
    } else if (op === 'JZ') {
      const jump = m.z === 1;
      push('E1', op, jump ? [{ from: 'CU', to: 'PC', label: String(word[1]) }] : [],
        jump ? `실행: Z = 1이라 PC에 ${word[1]}을 넣습니다.` : `실행: Z = 0이라 건너뛰지 않습니다. PC는 ${m.pc} 그대로입니다.`,
        () => { if (jump) m.pc = word[1]; });
    } else {
      push('E1', op, [], '실행: HALT. 프로그램이 끝났습니다.', () => { m.halted = true; });
    }
    n++;
  }
  return ticks;
}

  plates = [];
  packets = [];
  // The CPU: an area marked on the floor, holding its parts.
  const area = [[-5.4, -4.6], [15.4, -4.6], [15.4, 13.4], [-5.4, 13.4]];   // deep enough for the lower names
  svg('polygon', { class: 'cpu-area', points: area.map(([u, v]) => flat(u, v).join(',')).join(' ') }, byId('casings'));
  const areaNode = svg('g', {}, byId('nodes'));
  addPlate(areaNode, 'tag board-tag', ...flat(-3.8, 13.4), 'CPU', { round: true });
  // Faint wires for every path this program uses, plus the bus and a stub to every cell.
  const drawn = new Set();
  const drawPath = (points, className) => {
    const d = 'M' + points.map(([u, v]) => flat(u, v, laneHeight + (isOnBoard(u, v) ? board : 0)).join(' ')).join('L');
    if (drawn.has(d)) return;
    drawn.add(d);
    svg('path', { class: 'casing', d }, byId('casings'));
    svg('path', { class: 'bus ' + className, d }, byId('links'));
  };
  drawPath([[leftBus, busV], [cellU(cellCount - 1), busV]], 'main');
  for (let k = 0; k < cellCount; k++) drawPath([[cellU(k), busV], [cellU(k), cellV]], 'stub');
  for (const tick of timeline) for (const move of tick.transfers) drawPath(route(move.from, move.to), 'inner');
  // Memory cells.
  cellViews = [];
  for (let k = 0; k < cellCount; k++) {
    const node = svg('g', { class: 'node cell', transform: `translate(${flat(cellU(k), cellV).join(' ')})` }, byId('nodes'));
    drawShadow(node, cellHalf);
    drawBox(node, cellHalf, cellHeight);
    const value = svg('text', { class: 'cell-value', x: 0, y: -cellHeight + .5 }, node);
    svg('text', { class: 'address', x: 0, y: 7 * 2 * cellHalf + 10 }, node).textContent = `${k}번지`;
    cellViews.push({ node, value });
  }
  // CPU parts, standing on the board.
  partViews = {};
  partPlates = {};
  const order = Object.entries(parts).sort(([, a], [, b]) => a.v - b.v || a.u - b.u);
  for (const [name, part] of order) {
    const h = part.kind === 'control' ? 1.2 : 1;
    const H = part.kind === 'register' ? 9 : 11;
    const node = svg('g', { class: `node part ${part.kind}`, transform: `translate(${flat(part.u, part.v, board).join(' ')})` }, byId('nodes'));
    drawShadow(node, h);
    drawBox(node, h, H);
    partViews[name] = node;
    // Names of the lower row hang 26px under the box, below the A → ALU path that runs just under the boxes
    // (at 13px the path crossed "A 3", most on a narrow screen where the names are 16px).
    partPlates[name] = addPlate(node, 'tag part-tag', 0, part.below ? 14 * h + 26 : -H - 14 * h - 12, part.name);
  }
  fitWorld();
}
const isOnBoard = () => false;

// Scale and centre the scene: memory plates at the top, the CPU area's label at the bottom.
function fitWorld() {
  const left = 14 * -5.4 - 10, right = 14 * cellU(cellCount - 1) + 24, top = 7 * cellV - 26, bottom = 7 * 13.4 + 16;
  const scale = Math.min(1.9, 590 / (right - left), 268 / (bottom - top));
  const x = 310 - scale * (left + right) / 2, y = 140 - scale * (top + bottom) / 2;
  byId('world').setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${scale.toFixed(3)})`);
}

// Paint the machine as it is after `count` ticks.
function paint(count, { flashCell = null } = {}) {
  const m = count === 0 ? timeline[0].before : timeline[count - 1].after;
  const next = timeline[count];
  const last = timeline[count - 1];
  cellViews.forEach((cell, k) => {
    const word = m.mem[k];
    cell.value.textContent = Array.isArray(word) ? word[0] : String(word);
    cell.node.classList.toggle('code', Array.isArray(word));
    cell.node.classList.toggle('active', last?.cell === k);
    cell.node.classList.toggle('next-pc', k === m.pc && !m.halted);
    if (k === flashCell) { cell.node.classList.remove('changed'); cell.node.getBBox(); cell.node.classList.add('changed'); }
  });
  setPlate(partPlates.PC, `PC ${m.pc}`);
  setPlate(partPlates.IR, `IR ${m.ir === null ? '–' : instrText(m.mem[m.ir])}`);
  setPlate(partPlates.CU, m.cu ? `제어: ${m.cu}` : '제어 장치');
  setPlate(partPlates.A, `A ${m.a}`);
  setPlate(partPlates.B, `B ${m.b}`);
  setPlate(partPlates.ALU, m.alu ? `ALU ${m.alu}` : `ALU · Z ${m.z}`);
  clearTopRow();
  const involved = new Set((last?.transfers ?? []).flatMap((move) => [move.from, move.to]));
  for (const [name, node] of Object.entries(partViews)) node.classList.toggle('busy', involved.has(name));
  paintPanel(count, m, last, next);
}

// The names on the top row grow with the instruction ("IR LOAD A, [4]", "제어: A ← 4번지"), and on a
// narrow screen the font is larger too. Centred over their boxes they overlapped, so lay them out
// left to right with an 8px gap, inside the scene's left and right edges (the same ones as fitWorld).
function clearTopRow() {
  const names = ['PC', 'IR', 'CU'];
  const plates = names.map((name) => partPlates[name]);
  const boxX = names.map((name) => 14 * parts[name].u);
  const width = plates.map((plate) => plate.rect.width.baseVal.value);
  const gap = 8, leftEdge = 14 * -5.4 - 10, rightEdge = 14 * cellU(cellCount - 1) + 24;
  const at = [...boxX];
  for (let k = 1; k < at.length; k++) at[k] = Math.max(at[k], at[k - 1] + (width[k - 1] + width[k]) / 2 + gap);
  at[at.length - 1] = Math.min(at.at(-1), rightEdge - width.at(-1) / 2);
  for (let k = at.length - 2; k >= 0; k--) at[k] = Math.min(at[k], at[k + 1] - (width[k] + width[k + 1]) / 2 - gap);
  at[0] = Math.max(at[0], leftEdge + width[0] / 2);
  plates.forEach((plate, k) => {
    const x = at[k] - boxX[k];
    if (plate.x === x) return;
    plate.x = x;
    sizePlate(plate);
  });
}

// ---------- Packets ----------
function sendPacket(move) {
  const points = route(move.from, move.to).map(([u, v]) => flat(u, v, laneHeight + (isOnBoard(u, v) ? board : 0)));
  const lengths = points.slice(1).map((p, i) => Math.hypot(p[0] - points[i][0], p[1] - points[i][1]));
  const group = svg('g', { class: 'packet-group ' + (isCell(move.from) ? 'read' : isCell(move.to) ? 'write' : 'inner') }, byId('packets'));
  svg('circle', { class: 'packet-halo', r: 8.5 }, group);
  svg('circle', { class: 'packet', r: 4.4 }, group);
  svg('text', { class: 'packet-label', y: -10 }, group).textContent = move.label;
  packets.push({ group, points, lengths, total: lengths.reduce((a, b) => a + b, 0), start: performance.now() });
  kick();
}
function movePackets(now) {
  packets = packets.filter((packet) => {
    const t = (now - packet.start) / moveMs;
    if (t >= 1) { packet.group.remove(); return false; }
    // Hide the first and last bits of the path, which lie under the boxes.
    let along = mix(14, packet.total - 14, t);
    let i = 0;
    while (i < packet.lengths.length - 1 && along > packet.lengths[i]) { along -= packet.lengths[i]; i++; }
    const f = packet.lengths[i] ? Math.min(along / packet.lengths[i], 1) : 0;
    const [x, y] = [mix(packet.points[i][0], packet.points[i + 1][0], f), mix(packet.points[i][1], packet.points[i + 1][1], f)];
    packet.group.setAttribute('transform', `translate(${x} ${y})`);
    return true;
  });
}

// Timers that a step change or reset cancels.
let timers = [];
function later(ms, fn) {
  if (ms === 0) { fn(); return; }
  timers.push(setTimeout(fn, ms));
}
function cancelTimers() {
  timers.forEach(clearTimeout);
  timers = [];
  packets.forEach((packet) => packet.group.remove());
  packets = [];
  state.busy = false;
}

// Run one clock tick: values travel, then the machine shows its new state.
function runTick(done) {
  const tick = timeline[state.t];
  if (!tick || state.busy) return;
  state.busy = true;
  if (!motion.matches) tick.transfers.forEach(sendPacket);
  for (const name of new Set(tick.transfers.flatMap((move) => [move.from, move.to]))) partViews[name]?.classList.add('busy');
  if (tick.cell !== null) cellViews[tick.cell].node.classList.add('active');
  paintPanel(state.t, state.t === 0 ? tick.before : timeline[state.t - 1].after, timeline[state.t - 1], tick, true);
  later(motion.matches ? 0 : moveMs, () => {
    state.t++;
    state.busy = false;
    const wrote = tick.kind === 'E2' && tick.op === 'STORE' ? tick.cell : null;
    paint(state.t, { flashCell: wrote });
    done?.();
  });
}

// ---------- Panel: memory listing, phase, clock ----------
function buildPanel() {
  const list = byId('code');
  list.replaceChildren();
  for (let k = 0; k < cellCount; k++) {
    const li = document.createElement('li');
    li.append(Object.assign(document.createElement('span'), { className: 'addr', textContent: k }));
    li.append(Object.assign(document.createElement('code'), {}));
    li.append(Object.assign(document.createElement('span'), { className: 'mark' }));
    list.append(li);
  }
}
const phaseName = { fetch: '가져오기', decode: '해석', execute: '실행' };
function paintPanel(count, m, last, next, running = false) {
  const current = running ? next : last;
  [...byId('code').children].forEach((li, k) => {
    const word = m.mem[k];
    li.querySelector('code').textContent = Array.isArray(word) ? instrText(word) : `값 ${word}`;
    li.classList.toggle('data', !Array.isArray(word));
    li.classList.toggle('pc', k === m.pc && !m.halted);
    li.classList.toggle('ir', k === m.ir);
    li.classList.toggle('touched', current?.cell === k);
    li.querySelector('.mark').textContent = [k === m.ir ? 'IR' : '', k === m.pc && !m.halted ? 'PC →' : ''].filter(Boolean).join(' · ');
  });
  for (const chip of byId('phases').children) chip.classList.toggle('current', chip.dataset.phase === current?.phase);
  byId('clock').textContent = `클럭 ${count + (running ? 1 : 0)}번`;
  byId('clock').classList.remove('tick');
  if (running && !motion.matches) { byId('clock').getBBox?.(); void byId('clock').offsetWidth; byId('clock').classList.add('tick'); }
  const finished = count >= timeline.length;
  byId('readout').textContent = current ? current.text : '"클럭 한 번"을 누르면 첫 가져오기가 시작됩니다.';
  // While the demo plays the buttons stay enabled, so a click can take over from it.
  const blocked = !state.playing && (finished || state.busy || Boolean(pendingAsk()));
  byId('run-tick').disabled = blocked;
  byId('run-instr').disabled = blocked;
  byId('run-tick').textContent = finished ? '프로그램이 끝났습니다' : '클럭 한 번';
}

// ---------- Predictions ----------
const asksOf = () => lesson[state.index].asks;
function askFor(t) {
  const tick = timeline[t];
  if (!tick) return null;
  const k = asksOf().findIndex((ask, i) => ask.at(tick) && !answeredAsks[state.index].has(i) && firstTickFor(i) === t);
  return k >= 0 ? { ask: asksOf()[k], k } : null;
}
// An ask belongs to the first tick it matches, so it is asked once per run.
const firstTickFor = (i) => timeline.findIndex((tick) => asksOf()[i].at(tick));
const pendingAsk = () => state.playing ? null : askFor(state.t);

function syncTask() {
  const choices = byId('try-choices');
  choices.replaceChildren();
  const pending = pendingAsk();
  const allDone = progress[state.index] >= asksOf().length;
  if (pending && !state.busy) {
    byId('try').classList.remove('solved');
    byId('try-text').textContent = `클럭 ${state.t + 1} 전에 · ${pending.ask.q}`;
    byId('try-result').textContent = state.wrong || state.solvedText;
    for (const choice of pending.ask.choices) {
      const button = Object.assign(document.createElement('button'), { type: 'button', className: 'action choice-button', textContent: choice });
      button.addEventListener('click', () => answer(choice));
      choices.append(button);
    }
  } else if (state.solvedText) {
    byId('try').classList.add('solved');
    byId('try-text').textContent = state.solvedText;
    byId('try-result').textContent = '';
  } else {
    byId('try').classList.remove('solved');
    byId('try-result').textContent = '';
    byId('try-text').textContent = state.t >= timeline.length
      ? (allDone ? '이 단계의 예측을 모두 맞혔습니다. 처음부터 다시 실행해 볼 수도 있습니다.' : '처음부터를 눌러 다시 해 보세요.')
      : '"클럭 한 번"으로 한 걸음씩, "명령 하나"로 명령 단위로 실행해 보세요. 중간에 예측 문제가 나옵니다.';
  }
}
function answer(choice) {
  const pending = pendingAsk();
  if (!pending) return;
  if (choice !== pending.ask.answer) {
    state.wrong = `✗ ${choice}이(가) 아닙니다. 다시 골라 보세요.`;
    byId('announcement').textContent = state.wrong;
    syncTask();
    return;
  }
  state.wrong = '';
  answeredAsks[state.index].add(pending.k);
  progress[state.index] = answeredAsks[state.index].size;
  state.solvedText = `✓ 맞았습니다. ${pending.ask.why}`;
  byId('announcement').textContent = state.solvedText;
  runTick(() => syncTask());
  syncTask();
}

function takeOver() {
  if (!state.playing) return;
  state.playing = false;
  cancelTimers();
  paint(state.t);
  syncPlayback();
}
function resetProgram() {
  cancelTimers();
  state.t = 0;
  state.wrong = '';
  state.solvedText = '';
  paint(0);
  syncTask();
}
byId('run-tick').onclick = () => {
  takeOver();
  if (state.busy || pendingAsk()) { syncTask(); return; }
  state.solvedText = '';
  runTick(() => syncTask());
  syncTask();
  byId('announcement').textContent = byId('readout').textContent;
};
// Run ticks until the next instruction starts, stopping at a prediction.
byId('run-instr').onclick = () => {
  takeOver();
  state.solvedText = '';
  const step = () => {
    if (state.t >= timeline.length || pendingAsk()) { syncTask(); return; }
    runTick(() => { if (timeline[state.t] && timeline[state.t].kind !== 'F1') step(); else syncTask(); });
  };
  if (!state.busy) step();
  syncTask();
};
byId('restart').onclick = () => {
  state.playing = false;
  resetProgram();
  syncPlayback();
  byId('announcement').textContent = '처음부터 다시 시작합니다.';
};

// ---------- Demo playback ----------
function demoTick() {
  if (state.busy) { state.wait = 200; return; }
  if (state.t >= timeline.length) {
    resetProgram();
    state.wait = 1200;
    return;
  }
  runTick();
  state.wait = state.t + 1 >= timeline.length ? 3600 : 1150;
}
function syncPlayback() {
  const reduced = motion.matches;
  if (reduced) state.playing = false;
  if (state.playing) kick();
  paint(state.t);
  syncTask();
}

// ---------- Steps and routing ----------
function showStep(index, announce = true) {
  cancelTimers();
  state.index = index;
  state.playing = !motion.matches;
  const s = lesson[index];
  timeline = buildTimeline(s.memory);
  buildScene();
  buildPanel();
  byId('step-title').textContent = s.title;
  byId('body').textContent = s.body;
  byId('takeaway').textContent = s.takeaway;
  byId('scene-desc').textContent = s.description;
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  stepButtons.forEach((button, i) => {
    if (i === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  try { localStorage.setItem(storageKey, String(index)); } catch {}
  resetProgram();
  state.wait = 1000;
  syncPlayback();
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${s.title}`;
}
function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/cpu/${index + 1}`);
  showStep(index);
}
function routeIndex() {
  const match = /^#\/cpu\/(\d+)$/.exec(location.hash);
  const routed = match ? Number(match[1]) - 1 : -1;
  if (routed >= 0 && routed < lesson.length) return routed;
  try {
    const stored = localStorage.getItem(storageKey);
    const index = Number(stored);
    if (stored !== null && Number.isInteger(index) && index >= 0 && index < lesson.length) return index;
  } catch {}
  return 0;
}
const stepButtons = lesson.map(({ label }, index) => {
  const listItem = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  const number = document.createElement('span');
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.addEventListener('click', () => goToStep(index));
  listItem.append(button);
  byId('steps').append(listItem);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
motion.addEventListener('change', () => {
  if (!motion.matches) state.playing = true;
  syncPlayback();
});
window.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});
const initial = routeIndex();
history.replaceState(null, '', `#/cpu/${initial + 1}`);
state.index = -1;
showStep(initial, false);
</script>
</body>
</html>
