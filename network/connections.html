<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="../shared/device-access.js?v=1f73c765843f36b1"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="그림이 이동하는 길을 따라가고, 끊긴 연결을 찾아 프린터로 그림을 보내 보세요.">
<title>네트워크로 그림 보내기 · 레슨 1.0</title>
<style>
:root{color-scheme:light;--ink:#142620;--muted:#43574f;--border:#cbd9d0;--paper:#f4f7ef;--panel:#fff;--accent:#0f766e;--request:#187959;--response:#5362a0;--limit:#a24c14;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.65 system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled,button[aria-disabled=true]{cursor:default;opacity:.5}
:focus-visible{outline:3px solid var(--limit);outline-offset:3px}
.shell{max-width:1280px;margin:auto;padding:24px}
h1,h2,p{margin:0}
.eyebrow{color:var(--accent);font-weight:700}
.lead{color:var(--muted)}
.workspace{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(360px,1fr);gap:20px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.stage-top,.view-controls,.navigation,.timeline-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stage-top,.explanation,.timeline{padding:14px 18px}
.stage-top h2,.timeline h2{font-size:1rem}
.stage{background:#eaf3eb;border-block:1px solid var(--border)}
#scene{display:block;width:100%;height:auto;user-select:none}
#scene:focus-visible{outline-offset:-4px}
#scene.is-zoomed{cursor:grab;touch-action:none}
#scene.is-dragging{cursor:grabbing}
.view-scale{font:700 .875rem var(--mono);color:var(--muted)}
.action,.steps button,select{min-height:44px;padding:6px 10px;border:1px solid #9fb7a9;border-radius:8px;background:#fff}
.action:hover,.steps button:hover{border-color:var(--accent)}
.action.primary{background:var(--accent);border-color:var(--accent);color:white}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:8px 0 0;padding:0;list-style:none}
.steps button{width:100%}
.steps button[aria-current=step]{background:#d5efeb;border-color:var(--accent);font-weight:700}
.step-number{margin-inline-end:6px}
.hands-on{display:grid;gap:10px;padding:14px}
.try,.takeaway{padding:10px 12px;background:#e9f5f3;border-left:3px solid var(--accent);border-radius:0 8px 8px 0}
.lab-field{display:grid;gap:4px}
.lab-field label{font-weight:650}
.hands-on [hidden]{display:none}
.readout{padding-top:6px;min-height:2.2em;font-weight:650;color:var(--accent)}
.readout[data-status=blocked]{color:var(--limit)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.route-text{text-anchor:middle;dominant-baseline:central;fill:var(--ink);font-size:15px;font-weight:650}
.route-caption{font-size:16px;font-weight:750}
.route-note{font-size:14px;fill:var(--muted)}
.route-note.ok{fill:#0f5a3c}
.route-note.cut{fill:var(--limit)}
.route-card{fill:#fff;stroke:#9bbfaf;stroke-width:1.25}
.network-frame{fill:#f6fbf6;stroke:#92b6a5;stroke-width:1.5}
.device-body{fill:#dce6f6;stroke:#5362a0;stroke-width:1.5}
.device-screen{fill:#fff;stroke:#a7b3cc;stroke-width:1}
.device-slot{stroke:#5362a0;stroke-width:2;stroke-linecap:round}
.router-body{fill:#d5efeb;stroke:var(--accent);stroke-width:1.5}
.router-detail{fill:var(--accent)}
.link{fill:none;stroke:#70867a;stroke-width:2.5;stroke-linejoin:round}
.link.sent{stroke:var(--request);stroke-width:3}
.link.cut{stroke:var(--limit);stroke-dasharray:5 4}
.link.cut.sent{stroke-dasharray:none}
.route-selected{fill:#f6fbf6;stroke:#92b6a5;stroke-width:1.5}
.arrow-tip{fill:var(--request)}
.arrow-tip.cut{fill:var(--limit)}
.break-sign{fill:none;stroke:var(--limit);stroke-width:2.5;stroke-linecap:round}
.drawing{fill:#ffd477;stroke:#855006;stroke-width:1.35;stroke-linejoin:round}
</style>
<link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../shared/favicon-32.png" sizes="32x32">

<script src="../shared/engine.js?v=18f6c6ea5ff4412f"></script>

<script defer blocking="render" src="./connections.en.js"></script>

<body>
<main class="shell">
  <header>
    <p class="eyebrow">1장 링크와 LAN · 레슨 1.0</p>
    <h1>네트워크로 그림 보내기</h1>
    <p class="lead">태블릿에서 그린 그림을 옆자리 친구와 복도 프린터로 보내 봅니다.</p>
  </header>
  <div class="workspace">
    <div>
      <section class="panel" aria-labelledby="stage-heading">
        <div class="stage-top"><h2 id="stage-heading">그림이 가는 길</h2></div>
        <div class="stage">
          <svg id="scene" viewBox="0 0 620 280" role="img" tabindex="0" aria-labelledby="scene-title scene-desc">
            <title id="scene-title">기기 사이로 그림 보내기</title>
            <desc id="scene-desc"></desc>
            <g id="world" aria-hidden="true"></g>
          </svg>
        </div>
        <div class="hands-on">
          <p class="try" id="task"></p>
          <div class="lab-field" id="route-field">
            <label for="route-choice">두 태블릿 사이</label>
            <select id="route-choice">
              <option value="off">연결이 끊김</option>
              <option value="on">연결됨</option>
            </select>
          </div>
          <div class="lab-field" id="repair-field" hidden>
            <label for="repair-choice">확인할 Wi-Fi 구간</label>
            <select id="repair-choice">
              <option value="">구간을 고르세요</option>
              <option value="a">태블릿 A ↔ 공유기</option>
              <option value="b">공유기 ↔ 태블릿 B</option>
            </select>
            <button class="action" id="repair" type="button">연결 복구</button>
          </div>
          <div class="lab-field" id="setup-field" hidden>
            <label for="setup-choice">Wi-Fi에 연결할 프린터</label>
            <select id="setup-choice">
              <option value="hall">복도 프린터</option>
              <option value="near">가까운 프린터</option>
            </select>
          </div>
          <div class="lab-field" id="target-field" hidden>
            <label for="target-choice">보낼 기기</label>
            <select id="target-choice"></select>
          </div>
          <button class="action primary" id="send" type="button">그림 보내기</button>
          <p class="readout" id="readout" role="status"></p>
        </div>
        <div class="view-controls" role="group" aria-label="장면 보기">
          <button class="action" id="zoom-out" type="button" aria-label="장면 축소">−</button>
          <output class="view-scale" id="view-scale" aria-label="현재 배율" aria-live="off">100%</output>
          <button class="action" id="zoom-in" type="button" aria-label="장면 확대">+</button>
        </div>
        <nav class="timeline" aria-labelledby="timeline-heading">
          <div class="timeline-top"><h2 id="timeline-heading">타임라인</h2><span id="count"></span></div>
          <ol class="steps" id="steps"></ol>
        </nav>
      </section>
    </div>
    <section class="panel explanation" aria-labelledby="step-title">
      <h2 id="step-title"></h2><p id="body"></p>
      <div class="takeaway"><strong>관찰 포인트</strong><p id="takeaway"></p></div>
      <nav class="navigation" aria-label="이전 및 다음 단계">
        <button class="action" id="prev" type="button">이전 단계</button>
        <button class="action primary" id="next" type="button">다음 단계</button>
      </nav>
    </section>
  </div>
  <div class="sr-only" id="announcement" role="status"></div>
</main>
<script>
const byId = (id) => document.getElementById(id);
const viewport = byId('scene');
const viewWidth = 620;
const viewHeight = 280;
const maxZoom = 3;
const center = { x: viewWidth / 2, y: viewHeight / 2 };
const camera = { x: 0, y: 0, zoom: 1 };
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
const workspace = document.querySelector('.workspace');

const names = {
  a: '태블릿 A', router: '교실 공유기', b: '태블릿 B', c: '태블릿 C',
  near: '가까운 프린터', hall: '복도 프린터',
};
const lesson = [
  {
    mode: 'direct', label: '같은 책상', title: '옆에 있어도 그림이 갈 길이 필요합니다',
    body: '태블릿 A에서 별을 그리고 바로 옆의 태블릿 B로 보냅니다. 두 경우 모두 태블릿은 같은 자리에 있고, 둘 사이에 이어진 길이 있는지만 다릅니다.',
    takeaway: '위쪽 B의 화면은 비어 있고 아래쪽 B에는 별이 생깁니다. A에는 두 경우 모두 원본이 남습니다.',
    description: '같은 책상 위의 두 태블릿을 두 줄로 비교합니다. 위에서는 끊긴 선 앞에서 별이 멈춥니다. 아래에서는 이어진 선을 따라 가서 두 태블릿 모두에 별이 보입니다.',
    example: ['같은 책상 위의 두 태블릿', '두 태블릿 사이에 길을 이음', '받는 화면에도 같은 별이 생김'],
    task: '원 그림을 먼저 끊긴 길로 보내 보세요. 두 태블릿을 연결한 뒤 다시 보내고 B의 화면을 비교해 보세요.',
  },
  {
    mode: 'classroom', label: '교실에서 보내기', title: '공유기를 거쳐 다른 태블릿으로 보냅니다',
    body: '두 태블릿이 교실 공유기의 Wi-Fi에 연결되어 있습니다. A가 보낸 그림은 공유기를 거쳐 B에 도착합니다. 이렇게 정보를 주고받도록 이어진 기기와 연결을 네트워크라고 합니다.',
    takeaway: '별 그림은 왼쪽 화살표를 따라 공유기로, 오른쪽 화살표를 따라 B로 갑니다.',
    description: '네트워크 테두리 안에 태블릿 A, 교실 공유기, 태블릿 B가 있습니다. 두 화살표가 A에서 공유기를 거쳐 B를 향하고 두 태블릿 화면에 같은 별이 있습니다.',
    example: ['태블릿 A의 별 그림', '교실 공유기가 B로 전달', '태블릿 B에 별 도착'],
    task: '태블릿 C를 골라 세모 그림을 보내세요. 공유기를 지난 그림이 어느 화면에 생기는지 보고, B로도 보내 보세요.',
  },
  {
    mode: 'repair', label: '끊긴 연결 찾기', title: '그림이 멈춘 곳에서 어느 연결이 끊겼는지 찾습니다',
    body: 'A에서 공유기까지는 그림이 갑니다. B의 Wi-Fi가 꺼져 있으면 공유기에서 B로 이어지는 길이 끊깁니다. B의 Wi-Fi를 켜고 A에서 다시 보내면 그림이 도착합니다.',
    takeaway: '위아래에서 바뀌는 구간은 공유기와 B 사이뿐입니다. 아래쪽에서만 B에 별이 생깁니다.',
    description: '양쪽 줄 모두 태블릿 A에서 공유기까지 별이 갑니다. 위쪽은 공유기 뒤에서 끊기고 B가 비어 있습니다. 아래쪽은 이 구간을 복구해 같은 별이 B에 나타납니다.',
    example: ['B의 Wi-Fi가 꺼져 있음', 'B의 Wi-Fi를 켜고 다시 보냄', '같은 별이 B에 도착'],
    task: '먼저 그림을 보내 어디에서 멈추는지 보세요. 끊긴 구간을 골라 복구하고 다시 보내세요.',
  },
  {
    mode: 'print', label: '프린터로 보내기', title: '연결된 프린터가 그림을 출력합니다',
    body: '책상 가까이에도 프린터가 있지만 지금 Wi-Fi에 연결된 쪽은 복도 프린터입니다. 태블릿에서 복도 프린터를 골라 보내면 공유기를 거쳐 같은 그림이 종이에 찍힙니다.',
    takeaway: '공유기에서 위쪽 프린터로 가는 길은 끊겨 있고, 아래쪽 프린터에만 별이 찍힌 종이가 나옵니다.',
    description: '태블릿 A에서 공유기로 별이 갑니다. 공유기에서 가까운 프린터로 향하는 위쪽 갈래는 끊겨 있습니다. 아래쪽 갈래로 도착한 복도 프린터에 같은 별이 찍힌 종이가 있습니다.',
    example: ['가까운 프린터와 복도 프린터', '연결된 복도 프린터를 골라 보냄', '복도 프린터에 별이 찍힌 종이가 나옴'],
    task: '가까운 프린터로 먼저 보내 보세요. 이어진 길로 인쇄한 뒤, 가까운 프린터를 Wi-Fi에 연결해 다시 인쇄해 보세요.',
  },
];

function label(parent, x, y, value, style = '') {
  svg('text', { x, y, class: `route-text ${style}` }, parent).textContent = value;
}
function box(parent, x, y, width, height, style, rx = 7) {
  return svg('rect', { x, y, width, height, rx, class: style }, parent);
}
function drawing(parent, x, y, shape, scale = 1) {
  const points = {
    star: '0,-12 3.5,-4 12,-3.5 5,2 7,10 0,6 -7,10 -5,2 -12,-3.5 -3.5,-4',
    triangle: '0,-11 11,9 -11,9',
  };
  const group = svg('g', { transform: `translate(${x} ${y}) scale(${scale})`, 'data-drawing': shape }, parent);
  if (shape === 'circle') svg('circle', { r: 9, class: 'drawing' }, group);
  else svg('polygon', { points: points[shape], class: 'drawing' }, group);
}
function device(parent, id, x, y, picture, note, tone) {
  const group = svg('g', { class: 'node', 'data-device': id }, parent);
  const printer = id === 'hall' || id === 'near';
  if (id === 'router') {
    svg('path', { d: `M ${x - 21} ${y - 12} v -15 M ${x + 21} ${y - 12} v -15`, class: 'link' }, group);
    box(group, x - 34, y - 12, 68, 24, 'router-body');
    for (const dx of [-18, -8, 2]) svg('circle', { cx: x + dx, cy: y, r: 2.2, class: 'router-detail' }, group);
  } else if (printer) {
    box(group, x - 44, y - 18, 88, 36, 'device-body');
    svg('path', { d: `M ${x - 22} ${y + 4} h 44`, class: 'device-slot' }, group);
    if (picture) {
      box(group, x - 17, y - 30, 34, 35, 'route-card', 2);
      drawing(group, x, y - 14, picture, .8);
    }
  } else {
    box(group, x - 44, y - 25, 88, 50, 'device-body');
    box(group, x - 35, y - 19, 68, 38, 'device-screen', 3);
    if (picture) drawing(group, x, y, picture);
  }
  label(group, x, y + 39, names[id]);
  if (note) label(group, x, y + 58, note, `route-note ${tone || ''}`);
}
function drawLink(parent, x1, y1, x2, y2, { connected, sent, shape }) {
  const origin = y1 === y2 ? `M ${x1} ${y1}` : `M ${x1} ${y1} V ${y2}`;
  const middle = (x1 + x2) / 2;
  const end = connected ? x2 : middle - 12;
  const tone = connected ? (sent ? 'sent' : '') : 'cut';
  // The stroke ends two units inside the filled triangle.
  svg('path', { d: `${origin} H ${end - (sent ? 3 : 0)}`, class: `link ${tone}${!connected && sent ? ' sent' : ''}` }, parent);
  if (!connected) {
    svg('path', { d: `M ${middle + 12} ${y2} H ${x2}`, class: 'link cut' }, parent);
    svg('path', {
      d: `M ${middle - 5} ${y2 - 5} l 10 10 m -10 0 l 10 -10`, class: 'break-sign',
    }, parent);
  }
  if (sent) {
    svg('polygon', { points: `${end},${y2} ${end - 11},${y2 - 6} ${end - 11},${y2 + 6}`, class: `arrow-tip ${tone}` }, parent);
    const cardX = connected ? middle : middle - 20;
    box(parent, cardX - 15, y2 - 33, 30, 26, 'route-card', 4);
    drawing(parent, cardX, y2 - 20, shape, .75);
  }
}
function row(parent, y, { caption, via, shape = 'star', connected, sent }) {
  if (caption) label(parent, 310, y - 50, caption, 'route-caption');
  if (via) drawLink(parent, 159, y, 274, y, { connected: true, sent, shape });
  drawLink(parent, via ? 342 : 159, y, 465, y, { connected, sent, shape });
  device(parent, 'a', 115, y, shape);
  if (via) device(parent, 'router', 308, y);
  device(parent, 'b', 509, y, sent && connected ? shape : '',
    sent ? (connected ? '도착' : '빈 화면') : '받기 전', sent && connected ? 'ok' : '');
}
function branches(parent, { shape, targets, connected, sentTo }) {
  drawLink(parent, 159, 137, 274, 137, { connected: true, sent: Boolean(sentTo), shape });
  const junction = 390;
  const trunkTone = sentTo ? (connected.includes(sentTo) ? 'sent' : 'cut sent') : '';
  svg('path', { d: `M 342 137 H ${junction}`, class: `link ${trunkTone}` }, parent);
  for (const [i, id] of targets.entries()) {
    const y = i === 0 ? 65 : 195;
    const online = connected.includes(id);
    const sent = sentTo === id;
    drawLink(parent, junction, 137, 465, y, { connected: online, sent, shape });
    const receiver = id === 'b' || id === 'c';
    const note = sent && online ? (receiver ? '도착' : '출력됨') : (online ? '연결됨' : '연결이 끊김');
    device(parent, id, 509, y, sent && online ? shape : '', note, online ? 'ok' : 'cut');
  }
  device(parent, 'a', 115, 137, shape);
  device(parent, 'router', 308, 137);
}
const state = { index: 0, sentTo: '', connected: false, target: '', message: '' };

function paintReading(parent, mode) {
  if (mode === 'direct' || mode === 'repair') {
    const via = mode === 'repair';
    row(parent, 79, { caption: via ? 'B의 Wi-Fi 꺼짐' : '같은 책상 · 연결 끊김', via, connected: false, sent: true });
    row(parent, 205, { caption: via ? 'B의 Wi-Fi 복구 후 다시 보내기' : '같은 책상 · 연결됨', via, connected: true, sent: true });
  } else if (mode === 'classroom') {
    box(parent, 49, 63, 522, 154, 'network-frame', 12);
    label(parent, 310, 88, '교실 네트워크', 'route-caption');
    row(parent, 139, { via: true, connected: true, sent: true });
  } else {
    branches(parent, { shape: 'star', targets: ['near', 'hall'], connected: ['hall'], sentTo: 'hall' });
  }
}
function paint() {
  const step = lesson[state.index];
  const world = byId('world');
  world.replaceChildren();
  if (!workspace.classList.contains('course-reading') && coursePracticeStarted) {
    if (step.mode === 'classroom' || step.mode === 'print') {
      const classroom = step.mode === 'classroom';
      branches(world, {
        shape: classroom ? 'triangle' : 'circle',
        targets: classroom ? ['b', 'c'] : ['near', 'hall'],
        connected: classroom ? ['b', 'c'] : [state.connected],
        sentTo: state.sentTo,
      });
    } else if (step.mode === 'repair') {
      const caption = state.connected ? 'B의 Wi-Fi 켜짐' : 'B의 Wi-Fi 꺼짐';
      row(world, 137, { caption, via: true, shape: 'triangle', connected: state.connected, sent: Boolean(state.sentTo) });
    } else {
      for (const connected of [false, true]) {
        const y = connected ? 205 : 79;
        const selected = connected === state.connected;
        const group = svg('g', { 'data-route': connected ? 'on' : 'off' }, world);
        if (selected) box(group, 53, y - 65, 514, 132, 'route-selected', 10);
        row(group, y, {
          caption: connected ? '같은 책상 · 연결됨' : '같은 책상 · 연결 끊김',
          shape: 'circle', connected, sent: selected && Boolean(state.sentTo),
        });
      }
    }
    byId('scene-desc').textContent = state.message || step.task;
  } else {
    paintReading(world, step.mode);
    byId('scene-desc').textContent = step.description;
  }
}

function updateLab(message = '', blocked = false) {
  state.message = message;
  byId('readout').textContent = message;
  byId('readout').dataset.status = blocked ? 'blocked' : 'ready';
  paint();
}
function showStep(index, announce = true) {
  state.index = index;
  const step = lesson[index];
  const mode = step.mode;
  Object.assign(state, { sentTo: '', connected: mode === 'print' ? 'hall' : false, target: mode === 'print' ? 'near' : 'b' });
  byId('task').textContent = step.task;
  byId('route-field').hidden = mode !== 'direct';
  byId('repair-field').hidden = mode !== 'repair';
  byId('setup-field').hidden = mode !== 'print';
  byId('target-field').hidden = mode !== 'classroom' && mode !== 'print';
  byId('route-choice').value = 'off';
  byId('repair-choice').value = '';
  byId('setup-choice').value = 'hall';
  const targets = mode === 'print' ? ['near', 'hall'] : ['b', 'c'];
  byId('target-choice').replaceChildren(...targets.map(id => new Option(names[id], id)));
  byId('target-choice').value = state.target;
  byId('send').textContent = mode === 'print' ? '인쇄하기' : '그림 보내기';
  byId('step-title').textContent = step.title;
  byId('body').textContent = step.body;
  byId('takeaway').textContent = step.takeaway;
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  stepButtons.forEach((button, i) => {
    if (i === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  updateLab('보내기 전');
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${step.title}`;
}
function fragmentForStep(index) {
  return `#/connections/${index + 1}`;
}
function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', fragmentForStep(index));
  showStep(index);
}
const stepButtons = lesson.map(({ label }, index) => {
  const item = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  const number = document.createElement('span');
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.onclick = () => goToStep(index);
  item.append(button);
  byId('steps').append(item);
  return button;
});

byId('route-choice').onchange = event => {
  state.connected = event.target.value === 'on';
  state.sentTo = '';
  updateLab('보내기 전');
};
byId('repair').onclick = () => {
  const choice = byId('repair-choice').value;
  if (!choice) {
    updateLab('확인할 Wi-Fi 구간을 먼저 골라 주세요.', true);
  } else if (choice === 'a') {
    updateLab('A와 공유기 사이는 이미 연결되어 있습니다. 그림이 멈춘 곳을 다시 보세요.', true);
  } else {
    state.connected = true;
    state.sentTo = '';
    updateLab('B의 Wi-Fi가 켜졌습니다. 그림을 다시 보내 보세요.');
  }
};
byId('setup-choice').onchange = event => {
  state.connected = event.target.value;
  state.sentTo = '';
  updateLab('보내기 전');
};
byId('target-choice').onchange = event => {
  state.target = event.target.value;
  state.sentTo = '';
  updateLab('보내기 전');
};
byId('send').onclick = () => {
  const mode = lesson[state.index].mode;
  state.sentTo = state.target;
  if (mode === 'print') {
    if (state.target !== state.connected) {
      updateLab('선택한 프린터까지 길이 끊겨 종이가 나오지 않았습니다.', true);
    } else {
      updateLab(state.target === 'near' ? '가까운 프린터에서 원 그림이 나왔습니다.' : '복도 프린터에서 원 그림이 나왔습니다.');
    }
  } else if (mode === 'classroom') {
    updateLab(state.target === 'b' ? '공유기를 거쳐 태블릿 B에 도착했습니다.' : '공유기를 거쳐 태블릿 C에 도착했습니다.');
  } else if (state.connected) {
    updateLab('태블릿 B에 같은 그림이 도착했습니다.');
  } else {
    updateLab(mode === 'repair' ? '공유기까지 갔지만 B에 도착하지 않았습니다.' : '길이 끊겨 B의 화면이 비어 있습니다.', true);
  }
};

byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
enableCameraDrag();
byId('zoom-in').onclick = () => zoomBy(.25);
byId('zoom-out').onclick = () => zoomBy(-.25);
const directions = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
viewport.addEventListener('keydown', event => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const direction = directions[event.key];
  if (direction && camera.zoom > 1) {
    event.preventDefault();
    setCamera(camera.x + direction[0] * 28 / camera.zoom, camera.y + direction[1] * 28 / camera.zoom, camera.zoom);
  } else if (['+', '=', '-'].includes(event.key)) {
    event.preventDefault();
    zoomBy(event.key === '-' ? -.25 : .25);
  } else if (event.key === '0') {
    event.preventDefault();
    resetView();
  }
});
window.addEventListener('keydown', event => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});
new MutationObserver(paint).observe(workspace, { attributes: true, attributeFilter: ['class'] });
setCamera(0, 0, 1);
const initial = routeIndex();
history.replaceState(null, '', fragmentForStep(initial));
showStep(initial, false);
</script>
</body>
</html>
