<script>
const lesson = {
  question: '사진 앱과 음악 앱이 CPU 코어 하나를 함께 쓰면, 차례는 어떻게 정해질까요?',
  terms: [
    {term: 'CPU', meaning: '앱이 맡은 계산을 하는 부품', step: 1},
    {term: 'CPU 코어', meaning: 'CPU 안에서 한 번에 한 앱의 일을 하는 곳. 이 레슨의 컴퓨터에는 하나', step: 1},
    {term: '차례', meaning: '코어를 한 앱이 한 번 쓰는 칸. 아래 줄의 번호 칸', step: 1},
    {term: '완료', meaning: '앱이 차례마다 마친 일의 수. 앱 카드 옆 작은 칸의 개수', step: 1},
    {term: '준비됨', meaning: '할 일이 있어 차례를 받을 수 있는 상태', step: 1},
    {term: '쉬는 중', meaning: '앱이 잠시 멈춰 차례를 받지 않는 상태', step: 3}
  ],
  steps: [
    {
      label: '코어에 들어가는 일',
      title: '코어 하나는 한 번에 한 앱의 일을 합니다',
      body: '사진 앱에 정리할 사진이 있습니다. CPU는 앱이 맡은 계산을 하는 부품입니다. 여기서 살펴보는 CPU 코어 하나에 운영체제가 사진 앱의 일 하나를 올립니다. 이 레슨에서 코어는 운영체제가 차례를 주는 자리 하나를 뜻합니다.',
      takeaway: '코어의 사진 표식과 1번 칸의 표식이 같습니다. 사진 앱 옆에 끝낸 일이 한 칸 쌓입니다.',
      description: '사진 앱에서 운영체제를 거쳐 CPU 코어 하나로 화살표가 이어집니다. 최근 실행과 1번 차례에 모두 사진 표식이 있고, 사진 앱은 일 하나를 마쳤습니다.',
      figure: {custom: true, changed: ['코어 칸', '차례 1', '사진 완료']}
    },
    {
      label: '두 앱이 번갈아 실행',
      title: '두 앱에 할 일이 있으면 차례를 나눕니다',
      body: '음악 앱에도 할 일이 생겼습니다. 이 예에서 운영체제는 준비된 두 앱에 한 차례씩 번갈아 줍니다. 두 앱이 짧게 번갈아 계산하므로 사진을 정리하는 동안 음악도 들을 수 있습니다.',
      takeaway: '같은 코어에서 사진, 음악, 사진, 음악 순으로 네 차례를 썼습니다. 두 앱은 각각 두 차례를 얻었습니다.',
      description: '사진 앱과 음악 앱이 준비되어 있고 CPU 코어는 하나입니다. 차례 1에서 4까지 사진, 음악, 사진, 음악 순서로 기록됩니다. 각 앱이 두 차례씩 마쳤습니다.',
      figure: {custom: true, changed: ['음악 앱 카드', '음악 상태', '음악 완료', '사진 완료', '차례 2', '차례 3', '차례 4', '코어 칸']}
    },
    {
      label: '사진 앱이 잠시 쉼',
      title: '준비된 앱이 빈 차례를 이어서 얻습니다',
      body: '2단계의 두 번째 차례 직후로 돌아가, 그때 사진 앱이 쉬었다면 어떻게 되는지 아래 줄에 그립니다. 그래서 사진 앱의 완료는 1부터 봅니다. 두 번째 차례가 끝난 뒤 사진 앱을 잠시 멈춥니다. 음악 앱에 할 일이 남아 있어 운영체제가 세 번째와 네 번째 차례를 음악 앱에 줍니다. 코어는 쉬는 앱의 차례를 비워 두지 않고, 준비된 다른 앱에게 줍니다.',
      takeaway: '두 줄 모두 네 차례입니다. 사진 앱이 쉴 때 음악 앱의 두 차례가 세 차례로 늘어납니다.',
      description: '위의 네 차례는 사진, 음악, 사진, 음악입니다. 아래에서는 두 번째 차례 뒤 사진 앱이 쉬어 사진, 음악, 음악, 음악이 됩니다. 사진 앱이 한 차례, 음악 앱이 세 차례를 마칩니다.',
      figure: {custom: true, changed: ['아래 차례 3', '아래 차례 4', '음악 완료', '사진 완료', '사진 상태']},
      predict: {
        prompt: '두 번째 차례가 끝난 뒤 사진 앱이 쉽니다. 음악 앱에는 할 일이 남아 있습니다. 3번과 4번 차례는 어떻게 채워질까요?',
        options: [
          {text: '음악, 음악', correct: true, why: '차례는 준비된 앱이 받고, 사진 앱이 쉬는 동안 준비된 앱은 음악 앱뿐입니다.'},
          {text: '비어 있음, 음악', why: '사진 앱의 차례를 비워 두고 기다린다고 본 것인데, 코어는 비워 두지 않고 준비된 다른 앱에게 줍니다.'},
          {text: '사진, 음악', why: '2단계의 순서가 그대로 이어진다고 본 것인데, 쉬는 앱은 차례를 받지 않습니다.'}
        ],
        before: {custom: true, hide: ['아래 차례 3', '아래 차례 4', '음악 완료', '코어 칸', '흐름 화살표'],
          description: '사진 앱은 쉬는 중이고 완료 1입니다. 음악 앱은 준비됨이고 완료 수는 물음표입니다. 위 줄 둘 다 준비는 사진, 음악, 사진, 음악입니다. 아래 줄 사진 앱이 쉼은 1번 사진, 2번 음악이고 3번과 4번은 물음표입니다. CPU 코어 하나의 칸도 물음표입니다.'}
      }
    },
    {
      label: '다시 준비',
      title: '다시 준비된 앱은 하던 일을 이어갑니다',
      body: '사진 앱을 다시 준비시켜도 완료한 일은 그대로입니다. 이 예의 다음 차례를 실행하면 사진 앱이 이어서 계산합니다.',
      takeaway: '앞의 네 칸은 그대로입니다. 5번에 사진 앱이 들어오고 사진 앱이 끝낸 일은 하나에서 둘로 늘어납니다.',
      description: '앞의 사진, 음악, 음악, 음악 순서 뒤에 사진 앱이 다섯 번째로 기록됩니다. 사진 앱은 두 차례를, 음악 앱은 세 차례를 마쳤습니다.',
      figure: {custom: true, changed: ['차례 5', '사진 완료', '사진 상태', '코어 칸']},
      predict: {
        prompt: '쉬던 사진 앱이 다시 준비되었고, 5번 차례에 사진 앱이 실행됩니다. 5번 차례가 끝나면 사진 앱의 완료는 몇일까요?',
        options: [
          {text: '완료 2', correct: true, why: '쉬는 동안에도 마친 일 1은 그대로였으므로, 그 위에 한 차례가 더해집니다.'},
          {text: '완료 1', why: '쉬었다 돌아오면 처음부터 다시 한다고 본 것인데, 3단계에서 쉬는 동안 완료 1이 지워지지 않고 남아 있었습니다.'},
          {text: '완료 3', why: '쉬는 동안 놓친 차례까지 한꺼번에 받는다고 본 것인데, 한 차례에는 일 하나만 하고 놓친 차례를 돌려받지 않습니다.'}
        ],
        before: {custom: true, hide: ['차례 5', '사진 완료', '코어 칸', '흐름 화살표'],
          description: '사진 앱은 준비됨이고 완료 수는 물음표입니다. 음악 앱은 준비됨이고 완료 3입니다. 마친 차례는 사진, 음악, 음악, 음악이고 5번은 물음표입니다. CPU 코어 하나의 칸도 물음표입니다.'}
      }
    }
  ],
  review: {
    own: ['sharing-cpu-1', 'sharing-cpu-2'],
    prereq: {ref: 'os/what-os-does', id: 'what-os-does-4'},
    fallback: 'sharing-cpu-3'
  }
};

const slug = 'sharing-cpu';
const byId = id => document.getElementById(id);
const viewport = byId('scene');
const drawing = byId('figure');
const viewWidth = 620;
const viewHeight = 280;
const center = {x: viewWidth / 2, y: viewHeight / 2};
const camera = {x: 0, y: 0, zoom: 1};
const maxZoom = 2.2;
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

const normalTurns = ['photo', 'music', 'photo', 'music'];
const pausedTurns = ['photo', 'music', 'music', 'music'];
const demos = [
  {turns: normalTurns.slice(0, 1), paused: false},
  {turns: normalTurns, paused: false},
  {turns: pausedTurns, paused: true},
  {turns: [...pausedTurns, 'photo'], paused: false},
];
const limits = [1, 4, 4, 5];
const names = {photo: '사진 앱', music: '음악 앱'};
const marks = {photo: '사진', music: '음악'};

// Every drawn element joins a group named as in the card, so the frame can highlight or hide it.
// Shapes marked data-edge are the ones whose outline turns teal when their group is highlighted.
function named(parent, name) {
  return svg('g', {'data-name': name}, parent);
}

function card(group, x, y, width, height, tone = '') {
  return svg('rect', {x, y, width, height, rx: 7, class: 'cpu-card ' + tone, 'data-edge': ''}, group);
}

function label(group, x, y, text, small = false, anchor = 'middle') {
  svg('text', {x, y, class: 'cpu-label' + (small ? ' cpu-small' : ''), 'text-anchor': anchor}, group).textContent = text;
}

function flowArrow(group, start, end, y) {
  svg('line', {x1: start, x2: end - 6, y1: y, y2: y, class: 'cpu-shaft'}, group);
  svg('polygon', {points: `${end - 8},${y - 5} ${end},${y} ${end - 8},${y + 5}`,
    class: 'cpu-tip', 'data-arrowhead': ''}, group);
}

function count(turns, app) {
  return turns.filter(turn => turn === app).length;
}

// A hidden element is replaced by a placeholder of the same size in the same place (card "더할 것").
function appCard(group, app, y, completed, paused, hide) {
  const mark = marks[app];
  const body = named(group, mark + ' 앱 카드');
  card(body, 28, y, 166, 46, 'cpu-' + app + (paused ? ' cpu-paused' : ''));
  label(body, 40, y + 19, names[app], true, 'start');
  label(named(group, mark + ' 상태'), 181, y + 19, paused ? '쉬는 중' : '준비됨', true, 'end');
  const done = named(group, mark + ' 완료');
  if (hide.includes(mark + ' 완료')) {
    label(done, 40, y + 37, '완료 ?', true, 'start');
    return;
  }
  label(done, 40, y + 37, '완료 {#0}'.replace('{#0}', completed), true, 'start');
  for (let slot = 0; slot < completed; slot++) {
    card(done, 136 + slot * 13, y + 27, 10, 10, 'cpu-' + app);
  }
}

function timelineRow(group, y, prefix, name, numbers, turns, hide) {
  label(named(group, prefix + '줄 이름'), 28, y + 26, name, true, 'start');
  for (let slot = 0; slot < numbers; slot++) {
    const cell = named(group, prefix + '차례 ' + (slot + 1));
    const x = 176 + slot * 82;
    const app = hide.includes(prefix + '차례 ' + (slot + 1)) ? null : turns[slot];
    card(cell, x, y, 74, 35, app ? 'cpu-' + app : 'cpu-empty');
    label(cell, x + 12, y + 22, slot + 1, true);
    label(cell, x + 47, y + 22, app ? marks[app] : '?', true);
  }
}

function drawRun(group, index, run, hide = []) {
  const {turns, paused} = run;
  const latest = turns.at(-1);
  appCard(group, 'photo', 51, count(turns, 'photo'), paused, hide);
  if (index) appCard(group, 'music', 111, count(turns, 'music'), false, hide);
  const system = named(group, '운영체제 판');
  card(system, 242, 67, 148, 77, 'cpu-os');
  label(system, 316, 96, '운영체제');
  label(system, 316, 120, '차례 고르기', true);
  const core = named(group, '코어 판');
  card(core, 443, 67, 151, 77);
  label(core, 518.5, 89, 'CPU 코어 하나');
  const slot = named(group, '코어 칸');
  if (hide.includes('코어 칸')) {
    card(slot, 457, 99, 123, 32, 'cpu-empty');
    label(slot, 518.5, 119, '?', true);
  } else {
    card(slot, 457, 99, 123, 32, 'cpu-' + latest);
    label(slot, 518.5, 119, '최근 실행 · {0}'.replace('{0}', marks[latest]), true);
  }
  if (!hide.includes('흐름 화살표')) {
    const arrows = named(group, '흐름 화살표');
    flowArrow(arrows, 199, 235, latest === 'photo' ? 81 : 129);
    flowArrow(arrows, 397, 437, 105);
  }
  if (index === 2) {
    timelineRow(group, 174, '위 ', '둘 다 준비', 4, normalTurns, hide);
    timelineRow(group, 220, '아래 ', '사진 앱이 쉼', 4, turns, hide);
  } else {
    timelineRow(group, 199, '', '마친 차례', limits[index], turns, hide);
  }
}

// A highlighted group colours the outline of its edge shapes and its words (frame spec 3.7 rule 2).
function drawFigure(index, {hide = [], changed = []}) {
  drawing.replaceChildren();
  drawRun(drawing, index, demos[index], hide);
  for (const name of changed) {
    for (const element of drawing.querySelector(`[data-name="${name}"]`)?.querySelectorAll('[data-edge], text') ?? []) {
      element.setAttribute('data-changed', '');
    }
  }
}

byId('zoom-in').onclick = () => zoomBy(.3);
byId('zoom-out').onclick = () => zoomBy(-.3);
enableCameraDrag();

viewport.addEventListener('keydown', event => {
  if (camera.zoom === 1) return;
  const direction = {ArrowLeft: [-1, 0], ArrowUp: [0, -1], ArrowRight: [1, 0], ArrowDown: [0, 1]}[event.key];
  if (!direction) return;
  event.preventDefault();
  setCamera(camera.x + direction[0] * 18, camera.y + direction[1] * 18, camera.zoom);
});

window.addEventListener('keydown', event => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === '+') zoomBy(.3);
  else if (event.key === '-') zoomBy(-.3);
  else if (event.key === '0') resetView();
  else return;
  event.preventDefault();
});
setCamera(0, 0, 1);
</script>
