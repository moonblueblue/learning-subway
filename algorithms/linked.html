<style>
:root{color-scheme:light;--ink:#142620;--muted:#43574f;--border:#cbd9d0;--paper:#f4f7ef;--panel:#fff;--accent:#0f766e;--request:#187959;--response:#5362a0;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}

:focus-visible{outline:3px solid #a24c14;outline-offset:3px}
.shell{max-width:1280px;margin:auto;padding:clamp(16px,2.5vw,32px)}

.node .face{stroke-width:.8;stroke-linejoin:round}

.switch{cursor:pointer}
.switch .face,.switch .glow,.switch .digit,.switch .tag rect,.switch .tag text{transition:fill .18s,stroke .18s,opacity .18s}
.switch .left{fill:#d3dad6;stroke:#8c9d96}
.switch .right{fill:#b9c4be;stroke:#8c9d96}

.cell.empty .top{fill:#f3f5f4}.cell.empty .left,.cell.empty .right{fill:#eef1ef}
.lnode .left{fill:#dfe4f2;stroke:#7a87b5}.lnode .right{fill:#c4cbe3;stroke:#7a87b5}.lnode .top{fill:#eef1fb;stroke:#7a87b5}
.cell.hit .top,.lnode.hit .top{fill:#ffd34d;stroke:#c9940f}

.row-tag text{font-weight:800}

.run-area{display:flex;gap:12px 18px;flex-wrap:wrap;align-items:flex-start}

<body>
<main class="shell">
  <header>
    <p class="eyebrow">4장 자료구조와 알고리즘 · 레슨 4.2</p>
    <h1>배열과 연결 리스트</h1>
    <p class="lead">중간에 값을 끼워 넣을 때 두 구조는 무엇이 다를까요? 같은 값을 배열과 연결 리스트에 담고 읽기와 끼워 넣기의 걸음 수를 세어 보세요.</p>
  </header>
  <div class="workspace">
    <div>
      <section class="panel" aria-labelledby="stage-heading">
        <div class="stage-top"><h2 id="stage-heading">메모리 속 두 구조</h2></div>
        <div class="stage">
          <svg id="scene" viewBox="0 0 620 280" role="img" tabindex="0" aria-labelledby="scene-title scene-desc">
            <title id="scene-title">붙어 있는 배열 칸과 화살표로 이어진 연결 리스트 노드가 있는 장면</title><desc id="scene-desc"></desc>
            <defs>
              <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
              <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
              <radialGradient id="grid-fade"><stop offset=".45" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
              <mask id="grid-mask"><rect x="-460" y="-260" width="920" height="520" fill="url(#grid-fade)"/></mask>
            </defs>
            <g id="world" aria-hidden="true">
              <path id="grid" class="iso-grid" mask="url(#grid-mask)"></path>
              <g id="casings"></g><g id="links"></g><g id="nodes"></g><g id="packets"></g>
            </g>
          </svg>
        </div>
        <div class="hands-on">
          <div class="try" id="try">
            <p><strong>해 보기</strong><span id="try-text"></span></p>
            <p class="try-result" id="try-result" role="status"></p>
            <div class="try-choices" id="try-choices" role="group" aria-label="예측 고르기"></div>
          </div>
          <p class="readout" id="readout"></p>
          <div class="run-area">
            <div class="run-controls">
              <div class="size-row" id="pos-row" role="group" aria-label="위치 고르기"></div>
              <div class="algo-row">
                <span class="row-name">할 일</span>
                <button class="action primary" id="do-read" type="button">읽기</button>
                <button class="action primary" id="do-insert" type="button">끼워 넣기</button>
                <button class="action" id="do-reset" type="button">처음 값으로</button>
              </div>
              <div class="counts"><span id="count-array">배열 <b>0</b>번</span><span id="count-list">연결 리스트 <b>0</b>번</span></div>
            </div>

          </div>
        </div>
        <div class="view-controls" role="group" aria-label="장면 보기">
          <button class="action" id="zoom-out" type="button" aria-label="장면 축소">−</button>
          <output class="view-scale" id="view-scale" aria-label="현재 배율" aria-live="off">100%</output>
          <button class="action" id="zoom-in" type="button" aria-label="장면 확대">+</button>
          <span class="view-hint"><span class="mouse-hint">확대 후 드래그로 이동</span><span class="touch-hint">두 손가락으로 확대</span></span>
        </div>
        <div class="controls">
          <div class="legend" aria-label="범례"><span><i class="dot hit"></i>찾은 칸</span><span><i class="dot walk"></i>지나간 노드</span><span><i class="dot shift"></i>밀린 칸</span><span><i class="sample ptr"></i>다음 노드를 가리키는 화살표</span></div>
        </div>

<script>
const byId = (id) => document.getElementById(id);
const viewport = byId('scene');
const viewWidth = 620;
const viewHeight = 280;
const maxZoom = 3;
const center = { x: viewWidth / 2, y: viewHeight / 2 };
const camera = { x: 0, y: 0, zoom: 1 };
const pointers = new Map();
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));



// Convert from screen pixels to fixed viewport coordinates, accounting for SVG letterboxing.


// A press that starts on a switch and ends without moving toggles that switch.
// Tracked separately from the camera pointers so it also works when the pointer is captured.
let tap = null;
viewport.addEventListener('pointerdown', (event) => {
  const target = event.target.closest?.('[data-input]');
  tap = target && event.button === 0 && pointers.size === 0
    ? { input: target.dataset.input, x: event.clientX, y: event.clientY, id: event.pointerId }
    : null;
});
viewport.addEventListener('pointerup', (event) => {
  if (tap && tap.id === event.pointerId && Math.hypot(event.clientX - tap.x, event.clientY - tap.y) < 8) {
    toggleInput(tap.input);
  }
  tap = null;
});
viewport.addEventListener('pointercancel', () => { tap = null; });

viewport.addEventListener('pointerdown', (event) => {
  if (event.button !== 0 || pointers.size >= 2) return;
  if (event.pointerType !== 'touch' && camera.zoom === 1) return;
  pointers.set(event.pointerId, viewportPoint(event));
  viewport.setPointerCapture(event.pointerId);
});
viewport.addEventListener('pointermove', (event) => {
  if (!pointers.has(event.pointerId)) return;
  const before = pointerGeometry();
  pointers.set(event.pointerId, viewportPoint(event));
  const after = pointerGeometry();
  const pinch = pointers.size === 2;
  if (pinch && (before.distance < 1 || after.distance < 1)) return;
  const zoom = pinch ? camera.zoom * after.distance / before.distance : camera.zoom;
  zoomBetween(zoom, before.point, after.point);
  viewport.classList.toggle('is-dragging', !pinch && camera.zoom > 1);
});
for (const eventName of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  viewport.addEventListener(eventName, (event) => {
    if (pointers.delete(event.pointerId)) viewport.classList.remove('is-dragging');
  });
}



byId('zoom-in').onclick = () => zoomBy(.25);
byId('zoom-out').onclick = () => zoomBy(-.25);
viewport.addEventListener('keydown', (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const directions = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const direction = directions[event.key];
  if (direction && camera.zoom > 1) {
    event.preventDefault();
    setCamera(camera.x + direction[0] * 28 / camera.zoom, camera.y + direction[1] * 28 / camera.zoom, camera.zoom);
  } else if (event.key === '+' || event.key === '=' || event.key === '-') {
    event.preventDefault();
    zoomBy(event.key === '-' ? -.25 : .25);
  } else if (event.key === '0') {
    event.preventDefault();
    resetView();
  }
});
setCamera(0, 0, 1);
// Two ways to keep a sequence: an array (cells side by side at consecutive addresses) and a linked list
// (nodes anywhere in memory, each holding the address of the next). The learner reads the k-th value
// or inserts a value at position k, and each structure counts its steps.
const lesson = [
  {
    label: '배열',
    readingDiagram: {
      title: "배열 맨 앞에 넣으면 여섯 칸이 모두 한 칸씩 뒤로 간다",
      description: "붙어 있는 칸 0–5번에 A–F가 있습니다. 맨 앞에 새 값을 넣으려고 F부터 A까지 여섯 값을 한 칸씩 뒤로 옮기고, 비워진 0번 칸에 새 값을 씁니다.",
      nodes: [
        ["t0", 95, 104, 60, 30, ["A"]],
        ["t1", 161, 104, 60, 30, ["B"]],
        ["t2", 227, 104, 60, 30, ["C"]],
        ["t3", 293, 104, 60, 30, ["D"]],
        ["t4", 359, 104, 60, 30, ["E"]],
        ["t5", 425, 104, 60, 30, ["F"]],
        ["t6", 491, 104, 60, 30, [""], "muted"],
        ["b0", 95, 204, 60, 30, ["새 값"], "active"],
        ["b1", 161, 204, 60, 30, ["A"], "active"],
        ["b2", 227, 204, 60, 30, ["B"], "active"],
        ["b3", 293, 204, 60, 30, ["C"], "active"],
        ["b4", 359, 204, 60, 30, ["D"], "active"],
        ["b5", 425, 204, 60, 30, ["E"], "active"],
        ["b6", 491, 204, 60, 30, ["F"], "active"],
      ],
      edges: [
        ["t0", "b1", "muted"],
        ["t1", "b2", "muted"],
        ["t2", "b3", "muted"],
        ["t3", "b4", "muted"],
        ["t4", "b5", "muted"],
        ["t5", "b6", "muted"],
      ],
      labels: [[28, 76, "삽입 전 · 붙어 있는 칸"], [28, 270, "한 칸씩 뒤로 옮긴 뒤 0번 칸에 새 값"], [91, 244, "0"], [157, 244, "1"], [223, 244, "2"], [289, 244, "3"], [355, 244, "4"], [421, 244, "5"], [487, 244, "6"]],
    },

const motion = matchMedia('(prefers-reduced-motion: reduce)');
const storageKey = 'linked-lab:v1:step';
const capacity = 10;
const baseAddress = 100;
const startValues = ['A', 'B', 'C', 'D', 'E', 'F'];
const state = { index: 0, values: [], k: 2, playing: !motion.matches, wait: 0, busy: false,
  solved: '', wrong: '', nextLetter: 0, log: [], demoPosition: 0, steps: { array: 0, list: 0 } };
const progress = lesson.map(() => 0);
let timers = [];

const project = (x, y, z = 0) => [14 * (x + y), 7 * (x - y) - z];
const point = (x, y, z) => project(x, y, z).map((value) => +value.toFixed(2)).join(',');
const flat = (u, v, z = 0) => [14 * u, 7 * v - z];
const mix = (a, b, t) => a + (b - a) * t;
const gridLines = [];
for (let i = -24; i <= 40; i += 2) gridLines.push(`M${point(i, -24, 0)}L${point(i, 40, 0)}M${point(-24, i, 0)}L${point(40, i, 0)}`);
byId('grid').setAttribute('d', gridLines.join(''));
let plates = [];
function addPlate(node, className, x, y, text, { pad = 1.3, round = false } = {}) {
  const group = svg('g', { class: className }, node);
  const plate = { group, rect: svg('rect', {}, group), label: svg('text', {}, group), x, y, pad, round };
  plate.label.textContent = text;
  plates.push(plate);
  sizePlate(plate);
  return plate;
}
matchMedia('(max-width: 600px)').addEventListener('change', () => plates.forEach(sizePlate));

// ---------- Layout ----------
const show = (name) => lesson[state.index].show.includes(name);
const arrayV = () => show('list') ? -7 : 0;
const listV = () => show('array') ? 6 : 0;
const cellU = (i) => i * 2.5;
// List nodes sit in order left to right but at scattered heights, like nodes placed anywhere in memory.
const jitter = [0, -1.2, .9, -.6, 1.3, -1, .5, -1.4, 1.1, -.3, .8];
const nodeAt = (i) => ({ u: i * 3.3 + .4, v: listV() + jitter[i % jitter.length] });
const nodeAddress = (i) => [340, 212, 488, 156, 404, 276, 520, 132, 368, 244, 456][i % 11];

function buildScene() {
  for (const id of ['casings', 'links', 'nodes', 'packets']) byId(id).replaceChildren();
  plates = [];
  const n = state.values.length;
  if (show('array')) {
    const label = svg('g', {}, byId('nodes'));
    addPlate(label, 'tag row-tag', ...flat(-2.6, arrayV()), '배열', { round: true });
    for (let i = 0; i < capacity; i++) {
      const node = svg('g', { class: 'node cell' + (i < n ? ' used' : ' empty'), 'data-cell': i, transform: `translate(${flat(cellU(i), arrayV()).join(' ')})` }, byId('nodes'));
      drawShadow(node, .58);
      drawBox(node, .58, 10);
      svg('text', { class: 'cell-value', x: 0, y: -9.5 }, node).textContent = i < n ? state.values[i] : '';
      svg('text', { class: 'address', x: 0, y: 26 }, node).textContent = String(baseAddress + i);
    }
  }
  if (show('list')) {
    const head = svg('g', { class: 'node head' }, byId('nodes'));
    const [hx, hy] = flat(-2.6, listV());
    addPlate(head, 'tag row-tag head-tag', hx, hy, 'head', { round: true });
    const pts = state.values.map((_, i) => nodeAt(i));
    // Arrows: head → node 0 → node 1 → …
    const arrow = (from, to, cls = '') => {
      const [ax, ay] = from, [bx, by] = to;
      const angle = Math.atan2(by - ay, bx - ax);
      const end = [bx - Math.cos(angle) * 20, by - Math.sin(angle) * 10];
      const start = [ax + Math.cos(angle) * 18, ay + Math.sin(angle) * 8];
      const g = svg('g', { class: 'pointer ' + cls }, byId('links'));
      svg('path', { d: `M${start.join(' ')}L${end.join(' ')}` }, g);
      svg('path', { class: 'tip', d: 'M-6 -4L0 0L-6 4', transform: `translate(${end.join(' ')}) rotate(${angle * 180 / Math.PI})` }, g);
      return g;
    };
    if (pts.length) arrow([hx + 14, hy], flat(pts[0].u, pts[0].v, 6), 'from-head');
    for (let i = 0; i + 1 < pts.length; i++) arrow(flat(pts[i].u, pts[i].v, 6), flat(pts[i + 1].u, pts[i + 1].v, 6), 'p' + i);
    pts.forEach((p, i) => {
      const node = svg('g', { class: 'node lnode', 'data-node': i, transform: `translate(${flat(p.u, p.v).join(' ')})` }, byId('nodes'));
      drawShadow(node, .58);
      drawBox(node, .58, 9);
      svg('text', { class: 'cell-value', x: 0, y: -8.5 }, node).textContent = state.values[i];
      svg('text', { class: 'address', x: 0, y: 24 }, node).textContent = `${nodeAddress(i)}번지`;
    });
    if (pts.length) {
      const last = pts.at(-1);
      const [lx, ly] = flat(last.u + 1.6, last.v, 6);
      svg('text', { class: 'null-mark', x: lx + 8, y: ly + 3 }, byId('links')).textContent = '끝';
    }
  }
  const right = 14 * Math.max(cellU(capacity - 1), show('list') ? nodeAt(Math.max(state.values.length, 7)).u : 0) + 50, left = 14 * -2.6 - 40;
  const top = 7 * Math.min(show('array') ? arrayV() : 99, show('list') ? listV() - 2 : 99) - 40;
  const bottom = 7 * Math.max(show('array') ? arrayV() : -99, show('list') ? listV() + 2 : -99) + 40;
  const scale = Math.min(1.7, 590 / (right - left), 268 / (bottom - top));
  const x = 310 - scale * (left + right) / 2, y = 140 - scale * (top + bottom) / 2;
  byId('world').setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${scale.toFixed(3)})`);
}
const cellNode = (i) => byId('nodes').querySelector(`[data-cell="${i}"]`);
const listNode = (i) => byId('nodes').querySelector(`[data-node="${i}"]`);
function mark(node, cls, on = true) { node?.classList.toggle(cls, on); }

// ---------- Animated steps ----------
// Each structure plays a list of moves, one every `pace` ms; both play side by side.
function cancelAll() {
  timers.forEach(clearTimeout);
  timers = [];
  byId('packets').replaceChildren();
  state.busy = false;
}
function floatLabel(text, from, to, ms) {
  if (motion.matches) return;
  const g = svg('g', { class: 'mover' }, byId('packets'));
  svg('circle', { class: 'packet-halo', r: 9 }, g);
  svg('circle', { class: 'packet', r: 4.6 }, g);
  svg('text', { class: 'packet-label', y: -10 }, g).textContent = text;
  const start = performance.now();
  const step = (now) => {
    const t = Math.min((now - start) / ms, 1);
    const e = t * t * (3 - 2 * t);
    g.setAttribute('transform', `translate(${mix(from[0], to[0], e)} ${mix(from[1], to[1], e)})`);
    if (t < 1) requestAnimationFrame(step); else g.remove();
  };
  requestAnimationFrame(step);
}

function arrayRead(k, pace) {
  const moves = [() => {
    mark(cellNode(k), 'hit');
    floatLabel(`${baseAddress} + ${k}`, flat(-2.6, arrayV(), 20), flat(cellU(k), arrayV(), 20), pace * .9);
  }];
  return { moves, steps: 1, text: `배열: ${baseAddress} + ${k} = ${baseAddress + k}번지로 바로 감 · 1번` };
}
function listRead(k, pace) {
  const moves = [];
  for (let i = 0; i <= k; i++) moves.push(() => {
    mark(listNode(i - 1), 'walk', false);
    mark(listNode(i), i === k ? 'hit' : 'walk');
    const from = i === 0 ? flat(-2.6, listV(), 6) : flat(nodeAt(i - 1).u, nodeAt(i - 1).v, 18);
    floatLabel(i === 0 ? 'head' : '다음', from, flat(nodeAt(i).u, nodeAt(i).v, 18), pace * .9);
  });
  return { moves, steps: k + 1, text: `연결 리스트: head부터 노드 ${k + 1}개를 거침 · ${k + 1}번` };
}
function arrayInsert(k, value, pace) {
  const n = state.values.length;
  if (n >= capacity) return { moves: [], steps: 0, text: '배열: 칸이 가득 찼습니다. 더 큰 배열을 새로 만들어 모두 옮겨야 합니다.', full: true };
  const moves = [];
  for (let i = n - 1; i >= k; i--) moves.push(() => {
    mark(cellNode(i + 1), 'shift');
    floatLabel(state.values[i], flat(cellU(i), arrayV(), 16), flat(cellU(i + 1), arrayV(), 16), pace * .9);
  });
  moves.push(() => { mark(cellNode(k), 'hit'); floatLabel(value, flat(cellU(k), arrayV(), 40), flat(cellU(k), arrayV(), 16), pace * .9); });
  return { moves, steps: n - k + 1, text: n === k ? '배열: 밀 값 없이 빈 칸에 바로 넣음 · 1번' : `배열: 뒤의 값 ${n - k}개를 한 칸씩 밀고 넣음 · ${n - k + 1}번` };
}
function listInsert(k, value, pace) {
  const moves = [];
  for (let i = 0; i < k; i++) moves.push(() => {
    mark(listNode(i - 1), 'walk', false);
    mark(listNode(i), 'walk');
    const from = i === 0 ? flat(-2.6, listV(), 6) : flat(nodeAt(i - 1).u, nodeAt(i - 1).v, 18);
    floatLabel(i === 0 ? 'head' : '다음', from, flat(nodeAt(i).u, nodeAt(i).v, 18), pace * .9);
  });
  const prevName = k === 0 ? 'head' : `${state.values[k - 1]} 노드`;
  moves.push(() => floatLabel(`새 ${value} → ${state.values[k] ?? '끝'}`, flat(nodeAt(k).u, listV() + 4.5, 10), flat(nodeAt(k).u, listV() + 2.5, 10), pace * .9));
  moves.push(() => floatLabel(`${prevName} → 새 ${value}`, flat(k === 0 ? -2.6 : nodeAt(k - 1).u, listV(), 18), flat(nodeAt(k).u, listV() + 2.5, 18), pace * .9));
  return { moves, steps: k + 2, text: `연결 리스트: ${k ? `노드 ${k}개를 걸어간 뒤 ` : ''}화살표 2개를 바꿈 · ${k + 2}번` };
}

// Run the same operation on every visible structure, then update the values and the log.
function perform(kind, k, user) {
  if (state.busy) return;
  const n = state.values.length;
  const value = startValues.length + state.nextLetter < 26 ? String.fromCharCode(71 + state.nextLetter) : '?';
  const pace = motion.matches ? 0 : 420;
  const plans = {};
  if (show('array')) plans.array = kind === 'read' ? arrayRead(k, pace) : arrayInsert(k, value, pace);
  if (show('list')) plans.list = kind === 'read' ? listRead(k, pace) : listInsert(k, value, pace);
  if (plans.array?.full) { report(plans.array.text); return; }
  state.busy = true;
  syncControls();
  const longest = Math.max(...Object.values(plans).map((p) => p.moves.length));
  for (let m = 0; m < longest; m++) {
    later(m * pace, () => {
      for (const [name, plan] of Object.entries(plans)) {
        if (!plan.moves[m]) continue;
        plan.moves[m]();
        state.steps[name] = m + 1;
      }
      paintCounts(plans);
    });
  }
  later(longest * pace + (motion.matches ? 0 : 350), () => {
    if (kind === 'insert') { state.values.splice(k, 0, value); state.nextLetter++; }
    state.busy = false;
    buildScene();
    if (kind === 'read') { mark(cellNode(k), 'hit'); mark(listNode(k), 'hit'); }
    else { mark(cellNode(k), 'fresh'); mark(listNode(k), 'fresh'); }
    const entry = { kind, k, n, array: plans.array?.steps, list: plans.list?.steps };
    state.log.unshift(entry);
    state.log.length = Math.min(state.log.length, 6);
    report(Object.values(plans).map((p) => p.text).join(' / '));
    paintCounts(plans, true);
    syncLog();
    syncControls();
    if (user) afterUser({ kind, k, n, atEnd: k === n, array: Boolean(plans.array), list: Boolean(plans.list) });
  });
}

// ---------- Panel ----------
function paintCounts(plans, final = false) {
  for (const name of ['array', 'list']) {
    const el = byId('count-' + name);
    el.hidden = !show(name);
    if (!plans?.[name]) continue;
    el.querySelector('b').textContent = final ? plans[name].steps : state.steps[name];
  }
}
function buildControls() {
  const row = byId('pos-row');
  row.replaceChildren(Object.assign(document.createElement('span'), { className: 'row-name', textContent: '위치 k' }));
  for (let k = 0; k <= state.values.length; k++) {
    const b = Object.assign(document.createElement('button'), { type: 'button', className: 'size-button', textContent: k });
    b.addEventListener('click', () => { takeOver(); state.k = k; syncControls(); });
    row.append(b);
  }
}
function syncControls() {
  const n = state.values.length;
  if (byId('pos-row').querySelectorAll('button').length !== n + 1) buildControls();
  state.k = Math.min(state.k, n);
  [...byId('pos-row').querySelectorAll('button')].forEach((b, k) => {
    b.setAttribute('aria-pressed', String(k === state.k));
    b.disabled = state.busy && !state.playing;
    b.title = k === n ? '맨 끝(끼워 넣기만)' : '';
  });
  byId('do-read').disabled = (state.busy && !state.playing) || state.k >= n;
  byId('do-insert').disabled = (state.busy && !state.playing) || (show('array') && !show('list') && n >= capacity);
  byId('do-reset').disabled = state.busy && !state.playing;
}
function syncLog() {
  const table = byId('log');
  table.replaceChildren(Object.assign(document.createElement('caption'), { textContent: '걸음 수 기록 · 최근 것이 위' }));
  const head = document.createElement('tr');
  for (const name of ['한 일', ...(show('array') ? ['배열'] : []), ...(show('list') ? ['연결 리스트'] : [])]) head.append(Object.assign(document.createElement('th'), { textContent: name }));
  table.append(head);
  for (const entry of state.log) {
    const tr = document.createElement('tr');
    tr.append(Object.assign(document.createElement('td'), { textContent: `${entry.kind === 'read' ? '읽기' : '끼워 넣기'} k = ${entry.k} (값 ${entry.n}개)` }));
    if (show('array')) tr.append(Object.assign(document.createElement('td'), { textContent: entry.array === undefined ? '–' : `${entry.array}번` }));
    if (show('list')) tr.append(Object.assign(document.createElement('td'), { textContent: entry.list === undefined ? '–' : `${entry.list}번` }));
    table.append(tr);
  }
  if (!state.log.length) {
    const tr = document.createElement('tr');
    tr.append(Object.assign(document.createElement('td'), { textContent: '읽기나 끼워 넣기를 하면 여기에 쌓입니다', colSpan: 3, className: 'empty' }));
    table.append(tr);
  }
}
function report(text) { byId('readout').textContent = text; byId('announcement').textContent = text; }
function resetValues() {
  cancelAll();
  state.values = [...startValues];
  state.nextLetter = 0;
  state.log = [];
  state.k = Math.min(state.k, state.values.length);
  buildScene();
  buildControls();
  paintCounts();
  for (const name of ['array', 'list']) byId('count-' + name).querySelector('b').textContent = '0';
  syncLog();
  syncControls();
}
byId('do-read').onclick = () => { takeOver(); perform('read', state.k, true); };
byId('do-insert').onclick = () => { takeOver(); perform('insert', state.k, true); };
byId('do-reset').onclick = () => { takeOver(); resetValues(); report('처음 값 A–F로 되돌렸습니다.'); };

// ---------- Tasks ----------
const currentTask = () => lesson[state.index].tasks[progress[state.index]];
function syncTask() {
  const tasks = lesson[state.index].tasks;
  const task = currentTask();
  const choices = byId('try-choices');
  choices.replaceChildren();
  byId('try').classList.toggle('solved', Boolean(state.solved) && !task?.ask);
  if (task?.ask) {
    byId('try-text').textContent = task.ask;
    byId('try-result').textContent = state.wrong || (state.solved ? `✓ 맞았습니다. ${state.solved}` : '');
    for (const choice of task.choices) {
      const b = Object.assign(document.createElement('button'), { type: 'button', className: 'action choice-button', textContent: choice });
      b.addEventListener('click', () => answer(choice));
      choices.append(b);
    }
    return;
  }
  byId('try-text').textContent = task ? task.text : (state.solved ? '' : '이 단계의 문제를 모두 풀었습니다. 자유롭게 해 보세요.');
  byId('try-result').textContent = state.solved ? `✓ 맞았습니다. ${state.solved}${progress[state.index] >= tasks.length ? ' · 이 단계의 문제를 모두 풀었습니다.' : ''}` : '';
}
// Only the learner's own actions count, so the demo cannot solve a problem.
function afterUser(event) {
  const task = currentTask();
  state.solved = '';
  if (task && !task.ask && task.test(event)) { progress[state.index]++; state.solved = task.ok; }
  syncTask();
}
function answer(choice) {
  const task = currentTask();
  if (choice !== task.answer) { state.wrong = `✗ ${choice}이(가) 아닙니다. 다시 골라 보세요.`; syncTask(); return; }
  progress[state.index]++;
  state.wrong = '';
  state.solved = task.why;
  syncTask();
}

// ---------- Demo ----------
let frame = null, lastFrame = null;
function takeOver() {
  if (!state.playing) return;
  state.playing = false;
  cancelAll();
  resetValues();
  syncPlayback();
}
const demoPlan = [['read', 3], ['insert', 1], ['read', 5], ['insert', 0]];
function demoTick() {
  document.querySelector('.course-step-preview')?.dispatchEvent(new Event('course-playback-start'));
  if (state.busy) { state.wait = 300; return; }
  if (state.demoPosition % demoPlan.length === 0 && state.demoPosition) resetValues();
  const [kind, k] = demoPlan[state.demoPosition++ % demoPlan.length];
  state.k = k;
  perform(kind, k, false);
  state.wait = 4600;
}
function tick(now) {
  frame = null;
  const elapsed = lastFrame === null ? 0 : Math.min(now - lastFrame, 80);
  lastFrame = now;
  if (state.playing) {
    state.wait -= elapsed;
    if (state.wait <= 0) demoTick();
    frame = requestAnimationFrame(tick);
  } else lastFrame = null;
}
function syncPlayback() {
  const reduced = motion.matches;
  if (reduced) state.playing = false;
  if (state.playing && frame === null) frame = requestAnimationFrame(tick);
  syncControls();
}

// ---------- Steps and routing ----------
function showStep(index, announce = true) {
  state.index = index;
  state.playing = !motion.matches;
  const s = lesson[index];
  state.solved = '';
  state.wrong = '';
  state.demoPosition = 0;
  state.k = 2;
  byId('step-title').textContent = s.title;
  byId('body').textContent = s.body;
  byId('takeaway').textContent = s.takeaway;
  byId('scene-desc').textContent = s.description;
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  stepButtons.forEach((button, i) => {
    if (i === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  try { localStorage.setItem(storageKey, String(index)); } catch {}
  resetValues();
  report('위치 k를 고르고 읽기나 끼워 넣기를 눌러 보세요.');
  syncTask();
  state.wait = 900;
  syncPlayback();
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${s.title}`;
}
function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/linked/${index + 1}`);
  showStep(index);
}
function routeIndex() {
  const match = /^#\/linked\/(\d+)$/.exec(location.hash);
  const routed = match ? Number(match[1]) - 1 : -1;
  if (routed >= 0 && routed < lesson.length) return routed;
  try {
    const stored = localStorage.getItem(storageKey);
    const index = Number(stored);
    if (stored !== null && Number.isInteger(index) && index >= 0 && index < lesson.length) return index;
  } catch {}
  return 0;
}
const stepButtons = lesson.map(({ label }, index) => {
  const listItem = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  const number = document.createElement('span');
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.addEventListener('click', () => goToStep(index));
  listItem.append(button);
  byId('steps').append(listItem);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
motion.addEventListener('change', () => {
  if (!motion.matches) state.playing = true;
  syncPlayback();
});
window.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});
const initial = routeIndex();
history.replaceState(null, '', `#/linked/${initial + 1}`);
state.index = -1;
showStep(initial, false);
</script>
</body>
</html>
