<style>

:focus-visible{outline:3px solid #a24c14;outline-offset:3px}

@media(pointer:coarse){.mouse-hint{display:none}.touch-hint{display:inline}}

.node .face{stroke-width:.8;stroke-linejoin:round}
.node .shadow{fill:#1f4434;opacity:.16}
.node .highlight{fill:none;stroke:#fff;stroke-opacity:.75;stroke-width:1.1;stroke-linecap:round}

.switch .face,.switch .glow,.switch .digit,.switch .tag rect,.switch .tag text{transition:fill .18s,stroke .18s,opacity .18s}
.switch .left{fill:#d3dad6;stroke:#8c9d96}
.switch .right{fill:#b9c4be;stroke:#8c9d96}
.switch .top{fill:#eef1ef;stroke:#8c9d96}
.switch.on .left{fill:#a5d6b6;stroke:#4f8f6b}

.place.waiting .top{stroke:#c9940f;stroke-width:1.6;stroke-dasharray:3 2}
.place.visited.d0 .top{fill:#d2f4dd}.place.visited.d1 .top{fill:#a9e2bd}.place.visited.d2 .top{fill:#7fcb9c}.place.visited.d3 .top{fill:#57b07d}.place.visited.d4 .top{fill:#3c8f62}

<body>
<main class="shell">
  <header>
    <p class="eyebrow">4장 자료구조와 알고리즘 · 레슨 4.7</p>
    <h1>그래프 탐색</h1>
    <p class="lead">너비 우선과 깊이 우선은 어떤 순서로 길을 찾을까요? 같은 그래프를 큐와 스택으로 한 걸음씩 탐색해 보세요.</p>
  </header>
  <div class="workspace">
    <div>
      <section class="panel" id="stage-panel" aria-labelledby="stage-heading">
        <div class="stage-top"><h2 id="stage-heading">길로 이어진 아홉 곳</h2></div>
        <div class="stage">
          <svg id="scene" viewBox="0 0 620 280" role="img" tabindex="0" aria-labelledby="scene-title scene-desc">
            <title id="scene-title">A부터 I까지 아홉 곳이 길로 이어져 있고, 탐색 순서대로 번호가 붙는 장면</title><desc id="scene-desc"></desc>
            <defs>
              <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
              <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
              <radialGradient id="grid-fade"><stop offset=".45" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
              <mask id="grid-mask"><rect x="-460" y="-260" width="920" height="520" fill="url(#grid-fade)"/></mask>
            </defs>
            <g id="world" aria-hidden="true">
              <path id="grid" class="iso-grid" mask="url(#grid-mask)"></path>
              <g id="casings"></g><g id="links"></g><g id="nodes"></g><g id="packets"></g>
            </g>
          </svg>
        </div>
        <div class="hands-on">
          <div class="try" id="try">
            <p><strong>해 보기</strong><span id="try-text"></span></p>
            <p class="try-result" id="try-result" role="status"></p>
            <div class="try-choices" id="try-choices" role="group" aria-label="예측 고르기"></div>
          </div>
          <p class="readout" id="readout"></p>
          <div class="algo-row" id="kind-row" role="group" aria-label="탐색 고르기"></div>
          <div class="frontier-row"><span class="row-name" id="frontier-name">큐</span><span class="chips" id="frontier" aria-live="off"></span></div>
          <p class="walk-line">방문 순서 <b id="visit-order">–</b></p>
          <div class="algo-row"><button class="action primary" id="step-tick" type="button">한 걸음</button><button class="action primary" id="step-all" type="button">끝까지</button><button class="action" id="restart" type="button">처음부터</button></div>
        </div>
        <div class="view-controls" role="group" aria-label="장면 보기">
          <button class="action" id="zoom-out" type="button" aria-label="장면 축소">−</button>
          <output class="view-scale" id="view-scale" aria-label="현재 배율" aria-live="off">100%</output>
          <button class="action" id="zoom-in" type="button" aria-label="장면 확대">+</button>
          <span class="view-hint"><span class="mouse-hint">확대 후 드래그로 이동</span><span class="touch-hint">두 손가락으로 확대</span></span>
        </div>
        <div class="controls">
          <div class="legend" aria-label="범례"><span><i class="dot visited"></i>방문함 (짙을수록 먼 겹)</span><span><i class="dot waiting"></i>방문 대기</span><span><i class="sample tree"></i>처음 들어온 길</span><span><i class="sample path"></i>찾은 경로</span></div>
        </div>
        <nav class="timeline" aria-labelledby="timeline-heading">
          <div class="timeline-top"><h2 id="timeline-heading">타임라인</h2><span id="count"></span></div>

        </nav>
      </section>
    </div>
    <section class="panel explanation" aria-labelledby="step-title">
      <h2 id="step-title"></h2><p id="body"></p>
      <div class="takeaway"><strong>관찰 포인트</strong><p id="takeaway"></p></div>
      <nav class="navigation" aria-label="이전 및 다음 단계"><button class="action" id="prev" type="button">이전 단계</button><button class="action primary" id="next" type="button">다음 단계</button></nav>
    </section>

<script>
const byId = (id) => document.getElementById(id);
const viewport = byId('scene');
const viewWidth = 620;
const viewHeight = 280;
const maxZoom = 3;
const center = { x: viewWidth / 2, y: viewHeight / 2 };
const camera = { x: 0, y: 0, zoom: 1 };
const pointers = new Map();
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));



// Convert from screen pixels to fixed viewport coordinates, accounting for SVG letterboxing.


// A press that starts on a switch and ends without moving toggles that switch.
// Tracked separately from the camera pointers so it also works when the pointer is captured.
let tap = null;
viewport.addEventListener('pointerdown', (event) => {
  const target = event.target.closest?.('[data-input]');
  tap = target && event.button === 0 && pointers.size === 0
    ? { input: target.dataset.input, x: event.clientX, y: event.clientY, id: event.pointerId }
    : null;
});
viewport.addEventListener('pointerup', (event) => {
  if (tap && tap.id === event.pointerId && Math.hypot(event.clientX - tap.x, event.clientY - tap.y) < 8) {
    toggleInput(tap.input);
  }
  tap = null;
});
viewport.addEventListener('pointercancel', () => { tap = null; });

viewport.addEventListener('pointerdown', (event) => {
  if (event.button !== 0 || pointers.size >= 2) return;
  if (event.pointerType !== 'touch' && camera.zoom === 1) return;
  pointers.set(event.pointerId, viewportPoint(event));
  viewport.setPointerCapture(event.pointerId);
});
viewport.addEventListener('pointermove', (event) => {
  if (!pointers.has(event.pointerId)) return;
  const before = pointerGeometry();
  pointers.set(event.pointerId, viewportPoint(event));
  const after = pointerGeometry();
  const pinch = pointers.size === 2;
  if (pinch && (before.distance < 1 || after.distance < 1)) return;
  const zoom = pinch ? camera.zoom * after.distance / before.distance : camera.zoom;
  zoomBetween(zoom, before.point, after.point);
  viewport.classList.toggle('is-dragging', !pinch && camera.zoom > 1);
});
for (const eventName of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  viewport.addEventListener(eventName, (event) => {
    if (pointers.delete(event.pointerId)) viewport.classList.remove('is-dragging');
  });
}



byId('zoom-in').onclick = () => zoomBy(.25);
byId('zoom-out').onclick = () => zoomBy(-.25);
viewport.addEventListener('keydown', (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const directions = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const direction = directions[event.key];
  if (direction && camera.zoom > 1) {
    event.preventDefault();
    setCamera(camera.x + direction[0] * 28 / camera.zoom, camera.y + direction[1] * 28 / camera.zoom, camera.zoom);
  } else if (event.key === '+' || event.key === '=' || event.key === '-') {
    event.preventDefault();
    zoomBy(event.key === '-' ? -.25 : .25);
  } else if (event.key === '0') {
    event.preventDefault();
    resetView();
  }
});
setCamera(0, 0, 1);
// Breadth-first and depth-first search on one small graph. Each search is worked out in advance as a list
// of moves (take a place from the frontier, visit it, add its unvisited neighbours), then played back.
const places = {
  A: [0, 0], B: [4.2, -4.4], C: [4.2, 4.4], D: [8.6, -6.6], E: [8.6, 0], F: [8.6, 6.6], G: [13, -3.4], H: [13, 3.4], I: [17.4, 0],
};
const edges = [['A', 'B'], ['A', 'C'], ['B', 'D'], ['B', 'E'], ['C', 'E'], ['C', 'F'], ['D', 'G'], ['E', 'G'], ['E', 'H'], ['F', 'H'], ['G', 'I'], ['H', 'I']];
const neighbours = (p) => edges.filter((e) => e.includes(p)).map((e) => e[0] === p ? e[1] : e[0]).sort();

// One search, as moves. BFS takes from the front of a queue; DFS from the top of a stack
// (neighbours pushed in reverse so the alphabetically first is explored first).
function plan(kind, goal) {
  const moves = [];
  const parent = { A: null };
  const seen = new Set(['A']);
  const frontier = ['A'];
  let order = 0;
  while (frontier.length) {
    const place = kind === 'bfs' ? frontier.shift() : frontier.pop();
    const added = [];
    const next = kind === 'bfs' ? neighbours(place) : [...neighbours(place)].reverse();
    if (kind === 'dfs' && order && moves.some((m) => m.place === place)) continue;
    for (const n of next) {
      if (kind === 'bfs' ? seen.has(n) : moves.some((m) => m.place === n) || n === place) continue;
      if (kind === 'bfs') seen.add(n);
      parent[n] = parent[n] ?? place;
      if (kind === 'dfs') parent[n] = place;
      frontier.push(n);
      added.push(n);
    }
    moves.push({ place, order: ++order, added, frontier: [...frontier], parent: { ...parent } });
    if (place === goal) break;
  }
  return moves;
}
function pathTo(goal, parent) {
  const path = [];
  for (let p = goal; p; p = parent[p]) path.unshift(p);
  return path;
}

const lesson = [
  {
    label: '너비 우선',
    readingSearch: {"kind": "bfs", "moves": 3},
    example: ["A의 이웃을 큐에 넣음", "먼저 발견한 순서대로 방문", "거리 1인 점부터 탐색"],

const motion = matchMedia('(prefers-reduced-motion: reduce)');
const storageKey = 'traversal-lab:v1:step';
const state = { index: 0, kind: 'bfs', moves: [], pos: 0, auto: false, playing: !motion.matches, wait: 0,
  solved: '', wrong: '', demoPosition: 0, done: {}, user: false, next: 0 };
const progress = lesson.map(() => 0);

const project = (x, y, z = 0) => [14 * (x + y), 7 * (x - y) - z];
const point = (x, y, z) => project(x, y, z).map((value) => +value.toFixed(2)).join(',');
const flat = (u, v, z = 0) => [14 * u, 7 * v - z];
const gridLines = [];
for (let i = -24; i <= 40; i += 2) gridLines.push(`M${point(i, -24, 0)}L${point(i, 40, 0)}M${point(-24, i, 0)}L${point(40, i, 0)}`);
byId('grid').setAttribute('d', gridLines.join(''));

// ---------- Scene ----------
const H = 10, half = .8;
let nodeViews = {}, edgeViews = {};
function buildScene() {
  for (const id of ['casings', 'links', 'nodes', 'packets']) byId(id).replaceChildren();
  nodeViews = {};
  edgeViews = {};
  for (const [a, b] of edges) {
    const d = `M${flat(...places[a], 4).join(' ')}L${flat(...places[b], 4).join(' ')}`;
    svg('path', { class: 'casing', d }, byId('casings'));
    edgeViews[a + b] = svg('path', { class: 'edge', d }, byId('links'));
  }
  Object.entries(places).sort(([, p], [, q]) => p[1] - q[1]).forEach(([name, at]) => {
    const node = svg('g', { class: 'node place', transform: `translate(${flat(...at).join(' ')})` }, byId('nodes'));
    drawShadow(node, half);
    drawBox(node, half, H);
    svg('text', { class: 'place-name', x: 0, y: -H + .5 }, node).textContent = name;
    const badge = svg('g', { class: 'order', transform: `translate(${14 * half + 10} ${-H - 10})` }, node);
    svg('circle', { r: 8.5 }, badge);
    const text = svg('text', {}, badge);
    nodeViews[name] = { node, badge, text };
  });
  const left = -30, right = 14 * 17.4 + 40, top = 7 * -6.6 - 40, bottom = 7 * 6.6 + 30;
  const scale = Math.min(1.7, 590 / (right - left), 268 / (bottom - top));
  const x = 310 - scale * (left + right) / 2, y = 140 - scale * (top + bottom) / 2;
  byId('world').setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${scale.toFixed(3)})`);
}
const edgeOf = (a, b) => edgeViews[a + b] ?? edgeViews[b + a];
// Paint the search after `pos` moves.
function paint() {
  const preview = document.querySelector(motion.matches ? '.workspace.course-reading' : '.workspace.course-reading.course-step-preview') ? lesson[state.index].readingSearch : null;
  const moves = preview ? plan(preview.kind, lesson[state.index].goal).slice(0, preview.moves) : state.moves.slice(0, state.pos);
  const last = moves.at(-1);
  const visited = new Map(moves.map((m) => [m.place, m.order]));
  const frontier = last ? last.frontier : ['A'];
  const depth = {};
  for (const m of moves) depth[m.place] = m.place === 'A' ? 0 : depth[last.parent[m.place]] + 1;
  for (const [name, view] of Object.entries(nodeViews)) {
    const order = visited.get(name);
    view.node.setAttribute('class', 'node place' + (order ? ` visited d${Math.min(depth[name] ?? 0, 4)}` : '') + (frontier.includes(name) && !order ? ' waiting' : '') + (last?.place === name ? ' current' : ''));
    view.badge.style.display = order ? '' : 'none';
    view.text.textContent = order ?? '';
  }
  for (const view of Object.values(edgeViews)) view.setAttribute('class', 'edge');
  for (const m of moves) {
    const from = m.parent[m.place];
    if (from) edgeOf(from, m.place)?.classList.add('tree');
  }
  const goal = lesson[state.index].goal;
  if (goal && visited.has(goal)) {
    const path = pathTo(goal, last.parent);
    for (let i = 1; i < path.length; i++) edgeOf(path[i - 1], path[i])?.classList.add('path');
  }
  // Frontier chips.
  const box = byId('frontier');
  const isQueue = state.kind === 'bfs';
  byId('frontier-name').textContent = isQueue ? '큐 (앞에서 꺼냄)' : '스택 (맨 위에서 꺼냄)';
  const shown = [...new Set(frontier.filter((p) => !visited.has(p)))];
  const list = isQueue ? shown : [...shown].reverse();
  box.replaceChildren(...list.map((p, i) => Object.assign(document.createElement('span'), { className: 'chip' + (i === 0 ? ' next' : ''), textContent: p })));
  if (!list.length) box.append(Object.assign(document.createElement('span'), { className: 'chip empty', textContent: '비어 있음' }));
  byId('visit-order').textContent = moves.map((m) => m.place).join(' → ') || '–';
  // The still picture says which search it is, the order so far and what waits next, in a note at the top.
  byId('example-note')?.remove();
  if (preview) {
    const name = preview.kind === 'bfs' ? '너비 우선 · 큐' : '깊이 우선 · 스택';
    const waiting = preview.kind === 'bfs' ? shownFor(frontier, visited) : [...shownFor(frontier, visited)].reverse();
    const route = goal && visited.has(goal) ? ` · A → ${goal} 경로 선 ${pathTo(goal, last.parent).length - 1}개` : '';
    exampleNote(preview.note ?? `${name}: 방문 ${moves.map((m) => m.place).join(' → ')}${waiting.length ? ` · 다음 ${waiting[0]}` : ''}${route}`);
  }
  byId('step-tick').disabled = state.pos >= state.moves.length && state.moves.length > 0;
  byId('step-all').disabled = state.pos >= state.moves.length && state.moves.length > 0;
}

const shownFor = (frontier, visited) => [...new Set(frontier.filter((p) => !visited.has(p)))];

// ---------- Running ----------
function startSearch(kind) {
  state.kind = kind;
  state.moves = plan(kind, lesson[state.index].goal);
  state.pos = 0;
  state.auto = false;
  syncKinds();
  paint();
}
function stepOnce(user) {
  if (state.pos >= state.moves.length) return;
  const m = state.moves[state.pos++];
  const words = state.kind === 'bfs' ? '큐 앞에서' : '스택 맨 위에서';
  report(`${m.order}번째: ${words} ${m.place}를 꺼내 방문 · ${m.added.length ? `이웃 ${m.added.join(', ')}를 ${state.kind === 'bfs' ? '큐 뒤에' : '스택에'} 넣음` : '새로 넣을 이웃 없음'}`);
  paint();
  if (state.pos >= state.moves.length) finish(user);
}
function finish(user) {
  state.auto = false;
  const goal = lesson[state.index].goal;
  const last = state.moves.at(-1);
  const name = state.kind === 'bfs' ? '너비 우선' : '깊이 우선';
  if (goal) {
    const path = pathTo(goal, last.parent);
    report(`${name}: ${goal}에 닿았습니다. 찾은 길 ${path.join('–')} · 길 ${path.length - 1}개 · 방문 ${state.moves.length}곳`);
  } else report(`${name} 끝: 방문 순서 ${state.moves.map((m) => m.place).join(', ')}`);
  if (user) { state.done[state.kind] = true; afterUser(); }
}
function runAll(user) {
  if (state.pos >= state.moves.length) startSearch(state.kind);
  state.auto = true;
  state.user = user;
  state.next = 0;
  if (motion.matches) { while (state.pos < state.moves.length) stepOnce(user); }
  else kick();
}
byId('step-tick').onclick = () => { takeOver(); if (state.pos >= state.moves.length) startSearch(state.kind); stepOnce(true); };
byId('step-all').onclick = () => { takeOver(); runAll(true); };
byId('restart').onclick = () => { takeOver(); startSearch(state.kind); report('처음부터 다시 시작합니다.'); };
function buildKinds() {
  const row = byId('kind-row');
  row.replaceChildren(Object.assign(document.createElement('span'), { className: 'row-name', textContent: '탐색' }));
  for (const kind of lesson[state.index].kinds) {
    const b = Object.assign(document.createElement('button'), { type: 'button', className: 'action pick', textContent: kind === 'bfs' ? '너비 우선 (BFS)' : '깊이 우선 (DFS)' });
    b.dataset.kind = kind;
    b.addEventListener('click', () => { takeOver(); startSearch(kind); report(`${b.textContent}를 골랐습니다.`); });
    row.append(b);
  }
}
function syncKinds() {
  [...byId('kind-row').querySelectorAll('button')].forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.kind === state.kind)));
}
function report(text) { byId('readout').textContent = text; byId('announcement').textContent = text; }

// ---------- Tasks ----------
const currentTask = () => lesson[state.index].tasks[progress[state.index]];
function syncTask() {
  const tasks = lesson[state.index].tasks;
  const task = currentTask();
  const choices = byId('try-choices');
  choices.replaceChildren();
  byId('try').classList.toggle('solved', Boolean(state.solved) && !task?.ask);
  if (task?.ask) {
    byId('try-text').textContent = task.ask;
    byId('try-result').textContent = state.wrong || (state.solved ? `✓ 맞았습니다. ${state.solved}` : '');
    for (const choice of task.choices) {
      const b = Object.assign(document.createElement('button'), { type: 'button', className: 'action choice-button', textContent: choice });
      b.addEventListener('click', () => answer(choice));
      choices.append(b);
    }
    return;
  }
  byId('try-text').textContent = task ? task.text : (state.solved ? '' : '이 단계의 문제를 모두 풀었습니다. 자유롭게 해 보세요.');
  byId('try-result').textContent = state.solved ? `✓ 맞았습니다. ${state.solved}${progress[state.index] >= tasks.length ? ' · 이 단계의 문제를 모두 풀었습니다.' : ''}` : '';
}
// Only the learner's own runs count, so the demo cannot solve a problem.
function afterUser() {
  const task = currentTask();
  if (task && !task.ask && task.test(state)) { progress[state.index]++; state.solved = task.ok; state.wrong = ''; }
  syncTask();
}
function answer(choice) {
  const task = currentTask();
  if (choice !== task.answer) { state.wrong = `✗ ${choice}이(가) 아닙니다. 다시 골라 보세요.`; syncTask(); return; }
  progress[state.index]++;
  state.wrong = '';
  state.solved = task.why;
  syncTask();
}

// ---------- Frame loop and demo ----------
let frame = null, lastFrame = null;
function kick() { if (frame === null) frame = requestAnimationFrame(tick); }
function tick(now) {
  frame = null;
  const elapsed = lastFrame === null ? 0 : Math.min(now - lastFrame, 80);
  lastFrame = now;
  if (state.auto) {
    state.next -= elapsed;
    if (state.next <= 0) { stepOnce(state.user); state.next = 700; }
  } else if (state.playing) {
    state.wait -= elapsed;
    if (state.wait <= 0) demoTick();
  }
  if (state.auto || state.playing) frame = requestAnimationFrame(tick);
  else lastFrame = null;
}
function takeOver() {
  if (!state.playing) return;
  state.playing = false;
  state.auto = false;
  startSearch(state.kind);
  syncPlayback();
}
function demoTick() {
  document.querySelector('.course-step-preview')?.dispatchEvent(new Event('course-playback-start'));
  const kinds = lesson[state.index].kinds;
  startSearch(kinds[state.demoPosition++ % kinds.length]);
  runAll(false);
  state.wait = state.moves.length * 700 + 2400;
}
function syncPlayback() {
  const reduced = motion.matches;
  if (reduced) state.playing = false;
  if (state.playing) kick();
}

// ---------- Steps and routing ----------
function showStep(index, announce = true) {
  state.index = index;
  state.playing = !motion.matches;
  const s = lesson[index];
  state.solved = '';
  state.wrong = '';
  state.demoPosition = 0;
  state.done = {};
  state.auto = false;
  byId('step-title').textContent = s.title;
  byId('body').textContent = s.body;
  byId('takeaway').textContent = s.takeaway;
  byId('scene-desc').textContent = s.description;
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  stepButtons.forEach((button, i) => {
    if (i === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  try { localStorage.setItem(storageKey, String(index)); } catch {}
  buildScene();
  buildKinds();
  startSearch(s.kinds[0]);
  report('"한 걸음"으로 하나씩, "끝까지"로 한 번에 탐색해 보세요.');
  syncTask();
  state.wait = 800;
  syncPlayback();
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${s.title}`;
}
function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/traversal/${index + 1}`);
  showStep(index);
}
function routeIndex() {
  const match = /^#\/traversal\/(\d+)$/.exec(location.hash);
  const routed = match ? Number(match[1]) - 1 : -1;
  if (routed >= 0 && routed < lesson.length) return routed;
  try {
    const stored = localStorage.getItem(storageKey);
    const index = Number(stored);
    if (stored !== null && Number.isInteger(index) && index >= 0 && index < lesson.length) return index;
  } catch {}
  return 0;
}
const stepButtons = lesson.map(({ label }, index) => {
  const listItem = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  const number = document.createElement('span');
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.addEventListener('click', () => goToStep(index));
  listItem.append(button);
  byId('steps').append(listItem);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
motion.addEventListener('change', () => {
  if (!motion.matches) state.playing = true;
  syncPlayback();
});
window.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});
const initial = routeIndex();
history.replaceState(null, '', `#/traversal/${initial + 1}`);
state.index = -1;
showStep(initial, false);
</script>
</body>
</html>
