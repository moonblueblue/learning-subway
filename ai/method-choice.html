<title>사람이 정한 규칙과 사례로 배운 규칙 · T02</title>
<link rel="stylesheet" href="../shared/reading-lesson.css">
<style>
.rule-text,.rule-heading,.rule-threshold{fill:#142620;font-size:13px;font-weight:700}
.rule-heading{font-size:14px}
.rule-threshold{fill:#0f5852}
.rule-note{fill:#43574f;font-size:11px;font-weight:600}
.rule-axis,.rule-arrow,.rule-evidence{fill:none;stroke:#536b61;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.rule-arrow{stroke:#0f766e;stroke-width:1.8}
.rule-evidence{stroke:#49635a;stroke-dasharray:4 3}
.rule-card{fill:#fcfdfb;stroke:#9aafa3}
.rule-alert-band{fill:#d5efeb}
.rule-boundary{stroke:#0f766e;stroke-width:2.4}
.rule-reading{fill:#263e5c;stroke:#fcfdfb;stroke-width:1.5}
.rule-wait{stroke:#73877c;stroke-dasharray:4 3}
.rule-good{fill:#d5efeb;stroke:#0f766e;stroke-dasharray:none}
.rule-bad{fill:#fae8df;stroke:#aa4e27;stroke-dasharray:none}
.rule-alternate,.course-reading .rule-practice{display:none}
.workspace:not(.course-reading) .rule-alternate{display:inline}
.workspace:not(.course-reading) .rule-primary{display:none}
.workspace:not(.course-reading) .rule-diagram[data-practice-status="correct"] .rule-verdict{display:inline}
.workspace:not(.course-reading) .rule-diagram[data-practice-status="correct"] .rule-practice-record{display:none}
</style>

<body>
<main class="shell">
  <header><p class="eyebrow">AI 공통 본선 · T02</p><h1>사람이 정한 규칙과 사례로 배운 규칙</h1><p>같은 온도를 두 규칙에 줬을 때 왜 다른 경보가 나올까요?</p></header>
  <div class="workspace">
    <div>
      <section class="panel" aria-labelledby="stage-heading">
        <div class="stage-top"><h2 id="stage-heading">두 가지 경보선</h2></div>
        <div class="stage"><svg id="scene" viewBox="0 0 620 280" role="img" aria-labelledby="scene-title scene-desc"><title id="scene-title">사람이 정한 규칙과 사례로 배운 규칙</title><desc id="scene-desc"></desc></svg></div>
        <div class="controls"></div>
        <nav class="timeline" aria-labelledby="timeline-heading">
          <div class="timeline-top"><h2 id="timeline-heading">타임라인</h2><span id="count"></span></div>
          <ol class="steps" id="steps"></ol>
        </nav>
      </section>
      <div class="hands-on">
        <p class="try"><strong>다른 입력으로 확인</strong></p>
        <p id="prompt" class="try"></p>
        <p id="feedback" class="readout" role="status"></p>
        <div id="choices"></div>

      </div>
    </div>
    <section class="panel explanation" aria-labelledby="step-title">
      <h2 id="step-title"></h2><p id="body"></p>
      <div class="takeaway"><strong>관찰 포인트</strong><p id="takeaway"></p></div>
      <nav class="navigation" aria-label="이전 및 다음 단계"><button class="action" id="prev" type="button">이전 단계</button><button class="action primary" id="next" type="button">다음 단계</button></nav>
    </section>
  </div>
  <div class="sr-only" id="announcement" role="status"></div>
</main>
<script>
const lesson = [
  {
    label: '사람이 정한 선',
    title: '담당자가 먼저 80°C 경보선을 정합니다',
    body: '담당자가 온도 눈금에 80°C선을 긋습니다. 선에 닿거나 오른쪽에 있는 값에는 경보를 보냅니다. 온도가 아직 입력되지 않아 이 화면에 설비별 경보는 없습니다.',
    takeaway: '선의 위치와 판정 방향을 사람이 먼저 정했습니다.',
    example: ['담당자의 판단', '80°C선 긋기', '선부터 오른쪽에 경보'],
    readingDiagram: {figure: 'rule-human', staticOnly: true, title: '사람이 정한 선',
      description: '담당자가 80°C선을 고르고, 선 위와 오른쪽을 경보 범위로 지정합니다.'},
    quiz: ['다른 날 A가 79°C라면 80°C선에서 어떤 판정이 나올까요?', '경보 없음', 'A 경보',
      'A 79°C가 80°C선의 왼쪽에 있으므로 경보를 울리지 않습니다.'],
    practice: ['다른 날 A 79°C', '경보 없음', '80°C선 왼쪽'],
  },
  {
    label: '사례로 고른 선',
    title: '어제 두 결과와 맞는 후보선을 고릅니다',
    body: '어제 08:00에 A는 86°C, B는 68°C였습니다. 14:20 현장 점검에서 A는 고장, B는 정상으로 확인됐습니다. 두 후보 중 65°C선은 정상 B에도 경보를 보내고, 85°C선은 고장 A에만 보냅니다.',
    takeaway: '이 예에서는 65°C와 85°C 두 후보만 시험했습니다.',
    example: ['어제 A 고장 · B 정상', '65°C와 85°C 시험', '두 기록에 맞는 85°C 선택'],
    readingDiagram: {figure: 'rule-trials', staticOnly: true, title: '사례로 고른 선',
      description: '어제 확인한 A 86°C 고장과 B 68°C 정상을 두 눈금에 반복합니다. 65°C는 정상 B에도 경보를 보내지만 85°C는 A에만 보냅니다.'},
    quiz: ['시험한 두 후보 가운데 어제 기록을 둘 다 맞힌 선은 어느 쪽일까요?', '85°C선', '65°C선',
      '65°C선은 정상인 B에도 경보를 보냅니다. 85°C선은 고장 A에만 보냅니다.'],
    practice: ['어제 A 86°C · B 68°C', '85°C선 선택', 'B 정상과 일치'],
  },
  {
    label: '오늘 같은 입력',
    title: '오늘 같은 두 온도를 두 규칙에 보냅니다',
    body: '오늘 08:00에 A는 83°C, B는 74°C입니다. A 점은 사람의 80°C선 오른쪽, 사례로 정한 85°C선 왼쪽에 있습니다. B 점은 두 선 모두 왼쪽입니다.',
    takeaway: '사람 규칙은 A에만 경보를 보냅니다. 사례 규칙은 경보를 보내지 않습니다.',
    example: ['오늘 A 83°C · B 74°C', '같은 입력을 두 눈금으로', '80°C는 A 경보 · 85°C는 없음'],
    readingDiagram: {figure: 'rule-new-readings', staticOnly: true, title: '오늘 같은 입력',
      description: '같은 A 83°C와 B 74°C가 두 눈금으로 들어갑니다. A는 두 경보선 사이에 있으므로 80°C 규칙에서만 경보가 납니다. 실제 상태는 비어 있습니다.'},
    quiz: ['다른 날 A가 87°C, B가 74°C라면 어느 규칙이 A 경보를 보낼까요?', '두 규칙 모두', '사람 규칙만',
      'A 87°C는 80°C선과 85°C선 둘 다 오른쪽에 있어 두 규칙이 모두 경보를 보냅니다.'],
    practice: ['다른 날 A 87°C · B 74°C', '두 규칙 모두 A 경보', '두 선의 오른쪽'],
  },
  {
    label: '현장 확인과 대조',
    title: '나중에 확인한 같은 결과로 경보를 대조합니다',
    body: '14:20 현장 점검에서 A 고장과 B 정상을 확인했습니다. 08:00에는 두 결과가 비어 있었습니다. 같은 결과를 두 경보와 대조하면 이 사례에서 80°C선은 A를 찾았고, 85°C선은 A를 놓쳤습니다.',
    takeaway: '어제 사례에 맞았던 선도 오늘 처음 보는 사례에서는 고장을 놓칠 수 있습니다.',
    example: ['08:00 두 규칙의 경보', '14:20 현장 확인', '85°C선이 A 고장을 놓침'],
    readingDiagram: {figure: 'rule-confirmation', staticOnly: true, title: '현장 확인과 대조',
      description: '14:20의 두 확인 결과를 08:00의 경보와 대조합니다. 80°C는 A 경보가 맞았고 85°C는 고장 A를 놓쳤습니다.'},
    quiz: ['14:20에 A가 고장으로 확인됐을 때, 어느 규칙이 이 고장을 놓쳤나요?', '85°C선', '80°C선',
      '85°C선은 A 83°C에 경보를 보내지 않았습니다. 같은 설비에서 나중에 고장이 확인됐습니다.'],
    practice: ['A 83°C · 실제 고장', '85°C선이 놓침', '14:20 확인'],
  },
];

const slug = 'method-choice';
const byId = id => document.getElementById(id);
const state = {index: -1, answers: new Map()};
const feedbackMessages = ['✓ 맞았습니다.', '✗ 다시 생각해 보세요.'];

function ruleText(parent, x, y, value, css = 'rule-text', anchor = 'start') {
  svg('text', {x, y, class: css, 'text-anchor': anchor}, parent).textContent = value;
}

function ruleCard(parent, x, y, width, label, variant = '', detail = '') {
  const height = detail ? 43 : 27;
  const card = svg('g', {}, parent);
  svg('rect', {x, y, width, height, rx: 5, class: 'rule-card ' + variant}, card);
  ruleText(card, x + width / 2, y + (detail ? 17 : 18), label, 'rule-text', 'middle');
  if (detail) ruleText(card, x + width / 2, y + 34, detail, 'rule-note', 'middle');
  return card;
}

function buildRuleFigure(step, index) {
  const template = document.createElement('template');
  template.id = step.readingDiagram.figure;
  const canvas = svg('svg', {viewBox: '0 0 620 280'}, template.content);
  const scene = svg('g', {class: 'rule-diagram'}, canvas);
  const position = value => 159 + (value - 60) * 8.3;
  const ticks = [60, 70, 80, 90];

  function rail(y, threshold) {
    const line = position(threshold);
    svg('rect', {x: line, y: y - 10, width: position(90) - line, height: 20, rx: 2, class: 'rule-alert-band'}, scene);
    svg('path', {d: `M${position(60)} ${y}H${position(90)}`, class: 'rule-axis'}, scene);
    for (const tick of ticks) svg('path', {d: `M${position(tick)} ${y - 4}v8`, class: 'rule-axis'}, scene);
    svg('path', {d: `M${line} ${y - 15}v30`, class: 'rule-boundary'}, scene);
    ruleText(scene, line, y + 24, `${threshold}°C`, 'rule-threshold', 'middle');
    svg('path', {d: `M412 ${y}h14m-4 -4 4 4-4 4`, class: 'rule-arrow'}, scene);
  }

  function reading(parent, y, value, name, label = '') {
    svg('circle', {cx: position(value), cy: y, r: 5.3, class: 'rule-reading'}, parent);
    ruleText(parent, position(value), y - 20, label || `${name} ${value}°C`, 'rule-note', 'middle');
  }

  if (index === 0) {
    ruleCard(scene, 24, 86, 121, '담당자가 정함', 'rule-good');
    rail(136, 80);
    svg('path', {d: `M145 99h${position(80) - 145}v20m-4 -4 4 4 4-4`, class: 'rule-arrow'}, scene);
    ruleCard(scene, 432, 122, 156, '선부터 오른쪽에 경보', 'rule-good');
    const practiceReading = svg('g', {class: 'rule-alternate'}, scene);
    svg('circle', {cx: position(79), cy: 136, r: 5.3, class: 'rule-reading'}, practiceReading);
    svg('path', {d: `M${position(79)} 129l-7 -7`, class: 'rule-axis'}, practiceReading);
    ruleText(practiceReading, position(79) - 9, 119, 'A 79°C', 'rule-note', 'end');
  } else if (index === 1) {
    ruleText(scene, 24, 59, '어제 08:00 측정 → 14:20 확인', 'rule-heading');
    ruleText(scene, 432, 59, '두 후보만 시험', 'rule-heading');
    ruleText(scene, 432, 76, '프로그램이 비교', 'rule-note');
    for (const [row, threshold] of [65, 85].entries()) {
      const y = 110 + row * 71;
      ruleText(scene, 24, y + 4, row ? '후보 2' : '후보 1', 'rule-heading');
      rail(y, threshold);
      reading(scene, y, 86, 'A', 'A 86°C · 고장');
      reading(scene, y, 68, 'B', 'B 68°C · 정상');
      if (row) {
        ruleCard(svg('g', {class: 'rule-primary rule-verdict'}, scene), 432, y - 21, 156, 'A에만 경보', 'rule-good', '2/2 맞음 · 선택');
        ruleCard(svg('g', {class: 'rule-alternate rule-practice-record'}, scene), 432, y - 21, 156, 'A에만 경보', '', '2/2 맞음');
      } else {
        ruleCard(scene, 432, y - 21, 156, 'A·B 모두 경보', 'rule-bad', '1/2 맞음 · 정상 B에 오경보');
      }
    }
  } else {
    const alternate = index === 2;
    const primary = svg('g', {class: alternate ? 'rule-primary' : ''}, scene);
    ruleText(primary, 24, 59, '오늘 08:00 · A 83°C · B 74°C', 'rule-heading');
    if (alternate) ruleText(svg('g', {class: 'rule-alternate'}, scene), 24, 59, '다른 날 08:00 · A 87°C · B 74°C', 'rule-heading');
    svg('path', {d: 'M143 67V170M143 110h12m-4 -4 4 4-4 4M143 170h12m-4 -4 4 4-4 4', class: 'rule-arrow'}, scene);

    for (const [row, threshold] of [80, 85].entries()) {
      const y = 110 + row * 60;
      ruleText(scene, 24, y + 4, row ? '사례 규칙' : '사람 규칙', 'rule-heading');
      rail(y, threshold);
      const currentReading = alternate ? svg('g', {class: 'rule-primary'}, scene) : scene;
      reading(currentReading, y, 83, 'A');
      reading(scene, y, 74, 'B');
      if (alternate) reading(svg('g', {class: 'rule-alternate'}, scene), y, 87, 'A');
      if (alternate) {
        ruleCard(svg('g', {class: 'rule-primary'}, scene), 432, y - 13, 156, row ? '경보 없음' : 'A 경보', row ? '' : 'rule-good');
        ruleCard(svg('g', {class: 'rule-alternate rule-branch'}, scene), 432, y - 13, 156, '', 'rule-wait');
      } else {
        const alert = row ? '경보 없음' : 'A 경보';
        ruleCard(svg('g', {class: 'rule-primary rule-verdict'}, scene), 432, y - 21, 156, alert, row ? 'rule-bad' : 'rule-good',
          row ? 'A 고장을 놓침' : 'A 고장을 찾음');
        ruleCard(svg('g', {class: 'rule-alternate rule-practice-record'}, scene), 432, y - 13, 156, alert);
      }
    }
    if (alternate) {
      ruleText(scene, 432, 208, '실제 상태 · 확인 전', 'rule-note');
      ruleCard(scene, 432, 213, 156, '', 'rule-wait');
    } else {
      ruleCard(scene, 432, 212, 156, 'A 고장 · B 정상', 'rule-good');
      ruleText(scene, 432, 208, '14:20 현장 확인', 'rule-note');
      svg('path', {d: 'M588 225h16V110h-11m4 -4 -4 4 4 4M604 170h-11m4 -4 -4 4 4 4', class: 'rule-evidence'}, scene);
    }
  }

  const ticksY = index === 0 ? 188 : 230;
  for (const tick of ticks) ruleText(scene, position(tick), ticksY, tick === 90 ? '90°C' : String(tick), 'rule-note', 'middle');
  const practice = svg('g', {class: 'rule-practice'}, scene);
  ruleCard(practice, 24, 247, 204, step.practice[0]);
  svg('path', {d: 'M232 260h18m-5 -4 5 4-5 4', class: 'rule-arrow'}, practice);
  ruleCard(practice, 255, 247, 174, '선택 대기', 'rule-wait').classList.add('rule-feedback');
  ruleText(practice, 442, 265, '', 'rule-note rule-reason');
  document.body.append(template);
}

lesson.forEach(buildRuleFigure);

function updateRulePractice() {
  const practice = byId('scene').querySelector('.rule-practice');
  if (!practice || !lesson[state.index]) return;
  const step = lesson[state.index];
  const answer = state.answers.get(state.index);
  const status = answer === undefined ? 'waiting' : answer === step.quiz[1] ? 'correct' : 'retry';
  if (practice.dataset.status === status) return;
  practice.dataset.status = status;
  practice.parentElement.dataset.practiceStatus = status;
  const result = practice.querySelector('.rule-feedback');
  result.querySelector('text').textContent = status === 'correct' ? step.practice[1] : status === 'retry' ? '다시 선택' : '선택 대기';
  result.querySelector('rect').classList.toggle('rule-good', status === 'correct');
  result.querySelector('rect').classList.toggle('rule-bad', status === 'retry');
  practice.querySelector('.rule-reason').textContent = status === 'correct' ? step.practice[2] : '';
  practice.parentElement.querySelectorAll('.rule-branch').forEach(branch => {
    branch.querySelector('text').textContent = status === 'correct' ? 'A 경보' : '';
    branch.querySelector('rect').classList.toggle('rule-good', status === 'correct');
  });
}
const ruleUpdates = new MutationObserver(updateRulePractice);
ruleUpdates.observe(byId('scene'), {childList: true});
ruleUpdates.observe(byId('choices'), {attributes: true, childList: true, subtree: true, attributeFilter: ['aria-pressed']});
</script>
<script src="../shared/reading-lesson.js?v=b4d45e8ddc5bfaac"></script>
