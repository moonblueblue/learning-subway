<body>
<main class="shell">
  <header>
    <p class="eyebrow">5장 운영체제와 네트워크 · 레슨 5.6</p>

    <p class="lead">두 스레드가 같은 값을 동시에 고치면 무슨 일이 생길까요? 두 스레드의 걸음을 직접 섞어 보며 경쟁 상태와 잠금을 확인해 보세요.</p>

<script>
const byId = (id) => document.getElementById(id);
const viewport = byId('scene');
const viewWidth = 620;
const viewHeight = 280;
const maxZoom = 3;
const center = { x: viewWidth / 2, y: viewHeight / 2 };
const camera = { x: 0, y: 0, zoom: 1 };
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));



// Convert from screen pixels to fixed viewport coordinates, accounting for SVG letterboxing.


// A press that starts on a switch and ends without moving toggles that switch.
// Track the press separately so clicking still works after a drag captures the pointer.
let tap = null;
viewport.addEventListener('pointerdown', (event) => {
  const target = event.target.closest?.('[data-input]');
  tap = target && event.button === 0 && event.isPrimary
    ? { input: target.dataset.input, x: event.clientX, y: event.clientY, id: event.pointerId }
    : null;
});
viewport.addEventListener('pointerup', (event) => {
  if (tap && tap.id === event.pointerId && Math.hypot(event.clientX - tap.x, event.clientY - tap.y) < 8) {
    toggleInput(tap.input);
  }
  tap = null;
});
viewport.addEventListener('pointercancel', () => { tap = null; });

enableCameraDrag();



byId('zoom-in').onclick = () => zoomBy(.25);
byId('zoom-out').onclick = () => zoomBy(-.25);
viewport.addEventListener('keydown', (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const directions = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const direction = directions[event.key];
  if (direction && camera.zoom > 1) {
    event.preventDefault();
    setCamera(camera.x + direction[0] * 28 / camera.zoom, camera.y + direction[1] * 28 / camera.zoom, camera.zoom);
  } else if (event.key === '+' || event.key === '=' || event.key === '-') {
    event.preventDefault();
    zoomBy(event.key === '-' ? -.25 : .25);
  } else if (event.key === '0') {
    event.preventDefault();
    resetView();
  }
});
setCamera(0, 0, 1);
// Two threads run `count = count + 1` on one shared memory cell. Each run is three steps: read the cell
// into the thread's register, add 1, write it back. The learner (or the demo) picks which thread steps next.
const program = ['읽기: 레지스터 ← count', '더하기: 레지스터 + 1', '쓰기: count ← 레지스터'];
const lockProgram = ['잠금 얻기', ...program, '잠금 풀기'];
const lesson = [
  {
    label: '차례대로',
    readingRows: [["스레드 1", "읽기 0", "더하기 1", "쓰기 1"], ["이어서 스레드 2", "읽기 1", "더하기 1", "쓰기 2"]],
    example: ["count = 0", "T1이 1 쓴 뒤 T2가 읽음", "두 번 더해 2"],
    title: '한 스레드씩 하면 아무 문제가 없다',
    body: '5.1의 스레드 둘이 같은 변수 count에 1씩 더한다고 해 봅시다. count = count + 1은 CPU에서 읽기, 더하기, 쓰기 세 걸음입니다(3.5). 스레드 1이 세 걸음을 다 마친 뒤 스레드 2가 하면 count는 0 → 1 → 2로 바르게 늘어납니다.',
    takeaway: '스레드 1 세 걸음, 이어서 스레드 2 세 걸음을 하면 count는 2입니다. 아래 기록에 걸음마다 레지스터와 count가 남습니다.',
    description: '가운데에 공유 메모리 칸 count가 있고, 양쪽에 스레드 1과 2가 각자의 레지스터를 들고 서 있습니다. 스레드가 한 걸음 갈 때마다 값이 칸과 레지스터 사이를 오갑니다.',
    lock: false,
    tasks: [
      { text: '스레드 1을 세 번, 그다음 스레드 2를 세 번 진행해 보세요.', test: (s) => s.done[1] && s.done[2] && s.count === 2, ok: 'count = 2. 한 스레드씩 하면 바르게 늘어납니다.' },
      { ask: 'count = count + 1은 CPU에서 몇 걸음일까요?', choices: ['1걸음', '3걸음(읽기, 더하기, 쓰기)'], answer: '3걸음(읽기, 더하기, 쓰기)', why: '메모리 값을 바로 더할 수 없어 레지스터로 읽고, 더하고, 다시 씁니다.' },
    ],
  },
  {
    label: '경쟁 상태',
    readingDiagram: {
      title: "둘 다 0을 읽으면 마지막 쓰기도 1이다",
      description: "둘 다 0을 읽으면 마지막 쓰기도 1이다",
      nodes: [
        ["r1", 91, 124, 116, 54, ["T1 · 시각 1", "0 읽기"], "active"],
        ["r2", 237, 201, 116, 54, ["T2 · 시각 2", "0 읽기"], "active"],
        ["w1", 382, 124, 116, 54, ["T1 · 시각 3", "1 쓰기"], "active"],
        ["w2", 529, 201, 118, 54, ["T2 · 시각 4", "1 쓰기"], "active"],
      ],
      edges: [
        ["r1", "r2", "plain"],
        ["r2", "w1", "plain"],
        ["w1", "w2", "blocked"],
      ],
      labels: [
        [29, 61, "공유 count: 0 → 0 → 1 → 1"],

const motion = matchMedia('(prefers-reduced-motion: reduce)');
function fresh() {

}
const state = { index: 0, ...fresh(), playing: !motion.matches, wait: 0, solved: '', wrong: '', demoPosition: 0 };
const progress = lesson.map(() => 0);

const project = (x, y, z = 0) => [14 * (x + y), 7 * (x - y) - z];
const point = (x, y, z) => project(x, y, z).map((value) => +value.toFixed(2)).join(',');
const flat = (u, v, z = 0) => [14 * u, 7 * v - z];
const mix = (a, b, t) => a + (b - a) * t;
const gridLines = [];
for (let i = -24; i <= 40; i += 2) gridLines.push(`M${point(i, -24, 0)}L${point(i, 40, 0)}M${point(-24, i, 0)}L${point(40, i, 0)}`);
byId('grid').setAttribute('d', gridLines.join(''));
function drawBox(node, h, H, cls) {
  const g = svg('g', { class: 'box ' + cls }, node);
  const faces = {
    left: [[-h, -h, 0], [h, -h, 0], [h, -h, H], [-h, -h, H]],
    right: [[h, -h, 0], [h, h, 0], [h, h, H], [h, -h, H]],
    top: [[-h, -h, H], [h, -h, H], [h, h, H], [-h, h, H]],

  for (const [name, corners] of Object.entries(faces)) svg('polygon', { class: 'face ' + name, points: corners.map((p) => point(...p)).join(' ') }, g);
  return g;
}
function text(parent, x, y, value, cls) { const t = svg('text', { x, y, class: cls }, parent); t.textContent = value; return t; }
const threadU = { 1: 0, 2: 16 };
const cellU = 8;
// A wire runs between the facing edges of a thread and the count cell, never under a box: a finished thread fades,
// and a wire under it would show through its top.
const edgeU = (u, toward) => u + Math.sign(toward - u) * (u === cellU ? 2.9 : 2.5);

// ---------- Scene ----------
function paint() {
  for (const id of ['casings', 'links', 'nodes']) byId(id).replaceChildren();
  const lockOn = lesson[state.index].lock;
  svg('polygon', { class: 'zone', points: [[5, -4], [11, -4], [11, 4], [5, 4]].map(([u, v]) => flat(u, v).join(',')).join(' ') }, byId('casings'));
  text(byId('casings'), 14 * 8, flat(0, 4)[1] + 20, '공유 메모리', 'zone-label');
  for (const t of [1, 2]) {
    const d = `M${flat(edgeU(threadU[t], cellU), 0, 4).join(' ')}L${flat(edgeU(cellU, threadU[t]), 0, 4).join(' ')}`;
    svg('path', { class: 'wire t' + t + (state.last?.t === t ? ' hot' : ''), d }, byId('links'));
  }
  const cell = svg('g', { class: 'node', transform: `translate(${flat(cellU, 0).join(' ')})` }, byId('nodes'));
  drawBox(cell, 1.5, 22, 'cell' + (state.last?.kind === 'write' ? ' hot' : ''));
  text(cell, 0, -22 - 2, state.count, 'cell-value');
  text(cell, 0, 7 * 1.5 + 14, 'count', 'cell-name');
  if (lockOn) {
    const lk = svg('g', { class: 'lock' + (state.owner ? ' held t' + state.owner : ''), transform: `translate(0 ${-22 - 14 * 1.5 - 24})` }, cell);
    svg('rect', { x: -34, y: -11, width: 68, height: 22, rx: 6 }, lk);
    text(lk, 0, 1, state.owner ? `🔒 스레드 ${state.owner}` : '🔓 잠금 열림', 'lock-text');
  }
  for (const t of [1, 2]) {
    const th = state.threads[t];
    const g = svg('g', { class: 'node thread t' + t + (state.done[t] ? ' done' : '') + (state.last?.t === t && state.last.kind === 'wait' ? ' waiting' : ''), transform: `translate(${flat(threadU[t], 0).join(' ')})` }, byId('nodes'));
    drawBox(g, 1.3, 16, 'thread t' + t);
    text(g, 0, -16 - 14 * 1.3 - 30, `스레드 ${t}`, 'thread-name');
    const reg = svg('g', { class: 'reg', transform: `translate(0 ${-16 - 14 * 1.3 - 10})` }, g);
    svg('rect', { x: -40, y: -10, width: 80, height: 20, rx: 6 }, reg);
    text(reg, 0, 1, `레지스터 ${th.reg ?? '–'}`, 'reg-text');
    text(g, 0, 7 * 1.3 + 16, state.done[t] ? '끝' : `다음: ${steps()[th.pc].split(':')[0]}`, 'next-text');
  }
  const left = 14 * -2 - 50, right = 14 * 18 + 50, top = -110, bottom = 60;
  const scale = Math.min(1.5, 590 / (right - left), 268 / (bottom - top));
  byId('world').setAttribute('transform', `translate(${(310 - scale * (left + right) / 2).toFixed(1)} ${(140 - scale * (top + bottom) / 2).toFixed(1)}) scale(${scale.toFixed(3)})`);

}
function floatValue(value, fromU, toU) {
  if (motion.matches) return;
  const g = svg('g', { class: 'mover' }, byId('packets'));
  svg('circle', { class: 'packet-halo', r: 9 }, g);
  svg('circle', { class: 'packet', r: 4.6 }, g);
  text(g, 0, -10, value, 'packet-label');
  const start = performance.now();
  // Placed on the wire at once, so the dot is never drawn at the world's origin before its first frame.
  g.setAttribute('transform', `translate(${flat(edgeU(fromU, toU), 0, 4).join(' ')})`);
  const step = (now) => {
    const k = Math.min((now - start) / 500, 1);
    // The value rides the wire itself, from one edge to the other.
    const [x0, y0] = flat(edgeU(fromU, toU), 0, 4), [x1, y1] = flat(edgeU(toU, fromU), 0, 4);
    g.setAttribute('transform', `translate(${mix(x0, x1, k)} ${mix(y0, y1, k)})`);
    if (k < 1) requestAnimationFrame(step); else g.remove();
  };
  requestAnimationFrame(step);
}
function syncPanels() {

  const table = byId('log');
  table.replaceChildren(Object.assign(document.createElement('caption'), { textContent: '실행 기록 · 걸음 순서대로' }));
  const head = document.createElement('tr');
  for (const h of ['#', '스레드', '한 일', '레지스터', 'count']) head.append(Object.assign(document.createElement('th'), { textContent: h }));
  table.append(head);
  state.log.forEach((e, i) => {
    const tr = document.createElement('tr');
    tr.className = 't' + e.t + (e.kind === 'wait' ? ' waitrow' : '');
    for (const v of [i + 1, `스레드 ${e.t}`, e.what, e.reg ?? '–', e.count]) tr.append(Object.assign(document.createElement('td'), { textContent: v }));
    table.append(tr);
  });
  if (!state.log.length) {
    const tr = document.createElement('tr');
    tr.append(Object.assign(document.createElement('td'), { textContent: '스레드를 한 걸음씩 진행하면 여기에 쌓입니다', colSpan: 5, className: 'empty' }));
    table.append(tr);
  }
  byId('result').textContent = state.done[1] && state.done[2] ? `결과 count = ${state.count} ${state.count === 2 ? '✓ 바름' : '✗ 더한 값 하나를 잃음'}` : `count = ${state.count}`;
  byId('result').className = 'result' + (state.done[1] && state.done[2] ? (state.count === 2 ? ' ok' : ' bad') : '');
}

// ---------- One step of one thread ----------
function stepThread(t, user) {
  const th = state.threads[t];
  if (state.done[t]) return;
  const line = steps()[th.pc];
  let kind = 'step', what = line;
  if (line === '잠금 얻기') {
    if (state.owner && state.owner !== t) {
      state.waited = true;
      kind = 'wait';
      what = `잠금 기다림 (스레드 ${state.owner}가 가짐)`;
      state.log.push({ t, what, kind, reg: th.reg, count: state.count });
      state.last = { t, kind };
      paint();
      report(`스레드 ${t}는 잠금을 얻지 못해 기다립니다. 스레드 ${state.owner}가 풀어야 들어갈 수 있습니다.`);
      if (user) afterUser();
      return;
    }
    state.owner = t;
    what = '잠금 얻음';
  } else if (line.startsWith('읽기')) { th.reg = state.count; kind = 'read'; floatValue(state.count, cellU, threadU[t]); }
  else if (line.startsWith('더하기')) { th.reg += 1; kind = 'add'; }
  else if (line.startsWith('쓰기')) { state.count = th.reg; kind = 'write'; floatValue(th.reg, threadU[t], cellU); }
  else if (line === '잠금 풀기') { state.owner = null; what = '잠금 풂'; }
  th.pc++;
  if (th.pc >= steps().length) state.done[t] = true;
  state.log.push({ t, what, kind, reg: th.reg, count: state.count });
  state.last = { t, kind };
  paint();
  report(`스레드 ${t}: ${what} · 레지스터 ${th.reg ?? '–'}, count ${state.count}`);
  if (user) afterUser();
}
byId('step-1').onclick = () => { takeOver(); stepThread(1, true); };
byId('step-2').onclick = () => { takeOver(); stepThread(2, true); };
byId('reset').onclick = () => { takeOver(); resetAll(); report('처음 상태로 되돌렸습니다.'); };
function resetAll() { Object.assign(state, fresh()); byId('packets').replaceChildren(); paint(); }
function buildControls() {}
function report(text) { byId('readout').textContent = text; byId('announcement').textContent = text; }

// ---------- Tasks ----------
const currentTask = () => lesson[state.index].tasks[progress[state.index]];
function syncTask() {
  const tasks = lesson[state.index].tasks;
  const task = currentTask();
  const choices = byId('try-choices');
  choices.replaceChildren();
  byId('try').classList.toggle('solved', Boolean(state.solved) && !task?.ask);
  if (task?.ask) {
    byId('try-text').textContent = task.ask;
    byId('try-result').textContent = state.wrong || (state.solved ? `✓ 맞았습니다. ${state.solved}` : '');
    for (const choice of task.choices) {
      const b = Object.assign(document.createElement('button'), { type: 'button', className: 'action choice-button', textContent: choice });
      b.addEventListener('click', () => answer(choice));
      choices.append(b);
    }
    return;
  }
  byId('try-text').textContent = task ? task.text : (state.solved ? '' : '이 단계의 문제를 모두 풀었습니다. 자유롭게 해 보세요.');
  byId('try-result').textContent = state.solved ? `✓ 맞았습니다. ${state.solved}${progress[state.index] >= tasks.length ? ' · 이 단계의 문제를 모두 풀었습니다.' : ''}` : '';
}
// Only the learner's own actions count, so the demo cannot solve a problem.
function afterUser() {
  const task = currentTask();
  if (task && !task.ask && task.test(state)) { progress[state.index]++; state.solved = task.ok; state.wrong = ''; }
  syncTask();
}
function answer(choice) {
  const task = currentTask();
  if (choice !== task.answer) { state.wrong = `✗ ${choice}이(가) 아닙니다. 다시 골라 보세요.`; syncTask(); return; }
  progress[state.index]++;
  state.wrong = '';
  state.solved = task.why;
  syncTask();
}

// ---------- Demo ----------
let frame = null, lastFrame = null;
function takeOver() {
  if (!state.playing) return;
  state.playing = false;
  resetAll();
  syncPlayback();
}
// The demo alternates: in plain steps it interleaves reads to show the lost update; with a lock it shows waiting.
const demoOrder = [1, 2, 1, 2, 1, 2, 1, 1, 2, 2, 1, 2];
function demoTick() {
  document.querySelector('.course-step-preview')?.dispatchEvent(new Event('course-playback-start'));
  if (state.done[1] && state.done[2]) { resetAll(); state.wait = 1400; return; }
  const want = lesson[state.index].label === '차례대로' ? (state.done[1] ? 2 : 1) : demoOrder[state.demoPosition++ % demoOrder.length];
  stepThread(state.done[want] ? 3 - want : want, false);
  state.wait = 1300;
}
function tick(now) {
  frame = null;
  const elapsed = lastFrame === null ? 0 : Math.min(now - lastFrame, 80);
  lastFrame = now;
  if (state.playing) {
    state.wait -= elapsed;
    if (state.wait <= 0) demoTick();
    frame = requestAnimationFrame(tick);
  } else lastFrame = null;
}
function syncPlayback() {
  const reduced = motion.matches;
  if (reduced) state.playing = false;
  if (state.playing && frame === null) frame = requestAnimationFrame(tick);
}

  buildControls();
  resetAll();
  report('스레드를 한 걸음씩 진행해 보세요.');
  syncTask();
  state.wait = 900;
  syncPlayback();
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${s.title}`;
}
function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/locks/${index + 1}`);
  showStep(index);
}
const stepButtons = lesson.map(({ label }, index) => {
  const listItem = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  const number = document.createElement('span');
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.addEventListener('click', () => goToStep(index));
  listItem.append(button);
  byId('steps').append(listItem);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
motion.addEventListener('change', () => {
  if (lessonDemoEnabled()) state.playing = true;
  syncPlayback();
});
window.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});
const initial = routeIndex();
history.replaceState(null, '', `#/locks/${initial + 1}`);
state.index = -1;
showStep(initial, false);
</script>
</body>
</html>
