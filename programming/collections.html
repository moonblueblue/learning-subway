const viewport = byId('scene');
const viewWidth = 620;
const viewHeight = 280;
const center = {x: viewWidth / 2, y: viewHeight / 2};
const camera = {x: 0, y: 0, zoom: 1};
const maxZoom = 2.2;
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
document.getElementById('zoom-in').onclick = () => zoomBy(.25);
document.getElementById('zoom-out').onclick = () => zoomBy(-.25);
enableCameraDrag();
viewport.addEventListener('keydown', event => {
  if (event.altKey || event.ctrlKey || event.metaKey) return;
  const pan = {ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1]}[event.key];
  if (pan && camera.zoom > 1) {
    event.preventDefault();
    setCamera(camera.x + pan[0] * 18, camera.y + pan[1] * 18, camera.zoom);
  } else if (event.key === '+' || event.key === '-' || event.key === '0') {
    event.preventDefault();
    if (event.key === '0') resetView();
    else zoomBy(event.key === '+' ? .25 : -.25);
  }
});
setCamera(0, 0, 1);
