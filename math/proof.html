const byId = id => document.getElementById(id);
const viewport = byId('scene');
const viewWidth = 620;
const viewHeight = 280;
const center = {x: viewWidth / 2, y: viewHeight / 2};
const camera = {x: 0, y: 0, zoom: 1};
const maxZoom = 2.2;
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
document.getElementById('zoom-in').onclick = () => zoomBy(.25);
document.getElementById('zoom-out').onclick = () => zoomBy(-.25);
enableCameraDrag();
viewport.addEventListener('keydown', event => {
  if (event.altKey || event.ctrlKey || event.metaKey) return;
  const pan = {ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1]}[event.key];
  if (pan && camera.zoom > 1) {
    event.preventDefault();
    setCamera(camera.x + pan[0] * 18, camera.y + pan[1] * 18, camera.zoom);
  } else if (event.key === '+' || event.key === '-' || event.key === '0') {
    event.preventDefault();
    if (event.key === '0') resetView();
    else zoomBy(event.key === '+' ? .25 : -.25);
  }
});
setCamera(0, 0, 1);

const domWords = [
  '모든 간격: 앞이 넘어지면 다음에 닿는다',
  '이어 감: 앞이 넘어지면 다음도 넘어진다',
  '4번과 5번 사이만 넓다',
];
const dominoText = value => window.courseI18n?.translate(String(value)) ?? String(value);

function drawFigure(index, {hide, changed}) {
  const svgRoot = svg('svg',{x:0,y:25,width:620,height:230,viewBox:'0 0 640 230'},byId('figure'));
  const step = index - 2;
  const widened = step === 2;
  const positions = Array.from({length:8},(_,i)=>40 + 72*i + (widened && i >= 4 ? 40 : 0));
  const defs = svg('defs',{},svgRoot);
  const pattern = svg('pattern',{id:'domino-down',patternUnits:'userSpaceOnUse',width:6,height:6},defs);
  svg('rect',{width:6,height:6,class:'part-segment kind-a'},pattern);
  svg('path',{d:'M-2 2L2 -2M0 6L6 0M4 8L8 4',class:'part-pattern-line'},pattern);

  function text(g,x,y,words,anchor='middle') {
    svg('text',{x,y,'text-anchor':anchor,class:'domino-text'},g).textContent=dominoText(words);
  }
  function arrow(g,x1,x2,y,dashed=false,highlight=false) {
    const color = highlight ? '#0f766e' : '#466457';
    const line = {x1,x2:x2-8,y1:y,y2:y,stroke:color,'stroke-width':highlight ? 3 : 1.5};
    if (dashed) line['stroke-dasharray']='5 3';
    svg('line',line,g);
    svg('path',{d:`M ${x2-8} ${y-4} L ${x2} ${y} L ${x2-8} ${y+4} Z`,fill:color},g);
  }

  for (const [i,x] of positions.entries()) {
    const id = '도미노'+(i+1);
    const fallen = !hide.includes('도미노 기울기') && (step === 1 || (widened && i < 4));
    const attrs = {x:x-7,y:100,width:14,height:80,rx:1,class:fallen?'domino fallen':'domino','data-name':id};
    if (fallen) attrs.transform=`rotate(65 ${x+7} 180)`;
    if (changed.includes(id)) attrs['data-changed']='';
    svg('rect',attrs,svgRoot);
    text(svgRoot,x,202,i+1);
  }
  text(svgRoot,622,202,'…');
  for (let i=0; i<positions.length-1; i++) {
    const id = `간격${i+1}-${i+2}`;
    const disconnected = widened && i === 3;
    const g = svg('g',{'data-name':id},svgRoot);
    arrow(g,positions[i]+12,positions[i+1]-12,92,disconnected,changed.includes(id));
    if (disconnected) text(g,(positions[i]+positions[i+1])/2,112,'닿지 않음');
  }
  const start=svg('g',{'data-name':'시작 화살표'},svgRoot);
  arrow(start,6,26,120,false,true);
  text(start,6,76,step === 0 ? '첫 도미노를 민다' : '시작: 첫 도미노를 민다','start');
  if (!hide.includes('위 글')) text(svgRoot,320,30,domWords[step]);
}
