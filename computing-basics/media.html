const byId = id => document.getElementById(id);
const viewport = byId('scene');
const drawing = byId('figure');
const viewWidth = 620;
const viewHeight = 280;
const center = {x: viewWidth / 2, y: viewHeight / 2};
const camera = {x: 0, y: 0, zoom: 1};
const maxZoom = 2.2;
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

// The picture is 8 × 8 pixels. These three figures keep the old lesson's drawings, values and places (card).
const size = 8;
const heart = [0x00, 0x66, 0xFF, 0xFF, 0xFF, 0x7E, 0x3C, 0x18];
const fromBytes = rows => rows.flatMap(row => Array.from({length: size}, (_, c) => row >> (size - 1 - c) & 1));
const gradient = Array.from({length: size * size}, (_, i) => Math.floor((i % size) / 2));
const shades = {2: ['#22352f', '#e3f6e9'], 4: ['#22352f', '#557366', '#9fc2b0', '#e8f8ee']};
const selectedPixel = 3 * size + 3; // row 4, column 4
const channelNames = ['빨강', '초록', '파랑'];

function text(x, y, value, className = 'figure-caption', anchor = 'start') {
  svg('text', {x, y, class: className, 'text-anchor': anchor}, drawing).textContent = String(value);
}
function wire(d) {
  svg('path', {d, class: 'figure-wire'}, drawing);
}
function grid(image, x, y, cellSize) {
  image.forEach((fill, index) => {
    svg('rect', {x: x + index % size * cellSize, y: y + Math.floor(index / size) * cellSize,
      width: cellSize - 1, height: cellSize - 1, fill, stroke: '#6f8a7b', 'stroke-width': .65}, drawing);
  });
}

function pixelRow() {
  const image = fromBytes(heart);
  grid(image.map(bit => shades[2][bit]), 46, 79, 19);
  text(46, 67, '8 × 8 하트');
  svg('rect', {x: 44, y: 97, width: 155, height: 20, class: 'figure-focus'}, drawing);
  svg('path', {d: 'M200 97 271 146 M200 117 271 181', class: 'figure-zoom'}, drawing);
  text(274, 71, '둘째 줄의 비트');
  image.slice(size, 2 * size).forEach((bit, column) => {
    const x = 274 + column * 40;
    svg('rect', {x, y: 80, width: 34, height: 31, rx: 5, class: 'figure-chip'}, drawing);
    text(x + 17, 102, bit, 'figure-number', 'middle');
    wire(`M${x + 17} 116v27`);
    svg('rect', {x, y: 147, width: 34, height: 34, fill: shades[2][bit], stroke: '#688677'}, drawing);
  });
  text(274, 204, '같은 줄의 픽셀');
  text(397, 204, '0 어두움');
  text(484, 204, '1 밝음');
  text(310, 260, '8 × 8 × 1비트 = 64비트', 'figure-caption', 'middle');
}

function fourShades(hidden, changed) {
  text(46, 67, '8 × 8 픽셀');
  text(278, 67, '픽셀마다 2비트');
  if (hidden) {
    // Before the prediction: the outline of the picture and one dashed box asking how many (card).
    svg('rect', {x: 46, y: 79, width: 151, height: 151, class: 'figure-outline'}, drawing);
    svg('rect', {x: 278, y: 81, width: 288, height: 113, rx: 6, class: 'figure-pending'}, drawing);
    text(422, 143, '몇 가지?', 'figure-caption', 'middle');
    return;
  }
  grid(gradient.map(level => shades[4][level]), 46, 79, 19);
  shades[4].forEach((shade, level) => {
    const x = 278 + level * 78;
    svg('rect', {x, y: 81, width: 54, height: 31, rx: 5, class: 'figure-chip'}, drawing);
    text(x + 27, 103, level.toString(2).padStart(2, '0'), 'figure-number', 'middle');
    wire(`M${x + 27} 116v27`);
    const square = svg('rect', {x, y: 147, width: 54, height: 47, fill: shade, stroke: '#688677'}, drawing);
    if (changed) square.setAttribute('data-changed', '');
  });
  text(278, 217, '어두움');
  text(566, 217, '밝음', 'figure-caption', 'end');
}

function colorPixel(hidden, changed) {
  const cellSize = 11.5, gridX = 375;
  const positions = [96, 190, 284];
  channelNames.forEach((name, channel) => text(positions[channel], 75, name, 'figure-caption', 'middle'));
  [[255, 0, 0], [255, 160, 0]].forEach((color, row) => {
    const y = 106 + 105 * row;
    const gridY = y - cellSize * 3.5;
    svg('rect', {x: 52, y: y - 19, width: 276, height: 38, rx: 7, class: 'figure-chip'}, drawing);
    color.forEach((value, channel) => text(positions[channel], y + 6, value, 'figure-number', 'middle'));
    wire(`M333 ${y}h37`);
    if (row === 1 && hidden) {
      // Before the prediction the lower screen is only an outline with a question mark (card).
      svg('rect', {x: gridX, y: gridY, width: cellSize * size - 1, height: cellSize * size - 1, class: 'figure-outline'}, drawing);
      text(gridX + cellSize * size / 2, y + 6, '?', 'figure-number', 'middle');
      return;
    }
    const image = Array.from({length: size * size}, (_, index) => index === selectedPixel ? `rgb(${color.join(',')})` : shades[2][0]);
    grid(image, gridX, gridY, cellSize);
    const cellX = gridX + selectedPixel % size * cellSize;
    const focus = svg('rect', {x: cellX - 1, y: y - cellSize / 2 - 1, width: cellSize + 1, height: cellSize + 1, class: 'figure-focus'}, drawing);
    if (row === 1 && changed) focus.setAttribute('data-changed', '');
    svg('path', {d: `M${cellX + cellSize + 2} ${y}H473l12 11`, class: 'figure-zoom'}, drawing);
    text(491, y + 17, '4행 4열');
  });
  wire('M190 131v55');
  text(207, 164, '+160', 'figure-compare');
  text(190, 263, '3 × 8비트 = 3바이트', 'figure-caption', 'middle');
}

function drawFigure(index, {hide, changed}) {
  const hidden = hide.includes('answer');
  if (index === 0) pixelRow();
  else if (index === 1) fourShades(hidden, changed.includes('shade-squares'));
  else if (index === 3) colorPixel(hidden, changed.includes('orange-pixel'));
}

byId('zoom-in').onclick = () => zoomBy(.3);
byId('zoom-out').onclick = () => zoomBy(-.3);
enableCameraDrag();

viewport.addEventListener('keydown', event => {
  if (camera.zoom === 1) return;
  const direction = {ArrowLeft: [-1, 0], ArrowUp: [0, -1], ArrowRight: [1, 0], ArrowDown: [0, 1]}[event.key];
  if (!direction) return;
  event.preventDefault();
  setCamera(camera.x + direction[0] * 18, camera.y + direction[1] * 18, camera.zoom);
});

window.addEventListener('keydown', event => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  const zoom = {'+': () => zoomBy(.3), '-': () => zoomBy(-.3), '0': resetView}[event.key];
  if (zoom) {
    event.preventDefault();
    zoom();
  }
});
setCamera(0, 0, 1);
</script>
