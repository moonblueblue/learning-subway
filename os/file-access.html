// Every drawn element joins a group named as on the card, so the frame can highlight or hide it by that name.
// Shapes marked data-edge are the ones whose outline turns teal when their group is highlighted.
function named(parent, name) {
  return svg('g', {'data-name': name}, parent);
}

function words(group, x, y, value, tone, anchor = 'middle') {
  svg('text', {x, y, class: tone, 'text-anchor': anchor}, group).textContent = value;
}

function box(group, x1, y1, x2, y2, tone) {
  svg('rect', {x: x1, y: y1, width: x2 - x1, height: y2 - y1, rx: 8, class: 'fa-box ' + tone, 'data-edge': ''}, group);
}

// Same arrow as in 운영체제는 어떤 일을 할까?: an 8px head, 10px wide.
function arrow(group, x1, y1, x2, y2, reply = false) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const tipLength = 8;
  const inset = (tipLength - 1) / Math.hypot(dx, dy);
  const tone = reply ? 'fa-reply' : '';
  svg('line', {x1, y1, x2: x2 - dx * inset, y2: y2 - dy * inset, class: 'fa-line ' + tone, 'data-edge': ''}, group);
  svg('polygon', {'data-arrowhead': '', 'data-edge': '', points: `${-tipLength},-5 0,0 ${-tipLength},5`, class: 'fa-tip ' + tone,
    transform: `translate(${x2} ${y2}) rotate(${Math.atan2(dy, dx) * 180 / Math.PI})`}, group);
}

// Same sea photo as in 운영체제는 어떤 일을 할까?: a 66×46 picture drawn at the given size.
function picture(group, x, y, size = 1) {
  const image = svg('g', {transform: `translate(${x} ${y}) scale(${size})`}, group);
  svg('rect', {x: -33, y: -23, width: 66, height: 46, rx: 4, fill: '#d9ecfa', stroke: '#638178', 'data-edge': ''}, image);
  svg('circle', {cx: 15, cy: -12, r: 5, fill: '#f4bd67'}, image);
  svg('path', {d: 'M-31 5Q-17 -1 -2 5Q14 1 31 6V18Q31 21 28 21H-28Q-31 21-31 18Z', fill: '#458abe'}, image);
  svg('path', {d: 'M-23 12q8 -4 16 0m11 2q8 -4 16 0', fill: 'none', stroke: '#fff', 'stroke-width': 1.5}, image);
}

function diary(group, y) {
  svg('rect', {x: 491, y: y + 1, width: 18, height: 22, class: 'fa-doc', 'data-edge': ''}, group);
  for (const offset of [7, 12, 17]) {
    svg('line', {x1: 494, y1: y + offset, x2: 506, y2: y + offset, class: 'fa-doc-line'}, group);
  }
}

// The window inside the app: a sea picture, or a dashed slot holding '빈 창', '열지 못함' or the '?' placeholder.
function appWindow(group, y, content) {
  if (content === 'sea') {
    picture(group, 130, y + 12, .42);
    return;
  }
  svg('rect', {x: 98, y: y + 2, width: 64, height: 20, class: 'fa-window', 'data-edge': ''}, group);
  const label = {empty: '빈 창', denied: '열지 못함', unknown: '?'}[content];
  words(group, 130, y + 16, label, content === 'unknown' ? 'fa-text fa-mark' : 'fa-text');
}

function drawRow(index, row, hide) {
  const y = centres[index];
  const part = name => `줄${index + 1} ${name}`;
  const shown = name => !hide.includes(part(name));
  const add = (name, draw) => {
    if (shown(name)) draw(named(drawing, part(name)));
  };
  add('이름', group => words(group, 80, y - 34, row.name, 'fa-row', 'start'));
  add('앱', group => {
    box(group, 80, y - 26, 180, y + 26, 'fa-app');
    words(group, 130, y - 6, '사진 앱', 'fa-name');
  });
  // A hidden window keeps its place as a dashed slot with '?', so the answer does not move it.
  appWindow(named(drawing, part('창')), y, shown('창') ? row.window : 'unknown');
  add('요청1', group => arrow(group, 184, y - 8, 236, y - 8));
  add('운영체제', group => {
    box(group, 240, y - 26, 420, y + 26, 'fa-system');
    words(group, 330, y - 6, '운영체제', 'fa-name');
  });
  add('권한', group => words(group, 330, y + 16, row.permission, 'fa-text'));
  add('저장 장치', group => {
    box(group, 466, y - 26, 606, y + 26, 'fa-storage');
    words(group, 536, y - 6, '저장 장치', 'fa-name');
  });
  add('파일', group => {
    if (row.file === 'sea') picture(group, 500, y + 12, .42);
    else diary(group, y);
    words(group, 520, y + 16, row.file === 'sea' ? '바다.jpg' : '일기.txt', 'fa-text', 'start');
  });
  if (row.result === 'allowed') {
    add('요청2', group => arrow(group, 424, y - 8, 462, y - 8));
    add('반환1', group => arrow(group, 462, y + 10, 424, y + 10, true));
  }
  if (row.result !== 'checking') add('반환2', group => arrow(group, 236, y + 10, 184, y + 10, true));
  if (row.result === 'denied') add('거절', group => words(group, 210, y + 26, '거절', 'fa-deny'));
}

function rowState(index, step) {
  if (index > 0) return {...rows[index], window: 'denied'};
  return step === 0
    ? {...rows[0], permission: '권한 확인 중', result: 'checking', window: 'empty'}
    : {...rows[0], permission: '사진 폴더 읽기 · 허용', result: 'allowed', window: 'sea'};
}

// A highlighted group colours the outline of its edge shapes and its words (frame spec 3.7 rule 2).
// A hidden element is not drawn and leaves its place empty; a hidden window becomes the '?' slot.
function drawFigure(index, {hide = [], changed = []}) {
  drawing.replaceChildren();
  for (let row = 0; row < stepRows[index]; row += 1) drawRow(row, rowState(row, index), hide);
  for (const name of changed) {
    for (const element of drawing.querySelector(`[data-name="${name}"]`)?.querySelectorAll('[data-edge], text') ?? []) {
      element.setAttribute('data-changed', '');
    }
  }
}

byId('zoom-in').onclick = () => zoomBy(.3);
byId('zoom-out').onclick = () => zoomBy(-.3);
enableCameraDrag();

viewport.addEventListener('keydown', event => {
  if (camera.zoom === 1) return;
  const direction = {ArrowLeft: [-1, 0], ArrowUp: [0, -1], ArrowRight: [1, 0], ArrowDown: [0, 1]}[event.key];
  if (!direction) return;
  event.preventDefault();
  setCamera(camera.x + direction[0] * 18, camera.y + direction[1] * 18, camera.zoom);
});

window.addEventListener('keydown', event => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === '+') zoomBy(.3);
  else if (event.key === '-') zoomBy(-.3);
  else if (event.key === '0') resetView();
  else return;
  event.preventDefault();
});
setCamera(0, 0, 1);
</script>
</body>
