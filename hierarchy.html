<body>
<main class="shell">
  <header>
    <p class="eyebrow">3장 컴퓨터를 바닥부터 · 레슨 3.7</p>

const byId = (id) => document.getElementById(id);
const viewport = byId('scene');
const viewWidth = 620;
const viewHeight = 280;
const maxZoom = 3;
const center = { x: viewWidth / 2, y: viewHeight / 2 };
const camera = { x: 0, y: 0, zoom: 1 };
const pointers = new Map();
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

function setCamera(x, y, zoom) {
  camera.zoom = clamp(zoom, 1, maxZoom);
  const width = viewWidth / camera.zoom;
  const height = viewHeight / camera.zoom;
  camera.x = clamp(x, 0, viewWidth - width);
  camera.y = clamp(y, 0, viewHeight - height);
  viewport.setAttribute('viewBox', `${camera.x} ${camera.y} ${width} ${height}`);
  viewport.classList.toggle('is-zoomed', camera.zoom > 1);
  byId('view-scale').textContent = `${Math.round(camera.zoom * 100)}%`;
  byId('zoom-out').setAttribute('aria-disabled', String(camera.zoom === 1));
  byId('zoom-in').setAttribute('aria-disabled', String(camera.zoom === maxZoom));
}

function zoomBetween(nextZoom, from, to = from) {
  const zoom = clamp(nextZoom, 1, maxZoom);
  setCamera(camera.x + from.x / camera.zoom - to.x / zoom,

}

// Convert from screen pixels to fixed viewport coordinates, accounting for SVG letterboxing.
function viewportPoint(event) {
  const rect = viewport.getBoundingClientRect();
  const scale = Math.min(rect.width / viewWidth, rect.height / viewHeight);
  return {
    x: center.x + (event.clientX - rect.left - rect.width / 2) / scale,
    y: center.y + (event.clientY - rect.top - rect.height / 2) / scale,
  };
}

function pointerGeometry() {
  const [a, b] = pointers.values();
  if (!b) return { point: a, distance: 0 };
  return {
    point: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 },
    distance: Math.hypot(a.x - b.x, a.y - b.y),
  };
}

// A press that starts on a switch and ends without moving toggles that switch.
// Tracked separately from the camera pointers so it also works when the pointer is captured.
let tap = null;
viewport.addEventListener('pointerdown', (event) => {
  const target = event.target.closest?.('[data-input]');
  tap = target && event.button === 0 && pointers.size === 0
    ? { input: target.dataset.input, x: event.clientX, y: event.clientY, id: event.pointerId }
    : null;
});
viewport.addEventListener('pointerup', (event) => {
  if (tap && tap.id === event.pointerId && Math.hypot(event.clientX - tap.x, event.clientY - tap.y) < 8) {
    toggleInput(tap.input);
  }
  tap = null;
});
viewport.addEventListener('pointercancel', () => { tap = null; });

viewport.addEventListener('pointerdown', (event) => {
  if (event.button !== 0 || pointers.size >= 2) return;
  if (event.pointerType !== 'touch' && camera.zoom === 1) return;
  pointers.set(event.pointerId, viewportPoint(event));
  viewport.setPointerCapture(event.pointerId);
});
viewport.addEventListener('pointermove', (event) => {
  if (!pointers.has(event.pointerId)) return;
  const before = pointerGeometry();
  pointers.set(event.pointerId, viewportPoint(event));
  const after = pointerGeometry();
  const pinch = pointers.size === 2;
  if (pinch && (before.distance < 1 || after.distance < 1)) return;
  const zoom = pinch ? camera.zoom * after.distance / before.distance : camera.zoom;
  zoomBetween(zoom, before.point, after.point);

});

function zoomBy(delta) {
  if (clamp(camera.zoom + delta, 1, maxZoom) === camera.zoom) return;
  zoomBetween(camera.zoom + delta, center);
  byId('announcement').textContent = `장면 배율 ${Math.round(camera.zoom * 100)}%`;
}

function resetView() {
  pointers.clear();

function drawBox(node, h, H) {

  svg('path', { class: 'highlight', d: `M${point(-h, -h, H)}L${point(h, -h, H)}L${point(h, h, H)}` }, node);
}

function sizePlate(plate) {

  plate.label.setAttribute('x', plate.x);

  Object.entries({ x: plate.x - width / 2, y: plate.y - height / 2, width, height, rx: plate.round ? height / 2 : 6 })

function addPlate(node, className, x, y, text, { pad = 1.4, round = false } = {}) {

  return plate;
}
function setPlate(plate, text) {
  plate.group.classList.toggle('empty', !text);
  if (plate.label.textContent === text) return;
  plate.label.textContent = text;
  sizePlate(plate);
}
matchMedia('(max-width: 600px)').addEventListener('change', () => plates.forEach(sizePlate));

// ---------- Scene ----------
const shownLevels = () => lesson[state.index].mode === 'cache' || lesson[state.index].mode === 'locality'
  ? levels.filter((l) => l.id === 'cache' || l.id === 'ram') : levels;
let views = {};
function buildScene() {
  for (const id of ['casings', 'links', 'nodes', 'packets']) byId(id).replaceChildren();
  plates = [];
  packets = [];
  views = {};
  const list = shownLevels();
  const far = list.at(-1).u;
  const d = 'M' + [[0, 0], [far, 0]].map(([u, v]) => flat(u, v, laneHeight).join(' ')).join('L');
  svg('path', { class: 'casing', d }, byId('casings'));
  svg('path', { class: 'bus', d }, byId('links'));
  // CPU core: the dark chip from 0.5.
  const core = svg('g', { class: 'node core', transform: `translate(${flat(0, 0).join(' ')})` }, byId('nodes'));
  drawShadow(core, 1.2);
  drawBox(core, 1.2, 8);
  const mark = [[-.5, -.5, 8], [.5, -.5, 8], [.5, .5, 8], [-.5, .5, 8]];
  svg('polygon', { points: mark.map((p) => point(...p)).join(' '), fill: '#c9b46b', opacity: .85 }, core);
  addPlate(core, 'tag', 0, 34, 'CPU 코어', { round: true });
  views.core = { node: core };
  for (const level of list) {
    const node = svg('g', { class: `node level ${level.id}`, transform: `translate(${flat(level.u, 0).join(' ')})` }, byId('nodes'));
    drawShadow(node, level.h);
    drawBox(node, level.h, level.H);
    const name = addPlate(node, 'tag level-tag', 0, 14 * level.h + 16, level.name, { round: true });
    const info = addPlate(node, 'tag info', 0, -level.H - 14 * level.h - 10, level.ns, { pad: 1.1 });
    const badge = addPlate(node, 'tag badge', 0, -level.H - 14 * level.h - 32, '', { pad: 1.2 });
    badge.group.classList.add('empty');
    views[level.id] = { node, name, info, badge, level };
  }
  const left = -40, right = 14 * far + 14 * list.at(-1).h * 2 + 60;
  const top = -90, bottom = 70;
  const scale = Math.min(1.9, 590 / (right - left), 268 / (bottom - top));
  const x = 310 - scale * (left + right) / 2, y = 140 - scale * (top + bottom) / 2;
  byId('world').setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${scale.toFixed(3)})`);
}

// ---------- Packets: to a level and back ----------
// A trip is a list of legs [fromU, toU, ms, label]; the packet runs them one after another.
function travel(legs, done) {
  const total = legs.reduce((sum, leg) => sum + leg[2], 0);
  if (motion.matches) { legs.forEach((leg) => leg[4]?.()); done?.(); return; }
  const group = svg('g', { class: 'packet-group' }, byId('packets'));
  svg('circle', { class: 'packet-halo', r: 8.5 }, group);
  svg('circle', { class: 'packet', r: 4.4 }, group);
  const label = svg('text', { class: 'packet-label', y: -10 }, group);
  packets.push({ group, label, legs, start: performance.now(), total, fired: new Set(), done });
  kick();
}
// Callbacks run after the list is updated, so a callback that starts a new trip is not lost.
function movePackets(now) {
  const finished = [];
  packets = packets.filter((packet) => {
    let t = now - packet.start;
    if (t >= packet.total) {
      packet.legs.forEach((leg, i) => { if (!packet.fired.has(i)) leg[4]?.(); });
      packet.group.remove();
      finished.push(packet.done);
      return false;
    }
    let i = 0;
    while (t > packet.legs[i][2]) {
      if (!packet.fired.has(i)) { packet.fired.add(i); packet.legs[i][4]?.(); }
      t -= packet.legs[i][2];
      i++;
    }
    const [from, to, ms, text] = packet.legs[i];
    const [x, y] = flat(mix(from, to, t / ms), 0, laneHeight);
    packet.label.textContent = text;
    packet.group.setAttribute('class', 'packet-group ' + (to < from ? 'back' : 'go'));
    packet.group.setAttribute('transform', `translate(${x} ${y})`);
    return true;
  });
  finished.forEach((done) => done?.());
}
const edge = (id) => levelOf(id).u - levelOf(id).h * 1.6;

function later(ms, fn) {
  if (ms === 0 || motion.matches) { fn(); return; }
  timers.push(setTimeout(fn, ms));
}
function cancelAll() {
  timers.forEach(clearTimeout);
  timers = [];
  packets.forEach((packet) => packet.group.remove());
  packets = [];
  state.busy = false;
}

// ---------- Actions ----------
// Level mode: read once from one level.
function readLevel(id, user) {
  if (state.busy) return;
  state.busy = true;
  const level = levelOf(id);
  state.ns += nsOf[id];
  flash(id, '읽는 중');
  travel([[1.4, edge(id), level.ms, '가지러'], [edge(id), 1.4, level.ms, '값']], () => {
    state.busy = false;
    flash(id, `${level.ns}`);
    report(`${level.name}에서 읽기: ${level.ns} · 클럭 ${level.cycles} · 1클럭이 1초라면 ${level.human}`);
    if (user) afterUser({ read: id });
  });
}

// Cache mode: read one RAM address through the cache. Locality mode caches 4-address lines.
function readAddress(address, user, done, speed = 1) {
  const step = lesson[state.index];
  const lineMode = step.mode === 'locality';
  const key = lineMode ? Math.floor(address / 4) : address;
  const at = state.cache.findIndex((entry) => entry.key === key);
  const cacheMs = 380 * speed, ramMs = 820 * speed;
  const outcome = { hit: 0, miss: 0, evicted: 0 };
  state.busy = true;
  state.lastAddress = address;
  if (at >= 0) {
    const [entry] = state.cache.splice(at, 1);
    state.cache.push(entry);   // most recently used goes to the end
    state.hits++;
    state.ns += 1;
    outcome.hit = 1;
    travel([[1.4, edge('cache'), cacheMs, `${address}번?`, () => flash('cache', '적중 ✓', 'ok')], [edge('cache'), 1.4, cacheMs, String(ramValue(address))]], finish);
  } else {
    state.misses++;
    state.ns += 101;
    outcome.miss = 1;
    travel([
      [1.4, edge('cache'), cacheMs, `${address}번?`, () => flash('cache', '실패 ✗', 'warn')],
      [edge('cache'), edge('ram'), ramMs, `${address}번?`],
      [edge('ram'), edge('cache'), ramMs, lineMode ? `${key * 4}–${key * 4 + 3}번` : String(ramValue(address)), () => {
        if (state.cache.length >= step.slots) { state.cache.shift(); outcome.evicted = 1; }
        state.cache.push({ key });
        flash('ram', '여기서 가져옴', 'ok');
        paintCache();
      }],
      [edge('cache'), 1.4, cacheMs, String(ramValue(address))],
    ], finish);
  }
  function finish() {
    state.busy = false;
    paintCache();
    report(outcome.hit ? `${address}번 칸: 캐시 적중 · 1 ns` : `${address}번 칸: 캐시 실패 → RAM까지 · 약 101 ns${outcome.evicted ? ' · 오래된 값이 밀려남' : ''}`);
    if (user) afterUser({ hit: state.hits, miss: state.misses, evicted: outcome.evicted || state.evictedOnce ? 1 : 0 });
    if (outcome.evicted) state.evictedOnce = true;
    done?.();
  }
  paintCache();
}

// Locality mode: run 16 reads in a pattern, faster than single reads.
function runPattern(kind, user) {
  if (state.busy) return;
  resetCache();
  const addresses = kind === 'seq' ? [...Array(16).keys()] : [...Array(16).keys()].map((k) => (k * 4) % 16 + Math.floor(k / 4) % 4);
  let k = 0;
  const next = () => {
    if (k >= addresses.length) {
      state.busy = false;
      report(`${kind === 'seq' ? '차례로 16칸' : '건너뛰며 16번'}: 적중 ${state.hits}번, 실패 ${state.misses}번 · 걸린 시간 약 ${state.ns} ns`);
      if (user) afterUser({ run: kind });
      state.runs = { ...state.runs, [kind]: { hits: state.hits, misses: state.misses, ns: state.ns } };
      paintCache();
      return;
    }
    readAddress(addresses[k++], false, next, .32);
  };
  next();
}

// Power mode.
function powerOff(user) {
  if (state.busy) return;
  cancelAll();
  for (const id of ['reg', 'cache', 'ram']) state.contents[id] = '비어 있음';
  byId('stage-panel').classList.add('power-off');
  later(500, () => byId('stage-panel').classList.remove('power-off'));
  paintContents();
  report('전원을 껐다 켰습니다. 휘발성 메모리(레지스터, 캐시, RAM)는 비었고 SSD의 파일만 남았습니다.');
  if (user) afterUser({ power: true });
}
function openFile(user) {
  if (state.busy) return;
  state.busy = true;
  const legs = [
    [1.4, edge('ssd'), levelOf('ssd').ms * .6, '파일 열기'],
    [edge('ssd'), edge('ram'), 900, '사진.jpg', () => { state.contents.ram = '사진.jpg 전체'; paintContents(); }],
    [edge('ram'), edge('cache'), 500, '일부', () => { state.contents.cache = '사진 일부'; paintContents(); }],
    [edge('cache'), edge('reg'), 300, '픽셀 몇 개', () => { state.contents.reg = '픽셀 값'; paintContents(); }],
    [edge('reg'), 1.4, 200, '계산'],
  ];
  travel(legs, () => {
    state.contents.ram = '사진.jpg 전체';
    state.contents.cache = '사진 일부';
    state.contents.reg = '픽셀 값';
    state.busy = false;
    paintContents();
    report('파일 열기: SSD의 파일이 RAM으로 올라오고, CPU가 쓰는 부분이 캐시와 레지스터까지 올라왔습니다.');
    if (user) afterUser({ opened: true });
  });
}

// ---------- Painting ----------
function flash(id, text, tone = '') {
  const view = views[id];
  if (!view) return;
  setPlate(view.badge, text);
  view.badge.group.setAttribute('class', `tag badge ${tone}`);
  view.badge.group.classList.toggle('empty', !text);
  view.node.classList.add('busy');
  later(motion.matches ? 0 : 900, () => view.node.classList.remove('busy'));
}
function paintContents() {
  if (lesson[state.index].mode !== 'power') return;
  for (const id of ['reg', 'cache', 'ram', 'ssd']) {
    const text = state.contents[id];
    setPlate(views[id].badge, text);
    views[id].badge.group.setAttribute('class', `tag badge ${text === '비어 있음' ? 'warn' : 'ok'}`);
  }
}
function paintCache() {
  const step = lesson[state.index];
  const panel = byId('cache-view');
  panel.hidden = !(step.mode === 'cache' || step.mode === 'locality');
  if (panel.hidden) return;
  const lineMode = step.mode === 'locality';
  const slots = [...Array(step.slots).keys()].map((k) => state.cache[k]);
  byId('cache-slots').replaceChildren(...slots.map((entry, k) => {
    const li = document.createElement('li');
    li.textContent = entry ? (lineMode ? `${entry.key * 4}–${entry.key * 4 + 3}번` : `${entry.key}번 = ${ramValue(entry.key)}`) : '빈칸';
    li.classList.toggle('empty', !entry);
    li.classList.toggle('newest', Boolean(entry) && k === state.cache.length - 1);
    return li;
  }));
  const rate = state.hits + state.misses ? Math.round(100 * state.hits / (state.hits + state.misses)) : 0;
  byId('cache-stats').textContent = `적중 ${state.hits} · 실패 ${state.misses} · 적중률 ${rate}% · 걸린 시간 약 ${state.ns} ns`;
  if (views.cache) setPlate(views.cache.badge, lineMode ? `라인 ${state.cache.length}/${step.slots}` : `${state.cache.length}/${step.slots}칸`);
}
function report(text) {
  byId('readout').textContent = text;
  byId('announcement').textContent = text;
}
function resetCache() {
  state.cache = [];
  state.hits = 0;
  state.misses = 0;
  state.ns = 0;
  state.evictedOnce = false;
  paintCache();
}

// ---------- Controls ----------
function buildControls() {
  const step = lesson[state.index];
  const box = byId('controls-area');
  box.replaceChildren();
  const button = (text, onClick, primary = false) => {
    const b = Object.assign(document.createElement('button'), { type: 'button', className: 'action' + (primary ? ' primary' : ''), textContent: text });
    b.addEventListener('click', () => { takeOver(); onClick(); });
    box.append(b);
    return b;
  };
  if (step.mode === 'levels') {
    for (const level of levels) button(`${level.name}에서 읽기`, () => readLevel(level.id, true));
    byId('level-table').hidden = false;
  } else byId('level-table').hidden = true;
  if (step.mode === 'cache') {
    for (let a = 0; a < 8; a++) button(`${a}번 읽기`, () => { if (!state.busy) readAddress(a, true); });
    button('캐시 비우기', () => { if (!state.busy) { resetCache(); report('캐시를 비웠습니다.'); } });
  }
  if (step.mode === 'locality') {
    button('차례로 16칸 읽기', () => runPattern('seq', true), true);
    button('건너뛰며 16번 읽기', () => runPattern('stride', true));
  }
  if (step.mode === 'power') {
    button('전원 끄기', () => powerOff(true));
    button('파일 열기', () => openFile(true), true);
  }
}
function buildLevelTable() {
  const table = byId('level-table');
  table.replaceChildren(Object.assign(document.createElement('caption'), { textContent: '층마다 한 번 읽는 데 걸리는 시간' }));
  const head = document.createElement('tr');
  for (const name of ['층', '시간', '클럭', '1클럭이 1초라면', '크기']) head.append(Object.assign(document.createElement('th'), { textContent: name, scope: 'col' }));
  table.append(head);
  for (const level of levels) {
    const tr = document.createElement('tr');
    for (const text of [level.name, level.ns, level.cycles, level.human, level.size]) tr.append(Object.assign(document.createElement('td'), { textContent: text }));
    table.append(tr);
  }
}

// ---------- Tasks ----------
function syncTask() {
  const tasks = lesson[state.index].tasks;
  const done = progress[state.index];
  const allDone = done >= tasks.length;
  byId('try').classList.toggle('solved', state.solved !== '');
  byId('try-text').textContent = state.solved !== '' ? tasks[done - 1].text
    : allDone ? '이 단계의 문제를 모두 풀었습니다. 자유롭게 눌러 보세요.' : tasks[done].text;
  byId('try-result').textContent = state.solved === '' ? '' : `✓ 맞았습니다. ${state.solved}${allDone ? ' · 이 단계의 문제를 모두 풀었습니다.' : ''}`;
}
// Only the learner's own actions count, so the demo cannot solve a problem.
function afterUser(event) {
  const tasks = lesson[state.index].tasks;
  const done = progress[state.index];
  state.solved = '';
  if (done < tasks.length && tasks[done].test(event)) {
    progress[state.index] = done + 1;
    state.solved = tasks[done].ok;
  }
  syncTask();
}

// ---------- Demo ----------
function takeOver() {
  if (!state.playing) return;
  state.playing = false;
  cancelAll();
  syncPlayback();
}
const demos = {
  levels: () => readLevel(levels[state.demoPosition++ % levels.length].id, false),
  cache: () => { if (!state.busy) readAddress([0, 1, 0, 2, 3, 4, 1][state.demoPosition++ % 7], false); },
  locality: () => runPattern(state.demoPosition++ % 2 ? 'stride' : 'seq', false),
  power: () => (state.demoPosition++ % 2 ? openFile(false) : powerOff(false)),
};
function demoTick() {
  if (state.busy) { state.wait = 300; return; }
  demos[lesson[state.index].mode]();
  state.wait = { levels: 5200, cache: 3800, locality: 9000, power: 5200 }[lesson[state.index].mode];
}
function tick(now) {
  frame = null;
  const elapsed = lastFrame === null ? 0 : Math.min(now - lastFrame, 80);
  lastFrame = now;
  if (state.playing) {
    state.wait -= elapsed;
    if (state.wait <= 0) demoTick();
  }
  movePackets(now);
  if (state.playing || packets.length) frame = requestAnimationFrame(tick);
  else lastFrame = null;
}
function kick() {
  if (frame === null) frame = requestAnimationFrame(tick);
}
function syncPlayback() {
  const reduced = motion.matches;
  if (reduced) state.playing = false;
  byId('status').textContent = reduced ? '모션 감소 · 직접 조작' : state.playing ? '자동 실행 중' : '직접 조작';
  byId('pause').textContent = state.playing ? '일시정지' : '자동 실행';
  byId('pause').disabled = reduced;
  byId('replay').disabled = reduced;
  if (state.playing) kick();
}

// ---------- Steps and routing ----------
function startStep() {
  cancelAll();
  state.demoPosition = 0;
  state.contents = { reg: '픽셀 값', cache: '사진 일부', ram: '사진.jpg 전체', ssd: '사진.jpg' };
  state.runs = {};
  buildScene();
  resetCache();
  paintContents();
  byId('readout').textContent = lesson[state.index].mode === 'power' ? '각 층 위에 지금 담긴 내용이 적혀 있습니다.' : '버튼을 눌러 값을 읽어 보세요.';
  state.wait = 900;
}
function showStep(index, announce = true) {
  state.index = index;
  if (!state.userPaused) state.playing = !motion.matches;
  const s = lesson[index];
  byId('step-title').textContent = s.title;
  byId('body').textContent = s.body;
  byId('takeaway').textContent = s.takeaway;
  byId('scene-desc').textContent = s.description;
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  stepButtons.forEach((button, i) => {
    if (i === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  try { localStorage.setItem(storageKey, String(index)); } catch {}
  buildControls();
  startStep();
  state.solved = '';
  syncTask();
  syncPlayback();
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${s.title}`;
}
function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/hierarchy/${index + 1}`);
  showStep(index);
}
function routeIndex() {
  const match = /^#\/hierarchy\/(\d+)$/.exec(location.hash);
  const routed = match ? Number(match[1]) - 1 : -1;
  if (routed >= 0 && routed < lesson.length) return routed;
  try {
    const stored = localStorage.getItem(storageKey);
    const index = Number(stored);
    if (stored !== null && Number.isInteger(index) && index >= 0 && index < lesson.length) return index;
  } catch {}
  return 0;
}
const stepButtons = lesson.map(({ label }, index) => {
  const listItem = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  const number = document.createElement('span');
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.addEventListener('click', () => goToStep(index));
  listItem.append(button);
  byId('steps').append(listItem);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
byId('pause').onclick = () => {
  state.playing = !state.playing;
  state.userPaused = !state.playing;
  if (state.playing) state.wait = 400;
  syncPlayback();
  byId('announcement').textContent = byId('status').textContent;
};
byId('replay').onclick = () => {
  state.playing = true;
  state.userPaused = false;
  startStep();
  syncPlayback();
  byId('announcement').textContent = '처음부터 자동 실행';
};
function syncRoute() {
  const index = routeIndex();
  if (index !== state.index) showStep(index);
}
window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
motion.addEventListener('change', () => {
  if (!motion.matches && !state.userPaused) state.playing = true;
  syncPlayback();
});
window.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});
buildLevelTable();
const initial = routeIndex();
history.replaceState(null, '', `#/hierarchy/${initial + 1}`);
state.index = -1;
showStep(initial, false);
</script>
</body>
</html>
