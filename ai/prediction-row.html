.prediction-card{fill:#fff;stroke:#9aafa3;stroke-width:1.25}
.prediction-card.feature{fill:#d5efeb;stroke:#247c71}
.prediction-card.later{fill:#edf1f7;stroke:#8a9db2}
.prediction-card.problem{fill:#fae8df;stroke:#a15331}
.prediction-card.pending{fill:#f9fbf9;stroke:#73877c;stroke-dasharray:5 4}
.prediction-label,.prediction-detail{fill:#142620;font-size:15px;font-weight:700}
.prediction-detail{fill:#43574f;font-size:13px;font-weight:600}
.prediction-line,.prediction-boundary{fill:none;stroke:#41645a;stroke-width:2;stroke-linecap:round}
.prediction-boundary{stroke:#8c694c;stroke-dasharray:4 4}
.prediction-tip{fill:#41645a}
.prediction-event{fill:#a15331;stroke:#fff;stroke-width:1.5}

body.course-shell .workspace:not(.course-reading) .prediction-practice{display:inline}
.prediction-practice:not([data-correct=true]) .prediction-evidence,
.prediction-practice[data-correct=true] .prediction-waiting-shape{display:none}

<body>
<main class="shell">
  <header><p class="eyebrow">AI 공통 본선 · T06</p><h1>한 행의 단위와 예측 시각 정하기</h1><p>어느 설비의 어느 시점에 대한 한 행을 만들고 정답 창은 어디에 둘까요?</p></header>
  <div class="workspace">
    <div>
      <section class="panel" aria-labelledby="stage-heading">
        <div class="stage-top"><h2 id="stage-heading">관측 기록과 예측 행</h2></div>
        <div class="stage"><svg id="scene" viewBox="0 0 620 280" role="img" aria-labelledby="scene-title scene-desc"><title id="scene-title">한 행의 단위와 예측 시각 정하기</title><desc id="scene-desc"></desc></svg></div>
        <div class="controls"></div>
        <nav class="timeline" aria-labelledby="timeline-heading">
          <div class="timeline-top"><h2 id="timeline-heading">타임라인</h2><span id="count"></span></div>
          <ol class="steps" id="steps"></ol>
        </nav>
      </section>
      <div class="hands-on">
        <p class="try"><strong>다른 입력으로 확인</strong></p>
        <p id="prompt" class="try"></p>
        <p id="feedback" class="readout" role="status"></p>
        <div id="choices"></div>
      </div>
    </div>
    <section class="panel explanation" aria-labelledby="step-title">
      <h2 id="step-title"></h2><p id="body"></p>
      <div class="takeaway"><strong>관찰 포인트</strong><p id="takeaway"></p></div>
      <nav class="navigation" aria-label="이전 및 다음 단계"><button class="action" id="prev" type="button">이전 단계</button><button class="action primary" id="next" type="button">다음 단계</button></nav>
    </section>
  </div>
  <div class="sr-only" id="announcement" role="status"></div>
</main>
<script>
const lesson = [
  {
    label: '예측마다 한 행',
    title: '설비와 예측 시각을 묶어 한 행을 정합니다',
    body: '월요일과 화요일 06:00에 같은 펌프 D가 다음 24시간 안에 고장 날지 각각 예측합니다. 같은 펌프여도 예측 시각이 다르면 다른 행에 기록합니다.',
    takeaway: '각 예측 카드가 자기 행으로 이어집니다. 두 행의 설비는 D로 같고 예측 시각이 다릅니다.',
    example: ['같은 펌프 D', '월·화 06:00 예측', '예측별로 한 행'],
    readingDiagram: {figure: 'prediction-separate-rows', staticOnly: true, title: '예측마다 한 행',
      description: '펌프 D의 월요일 06:00 예측과 화요일 06:00 예측이 각각 별도 행으로 이어집니다.'},
    quiz: ['수요일에 펌프 D를 06:00과 12:00에 예측했습니다. 몇 행으로 기록할까요?',
      '두 행', '한 행', '설비와 날짜가 같아도 06:00과 12:00은 서로 다른 예측입니다. 각각 한 행이 필요합니다.'],
    practiceDescription: '같은 수요일에 펌프 D를 06:00과 12:00에 각각 예측했습니다.',
    result: ['D · 수 06:00', 'D · 수 12:00'],
  },
  {
    label: '예측 때 쓸 기록',
    title: '예측 시각까지 도착한 기록 중 가장 최근 것을 고릅니다',
    body: '온도 기록은 화면에 적힌 시각에 들어왔습니다. 월요일 06:00까지 05:50의 60°C와 05:55의 63°C를 볼 수 있었습니다. 이 모델은 가장 최근 온도인 63°C를 쓰며, 06:05의 65°C는 다음에야 알 수 있습니다.',
    takeaway: '예측 시각 왼쪽에 있는 두 기록 중 06:00과 가까운 05:55의 온도가 특징 칸으로 이어집니다.',
    example: ['05:50 60°C · 05:55 63°C', '06:00까지 가장 최근', '특징 63°C'],
    readingDiagram: {figure: 'prediction-record-cutoff', staticOnly: true, title: '예측 때 쓸 기록',
      description: 'D의 월요일 06:00 예측 이전에 05:50 60°C와 05:55 63°C가 들어왔습니다. 가장 최근인 63°C가 특징이 됩니다. 06:05의 65°C는 예측 뒤에 도착합니다.'},
    quiz: ['수요일 06:00 예측이 시작되기까지 도착한 온도 중 가장 최근 것은 무엇일까요?',
      '64°C', '68°C', '64°C는 06:00에 예측 직전 도착했습니다. 68°C의 기록은 예측이 끝난 뒤인 06:05에 도착했습니다.', '62°C'],
    practiceDescription: '수요일 05:45에 62°C, 06:00에 예측 직전 64°C, 06:05에 68°C가 도착했습니다. 예측 시각은 06:00입니다.',
    result: ['64°C'],
  },
  {
    label: '고장 확인 시간 창',
    title: '24시간 안의 고장만 각 예측의 정답에 넣습니다',
    body: '펌프 D의 첫 고장은 화요일 07:00에 기록됐습니다. 월요일 06:00 예측의 24시간은 화요일 06:00에 끝났습니다. 화요일 06:00 예측의 24시간에는 07:00 고장이 들어갑니다.',
    takeaway: '같은 화요일 07:00 표시가 월요일 예측 창의 오른쪽 밖이며, 화요일 예측 창 안에 있습니다.',
    example: ['화 07:00 첫 고장', '월 창 밖 · 화 창 안', '월 고장 없음 · 화 고장'],
    readingDiagram: {figure: 'prediction-outcome-windows', staticOnly: true, title: '고장 확인 시간 창',
      description: '월요일 06:00부터 화요일 06:00까지 고장이 없습니다. 화요일 07:00의 첫 고장은 화요일 06:00부터 수요일 06:00까지의 창에 들어갑니다.'},
    quiz: ['수요일 06:00에 예측했고 첫 고장이 목요일 07:00에 났습니다. 수요일 행의 정답은 무엇일까요?',
      '고장 없음', '고장', '수요일 예측의 24시간은 목요일 06:00에 끝납니다. 첫 고장은 그보다 한 시간 뒤입니다.'],
    practiceDescription: '수요일 06:00 예측의 24시간 창은 목요일 06:00에 끝납니다. 펌프 D의 첫 고장은 목요일 07:00입니다.',
    result: ['고장 없음'],
  },
  {
    label: '섞인 행 고치기',
    title: '예측을 한 행에 섞으면 입력과 정답이 함께 바뀝니다',
    body: '위 표는 펌프 이름 D만 보고 기록을 합친 예입니다. 화요일의 온도 71°C와 고장이 월요일 예측에 붙었습니다. 아래처럼 설비와 예측 시각을 함께 써서 나누면 월요일 행은 63°C와 ‘고장 없음’으로 돌아옵니다.',
    takeaway: '위의 월요일 행과 아래의 월요일 행을 비교해 보세요. 온도와 고장 여부가 모두 달라집니다.',
    example: ['D만으로 합친 월요일 행', '71°C · 고장', '분리한 월요일 63°C · 고장 없음'],
    readingDiagram: {figure: 'prediction-mixed-row', staticOnly: true, title: '섞인 행 고치기',
      description: '위의 섞인 월요일 행에 화요일 기록 71°C와 고장이 붙어 있습니다. 아래에서 나누면 월요일 행은 63°C와 고장 없음, 화요일 행은 71°C와 고장입니다.'},
    quiz: ['수요일에는 예측 때 64°C였고 첫 고장은 목요일 07:00입니다. 수요일 행을 어떻게 고칠까요?',
      '64°C · 고장 없음', '78°C · 고장', '수요일 행에는 당시의 64°C와 수요일 예측의 24시간 결과를 넣습니다. 78°C와 목요일 고장은 목요일 행에 남습니다.', '64°C · 고장'],
    practiceDescription: '섞인 수요일 행에 목요일의 78°C와 고장이 붙었습니다. 수요일 예측은 64°C였고, 24시간이 끝난 뒤인 목요일 07:00에 처음 고장이 났습니다.',
    result: ['64°C', '고장 없음'],
  },
];

const slug = 'prediction-row';
const byId = id => document.getElementById(id);
const state = {index: -1, answers: new Map()};
const feedbackMessages = ['✓ 맞았습니다.', '✗ 다시 생각해 보세요.'];
const scene = byId('scene');
const workspace = scene.closest('.workspace');

function startCoursePractice() {
  state.answers.clear();
  if (state.index === 0) showStep(0);
  else goToStep(0);
}

function predictionText(parent, x, y, value, detail = false, anchor = 'middle') {
  svg('text', {x, y, class: detail ? 'prediction-detail' : 'prediction-label', 'text-anchor': anchor}, parent).textContent = value;
}

function predictionCard(parent, x, y, width, height, lines, tone = '') {
  const card = svg('g', {}, parent);
  svg('rect', {x, y, width, height, rx: 6, class: 'prediction-card ' + tone}, card);
  for (const [index, line] of lines.entries()) {
    const baseline = y + height / 2 + 5 + (index - (lines.length - 1) / 2) * 17;
    predictionText(card, x + width / 2, baseline, line, index > 0);
  }
  return card;
}

function predictionArrow(parent, x1, y1, x2, y2) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const inset = 7 / Math.hypot(dx, dy);
  svg('line', {x1, y1, x2: x2 - dx * inset, y2: y2 - dy * inset, class: 'prediction-line'}, parent);
  svg('polygon', {points: '-9,-5 0,0 -9,5', 'data-arrowhead': '',
    transform: `translate(${x2} ${y2}) rotate(${Math.atan2(dy, dx) * 180 / Math.PI})`, class: 'prediction-tip'}, parent);
}

function predictionAnswer(parent, x, y, width, height, label, tone, practice) {
  const card = predictionCard(parent, x, y, width, height, [practice ? '' : label], practice ? 'pending' : tone);
  if (practice) {
    card.classList.add('prediction-answer');
    card.dataset.tone = tone;
  }
}

function separateRowsFigure(parent, practice) {
  predictionText(parent, 136, 77, '예측 요청');
  predictionText(parent, 477, 77, '학습 데이터의 행');
  const targets = practice ? svg('g', {class: 'prediction-evidence'}, parent) : parent;
  if (practice) {
    predictionCard(parent, 361, 95, 231, 116, [], 'pending').classList.add('prediction-waiting-shape');
  }
  const rows = practice
    ? [['펌프 D · 수 06:00'], ['펌프 D · 수 12:00']]
    : [['펌프 D · 월 06:00', 'D · 월 06:00'], ['펌프 D · 화 06:00', 'D · 화 06:00']];
  for (const [index, [request, row]] of rows.entries()) {
    const y = 95 + index * 68;
    predictionCard(parent, 28, y, 215, 48, [request]);
    predictionArrow(targets, 248, y + 24, 355, y + 24);
    predictionAnswer(targets, 361, y, 231, 48, row, 'feature', practice);
  }
}

function recordCutoffFigure(parent, practice) {
  const selectedX = practice ? 364 : 263;
  predictionText(parent, 28, 75, practice ? 'D · 수 06:00 예측' : 'D · 월 06:00 예측', false, 'start');
  predictionText(parent, 57, 105, '06:00까지 도착', true, 'start');
  predictionText(parent, 483, 105, '예측 뒤 도착', true, 'start');
  svg('line', {x1: 364, y1: 86, x2: 364, y2: 188, class: 'prediction-boundary'}, parent);
  predictionArrow(parent, 32, 174, 592, 174);
  const events = practice
    ? [[111, '05:45', '62°C'], [selectedX, '06:00', '64°C'], [504, '06:05', '68°C', 'later']]
    : [[111, '05:50', '60°C'], [selectedX, '05:55', '63°C', 'feature'], [504, '06:05', '65°C', 'later']];
  for (const [x, time, value, tone] of events) {
    predictionCard(parent, x - 56, 115, 112, 47, [value, time], tone);
    svg('circle', {cx: x, cy: 174, r: 4, class: 'prediction-tip'}, parent);
  }
  predictionText(parent, 364, 202, '06:00 경계', true);
  const arrowGroup = practice ? svg('g', {class: 'prediction-evidence'}, parent) : parent;
  predictionArrow(arrowGroup, selectedX, practice ? 206 : 181, selectedX, 217);
  predictionText(parent, 64, 244, '선택한 특징', true, 'start');
  predictionAnswer(parent, selectedX - 67, 221, 134, 36, '63°C', 'feature', practice);
}

function outcomeWindowsFigure(parent, practice) {
  const xStart = 65;
  const xMiddle = 316;
  const xEnd = 567;
  const eventX = xMiddle + (xEnd - xMiddle) / 24;
  const ticks = practice ? ['수 06:00', '목 06:00', '금 06:00'] : ['월 06:00', '화 06:00', '수 06:00'];
  predictionText(parent, 28, 72, '펌프 D · 예측 뒤 24시간', false, 'start');
  svg('line', {x1: eventX, y1: 80, x2: eventX, y2: 212, class: 'prediction-boundary'}, parent);
  predictionText(parent, eventX + 14, 85, practice ? '목 07:00 첫 고장' : '화 07:00 첫 고장', false, 'start');
  predictionCard(parent, xStart, 102, xMiddle - xStart, 38, [
    practice ? '수요일 예측 창' : '월요일 예측 창 · 고장 없음',
  ], 'feature');
  if (!practice) {
    predictionCard(parent, xMiddle, 151, xEnd - xMiddle, 38, ['화요일 예측 창 · 고장'], 'feature');
    svg('circle', {cx: eventX, cy: 170, r: 4, class: 'prediction-event'}, parent);
  } else {
    predictionText(parent, 444, 166, '수요일 행의 정답', true);
    predictionAnswer(parent, 366, 174, 156, 34, '', 'feature', true);
  }
  predictionArrow(parent, 36, 218, 591, 218);
  const tickPositions = practice ? [xStart, xMiddle] : [xStart, xMiddle, xEnd];
  for (const [index, x] of tickPositions.entries()) {
    svg('line', {x1: x, y1: 212, x2: x, y2: 225, class: 'prediction-line'}, parent);
    predictionText(parent, x, 246, ticks[index], true);
  }
  svg('circle', {cx: eventX, cy: 218, r: 5, class: 'prediction-event'}, parent);
}

function mixedRowsFigure(parent, practice) {
  const first = practice ? 'D · 수 06:00' : 'D · 월 06:00';
  const second = practice ? 'D · 목 06:00' : 'D · 화 06:00';
  const nextTemperature = practice ? '78°C' : '71°C';
  predictionText(parent, 28, 72, '설비 이름만으로 합친 행', false, 'start');
  predictionText(parent, 124, 97, '설비 · 예측 시각', true);
  predictionText(parent, 310, 97, '특징', true);
  predictionText(parent, 496, 97, '24시간 정답', true);
  predictionCard(parent, 28, 105, 192, 43, [first], 'problem');
  predictionCard(parent, 227, 105, 166, 43, [nextTemperature, practice ? '목요일 기록' : '화요일 기록'], 'problem');
  predictionCard(parent, 400, 105, 192, 43, ['고장', practice ? '목 07:00 고장' : '화 07:00 고장'], 'problem');
  predictionText(parent, 28, 175, '예측별로 분리한 행', false, 'start');
  predictionCard(parent, 28, 184, 192, 36, [first]);
  predictionAnswer(parent, 227, 184, 166, 36, '63°C', 'feature', practice);
  predictionAnswer(parent, 400, 184, 192, 36, '고장 없음', 'feature', practice);
  predictionCard(parent, 28, 228, 192, 36, [second]);
  predictionCard(parent, 227, 228, 166, 36, [nextTemperature], 'feature');
  predictionCard(parent, 400, 228, 192, 36, ['고장'], 'feature');
}

const figures = [separateRowsFigure, recordCutoffFigure, outcomeWindowsFigure, mixedRowsFigure];
lesson.forEach((step, index) => {
  const template = document.createElement('template');
  template.id = step.readingDiagram.figure;
  const canvas = svg('svg', {viewBox: '0 0 620 280'}, template.content);
  const figure = svg('g', {}, canvas);
  figures[index](svg('g', {class: 'prediction-reading'}, figure), false);
  figures[index](svg('g', {class: 'prediction-practice'}, figure), true);
  document.body.append(template);
});

function updatePredictionPractice() {
  const practice = scene.querySelector('.prediction-practice');
  if (!practice || workspace.classList.contains('course-reading')) return;
  const step = lesson[state.index];
  const correct = state.answers.get(state.index) === step.quiz[1];
  if (practice.dataset.correct === String(correct)) return;
  practice.dataset.correct = String(correct);
  for (const [index, card] of [...practice.querySelectorAll('.prediction-answer')].entries()) {
    card.querySelector('text').textContent = correct ? step.result[index] : '';
    card.querySelector('rect').setAttribute('class', 'prediction-card ' + (correct ? card.dataset.tone : 'pending'));
  }
  for (const id of ['course-diagram-desc', 'scene-desc']) {
    const description = byId(id);
    description.textContent = step.practiceDescription;
    if (correct) description.append(' ', step.quiz[3]);
  }
}
const practiceChanges = new MutationObserver(updatePredictionPractice);
practiceChanges.observe(scene, {childList: true});
practiceChanges.observe(workspace, {attributes: true, attributeFilter: ['class']});
practiceChanges.observe(byId('choices'), {childList: true, subtree: true, attributes: true, attributeFilter: ['aria-pressed']});
</script>
<script src="../shared/reading-lesson.js?v=b4d45e8ddc5bfaac"></script>
</body>
