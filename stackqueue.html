<title>스택과 큐 · 레슨 4.3</title>
<style>
:root{color-scheme:light;--ink:#142620;--muted:#43574f;--border:#cbd9d0;--paper:#f4f7ef;--panel:#fff;--accent:#12634b;--request:#187959;--response:#5362a0;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}

.node .face{stroke-width:.8;stroke-linejoin:round}

.node .highlight{fill:none;stroke:#fff;stroke-opacity:.75;stroke-width:1.1;stroke-linecap:round}

<body>
<main class="shell">
  <header>
    <p class="eyebrow">4장 자료구조와 알고리즘 · 레슨 4.3</p>
    <h1>스택과 큐</h1>
    <p class="lead">먼저 넣은 것을 먼저 뺄까요, 나중에 넣은 것을 먼저 뺄까요? 값을 넣고 꺼내며 두 구조의 순서를 비교해 보세요.</p>
  </header>
  <div class="workspace">
    <div>
      <section class="panel" aria-labelledby="stage-heading">
        <div class="stage-top"><h2 id="stage-heading">쌓는 탑과 서는 줄</h2><span class="status" id="status">재생 중</span></div>
        <div class="stage">
          <svg id="scene" viewBox="0 0 620 280" role="img" tabindex="0" aria-labelledby="scene-title scene-desc">
            <title id="scene-title">값이 스택 탑에 쌓이고 큐 줄에 서는 장면</title><desc id="scene-desc"></desc>

              <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
              <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
              <radialGradient id="grid-fade"><stop offset=".45" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
              <mask id="grid-mask"><rect x="-460" y="-260" width="920" height="520" fill="url(#grid-fade)"/></mask>
            </defs>
            <g id="world" aria-hidden="true">

        </div>

          <div class="check-row" id="check-row" hidden>
            <div class="check-inputs" id="check-inputs" role="group" aria-label="검사할 괄호 고르기"></div>
            <div class="check-line"><span class="check-chars" id="check-chars" aria-label="괄호 글자"></span><button class="action primary" id="check-next" type="button">다음 글자</button><span class="check-result" id="check-result" role="status"></span></div>
          </div>

          <output class="view-scale" id="view-scale" aria-label="현재 배율" aria-live="off">100%</output>
          <button class="action" id="zoom-in" type="button" aria-label="장면 확대">+</button>

          <span class="view-hint"><span class="mouse-hint">확대 후 드래그로 이동</span><span class="touch-hint">두 손가락으로 확대</span></span>
        </div>
        <div class="controls">
          <div class="legend" aria-label="범례"><span><i class="dot stackdot"></i>스택에 든 값</span><span><i class="dot queuedot"></i>큐에 든 값</span><span><i class="dot baddot"></i>짝이 틀린 괄호</span></div>
          <div class="actions"><button class="action" id="pause" type="button">일시정지</button><button class="action" id="replay" type="button">다시 보기</button></div>

      <nav class="navigation" aria-label="이전 및 다음 단계"><button class="action" id="prev" type="button">이전 단계</button><button class="action primary" id="next" type="button">다음 단계</button></nav>
    </section>

<script>
const byId = (id) => document.getElementById(id);
const viewport = byId('scene');
const viewWidth = 620;
const viewHeight = 280;
const maxZoom = 3;
const center = { x: viewWidth / 2, y: viewHeight / 2 };
const camera = { x: 0, y: 0, zoom: 1 };
const pointers = new Map();
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

function setCamera(x, y, zoom) {
  camera.zoom = clamp(zoom, 1, maxZoom);
  const width = viewWidth / camera.zoom;
  const height = viewHeight / camera.zoom;
  camera.x = clamp(x, 0, viewWidth - width);
  camera.y = clamp(y, 0, viewHeight - height);
  viewport.setAttribute('viewBox', `${camera.x} ${camera.y} ${width} ${height}`);
  viewport.classList.toggle('is-zoomed', camera.zoom > 1);
  byId('view-scale').textContent = `${Math.round(camera.zoom * 100)}%`;
  byId('zoom-out').setAttribute('aria-disabled', String(camera.zoom === 1));
  byId('zoom-in').setAttribute('aria-disabled', String(camera.zoom === maxZoom));
}

function zoomBetween(nextZoom, from, to = from) {
  const zoom = clamp(nextZoom, 1, maxZoom);
  setCamera(camera.x + from.x / camera.zoom - to.x / zoom,
            camera.y + from.y / camera.zoom - to.y / zoom, zoom);
}

// Convert from screen pixels to fixed viewport coordinates, accounting for SVG letterboxing.
function viewportPoint(event) {
  const rect = viewport.getBoundingClientRect();
  const scale = Math.min(rect.width / viewWidth, rect.height / viewHeight);
  return {
    x: center.x + (event.clientX - rect.left - rect.width / 2) / scale,
    y: center.y + (event.clientY - rect.top - rect.height / 2) / scale,
  };
}

function pointerGeometry() {
  const [a, b] = pointers.values();
  if (!b) return { point: a, distance: 0 };
  return {
    point: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 },
    distance: Math.hypot(a.x - b.x, a.y - b.y),
  };
}

// A press that starts on a switch and ends without moving toggles that switch.
// Tracked separately from the camera pointers so it also works when the pointer is captured.
let tap = null;
viewport.addEventListener('pointerdown', (event) => {
  const target = event.target.closest?.('[data-input]');
  tap = target && event.button === 0 && pointers.size === 0
    ? { input: target.dataset.input, x: event.clientX, y: event.clientY, id: event.pointerId }
    : null;
});
viewport.addEventListener('pointerup', (event) => {
  if (tap && tap.id === event.pointerId && Math.hypot(event.clientX - tap.x, event.clientY - tap.y) < 8) {
    toggleInput(tap.input);
  }
  tap = null;
});
viewport.addEventListener('pointercancel', () => { tap = null; });

viewport.addEventListener('pointerdown', (event) => {
  if (event.button !== 0 || pointers.size >= 2) return;
  if (event.pointerType !== 'touch' && camera.zoom === 1) return;
  pointers.set(event.pointerId, viewportPoint(event));
  viewport.setPointerCapture(event.pointerId);
});
viewport.addEventListener('pointermove', (event) => {
  if (!pointers.has(event.pointerId)) return;
  const before = pointerGeometry();
  pointers.set(event.pointerId, viewportPoint(event));
  const after = pointerGeometry();
  const pinch = pointers.size === 2;
  if (pinch && (before.distance < 1 || after.distance < 1)) return;
  const zoom = pinch ? camera.zoom * after.distance / before.distance : camera.zoom;
  zoomBetween(zoom, before.point, after.point);
  viewport.classList.toggle('is-dragging', !pinch && camera.zoom > 1);
});
for (const eventName of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  viewport.addEventListener(eventName, (event) => {
    if (pointers.delete(event.pointerId)) viewport.classList.remove('is-dragging');
  });
}

function zoomBy(delta) {
  if (clamp(camera.zoom + delta, 1, maxZoom) === camera.zoom) return;
  zoomBetween(camera.zoom + delta, center);
  byId('announcement').textContent = `장면 배율 ${Math.round(camera.zoom * 100)}%`;
}

function resetView() {
  pointers.clear();
  viewport.classList.remove('is-dragging');
  setCamera(0, 0, 1);
  byId('announcement').textContent = '원래 보기로 돌아왔습니다';
}

byId('zoom-in').onclick = () => zoomBy(.25);
byId('zoom-out').onclick = () => zoomBy(-.25);
byId('view-reset').onclick = resetView;
viewport.addEventListener('keydown', (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const directions = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const direction = directions[event.key];
  if (direction && camera.zoom > 1) {
    event.preventDefault();
    setCamera(camera.x + direction[0] * 28 / camera.zoom, camera.y + direction[1] * 28 / camera.zoom, camera.zoom);
  } else if (event.key === '+' || event.key === '=' || event.key === '-') {
    event.preventDefault();
    zoomBy(event.key === '-' ? -.25 : .25);
  } else if (event.key === '0') {
    event.preventDefault();
    resetView();
  }
});
setCamera(0, 0, 1);
// A stack (last in, first out) drawn as a tower and a queue (first in, first out) drawn as a line.
// Steps choose which to show (`show`) and the controls (`mode`): plain push/pop, bracket checking,
// or serving the same arrivals with both.
const brackets = ['( [ ] ( ) )', '( [ ) ]', '{ ( ) [ ( ) ] }'];
const lesson = [
  {
    label: '스택',
    example: ["A, B, C를 쌓음", "꼭대기부터 꺼냄", "C → B → A"],
    title: '스택은 나중에 넣은 것을 먼저 꺼낸다',
    body: '스택은 접시를 쌓듯 값을 위에 올리고(push), 꺼낼 때도 맨 위에서 꺼냅니다(pop). 나중에 들어온 것이 먼저 나가서 LIFO(Last In, First Out)라고 합니다. 1.3의 호출 스택이 바로 이 구조입니다. 맨 위 하나만 다루므로 넣기와 꺼내기 모두 한 번이면 됩니다(O(1)).',
    takeaway: 'A, B, C를 차례로 올리면 C가 맨 위에 있습니다. 꺼내면 C, B, A 순서로 나옵니다. 꺼낸 순서는 장면 오른쪽 위에 쌓입니다.',
    description: '바닥 판 위에 값 상자가 아래부터 쌓이는 탑이 있습니다. 넣으면 맨 위에 하나가 내려앉고, 꺼내면 맨 위 상자가 떠올라 오른쪽 꺼낸 줄로 갑니다.',
    show: ['stack'],
    mode: 'plain',

const motion = matchMedia('(prefers-reduced-motion: reduce)');
const storageKey = 'stackqueue-lab:v1:step';
const maxItems = 6;
const state = { index: 0, stack: [], queue: [], out: [], outQueue: [], next: 0, playing: !motion.matches, userPaused: false,
  wait: 0, busy: false, solved: '', wrong: '', demoPosition: 0, check: null };
const progress = lesson.map(() => 0);

function svg(name, attrs, parent) {
  const element = document.createElementNS('http://www.w3.org/2000/svg', name);
  for (const [key, value] of Object.entries(attrs)) element.setAttribute(key, value);
  if (parent) parent.append(element);
  return element;
}
const project = (x, y, z = 0) => [14 * (x + y), 7 * (x - y) - z];
const point = (x, y, z) => project(x, y, z).map((value) => +value.toFixed(2)).join(',');
const flat = (u, v, z = 0) => [14 * u, 7 * v - z];
const mix = (a, b, t) => a + (b - a) * t;
const gridLines = [];
for (let i = -24; i <= 40; i += 2) gridLines.push(`M${point(i, -24, 0)}L${point(i, 40, 0)}M${point(-24, i, 0)}L${point(40, i, 0)}`);
byId('grid').setAttribute('d', gridLines.join(''));
function drawShadow(node, half) {
  const corners = [[-half + .4, -half - .25], [half + .9, -half - .25], [half + .9, half], [-half + .4, half]];
  svg('polygon', { class: 'shadow', points: corners.map(([x, y]) => point(x, y, 0)).join(' '), filter: 'url(#soft-shadow)' }, node);
}
function drawBox(node, h, H, z0 = 0) {
  const faces = {
    left: [[-h, -h, z0], [h, -h, z0], [h, -h, z0 + H], [-h, -h, z0 + H]],
    right: [[h, -h, z0], [h, h, z0], [h, h, z0 + H], [h, -h, z0 + H]],
    top: [[-h, -h, z0 + H], [h, -h, z0 + H], [h, h, z0 + H], [-h, h, z0 + H]],
  };
  for (const [name, corners] of Object.entries(faces)) svg('polygon', { class: 'face ' + name, points: corners.map((p) => point(...p)).join(' ') }, node);
  svg('path', { class: 'highlight', d: `M${point(-h, -h, z0 + H)}L${point(h, -h, z0 + H)}L${point(h, h, z0 + H)}` }, node);
}
let plates = [];
function sizePlate(plate) {
  const size = parseFloat(getComputedStyle(plate.label).fontSize);
  const width = plate.label.getComputedTextLength() + size * plate.pad;
  const height = size + 8;
  plate.label.setAttribute('x', plate.x);
  plate.label.setAttribute('y', plate.y);
  Object.entries({ x: plate.x - width / 2, y: plate.y - height / 2, width, height, rx: plate.round ? height / 2 : 6 })
    .forEach(([key, value]) => plate.rect.setAttribute(key, value));
}
function addPlate(node, className, x, y, text, { pad = 1.3, round = false } = {}) {
  const group = svg('g', { class: className }, node);
  const plate = { group, rect: svg('rect', {}, group), label: svg('text', {}, group), x, y, pad, round };
  plate.label.textContent = text;
  plates.push(plate);
  sizePlate(plate);
  return plate;
}
function setPlate(plate, text) { plate.label.textContent = text; sizePlate(plate); }
matchMedia('(max-width: 600px)').addEventListener('change', () => plates.forEach(sizePlate));

// ---------- Layout ----------
const show = (name) => lesson[state.index].show.includes(name);
const plateH = 11;                                  // height of one stacked item
const stackBase = () => show('queue') ? [0, 2] : [6, 2];
const stackSpot = (i) => { const [u, v] = stackBase(); return [...flat(u, v), i * (plateH + 1.5)]; };
const queueStart = () => show('stack') ? 8 : 2;
const queueSpot = (i) => [...flat(queueStart() + i * 2.6, 2), 0];
const outSpot = (which, i) => which === 'queue' ? flat(queueStart() + i * 1.7, -6) : flat((show('queue') ? -1 : 9) + i * 1.7, -6.5);

let itemViews = new Map();   // item id -> { node, x, y, z }
function buildScene() {
  for (const id of ['casings', 'links', 'nodes', 'packets']) byId(id).replaceChildren();
  plates = [];
  itemViews = new Map();
  if (show('stack')) {
    const [u, v] = stackBase();
    const base = svg('g', { class: 'node base', transform: `translate(${flat(u, v).join(' ')})` }, byId('casings'));
    drawShadow(base, 1.6);
    drawBox(base, 1.6, 2);
    addPlate(base, 'tag struct-tag', 0, 34, '스택', { round: true });
    if (!show('queue')) svg('text', { class: 'hint', x: 46, y: -30 }, base).textContent = '↓ 넣기 · ↑ 꺼내기 (맨 위만)';
  }
  if (show('queue')) {
    const start = queueStart();
    const lane = [[start - 1.6, 3.5], [start + (maxItems - 1) * 2.6 + 1.6, 3.5], [start + (maxItems - 1) * 2.6 + 1.6, .5], [start - 1.6, .5]];
    svg('polygon', { class: 'lane-floor', points: lane.map(([a, b]) => flat(a, b).join(',')).join(' ') }, byId('casings'));
    const g = svg('g', {}, byId('casings'));
    addPlate(g, 'tag struct-tag', ...flat(start + (maxItems - 1) * 1.3, 6.4), '큐', { round: true });
    addPlate(g, 'tag end-tag', ...flat(start - 2.6, 4.2), '앞 · 나감');
    addPlate(g, 'tag end-tag', ...flat(start + (maxItems - 1) * 2.6 + 2.8, 4.2), '뒤 · 들어옴');
  }
  const right = 14 * (show('queue') ? queueStart() + (maxItems - 1) * 2.6 + 5 : 13) + 20;
  const left = 14 * (show('stack') ? (show('queue') ? -4 : 2.5) : -1) - 20;
  const top = -(maxItems * (plateH + 1.5)) - 70, bottom = 70;
  const scale = Math.min(1.6, 590 / (right - left), 268 / (bottom - top));
  const x = 310 - scale * (left + right) / 2, y = 140 - scale * (top + bottom) / 2;
  byId('world').setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${scale.toFixed(3)})`);
}
function makeItem(id, label, kind) {
  const node = svg('g', { class: `node item ${kind}` }, byId('nodes'));
  const body = svg('g', {}, node);
  drawShadow(body, .9);
  drawBox(body, .9, plateH);
  svg('text', { class: 'item-label', x: 0, y: -plateH + .5 }, body).textContent = label;
  // A second label on the front face, so letters stay readable when items are stacked.
  svg('text', { class: 'item-side', x: -14 * .9 + 1, y: 7 * .9 - plateH / 2 + 1 }, body).textContent = label;
  const view = { node, body, x: 0, y: 0, z: 0 };
  itemViews.set(id, view);
  return view;
}
function place(view, x, y, z) {
  Object.assign(view, { x, y, z });
  view.node.setAttribute('transform', `translate(${x} ${y - z})`);
}
// Move an item along a short arc; with reduced motion it jumps.
function moveItem(view, to, ms, done) {
  if (motion.matches) { place(view, ...to); done?.(); return; }
  const from = [view.x, view.y, view.z];
  const start = performance.now();
  const step = (now) => {
    const t = Math.min((now - start) / ms, 1);
    const e = t * t * (3 - 2 * t);
    const lift = Math.sin(Math.PI * t) * 26;
    place(view, mix(from[0], to[0], e), mix(from[1], to[1], e), mix(from[2], to[2], e) + lift);
    if (t < 1) requestAnimationFrame(step); else { place(view, ...to); done?.(); }
  };
  requestAnimationFrame(step);
}
// Keep drawing order right: lower stack items first, then queue items left to right.
function restack() {
  const order = [...state.stack.map((it) => it.id), ...state.queue.map((it) => it.id)];
  for (const id of order) { const v = itemViews.get(id); if (v) byId('nodes').append(v.node); }
}

// ---------- Operations ----------
let uid = 0;
const nextLabel = () => String.fromCharCode(65 + (state.next++ % 26));
function push(label = nextLabel(), done) {
  if (state.stack.length >= maxItems) { report('스택이 가득 찼습니다(이 장면에서는 6개까지).'); done?.(); return; }
  const item = { id: 'i' + uid++, label };
  state.stack.push(item);
  const view = makeItem(item.id, label, 'stack-item');
  const [x, y] = stackSpot(state.stack.length - 1);
  place(view, x, y, (state.stack.length - 1) * (plateH + 1.5) + 70);
  restack();
  moveItem(view, stackSpot(state.stack.length - 1), 420, done);
  report(`넣기(push): ${label} 값을 맨 위에 올림 · 스택 [${state.stack.map((it) => it.label).join(', ')}]`);
}
function pop(done) {
  const item = state.stack.pop();
  if (!item) { report('스택이 비어 있어 꺼낼 것이 없습니다.'); done?.(null); return; }
  state.out.push(item);
  const view = itemViews.get(item.id);
  restack();
  moveItem(view, [view.x, view.y, view.z + 70], 480, () => { view.node.remove(); syncOut(); done?.(item); });
  report(`꺼내기(pop): 맨 위의 ${item.label} 값을 꺼냄 · 스택 [${state.stack.map((it) => it.label).join(', ')}]`);
}
function enqueue(label = nextLabel(), done) {
  if (state.queue.length >= maxItems) { report('줄이 가득 찼습니다(이 장면에서는 6개까지).'); done?.(); return; }
  const item = { id: 'i' + uid++, label };
  state.queue.push(item);
  const view = makeItem(item.id, label, 'queue-item');
  const [x, y] = queueSpot(maxItems + 1);
  place(view, x, y, 0);
  restack();
  moveItem(view, queueSpot(state.queue.length - 1), 480, done);
  report(`넣기(enqueue): ${label} 값이 줄 맨 뒤에 섬 · 큐 [${state.queue.map((it) => it.label).join(', ')}]`);
}
function dequeue(done) {
  const item = state.queue.shift();
  if (!item) { report('큐가 비어 있어 꺼낼 것이 없습니다.'); done?.(null); return; }
  state.outQueue.push(item);
  restack();
  const gone = itemViews.get(item.id);
  moveItem(gone, [gone.x - 40, gone.y + 20, 0], 480, () => { gone.node.remove(); syncOut(); done?.(item); });
  state.queue.forEach((it, i) => moveItem(itemViews.get(it.id), queueSpot(i), 380));
  report(`꺼내기(dequeue): 맨 앞의 ${item.label} 값이 나감 · 큐 [${state.queue.map((it) => it.label).join(', ')}]`);
}

// Bracket checking, one character per press.
const pairs = { ')': '(', ']': '[', '}': '{' };
function startCheck(input) {
  resetAll();
  state.check = { input, chars: brackets[input].split(' '), pos: 0, done: false, ok: null, message: '' };
  syncCheck();
}
function checkNext(user) {
  const c = state.check;
  if (!c || c.done || state.busy) return;
  const ch = c.chars[c.pos];
  state.busy = true;
  const finish = (message, ok = null) => {
    c.pos++;
    if (ok === false || c.pos >= c.chars.length) {
      c.done = true;
      c.ok = ok === false ? false : state.stack.length === 0;
      c.message = ok === false ? message : c.ok ? '끝까지 읽었고 스택이 비었습니다. 짝이 모두 맞습니다.' : '끝까지 읽었는데 스택에 여는 괄호가 남았습니다. 짝이 틀립니다.';
    } else c.message = message;
    state.busy = false;
    syncCheck();
    report(c.message);
    if (user) afterUser();
  };
  if (pairs[ch] === undefined) push(ch, () => finish(`"${ch}"는 여는 괄호라 스택에 넣었습니다.`));
  else {
    const top = state.stack.at(-1);
    if (!top) { finish(`"${ch}"를 닫으려는데 스택이 비었습니다. 짝이 틀립니다.`, false); return; }
    pop((item) => {
      if (item.label === pairs[ch]) finish(`"${ch}"를 만나 맨 위 "${item.label}"를 꺼냈습니다. 짝이 맞습니다.`);
      else { itemViews.get(item.id)?.node.classList.add('bad'); finish(`"${ch}"를 만났는데 맨 위는 "${item.label}"입니다. 짝이 틀립니다.`, false); }
    });
  }
}
function syncCheck() {
  const box = byId('check-row');
  box.hidden = lesson[state.index].mode !== 'brackets';
  if (box.hidden || !state.check) return;
  const c = state.check;
  byId('check-chars').replaceChildren(...c.chars.map((ch, i) => Object.assign(document.createElement('span'), {
    className: 'ch' + (i < c.pos ? ' read' : '') + (i === c.pos && !c.done ? ' next' : ''), textContent: ch })));
  byId('check-result').textContent = c.done ? (c.ok ? '✓ 짝이 맞음' : '✗ 짝이 틀림') : `스택 [${state.stack.map((it) => it.label).join(' ')}]`;
  byId('check-result').className = 'check-result' + (c.done ? (c.ok ? ' ok' : ' bad') : '');
  [...byId('check-inputs').children].forEach((b, i) => b.setAttribute('aria-pressed', String(i === c.input)));
  byId('check-next').disabled = c.done;
}

// ---------- Controls ----------
function buildControls() {
  const mode = lesson[state.index].mode;
  const box = byId('ops');
  box.replaceChildren();
  const button = (text, onClick, primary) => {
    const b = Object.assign(document.createElement('button'), { type: 'button', className: 'action' + (primary ? ' primary' : ''), textContent: text });
    b.addEventListener('click', () => { takeOver(); if (!state.busy) onClick(); });
    box.append(b);
    return b;
  };
  const guard = (fn) => () => { state.busy = true; fn(() => { state.busy = false; afterUser(); }); };
  if (mode === 'plain' && show('stack')) { button('넣기 (push)', guard((d) => push(undefined, d)), true); button('꺼내기 (pop)', guard((d) => pop(d))); }
  if (mode === 'plain' && show('queue')) { button('넣기 (enqueue)', guard((d) => enqueue(undefined, d)), true); button('꺼내기 (dequeue)', guard((d) => dequeue(d))); }
  if (mode === 'both') {
    button('도착 (둘 다 넣기)', guard((d) => { const label = nextLabel(); push(label); enqueue(label, d); }), true);
    button('처리 (둘 다 꺼내기)', guard((d) => { pop(); dequeue(d); }));
  }
  if (mode !== 'brackets') button('비우기', () => { resetAll(); report('모두 비웠습니다.'); });
  const inputs = byId('check-inputs');
  inputs.replaceChildren(...brackets.map((text, i) => {
    const b = Object.assign(document.createElement('button'), { type: 'button', className: 'action mono', textContent: text });
    b.addEventListener('click', () => { takeOver(); if (!state.busy) { startCheck(i); report(`"${text}" 검사를 시작합니다. "다음 글자"를 누르세요.`); } });
    return b;
  }));
}
byId('check-next').onclick = () => { takeOver(); checkNext(true); };
function syncOut() {
  const line = (items) => items.length ? items.map((it) => it.label).join(' ') : '–';
  byId('out-stack').hidden = !show('stack') || lesson[state.index].mode === 'brackets';
  byId('out-queue').hidden = !show('queue');
  byId('out-stack').querySelector('b').textContent = line(state.out);
  byId('out-queue').querySelector('b').textContent = line(state.outQueue);
}
function resetAll() {
  state.stack = [];
  state.queue = [];
  state.out = [];
  state.outQueue = [];
  state.next = 0;
  state.check = null;
  state.busy = false;
  buildScene();
  syncCheck();
  syncOut();
}
function report(text) { byId('readout').textContent = text; byId('announcement').textContent = text; }

// ---------- Tasks ----------
const currentTask = () => lesson[state.index].tasks[progress[state.index]];
function syncTask() {
  const tasks = lesson[state.index].tasks;
  const task = currentTask();
  const choices = byId('try-choices');
  choices.replaceChildren();
  byId('try').classList.toggle('solved', Boolean(state.solved) && !task?.ask);
  if (task?.ask) {
    byId('try-text').textContent = task.ask;
    byId('try-result').textContent = state.wrong || (state.solved ? `✓ 맞았습니다. ${state.solved}` : '');
    for (const choice of task.choices) {
      const b = Object.assign(document.createElement('button'), { type: 'button', className: 'action choice-button', textContent: choice });
      b.addEventListener('click', () => answer(choice));
      choices.append(b);
    }
    return;
  }
  byId('try-text').textContent = task ? task.text : (state.solved ? '' : '이 단계의 문제를 모두 풀었습니다. 자유롭게 해 보세요.');
  byId('try-result').textContent = state.solved ? `✓ 맞았습니다. ${state.solved}${progress[state.index] >= tasks.length ? ' · 이 단계의 문제를 모두 풀었습니다.' : ''}` : '';
}
// Only the learner's own actions count, so the demo cannot solve a problem.
function afterUser() {
  const task = currentTask();
  if (task && !task.ask && task.test(state)) { progress[state.index]++; state.solved = task.ok; state.wrong = ''; }
  else if (!task?.ask) state.solved = '';
  syncTask();
}
function answer(choice) {
  const task = currentTask();
  if (choice !== task.answer) { state.wrong = `✗ ${choice}이(가) 아닙니다. 다시 골라 보세요.`; syncTask(); return; }
  progress[state.index]++;
  state.wrong = '';
  state.solved = task.why;
  syncTask();
}

// ---------- Demo ----------
let frame = null, lastFrame = null;
function takeOver() {
  if (!state.playing) return;
  state.playing = false;
  resetAll();
  if (lesson[state.index].mode === 'brackets') startCheck(0);
  syncPlayback();
}
function demoTick() {
  if (state.busy) { state.wait = 300; return; }
  const mode = lesson[state.index].mode;
  const p = state.demoPosition++;
  if (mode === 'brackets') {
    if (!state.check || state.check.done) { startCheck(p % 2 ? 1 : 0); state.wait = 1200; return; }
    checkNext(false);
    state.wait = state.check.done ? 2600 : 1000;
    return;
  }
  const cycle = p % 8;
  if (cycle === 0 && p) resetAll();
  const free = (fn) => { state.busy = true; fn(() => { state.busy = false; }); };
  if (mode === 'both') { if (cycle < 4) free((d) => { const l = nextLabel(); push(l); enqueue(l, d); }); else free((d) => { pop(); dequeue(d); }); }
  else if (show('stack')) { if (cycle < 4) free((d) => push(undefined, d)); else free((d) => pop(d)); }
  else { if (cycle < 4) free((d) => enqueue(undefined, d)); else free((d) => dequeue(d)); }
  state.wait = cycle === 7 ? 2600 : 1100;
}
function tick(now) {
  frame = null;
  const elapsed = lastFrame === null ? 0 : Math.min(now - lastFrame, 80);
  lastFrame = now;
  if (state.playing) {
    state.wait -= elapsed;
    if (state.wait <= 0) demoTick();
    frame = requestAnimationFrame(tick);
  } else lastFrame = null;
}
function syncPlayback() {
  const reduced = motion.matches;
  if (reduced) state.playing = false;
  byId('status').textContent = reduced ? '모션 감소 · 직접 조작' : state.playing ? '자동 실행 중' : '직접 조작';
  byId('pause').textContent = state.playing ? '일시정지' : '자동 실행';
  byId('pause').disabled = reduced;
  byId('replay').disabled = reduced;
  if (state.playing && frame === null) frame = requestAnimationFrame(tick);
}

// ---------- Steps and routing ----------
function showStep(index, announce = true) {
  state.index = index;
  if (!state.userPaused) state.playing = !motion.matches;
  const s = lesson[index];
  state.solved = '';
  state.wrong = '';
  state.demoPosition = 0;
  byId('step-title').textContent = s.title;
  byId('body').textContent = s.body;
  byId('takeaway').textContent = s.takeaway;
  byId('scene-desc').textContent = s.description;
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  stepButtons.forEach((button, i) => {
    if (i === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  try { localStorage.setItem(storageKey, String(index)); } catch {}
  buildControls();
  resetAll();
  if (s.mode === 'brackets') startCheck(0);
  report(s.mode === 'brackets' ? '검사할 괄호를 고르고 "다음 글자"를 눌러 보세요.' : '버튼을 눌러 넣고 꺼내 보세요.');
  syncTask();
  state.wait = 800;
  syncPlayback();
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${s.title}`;
}
function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/stackqueue/${index + 1}`);
  showStep(index);
}
function routeIndex() {
  const match = /^#\/stackqueue\/(\d+)$/.exec(location.hash);
  const routed = match ? Number(match[1]) - 1 : -1;
  if (routed >= 0 && routed < lesson.length) return routed;
  try {
    const stored = localStorage.getItem(storageKey);
    const index = Number(stored);
    if (stored !== null && Number.isInteger(index) && index >= 0 && index < lesson.length) return index;
  } catch {}
  return 0;
}
const stepButtons = lesson.map(({ label }, index) => {
  const listItem = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  const number = document.createElement('span');
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.addEventListener('click', () => goToStep(index));
  listItem.append(button);
  byId('steps').append(listItem);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
byId('pause').onclick = () => {
  state.playing = !state.playing;
  state.userPaused = !state.playing;
  if (state.playing) { resetAll(); state.demoPosition = 0; state.wait = 400; }
  syncPlayback();
  byId('announcement').textContent = byId('status').textContent;
};
byId('replay').onclick = () => {
  state.playing = true;
  state.userPaused = false;
  resetAll();
  state.demoPosition = 0;
  state.wait = 300;
  syncPlayback();
  byId('announcement').textContent = '처음부터 자동 실행';
};
function syncRoute() {
  const index = routeIndex();
  if (index !== state.index) showStep(index);
}
window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
motion.addEventListener('change', () => {
  if (!motion.matches && !state.userPaused) state.playing = true;
  syncPlayback();
});
window.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});
const initial = routeIndex();
history.replaceState(null, '', `#/stackqueue/${initial + 1}`);
state.index = -1;
showStep(initial, false);
</script>
</body>
</html>
