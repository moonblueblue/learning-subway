<style>
:root{color-scheme:light;--ink:#142620;--muted:#43574f;--border:#cbd9d0;--paper:#f4f7ef;--panel:#fff;--accent:#12634b;--request:#187959;--response:#5362a0;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}

body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.65 system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled,button[aria-disabled=true]{cursor:default;opacity:.5}
:focus-visible{outline:3px solid #a24c14;outline-offset:3px}

header{margin-bottom:20px}

.eyebrow{color:var(--accent);font-size:.875rem;font-weight:700;margin-bottom:6px}

.readout b{color:var(--ink);font:700 1.1rem var(--mono);letter-spacing:.04em}
.switch-actions{display:flex;gap:8px;align-items:center}

@media(pointer:coarse){.mouse-hint{display:none}.touch-hint{display:inline}}

.switch .face,.switch .glow,.switch .digit,.switch .tag rect,.switch .tag text{transition:fill .18s,stroke .18s,opacity .18s}
.switch .left{fill:#d3dad6;stroke:#8c9d96}
.switch .right{fill:#b9c4be;stroke:#8c9d96}
.switch .top{fill:#eef1ef;stroke:#8c9d96}
.switch.on .left{fill:#a5d6b6;stroke:#4f8f6b}

.tnode .face{stroke-width:.8;transition:fill .15s}
.tnode .left{fill:#dfe4f2;stroke:#7a87b5}.tnode .right{fill:#c4cbe3;stroke:#7a87b5}.tnode .top{fill:#eef1fb;stroke:#7a87b5}
.tnode.root .top{stroke-width:1.6}
.tnode.compare .top,.tnode.trailnode .top{fill:#fff1c9;stroke:#c9940f}
.tnode.found .top{fill:#ffd34d;stroke:#c9940f}

.edge.trail{stroke:#c9940f;stroke-width:3}

.dot.cmpdot{background:#fff1c9;border-color:#c9940f}.dot.hit{background:#ffd34d;border-color:#c9940f}.dot.freshdot{background:#d2f4dd;border-color:var(--accent)}

@media(max-width:600px){.node-value{font-size:15px}.root-tag{font-size:13px}}

<body>
<main class="shell">
  <header>
    <p class="eyebrow">4장 자료구조와 알고리즘 · 레슨 4.6</p>
    <h1>트리와 이진 탐색 트리</h1>
    <p class="lead">값을 나무 모양으로 두면 찾기가 왜 빨라질까요? 작으면 왼쪽, 크면 오른쪽 규칙으로 값을 넣고 찾아 보세요.</p>
  </header>
  <div class="workspace">
    <div>
      <section class="panel" id="stage-panel" aria-labelledby="stage-heading">
        <div class="stage-top"><h2 id="stage-heading">이진 탐색 트리</h2><span class="status" id="status">재생 중</span></div>
        <div class="stage">
          <svg id="scene" viewBox="0 0 620 280" role="img" tabindex="0" aria-labelledby="scene-title scene-desc">
            <title id="scene-title">뿌리에서 작은 값은 왼쪽 아래, 큰 값은 오른쪽 아래로 가지가 뻗은 트리 장면</title><desc id="scene-desc"></desc>
            <defs>
              <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
              <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
              <radialGradient id="grid-fade"><stop offset=".45" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
              <mask id="grid-mask"><rect x="-460" y="-260" width="920" height="520" fill="url(#grid-fade)"/></mask>
            </defs>
            <g id="world" aria-hidden="true">
              <path id="grid" class="iso-grid" mask="url(#grid-mask)"></path>
              <g id="casings"></g><g id="links"></g><g id="nodes"></g><g id="packets"></g>
            </g>
          </svg>
        </div>
        <div class="hands-on">
          <div class="try" id="try">
            <p><strong>해 보기</strong><span id="try-text"></span></p>
            <p class="try-result" id="try-result" role="status"></p>
            <div class="try-choices" id="try-choices" role="group" aria-label="예측 고르기"></div>
          </div>
          <p class="readout" id="readout"></p>
          <div class="algo-row" id="value-row" role="group" aria-label="값 고르기"></div>
          <p class="walk-line" id="walk-line" hidden>읽은 순서 <b id="walk-out">–</b></p>
          <div class="stats-row"><span class="stats" id="stats"></span><button class="action" id="reset" type="button">처음 상태로</button></div>
        </div>
        <div class="view-controls" role="group" aria-label="장면 보기">
          <button class="action" id="zoom-out" type="button" aria-label="장면 축소">−</button>
          <output class="view-scale" id="view-scale" aria-label="현재 배율" aria-live="off">100%</output>
          <button class="action" id="zoom-in" type="button" aria-label="장면 확대">+</button>
          <button class="action" id="view-reset" type="button">원래 보기</button>
          <span class="view-hint"><span class="mouse-hint">확대 후 드래그로 이동</span><span class="touch-hint">두 손가락으로 확대</span></span>
        </div>
        <div class="controls">
          <div class="legend" aria-label="범례"><span><i class="dot cmpdot"></i>비교한 노드</span><span><i class="dot hit"></i>찾은·읽은 노드</span><span><i class="dot freshdot"></i>새로 넣은 노드</span><span><i class="sample trail"></i>내려간 길</span></div>
          <div class="actions"><button class="action" id="pause" type="button">일시정지</button><button class="action" id="replay" type="button">다시 보기</button></div>
        </div>
        <nav class="timeline" aria-labelledby="timeline-heading">
          <div class="timeline-top"><h2 id="timeline-heading">타임라인</h2><span id="count"></span></div>
          <ol class="steps" id="steps"></ol>
        </nav>
      </section>
    </div>
    <section class="panel explanation" aria-labelledby="step-title">
      <h2 id="step-title"></h2><p id="body"></p>
      <div class="takeaway"><strong>관찰 포인트</strong><p id="takeaway"></p></div>
      <nav class="navigation" aria-label="이전 및 다음 단계"><button class="action" id="prev" type="button">이전 단계</button><button class="action primary" id="next" type="button">다음 단계</button></nav>
    </section>

  <div class="sr-only" id="announcement" role="status"></div>
</main>
<script>
const byId = (id) => document.getElementById(id);
const viewport = byId('scene');
const viewWidth = 620;
const viewHeight = 280;
const maxZoom = 3;
const center = { x: viewWidth / 2, y: viewHeight / 2 };
const camera = { x: 0, y: 0, zoom: 1 };
const pointers = new Map();
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

function setCamera(x, y, zoom) {
  camera.zoom = clamp(zoom, 1, maxZoom);
  const width = viewWidth / camera.zoom;
  const height = viewHeight / camera.zoom;
  camera.x = clamp(x, 0, viewWidth - width);
  camera.y = clamp(y, 0, viewHeight - height);
  viewport.setAttribute('viewBox', `${camera.x} ${camera.y} ${width} ${height}`);
  viewport.classList.toggle('is-zoomed', camera.zoom > 1);
  byId('view-scale').textContent = `${Math.round(camera.zoom * 100)}%`;
  byId('zoom-out').setAttribute('aria-disabled', String(camera.zoom === 1));
  byId('zoom-in').setAttribute('aria-disabled', String(camera.zoom === maxZoom));
}

function zoomBetween(nextZoom, from, to = from) {
  const zoom = clamp(nextZoom, 1, maxZoom);
  setCamera(camera.x + from.x / camera.zoom - to.x / zoom,
            camera.y + from.y / camera.zoom - to.y / zoom, zoom);
}

// Convert from screen pixels to fixed viewport coordinates, accounting for SVG letterboxing.
function viewportPoint(event) {
  const rect = viewport.getBoundingClientRect();
  const scale = Math.min(rect.width / viewWidth, rect.height / viewHeight);
  return {
    x: center.x + (event.clientX - rect.left - rect.width / 2) / scale,
    y: center.y + (event.clientY - rect.top - rect.height / 2) / scale,
  };
}

function pointerGeometry() {
  const [a, b] = pointers.values();
  if (!b) return { point: a, distance: 0 };
  return {
    point: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 },
    distance: Math.hypot(a.x - b.x, a.y - b.y),
  };
}

// A press that starts on a switch and ends without moving toggles that switch.
// Tracked separately from the camera pointers so it also works when the pointer is captured.
let tap = null;
viewport.addEventListener('pointerdown', (event) => {
  const target = event.target.closest?.('[data-input]');
  tap = target && event.button === 0 && pointers.size === 0
    ? { input: target.dataset.input, x: event.clientX, y: event.clientY, id: event.pointerId }
    : null;
});
viewport.addEventListener('pointerup', (event) => {
  if (tap && tap.id === event.pointerId && Math.hypot(event.clientX - tap.x, event.clientY - tap.y) < 8) {
    toggleInput(tap.input);
  }
  tap = null;
});
viewport.addEventListener('pointercancel', () => { tap = null; });

viewport.addEventListener('pointerdown', (event) => {
  if (event.button !== 0 || pointers.size >= 2) return;
  if (event.pointerType !== 'touch' && camera.zoom === 1) return;
  pointers.set(event.pointerId, viewportPoint(event));
  viewport.setPointerCapture(event.pointerId);
});
viewport.addEventListener('pointermove', (event) => {
  if (!pointers.has(event.pointerId)) return;
  const before = pointerGeometry();
  pointers.set(event.pointerId, viewportPoint(event));
  const after = pointerGeometry();
  const pinch = pointers.size === 2;
  if (pinch && (before.distance < 1 || after.distance < 1)) return;
  const zoom = pinch ? camera.zoom * after.distance / before.distance : camera.zoom;
  zoomBetween(zoom, before.point, after.point);
  viewport.classList.toggle('is-dragging', !pinch && camera.zoom > 1);
});
for (const eventName of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  viewport.addEventListener(eventName, (event) => {
    if (pointers.delete(event.pointerId)) viewport.classList.remove('is-dragging');
  });
}

function zoomBy(delta) {
  if (clamp(camera.zoom + delta, 1, maxZoom) === camera.zoom) return;
  zoomBetween(camera.zoom + delta, center);
  byId('announcement').textContent = `장면 배율 ${Math.round(camera.zoom * 100)}%`;
}

function resetView() {
  pointers.clear();
  viewport.classList.remove('is-dragging');
  setCamera(0, 0, 1);
  byId('announcement').textContent = '원래 보기로 돌아왔습니다';
}

byId('zoom-in').onclick = () => zoomBy(.25);
byId('zoom-out').onclick = () => zoomBy(-.25);
byId('view-reset').onclick = resetView;
viewport.addEventListener('keydown', (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const directions = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const direction = directions[event.key];
  if (direction && camera.zoom > 1) {
    event.preventDefault();
    setCamera(camera.x + direction[0] * 28 / camera.zoom, camera.y + direction[1] * 28 / camera.zoom, camera.zoom);
  } else if (event.key === '+' || event.key === '=' || event.key === '-') {
    event.preventDefault();
    zoomBy(event.key === '-' ? -.25 : .25);
  } else if (event.key === '0') {
    event.preventDefault();
    resetView();
  }
});
setCamera(0, 0, 1);
// A binary search tree: every node's left side holds smaller values and its right side larger ones.
// Nodes are drawn by depth (rows going down) and by sorted order (columns), so the picture is always tidy.
const lesson = [
  {
    label: '트리에 넣기',
    example: ["뿌리 40 · 입력 20", "20 < 40", "왼쪽 자식에 20"],
    title: '작으면 왼쪽, 크면 오른쪽으로 내려간다',
    body: '트리는 맨 위의 뿌리(root)에서 가지가 갈라지는 구조입니다. 이진 탐색 트리는 노드마다 자식이 둘까지이고, 왼쪽 아래에는 그보다 작은 값만, 오른쪽 아래에는 큰 값만 둡니다. 새 값은 뿌리부터 비교하며 작으면 왼쪽, 크면 오른쪽으로 내려가 빈자리에 붙습니다.',
    takeaway: '50, 30, 70을 차례로 넣으면 50이 뿌리, 30이 왼쪽, 70이 오른쪽 자식이 됩니다. 값을 넣을 때마다 비교한 노드가 노랗게 켜지고, 내려간 길이 남습니다.',
    description: '빈 바닥에 값을 넣으면 첫 값이 뿌리가 되고, 다음 값들은 뿌리부터 비교하며 왼쪽 또는 오른쪽 아래로 내려가 자리를 잡습니다.',
    mode: 'insert', start: [], values: [50, 30, 70, 20, 40, 60, 80, 45, 65, 10],
    tasks: [
      { text: '50, 30, 70을 차례로 넣어 보세요.', test: (e) => [50, 30, 70].every((v) => e.values.includes(v)), ok: '50이 뿌리, 30은 왼쪽, 70은 오른쪽입니다.' },
      { text: '20, 40, 60, 80도 넣어 세 층짜리 트리를 만들어 보세요.', test: (e) => [20, 40, 60, 80].every((v) => e.values.includes(v)), ok: '노드 7개가 세 층에 꽉 찬 트리가 됐습니다.' },

const motion = matchMedia('(prefers-reduced-motion: reduce)');
const storageKey = 'bst-lab:v1:step';
const state = { index: 0, root: null, busy: false, playing: !motion.matches, userPaused: false, wait: 0, solved: '', wrong: '', demoPosition: 0, walked: [] };
const progress = lesson.map(() => 0);
let timers = [];

function svg(name, attrs, parent) {
  const element = document.createElementNS('http://www.w3.org/2000/svg', name);
  for (const [key, value] of Object.entries(attrs)) element.setAttribute(key, value);
  if (parent) parent.append(element);
  return element;
}
const project = (x, y, z = 0) => [14 * (x + y), 7 * (x - y) - z];
const point = (x, y, z) => project(x, y, z).map((value) => +value.toFixed(2)).join(',');
const flat = (u, v, z = 0) => [14 * u, 7 * v - z];
const mix = (a, b, t) => a + (b - a) * t;
const gridLines = [];
for (let i = -24; i <= 40; i += 2) gridLines.push(`M${point(i, -24, 0)}L${point(i, 40, 0)}M${point(-24, i, 0)}L${point(40, i, 0)}`);
byId('grid').setAttribute('d', gridLines.join(''));
function drawShadow(node, half) {
  const corners = [[-half + .4, -half - .25], [half + .9, -half - .25], [half + .9, half], [-half + .4, half]];
  svg('polygon', { class: 'shadow', points: corners.map(([x, y]) => point(x, y, 0)).join(' '), filter: 'url(#soft-shadow)' }, node);
}
function drawBox(node, h, H) {
  const faces = {
    left: [[-h, -h, 0], [h, -h, 0], [h, -h, H], [-h, -h, H]],
    right: [[h, -h, 0], [h, h, 0], [h, h, H], [h, -h, H]],
    top: [[-h, -h, H], [h, -h, H], [h, h, H], [-h, h, H]],
  };
  for (const [name, corners] of Object.entries(faces)) svg('polygon', { class: 'face ' + name, points: corners.map((p) => point(...p)).join(' ') }, node);
  svg('path', { class: 'highlight', d: `M${point(-h, -h, H)}L${point(h, -h, H)}L${point(h, h, H)}` }, node);
}

// ---------- Tree ----------
function insertValue(value) {
  const path = [];
  if (!state.root) { state.root = { value, left: null, right: null }; return { path, side: null }; }
  let node = state.root;
  for (;;) {
    path.push(node);
    if (value === node.value) return { path, duplicate: true };
    const side = value < node.value ? 'left' : 'right';
    if (!node[side]) { node[side] = { value, left: null, right: null }; return { path, side, parent: node }; }
    node = node[side];
  }
}
function searchPath(value) {
  const path = [];
  let node = state.root;
  while (node) { path.push(node); if (value === node.value) return { path, found: true }; node = value < node.value ? node.left : node.right; }
  return { path, found: false };
}
function inorder(node, out = []) { if (node) { inorder(node.left, out); out.push(node); inorder(node.right, out); } return out; }
const height = (node) => node ? 1 + Math.max(height(node.left), height(node.right)) : 0;
const allValues = () => inorder(state.root).map((n) => n.value);

// ---------- Scene ----------
const nodeHalf = .78, nodeH = 9;
let views = new Map();   // value -> group
let layout = new Map();  // value -> [u, v]
function buildScene() {
  for (const id of ['casings', 'links', 'nodes', 'packets']) byId(id).replaceChildren();
  views = new Map();
  layout = new Map();
  const nodes = inorder(state.root);
  const depthOf = new Map();
  const walk = (n, d) => { if (!n) return; depthOf.set(n, d); walk(n.left, d + 1); walk(n.right, d + 1); };
  walk(state.root, 0);
  const columns = nodes.length;
  const gap = columns > 10 ? 2.05 : 2.9;
  nodes.forEach((n, i) => layout.set(n.value, [i * gap, depthOf.get(n) * 4.6]));
  // Edges parent → child.
  const edges = (n) => {
    for (const child of [n?.left, n?.right]) {
      if (!child) continue;
      const a = flat(...layout.get(n.value), 6), b = flat(...layout.get(child.value), 6);
      svg('path', { class: 'edge', 'data-edge': child.value, d: `M${a.join(' ')}L${b.join(' ')}` }, byId('links'));
      edges(child);
    }
  };
  edges(state.root);
  // Nodes, back to front.
  [...nodes].sort((a, b) => layout.get(a.value)[1] - layout.get(b.value)[1]).forEach((n) => {
    const node = svg('g', { class: 'node tnode' + (n === state.root ? ' root' : ''), transform: `translate(${flat(...layout.get(n.value)).join(' ')})` }, byId('nodes'));
    drawShadow(node, nodeHalf);
    drawBox(node, nodeHalf, nodeH);
    svg('text', { class: 'node-value', x: 0, y: -nodeH + .5 }, node).textContent = n.value;
    views.set(n.value, node);
  });
  if (state.root) {
    const [ru, rv] = layout.get(state.root.value);
    const tag = svg('text', { class: 'root-tag', x: flat(ru, rv)[0], y: flat(ru, rv)[1] - nodeH - 24 }, byId('packets'));
    tag.textContent = '뿌리';
  }
  fit(nodes.length ? Math.max(...[...layout.values()].map(([u]) => u)) : 10, nodes.length ? Math.max(...[...layout.values()].map(([, v]) => v)) : 4);
  syncStats();
}
function fit(maxU, maxV) {
  const left = -40, right = 14 * Math.max(maxU, 8) + 40, top = -50, bottom = 7 * Math.max(maxV, 9) + 40;
  const scale = Math.min(1.5, 590 / (right - left), 268 / (bottom - top));
  const x = 310 - scale * (left + right) / 2, y = 140 - scale * (top + bottom) / 2;
  byId('world').setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${scale.toFixed(3)})`);
}
function mark(value, cls, on = true) { views.get(value)?.classList.toggle(cls, on); }
function markEdge(value) { byId('links').querySelector(`[data-edge="${value}"]`)?.classList.add('trail'); }

// ---------- Animation helpers ----------
function later(ms, fn) {
  if (motion.matches) { fn(); return; }
  timers.push(setTimeout(fn, ms));
}
function cancelAll() {
  timers.forEach(clearTimeout);
  timers = [];
  state.busy = false;
}
const pace = 520;
function report(text) { byId('readout').textContent = text; byId('announcement').textContent = text; }

// ---------- Operations ----------
function doInsert(value, user, done) {
  if (state.busy) return;
  if (allValues().includes(value)) { report(`${value}은(는) 이미 있습니다.`); return; }
  state.busy = true;
  const { path } = searchPath(value);
  const steps = path.map((n) => `${value} ${value < n.value ? '<' : '>'} ${n.value} → ${value < n.value ? '왼쪽' : '오른쪽'}`);
  path.forEach((n, i) => later(i * pace, () => { mark(n.value, 'compare'); if (i) markEdge(n.value); report(steps[i]); }));
  later(path.length * pace, () => {
    insertValue(value);
    buildScene();
    path.forEach((n, i) => { mark(n.value, 'trailnode'); if (i) markEdge(n.value); });
    markEdge(value);
    mark(value, 'fresh');
    report(path.length ? `${value} 넣기: ${steps.join(', ')} · 빈자리에 붙음 (비교 ${path.length}번)` : `${value} 넣기: 트리가 비어 있어 뿌리가 됩니다.`);
    state.busy = false;
    syncControls();
    if (user) afterUser({ values: allValues(), height: height(state.root) });
    done?.();
  });
  syncControls();
}
function doFind(value, user) {
  if (state.busy) return;
  state.busy = true;
  buildScene();
  const { path, found } = searchPath(value);
  path.forEach((n, i) => later(i * pace, () => {
    mark(n.value, 'compare');
    if (i) markEdge(n.value);
    report(n.value === value ? `${value} = ${n.value} → 찾음` : `${value} ${value < n.value ? '<' : '>'} ${n.value} → ${value < n.value ? '왼쪽' : '오른쪽'}`);
  }));
  later(path.length * pace, () => {
    if (found) mark(value, 'found');
    report(`${value} 찾기: ${path.map((n) => n.value).join(' → ')}${found ? '' : ' → 빈자리'} · 비교 ${path.length}번 · ${found ? '찾음' : '없음'} (값 ${allValues().length}개를 리스트로 뒤지면 많게는 ${allValues().length}번)`);
    state.busy = false;
    syncControls();
    if (user) afterUser({ find: value, found, values: allValues(), height: height(state.root) });
  });
  syncControls();
}
function insertMany(values, user) {
  if (state.busy) return;
  let k = 0;
  const next = () => { if (k < values.length) doInsert(values[k++], false, next); else if (user) afterUser({ values: allValues(), height: height(state.root) }); };
  next();
}
function walk(user) {
  if (state.busy) return;
  state.busy = true;
  buildScene();
  const order = inorder(state.root);
  state.walked = [];
  order.forEach((n, i) => later(i * 380, () => {
    mark(n.value, 'found');
    state.walked.push(n.value);
    byId('walk-out').textContent = state.walked.join(', ');
    report(`중위 순회: ${n.value} 읽음 (${i + 1}/${order.length})`);
  }));
  later(order.length * 380, () => {
    state.busy = false;
    report(`작은 값부터 읽기 끝: ${state.walked.join(', ')}`);
    syncControls();
    if (user) afterUser({ walked: true, values: allValues() });
  });
  syncControls();
}

// ---------- Panel ----------
function buildControls() {
  const step = lesson[state.index];
  const row = byId('value-row');
  row.replaceChildren();
  const add = (text, onClick, cls = 'action value-button') => {
    const b = Object.assign(document.createElement('button'), { type: 'button', className: cls, textContent: text });
    b.addEventListener('click', () => { takeOver(); onClick(); });
    row.append(b);
    return b;
  };
  if (step.mode === 'insert') {
    row.append(Object.assign(document.createElement('span'), { className: 'row-name', textContent: '넣기' }));
    for (const v of step.values) add(String(v), () => doInsert(v, true)).dataset.value = v;
  }
  if (step.mode === 'find') {
    row.append(Object.assign(document.createElement('span'), { className: 'row-name', textContent: '찾기' }));
    for (const v of step.values) add(String(v), () => doFind(v, true));
  }
  if (step.mode === 'skew') {
    add('차례로 7개 넣기 (10, 20, …, 70)', () => { resetTree(); insertMany(step.values, true); }, 'action primary');
    add('70 찾기', () => doFind(70, true));
    add('10 찾기', () => doFind(10, true));
  }
  if (step.mode === 'walk') add('작은 값부터 읽기', () => walk(true), 'action primary');
  byId('walk-line').hidden = step.mode !== 'walk';
}
function syncControls() {
  [...byId('value-row').querySelectorAll('button')].forEach((b) => {
    b.disabled = state.busy && !state.playing;
    if (b.dataset.value) b.classList.toggle('inside', allValues().includes(Number(b.dataset.value)));
  });
  byId('reset').disabled = state.busy && !state.playing;
}
function syncStats() {
  const n = allValues().length;
  byId('stats').textContent = `노드 ${n}개 · 높이 ${height(state.root)}층${n ? ` · 고르게 퍼졌다면 ${Math.ceil(Math.log2(n + 1))}층` : ''}`;
}
function resetTree() {
  cancelAll();
  state.root = null;
  for (const v of lesson[state.index].start) insertValue(v);
  state.walked = [];
  byId('walk-out').textContent = '–';
  buildScene();
  syncControls();
}
byId('reset').onclick = () => { takeOver(); resetTree(); report('처음 상태로 되돌렸습니다.'); };

// ---------- Tasks ----------
const currentTask = () => lesson[state.index].tasks[progress[state.index]];
function syncTask() {
  const tasks = lesson[state.index].tasks;
  const task = currentTask();
  const choices = byId('try-choices');
  choices.replaceChildren();
  byId('try').classList.toggle('solved', Boolean(state.solved) && !task?.ask);
  if (task?.ask) {
    byId('try-text').textContent = task.ask;
    byId('try-result').textContent = state.wrong || (state.solved ? `✓ 맞았습니다. ${state.solved}` : '');
    for (const choice of task.choices) {
      const b = Object.assign(document.createElement('button'), { type: 'button', className: 'action choice-button', textContent: choice });
      b.addEventListener('click', () => answer(choice));
      choices.append(b);
    }
    return;
  }
  byId('try-text').textContent = task ? task.text : (state.solved ? '' : '이 단계의 문제를 모두 풀었습니다. 자유롭게 해 보세요.');
  byId('try-result').textContent = state.solved ? `✓ 맞았습니다. ${state.solved}${progress[state.index] >= tasks.length ? ' · 이 단계의 문제를 모두 풀었습니다.' : ''}` : '';
}
// Only the learner's own actions count, so the demo cannot solve a problem.
function afterUser(event) {
  const task = currentTask();
  if (task && !task.ask && task.test(event)) { progress[state.index]++; state.solved = task.ok; state.wrong = ''; }
  syncTask();
}
function answer(choice) {
  const task = currentTask();
  if (choice !== task.answer) { state.wrong = `✗ ${choice}이(가) 아닙니다. 다시 골라 보세요.`; syncTask(); return; }
  progress[state.index]++;
  state.wrong = '';
  state.solved = task.why;
  syncTask();
}

// ---------- Demo ----------
let frame = null, lastFrame = null;
function takeOver() {
  if (!state.playing) return;
  state.playing = false;
  resetTree();
  syncPlayback();
}
function demoTick() {
  if (state.busy) { state.wait = 300; return; }
  const step = lesson[state.index];
  const p = state.demoPosition++;
  if (step.mode === 'insert') {
    const rest = step.values.filter((v) => !allValues().includes(v));
    if (!rest.length || allValues().length >= 8) { resetTree(); state.wait = 1000; return; }
    doInsert(rest[0], false);
    state.wait = 2600;
  } else if (step.mode === 'find') { doFind(step.values[p % step.values.length], false); state.wait = 3600; }
  else if (step.mode === 'skew') {
    if (p % 2 === 0) { resetTree(); insertMany(step.values, false); state.wait = 6000; } else { doFind(70, false); state.wait = 5200; }
  } else { walk(false); state.wait = 8000; }
}
function tick(now) {
  frame = null;
  const elapsed = lastFrame === null ? 0 : Math.min(now - lastFrame, 80);
  lastFrame = now;
  if (state.playing) {
    state.wait -= elapsed;
    if (state.wait <= 0) demoTick();
    frame = requestAnimationFrame(tick);
  } else lastFrame = null;
}
function syncPlayback() {
  const reduced = motion.matches;
  if (reduced) state.playing = false;
  byId('status').textContent = reduced ? '모션 감소 · 직접 조작' : state.playing ? '자동 실행 중' : '직접 조작';
  byId('pause').textContent = state.playing ? '일시정지' : '자동 실행';
  byId('pause').disabled = reduced;
  byId('replay').disabled = reduced;
  if (state.playing && frame === null) frame = requestAnimationFrame(tick);
  syncControls();
}

// ---------- Steps and routing ----------
function showStep(index, announce = true) {
  state.index = index;
  if (!state.userPaused) state.playing = !motion.matches;
  const s = lesson[index];
  state.solved = '';
  state.wrong = '';
  state.demoPosition = 0;
  byId('step-title').textContent = s.title;
  byId('body').textContent = s.body;
  byId('takeaway').textContent = s.takeaway;
  byId('scene-desc').textContent = s.description;
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  stepButtons.forEach((button, i) => {
    if (i === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  try { localStorage.setItem(storageKey, String(index)); } catch {}
  buildControls();
  resetTree();
  report({ insert: '넣을 값을 눌러 보세요.', find: '찾을 값을 눌러 보세요.', skew: '"차례로 7개 넣기"를 눌러 보세요.', walk: '"작은 값부터 읽기"를 눌러 보세요.' }[s.mode]);
  syncTask();
  state.wait = 800;
  syncPlayback();
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${s.title}`;
}
function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/bst/${index + 1}`);
  showStep(index);
}
function routeIndex() {
  const match = /^#\/bst\/(\d+)$/.exec(location.hash);
  const routed = match ? Number(match[1]) - 1 : -1;
  if (routed >= 0 && routed < lesson.length) return routed;
  try {
    const stored = localStorage.getItem(storageKey);
    const index = Number(stored);
    if (stored !== null && Number.isInteger(index) && index >= 0 && index < lesson.length) return index;
  } catch {}
  return 0;
}
const stepButtons = lesson.map(({ label }, index) => {
  const listItem = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  const number = document.createElement('span');
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.addEventListener('click', () => goToStep(index));
  listItem.append(button);
  byId('steps').append(listItem);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
byId('pause').onclick = () => {
  state.playing = !state.playing;
  state.userPaused = !state.playing;
  if (state.playing) { resetTree(); state.demoPosition = 0; state.wait = 400; }
  syncPlayback();
  byId('announcement').textContent = byId('status').textContent;
};
byId('replay').onclick = () => {
  state.playing = true;
  state.userPaused = false;
  resetTree();
  state.demoPosition = 0;
  state.wait = 300;
  syncPlayback();
  byId('announcement').textContent = '처음부터 자동 실행';
};
function syncRoute() {
  const index = routeIndex();
  if (index !== state.index) showStep(index);
}
window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
motion.addEventListener('change', () => {
  if (!motion.matches && !state.userPaused) state.playing = true;
  syncPlayback();
});
window.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});
const initial = routeIndex();
history.replaceState(null, '', `#/bst/${initial + 1}`);
state.index = -1;
showStep(initial, false);
</script>
</body>
