const slug = 'photo-search';
const byId = id => document.getElementById(id);
const state = {index: -1, answers: new Map()};
const feedbackMessages = ['✓ 맞았습니다.', '✗ 다시 생각해 보세요.'];
const scene = byId('scene');
const workspace = scene.closest('.workspace');

function label(group, x, y, value, className = 'photo-label', anchor = 'middle') {
  svg('text', {x, y, class: className, 'text-anchor': anchor}, group).textContent = value;
}

function card(group, x, y, width, height, tone = '') {
  svg('rect', {x, y, width, height, rx: 8, class: 'photo-card ' + tone}, group);
}

function arrow(group, x1, y1, x2, y2, tone = '') {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const tipLength = 8;
  const shaftInset = (tipLength - 1) / Math.hypot(dx, dy);
  svg('line', {x1, y1, x2: x2 - dx * shaftInset, y2: y2 - dy * shaftInset, class: 'photo-arrow ' + tone}, group);
  svg('polygon', {'data-arrowhead': '', points: `${-tipLength},-5 0,0 ${-tipLength},5`, class: 'photo-tip ' + tone,
    transform: `translate(${x2} ${y2}) rotate(${Math.atan2(dy, dx) * 180 / Math.PI})`}, group);
}

function icon(group, x, y, kind) {
  const art = svg('g', {transform: `translate(${x} ${y})`}, group);
  if (kind === 'tree') {
    svg('circle', {cx: 17, cy: 13, r: 5, fill: '#f7dc91'}, art);
    svg('path', {d: 'M-24 35Q-12 19 2 33Q15 23 25 31V46H-24Z', fill: '#bdd3a8'}, art);
    svg('path', {d: 'M-18 39H-14V29H-18Z', fill: '#684735'}, art);
    svg('path', {d: 'M-16 9L-27 28H-5Z', fill: '#356954'}, art);
    return;
  }
  if (kind === 'toy') {
    svg('path', {d: 'M-24 39Q0 33 24 39L24 44Q0 50-24 44Z', fill: '#aa4e27'}, art);
    svg('path', {d: 'M-4 36H4V41H-4Z', fill: '#623f31'}, art);
    const figure = svg('g', {transform: 'translate(0 3) scale(.74)'}, art);
    icon(figure, 0, 0, 'crop');
    return;
  }
  const dog = kind === 'dog' || kind === 'dog-spotted';
  const crop = kind === 'crop';
  const fur = kind === 'dog-spotted' ? '#e9c9a5' : dog ? '#b48160' : kind === 'cat-dark' ? '#677787' : crop ? '#f0bf91' : '#dcab73';
  if (crop) art.setAttribute('transform', `translate(${x + 2} ${y}) rotate(-10 0 28)`);
  const catShape = 'M-21 27L-20 8L-9 16Q0 13 9 16L20 8L21 27Q21 43 0 43Q-21 43-21 27Z';
  svg('path', {d: dog ? 'M-18 20Q-15 11 0 11Q15 11 18 20Q23 44 0 44Q-23 44-18 20Z' : catShape, fill: fur, stroke: '#624834'}, art);
  if (kind === 'dog-spotted') {
    svg('path', {d: 'M-14 13Q-30 4-29 28Q-26 36-18 27M13 15Q32 13 29 38Q23 41 16 30M-16 21Q-2 16-3 29Q-5 35-20 31Z', fill: '#695449'}, art);
  } else if (dog) svg('path', {d: 'M-14 14Q-33 11-28 36Q-23 39-16 28M14 14Q33 11 28 36Q23 39 16 28', fill: '#805b47'}, art);
  else svg('path', {d: 'M-18 13L-11 19L-17 22ZM18 13L11 19L17 22Z', fill: '#efd2be'}, art);
  if (crop) svg('path', {d: 'M-4 16L-2 22M1 16V22M6 16L4 22M16 29L21 28', fill: 'none', stroke: '#935d43', 'stroke-width': 2}, art);
  for (const eye of [-8, 8]) svg('circle', {cx: eye, cy: 27, r: 2.2, fill: '#232521'}, art);
  svg('path', {d: 'M-4 32H4L0 35Z', fill: '#53392f'}, art);
  svg('path', {d: dog ? 'M-5 38Q0 43 5 38' : 'M-9 36L-18 35M9 36L18 35', fill: 'none', stroke: '#53392f'}, art);
}

function photo(group, x, y, kind, id = '') {
  card(group, x, y, 66, 48, 'photo-thumb');
  const fill = {tree: '#e4edff', cat: '#fbebd4', 'cat-dark': '#e0edf0', dog: '#ede3d9', 'dog-spotted': '#d9ead4', crop: '#dae1f1', toy: '#dae1f1'};
  svg('rect', {x: x + 2, y: y + 2, width: 62, height: 44, rx: 6, fill: fill[kind]}, group);
  icon(group, x + 33, y, kind);
  if (id) {
    svg('circle', {cx: x - 13, cy: y + 24, r: 10, class: 'photo-id'}, group);
    label(group, x - 13, y + 29, id, 'photo-small');
  }
}

function person(group, x, y) {
  svg('circle', {cx: x, cy: y, r: 13, class: 'photo-human'}, group);
  svg('path', {d: `M${x - 25} ${y + 39}q0 -20 25 -20t25 20Z`, class: 'photo-human'}, group);
}

function gallery(group, trial) {
  const target = trial ? '나무' : '고양이';
  const who = svg('g', {}, group);
  label(who, 136, 89, trial ? '나무 사진 찾기' : '고양이 사진 찾기');
  person(who, 136, 123);
  label(who, 136, 181, '사람');
  photo(who, 103, 192, trial ? 'tree' : 'cat');
  arrow(group, 210, 151, 280, 151);
  card(group, 293, 66, 296, 177, 'photo-panel');
  label(group, 313, 88, '휴대폰 사진첩', 'photo-label', 'start');
  card(group, 313, 99, 256, 31, 'photo-input');
  svg('circle', {cx: 329, cy: 113, r: 5, class: 'photo-loop'}, group);
  svg('path', {d: 'M333 117l4 4', class: 'photo-loop'}, group);
  label(group, 349, 120, trial ? '검색어 입력 전' : target, 'photo-small', 'start');
  for (const [i, kind] of ['dog', 'cat', 'tree', 'cat-dark', 'dog', 'tree'].entries()) {
    const cell = svg('g', {transform: `translate(${321 + i % 3 * 88} ${137 + Math.floor(i / 3) * 51})`}, group);
    photo(cell, 0, 0, kind);
  }
}

function examples(group, trial) {
  label(group, 168, 83, '사람이 붙인 정답');

const draw = [gallery, examples, proposals, checked, workAndMethods, speech];
for (const [index, step] of lesson.entries()) {
  const template = document.createElement('template');
  template.id = step.readingDiagram.figure;
  const canvas = svg('svg', {viewBox: '0 0 620 280'}, template.content);
  const figure = svg('g', {}, canvas);
  draw[index](svg('g', {class: 'photo-reading'}, figure), false);
  const practice = svg('g', {class: 'photo-practice'}, figure);
  const practiceEvidence = index === 0 || index === 2 || index === 3
    ? svg('g', {transform: 'translate(0 17) scale(1 .77)'}, practice) : practice;
  draw[index](practiceEvidence, true);
  card(practice, 25, 220, 290, 37, 'photo-input');
  label(practice, 170, 244, step.practice[0]);
  arrow(practice, 321, 238.5, 349, 238.5);
  card(practice, 357, 220, 238, 37, 'photo-pending photo-practice-result');
  label(practice, 476, 244, '선택 대기', 'photo-label photo-answer');
  document.body.append(template);
}

function updateCaptionHighlights() {
  const language = window.courseI18n?.lang ?? 'ko';
  for (const caption of scene.querySelectorAll('[data-caption]')) {
    if (caption.dataset.language === language) continue;
    caption.dataset.language = language;
    const translate = word => window.courseI18n?.translate(word) ?? word;
    const phrase = translate(caption.dataset.caption);
    const word = translate(caption.dataset.word);
    const offset = phrase.indexOf(word);
    caption.replaceChildren(document.createTextNode(phrase.slice(0, offset)));
    svg('tspan', {class: 'photo-word'}, caption).textContent = word;
    caption.append(document.createTextNode(phrase.slice(offset + word.length)));
  }
}

function updatePracticeFigure() {
  updateCaptionHighlights();
  const practice = scene.querySelector('.photo-practice');
  if (!practice || state.index < 0) return;
  const step = lesson[state.index];
  const selected = state.answers.get(state.index);
  const correct = selected === step.quiz[1];
  const status = correct ? 'correct' : selected === undefined ? 'waiting' : 'retry';
  if (practice.dataset.status !== status) {
    practice.dataset.status = status;
    practice.querySelector('.photo-answer').textContent = correct ? step.practice[1] : selected === undefined ? '선택 대기' : '다시 선택';
    const result = practice.querySelector('.photo-practice-result');
    result.classList.toggle('photo-match', correct);
    result.classList.toggle('photo-error', status === 'retry');
    result.classList.toggle('photo-pending', status === 'waiting');
  }
  const reading = workspace.classList.contains('course-reading');
  const parts = reading ? [step.description] : [step.practiceDescription || step.quiz[0],
    correct ? step.quiz[3] : status === 'retry' ? feedbackMessages[1] : ''];
  const local = parts.filter(Boolean).map(part => window.courseI18n?.translate(part) ?? part).join(' ');
  for (const id of ['scene-desc', 'course-diagram-desc']) {
    const node = byId(id);
    if (node && node.textContent !== local) node.textContent = local;
  }
}

window.addEventListener('course:lang', updatePracticeFigure);
const practiceChanges = new MutationObserver(updatePracticeFigure);
practiceChanges.observe(scene, {childList: true});
practiceChanges.observe(workspace, {attributes: true, attributeFilter: ['class']});
practiceChanges.observe(byId('choices'), {childList: true, subtree: true, attributes: true, attributeFilter: ['aria-pressed']});
</script>
