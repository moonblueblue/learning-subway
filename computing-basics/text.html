<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="../shared/device-access.js?v=1f73c765843f36b1"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="글자에 번호를 붙이고, 그 번호를 비트로 바꾸는 방법(ASCII, 유니코드, UTF-8)을 스위치로 살펴보세요.">
<title>글자의 번호표</title>
<style>
:root{color-scheme:light;--ink:#142620;--muted:#43574f;--border:#cbd9d0;--paper:#f4f7ef;--panel:#fff;--accent:#0f766e;--request:#187959;--response:#5362a0;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.65 system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled,button[aria-disabled=true]{cursor:default;opacity:.5}
:focus-visible{outline:3px solid #a24c14;outline-offset:3px}
.shell{max-width:1280px;margin:auto;padding:clamp(16px,2.5vw,32px)}
header{margin-bottom:20px}
h1,h2,p{margin:0}
.eyebrow{color:var(--accent);font-size:.875rem;font-weight:700;margin-bottom:6px}
h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.12;letter-spacing:-.065em}
header p.lead{color:var(--muted);margin-top:10px}
.workspace{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(360px,1fr);gap:20px;align-items:stretch}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:18px;overflow:hidden}
.stage-top,.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;flex-wrap:wrap}
.stage-top h2,.timeline h2{font-size:1rem}
.status{color:var(--accent);font-size:.875rem;font-weight:700}
.stage{background:#eaf3eb;border-block:1px solid var(--border)}
svg{display:block;width:100%;height:auto;max-height:520px}
#scene{user-select:none}
#scene:focus-visible{outline-offset:-4px}
#scene.is-zoomed{cursor:grab;touch-action:none}
#scene.is-dragging{cursor:grabbing}
.hands-on{padding:14px 18px;border-bottom:1px solid var(--border);display:grid;gap:12px}
.try{display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:#e9f5f3;border-left:3px solid var(--accent);border-radius:0 9px 9px 0;min-height:64px}
.try strong{color:var(--accent);font-size:.875rem;margin-right:6px}
.try-result{color:var(--accent);font-weight:700}
.try-result:empty{display:none}
.try.solved{background:#d2f4dd}
.readout{font-size:1rem;color:var(--muted)}
.readout b{color:var(--ink);font:700 1.1rem var(--mono);letter-spacing:.04em}
.readout .total{color:var(--accent);font-size:1.3rem}
.switch-area{display:flex;gap:10px 14px;align-items:stretch;flex-wrap:wrap}
.switch-row{display:grid;grid-template-columns:repeat(var(--cols,8),minmax(0,1fr));gap:6px;flex:1 1 320px;max-width:calc(var(--cols,8) * 66px)}
.switch-row.wide .place{font-size:.6875rem;letter-spacing:-.02em;white-space:nowrap}
.total.long text{font-size:16px}
.readout .line{display:block}
.readout .encoding-row{display:flex;flex-wrap:wrap;gap:4px;margin-block:4px}
.readout .encoding-byte{display:inline-flex;align-items:baseline;gap:4px;border:1px solid #9aac9f;border-radius:5px;padding:2px 4px;white-space:nowrap}
.readout .encoding-byte b{font-size:.82rem;letter-spacing:0}
.readout .encoding-head{background:#e9eeff;box-shadow:inset 0 -2px #5362a0}
.readout .encoding-key{display:inline-block;padding-inline:4px;margin-inline-start:8px;font-size:.8rem}
.readout .encoding-hex{color:#43574f;font:.8rem var(--mono)}
.utf8-figure .utf8-bits{font:750 17px var(--mono);letter-spacing:.5px;text-anchor:middle}
.utf8-figure .utf8-label{fill:#344e43}
.utf8-figure .utf8-head{fill:#e9eeff;stroke:#5362a0;stroke-dasharray:3 2}
.utf8-figure .utf8-value{fill:#d2ebdc;stroke:#277354}
.utf8-figure .utf8-wire{fill:none;stroke:#187959;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.utf8-figure .utf8-result{font:750 19px var(--mono);text-anchor:middle}
.stored-byte{fill:#fff;stroke:#6a9481;stroke-width:1}
.stored-bits,.stored-hex,.stored-label{font:750 11px var(--mono);fill:#344e43}
.stored-bits .stored-prefix{fill:#5362a0}
.stored-hex{fill:#0f5a3c}
.stored-link{fill:none;stroke:#187959;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.screen-glyph{font:700 15px system-ui,sans-serif;fill:#eaf7ef;text-anchor:middle;dominant-baseline:central}
.bit-button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:54px;padding:4px 2px;border:1px solid #9fb7a9;border-radius:10px;background:#f6f8f5;line-height:1.2}
.bit-button .place{font:600 .75rem var(--mono);color:var(--muted)}
.bit-button .bit{font:700 1.15rem var(--mono);color:#7c8c85}
.bit-button:hover{border-color:var(--accent)}
.bit-button[aria-pressed=true]{background:#d2f4dd;border-color:var(--accent)}
.bit-button[aria-pressed=true] .place,.bit-button[aria-pressed=true] .bit{color:#0f5a3c}
.switch-actions{display:flex;gap:8px;align-items:center}
.view-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--border)}
.view-scale{min-width:4ch;text-align:center;color:var(--muted);font:700 .875rem var(--mono)}
.view-hint{color:var(--muted);font-size:.875rem;margin-inline-start:auto}
.iso-grid{fill:none;stroke:#86ad97;stroke-width:.6;stroke-opacity:.24}
.node .face{stroke-width:.8;stroke-linejoin:round}
.node .shadow{fill:#1f4434;opacity:.16}
.node .highlight{fill:none;stroke:#fff;stroke-opacity:.75;stroke-width:1.1;stroke-linecap:round}
.switch{cursor:pointer}
.switch .face,.switch .glow,.switch .digit,.switch .tag rect,.switch .tag text{transition:fill .18s,stroke .18s,opacity .18s}
.switch .left{fill:#d3dad6;stroke:#8c9d96}
.switch .right{fill:#b9c4be;stroke:#8c9d96}
.switch .top{fill:#eef1ef;stroke:#8c9d96}
.switch.on .left{fill:#a5d6b6;stroke:#4f8f6b}
.switch.on .right{fill:#78b592;stroke:#4f8f6b}
.switch.on .top{fill:#d2f4dd;stroke:#4f8f6b}
.switch .glow{fill:#4fcf87;opacity:0}
.switch.on .glow{opacity:.55}
.switch .digit{font:700 12px var(--mono);text-anchor:middle;dominant-baseline:central;fill:#7c8c85}
.switch.on .digit{fill:#0f5a3c}
.switch.on .tag rect{stroke:var(--accent)}
.switch.on .tag text{fill:var(--accent)}
.casing{fill:none;stroke:#eaf3eb;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.wire{fill:none;stroke-linecap:round;stroke-linejoin:round}
.wire.signal{stroke:var(--request);stroke-width:2.6}
.direction-tip{fill:var(--request)}
.tag rect{fill:#fff;fill-opacity:.94;stroke:#c9d6ce;stroke-width:.8}
.tag text{font:600 12px system-ui,sans-serif;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.tag.place text{font:700 11.5px var(--mono)}
.tag.kinds rect{rx:6}
.tag.kinds .bits{font-family:var(--mono)}
.tag.kinds .now{fill:var(--accent);font-weight:800}
.tag.empty{display:none}
.total rect{fill:#fff;stroke:var(--accent);stroke-width:1.2}
.total text{font:700 20px var(--mono);fill:var(--accent);text-anchor:middle;dominant-baseline:central}
.total.max rect{fill:#fff6ef;stroke:#a24c14}
.total.max text{fill:#a24c14}
.total{transform-box:fill-box;transform-origin:center}
.total.bump{animation:bump .32s ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
.note{animation:note 1.6s ease-out forwards}
.note .arc{fill:none;stroke:#43574f;stroke-width:1.4;stroke-linecap:round;stroke-dasharray:3 3.5}
.note .carry-tip{fill:#43574f}
.note text{font:700 9.5px system-ui,sans-serif;fill:#43574f;text-anchor:middle;paint-order:stroke;stroke:#eaf3eb;stroke-width:3.5px;stroke-linejoin:round}
@keyframes note{0%{opacity:0}10%{opacity:1}72%{opacity:1}100%{opacity:0}}
.packet{stroke:white;stroke-width:1.6;fill:var(--request)}
.packet-halo{opacity:.22;fill:var(--request)}
.packet-label{font:700 9.5px var(--mono);fill:#0f5a3c;text-anchor:middle;paint-order:stroke;stroke:#eaf3eb;stroke-width:3px;stroke-linejoin:round}
@media(prefers-reduced-motion:reduce){.switch .face,.switch .glow,.switch .digit,.switch .tag rect,.switch .tag text{transition:none}.note,.total.bump{animation:none}}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.875rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sample{width:22px;border-top:3px solid var(--request)}
.dot{width:13px;height:13px;border-radius:4px;border:1px solid #8c9d96;background:#eef1ef}
.dot.on{border-color:#4f8f6b;background:#bfecce}
.actions,.navigation{display:flex;gap:8px;flex-wrap:wrap}
.action{border:1px solid #9fb7a9;background:white;border-radius:9px;padding:7px 12px;min-height:44px;font-size:.875rem;font-weight:650}
.action:hover:not(:disabled):not([aria-disabled=true]){background:#e4f3f1}
.primary{background:var(--accent);color:white;border-color:var(--accent)}
.primary:hover:not(:disabled){background:#115e59}
.timeline{padding:15px 18px}
.timeline-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.timeline-top span{font:700 .875rem var(--mono);color:var(--muted)}
.steps{list-style:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0;margin:0;gap:8px}
.steps button{height:100%;min-height:52px;text-align:left;width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:#f6f8f5;font-size:.875rem;line-height:1.45;display:flex;gap:7px;align-items:center}
.steps button:hover{border-color:var(--accent)}
.steps button[aria-current=step]{background:#d5efeb;border-color:var(--accent);font-weight:750}
.step-number{font:700 .875rem var(--mono);color:var(--accent)}
.explanation{padding:clamp(20px,2.4vw,32px);display:flex;flex-direction:column;gap:20px}
.explanation h2{font-size:clamp(1.5rem,2.3vw,2.1rem);letter-spacing:-.055em;line-height:1.3}
.explanation p{color:var(--muted);font-size:1.0625rem;line-height:1.75}
.takeaway p{font-size:1rem}
.takeaway{padding:12px 14px;background:#e9f5f3;border-left:3px solid var(--accent);border-radius:0 9px 9px 0}
.takeaway strong{display:block;color:var(--accent);font-size:.875rem}
.navigation{justify-content:space-between;margin-top:auto;padding-top:8px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.codebook-figure { text-anchor: middle; fill: var(--ink); }
.codebook-figure text { font: 700 14px system-ui, sans-serif; }
.codebook-figure .codebook-value { font: 750 26px system-ui, sans-serif; }
.codebook-figure .codebook-card { fill: #f8fcf8; stroke: #739888; stroke-width: 1.5; }
.codebook-figure .codebook-table { fill: #e0efe7; stroke: #397a64; stroke-width: 1.5; }
.codebook-figure .codebook-arrow { fill: none; stroke: #187959; stroke-width: 2.4; marker-end: url(#text-intro-tip); }
.codebook-figure .codebook-separator { stroke: #a1b7ab; }
#scene .course-diagram .diagram-edge.active { marker-end: url(#text-intro-tip); }
#try[hidden], #readout[hidden], .switch-area[hidden], #letter-actions[hidden] { display: none; }
#letter-actions .actions { margin-block: 8px; }
#letter-actions button[aria-pressed=true] { border: 2px solid var(--accent); }
</style>

<script src="../shared/engine.js?v=18f6c6ea5ff4412f"></script>
<script defer blocking="render" src="../shared/catalog.js"></script>
<script defer blocking="render" src="./text.en.js"></script>

<body>
<main class="shell">
  <header>
    <p class="eyebrow">0장 컴퓨팅 둘러보기</p>
    <h1>글자의 번호표</h1>
    <p class="lead">"A"와 "가"는 어떤 비트가 될까요? 스위치로 번호를 만들고, 그 번호가 어떤 글자인지 확인해 보세요.</p>
  </header>
  <div class="workspace">
    <div>
      <section class="panel" aria-labelledby="stage-heading">
        <div class="stage-top"><h2 id="stage-heading">번호와 글자</h2></div>
        <div class="stage">
          <svg id="scene" viewBox="0 0 620 280" role="img" tabindex="0" aria-labelledby="scene-title scene-desc">
            <title id="scene-title">스위치로 만든 번호가 글자표에서 글자가 되는 장면</title><desc id="scene-desc"></desc>
            <defs>
              <marker id="text-intro-tip" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto">
                <path d="M 0 0 L 9 5 L 0 10 Z" fill="#187959"/>
              </marker>
              <marker id="utf8-stored-tip" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto">
                <path d="M 0 0 L 9 5 L 0 10 Z" fill="#187959"/>
              </marker>
              <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
              <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
              <radialGradient id="grid-fade"><stop offset=".45" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
              <mask id="grid-mask"><rect x="-460" y="-260" width="920" height="520" fill="url(#grid-fade)"/></mask>
            </defs>
            <g id="world" aria-hidden="true">
              <path id="grid" class="iso-grid" mask="url(#grid-mask)"></path>
              <g id="casings"></g><g id="links"></g><g id="nodes"></g><g id="packets"></g><g id="notes"></g>
            </g>
            <g id="letter-practice-drawing" class="codebook-figure" aria-hidden="true"></g>
          </svg>
        </div>
        <div class="hands-on">
          <div class="try" id="try">
            <p><strong>해 보기</strong><span id="try-text"></span></p>
            <p class="try-result" id="try-result" role="status"></p>
            <button class="action" id="try-next" type="button" hidden>다음 문제</button>
          </div>
          <div id="letter-actions" hidden>
            <p>보낸 번호 65를 어느 표로 읽을지 선택해 보세요.</p>
            <div class="actions">
              <button class="action" id="same-codebook" type="button" aria-pressed="false">같은 번호표</button>
              <button class="action" id="other-codebook" type="button" aria-pressed="false">다른 예시 번호표</button>
            </div>
            <p class="readout" id="letter-feedback" role="status"></p>
          </div>
          <p class="readout" id="readout"></p>
          <div class="switch-area">
            <div class="switch-row" id="switch-buttons" role="group" aria-label="스위치 켜고 끄기"></div>
            <div class="switch-actions">
              <button class="action" id="plus-one" type="button" aria-label="1 더하기">+1</button>
              <button class="action" id="clear" type="button">모두 끄기</button>
            </div>
          </div>
        </div>
        <div class="view-controls" role="group" aria-label="장면 보기">
          <button class="action" id="zoom-out" type="button" aria-label="장면 축소">−</button>
          <output class="view-scale" id="view-scale" aria-label="현재 배율" aria-live="off">100%</output>
          <button class="action" id="zoom-in" type="button" aria-label="장면 확대">+</button>
          <span class="view-hint">장면의 스위치를 눌러도 됩니다 · 확대 후 드래그로 이동</span>
        </div>
        <div class="controls">
          <div class="legend" aria-label="범례"><span><i class="sample"></i>값이 흐르는 선</span><span><i class="dot on"></i>켜짐 = 1</span><span><i class="dot"></i>꺼짐 = 0</span></div>
        </div>
        <nav class="timeline" aria-labelledby="timeline-heading">
          <div class="timeline-top"><h2 id="timeline-heading">타임라인</h2><span id="count"></span></div>
          <ol class="steps" id="steps"></ol>
        </nav>
      </section>
    </div>
    <section class="panel explanation" aria-labelledby="step-title">
      <h2 id="step-title"></h2><p id="body"></p>
      <div class="takeaway"><strong>관찰 포인트</strong><p id="takeaway"></p></div>
      <nav class="navigation" aria-label="이전 및 다음 단계"><button class="action" id="prev" type="button">이전 단계</button><button class="action primary" id="next" type="button">다음 단계</button></nav>
    </section>
  </div>
  <div class="sr-only" id="announcement" role="status"></div>
</main>
<template id="same-number-codebooks"><svg><g class="codebook-figure"></g></svg></template>
<template id="utf8-one-byte">
  <svg>
    <g class="utf8-figure">
      <text x="28" y="105" class="utf8-label">문자 번호</text>
      <text x="28" y="132" class="utf8-label">A · 65</text>
      <rect x="282" y="89" width="126" height="38" rx="4" class="utf8-value"/>
      <text x="345" y="114" class="utf8-bits">1000001</text>
      <path d="M345 130v42" class="utf8-wire" marker-end="url(#text-intro-tip)"/>
      <text x="255" y="164" class="utf8-label" text-anchor="end">고정 머리</text>
      <path d="M267 158v19" class="utf8-wire"/>
      <text x="28" y="200" class="utf8-label">UTF-8 · 1바이트</text>
      <rect x="249" y="180" width="159" height="42" rx="4" class="diagram-node"/>
      <rect x="249" y="180" width="33" height="42" rx="4" class="utf8-head"/>
      <rect x="282" y="180" width="126" height="42" rx="4" class="utf8-value"/>
      <text x="266" y="207" class="utf8-bits">0</text>
      <text x="345" y="207" class="utf8-bits">1000001</text>
      <text x="328" y="253" class="utf8-result">41</text>
      <text x="28" y="253" class="utf8-label">16진수</text>
    </g>
  </svg>
</template>
<template id="utf8-three-bytes">
  <svg>
    <g class="utf8-figure">
      <text x="28" y="86" class="utf8-label">문자 번호</text>
      <text x="28" y="113" class="utf8-label">가 · 44032</text>

      <text x="261" y="119" class="utf8-bits">1010</text>
      <text x="404" y="119" class="utf8-bits">110000</text>
      <text x="556" y="119" class="utf8-bits">000000</text>
      <path d="M261 134v38" class="utf8-wire" marker-end="url(#text-intro-tip)"/>
      <path d="M404 134v38" class="utf8-wire" marker-end="url(#text-intro-tip)"/>
      <path d="M556 134v38" class="utf8-wire" marker-end="url(#text-intro-tip)"/>
      <rect x="28" y="154" width="16" height="14" rx="3" class="utf8-head"/>
      <text x="52" y="166" class="utf8-label">고정 머리</text>
      <text x="28" y="199" class="utf8-label">UTF-8 · 3바이트</text>
      <text x="28" y="225" class="utf8-label">24비트</text>
      <rect x="152" y="180" width="73" height="42" rx="4" class="utf8-head"/>
      <rect x="225" y="180" width="73" height="42" rx="4" class="utf8-value"/>
      <rect x="304" y="180" width="48" height="42" rx="4" class="utf8-head"/>
      <rect x="352" y="180" width="104" height="42" rx="4" class="utf8-value"/>
      <rect x="462" y="180" width="42" height="42" rx="4" class="utf8-head"/>
      <rect x="504" y="180" width="104" height="42" rx="4" class="utf8-value"/>
      <text x="188" y="207" class="utf8-bits">1110</text>
      <text x="261" y="207" class="utf8-bits">1010</text>
      <text x="328" y="207" class="utf8-bits">10</text>
      <text x="404" y="207" class="utf8-bits">110000</text>
      <text x="483" y="207" class="utf8-bits">10</text>

function glyph(code) {
  if (code === 127) return 'DEL';
  if (code < 32 || (code > 127 && code < 160)) return '제어 문자';
  if (code === 32 || code === 160) return '공백';
  if (code >= 0xD800 && code <= 0xDFFF) return '없음';
  return String.fromCodePoint(code);
}

const utf8Bytes = (code) => hasGlyph(code) ? [...new TextEncoder().encode(String.fromCodePoint(code))] : [];

  return {
    head: bits.slice(0, headLength),
    data: bits.slice(headLength),
    hex: byte.toString(16).padStart(2, '0').toUpperCase(),
  };
}

    svg('tspan', { class: 'stored-prefix' }, label).textContent = head;
    svg('tspan', {}, label).textContent = data;
    svg('text', { x: x + 66, y: top + 15, class: 'stored-hex' }, group).textContent = hex;
  });
}

function placeStoredOutput(view) {
  if (!lesson[state.index].utf8 || !worldView.now) {
    view.output.removeAttribute('transform');
    view.outputLink.removeAttribute('d');
    return;
  }
  const [worldX, , scale] = worldView.now;
  const origin = worldX + 28 * view.c * scale;
  const halfWidth = Math.max(view.total.rect.width.baseVal.value, view.storageWidth) / 2;
  const labelSpace = view.storageWidth ? 48 : 0;
  const center = clamp(0, (10 - origin) / scale + halfWidth + labelSpace,
    (viewWidth - 14 - origin) / scale - halfWidth);
  view.output.setAttribute('transform', `translate(${center} 0)`);
  view.outputLink.setAttribute('d', `M0 48v3H${center}V${view.total.rect.y.baseVal.value}`);
}

// Wire path: along the floor x axis to the display's column, then along the y axis into it.
// On screen that is a V shape: down to the right, then up to the right. A back-row wire reaches the
// display's column behind the display, so its second part runs down to the left into it.
function updateGeometry(view, sum) {
  const { c, r } = view;
  const sx = sum.c - sum.r, sy = sum.c + sum.r;
  const screen = [[c - r, c + r], [sx, c + r], [sx, sy]].map(([x, y]) => project(x, y, laneHeight));
  const d = 'M' + screen.map((p) => p.join(' ')).join('L');
  view.lane.casing.setAttribute('d', d);
  view.lane.line.setAttribute('d', d);
  const [p, q] = screen;
  const angle = Math.atan2(q[1] - p[1], q[0] - p[0]) * 180 / Math.PI;
  const along = .56;
  const transform = `translate(${mix(p[0], q[0], along)} ${mix(p[1], q[1], along)}) rotate(${angle})`;
  view.lane.tip.setAttribute('transform', transform);
}

// Panels above the switch rows (rules in references/visual-language.md, 0장 "판").
// A step's `board` picks what they show, so the still picture carries the step's point:
// 'case' = the capital and small letter side by side with the one bit that differs,
// 'range' = how many numbers the switches can make, 'utf8' = the stored bytes and the UTF-8 length table.
const boards = {};
const spaced = (value, count) => value.toString(2).padStart(count, '0').replace(/(\d{4})(?=\d)/g, '$1 ');
function fillPlate(plate, parts) {
  plate.group.classList.toggle('empty', !parts.length);
  plate.label.replaceChildren(...parts.map(([text, className]) => {
    const span = svg('tspan', className ? { class: className } : {}, plate.label);
    span.textContent = text;
    return span;
  }));
  sizePlate(plate);
}
function showBoards() {
  if (!boards.main) {
    const group = svg('g', { id: 'boards' }, byId('world'));
    boards.main = addPlate(group, 'tag kinds', 0, 0, '', { pad: 1.6, round: false });
    // The page translation swaps the text (and resizes the plates) after this runs, so place them again then.
    new MutationObserver(() => requestAnimationFrame(placeBoards)).observe(group, { subtree: true, characterData: true, childList: true });
  }
  const step = lesson[state.index];
  const value = state.value;
  const main = [];
  if (step.board === 'case') {
    // Capital letters are 65–90 and small letters 97–122: they differ only in the 32 switch.
    const upper = value >= 97 && value <= 122 ? value - 32 : value;
    if (upper >= 65 && upper <= 90) {
      for (const code of [upper, upper + 32]) {
        const bits = spaced(code, 8);
        if (code !== upper) main.push([' · ']);
        main.push([String.fromCharCode(code) + ' ', code === value ? 'now' : ''],
          [bits.slice(0, 2), 'bits'], [bits[2], 'bits now'], [bits.slice(3), 'bits']);
      }
      main.push([' → 32 자리 하나만 다름']);
    } else {
      main.push([spaced(value, 8), 'bits now']);
    }
  } else if (step.board === 'range') {
    const count = step.switches;
    main.push(['번호를 쓴 16비트 '], [spaced(value, count), 'bits now']);
    main.push([' · 8비트로는 0~255뿐']);
  } else if (step.board === 'utf8') {
    main.push(['UTF-8 예 · '], ['A 65는 1바이트', value === 65 ? 'now' : ''],
      [' · '], ['가 44032는 3바이트', value === 44032 ? 'now' : '']);
  }
  boards.main.group.classList.toggle('long', step.switches > 2);
  fillPlate(boards.main, main);
}
// Keep the panels centred over the switch rows, just above the highest place-value plate.
function placeBoards() {
  if (!boards.main) return;
  const switches = [...nodeViews.values()].filter((view) => view.lane && view.to[2] === 1);
  if (!switches.length) return;
  const middle = switches.reduce((sum, view) => sum + 28 * view.c, 0) / switches.length;
  const top = Math.min(...switches.map((view) => view.lift - 14 * view.r + switchLow - view.height
    + Number(view.plate.rect.getAttribute('y'))));
  // A long panel (English) slides right rather than running off the scene's left edge.
  const [worldX, , worldScale] = worldView.now;
  const left = (8 - worldX) / worldScale;
  const plate = boards.main;
  const height = Number(plate.rect.getAttribute('height'));
  const x = Math.max(middle, left + Number(plate.rect.getAttribute('width')) / 2);
  plate.group.setAttribute('transform', `translate(${x} ${top - 6 - height / 2})`);
}

const isOn = (bit) => (state.value >> bit & 1) === 1;
const maxValue = () => 2 ** lesson[state.index].switches - 1;

// Point every node and wire at its target for the current step and value, then animate there.
function retarget(animate, ms = transitionMs) {
  const targets = layout(lesson[state.index].switches);
  for (const view of nodeViews.values()) {
    view.from = [view.c, view.r, view.opacity, view.lift];
    view.to = [view.c, view.r, 0, rise];
  }
  for (const [id, [c, r]] of Object.entries(targets)) {
    if (!nodeViews.has(id)) {
      const view = id === 'sum' ? createSum() : createSwitch(Number(id.slice(1)));
      Object.assign(view, { c, r, opacity: 0, lift: rise, from: [c, r, 0, rise] });
      nodeViews.set(id, view);
    }
    nodeViews.get(id).to = [c, r, 1, 0];
  }
  for (const view of nodeViews.values()) {
    if (!view.lane) continue;
    const on = isOn(view.bit) && view.to[2] === 1;
    view.node.classList.toggle('on', on);
    view.digit.textContent = on ? '1' : '0';
    view.lane.from = view.lane.opacity;
    view.lane.to = on ? 1 : 0;
    view.heightFrom = view.height;
    view.heightTo = on ? switchHigh : switchLow;
  }
  worldView.to = lesson[state.index].fit;
  worldView.from = worldView.now ?? worldView.to;
  const sum = nodeViews.get('sum');
  const {switches, utf8} = lesson[state.index];
  const bytes = utf8 ? utf8Bytes(state.value) : [];
  sum.total.label.textContent = `${state.value} → ${glyph(state.value)}${bytes.length ? ` · ${bytes.length}바이트` : ''}`;
  sum.total.group.classList.toggle('max', !hasGlyph(state.value));
  sum.total.group.classList.toggle('long', sum.total.label.textContent.length > 12);
  const shown = glyph(state.value);
  sum.screenGlyph.textContent = [...shown].length === 1 ? shown : '';
  // With a back row, its wires come down into the display past where the panel sits above it, so the panel
  // goes under the display's name instead.
  sum.total.y = utf8 || switches > 8 ? 64 : sum.totalY;
  sizePlate(sum.total);
  drawStoredOutput(sum, bytes);
  showBoards();
  // A small pulse on the total when it changes at a watchable pace.
  sum.total.group.classList.remove('bump');
  if (animate && ms === transitionMs && sum.shown !== state.value) {
    sum.total.group.getBBox();
    sum.total.group.classList.add('bump');
  }
  sum.shown = state.value;
  transition = animate && !motion.matches ? { start: performance.now(), ms } : null;
  updateScene(transition ? 0 : 1);
  kick();
}

function updateScene(t) {
  const ease = t * t * (3 - 2 * t);
  worldView.now = worldView.from.map((value, index) => mix(value, worldView.to[index], ease));
  const [worldX, worldY, worldScale] = worldView.now;
  byId('world').setAttribute('transform', `translate(${worldX} ${worldY}) scale(${worldScale})`);
  for (const view of nodeViews.values()) {
    [view.c, view.r, view.opacity, view.lift] = view.from.map((value, index) => mix(value, view.to[index], ease));
    view.node.setAttribute('transform', `translate(${28 * view.c} ${view.lift - 14 * view.r})`);
    view.node.setAttribute('opacity', view.opacity);
  }
  const sumAt = nodeViews.get('sum');
  for (const view of nodeViews.values()) {
    if (!view.lane) continue;
    view.lane.opacity = mix(view.lane.from, view.lane.to, ease);
    view.lane.group.setAttribute('opacity', view.lane.opacity);
    view.lane.casing.setAttribute('opacity', view.lane.opacity * .9);
    updateGeometry(view, sumAt);
    view.height = mix(view.heightFrom, view.heightTo, ease);
    shapeSwitch(view, view.height);
  }
  placeBoards();
  placeStoredOutput(sumAt);
  if (t !== 1) return;
  for (const [id, view] of nodeViews) {
    if (view.to[2] !== 0) continue;
    view.node.remove();
    view.lane?.group.remove();
    view.lane?.casing.remove();
    nodeViews.delete(id);
  }
  plates = plates.filter((plate) => plate.label.isConnected);
}

// A packet carries one switch's place value along its wire to the sum.
function sendPacket(bit) {
  const view = nodeViews.get('b' + bit);
  if (!view || motion.matches) return;
  const group = svg('g', {}, byId('packets'));
  svg('circle', { class: 'packet-halo', r: 9 }, group);
  svg('circle', { class: 'packet', r: 4.6 }, group);
  // The value hangs under the dot: the wire runs just in front of the switches to its right, and a value
  // above the dot sat on the next switch's base and read as that switch's value (visual-language.md 0장).
  const label = svg('text', { class: 'packet-label', y: 19 }, group);
  label.textContent = places[bit];
  const length = view.lane.line.getTotalLength();
  packets.push({ group, view, label, start: performance.now(), duration: Math.max(420, length / .27) });
  kick();
}

function clearPackets() {
  for (const packet of packets) packet.group.remove();
  packets = [];
  clearNote();
}

// Carry note: a dashed arrow in the air from the rightmost switch to the switch that
// just turned on, shown when adding 1 makes the lower switches roll over.
function clearNote() {
  byId('notes').replaceChildren();
}
function showCarry(toBit) {
  const from = nodeViews.get('b0'), to = nodeViews.get('b' + toBit);
  if (!from || !to) return;
  const x0 = 28 * from.to[0], y0 = plateY - 14 - 14 * from.to[1];
  const x1 = 28 * to.to[0], y1 = plateY + switchLow - switchHigh - 14 - 14 * to.to[1];
  const cx = (x0 + x1) / 2, cy = y1 - 18 - 2 * toBit;
  const note = svg('g', { class: 'note' }, byId('notes'));
  svg('path', { class: 'arc', d: `M${x0} ${y0}Q${cx} ${cy} ${x1} ${y1}` }, note);
  const angle = Math.atan2(y1 - cy, x1 - cx) * 180 / Math.PI;
  svg('path', { class: 'carry-tip', d: 'M-5 -4L0 0L-5 4Z', transform: `translate(${x1} ${y1}) rotate(${angle})` }, note);
  svg('text', { x: cx, y: (y0 + y1) / 4 + cy / 2 - 7 }, note).textContent = '자리올림';
  note.addEventListener('animationend', () => note.remove());
}

function movePackets(now) {
  packets = packets.filter((packet) => {
    const t = (now - packet.start) / packet.duration;
    const line = packet.view.lane.line;
    // A packet disappears on arrival, and also when its switch is turned off mid-flight.
    if (t >= 1 || !line.isConnected || !isOn(packet.view.bit)) { packet.group.remove(); return false; }
    // Travel only the visible part of the wire: from the edge of the switch to the edge of the display.
    const total = line.getTotalLength();
    const at = line.getPointAtLength(mix(Math.min(packetStart, total), Math.max(total - packetEnd, 0), Math.max(t, 0)));
    packet.group.setAttribute('transform', `translate(${at.x} ${at.y})`);
    return true;
  });
}

// Change the number. `send` picks which lit switches send a packet:
// 'new' = switches that just turned on, 'all' = every lit switch, 'none'.
function setValue(next, { send = 'new', ms = transitionMs, carry = true } = {}) {
  const previous = state.value;
  state.value = next;
  retarget(true, ms);
  syncControls();
  clearNote();
  // Adding 1 to a number that ends in 1 carries into the first switch that was off.
  if (carry && next === previous + 1 && previous & 1) showCarry(Math.log2(next & ~previous));
  if (send === 'none') return;
  for (let bit = lesson[state.index].switches - 1; bit >= 0; bit--) {
    const on = next >> bit & 1;
    if (on && (send === 'all' || !(previous >> bit & 1))) sendPacket(bit);
  }
}

function demoTick() {
  const demo = lesson[state.index].demo;
  setValue(demo.values[state.demoPosition], { send: 'all' });
  state.demoPosition = (state.demoPosition + 1) % demo.values.length;
  state.wait = demo.interval;
}

function tick(now) {
  frame = null;
  const elapsed = lastFrame === null ? 0 : Math.min(now - lastFrame, 80);
  lastFrame = now;
  if (transition) {
    const progress = clamp((now - transition.start) / transition.ms, 0, 1);
    updateScene(progress);
    if (progress === 1) transition = null;
  }
  if (isPlayingDemo()) {
    state.wait -= elapsed;
    if (state.wait <= 0) demoTick();
  }
  movePackets(now);
  // A demo tick above may already have scheduled the next frame through kick().
  if (!(isPlayingDemo() || transition || packets.length)) lastFrame = null;
  else if (frame === null) frame = requestAnimationFrame(tick);
}

function isSimulationView() {
  return workspace.classList.contains('course-reading') && !workspace.classList.contains('course-diagram-open');
}

function isPlayingDemo() {
  return state.playing && !motion.matches && isSimulationView();
}

function kick() {
  if (frame === null && !motion.matches && (isPlayingDemo() || transition || packets.length)) {
    frame = requestAnimationFrame(tick);
  }
}

function syncPlayback() {
  const reduced = motion.matches;
  if (reduced) {
    clearPackets();
    if (transition) { updateScene(1); transition = null; }
  }
  kick();
}

// The HTML switch buttons mirror the scene and are the keyboard and screen reader controls.
let bitButtons = [];
function buildButtons() {
  const count = lesson[state.index].switches;
  const row = byId('switch-buttons');
  row.style.setProperty('--cols', Math.min(count, 8));
  row.classList.toggle('wide', count > 8);
  row.replaceChildren();
  bitButtons = [];
  for (let bit = count - 1; bit >= 0; bit--) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'bit-button';
    const place = document.createElement('span');
    place.className = 'place';
    place.textContent = places[bit];
    const digit = document.createElement('span');
    digit.className = 'bit';
    button.append(place, digit);
    button.addEventListener('click', () => toggleBit(bit));
    row.append(button);
    bitButtons.push({ bit, button, digit });
  }
}

function syncControls() {
  const {switches: count, utf8} = lesson[state.index];
  for (const { bit, button, digit } of bitButtons) {
    const on = isOn(bit);
    button.setAttribute('aria-pressed', String(on));
    button.setAttribute('aria-label', `값 ${places[bit]} 스위치, ${on ? '켜짐' : '꺼짐'}`);
    digit.textContent = on ? '1' : '0';
  }
  byId('plus-one').disabled = state.value >= maxValue();
  byId('clear').disabled = state.value === 0;

  const bytes = utf8 ? utf8Bytes(state.value) : [];
  const digits = state.value.toString(2).padStart(count, '0');
  const binary = bytes.length === 3
    ? `${digits.slice(0, 4)} ${digits.slice(4, 10)} ${digits.slice(10)}`
    : spaced(state.value, count);
  const terms = places.filter((_, bit) => bit < count && isOn(bit)).reverse();
  const readout = byId('readout');
  const strong = (text, className) => {
    const element = document.createElement('b');
    if (className) element.className = className;
    element.textContent = text;
    return element;
  };
  const line = (...parts) => {
    const span = document.createElement('span');
    span.className = 'line';
    span.append(...parts);
    return span;
  };
  const numberLabel = utf8 ? `${count}비트 문자 번호 ` : '이진수 ';
  const lines = [line(numberLabel, strong(binary), ' → ',
    ...(terms.length > 1 ? [terms.join(' + ') + ' = '] : []), strong(String(state.value), 'total'),
    ' → ', strong(glyph(state.value), 'total'))];
  if (utf8) {
    const storage = line('UTF-8 ', bytes.length ? `(${bytes.length}바이트)` : strong('없음'));
    lines.push(storage);
    if (bytes.length) {
      const row = document.createElement('span');
      row.className = 'encoding-row';
      for (const [index, byte] of bytes.entries()) {
        const { head, data, hex } = byteParts(byte, index, bytes.length);
        const group = document.createElement('span');
        group.className = 'encoding-byte';
        const hexadecimal = document.createElement('span');
        hexadecimal.className = 'encoding-hex';
        hexadecimal.textContent = hex;
        const bitGroup = strong('');
        const prefix = document.createElement('span');
        prefix.className = 'encoding-head';
        prefix.textContent = head;
        bitGroup.append(prefix, data);
        group.append(bitGroup, hexadecimal);
        row.append(group);
      }
      lines.push(row);
      const key = document.createElement('span');
      key.className = 'encoding-head encoding-key';
      key.textContent = '고정 머리';
      storage.append(key);
    }
  }
  readout.replaceChildren(...lines);
}

// "16 + 2 + 1 = 19", or just "4" when a single switch is on.
function sumText() {
  const terms = places.filter((_, bit) => bit < lesson[state.index].switches && isOn(bit)).reverse();
  const number = terms.length > 1 ? `${terms.join(' + ')} = ${state.value}` : String(state.value);
  return `${number} → ${glyph(state.value)}`;
}

// Show the current try-it problem, or the result when the learner has just solved one.
function syncTask() {
  const tasks = lesson[state.index].tasks;
  const done = progress[state.index];
  const allDone = done >= tasks.length;
  byId('try').classList.toggle('solved', state.solved !== '');
  byId('try-text').textContent = state.solved !== '' ? tasks[done - 1].text
    : allDone ? '이 단계의 문제를 모두 풀었습니다. 스위치를 자유롭게 눌러 보세요.' : tasks[done].text;
  byId('try-result').textContent = state.solved === '' ? ''
    : `✓ 맞았습니다. ${state.solved}${allDone ? ' · 이 단계의 문제를 모두 풀었습니다.' : ''}`;
  byId('try-next').hidden = state.solved === '' || allDone;
}

// Only the learner's own changes count, so the demo cannot solve a problem.
function checkTask() {
  const tasks = lesson[state.index].tasks;
  const done = progress[state.index];
  if (state.solved !== '' || done >= tasks.length || state.value !== tasks[done].target) return;
  progress[state.index] = done + 1;
  state.solved = sumText();
  syncTask();
}

byId('try-next').onclick = () => {
  state.solved = '';
  syncTask();
  bitButtons[bitButtons.length - 1]?.button.focus();
};

function userChange(next, message) {
  state.playing = false;
  state.solved = '';  // a new move dismisses the last result and brings up the next problem
  setValue(next);
  syncPlayback();
  byId('announcement').textContent = `${message} 번호 ${state.value}, 글자 ${glyph(state.value)}`;
  syncTask();
  checkTask();
}

function toggleBit(bit) {
  if (bit >= lesson[state.index].switches) return;
  const turningOn = !isOn(bit);
  userChange(state.value ^ 1 << bit, `값 ${places[bit]} 스위치 ${turningOn ? '켜짐' : '꺼짐'}.`);
}

byId('plus-one').onclick = () => {
  if (state.value < maxValue()) userChange(state.value + 1, state.value & 1 ? '1을 더했습니다. 자리올림.' : '1을 더했습니다.');
};
byId('clear').onclick = () => userChange(0, '모두 껐습니다.');

function startStep() {
  const step = lesson[state.index];
  state.value = step.initial;
  state.demoPosition = 0;
  state.wait = step.demo.interval;
  clearPackets();
}

let selectedCodebook = null;

function codebookText(parent, x, y, value, style = '') {
  svg('text', {x, y, class: style}, parent).textContent = value;
}

function codebookBox(parent, x, y, width, height, style = 'codebook-card') {
  svg('rect', {x: x - width / 2, y: y - height / 2, width, height, rx: 7, class: style}, parent);
}

function codebookArrow(parent, start, end, y) {
  svg('line', {x1: start, x2: end, y1: y, y2: y, class: 'codebook-arrow'}, parent);
}

function codebookRow(drawing, y, chosen) {
  for (const [x, width, value] of [[89, 76, 'A'], [232, 78, '65'], [548, 76, chosen === 'same' ? 'A' : chosen === 'other' ? 'B' : '—']]) {
    codebookBox(drawing, x, y, width, 48);
    codebookText(drawing, x, y + 9, value, 'codebook-value');
  }
  codebookArrow(drawing, 132, 186, y);
  codebookArrow(drawing, 278, 317, y);
  codebookBox(drawing, 410, y, 156, 65, 'codebook-table');
  codebookText(drawing, 410, y - 6, chosen === 'same' ? '같은 번호표' : chosen === 'other' ? '다른 예시 번호표' : '번호표 선택 전');
  if (chosen) {
    codebookText(drawing, 410, y + 15, chosen === 'same' ? '65 = A · 66 = B' : '65 = B · 66 = A');
    codebookArrow(drawing, 493, 505, y);
  }
}

function renderCodebook(drawing, books) {
  drawing.replaceChildren();
  for (const [x, label] of [[89, '보낸 글자'], [232, '받은 번호'], [410, '받는 번호표'], [548, '나온 글자']]) {
    codebookText(drawing, x, 62, label);
  }
  if (books.length === 1) {
    codebookRow(drawing, 153, books[0]);
    return;
  }
  codebookRow(drawing, 112, books[0]);
  svg('line', {x1: 30, y1: 161, x2: 595, y2: 161, class: 'codebook-separator'}, drawing);
  codebookRow(drawing, 210, books[1]);
}

function codebookDescription() {
  if (selectedCodebook === 'same') return '보낸 65를 같은 번호표에서 찾았습니다. 화면에 A가 나옵니다.';
  if (selectedCodebook === 'other') return '보낸 65를 다른 예시 번호표에서 찾았습니다. 화면에 B가 나옵니다.';
  return '보내는 쪽은 A의 번호 65를 보냈습니다. 받는 번호표를 고르기 전이라 화면 글자가 없습니다.';
}

function syncCodebookPractice() {
  const reading = workspace.classList.contains('course-reading');
  const active = state.index === 0 && coursePracticeStarted && !reading;
  const live = state.index === 0 && reading && !workspace.classList.contains('course-diagram-open');
  const drawing = byId('letter-practice-drawing');
  byId('letter-actions').hidden = !active;
  byId('try').hidden = active;
  byId('readout').hidden = active;
  document.querySelector('.switch-area').hidden = active;
  byId('world').setAttribute('display', active || live ? 'none' : '');
  if (active) {
    renderCodebook(drawing, [selectedCodebook]);
    byId('scene-desc').textContent = codebookDescription();
  } else if (live) {
    renderCodebook(drawing, ['same', 'other']);
    byId('scene-desc').textContent = lesson[0].description;
  } else drawing.replaceChildren();
}

for (const [id, choice] of [['same-codebook', 'same'], ['other-codebook', 'other']]) {
  byId(id).onclick = () => {
    selectedCodebook = choice;
    byId('same-codebook').setAttribute('aria-pressed', String(choice === 'same'));
    byId('other-codebook').setAttribute('aria-pressed', String(choice === 'other'));
    byId('letter-feedback').textContent = codebookDescription();
    syncCodebookPractice();
  };
}
const codebookGuide = byId('same-number-codebooks').content.querySelector('g');
renderCodebook(codebookGuide, ['same', 'other']);
new MutationObserver(syncCodebookPractice).observe(workspace, {attributes: true, attributeFilter: ['class']});

function showStep(index, announce = true) {
  state.index = index;
  selectedCodebook = null;
  byId('same-codebook').setAttribute('aria-pressed', 'false');
  byId('other-codebook').setAttribute('aria-pressed', 'false');
  byId('letter-feedback').textContent = '';
  state.playing = !coursePracticeStarted && index > 0;
  startStep();
  const step = lesson[index];
  byId('step-title').textContent = step.title;
  byId('body').textContent = step.body;
  byId('takeaway').textContent = step.takeaway;
  byId('scene-desc').textContent = step.description;
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  stepButtons.forEach((button, i) => {
    if (i === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  state.solved = '';
  syncTask();
  buildButtons();
  retarget(announce);
  syncControls();
  syncPlayback();
  for (let bit = step.switches - 1; bit >= 0; bit--) if (isOn(bit)) sendPacket(bit);
  syncCodebookPractice();
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${step.title}`;
}

function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/text/${index + 1}`);
  showStep(index);
}

const stepButtons = lesson.map(({ label }, index) => {
  const listItem = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  const number = document.createElement('span');
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.addEventListener('click', () => goToStep(index));
  listItem.append(button);
  byId('steps').append(listItem);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
motion.addEventListener('change', syncPlayback);

let wasSimulation = false;
new MutationObserver(() => {
  const simulation = isSimulationView();
  if (wasSimulation && !simulation && state.playing) {
    // The illustration must not change the practice's representative input.
    startStep();
    clearNote();
    retarget(false);
    syncControls();
  }
  wasSimulation = simulation;
  kick();
}).observe(workspace, { attributes: true, attributeFilter: ['class'] });
window.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});
const initial = routeIndex();
history.replaceState(null, '', `#/text/${initial + 1}`);
showStep(initial, false);
</script>
</body>
</html>
