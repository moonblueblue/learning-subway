<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="데이터 크기를 바꿔 가며 O(1), O(log n), O(n), O(n²) 알고리즘이 하는 일의 횟수를 세고, 데이터가 늘 때 일이 얼마나 느는지 비교해 보세요.">
<title>시간 복잡도 · 레슨 4.1</title>
<style>
:root{color-scheme:light;--ink:#142620;--muted:#43574f;--border:#cbd9d0;--paper:#f4f7ef;--panel:#fff;--accent:#12634b;--request:#187959;--response:#5362a0;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.65 system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled,button[aria-disabled=true]{cursor:default;opacity:.5}
:focus-visible{outline:3px solid #a24c14;outline-offset:3px}
.shell{max-width:1280px;margin:auto;padding:clamp(16px,2.5vw,32px)}
header{margin-bottom:20px}
h1,h2,p{margin:0}
.eyebrow{color:var(--accent);font-size:.875rem;font-weight:700;margin-bottom:6px}
h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.12;letter-spacing:-.065em}
header p.lead{color:var(--muted);margin-top:10px}
.workspace{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(360px,1fr);gap:20px;align-items:stretch}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:18px;overflow:hidden}
.stage-top,.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;flex-wrap:wrap}
.stage-top h2,.timeline h2{font-size:1rem}
.status{color:var(--accent);font-size:.875rem;font-weight:700}
.stage{background:#eaf3eb;border-block:1px solid var(--border)}
svg{display:block;width:100%;height:auto;max-height:520px}
#scene{touch-action:pan-y;user-select:none}
#scene:focus-visible{outline-offset:-4px}
#scene.is-zoomed{cursor:grab;touch-action:none}
#scene.is-dragging{cursor:grabbing}
.hands-on{padding:14px 18px;border-bottom:1px solid var(--border);display:grid;gap:12px}
.try{display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:#eef5ed;border-left:3px solid var(--accent);border-radius:0 9px 9px 0;min-height:64px}
.try strong{color:var(--accent);font-size:.875rem;margin-right:6px}
.try-result{color:var(--accent);font-weight:700}
.try-result:empty{display:none}
.try.solved{background:#d2f4dd}
.readout{font-size:1rem;color:var(--muted)}
.readout b{color:var(--ink);font:700 1.1rem var(--mono);letter-spacing:.04em}
.switch-actions{display:flex;gap:8px;align-items:center}
.view-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--border)}
.view-scale{min-width:4ch;text-align:center;color:var(--muted);font:700 .875rem var(--mono)}
.view-hint{color:var(--muted);font-size:.875rem;margin-inline-start:auto}
.touch-hint{display:none}
@media(pointer:coarse){.mouse-hint{display:none}.touch-hint{display:inline}}
.iso-grid{fill:none;stroke:#86ad97;stroke-width:.6;stroke-opacity:.24}
.node .face{stroke-width:.8;stroke-linejoin:round}
.node .shadow{fill:#1f4434;opacity:.16}
.node .highlight{fill:none;stroke:#fff;stroke-opacity:.75;stroke-width:1.1;stroke-linecap:round}
.switch{cursor:pointer}
.switch .face,.switch .glow,.switch .digit,.switch .tag rect,.switch .tag text{transition:fill .18s,stroke .18s,opacity .18s}
.switch .left{fill:#d3dad6;stroke:#8c9d96}
.switch .right{fill:#b9c4be;stroke:#8c9d96}
.switch .top{fill:#eef1ef;stroke:#8c9d96}
.switch.on .left{fill:#a5d6b6;stroke:#4f8f6b}
.switch.on .right{fill:#78b592;stroke:#4f8f6b}
.switch.on .top{fill:#d2f4dd;stroke:#4f8f6b}
.switch .glow{fill:#4fcf87;opacity:0}
.switch.on .glow{opacity:.55}
.switch .digit{font:700 12px var(--mono);text-anchor:middle;dominant-baseline:central;fill:#7c8c85}
.switch.on .digit{fill:#0f5a3c}
.switch.on .tag rect{stroke:var(--accent)}
.switch.on .tag text{fill:var(--accent)}
.casing{fill:none;stroke:#eaf3eb;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.wire{fill:none;stroke-linecap:round;stroke-linejoin:round}
.wire.signal{stroke:var(--request);stroke-width:2.6}
.chevron{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chevron.signal{stroke:var(--request)}
.tag rect{fill:#fff;fill-opacity:.94;stroke:#c9d6ce;stroke-width:.8}
.tag text{font:600 12px system-ui,sans-serif;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.875rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sample{width:22px;border-top:3px solid var(--request)}
.dot{width:13px;height:13px;border-radius:4px;border:1px solid #8c9d96;background:#eef1ef}
.dot.on{border-color:#4f8f6b;background:#bfecce}
.actions,.navigation{display:flex;gap:8px;flex-wrap:wrap}
.action{border:1px solid #9fb7a9;background:white;border-radius:9px;padding:7px 12px;min-height:44px;font-size:.875rem;font-weight:650}
.action:hover:not(:disabled):not([aria-disabled=true]){background:#e8f4eb}
.primary{background:var(--accent);color:white;border-color:var(--accent)}
.primary:hover:not(:disabled){background:#0a4c3a}
.timeline{padding:15px 18px}
.timeline-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.timeline-top span{font:700 .875rem var(--mono);color:var(--muted)}
.steps{list-style:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0;margin:0;gap:8px}
.steps button{height:100%;min-height:52px;text-align:left;width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:#f6f8f5;font-size:.875rem;line-height:1.45;display:flex;gap:7px;align-items:center}
.steps button:hover{border-color:var(--accent)}
.steps button[aria-current=step]{background:#d9efe2;border-color:var(--accent);font-weight:750}
.step-number{font:700 .875rem var(--mono);color:var(--accent)}
.explanation{padding:clamp(20px,2.4vw,32px);display:flex;flex-direction:column;gap:20px}
.explanation h2{font-size:clamp(1.5rem,2.3vw,2.1rem);letter-spacing:-.055em;line-height:1.3}
.explanation p{color:var(--muted);font-size:1.0625rem;line-height:1.75}
.takeaway p{font-size:1rem}
.takeaway{padding:12px 14px;background:#eef5ed;border-left:3px solid var(--accent);border-radius:0 9px 9px 0}
.takeaway strong{display:block;color:var(--accent);font-size:.875rem}
.navigation{justify-content:space-between;margin-top:auto;padding-top:8px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(max-width:980px){.workspace{grid-template-columns:1fr}.navigation{margin-top:0}}
@media(max-width:560px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.truth{border-collapse:collapse;font:600 .9375rem var(--mono);text-align:center}
.truth caption{font:700 .8125rem system-ui,sans-serif;color:var(--muted);text-align:left;margin-bottom:4px}
.truth th,.truth td{border:1px solid var(--border);padding:3px 12px;min-width:44px}
.truth th{background:#f3f6f2;font-size:.8125rem}
.truth tr.current td{background:#d9efe2;font-weight:800}
.box .face{stroke-width:.8;transition:fill .12s}
.box .left{fill:#e6ebe8;stroke:#8c9d96}.box .right{fill:#cfd8d4;stroke:#8c9d96}.box .top{fill:#fff;stroke:#8c9d96}
.box.unused{opacity:.18}
.box.visit .top{fill:#ffd34d;stroke:#c9940f}.box.visit .left{fill:#f2d98a}.box.visit .right{fill:#e3c56c}
.box-value{font:700 8px var(--mono);fill:#43574f;text-anchor:middle;dominant-baseline:central}
.tower .face{stroke:var(--tower);stroke-width:.9}
.tower .left{fill:color-mix(in srgb,var(--tower) 45%,white)}.tower .right{fill:color-mix(in srgb,var(--tower) 62%,white)}.tower .top{fill:color-mix(in srgb,var(--tower) 20%,white)}
.tower-name rect{stroke:var(--tower);fill:#fff}.tower-name text{fill:var(--tower);font:800 12px var(--mono)}
.tower-value rect{stroke:var(--tower);fill:#fff}.tower-value text{font:800 12px var(--mono);fill:var(--ink)}
.tower-cap{font:800 10px system-ui,sans-serif;fill:#a24c14;text-anchor:middle}
.tower.over .top{fill:#fff;stroke-dasharray:3 2}
.dot.visit{background:#ffd34d;border-color:#c9940f}.dot.used{opacity:.25}
.run-area{display:flex;gap:12px 18px;flex-wrap:wrap;align-items:flex-start}
.run-controls{display:grid;gap:8px;flex:1 1 300px}
.size-row,.algo-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row-name{font-size:.8125rem;font-weight:800;color:var(--muted);min-width:4.2em}
.size-button{min-width:48px;min-height:44px;border:1px solid #9fb7a9;border-radius:9px;background:#fff;font:700 1rem var(--mono)}
.size-button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.algo-button{border-left:4px solid var(--tower)}
.algo-button b{font-family:var(--mono);color:var(--tower)}
.results td.empty{color:#b5c2bc}
.results td{white-space:nowrap}
.try-choices{display:flex;gap:6px;flex-wrap:wrap}
.try-choices:empty{display:none}
@media(max-width:600px){.tower-name text,.tower-value text{font-size:15px}.tower-cap{font-size:13px}.box-value{font-size:11px}}
@media(max-width:600px){.results{width:100%;font-size:.8125rem}.results td,.results th{white-space:normal;padding-inline:4px;min-width:0}}
</style>

<body>
<main class="shell">
  <header>
    <p class="eyebrow">4장 자료구조와 알고리즘 · 레슨 4.1</p>
    <h1>시간 복잡도</h1>
    <p class="lead">데이터가 10배 늘면 일은 몇 배 늘어날까요? 데이터 크기를 바꿔 가며 네 알고리즘이 하는 일의 횟수를 세어 보세요.</p>
  </header>
  <div class="workspace">
    <div>
      <section class="panel" aria-labelledby="stage-heading">
        <div class="stage-top"><h2 id="stage-heading">데이터와 일의 양</h2><span class="status" id="status">재생 중</span></div>
        <div class="stage">
          <svg id="scene" viewBox="0 0 620 280" role="img" tabindex="0" aria-labelledby="scene-title scene-desc">
            <title id="scene-title">알고리즘이 데이터 상자를 읽으며 일의 횟수 기둥이 자라는 장면</title><desc id="scene-desc"></desc>
            <defs>
              <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
              <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
              <radialGradient id="grid-fade"><stop offset=".45" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
              <mask id="grid-mask"><rect x="-460" y="-260" width="920" height="520" fill="url(#grid-fade)"/></mask>
            </defs>
            <g id="world" aria-hidden="true">
              <path id="grid" class="iso-grid" mask="url(#grid-mask)"></path>
              <g id="casings"></g><g id="links"></g><g id="nodes"></g><g id="packets"></g>
            </g>
          </svg>
        </div>
        <div class="hands-on">
          <div class="try" id="try">
            <p><strong>해 보기</strong><span id="try-text"></span></p>
            <p class="try-result" id="try-result" role="status"></p>
            <div class="try-choices" id="try-choices" role="group" aria-label="예측 고르기"></div>
          </div>
          <p class="readout" id="readout"></p>
          <div class="run-area">
            <div class="run-controls">
              <div class="size-row" id="size-row" role="group" aria-label="데이터 크기 고르기"></div>
              <div class="algo-row" id="algo-row" role="group" aria-label="알고리즘 실행"></div>
            </div>
            <table class="truth results" id="results"></table>
          </div>
        </div>
        <div class="view-controls" role="group" aria-label="장면 보기">
          <button class="action" id="zoom-out" type="button" aria-label="장면 축소">−</button>
          <output class="view-scale" id="view-scale" aria-label="현재 배율" aria-live="off">100%</output>
          <button class="action" id="zoom-in" type="button" aria-label="장면 확대">+</button>
          <button class="action" id="view-reset" type="button">원래 보기</button>
          <span class="view-hint"><span class="mouse-hint">확대 후 드래그로 이동</span><span class="touch-hint">두 손가락으로 확대</span></span>
        </div>
        <div class="controls">
          <div class="legend" aria-label="범례"><span><i class="dot visit"></i>지금 읽는 상자</span><span><i class="dot"></i>데이터 상자</span><span><i class="dot used"></i>이번 n에 쓰지 않는 상자</span></div>
          <div class="actions"><button class="action" id="pause" type="button">일시정지</button><button class="action" id="replay" type="button">다시 보기</button></div>
        </div>
        <nav class="timeline" aria-labelledby="timeline-heading">
          <div class="timeline-top"><h2 id="timeline-heading">타임라인</h2><span id="count"></span></div>
          <ol class="steps" id="steps"></ol>
        </nav>
      </section>
    </div>
    <section class="panel explanation" aria-labelledby="step-title">
      <h2 id="step-title"></h2><p id="body"></p>
      <div class="takeaway"><strong>관찰 포인트</strong><p id="takeaway"></p></div>
      <nav class="navigation" aria-label="이전 및 다음 단계"><button class="action" id="prev" type="button">이전 단계</button><button class="action primary" id="next" type="button">다음 단계</button></nav>
    </section>
  </div>
  <div class="sr-only" id="announcement" role="status"></div>
</main>
<script>
const byId = (id) => document.getElementById(id);
const viewport = byId('scene');
const viewWidth = 620;
const viewHeight = 280;
const maxZoom = 3;
const center = { x: viewWidth / 2, y: viewHeight / 2 };
const camera = { x: 0, y: 0, zoom: 1 };
const pointers = new Map();
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));



// Convert from screen pixels to fixed viewport coordinates, accounting for SVG letterboxing.


// A press that starts on a switch and ends without moving toggles that switch.
// Tracked separately from the camera pointers so it also works when the pointer is captured.
let tap = null;
viewport.addEventListener('pointerdown', (event) => {
  const target = event.target.closest?.('[data-input]');
  tap = target && event.button === 0 && pointers.size === 0
    ? { input: target.dataset.input, x: event.clientX, y: event.clientY, id: event.pointerId }
    : null;
});
viewport.addEventListener('pointerup', (event) => {
  if (tap && tap.id === event.pointerId && Math.hypot(event.clientX - tap.x, event.clientY - tap.y) < 8) {
    toggleInput(tap.input);
  }
  tap = null;
});
viewport.addEventListener('pointercancel', () => { tap = null; });

viewport.addEventListener('pointerdown', (event) => {
  if (event.button !== 0 || pointers.size >= 2) return;
  if (event.pointerType !== 'touch' && camera.zoom === 1) return;
  pointers.set(event.pointerId, viewportPoint(event));
  viewport.setPointerCapture(event.pointerId);
});
viewport.addEventListener('pointermove', (event) => {
  if (!pointers.has(event.pointerId)) return;
  const before = pointerGeometry();
  pointers.set(event.pointerId, viewportPoint(event));
  const after = pointerGeometry();
  const pinch = pointers.size === 2;
  if (pinch && (before.distance < 1 || after.distance < 1)) return;
  const zoom = pinch ? camera.zoom * after.distance / before.distance : camera.zoom;
  zoomBetween(zoom, before.point, after.point);
  viewport.classList.toggle('is-dragging', !pinch && camera.zoom > 1);
});
for (const eventName of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  viewport.addEventListener(eventName, (event) => {
    if (pointers.delete(event.pointerId)) viewport.classList.remove('is-dragging');
  });
}



byId('zoom-in').onclick = () => zoomBy(.25);
byId('zoom-out').onclick = () => zoomBy(-.25);
byId('view-reset').onclick = resetView;
viewport.addEventListener('keydown', (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const directions = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const direction = directions[event.key];
  if (direction && camera.zoom > 1) {
    event.preventDefault();
    setCamera(camera.x + direction[0] * 28 / camera.zoom, camera.y + direction[1] * 28 / camera.zoom, camera.zoom);
  } else if (event.key === '+' || event.key === '=' || event.key === '-') {
    event.preventDefault();
    zoomBy(event.key === '-' ? -.25 : .25);
  } else if (event.key === '0') {
    event.preventDefault();
    resetView();
  }
});
setCamera(0, 0, 1);
// Four algorithms on a row of n values, each counting its basic operations (reads or comparisons).
// `visits(n)` lists what one operation looks at: one box index, or a pair of indices.
const algorithms = {
  first: { name: '첫 값 읽기', big: 'O(1)', color: '#5362a0', count: () => 1, visits: () => [[0]] },
  sum: { name: '모두 더하기', big: 'O(n)', color: '#187959', count: (n) => n, visits: (n) => [...Array(n).keys()].map((i) => [i]) },
  pairs: { name: '같은 값 찾기', big: 'O(n²)', color: '#a24c14', count: (n) => n * (n - 1) / 2,
    visits: (n) => { const out = []; for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) out.push([i, j]); return out; } },
  binary: { name: '이진 탐색', big: 'O(log n)', color: '#7a4f9a', count: (n) => Math.floor(Math.log2(n)) + 1,
    visits: (n) => { const out = []; let lo = 0, hi = n - 1; while (lo <= hi) { const mid = (lo + hi) >> 1; out.push([mid]); if (mid === n - 1) break; lo = mid + 1; } return out; } },
};
const sizes = [4, 8, 16, 32];
const fmt = (value) => value >= 1e8 ? `${(value / 1e8).toLocaleString('ko-KR', { maximumFractionDigits: 1 })}억` : value >= 1e4 ? `${(value / 1e4).toLocaleString('ko-KR', { maximumFractionDigits: 1 })}만` : Math.round(value).toLocaleString('ko-KR');

// Each step offers some algorithms. Tasks are either runs (`test` gets the results table)
// or predictions (`ask`), and the learner does them in order.
const lesson = [
  {
    label: '상수와 선형',
    example: ["상자 n개", "모두 한 번씩 읽기", "n이 2배면 읽기도 2배"],
    title: '일의 양은 데이터 크기 n에 따라 늘어난다',
    body: '알고리즘이 빠른지 느린지는 초 단위보다 "데이터가 늘면 일이 얼마나 느나"로 비교합니다. 첫 값 읽기는 값이 4개든 100만 개든 한 번이면 끝납니다(O(1), 상수 시간). 모두 더하기는 값마다 한 번씩 읽어야 하므로 n이 2배면 일도 2배입니다(O(n), 선형 시간).',
    takeaway: '"모두 더하기"를 n = 8과 16으로 실행해 보면 읽기가 8번, 16번으로 기둥이 두 배가 됩니다. "첫 값 읽기"의 기둥은 n을 바꿔도 그대로입니다. 0.6의 선형 탐색이 O(n)입니다.',
    description: '왼쪽에 값 n개가 상자로 놓여 있고, 오른쪽에 알고리즘이 한 일의 횟수를 나타내는 기둥이 있습니다. 실행하면 점이 상자를 하나씩 읽고 기둥이 자랍니다.',
    algos: ['first', 'sum'],
    tasks: [
      { text: '"모두 더하기"를 n = 8과 n = 16으로 실행해 보세요.', test: (r) => r.sum?.[8] && r.sum?.[16], ok: '8번과 16번. n이 2배면 일도 2배입니다.' },
      { ask: 'n이 4에서 32로 8배가 되면 "첫 값 읽기"의 읽기 횟수는?', choices: ['그대로 1번', '8배', '32번'], answer: '그대로 1번', why: '첫 칸 하나만 읽으므로 데이터 크기와 상관없습니다. 이것이 O(1)입니다.' },
    ],
  },

const motion = matchMedia('(prefers-reduced-motion: reduce)');
const storageKey = 'complexity-lab:v1:step';
const state = { index: 0, n: 8, algo: null, playing: !motion.matches, userPaused: false, wait: 0, busy: false,
  results: {}, solved: '', wrong: '', demoPosition: 0, run: null };
const progress = lesson.map(() => 0);

const project = (x, y, z = 0) => [14 * (x + y), 7 * (x - y) - z];
const point = (x, y, z) => project(x, y, z).map((value) => +value.toFixed(2)).join(',');
const flat = (u, v, z = 0) => [14 * u, 7 * v - z];
const gridLines = [];
for (let i = -24; i <= 40; i += 2) gridLines.push(`M${point(i, -24, 0)}L${point(i, 40, 0)}M${point(-24, i, 0)}L${point(40, i, 0)}`);
byId('grid').setAttribute('d', gridLines.join(''));

function boxFaces(h, H) {
  return {
    left: [[-h, -h, 0], [h, -h, 0], [h, -h, H], [-h, -h, H]],
    right: [[h, -h, 0], [h, h, 0], [h, h, H], [h, -h, H]],
    top: [[-h, -h, H], [h, -h, H], [h, h, H], [-h, h, H]],
  };
}
function drawBox(node, h, H) {
  const faces = {};
  for (const [name, corners] of Object.entries(boxFaces(h, H))) faces[name] = svg('polygon', { class: 'face ' + name, points: corners.map((p) => point(...p)).join(' ') }, node);
  return faces;
}
let plates = [];
function addPlate(node, className, x, y, text, { pad = 1.3, round = false } = {}) {
  const group = svg('g', { class: className }, node);
  const plate = { group, rect: svg('rect', {}, group), label: svg('text', {}, group), x, y, pad, round };
  plate.label.textContent = text;
  plates.push(plate);
  sizePlate(plate);
  return plate;
}
function setPlate(plate, text, y) {
  if (y !== undefined) plate.y = y;
  plate.label.textContent = text;
  sizePlate(plate);
}
matchMedia('(max-width: 600px)').addEventListener('change', () => plates.forEach(sizePlate));

// ---------- Scene: a grid of n boxes and one tower per algorithm ----------
const perRow = 8;
const boxHalf = .5, boxHeight = 9;
const boxAt = (i) => ({ u: (i % perRow) * 2.05, v: Math.floor(i / perRow) * 3.6 - 5.4 });
const towerMax = 128;      // tallest tower drawn, in px
let boxes = [], towers = {};
function towerScale() {
  // The O(n) tower at the largest n is 120 px, so faster algorithms look short and O(n²) overflows.
  return 100 / 32;
}
function buildScene() {
  for (const id of ['casings', 'links', 'nodes', 'packets']) byId(id).replaceChildren();
  plates = [];
  boxes = [];
  towers = {};
  const n = state.n;
  for (let i = 0; i < 32; i++) {
    const { u, v } = boxAt(i);
    const node = svg('g', { class: 'node box' + (i < n ? '' : ' unused'), transform: `translate(${flat(u, v).join(' ')})` }, byId('nodes'));
    drawShadow(node, boxHalf);
    const faces = drawBox(node, boxHalf, boxHeight);
    const text = svg('text', { class: 'box-value', x: 0, y: -boxHeight + .5 }, node);
    text.textContent = lesson[state.index].algos.includes('binary') ? String(i * 3 + 2) : String((i * 7 + 3) % 10);
    boxes.push({ node, faces });
  }
  // How big the input is, above the first box: the towers are counts for this n.
  {
    const { u, v } = boxAt(0);
    const sizeNote = svg('g', { transform: `translate(${flat(u, v).join(' ')})` }, byId('nodes'));
    addPlate(sizeNote, 'tag tower-value', 0, -30, `n = ${n}`);
  }
  const algos = lesson[state.index].algos;
  algos.forEach((id, k) => {
    const u = 19.5 + k * 4.6, v = 1.4;
    const node = svg('g', { class: 'node tower', transform: `translate(${flat(u, v).join(' ')})`, style: `--tower:${algorithms[id].color}` }, byId('nodes'));
    drawShadow(node, .9);
    const faces = drawBox(node, .9, 0);
    const name = addPlate(node, 'tag tower-name', 0, 26, algorithms[id].big, { round: true });
    const value = addPlate(node, 'tag tower-value', 0, -30, '0');
    const cap = svg('text', { class: 'tower-cap', x: 0, y: -towerMax - 24 }, node);
    towers[id] = { node, faces, name, value, cap, height: 0 };
  });
  const right = 14 * (19.5 + (algos.length - 1) * 4.6) + 40;
  const left = -30, top = -towerMax - 44, bottom = 48;
  const scale = Math.min(1.6, 590 / (right - left), 268 / (bottom - top));
  const x = 310 - scale * (left + right) / 2, y = 140 - scale * (top + bottom) / 2;
  byId('world').setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${scale.toFixed(3)})`);
}
function setTower(id, ops) {
  const tower = towers[id];
  if (!tower) return;
  const raw = ops * towerScale();
  const H = Math.min(raw, towerMax);
  for (const [name, corners] of Object.entries(boxFaces(.9, Math.max(H, .5)))) tower.faces[name].setAttribute('points', corners.map((p) => point(...p)).join(' '));
  setPlate(tower.value, `${fmt(ops)}번${raw > towerMax ? ' ↑ 넘침' : ''}`, -H - 30);
  tower.cap.textContent = '';
  tower.node.classList.toggle('over', raw > towerMax);
}
function lightBoxes(indices, cls) {
  boxes.forEach((box, i) => box.node.classList.toggle(cls, indices.includes(i)));
}

// ---------- Running an algorithm ----------
// Operations play back over at most ~2.6 s, several per frame when there are many.
function run(id, user, done) {
  if (state.busy) return;
  const n = state.n;
  const visits = algorithms[id].visits(n);
  state.busy = true;
  state.algo = id;
  setTower(id, 0);
  const finish = () => {
    lightBoxes([], 'visit');
    setTower(id, visits.length);
    state.results[id] = { ...state.results[id], [n]: visits.length };
    state.busy = false;
    state.run = null;
    syncResults();
    report(`${algorithms[id].name}(${algorithms[id].big}), n = ${n}: ${fmt(visits.length)}번`);
    if (user) afterUser();
    syncControls();
    done?.();
  };
  if (motion.matches) { finish(); return; }
  const perOp = Math.max(2600 / visits.length, 3);
  state.run = { id, visits, start: performance.now(), perOp, finish };
  syncControls();
  kick();
}
function stepRun(now) {
  const r = state.run;
  if (!r) return;
  const done = Math.max(1, Math.min(Math.floor((now - r.start) / r.perOp) + 1, r.visits.length));
  lightBoxes(r.visits[done - 1], 'visit');
  setTower(r.id, done);
  byId('readout').textContent = `${algorithms[r.id].name}: ${done}번째 ${r.id === 'pairs' ? '비교' : '읽기'} · ${r.visits[done - 1].map((i) => i + '번').join('과 ')} 상자`;
  if (done >= r.visits.length && now - r.start >= r.perOp * r.visits.length + 250) r.finish();
}
function runAll(user) {
  const ids = lesson[state.index].algos;
  let k = 0;
  const next = () => { if (k < ids.length) run(ids[k++], false, next); else if (user) afterUser(); };
  next();
}

// ---------- Panel ----------
function buildControls() {
  const step = lesson[state.index];
  const sizeRow = byId('size-row');
  sizeRow.replaceChildren(Object.assign(document.createElement('span'), { className: 'row-name', textContent: '데이터 n' }));
  for (const n of sizes) {
    const b = Object.assign(document.createElement('button'), { type: 'button', className: 'size-button', textContent: n });
    b.addEventListener('click', () => { takeOver(); if (!state.busy) setSize(n); });
    sizeRow.append(b);
  }
  const algoRow = byId('algo-row');
  algoRow.replaceChildren(Object.assign(document.createElement('span'), { className: 'row-name', textContent: '실행' }));
  for (const id of step.algos) {
    const b = Object.assign(document.createElement('button'), { type: 'button', className: 'action algo-button', style: `--tower:${algorithms[id].color}` });
    b.append(Object.assign(document.createElement('b'), { textContent: algorithms[id].big }), ' ' + algorithms[id].name);
    b.addEventListener('click', () => { takeOver(); run(id, true); });
    algoRow.append(b);
  }
  if (step.all) {
    const b = Object.assign(document.createElement('button'), { type: 'button', className: 'action primary', textContent: '모두 실행' });
    b.addEventListener('click', () => { takeOver(); runAll(true); });
    algoRow.append(b);
  }
}
function setSize(n) {
  state.n = n;
  buildScene();
  for (const id of lesson[state.index].algos) setTower(id, state.results[id]?.[n] ?? 0);
  syncControls();
  report(`n = ${n}. 상자 ${n}개로 실행해 보세요.`);
}
function syncControls() {
  [...byId('size-row').querySelectorAll('button')].forEach((b) => {
    b.setAttribute('aria-pressed', String(Number(b.textContent) === state.n));
    b.disabled = state.busy && !state.playing;
  });
  [...byId('algo-row').querySelectorAll('button')].forEach((b) => { b.disabled = state.busy && !state.playing; });
}
// Results table: what the learner ran, by n; in the last step, predicted counts up to a million.
function syncResults() {
  const step = lesson[state.index];
  const table = byId('results');
  table.replaceChildren();
  const big = step.all;
  const ns = big ? [10, 100, 1000, 1e6] : sizes;
  table.append(Object.assign(document.createElement('caption'), { textContent: big ? '횟수 표 · 1초에 1억 번이라면 걸리는 시간' : '실행 기록 · 횟수' }));
  const head = document.createElement('tr');
  head.append(Object.assign(document.createElement('th'), { textContent: 'n' }));
  for (const id of step.algos) head.append(Object.assign(document.createElement('th'), { textContent: algorithms[id].big }));
  table.append(head);
  for (const n of ns) {
    const tr = document.createElement('tr');
    tr.append(Object.assign(document.createElement('td'), { textContent: fmt(n) }));
    for (const id of step.algos) {
      const ops = big ? algorithms[id].count(n) : state.results[id]?.[n];
      const td = document.createElement('td');
      td.textContent = ops === undefined ? '–' : `${fmt(ops)}번` + (big && n === 1e6 ? ` · ${duration(ops / 1e8)}` : '');
      td.classList.toggle('empty', ops === undefined);
      tr.append(td);
    }
    tr.classList.toggle('current', n === state.n);
    table.append(tr);
  }
}
const duration = (s) => s < 1e-3 ? '1ms 미만' : s < 1 ? `${Math.round(s * 1000)}ms` : s < 3600 ? `${Math.round(s / 60)}분` : `${(s / 3600).toFixed(1)}시간`;
function report(text) { byId('readout').textContent = text; }

// ---------- Tasks ----------
function currentTask() { return lesson[state.index].tasks[progress[state.index]]; }
function syncTask() {
  const tasks = lesson[state.index].tasks;
  const done = progress[state.index];
  const task = currentTask();
  const choices = byId('try-choices');
  choices.replaceChildren();
  byId('try').classList.toggle('solved', state.solved !== '' && !task?.ask);
  if (task?.ask) {
    byId('try-text').textContent = task.ask;
    byId('try-result').textContent = state.wrong || (state.solved ? `✓ 맞았습니다. ${state.solved}` : '');
    for (const choice of task.choices) {
      const b = Object.assign(document.createElement('button'), { type: 'button', className: 'action choice-button', textContent: choice });
      b.addEventListener('click', () => answer(choice));
      choices.append(b);
    }
    return;
  }
  byId('try-text').textContent = task ? task.text : (state.solved ? '' : '이 단계의 문제를 모두 풀었습니다. n과 알고리즘을 바꿔 가며 더 실행해 보세요.');
  byId('try-result').textContent = state.solved ? `✓ 맞았습니다. ${state.solved}${done >= tasks.length ? ' · 이 단계의 문제를 모두 풀었습니다.' : ''}` : '';
}
function afterUser() {
  const task = currentTask();
  if (!task || task.ask || !task.test(state.results)) return;
  progress[state.index]++;
  state.solved = task.ok;
  state.wrong = '';
  syncTask();
}
function answer(choice) {
  const task = currentTask();
  if (choice !== task.answer) { state.wrong = `✗ ${choice}이(가) 아닙니다. 다시 골라 보세요.`; syncTask(); return; }
  progress[state.index]++;
  state.wrong = '';
  state.solved = task.why;
  syncTask();
}

// ---------- Demo ----------
let frame = null, lastFrame = null;
function takeOver() {
  if (!state.playing) return;
  state.playing = false;
  if (state.run) state.run.finish();
  syncPlayback();
}
function demoTick() {
  if (state.busy) { state.wait = 300; return; }
  const step = lesson[state.index];
  const plan = step.algos.flatMap((id) => [8, 16].map((n) => [id, n]));
  const [id, n] = plan[state.demoPosition++ % plan.length];
  if (state.n !== n) setSize(n);
  run(id, false);
  state.wait = 4000;
}
function tick(now) {
  frame = null;
  const elapsed = lastFrame === null ? 0 : Math.min(now - lastFrame, 80);
  lastFrame = now;
  if (state.playing) {
    state.wait -= elapsed;
    if (state.wait <= 0) demoTick();
  }
  stepRun(now);
  if (state.playing || state.run) frame = requestAnimationFrame(tick);
  else lastFrame = null;
}
function kick() { if (frame === null) frame = requestAnimationFrame(tick); }
function syncPlayback() {
  const reduced = motion.matches;
  if (reduced) state.playing = false;
  byId('status').textContent = reduced ? '모션 감소 · 직접 조작' : state.playing ? '자동 실행 중' : '직접 조작';
  byId('pause').textContent = state.playing ? '일시정지' : '자동 실행';
  byId('pause').disabled = reduced;
  byId('replay').disabled = reduced;
  if (state.playing) kick();
  syncControls();
}

// ---------- Steps and routing ----------
function showStep(index, announce = true) {
  if (state.run) { state.run = null; state.busy = false; }
  state.index = index;
  if (!state.userPaused) state.playing = !motion.matches;
  const s = lesson[index];
  state.results = {};
  state.solved = '';
  state.wrong = '';
  state.demoPosition = 0;
  // The still picture uses the example's size where it names one (16 sorted boxes for halving).
  state.n = motion.matches && s.staticN ? s.staticN : s.all ? 32 : 8;
  byId('step-title').textContent = s.title;
  byId('body').textContent = s.body;
  byId('takeaway').textContent = s.takeaway;
  byId('scene-desc').textContent = s.description;
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  stepButtons.forEach((button, i) => {
    if (i === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  try { localStorage.setItem(storageKey, String(index)); } catch {}
  buildControls();
  setSize(state.n);
  // Nothing plays with reduced motion, so the still picture shows every tower after its run on this n.
  if (motion.matches) runAll(false);
  syncResults();
  syncTask();
  state.wait = 800;
  syncPlayback();
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${s.title}`;
}
function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/complexity/${index + 1}`);
  showStep(index);
}
function routeIndex() {
  const match = /^#\/complexity\/(\d+)$/.exec(location.hash);
  const routed = match ? Number(match[1]) - 1 : -1;
  if (routed >= 0 && routed < lesson.length) return routed;
  try {
    const stored = localStorage.getItem(storageKey);
    const index = Number(stored);
    if (stored !== null && Number.isInteger(index) && index >= 0 && index < lesson.length) return index;
  } catch {}
  return 0;
}
const stepButtons = lesson.map(({ label }, index) => {
  const listItem = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  const number = document.createElement('span');
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.addEventListener('click', () => goToStep(index));
  listItem.append(button);
  byId('steps').append(listItem);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
byId('pause').onclick = () => {
  state.playing = !state.playing;
  state.userPaused = !state.playing;
  if (state.playing) state.wait = 400;
  syncPlayback();
  byId('announcement').textContent = byId('status').textContent;
};
byId('replay').onclick = () => {
  state.playing = true;
  state.userPaused = false;
  state.demoPosition = 0;
  state.wait = 300;
  syncPlayback();
  byId('announcement').textContent = '처음부터 자동 실행';
};
window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
motion.addEventListener('change', () => {
  if (!motion.matches && !state.userPaused) state.playing = true;
  syncPlayback();
});
window.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});
const initial = routeIndex();
history.replaceState(null, '', `#/complexity/${initial + 1}`);
state.index = -1;
showStep(initial, false);
</script>
</body>
