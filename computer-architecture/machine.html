<style>

<body>
<main class="shell">
  <header>
    <p class="eyebrow">3장 컴퓨터를 바닥부터 · 레슨 3.6</p>
    <h1>기계어와 어셈블리</h1>
    <p class="lead">CPU가 알아듣는 말은 어떻게 생겼을까요? 스위치 8개로 명령 하나를 직접 적고 해석해 보세요.</p>
  </header>
  <div class="workspace">
    <div>
      <section class="panel" aria-labelledby="stage-heading">
        <div class="stage-top"><h2 id="stage-heading">명령 한 바이트와 해석기</h2></div>
        <div class="stage">
          <svg id="scene" viewBox="0 0 620 280" role="img" tabindex="0" aria-labelledby="scene-title scene-desc">
            <title id="scene-title">스위치 여덟 개가 만든 명령을 해석기가 읽는 장면</title><desc id="scene-desc"></desc>
            <defs>
              <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
              <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
              <radialGradient id="grid-fade"><stop offset=".45" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
              <mask id="grid-mask"><rect x="-460" y="-260" width="920" height="520" fill="url(#grid-fade)"/></mask>
            </defs>
            <g id="world" aria-hidden="true">
              <path id="grid" class="iso-grid" mask="url(#grid-mask)"></path>
              <g id="casings"></g><g id="links"></g><g id="nodes"></g><g id="packets"></g><g id="notes"></g><g id="notes-fixed"></g>
            </g>
          </svg>
        </div>
        <div class="hands-on">
          <div class="try" id="try">
            <p><strong>해 보기</strong><span id="try-text"></span></p>
            <p class="try-result" id="try-result" role="status"></p>
            <button class="action" id="try-next" type="button" hidden>다음 문제</button>
          </div>
          <p class="readout" id="readout"></p>
          <div class="switch-area">
            <div class="switch-row" id="switch-buttons" role="group" aria-label="스위치 켜고 끄기"></div>
            <table class="optable" id="optable" hidden></table>
            <div class="switch-actions">
              <button class="action" id="plus-one" type="button" aria-label="1 더하기" hidden>+1</button>
              <button class="action" id="clear" type="button">모두 끄기</button>
            </div>
          </div>
        </div>
        <div class="view-controls" role="group" aria-label="장면 보기">
          <button class="action" id="zoom-out" type="button" aria-label="장면 축소">−</button>
          <output class="view-scale" id="view-scale" aria-label="현재 배율" aria-live="off">100%</output>
          <button class="action" id="zoom-in" type="button" aria-label="장면 확대">+</button>
          <span class="view-hint"><span class="mouse-hint">장면의 스위치를 눌러도 됩니다 · 확대 후 드래그로 이동</span><span class="touch-hint">장면의 스위치를 눌러도 됩니다 · 두 손가락으로 확대</span></span>
        </div>
        <div class="controls">
          <div class="legend" aria-label="범례"><span><i class="dot f-op"></i>연산 코드</span><span><i class="dot f-reg"></i>레지스터</span><span><i class="dot f-addr"></i>주소</span><span><i class="sample"></i>켜진 비트의 선</span></div>
        </div>
        <nav class="timeline" aria-labelledby="timeline-heading">
          <div class="timeline-top"><h2 id="timeline-heading">타임라인</h2><span id="count"></span></div>
          <ol class="steps" id="steps"></ol>
        </nav>
      </section>
    </div>
    <section class="panel explanation" aria-labelledby="step-title">
      <h2 id="step-title"></h2><p id="body"></p>
      <div class="takeaway"><strong>관찰 포인트</strong><p id="takeaway"></p></div>
      <nav class="navigation" aria-label="이전 및 다음 단계"><button class="action" id="prev" type="button">이전 단계</button><button class="action primary" id="next" type="button">다음 단계</button></nav>

</main>
<script>
// Place value of each switch. Index = bit number, so places[0] is the rightmost switch.
const places = [1, 2, 4, 8, 16, 32, 64, 128];

// One instruction is one byte: bits 7–5 the operation code, bit 4 the register, bits 3–0 the address.
// `field(bit)` says which part a bit belongs to; `fieldValue(bit)` is its place value inside that part.
const fields = [
  { key: 'op', name: '연산 코드', bits: [7, 6, 5] },
  { key: 'reg', name: '레지스터', bits: [4] },
  { key: 'addr', name: '주소', bits: [3, 2, 1, 0] },
];
const field = (bit) => fields.find((f) => f.bits.includes(bit));
const fieldValue = (bit) => 2 ** (bit - Math.min(...field(bit).bits));
const opcodes = ['HALT', 'LOAD', 'STORE', 'ADD', 'SUB', 'JUMP', 'JZ', null];
const opMeaning = ['멈춤', '메모리 → 레지스터', '레지스터 → 메모리', 'A ← A + B', 'A ← A − B', 'PC ← 주소', 'Z면 PC ← 주소', '없는 명령'];
function decode(value) {
  const op = value >> 5, reg = value >> 4 & 1, addr = value & 15;
  const name = opcodes[op];
  const r = reg ? 'B' : 'A';
  if (name === null) return { op, reg, addr, text: '알 수 없는 명령' };
  if (name === 'LOAD' || name === 'STORE') return { op, reg, addr, text: `${name} ${r}, [${addr}]` };
  if (name === 'ADD' || name === 'SUB') return { op, reg, addr, text: `${name} A, B` };
  if (name === 'JUMP' || name === 'JZ') return { op, reg, addr, text: `${name} ${addr}` };
  return { op, reg, addr, text: name };
}
const charOf = (value) => value >= 32 && value < 127 ? `'${String.fromCharCode(value)}'` : value < 32 ? '제어 문자' : '–';

// Each step: the try-it problems (`target` byte), what the autoplay shows (`demo.values`),
// whether to show the operation-code table (`table`), and whether to read the byte three ways (`views`).
const lesson = [
  {
    label: '명령도 비트',
    example: ["0010 0101", "001 = LOAD · 0 = A", "5번지를 A로 읽기"],
    title: '명령 하나는 1바이트의 비트다',
    body: '3.5의 CPU가 읽은 "LOAD A, [5]"도 메모리 칸 안에서는 0과 1입니다. 이 CPU는 명령 하나를 8비트(1바이트)로 적고, 칸을 세 부분으로 나눕니다. 앞의 3비트는 할 일(연산 코드), 다음 1비트는 레지스터(0이면 A, 1이면 B), 마지막 4비트는 주소입니다. CPU가 알아듣는 이 비트가 기계어입니다.',
    takeaway: '스위치 위 색이 부분을 나눕니다. 연산 코드 001은 LOAD, 레지스터 0은 A, 주소 0101은 5라서 0010 0101은 "LOAD A, [5]"입니다. 같은 비트를 그냥 수로 읽으면 37입니다.',
    description: '스위치 여덟 개가 한 줄로 놓여 있고, 왼쪽 세 개는 연산 코드, 다음 하나는 레지스터, 오른쪽 네 개는 주소를 맡습니다. 줄 끝의 해석기가 켜진 비트를 읽어 어셈블리 명령으로 보여 줍니다.',
    initial: 128,
    // The still picture (reduced motion) shows the example: 0010 0101 = LOAD A, [5].
    staticInitial: 37,
    demo: { values: [37, 53, 0, 128], interval: 2600 },
    tasks: [
      { target: 37, text: '"LOAD A, [5]"를 만들어 보세요: 연산 001, 레지스터 0, 주소 0101.' },
      { target: 53, text: '레지스터만 바꿔 "LOAD B, [5]"를 만들어 보세요.' },
      { target: 0, text: '모든 비트가 0이면 무슨 명령일까요? 만들어 보세요.' },
    ],
  },
  {
    label: '연산 코드 표',
    readingDiagram: {
      title: "맨 앞의 001로 명령표 한 행을 찾는다",
      description: "연산 코드 001은 명령표에서 LOAD를 고릅니다. 주소 비트 0101은 따로 주소 5를 가리킵니다.",

const byId = (id) => document.getElementById(id);

// Convert from screen pixels to fixed viewport coordinates, accounting for SVG letterboxing.


// A press that starts on a switch and ends without moving toggles that switch.
// Tracked separately from the camera pointers so it also works when the pointer is captured.
let tap = null;
viewport.addEventListener('pointerdown', (event) => {
  const target = event.target.closest?.('[data-bit]');
  tap = target && event.button === 0 && pointers.size === 0
    ? { bit: Number(target.dataset.bit), x: event.clientX, y: event.clientY, id: event.pointerId }
    : null;
});
viewport.addEventListener('pointerup', (event) => {
  if (tap && tap.id === event.pointerId && Math.hypot(event.clientX - tap.x, event.clientY - tap.y) < 8) {
    toggleBit(tap.bit);
  }
  tap = null;
});
viewport.addEventListener('pointercancel', () => { tap = null; });

viewport.addEventListener('pointerdown', (event) => {
  if (event.button !== 0 || pointers.size >= 2) return;
  if (event.pointerType !== 'touch' && camera.zoom === 1) return;
  pointers.set(event.pointerId, viewportPoint(event));
  viewport.setPointerCapture(event.pointerId);
});
viewport.addEventListener('pointermove', (event) => {
  if (!pointers.has(event.pointerId)) return;
  const before = pointerGeometry();
  pointers.set(event.pointerId, viewportPoint(event));
  const after = pointerGeometry();
  const pinch = pointers.size === 2;
  if (pinch && (before.distance < 1 || after.distance < 1)) return;
  const zoom = pinch ? camera.zoom * after.distance / before.distance : camera.zoom;
  zoomBetween(zoom, before.point, after.point);
  viewport.classList.toggle('is-dragging', !pinch && camera.zoom > 1);
});
for (const eventName of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  viewport.addEventListener(eventName, (event) => {
    if (pointers.delete(event.pointerId)) viewport.classList.remove('is-dragging');
  });
}

const gridLines = [];

// Switches sit on the floor diagonal (x = y), which is a horizontal row on screen.
// The row ends at the sum display, and the whole group stays centred on `rowCenter`.
const spacing = 1.8;
const sumGap = 3.4;
const rowCenter = 1.7;
function layout(count) {
  const span = spacing * (count - 1) + sumGap;
  const start = rowCenter - span / 2;
  const at = {};
  for (let k = 0; k < count; k++) at['b' + (count - 1 - k)] = start + spacing * k;
  at.sum = start + span;
  return at;
}


function drawFaces(node, h, H, fills) {
  const faces = {
    left: [[-h, -h, 0], [h, -h, 0], [h, -h, H], [-h, -h, H]],
    right: [[h, -h, 0], [h, h, 0], [h, h, H], [h, -h, H]],
    top: [[-h, -h, H], [h, -h, H], [h, h, H], [-h, h, H]],
  };
  for (const [name, corners] of Object.entries(faces)) {
    const attrs = { class: 'face ' + name, points: corners.map((p) => point(...p)).join(' ') };
    if (fills) Object.assign(attrs, { fill: fills[name], stroke: fills.stroke });
    svg('polygon', attrs, node);
  }
  svg('path', { class: 'highlight', d: `M${point(-h, -h, H)}L${point(h, -h, H)}L${point(h, h, H)}` }, node);
}

// Plates are small labels whose box is sized to the text.
let plates = [];
function addPlate(node, className, x, y, text, { pad = 1.5, round = true } = {}) {
  const group = svg('g', { class: className }, node);
  const plate = { group, rect: svg('rect', {}, group), label: svg('text', {}, group), x, y, pad, round };
  plate.label.textContent = text;
  plates.push(plate);
  sizePlate(plate);
  return plate;
}
matchMedia('(max-width: 600px)').addEventListener('change', () => plates.forEach(sizePlate));

const switchHalf = .78;
const switchLow = 10;    // height when off
const switchHigh = 18;   // height when on: the switch pops up
const plateY = -switchLow - 14 * switchHalf - 13;

// Redraw a switch at height H. Called every frame while it pops up or sinks.
function shapeSwitch(view, H) {
  const h = switchHalf;
  const faces = {
    left: [[-h, -h, 0], [h, -h, 0], [h, -h, H], [-h, -h, H]],
    right: [[h, -h, 0], [h, h, 0], [h, h, H], [h, -h, H]],
    top: [[-h, -h, H], [h, -h, H], [h, h, H], [-h, h, H]],
  };
  for (const [name, corners] of Object.entries(faces)) {
    view.faces[name].setAttribute('points', corners.map((p) => point(...p)).join(' '));
  }
  view.highlight.setAttribute('d', `M${point(-h, -h, H)}L${point(h, -h, H)}L${point(h, h, H)}`);
  view.digit.setAttribute('y', -H + .5);
  view.plate.group.setAttribute('transform', `translate(0 ${switchLow - H})`);
}

function createSwitch(bit) {
  const node = svg('g', { class: 'node switch', 'data-bit': bit }, byId('nodes'));
  const h = switchHalf;
  drawShadow(node, h);
  // Light spilling onto the floor when the switch is on.
  const spill = [[-h, -h], [h, -h], [h, h], [-h, h]].map(([x, y]) => point(x * 1.9, y * 1.9, 0)).join(' ');
  svg('polygon', { class: 'glow', points: spill, filter: 'url(#soft-glow)' }, node);
  const faces = {};
  for (const name of ['left', 'right', 'top']) faces[name] = svg('polygon', { class: 'face ' + name }, node);
  const highlight = svg('path', { class: 'highlight' }, node);
  const digit = svg('text', { class: 'digit', x: 0 }, node);
  const plate = addPlate(node, `tag place f-${field(bit).key}`, 0, plateY, String(fieldValue(bit)), { pad: 1.1 });
  // Wire from this switch to the sum display.
  const casing = svg('path', { class: 'casing' }, byId('casings'));
  const group = svg('g', { class: 'lane' }, byId('links'));
  const line = svg('path', { class: 'wire signal' }, group);
  const chevron = svg('path', { class: 'chevron signal', d: 'M-5 -5.5L2.5 0L-5 5.5' }, group);
  const view = { node, bit, faces, highlight, digit, plate, height: switchLow, heightFrom: switchLow, heightTo: switchLow,
    lane: { casing, group, line, chevron, opacity: 0, from: 0, to: 0 } };
  shapeSwitch(view, switchLow);
  return view;
}

function createSum() {
  const node = svg('g', { class: 'node sum' }, byId('nodes'));
  const h = 1.5, H = 30;
  drawShadow(node, h);
  drawFaces(node, h, H, { top: '#f4f7f5', left: '#d7dfdb', right: '#b8c6c0', stroke: '#8c9d96' });
  const screen = [[-h + .35, -h, 7], [h - .35, -h, 7], [h - .35, -h, H - 6], [-h + .35, -h, H - 6]];
  svg('polygon', { points: screen.map((p) => point(...p)).join(' '), fill: '#34514a', opacity: .85 }, node);
  const glare = [screen[2], screen[3], [-h + .35, -h, H - 10], [h - .35, -h, H - 10]];
  svg('polygon', { points: glare.map((p) => point(...p)).join(' '), fill: '#fff', opacity: .12 }, node);
  const [cx, cy] = project(h, -h, 0);
  addPlate(node, 'tag', cx, cy + 16, '해석기');
  const total = addPlate(node, 'total', 0, -H - 14 * h - 20, '0', { pad: 1.1, round: false });
  const views = addPlate(node, 'tag views', 0, -H - 14 * h - 48, '', { pad: 1.2, round: false });
  // The plate is wider than the display, so its right end is kept at the display's right edge and it grows left.
  // The page translation changes the text after this, so it is placed again whenever the text changes.
  const place = () => {
    views.x = 0;
    sizePlate(views);
    views.x = 14 * 2 * h - Number(views.rect.getAttribute('width')) / 2;
    sizePlate(views);
  };
  views.place = place;
  new MutationObserver(() => requestAnimationFrame(place)).observe(views.label, { childList: true, characterData: true, subtree: true });
  return { node, total, views };
}

// Wire path: along the floor x axis to the display's column, then along the y axis into it.
// On screen that is a V shape: down to the right, then up to the right.
function updateGeometry(view, sumAt) {
  const c = view.c;
  const screen = [[c, c], [sumAt, c], [sumAt, sumAt]].map(([x, y]) => project(x, y, laneHeight));
  const d = 'M' + screen.map((p) => p.join(' ')).join('L');
  view.lane.casing.setAttribute('d', d);
  view.lane.line.setAttribute('d', d);
  const [p, q] = screen;
  const angle = Math.atan2(q[1] - p[1], q[0] - p[0]) * 180 / Math.PI;
  const transform = `translate(${mix(p[0], q[0], .56)} ${mix(p[1], q[1], .56)}) rotate(${angle})`;
  view.lane.chevron.setAttribute('transform', transform);
}

const isOn = (bit) => (state.value >> bit & 1) === 1;
const maxValue = () => 2 ** lesson[state.index].switches - 1;

// Point every node and wire at its target for the current step and value, then animate there.
function retarget(animate, ms = transitionMs) {
  const targets = layout(lesson[state.index].switches);
  for (const view of nodeViews.values()) {
    view.from = [view.c, view.opacity, view.lift];
    view.to = [view.c, 0, rise];
  }
  for (const [id, c] of Object.entries(targets)) {
    if (!nodeViews.has(id)) {
      const view = id === 'sum' ? createSum() : createSwitch(Number(id.slice(1)));
      Object.assign(view, { c, opacity: 0, lift: rise, from: [c, 0, rise] });
      nodeViews.set(id, view);
    }
    nodeViews.get(id).to = [c, 1, 0];
  }
  for (const view of nodeViews.values()) {
    if (!view.lane) continue;
    const on = isOn(view.bit) && view.to[1] === 1;
    view.node.classList.toggle('on', on);
    view.digit.textContent = on ? '1' : '0';
    view.lane.from = view.lane.opacity;
    view.lane.to = on ? 1 : 0;
    view.heightFrom = view.height;
    view.heightTo = on ? switchHigh : switchLow;
  }
  worldView.to = lesson[state.index].fit;
  worldView.from = worldView.now ?? worldView.to;
  const sum = nodeViews.get('sum');
  const decoded = decode(state.value);
  sum.total.label.textContent = decoded.text;
  sum.total.group.classList.toggle('max', decoded.op === 7);
  sizePlate(sum.total);
  // The small plate above the result says what this step is about, so the still pictures of steps 1–3 differ:
  // the code table lookup (2), assembly text turned into bits (3), the same byte read as a number and a letter (4).
  const step = lesson[state.index];
  const bits = state.value.toString(2).padStart(8, '0');
  const opBits = bits.slice(0, 3), regBit = bits[3], addrBits = bits.slice(4);
  sum.views.label.textContent = step.views ? `${bits.slice(0, 4)} ${bits.slice(4)} → 수 ${state.value} · 문자 ${charOf(state.value)}`
    : step.table && step.asm ? `${decoded.text} → ${opBits} · ${regBit} · ${addrBits}`
    : step.table ? `연산 코드 ${opBits} → 명령표 ${parseInt(opBits, 2)}번 = ${opcodes[parseInt(opBits, 2)] ?? '없음'}`
    : '';
  sum.views.group.style.display = sum.views.label.textContent ? '' : 'none';
  sum.views.place();
  syncGroups(targets);
  // A small pulse on the total when it changes at a watchable pace.
  sum.total.group.classList.remove('bump');
  if (animate && ms === transitionMs && sum.shown !== state.value) {
    sum.total.group.getBBox();
    sum.total.group.classList.add('bump');
  }
  sum.shown = state.value;
  transition = animate && !motion.matches ? { start: performance.now(), ms } : null;
  updateScene(transition ? 0 : 1);
  kick();
}

function updateScene(t) {
  const ease = t * t * (3 - 2 * t);
  worldView.now = worldView.from.map((value, index) => mix(value, worldView.to[index], ease));
  const [worldX, worldY, worldScale] = worldView.now;
  byId('world').setAttribute('transform', `translate(${worldX} ${worldY}) scale(${worldScale})`);
  for (const view of nodeViews.values()) {
    [view.c, view.opacity, view.lift] = view.from.map((value, index) => mix(value, view.to[index], ease));
    view.node.setAttribute('transform', `translate(${28 * view.c} ${view.lift})`);
    view.node.setAttribute('opacity', view.opacity);
  }
  const sumAt = nodeViews.get('sum').c;
  for (const view of nodeViews.values()) {
    if (!view.lane) continue;
    view.lane.opacity = mix(view.lane.from, view.lane.to, ease);
    view.lane.group.setAttribute('opacity', view.lane.opacity);
    view.lane.casing.setAttribute('opacity', view.lane.opacity * .9);
    updateGeometry(view, sumAt);
    view.height = mix(view.heightFrom, view.heightTo, ease);
    shapeSwitch(view, view.height);
  }
  if (t !== 1) return;
  for (const [id, view] of nodeViews) {
    if (view.to[1] !== 0) continue;
    view.node.remove();
    view.lane?.group.remove();
    view.lane?.casing.remove();
    nodeViews.delete(id);
  }
  plates = plates.filter((plate) => plate.label.isConnected);
}

// A packet carries one switch's place value along its wire to the sum.
function sendPacket(bit) {
  const view = nodeViews.get('b' + bit);
  if (!view || motion.matches) return;
  const group = svg('g', {}, byId('packets'));
  svg('circle', { class: 'packet-halo', r: 9 }, group);
  svg('circle', { class: 'packet', r: 4.6 }, group);
  svg('text', { class: 'packet-label', y: -10 }, group).textContent = '1';
  const length = view.lane.line.getTotalLength();
  packets.push({ group, view, start: performance.now(), duration: Math.max(420, length / .27) });
  kick();
}

function clearPackets() {
  for (const packet of packets) packet.group.remove();
  packets = [];
  clearNote();
}

// Carry note: a dashed arrow in the air from the rightmost switch to the switch that
// just turned on, shown when adding 1 makes the lower switches roll over.
function clearNote() {
  byId('notes').replaceChildren();
}
function showCarry(toBit) {
  const from = nodeViews.get('b0'), to = nodeViews.get('b' + toBit);
  if (!from || !to) return;
  const x0 = 28 * from.to[0], y0 = plateY - 14;
  const x1 = 28 * to.to[0], y1 = plateY + switchLow - switchHigh - 14;
  const cx = (x0 + x1) / 2, cy = y1 - 18 - 2 * toBit;
  const note = svg('g', { class: 'note' }, byId('notes'));
  svg('path', { class: 'arc', d: `M${x0} ${y0}Q${cx} ${cy} ${x1} ${y1}` }, note);
  const angle = Math.atan2(y1 - cy, x1 - cx) * 180 / Math.PI;
  svg('path', { d: 'M-5 -4L0 0L-5 4', transform: `translate(${x1} ${y1}) rotate(${angle})` }, note);
  svg('text', { x: cx, y: (y0 + y1) / 4 + cy / 2 - 7 }, note).textContent = '자리올림';
  note.addEventListener('animationend', () => note.remove());
}

function movePackets(now) {
  packets = packets.filter((packet) => {
    const t = (now - packet.start) / packet.duration;
    const line = packet.view.lane.line;
    // A packet disappears on arrival, and also when its switch is turned off mid-flight.
    if (t >= 1 || !line.isConnected || !isOn(packet.view.bit)) { packet.group.remove(); return false; }
    // Travel only the visible part of the wire: from the edge of the switch to the edge of the display.
    const total = line.getTotalLength();
    const at = line.getPointAtLength(mix(Math.min(packetStart, total), Math.max(total - packetEnd, 0), Math.max(t, 0)));
    packet.group.setAttribute('transform', `translate(${at.x} ${at.y})`);
    return true;
  });
}

// Change the number. `send` picks which lit switches send a packet:
// 'new' = switches that just turned on, 'all' = every lit switch, 'none'.
function setValue(next, { send = 'new', ms = transitionMs, carry = true } = {}) {
  const previous = state.value;
  state.value = next;
  retarget(true, ms);
  syncControls();
  clearNote();
  // Adding 1 to a number that ends in 1 carries into the first switch that was off.
  if (carry && next === previous + 1 && previous & 1) showCarry(Math.log2(next & ~previous));
  if (send === 'none') return;
  for (let bit = lesson[state.index].switches - 1; bit >= 0; bit--) {
    const on = next >> bit & 1;
    if (on && (send === 'all' || !(previous >> bit & 1))) sendPacket(bit);
  }
}

// Counting speeds up as it goes: slow enough to watch the first carries, then fast.
const countInterval = (value) => Math.max(110, 700 * .93 ** value);

function demoTick() {
  const demo = lesson[state.index].demo;
  if (demo.count) {
    if (state.value === 255) {
      setValue(0, { send: 'none' });
      state.wait = 1200;
      return;
    }
    const interval = countInterval(state.value);
    setValue(state.value + 1, { send: interval >= 400 ? 'new' : 'none', ms: Math.min(transitionMs, interval * .8), carry: interval >= 400 });
    state.wait = state.value === 255 ? 3200 : countInterval(state.value);
    return;
  }
  setValue(demo.values[state.demoPosition], { send: 'all' });
  state.demoPosition = (state.demoPosition + 1) % demo.values.length;
  state.wait = demo.interval;
}

function tick(now) {
  frame = null;
  const elapsed = lastFrame === null ? 0 : Math.min(now - lastFrame, 80);
  lastFrame = now;
  if (transition) {
    const progress = clamp((now - transition.start) / transition.ms, 0, 1);
    updateScene(progress);
    if (progress === 1) transition = null;
  }
  if (state.playing) {
    state.wait -= elapsed;
    if (state.wait <= 0) demoTick();
  }
  movePackets(now);
  // A demo tick above may already have scheduled the next frame through kick().
  if (!(state.playing || transition || packets.length)) lastFrame = null;
  else if (frame === null) frame = requestAnimationFrame(tick);
}

function kick() {
  if (frame === null && !motion.matches && (state.playing || transition || packets.length)) {
    frame = requestAnimationFrame(tick);
  }
}

function syncPlayback() {
  const reduced = motion.matches;
  if (reduced) {
    state.playing = false;
    clearPackets();
    if (transition) { updateScene(1); transition = null; }
  }
  kick();
}

// The HTML switch buttons mirror the scene and are the keyboard and screen reader controls.
let bitButtons = [];
function buildButtons() {
  const count = lesson[state.index].switches;
  const row = byId('switch-buttons');
  row.style.setProperty('--n', count);
  row.replaceChildren();
  bitButtons = [];
  for (let bit = count - 1; bit >= 0; bit--) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'bit-button';
    const place = document.createElement('span');
    place.className = 'place';
    place.textContent = fieldValue(bit);
    button.classList.add('f-' + field(bit).key);
    const digit = document.createElement('span');
    digit.className = 'bit';
    button.append(place, digit);
    button.addEventListener('click', () => toggleBit(bit));
    row.append(button);
    bitButtons.push({ bit, button, digit });
  }
}

function syncControls() {
  const count = lesson[state.index].switches;
  for (const { bit, button, digit } of bitButtons) {
    const on = isOn(bit);
    button.setAttribute('aria-pressed', String(on));
    button.setAttribute('aria-label', `${field(bit).name} 비트 ${fieldValue(bit)}, ${on ? '켜짐' : '꺼짐'}`);
    digit.textContent = on ? '1' : '0';
  }
  byId('plus-one').disabled = state.value >= maxValue();
  byId('clear').disabled = state.value === 0;

  // "기계어 0010 0101 (37) → 연산 001 = LOAD · 레지스터 0 = A · 주소 0101 = 5 → LOAD A, [5]"
  const bits = state.value.toString(2).padStart(8, '0');
  const d = decode(state.value);
  const strong = (text) => Object.assign(document.createElement('b'), { textContent: text });
  byId('readout').replaceChildren('기계어 ', strong(`${bits.slice(0, 4)} ${bits.slice(4)}`), ` (${state.value}) → 연산 ${bits.slice(0, 3)} = ${opcodes[d.op] ?? '없음'} · 레지스터 ${bits[3]} = ${d.reg ? 'B' : 'A'} · 주소 ${bits.slice(4)} = ${d.addr} → `,
    Object.assign(strong(d.text), { className: 'total' }));
  syncOptable(d.op);
}

// The operation-code table beside the switch buttons, with the current code's row highlighted.
function buildOptable() {
  const table = byId('optable');
  table.hidden = !lesson[state.index].table;
  table.replaceChildren();
  table.append(Object.assign(document.createElement('caption'), { textContent: '연산 코드 표' }));
  opcodes.forEach((name, op) => {
    const tr = document.createElement('tr');
    tr.append(Object.assign(document.createElement('td'), { className: 'code', textContent: op.toString(2).padStart(3, '0') }));
    tr.append(Object.assign(document.createElement('td'), { className: 'name', textContent: name ?? '–' }));
    tr.append(Object.assign(document.createElement('td'), { textContent: opMeaning[op] }));
    table.append(tr);
  });
}
function syncOptable(op) {
  [...byId('optable').querySelectorAll('tr')].forEach((tr, index) => tr.classList.toggle('current', index === op));
}

// Field labels above each group of switches: operation code, register, address.
let groupPlates = [];
function syncGroups(targets) {
  if (!groupPlates.length) {
    groupPlates = fields.map((f) => addPlate(byId('notes-fixed'), `tag group f-${f.key}`, 0, 0, f.name, { pad: 1.2, round: false }));
  }
  fields.forEach((f, k) => {
    const us = f.bits.map((bit) => targets['b' + bit]);
    const plate = groupPlates[k];
    plate.x = 28 * (Math.min(...us) + Math.max(...us)) / 2;
    plate.y = plateY - 34;
    sizePlate(plate);
  });
}

// "0010 0101 = LOAD A, [5]"
function sumText() {
  const bits = state.value.toString(2).padStart(8, '0');
  return `${bits.slice(0, 4)} ${bits.slice(4)} = ${decode(state.value).text}`;
}

// Show the current try-it problem, or the result when the learner has just solved one.
function syncTask() {
  const tasks = lesson[state.index].tasks;
  const done = progress[state.index];
  const allDone = done >= tasks.length;
  byId('try').classList.toggle('solved', state.solved !== '');
  byId('try-text').textContent = state.solved !== '' ? tasks[done - 1].text
    : allDone ? '이 단계의 문제를 모두 풀었습니다. 스위치를 자유롭게 눌러 보세요.' : tasks[done].text;
  byId('try-result').textContent = state.solved === '' ? ''
    : `✓ 맞았습니다. ${state.solved}${allDone ? ' · 이 단계의 문제를 모두 풀었습니다.' : ''}`;
  byId('try-next').hidden = state.solved === '' || allDone;
}

// Only the learner's own changes count, so the demo cannot solve a problem.
function checkTask() {
  const tasks = lesson[state.index].tasks;
  const done = progress[state.index];
  if (state.solved !== '' || done >= tasks.length || state.value !== tasks[done].target) return;
  progress[state.index] = done + 1;
  state.solved = sumText();
  syncTask();
}

byId('try-next').onclick = () => {
  state.solved = '';
  syncTask();
  bitButtons[bitButtons.length - 1]?.button.focus();
};

function userChange(next, message) {
  state.playing = false;
  state.solved = '';  // a new move dismisses the last result and brings up the next problem
  setValue(next);
  syncPlayback();
  byId('announcement').textContent = `${message} 합계 ${state.value}`;
  syncTask();
  checkTask();
}

function toggleBit(bit) {
  if (bit >= lesson[state.index].switches) return;
  const turningOn = !isOn(bit);
  userChange(state.value ^ 1 << bit, `${field(bit).name} 비트 ${fieldValue(bit)} ${turningOn ? '켜짐' : '꺼짐'}.`);
}

byId('plus-one').onclick = () => {
  if (state.value < maxValue()) userChange(state.value + 1, state.value & 1 ? '1을 더했습니다. 자리올림.' : '1을 더했습니다.');
};
byId('clear').onclick = () => userChange(0, '모두 껐습니다.');

function startStep() {
  const step = lesson[state.index];
  state.value = motion.matches && step.staticInitial !== undefined ? step.staticInitial : step.initial;
  state.demoPosition = 0;
  state.wait = step.demo.count ? 1100 : step.demo.interval;
  clearPackets();
}

function showStep(index, announce = true) {
  state.index = index;
  state.playing = !motion.matches;
  startStep();
  const step = lesson[index];
  byId('step-title').textContent = step.title;
  byId('body').textContent = step.body;
  byId('takeaway').textContent = step.takeaway;
  byId('scene-desc').textContent = step.description;
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  stepButtons.forEach((button, i) => {
    if (i === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  try { localStorage.setItem(storageKey, String(index)); } catch {}
  state.solved = '';
  syncTask();
  buildButtons();
  buildOptable();
  retarget(announce);
  syncControls();
  syncPlayback();
  for (let bit = step.switches - 1; bit >= 0; bit--) if (isOn(bit)) sendPacket(bit);
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${step.title}`;
}

function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/machine/${index + 1}`);
  showStep(index);
}

function routeIndex() {
  const match = /^#\/machine\/(\d+)$/.exec(location.hash);
  const routed = match ? Number(match[1]) - 1 : -1;
  if (routed >= 0 && routed < lesson.length) return routed;
  try {
    const stored = localStorage.getItem(storageKey);
    const index = Number(stored);
    if (stored !== null && Number.isInteger(index) && index >= 0 && index < lesson.length) return index;
  } catch {}
  return 0;
}

const stepButtons = lesson.map(({ label }, index) => {
  const listItem = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  const number = document.createElement('span');
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.addEventListener('click', () => goToStep(index));
  listItem.append(button);
  byId('steps').append(listItem);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
motion.addEventListener('change', () => {
  if (!motion.matches) state.playing = true;
  syncPlayback();
});
window.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});
const initial = routeIndex();
history.replaceState(null, '', `#/machine/${initial + 1}`);
showStep(initial, false);
</script>
</body>
</html>
