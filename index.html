<style>
:root{color-scheme:light;--ink:#142620;--muted:#43574f;--border:#cbd9d0;--rule:#dfe8e1;--paper:#f4f7ef;--panel:#fcfdfb;--scene:#eaf3eb;--accent:#0f766e;--accent-press:#115e59;--on-accent:#f4fbf6;--response:#5362a0;--active:#d5efeb;--hover:#e4f3f1;--focus:#a24c14;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.65 system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
a{color:inherit}
h1,h2{text-wrap:balance}
.shell{display:flex;flex-direction:column}
.map-pane{display:flex;flex-direction:column;min-height:0}
.map-pane h2{font-size:clamp(1rem,1.6vw,1.35rem);line-height:1.25;margin:0 0 6px}
.shell:has(.topic-heading:not([hidden])) .line-index{display:none}
.map.topic-pending{display:grid;place-items:center;text-align:center;padding:16px}
.topic-status{margin:0;color:var(--muted)}
.lang-switch{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--panel)}
.lang-switch button{border:0;background:none;padding:4px 12px;min-height:36px;font:600 13px system-ui,sans-serif;color:var(--muted);cursor:pointer}
.lang-switch button+button{border-inline-start:1px solid var(--border)}
.lang-switch .lang-short{display:none}
@media(max-width:719px){.lang-switch .lang-long{display:none}.lang-switch .lang-short{display:inline}}
.lang-switch button:hover{color:var(--ink)}
.lang-switch button:active{background:var(--rule)}
.lang-switch button[aria-pressed="true"]{background:var(--active);color:var(--ink)}
.maps{margin:0;padding:0;list-style:none;flex:1;min-height:0;display:flex}
.map{flex:1;min-width:0;min-height:0;background:var(--scene);border:1px solid var(--border);border-radius:14px;overflow:hidden}
ul.line-index{margin:0;padding:0;list-style:none;font:600 13px/1.6 system-ui,sans-serif;color:var(--ink)}
.line-index li>*{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:2px 6px;border-radius:6px;color:inherit;text-decoration:none}
.line-index li>span{color:var(--muted)}
.line-index a:hover,.line-index a:focus-visible{background:var(--hover);text-decoration:underline}
.line-index a:active{background:var(--active)}
.map a.here:hover .here-label{text-decoration:underline}
.map .line-link:hover .hit,.map .line-link:focus-visible .hit{fill:#e4f3f1}
.map .line-link:hover text,.map .line-link:focus-visible text{text-decoration:underline}
.map .line-link:active .hit{fill:#d5efeb}
.line-bar{width:18px;height:6px;border-radius:3px;background:var(--line);flex:none}
.line-pick{display:flex;align-items:center;gap:10px;min-height:44px;margin:0 0 12px;padding:0 12px;border:1px solid var(--border);border-radius:10px;background:var(--panel)}
.line-pick select{flex:1;min-width:0;min-height:42px;border:0;background:none;font:700 15px system-ui,sans-serif;color:var(--ink);cursor:pointer}
.line-pick:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.line-pick select:focus-visible{outline:none}
@media not ((min-width:720px) and (min-height:600px)){.line-index{display:none}}
@media(max-width:719px){.map{overflow:visible;padding:12px 8px}}
.map svg{display:block;width:100%;height:auto;overflow:visible}
.map svg text{font-family:system-ui,sans-serif}
.map a{text-decoration:none}
.map a:hover .name,.map a:focus-visible .name{text-decoration:underline}
.map a:active .name{opacity:.7}
@media(min-width:720px) and (min-height:600px){.shell{height:100dvh}.map svg{width:100%;height:100%}}
@media not ((min-width:720px) and (min-height:600px)){
  .shell{height:100dvh;min-height:0;padding:8px 12px}
  .map{display:flex;flex-direction:column;padding:6px 8px}
  .line-pick{flex:none;margin-bottom:4px}
  .map svg{flex:1;min-height:0;width:100%;height:0}
}
</style>
<link rel="stylesheet" href="./shared/map-topics.css?v=583cfc9afb489968">

<body>
<main class="shell map-shell">
<header class="map-mast">
<h1>Learning Subway</h1>
<div class="mast-center"><p class="tagline">컴퓨터가 실제로 어떻게 돌아가는지, 노선을 따라 한 역씩 그림으로 봅니다.</p></div>
<div data-lang-switch></div>
</header>
<div class="map-workspace">
<nav class="map-topics" data-no-i18n aria-label="학습 주제"></nav>
<section class="map-pane" aria-label="노선도">
<h2 class="topic-heading" data-no-i18n hidden></h2>
<ul class="maps" id="roadmaps"></ul>
</section>
</div>
</main>
<script>
// Rules for this page are in DESIGN.md ("허브 노선도"). Everything is drawn from courseCatalog.
addEventListener('DOMContentLoaded', () => {
  const SVG = 'http://www.w3.org/2000/svg';
  // One colour per line: the same lightness and chroma, hues spread round the wheel (DESIGN.md "허브 노선도").
  const LINE_COLOR = {
    'computer-science': '#009184', 'operating-systems': '#2b80bf', networking: '#7a6cbf', storage: '#a17000',
    infrastructure: '#b95954', devops: '#4f8c41',
  };
  const LINE_ORDER = Object.keys(LINE_COLOR);
  const colorOf = (id) => LINE_COLOR[id] || '#6b7d76';
  const make = (tag, attrs = {}, text) => {
    const node = tag.startsWith('svg:') ? document.createElementNS(SVG, tag.slice(4)) : document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
    if (text !== undefined) node.textContent = text;
    return node;
  };
  const tr = (text) => (window.courseI18n ? window.courseI18n.translate(text) : text);
  const groupsOf = (chapter) => [chapter, ...chapter.tracks];
  const refsOf = (chapter) => groupsOf(chapter).flatMap((group) => group.lessons.map((lesson) => lesson.ref));
  const roadmaps = courseCatalog.roadmaps.filter((roadmap) => roadmap.id !== 'ai').sort((a, b) =>
    (LINE_ORDER.indexOf(a.id) + 1 || 99) - (LINE_ORDER.indexOf(b.id) + 1 || 99));
  const byId = new Map(roadmaps.map((roadmap) => [roadmap.id, roadmap]));
  const trunk = roadmaps.find((roadmap) => !roadmap.branch);
  const branches = roadmaps.filter((roadmap) => roadmap.branch);

  // Which roadmaps pass through each lesson.
  const lines = new Map();
  for (const roadmap of roadmaps)
    for (const chapter of roadmap.chapters)
      for (const ref of refsOf(chapter)) lines.set(ref, new Set([...(lines.get(ref) || []), roadmap.id]));
  // A station is an interchange when a line branches off it, or when it shares lessons with another line beyond the
  // junction it hangs from (sharing with the junction is what the branch itself already shows).
  function stationsOf(roadmap) {
    const junction = roadmap.branch && byId.get(roadmap.branch.from).chapters.find((chapter) => chapter.id === roadmap.branch.chapter);
    const junctionRefs = new Set(junction ? refsOf(junction) : []);
    return roadmap.chapters.map((chapter) => {
      const refs = refsOf(chapter);
      const children = branches.filter((child) => child.branch.from === roadmap.id && child.branch.chapter === chapter.id);
      const shares = refs.some((ref) => [...lines.get(ref)].some((id) => id !== roadmap.id) && !junctionRefs.has(ref));
      return {
        label: chapter.id + ' ' + chapter.title, children, interchange: children.length > 0 || shares,
        // A chapter with no finished lesson yet is drawn as a station without a link.
        href: refs.length ? './' + refs[0] + '.html?roadmap=' + encodeURIComponent(roadmap.id) : null,
      };
    });
  }
  const built = (roadmap) => roadmap.chapters.some((chapter) => refsOf(chapter).length);

  // "현재 위치": the last lesson opened (course.js stores it), on the line it was opened through. A first visit starts
  // at the trunk's first station. The pin is red, used nowhere else, so it stands out on every line (DESIGN.md).
  function hereSpot() {
    let here = null;
    try { here = JSON.parse(localStorage.getItem('learning-subway:here')); } catch {}
    const through = (roadmap) => roadmap.chapters.findIndex((chapter) =>
      refsOf(chapter).includes(here?.ref) || (chapter.projectRef && chapter.projectRef === here?.ref));
    const roadmap = [byId.get(here?.roadmap), ...roadmaps].find((item) => item && through(item) >= 0);
    if (!roadmap) return { roadmap: trunk, index: 0, href: stationsOf(trunk)[0].href };
    return { roadmap, index: through(roadmap), href: './' + here.ref + '.html?roadmap=' + encodeURIComponent(roadmap.id) };
  }
  const PIN = '#d92d20', PIN_TEXT = '#b42318';
  const overlaps = (a, b, gap = -1) => a.x < b.x + b.width + gap && b.x < a.x + a.width + gap && a.y < b.y + b.height + gap && b.y < a.y + a.height + gap;
  // A map pin whose tip touches the station, and the words "현재 위치" where they cover no station name. The pin stands
  // above the station; if a neighbour's name is there it hangs below, and only if both sides are taken does the
  // neighbour's name step aside.
  function pin(svg, x, y, href, own, bounds, { inline = false } = {}) {
    const names = () => [...svg.querySelectorAll('text.name')];
    const others = () => names().filter((t) => t !== own).map((t) => t.getBBox());
    let size = inline ? 16 : 33;
    const headOf = (up) => (up ? { x: x - 12, y: y - 9 - size, width: 24, height: size } : { x: x - 12, y: y + 9, width: 24, height: size });
    const shiftText = (text, dy) => text.setAttribute('y', Number(text.getAttribute('y')) + dy);
    // Move the station's own name off the pin: to the other side of the station, else past the pin's head.
    function clearOwn(up) {
      if (!own || !overlaps(own.getBBox(), headOf(up))) return true;
      const box = own.getBBox(), head = headOf(up);
      const moves = up ? [y + 12 - box.y, head.y - 4 - (box.y + box.height)] : [y - 12 - (box.y + box.height), head.y + head.height + 4 - box.y];
      for (const dy of moves) {
        shiftText(own, dy);
        if (!others().some((b) => overlaps(b, own.getBBox(), 6)) && !overlaps(own.getBBox(), head)) return true;
        shiftText(own, -dy);
      }
      return false;
    }
    let up = true;
    if (!inline && (others().some((b) => overlaps(b, headOf(true), 2)) || !clearOwn(true))) {
      if (!others().some((b) => overlaps(b, headOf(false), 2)) && clearOwn(false)) up = false;
      else {
        // Both sides taken: whatever name sits where the pin's head goes above the station steps up past it.
        size = 24;
        const head = headOf(true);
        for (const text of names().filter((t) => overlaps(t.getBBox(), head, 2)))
          shiftText(text, head.y - 2 - (text.getBBox().y + text.getBBox().height));
      }
    }
    const f = size / 33, r = 11 * f, tip = inline ? y + 8 : up ? y - 9 : y + 9, k = up ? 1 : -1, c = tip - k * 21 * f;
    const link = make('svg:a', { href, class: 'here', 'aria-label': tr('현재 위치') });
    link.append(make('svg:path', { d: `M${x} ${tip}C${x} ${tip} ${x - r} ${tip - k * 12 * f} ${x - r} ${c}A${r} ${r} 0 0 ${up ? 1 : 0} ${x + r} ${c}C${x + r} ${tip - k * 12 * f} ${x} ${tip} ${x} ${tip}Z`, fill: PIN, stroke: '#ffffff', 'stroke-width': 2 }));
    link.append(make('svg:circle', { cx: x, cy: c, r: 4.5 * f, fill: '#ffffff' }));
    const label = make('svg:text', { 'font-size': 13, 'font-weight': 700, fill: PIN_TEXT, class: 'here-label' }, tr('현재 위치'));
    link.append(label);
    svg.append(link);
    const taken = [...others(), ...(own ? [own.getBBox()] : [])];
    const spots = inline ? [[x + 13, y + 4.5, 'start']]
      : [[x + 16, c + 5, 'start'], [x - 16, c + 5, 'end'], [x, up ? c - 17 : c + 27, 'middle']];
    for (const [lx, ly, anchor] of spots) {
      label.setAttribute('x', lx); label.setAttribute('y', ly); label.setAttribute('text-anchor', anchor);
      const box = label.getBBox();
      if (box.x >= bounds[0] && box.x + box.width <= bounds[1] && !taken.some((b) => overlaps(b, box, 4))) return;
    }
    label.remove();   // no free room: the pin alone, its name read by screen readers and on hover
    link.append(make('svg:title', {}, tr('현재 위치')));
  }

  const measure = document.createElement('canvas').getContext('2d');
  // Wrap a name into lines no wider than max (CJK words stay whole, as in the lessons).
  function wrap(text, max) {
    measure.font = '700 13px system-ui, sans-serif';
    const out = [];
    for (const word of text.split(' ')) {
      const last = out.at(-1);
      if (last && measure.measureText(last + ' ' + word).width <= max) out[out.length - 1] = last + ' ' + word;
      else out.push(word);
    }
    return out;
  }
  function station(svg, s, x, y, color, last, pos, max = 160, bounds = [6, Infinity]) {
    // pos: up | down | right | up-left | up-right | down-left | down-right (beside a line that branches off here)
    const name = tr(s.label);
    const link = s.href ? make('svg:a', { href: s.href, 'aria-label': name })
      : make('svg:g', { role: 'img', 'aria-label': name + ', ' + tr('준비 중') });
    if (s.interchange) link.append(make('svg:rect', { x: x - 13, y: y - 9, width: 26, height: 18, rx: 9, fill: '#fcfdfb', stroke: '#142620', 'stroke-width': 2.5 }));
    else link.append(make('svg:circle', { cx: x, cy: y, r: 7, fill: last && s.href ? color : '#fcfdfb', stroke: color, 'stroke-width': 3, ...(s.href ? {} : { 'stroke-dasharray': '3 3' }) }));
    const side = pos.endsWith('left') ? -1 : pos.endsWith('right') ? 1 : 0;
    const lines = wrap(name, max), width = Math.max(...lines.map((line) => measure.measureText(line).width));
    // Keep the name inside the map: move it in from an edge rather than letting it be cut off.
    let tx = x + side * 22;
    const left = side < 0 ? tx - width : side > 0 ? tx : tx - width / 2;
    tx += Math.max(0, bounds[0] - left) - Math.max(0, left + width - bounds[1]);
    const ty = pos === 'right' ? y + 4.5 : pos.startsWith('up') ? y - 16 - (lines.length - 1) * 15 : y + 26;
    const text = make('svg:text', {
      x: tx, y: ty, class: 'name', 'font-size': 13, 'font-weight': 700,
      'text-anchor': side < 0 ? 'end' : side > 0 ? 'start' : 'middle', fill: s.href ? '#142620' : '#6b7d76',
    });
    lines.forEach((line, i) => text.append(make('svg:tspan', { x: tx, dy: i ? 15 : 0 }, line)));
    link.append(text);
    svg.append(link);
    return text;
  }
  const strokeOf = (roadmap) => ({ stroke: colorOf(roadmap.id), 'stroke-width': 8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', fill: 'none', ...(built(roadmap) ? {} : { opacity: .45 }) });

  // A sidebar leaves long station names less space. Move a colliding label near its own marker.
  function separateNames(svg, width, height) {
    const names = [...svg.querySelectorAll('text.name')];
    const markers = names.map(name => name.parentNode.firstElementChild.getBBox());
    const pinParts = [...svg.querySelectorAll('a.here path, .here-label')].map(node => node.getBBox());
    for (const name of names) {
      const box = name.getBBox();
      const others = names.filter(other => other !== name).map(other => other.getBBox()).concat(pinParts);
      if (!others.some(other => overlaps(box, other, 1))) continue;
      const near = [...others, ...markers];
      const x = Number(name.getAttribute('x')), y = Number(name.getAttribute('y'));
      const marker = name.parentNode.firstElementChild.getBBox();
      const cx = marker.x + marker.width/2;
      const beside = [marker.x - 5 - (box.x + box.width), marker.x + marker.width + 5 - box.x];
      const above = marker.y - 5 - (box.y + box.height), below = marker.y + marker.height + 5 - box.y;
      const center = cx - (box.x + box.width/2);
      const positions = [[0,-6],[0,6],[-10,0],[10,0],[0,-13],[0,13],
        [center,above],[center,below], ...beside.flatMap(dx => [[dx,0],[dx,above],[dx,below]])];
      for (const [dx,dy] of positions) {
        const moved = {x:box.x+dx, y:box.y+dy, width:box.width, height:box.height};
        if (moved.x < 2 || moved.y < 2 || moved.x+box.width > width-2 || moved.y+box.height > height-2) continue;
        if (near.some(other => overlaps(moved, other, 1))) continue;
        name.setAttribute('x', x+dx);
        name.setAttribute('y', y+dy);
        name.querySelectorAll('tspan').forEach(span => span.setAttribute('x', x+dx));
        break;
      }
    }
  }

  function lineHref(roadmap) {
    const first = roadmap.chapters.flatMap(refsOf)[0];
    return first ? './' + first + '.html?roadmap=' + encodeURIComponent(roadmap.id) : null;
  }
  const lineTitle = (roadmap) => tr(`${roadmap.title} 첫 레슨으로`);

  // The line index sits in the masthead, outside the map, so it never covers a station.
  function lineIndex() {
    const list = make('ul', { class: 'line-index', 'aria-label': tr('노선') });
    for (const roadmap of roadmaps) {
      const item = make('li');
      item.style.setProperty('--line', colorOf(roadmap.id));
      // Each line's name leads to its first finished lesson; a line with none yet is not a link.
      const href = lineHref(roadmap);
      const target = href ? make('a', { href, title: lineTitle(roadmap) }) : make('span', { title: tr('준비 중') });
      target.append(make('span', { class: 'line-bar', 'aria-hidden': 'true' }), tr(roadmap.title));
      item.append(target);
      list.append(item);
    }
    list.style.setProperty('--line-count', roadmaps.length);
    list.style.setProperty('--legend-columns', Math.ceil(roadmaps.length / 2));
    const center = document.querySelector('.mast-center');
    const old = center.querySelector('.line-index');
    if (old) old.replaceWith(list); else center.append(list);
  }

  // On a wide map the line index sits in the bottom-left corner in two rows, where no line runs. If anything is in
  // that corner (a short window, long English names) it is taken out again and the masthead keeps the index.
  function mapIndex(svg, W, H) {
    measure.font = '600 13px system-ui, sans-serif';
    const items = roadmaps.map((roadmap) => ({ roadmap, name: tr(roadmap.title) }));
    items.forEach((item) => { item.w = 24 + measure.measureText(item.name).width; });
    const per = Math.ceil(items.length / 2), rows = [items.slice(0, per), items.slice(per)];
    const columnWidth = Math.ceil(Math.max(...items.map(item => item.w)));
    const pitch = columnWidth + 12;
    const w = (per - 1) * pitch + columnWidth + 24, h = 2 * 24 + 12, x0 = 12, y0 = H - 12 - h;
    const group = make('svg:g', { class: 'line-index' });
    group.append(make('svg:rect', { x: x0, y: y0, width: w, height: h, rx: 8, fill: '#fcfdfb', stroke: '#cbd9d0' }));
    rows.forEach((row, r) => {
      const y = y0 + 6 + 24 * r + 12;
      row.forEach(({ roadmap, name }, column) => {
        const x = x0 + 12 + column * pitch;
        const href = lineHref(roadmap);
        const target = href ? make('svg:a', { href, class: 'line-link' }) : make('svg:g', { role: 'img', 'aria-label': tr(roadmap.title) + ', ' + tr('준비 중') });
        if (href) target.append(make('svg:title', {}, lineTitle(roadmap)));
        target.append(make('svg:rect', { x: x - 4, y: y - 11, width: columnWidth + 8, height: 22, rx: 5, class: 'hit', fill: 'transparent' }));
        target.append(make('svg:rect', { class:'line-swatch', x, y: y - 3, width: 18, height: 6, rx: 3, fill: colorOf(roadmap.id) }));
        target.append(make('svg:text', { x: x + 24, y: y + 4.5, 'font-size': 13, 'font-weight': 600, fill: href ? '#142620' : '#43574f' }, name));
        group.append(target);
      });
    });
    svg.append(group);
    const box = { x: x0 - 4, y: y0 - 4, width: w + 8, height: h + 8 };
    const hit = [...svg.querySelectorAll('text.name, a.here')].some((el) => overlaps(el.getBBox(), box)) ||
      [...svg.querySelectorAll(':scope > path')].some((path) => {
        for (let i = 0, L = path.getTotalLength(); i < L; i += 4) {
          const q = path.getPointAtLength(i);
          if (q.x > box.x && q.x < box.x + box.width && q.y > box.y && q.y < box.y + box.height) return true;
        }
        return false;
      });
    if (hit || box.x + box.width > W - 8) group.remove();
    document.body.classList.toggle('index-in-map', !hit && box.x + box.width <= W - 8);
  }

  // Wide screens: the trunk runs across the middle; each branch rises or drops from its junction to its own row
  // ("노선도:" line in the roadmap file) and runs left or right. Positions follow the box, so the map fills it.
  function drawWide(holder) {
    const W = holder.clientWidth, H = holder.clientHeight;
    const svg = make('svg:svg', { role: 'group', 'aria-label': tr('노선도'), viewBox: `0 0 ${W} ${H}` });
    const up = Math.max(0, ...branches.filter((b) => b.branch.side === 'up').map((b) => b.branch.row));
    const down = Math.max(0, ...branches.filter((b) => b.branch.side === 'down').map((b) => b.branch.row));
    // Room above the top row and below the bottom row for a name of two lines (English names wrap).
    const gap = (H - 96) / Math.max(1, up + down), trunkY = up + down ? 52 + up * gap : H / 2;
    const rowY = (branch) => trunkY + (branch.side === 'up' ? -1 : 1) * branch.row * gap;
    const pad = Math.max(48, W * .05), R = Math.min(36, gap * .3);
    const pos = new Map(), stations = new Map(roadmaps.map((roadmap) => [roadmap.id, stationsOf(roadmap)]));
    const trunkStations = stations.get(trunk.id), n = trunkStations.length;
    pos.set(trunk.id, trunkStations.map((s, i) => [pad + i * (W - 2 * pad) / Math.max(1, n - 1), trunkY]));
    const spacing = new Map([[trunk.id, (W - 2 * pad) / Math.max(1, n - 1)]]);
    const paths = [];
    for (let placed = true; placed;) {
      placed = false;
      for (const roadmap of branches) {
        if (pos.has(roadmap.id) || !pos.has(roadmap.branch.from)) continue;
        const { from, chapter, dir } = roadmap.branch, k = dir === 'right' ? 1 : -1;
        const index = byId.get(from).chapters.findIndex((item) => item.id === chapter);
        const [jx, jy] = pos.get(from)[index];
        const siblings = branches.filter((b) => b.branch.from === from && b.branch.chapter === chapter);
        const vx = jx + (siblings.length > 1 ? k * 7 : 0), y = rowY(roadmap.branch), m = stations.get(roadmap.id).length;
        const d0 = Math.max(60, W * .06), room = k > 0 ? W - pad - vx - d0 : vx - d0 - pad;
        const step = Math.min(room / Math.max(1, m - 1), W * .085);
        pos.set(roadmap.id, stations.get(roadmap.id).map((s, i) => [vx + k * (d0 + i * step), y]));
        spacing.set(roadmap.id, step);
        const r = y > jy ? R : -R, endX = vx + k * (d0 + (m - 1) * step);
        paths.push([roadmap, `M${vx} ${jy}V${y - r}Q${vx} ${y} ${vx + k * Math.abs(r)} ${y}H${endX}`]);
        placed = true;
      }
    }
    for (const [roadmap, d] of paths) svg.append(make('svg:path', { d, ...strokeOf(roadmap) }));
    const [[x0], [x1]] = [pos.get(trunk.id)[0], pos.get(trunk.id).at(-1)];
    svg.append(make('svg:path', { d: `M${x0} ${trunkY}H${x1}`, ...strokeOf(trunk) }));
    const spot = hereSpot();
    let here = null;
    for (const roadmap of roadmaps) {
      if (!pos.has(roadmap.id)) continue;
      const list = stations.get(roadmap.id);
      list.forEach((s, i) => {
        const [x, y] = pos.get(roadmap.id)[i];
        let place = i % 2 ? 'down' : 'up';
        if (s.children.length) {
          // A line leaves this station: keep its name off that side, or beside the station away from the branch.
          const side = s.children[0].branch.side, dirs = new Set(s.children.map((child) => child.branch.dir));
          if (place === side) place = side + '-' + (dirs.size > 1 ? 'left' : dirs.has('left') ? 'right' : 'left');
        }
        // Names alternate above and below, so a name may use the room up to the next name on its side.
        const gapX = spacing.get(roadmap.id), max = place.includes('-') ? Math.max(gapX - 30, 120) : Math.min(2 * gapX - 18, 220);
        const name = station(svg, s, x, y, colorOf(roadmap.id), i === list.length - 1, place, max, [8, W - 8]);
        if (roadmap === spot.roadmap && i === spot.index) here = [x, y, name];
      });
    }
    holder.replaceChildren(svg);
    if (here) pin(svg, here[0], here[1], spot.href, here[2], [8, W - 8]);
    separateNames(svg, W, H);
    mapIndex(svg, W, H);
  }

  // Narrow screens: a picker chooses the line, and one line is drawn down the left at a time.
  let shownLine = null;
  try { shownLine = sessionStorage.getItem('hub-line'); } catch {}
  function drawNarrow(holder) {
    const width = holder.clientWidth - 16, x = 22;
    const spot = hereSpot();
    const roadmap = byId.get(shownLine) || spot.roadmap;
    // The current line's name opens the list of lines, so the picker fits any width.
    const picker = make('label', { class: 'line-pick' });
    picker.style.setProperty('--line', colorOf(roadmap.id));
    const select = make('select', { 'aria-label': tr('노선') });
    for (const item of roadmaps) {
      const option = make('option', { value: item.id }, tr(item.title));
      option.selected = item === roadmap;
      select.append(option);
    }
    select.addEventListener('change', () => {
      shownLine = select.value;
      try { sessionStorage.setItem('hub-line', shownLine); } catch {}
      draw();
      document.querySelector('.line-pick select')?.focus();
    });
    picker.append(make('span', { class: 'line-bar', 'aria-hidden': 'true' }), select);
    let here = null;
    // Keep room above the first station and, on branches, below the transfer caption.
    const list = stationsOf(roadmap), top = roadmap.branch ? 44 : 34;
    const height = Math.max(1, holder.clientHeight - 12 - 44 - 4);
    const step = (height - top - 24) / Math.max(1, list.length - 1);
    const svg = make('svg:svg', { role: 'group', 'aria-label': tr(roadmap.title), viewBox: `0 0 ${width} ${top + (list.length - 1) * step + 24}` });
    if (roadmap.branch) {
      const from = byId.get(roadmap.branch.from);
      svg.append(make('svg:text', { x, y: 16, 'font-size': 12, fill: '#43574f' }, tr(`${from.title} ${roadmap.branch.chapter}장에서 갈아타기`)));
    }
    svg.append(make('svg:path', { d: `M${x} ${top}V${top + (list.length - 1) * step}`, ...strokeOf(roadmap) }));
    list.forEach((s, i) => {
      const y = top + i * step;
      const name = station(svg, s, x, y, colorOf(roadmap.id), i === list.length - 1, 'right', width - x - 54, [8, width - 8]);
      if (roadmap === spot.roadmap && i === spot.index) here = [y, name];
    });
    holder.replaceChildren(picker, svg);
    document.body.classList.remove('index-in-map');
    // Keep the compact pin on the same row as its station, with room for its right edge.
    if (here) {
      const box = here[1].getBBox();
      const pinX = Math.min(box.x + box.width + 13, width - 14);
      pin(svg, pinX, here[0], spot.href, null, [8, width - 8], { inline: true });
    }
  }

  const network = make('li', { class: 'map' });
  document.getElementById('roadmaps').append(network);
  const topicHeading = document.querySelector('.topic-heading');
  // The whole map needs room in both directions; a narrow or short window shows one line at a time.
  const wide = matchMedia('(min-width: 720px) and (min-height: 600px)');
  function draw() {
    const topic = currentMapTopic();
    const pending = topic.id !== 'computer-science';
    network.classList.toggle('topic-pending', pending);
    topicHeading.hidden = !pending;
    if (pending) {
      topicHeading.textContent = mapTopicName(topic);
      document.body.classList.remove('index-in-map');
      network.replaceChildren(make('p', { class: 'topic-status', role: 'status', 'data-no-i18n': '' }, tr('준비 중')));
    } else if (wide.matches) drawWide(network);
    else drawNarrow(network);
  }
  const nav = document.querySelector('.map-topics');
  if (currentMapTopic().line) {
    location.replace(nav.querySelector('[data-ai-line="' + currentMapTopic().line + '"]').href);
    return;
  }
  nav.addEventListener('click', event => {
    const link = event.target.closest('a[data-topic]');
    if (!link || link.dataset.aiLine || event.button || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    event.preventDefault();
    if (currentMapTopic().id !== link.dataset.topic) history.pushState(null, '', link.href);
    renderTopicNavigation();
    draw();
  });
  addEventListener('popstate', () => { renderTopicNavigation(); draw(); });
  lineIndex();
  draw();
  let lastSize = '';
  new ResizeObserver(() => {
    const size = network.clientWidth + 'x' + network.clientHeight;
    if (size !== lastSize) { lastSize = size; draw(); }
  }).observe(network);
  addEventListener('course:lang', () => { lineIndex(); draw(); });
});
</script>
</body>
</html>
