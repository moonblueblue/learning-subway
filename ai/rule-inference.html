<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="../shared/device-access.js?v=1f73c765843f36b1"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="확인된 사실에서 점검 후보를 어떤 순서로 유도하나요?">
<title>사실과 규칙에서 결론 도출하기 · T04</title>
<link rel="stylesheet" href="../shared/reading-lesson.css">
<style>
.inference-card{fill:#fff;stroke:#9aafa3;stroke-width:1.25}
.inference-card.hot{fill:#d5efeb;stroke:#0f766e}
.inference-card.alert{fill:#fae8df;stroke:#aa4e27}
.inference-card.hold{fill:#f7f0d8;stroke:#947235}
.inference-card.missing,.inference-card.pending{fill:#f9fbf9;stroke:#73877c;stroke-dasharray:5 4}
.inference-label,.inference-detail{fill:#142620;font-size:16px;font-weight:700}
.inference-detail{fill:#43574f;font-size:14px;font-weight:600}
.inference-shaft{fill:none;stroke:#41645a;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.inference-shaft.missing{stroke-dasharray:4 4}
.inference-tip{fill:#41645a}
.inference-practice,body.course-shell .workspace:not(.course-reading) .inference-reading{display:none}
body.course-shell .workspace:not(.course-reading) .inference-practice{display:inline}
</style>
<link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../shared/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="../shared/course.css?v=d9c4c7ece46ac390">
<script src="../shared/engine.js?v=fc4c2853ab27cdf0"></script>
<script defer blocking="render" src="../shared/catalog.js"></script>
<script defer blocking="render" src="./rule-inference.en.js"></script>
<script defer blocking="render" src="../shared/i18n.js"></script>
<script defer blocking="render" src="../shared/course.js?v=09b179d99f959295"></script>
</head>
<body>
<main class="shell">
  <header><p class="eyebrow">AI 공통 본선 · T04</p><h1>사실과 규칙에서 결론 도출하기</h1><p>확인된 사실에서 점검 후보를 어떤 순서로 유도하나요?</p></header>
  <div class="workspace">
    <div>
      <section class="panel" aria-labelledby="stage-heading">
        <div class="stage-top"><h2 id="stage-heading">센서 기록과 판정</h2></div>
        <div class="stage"><svg id="scene" viewBox="0 0 620 280" role="img" aria-labelledby="scene-title scene-desc"><title id="scene-title">사실과 규칙에서 결론 도출하기</title><desc id="scene-desc"></desc></svg></div>
        <div class="controls"></div>
        <nav class="timeline" aria-labelledby="timeline-heading">
          <div class="timeline-top"><h2 id="timeline-heading">타임라인</h2><span id="count"></span></div>
          <ol class="steps" id="steps"></ol>
        </nav>
      </section>
      <div class="hands-on">
        <p class="try"><strong>다른 입력으로 확인</strong></p>
        <p id="prompt" class="try"></p>
        <p id="feedback" class="readout" role="status"></p>
        <div id="choices"></div>
      </div>
    </div>
    <section class="panel explanation" aria-labelledby="step-title">
      <h2 id="step-title"></h2><p id="body"></p>
      <div class="takeaway"><strong>관찰 포인트</strong><p id="takeaway"></p></div>
      <nav class="navigation" aria-label="이전 및 다음 단계"><button class="action" id="prev" type="button">이전 단계</button><button class="action primary" id="next" type="button">다음 단계</button></nav>
    </section>
  </div>
  <div class="sr-only" id="announcement" role="status"></div>
</main>
<script>
const lesson = [
  {
    label: '온도 규칙',
    title: '온도 기록에서 A 고온 카드를 만듭니다',
    body: '08:00에 설비 A의 온도가 83°C로 기록됐습니다. 온도가 80°C 이상이면 고온 카드를 붙입니다. 기록에 규칙을 적용해 새 판단을 얻는 일을 추론이라고 합니다.',
    takeaway: '왼쪽 기록과 오른쪽 카드의 설비 이름이 모두 A입니다. 다음 단계에서 이 카드를 그대로 씁니다.',
    example: ['A의 온도 83°C', '80°C 이상', 'A 고온'],
    readingDiagram: {figure: 'inference-temperature', staticOnly: true, title: '온도 규칙',
      description: '왼쪽의 A 온도 83°C를 가운데 온도 기준 80°C와 비교해 오른쪽에 A 고온 카드를 붙입니다.'},
    quiz: ['다른 날 A의 온도는 78°C입니다. 온도 규칙을 적용하면 어떤 결과가 나올까요?',
      '고온 카드 없음', 'A 고온', '78°C는 80°C보다 낮아서 고온 카드를 붙이지 않습니다.'],
    practiceDescription: '다른 날 A의 온도는 78°C이고 고온 카드 기준은 80°C 이상입니다.',
    result: ['고온 카드 없음', ''],
    resultTone: '',
  },
  {
    label: '점검 규칙 연결',
    title: 'A 고온 카드와 진동 기록을 함께 확인합니다',
    body: '같은 시각의 진동도 확인합니다. A 고온 카드가 있고 진동이 4 mm/s 이상이면 두 조건을 충족해 A 경보를 냅니다. 경보는 먼저 점검하자는 제안입니다. 실제 상태는 현장에서 확인합니다.',
    takeaway: '앞에서 만든 A 고온 카드와 5 mm/s 진동 기록의 두 선이 하나의 점검 규칙에 들어갑니다.',
    example: ['A 고온과 5 mm/s', '두 조건 충족', 'A 경보'],
    readingDiagram: {figure: 'inference-inspection', staticOnly: true, title: '점검 규칙 연결',
      description: 'A 고온 카드와 진동 5 mm/s 기록이 모두 규칙에 들어옵니다. 두 조건을 충족해 A 경보와 우선 점검 제안이 나옵니다. 현장 상태는 미확인입니다.'},
    quiz: ['다른 날에도 A 고온 카드가 있고 진동이 정확히 4 mm/s입니다. 어떤 판정이 나올까요?',
      'A 경보', '이 규칙의 경보 없음', '4 mm/s도 기준에 포함됩니다. A 고온 카드도 있어 두 조건을 충족합니다.'],
    practiceDescription: '다른 날 A 고온 카드가 있고 진동은 4 mm/s입니다. 진동 조건은 4 mm/s 이상입니다.',
    result: ['A 경보', '우선 점검'],
    resultTone: 'alert',
  },
  {
    label: '낮은 값과 빈칸',
    title: '낮은 측정값과 비어 있는 기록은 판단이 다릅니다',
    body: '위 사례의 3 mm/s는 기준보다 낮아서 이 규칙으로는 경보가 나지 않습니다. 아래 사례에서는 진동값이 없어 기준과 비교할 수 없습니다. 판단을 보류하고 진동을 다시 측정합니다.',
    takeaway: '위와 아래 모두 83°C에서 얻은 A 고온 카드를 씁니다. 진동 칸의 3 mm/s와 빈칸이 서로 다른 결과로 이어집니다.',
    example: ['A 고온 유지', '진동 3 mm/s 또는 빈칸', '경보 없음 또는 재측정'],
    readingDiagram: {figure: 'inference-missing', staticOnly: true, title: '낮은 값과 빈칸',
      description: '위와 아래 모두 A의 온도가 83°C이고 고온 카드가 있습니다. 위는 진동이 3 mm/s로 기준 미달이라 이 규칙의 경보가 없습니다. 아래는 진동 기록이 비어 비교할 수 없어 판단을 보류하고 진동을 다시 잽니다.'},
    quiz: ['다른 날 A 고온 카드는 있는데 진동 칸이 비어 있습니다. 지금 무엇을 해야 할까요?',
      '진동 다시 측정', '이 규칙의 경보 없음', '진동이 낮다는 판정에는 실제 측정값이 필요합니다. 값을 다시 얻을 때까지 판단을 보류합니다.'],
    practiceDescription: '다른 날 A의 온도는 83°C이고 고온 카드가 있습니다. 진동 기록이 비어 있고 진동 기준은 4 mm/s입니다.',
    result: ['판단 보류', '진동 다시 측정'],
    resultTone: 'hold',
  },
];

const slug = 'rule-inference';
const byId = id => document.getElementById(id);
const state = {index: -1, answers: new Map()};
const feedbackMessages = ['✓ 맞았습니다.', '✗ 다시 생각해 보세요.'];
const scene = byId('scene');
const workspace = scene.closest('.workspace');

function startCoursePractice() {
  state.answers.clear();
  if (state.index === 0) showStep(0);
  else goToStep(0);
}

function inferenceText(parent, x, y, value, css = 'inference-detail', anchor = 'start') {
  svg('text', {x, y, class: css, 'text-anchor': anchor}, parent).textContent = value;
}

function inferenceCard(parent, x, y, width, height, [label, detail = ''], tone = '') {
  const card = svg('g', {}, parent);
  svg('rect', {x, y, width, height, rx: 7, class: 'inference-card ' + tone}, card);
  const detailOffset = height <= 36 ? 7 : 10;
  inferenceText(card, x + width / 2, y + height / 2 + 5 - (detail ? detailOffset : 0), label, 'inference-label', 'middle');
  if (detail || tone === 'pending') {
    inferenceText(card, x + width / 2, y + height / 2 + 5 + detailOffset, detail, 'inference-detail', 'middle');
  }
  return card;
}

function inferenceArrow(parent, x, y, end, targetY = y, tone = '') {
  // The final segment is horizontal. Its rounded cap stays inside the filled tip.
  const shaft = 'inference-shaft ' + tone;
  const bendX = x + 15;
  if (y !== targetY) svg('path', {d: `M${x} ${y}H${bendX}V${targetY}`, class: shaft}, parent);
  svg('line', {x1: y === targetY ? x : bendX, y1: targetY, x2: end - 7, y2: targetY, class: shaft}, parent);
  svg('polygon', {points: `${end - 9},${targetY - 5} ${end},${targetY} ${end - 9},${targetY + 5}`,
    class: 'inference-tip', 'data-arrowhead': ''}, parent);
}

function inferenceResult(parent, y, height, result, tone, practice) {
  const card = inferenceCard(parent, 443, y, 149, height, practice ? [''] : result, practice ? 'pending' : tone);
  if (practice) card.classList.add('inference-practice-result');
}

function temperatureFigure(parent, practice) {
  inferenceText(parent, 28, 76, practice ? '다른 날 · 08:00 · 설비 A' : '08:00 · 설비 A');
  inferenceCard(parent, 28, 104, 153, 67, [practice ? '78°C' : '83°C', '기록된 온도']);
  inferenceArrow(parent, 185, 138, 225);
  inferenceCard(parent, 230, 104, 164, 67,
    [practice ? '온도 기준 80°C' : '83°C ≥ 80°C', '80°C 이상이면 고온']);
  inferenceArrow(parent, 399, 138, 438);
  inferenceResult(parent, 104, 67, ['A 고온', '다음 규칙에 사용'], 'hot', practice);
}

function inspectionRow(parent, y, {vibration, rule, result, tone, practice = false}) {
  const missing = vibration === null;
  inferenceCard(parent, 28, y, 153, 32, ['A 고온'], 'hot');
  if (missing) {
    inferenceText(parent, 38, y + 60, '진동 기록 없음');
    inferenceCard(parent, 133, y + 39, 48, 32, [''], 'missing');
  } else {
    inferenceCard(parent, 28, y + 39, 153, 32, [vibration]);
  }

  inferenceArrow(parent, 185, y + 16, 225, y + 25);
  inferenceArrow(parent, 185, y + 55, 225, y + 46, missing ? 'missing' : '');
  inferenceCard(parent, 230, y + 8, 164, 55, rule);
  inferenceArrow(parent, 399, y + 35.5, 438);
  inferenceResult(parent, y + 8, 55, result, tone, practice);
}

function buildInferenceFigure(step, index) {
  const template = document.createElement('template');
  template.id = step.readingDiagram.figure;
  const canvas = svg('svg', {viewBox: '0 0 620 280'}, template.content);
  const figure = svg('g', {}, canvas);
  const reading = svg('g', {class: 'inference-reading'}, figure);
  const practice = svg('g', {class: 'inference-practice'}, figure);

  if (index === 0) {
    temperatureFigure(reading, false);
    temperatureFigure(practice, true);
  } else if (index === 1) {
    for (const [view, isPractice] of [[reading, false], [practice, true]]) {
      inferenceText(view, 28, 76, isPractice ? '다른 날 · 08:00 · 설비 A' : '08:00 · 설비 A');
      inspectionRow(view, 94, {
        vibration: isPractice ? '진동 4 mm/s' : '진동 5 mm/s',
        rule: ['고온 카드 필요', '진동도 4 mm/s 이상'],
        result: step.result, tone: step.resultTone, practice: isPractice,
      });
      inferenceText(view, 517.5, 187, '현장 상태 미확인', 'inference-detail', 'middle');
    }
  } else {
    inferenceText(reading, 28, 66, '두 사례 모두 A · 온도 83°C');
    inspectionRow(reading, 76, {
      vibration: '진동 3 mm/s', rule: ['3 < 4 mm/s', '진동 기준 미달'],
      result: ['경보 없음', '이 점검 규칙에서'],
    });
    inspectionRow(reading, 169, {
      vibration: null, rule: ['진동 기준 4 mm/s', '아직 비교할 수 없음'],
      result: step.result, tone: step.resultTone,
    });
    inferenceText(practice, 28, 76, '다른 날 · A · 온도 83°C');
    inspectionRow(practice, 94, {
      vibration: null, rule: ['고온 카드 필요', '진동도 4 mm/s 이상'], practice: true,
    });
  }
  document.body.append(template);
}
lesson.forEach(buildInferenceFigure);

function updateInferencePractice() {
  const result = scene.querySelector('.inference-practice-result');
  if (!result || workspace.classList.contains('course-reading')) return;
  const step = lesson[state.index];
  const correct = state.answers.get(state.index) === step.quiz[1];
  if (result.dataset.correct === String(correct)) return;
  result.dataset.correct = String(correct);

  const [label, detail] = result.querySelectorAll('text');
  const rect = result.querySelector('rect');
  const showDetail = correct && Boolean(step.result[1]);
  label.textContent = correct ? step.result[0] : '';
  label.setAttribute('y', Number(rect.getAttribute('y')) + Number(rect.getAttribute('height')) / 2 + (showDetail ? -5 : 5));
  detail.textContent = showDetail ? step.result[1] : '';
  rect.setAttribute('class', 'inference-card ' + (correct ? step.resultTone : 'pending'));

  for (const id of ['course-diagram-desc', 'scene-desc']) {
    const description = byId(id);
    description.textContent = step.practiceDescription;
    if (correct) description.append(' ', step.quiz[3]);
  }
}
const practiceChanges = new MutationObserver(updateInferencePractice);
practiceChanges.observe(scene, {childList: true});
practiceChanges.observe(workspace, {attributes: true, attributeFilter: ['class']});
practiceChanges.observe(byId('choices'), {childList: true, subtree: true, attributes: true, attributeFilter: ['aria-pressed']});
</script>
<script src="../shared/reading-lesson.js?v=b4d45e8ddc5bfaac"></script>
</body>
</html>
