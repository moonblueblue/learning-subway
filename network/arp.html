<body>
<main class="shell">
  <header>
    <p class="eyebrow">네트워크 1장 링크와 LAN · 레슨 1.4</p>
    <h1>ARP</h1>
    <p class="lead">IP 주소만 아는 상대의 MAC 주소는 어떻게 알아낼까요? 스위치 하나에 이어진 컴퓨터 두 대와 라우터 사이로 ARP 요청과 답장을 보내 보세요.</p>
  </header>
  <div class="workspace">
    <div>
      <section class="panel" aria-labelledby="stage-heading">
        <div class="stage-top"><h2 id="stage-heading">PC 두 대, 스위치, 라우터</h2></div>
        <div class="stage">
          <svg id="scene" viewBox="0 0 620 280" role="img" tabindex="0" aria-labelledby="scene-title scene-desc">
            <title id="scene-title">PC A가 ARP 요청을 모두에게 보내 IP 주소의 주인에게서 MAC 주소를 답으로 받고, 다른 네트워크로 갈 때는 라우터의 MAC을 묻는 장면</title><desc id="scene-desc"></desc>
            <defs>
              <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
              <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
              <radialGradient id="grid-fade"><stop offset=".45" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
              <mask id="grid-mask"><rect x="-460" y="-260" width="920" height="520" fill="url(#grid-fade)"/></mask>
            </defs>
            <g id="world" aria-hidden="true">
              <path id="grid" class="iso-grid" mask="url(#grid-mask)"></path>
              <g id="casings"></g><g id="links"></g><g id="nodes"></g><g id="packets"></g>
            </g>
          </svg>
        </div>
        <div class="hands-on">
          <div class="try" id="try">
            <p><strong>해 보기</strong><span id="try-text"></span></p>
            <p class="try-result" id="try-result" role="status"></p>
            <div class="try-choices" id="try-choices" role="group" aria-label="예측 고르기"></div>
          </div>
          <p class="readout" id="readout"></p>
          <div class="code-area">
            <div class="memory-panel work-panel" id="work-panel">
              <ol class="stage-list" id="stage-list" aria-label="정거장"></ol>
              <p class="work-title" id="work-title"></p>
              <ol class="code memory-list work" id="work" aria-label="지금 코드의 모습"></ol>

      { from: 'a', to: 'sw', label: 'IP 8.8.8.8 → rr', title: 'PC A가 보내는 프레임', lines: ['목적지 MAC  rr   (라우터)', '안의 IP 패킷  목적지 8.8.8.8   (그대로)'],
        text: 'A가 목적지 MAC은 라우터의 rr, 안의 IP 목적지는 8.8.8.8인 프레임을 보냅니다.', holds: { a: '8.8.8.8은 밖 → rr로 보냄', sw: 'rr → 라우터 쪽으로만' } },
      { from: 'sw', to: 'r', label: 'rr → 라우터 쪽', title: '라우터', lines: ['목적지 MAC rr = 나 → 받음', 'IP 목적지 8.8.8.8 → 밖으로 전달'],
        text: '라우터가 프레임을 받아, IP 목적지 8.8.8.8을 보고 밖으로 전달합니다.', holds: { r: '받음 · IP 목적지 8.8.8.8' } },
    ],
  },
];

const motion = matchMedia('(prefers-reduced-motion: reduce)');
const state = { index: 0, s: 0, playing: !motion.matches, wait: 0, busy: false, wrong: '', solvedText: '' };
const progress = lesson.map(() => 0);
const answered = lesson.map(() => new Set());
let packets = [];
let frame = null;
let lastFrame = null;
let timers = [];

const project = (x, y, z = 0) => [14 * (x + y), 7 * (x - y) - z];
const point = (x, y, z) => project(x, y, z).map((value) => +value.toFixed(2)).join(',');
const flat = (u, v, z = 0) => [14 * u, 7 * v - z];
const mix = (a, b, t) => a + (b - a) * t;
const laneHeight = 4;
const gap = 8.5;   // u between neighbouring stations

const gridLines = [];
for (let i = -24; i <= 40; i += 2) gridLines.push(`M${point(i, -24, 0)}L${point(i, 40, 0)}M${point(-24, i, 0)}L${point(40, i, 0)}`);
byId('grid').setAttribute('d', gridLines.join(''));


let plates = [];

// Same as the engine's sizePlate, except that a plate with `end` set is right-aligned (right edge at x = end)
// and one with `start` set is left-aligned (left edge at x = start).
// Used for names that step aside from a cable running down from their station.
function sizePlate(plate) {
  const size = parseFloat(getComputedStyle(plate.label).fontSize);
  const width = plate.label.getComputedTextLength() + size * plate.pad;
  const height = size + 8;
  const x = plate.end !== undefined ? plate.end - width / 2 : plate.start !== undefined ? plate.start + width / 2 : plate.x;
  plate.label.setAttribute('x', x);
  plate.label.setAttribute('y', plate.y);
  Object.entries({ x: x - width / 2, y: plate.y - height / 2, width, height, rx: plate.round ? height / 2 : 6 })
    .forEach(([key, value]) => plate.rect.setAttribute(key, value));
}

// ---------- Scene: a star of cables around one switch ----------
const shapeOf = { pc: [1.1, 12], switch: [1.5, 7], router: [1.3, 10] };
let views = {};
const stationPos = (id) => lesson[state.index].stations.find(([sid]) => sid === id)[3];
function buildScene() {
  for (const id of ['casings', 'links', 'nodes', 'packets']) byId(id).replaceChildren();
  plates = [];
  packets = [];
  views = {};
  const stations = lesson[state.index].stations;
  const hub = stations.find(([, , kind]) => kind === 'switch')[3];
  // One cable from the switch to each PC, straight along the screen's horizontal or vertical axis.
  for (const [, , kind, [u, v]] of stations) {
    if (kind === 'switch') continue;
    const d = `M${flat(hub[0], hub[1], laneHeight).join(' ')}L${flat(u, v, laneHeight).join(' ')}`;
    svg('path', { class: 'casing', d }, byId('casings'));
    svg('path', { class: 'bus', d }, byId('links'));
  }
  stations.forEach(([id, name, kind, [u, v]]) => {
    const [h, H] = shapeOf[kind];
    const node = svg('g', { class: `node station ${kind}`, transform: `translate(${flat(u, v).join(' ')})` }, byId('nodes'));
    drawShadow(node, h);
    drawBox(node, h, H);
    if (kind === 'pc') {
      const s = [[h, -h + .3, H - 2], [h, h - .3, H - 2], [h, h - .3, 3], [h, -h + .3, 3]];
      svg('polygon', { class: 'pc-screen', points: s.map((p) => point(...p)).join(' ') }, node);
    }
    if (kind === 'router') {
      // Two antennas on the top face.
      for (const y of [-.6, .6]) svg('path', { class: 'antenna', d: `M${point(-.6, y, H)}L${point(-.6, y, H + 9)}` }, node);
    }
    if (kind === 'switch') {
      // Port lights along the front edge, numbered 1–3 from the left.
      for (let p = 0; p < 3; p++) {
        const [cx, cy] = project(h, -h + .5 + p * (2 * h - 1) / 2, H / 2);
        svg('circle', { class: 'port-light', r: 1.6, cx, cy }, node);
      }
    }
    // A cable that runs straight down from this station (to a station below it), or a floor-zone border under it,
    // would pass through a centred name, so that name sits left of the line instead (right edge 20px left of it).
    const under = stations.some(([, , , [ou, ov]]) => ou === u && ov > v);
    const sidestep = under || (lesson[state.index].zones || []).some(([z0, z1]) => z0 === u || z1 === u);
    const namePlate = addPlate(node, 'tag station-tag', 0, 14 * h + 16, name, { round: true });
    // With a station underneath it also drops one row, below the neighbours' names and above that station.
    // A zone border alone (nothing below) keeps the row and steps right of the line, away from the zone's corner label.
    // A short name (a switch, a hub, an AP) goes on the box instead, where it reads as that box's own name
    // (dropped below, it sat next to the station underneath and read as that one's).
    // It sits on the back half of the top face: there it reads as this box's name, and the cables, which end at the
    // box's centre (y −4), stay clear of it even at the label's full size (centred on the face they ran under it;
    // beside the box it read as the neighbour's name).
    const onTop = (under || sidestep) && name.length <= 8;
    if (onTop) { namePlate.y = -H - 10; sizePlate(namePlate); }
    else if (under) { namePlate.end = -20; namePlate.y += 24; sizePlate(namePlate); }
    else if (sidestep) { namePlate.start = 20; sizePlate(namePlate); }
    // The PC below the switch puts its badge under its name, so it does not crowd the switch's name.
    const below = v > 0;
    // The switch badge (its table) sits one row higher than the PCs on either side, so the three never touch.
    const lift = kind === 'switch' ? 32 : 0;
    if (lift) svg('path', { class: 'badge-leader', d: `M0 ${-H - 14 * h - 4}V${-H - 14 * h - 18 - lift + 8}` }, node);
    const holds = addPlate(node, 'tag holds', 0, below ? 14 * h + 42 : -H - 14 * h - 18 - lift - (onTop ? 8 : 0),   // 8px more over a name on the top face
      '', { pad: 1.2 });
    views[id] = { node, holds };
  });
  const us = stations.map(([, , , [u]]) => u), vs = stations.map(([, , , [, v]]) => v);
  const left = 14 * Math.min(...us) - 84, right = 14 * Math.max(...us) + 84, top = -128, bottom = 7 * Math.max(...vs) + 74;
  const scale = Math.min(1.9, 590 / (right - left), 268 / (bottom - top));
  const x = 310 - scale * (left + right) / 2, y = 140 - scale * (top + bottom) / 2;
  byId('world').setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${scale.toFixed(3)})`);
}

// ---------- The moving dot ----------
// It runs along one cable, stopping short of the boxes at both ends.
function travel(from, to, label, done) {
  if (motion.matches) { done(); return; }
  const group = svg('g', { class: 'packet-group' }, byId('packets'));
  svg('circle', { class: 'packet-halo', r: 8.5 }, group);
  svg('circle', { class: 'packet', r: 4.4 }, group);
  svg('text', { class: 'packet-label', y: -10 }, group).textContent = label;
  packets.push({ group, from, to, start: performance.now(), ms: 950, done });
  kick();
}
// Callbacks run after the list is updated, so a callback that starts a new trip is not lost.
function movePackets(now) {
  const finished = [];
  packets = packets.filter((packet) => {
    const t = (now - packet.start) / packet.ms;
    if (t >= 1) { packet.group.remove(); finished.push(packet.done); return false; }
    const ease = t * t * (3 - 2 * t);
    const [u0, v0] = packet.from, [u1, v1] = packet.to;
    const length = Math.hypot(u1 - u0, v1 - v0), trim = 1.3 / length;
    const k = mix(trim, 1 - trim, ease);
    const [x, y] = flat(mix(u0, u1, k), mix(v0, v1, k), laneHeight);
    packet.group.setAttribute('transform', `translate(${x} ${y})`);
    return true;
  });
  finished.forEach((done) => done());
}

// ---------- State after s stages ----------
function paint() {
  const step = lesson[state.index];
  const preview = document.querySelector(motion.matches ? '.workspace.course-reading' : '.workspace.course-reading.course-step-preview');
  const shown = preview ? step.readingStage : state.s;
  const { holds, errors, view } = snapshot(shown);
  const last = step.stages[shown - 1];
  for (const [id] of step.stations) {
    setPlate(views[id].holds, holds[id] ?? '');
    views[id].holds.group.classList.toggle('error', errors.has(id));
    views[id].node.classList.toggle('error', errors.has(id));
    views[id].node.classList.toggle('active', last ? last.to === id : id === step.stations[0][0]);
  }
  // The still picture says in one line what happened up to the reading stage, so the badges read as its result.
  byId('example-note')?.remove();
  if (preview) exampleNote(step.note, step.noteTone);
  byId('work-title').textContent = view.title;
  byId('work').replaceChildren(...view.lines.map((line) => Object.assign(document.createElement('li'), { textContent: line })));
  byId('work-panel').classList.toggle('error', Boolean(last?.error));
  byId('readout').textContent = last ? last.text : '"다음 단계"를 누르면 신호가 한 정거장씩 움직입니다.';
  const finished = state.s >= step.stages.length;
  const blocked = !state.playing && (finished || state.busy || Boolean(pendingAsk()));
  byId('run-stage').disabled = blocked;
  byId('run-stage').textContent = finished ? '끝까지 왔습니다' : '다음 단계';
  [...byId('stage-list').children].forEach((li, k) => {
    li.classList.toggle('done', k < state.s);
    li.classList.toggle('current', k === state.s);
  });
}

function runStage(done) {
  const step = lesson[state.index];
  const stage = step.stages[state.s];
  if (!stage || state.busy) return;
  state.busy = true;
  views[stage.from].node.classList.add('active');
  travel(stationPos(stage.from), stationPos(stage.to), stage.label, () => {
    state.s++;
    state.busy = false;
    paint();
    byId('announcement').textContent = stage.text;
    done?.();
  });
  paint();
}

// ---------- Predictions ----------
function pendingAsk() {
  if (state.playing) return null;
  const stage = lesson[state.index].stages[state.s];
  return stage?.ask && !answered[state.index].has(state.s) ? stage.ask : null;
}
const asksCount = () => lesson[state.index].stages.filter((stage) => stage.ask).length;
function syncTask() {
  const choices = byId('try-choices');
  choices.replaceChildren();
  const ask = pendingAsk();
  if (ask && !state.busy) {
    byId('try').classList.remove('solved');
    byId('try-text').textContent = ask.q;
    byId('try-result').textContent = state.wrong || state.solvedText;
    for (const choice of ask.choices) {
      const button = Object.assign(document.createElement('button'), { type: 'button', className: 'action choice-button', textContent: choice });
      button.addEventListener('click', () => answer(choice));
      choices.append(button);
    }
  } else if (state.solvedText) {
    byId('try').classList.add('solved');
    byId('try-text').textContent = state.solvedText;
    byId('try-result').textContent = '';
  } else {
    byId('try').classList.remove('solved');
    byId('try-result').textContent = '';
    byId('try-text').textContent = state.s >= lesson[state.index].stages.length
      ? (progress[state.index] >= asksCount() ? '이 단계의 예측을 모두 맞혔습니다. 처음부터 다시 볼 수도 있습니다.' : '처음부터를 눌러 다시 해 보세요.')
      : '"다음 단계"를 눌러 신호를 한 정거장씩 옮겨 보세요. 중간에 예측 문제가 나옵니다.';
  }
}
function answer(choice) {
  const ask = pendingAsk();
  if (!ask) return;
  if (choice !== ask.answer) {
    state.wrong = `✗ ${choice}이(가) 아닙니다. 다시 골라 보세요.`;
    byId('announcement').textContent = state.wrong;
    syncTask();
    return;
  }
  state.wrong = '';
  answered[state.index].add(state.s);
  progress[state.index] = answered[state.index].size;
  state.solvedText = `✓ 맞았습니다. ${ask.why}`;
  byId('announcement').textContent = state.solvedText;
  runStage(() => syncTask());
  syncTask();
}

// Taking over from the demo starts the learner's own run from the beginning, so no prediction is skipped.
byId('run-stage').onclick = () => {
  takeOver();
  if (state.busy || pendingAsk()) { syncTask(); return; }
  state.solvedText = '';
  runStage(() => syncTask());
  syncTask();
};
byId('restart').onclick = () => {
  state.playing = false;
  resetRun();
  syncPlayback();
  byId('announcement').textContent = '처음부터 다시 시작합니다.';
};

// ---------- Demo ----------

// ---------- Steps and routing ----------
function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/arp/${index + 1}`);
  showStep(index);
}
const stepButtons = lesson.map(({ label }, index) => {
  const listItem = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  const number = document.createElement('span');
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.addEventListener('click', () => goToStep(index));
  listItem.append(button);
  byId('steps').append(listItem);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
motion.addEventListener('change', () => {
  if (lessonDemoEnabled()) state.playing = true;
  syncPlayback();
});
window.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});
const initial = routeIndex();
history.replaceState(null, '', `#/arp/${initial + 1}`);
state.index = -1;
showStep(initial, false);
</script>
