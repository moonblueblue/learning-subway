.demand-dialog {
  width: min(630px, calc(100% - 24px));

  padding: 12px;
  margin: auto;
  border: 1px solid #aebeb5;
  border-radius: 12px;
  background: #fcfefd;
  color: #142620;
  font: 15px/1.35 system-ui, sans-serif;
}
.demand-dialog::backdrop { background: #081c19b8; }
.demand-dialog header { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.demand-dialog h2 { margin: 0; font-size: 1.25em; }
.demand-dialog p { margin: 6px 0; overflow-wrap: anywhere; }
.demand-dialog form { margin: 0; }
.demand-fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; margin: 8px 0; }
.demand-fields label, .demand-upload { display: grid; gap: 3px; min-width: 0; font-weight: 650; }
.demand-dialog input, .demand-dialog select {
  font: inherit;
  box-sizing: border-box;
  width: 100%;
  min-width: 0;
  min-height: 44px;
  padding: 4px;
  color: inherit;
  background: #f4f8f5;
  border: 1px solid #a6bbb0;
  border-radius: 6px;
}
.demand-upload span { display: block; }
.demand-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 8px 0; }
.demand-status { font-weight: 650; }
.demand-dialog table { width: 100%; border-collapse: collapse; text-align: start; font-variant-numeric: tabular-nums; }
.demand-dialog th, .demand-dialog td { padding: 4px; border-block-end: 1px solid #cbd9d0; text-align: start; }
.demand-dialog thead { background: #e8f1eb; }
.demand-context { color: #456151; font-size: .93em; }
#forecast-actions { margin: 4px 0; }
#forecast-actions .action { min-height: 44px; }

<main class="shell">
  <header><p class="eyebrow">데이터·응용 머신러닝 · 졸업 과제</p><h1>품목별 수요 예측기</h1><p>같은 시험 기간으로 모델을 평가하고 어느 품목을 기준선으로 되돌릴까요?</p></header>
  <div class="workspace">
    <div>
      <section class="panel" aria-labelledby="stage-heading">
        <div class="stage-top"><h2 id="stage-heading">계산과 판단</h2></div>
        <div class="stage"><svg id="scene" viewBox="0 0 620 280" role="img" aria-labelledby="scene-title scene-desc"><title id="scene-title">품목별 수요 예측기</title><desc id="scene-desc"></desc></svg></div>
        <div class="controls"></div>
        <nav class="timeline" aria-labelledby="timeline-heading">
          <div class="timeline-top"><h2 id="timeline-heading">타임라인</h2><span id="count"></span></div>
          <ol class="steps" id="steps"></ol>
        </nav>
      </section>
      <div class="hands-on">
        <p class="try"><strong>다른 입력으로 확인</strong></p>
        <div id="forecast-actions" class="demand-actions"></div>
        <p id="forecast-feedback" class="readout" role="status"></p>
        <p id="prompt" class="try"></p>
        <p id="feedback" class="readout" role="status"></p>
        <div id="choices"></div>
      </div>
    </div>
    <section class="panel explanation" aria-labelledby="step-title">
      <h2 id="step-title"></h2><p id="body"></p>
      <div class="takeaway"><strong>관찰 포인트</strong><p id="takeaway"></p></div>
      <nav class="navigation" aria-label="이전 및 다음 단계"><button class="action" id="prev" type="button">이전 단계</button><button class="action primary" id="next" type="button">다음 단계</button></nav>
    </section>
  </div>
  <div class="sr-only" id="announcement" role="status"></div>
</main>
<dialog id="edit-demand" class="demand-dialog" aria-labelledby="edit-heading">
  <header><h2 id="edit-heading">실행 입력</h2><form method="dialog"><button class="action">닫기</button></form></header>
  <form id="edit-form" novalidate>
    <div class="demand-fields">
      <label>릿지 λ<input id="setting-ridge" type="number" inputmode="decimal" step="0.01" min="0.01" max="1000" required></label>
      <label>최소 개선<input id="setting-adopt" type="number" inputmode="decimal" step="any" min="0" max="10000" required></label>
      <label>복귀 격차<input id="setting-gap" type="number" inputmode="decimal" step="any" min="0.01" max="10000" required></label>
    </div>
    <label class="demand-upload"><span>JSON 바꾸기</span><input id="import-data" type="file" accept=".json,application/json"></label>
    <div class="demand-actions">
      <button type="submit" class="action primary" id="apply-config">입력 적용</button>
      <button type="button" class="action" id="reset-input">기본 입력 복원</button>
    </div>
    <p class="demand-status" id="edit-status" role="status"></p>
  </form>
</dialog>
<dialog id="forecast-results" class="demand-dialog" aria-labelledby="results-heading">
  <header><h2 id="results-heading">예측 실행 결과</h2><form method="dialog"><button class="action">닫기</button></form></header>
  <p class="demand-status" id="reference-status" role="status"></p>
  <div class="demand-fields">
    <label>품목<select id="results-item"></select></label>
    <label>예측월<select id="results-month"></select></label>
    <label>보기<select id="results-view"><option value="comparison">오차 비교</option><option value="decision">운영 결정</option><option value="features">가용 기록</option></select></label>
  </div>
  <div id="result-content" aria-live="polite"></div>
</dialog>
