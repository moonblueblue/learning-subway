<body>

<script>
const star = 'star';
const circle = 'circle';
const empty = [null, null, null];
const oneStar = [star, null, null];
const starCircle = [star, circle];
const circleStar = [circle, star];
const targetPattern = [star, star, circle];
const placeRule = '왼쪽부터 첫 빈 칸';

const lesson = [
  {

    example: ['빈 칸 세 개', '첫 빈 칸에 별', '별 · 빈 칸 · 빈 칸'],

  },
  {
    label: '다음 도장',
    title: '첫 칸에 별이 있어서 다음 빈 칸에 원을 찍습니다',
    body: '원의 지시도 왼쪽부터 첫 빈 칸을 찾으라고 합니다. 이번에는 첫 칸에 별이 있으므로 둘째 칸에 원을 찍습니다.',
    takeaway: '위에서 만든 별을 아래에서도 그대로 볼 수 있습니다. 원이 새로 생긴 곳은 2번 칸입니다.',
    example: ['별 · 빈 칸 · 빈 칸', '첫 빈 칸에 원', '별 · 원 · 빈 칸'],
    prompt: '별이 찍힌 카드에 원의 지시를 실행해 보세요. 별은 어느 칸에 남을까요?',
    description: '위에서 처음 빈 카드의 1번 칸에 별을 찍습니다. 아래는 그 결과에서 출발합니다. 왼쪽부터 처음 비어 있는 2번 칸에 원을 찍어서 별, 원, 빈 칸이 됩니다.'
  },
  {
    label: '순서 바꾸기',
    title: '같은 두 지시도 순서를 바꾸면 무늬가 달라집니다',
    body: '같은 빈 카드와 같은 두 지시로 시작합니다. 별을 먼저 찍으면 왼쪽부터 별과 원이 되고, 원을 먼저 찍으면 원과 별이 됩니다.',
    takeaway: '두 줄의 가운데 카드에는 먼저 찍은 도장만 있습니다. 오른쪽에서는 두 도장의 자리가 바뀌었습니다.',

    prompt: '두 지시 중 어느 것을 먼저 실행할지 골라 윗줄과 비교해 보세요.',
    description: '두 줄 모두 세 칸이 비어 있습니다. 위에서는 별 카드가 먼저라서 중간 카드에 별만 있고 최종 무늬는 별, 원, 빈 칸입니다. 아래에서는 원 카드가 먼저라서 중간 카드에 원만 있고 최종 무늬는 원, 별, 빈 칸입니다.'
  },
  {
    label: '찍을 자리 알리기',
    title: '어느 칸인지 말해 주면 찍을 자리가 정해집니다',
    body: '별을 찍으라고만 하면 첫째 칸에 찍는 사람과 셋째 칸에 찍는 사람이 있을 수 있습니다. 왼쪽부터 첫 빈 칸을 찾으라는 지시가 있으면 둘 다 첫째 칸에 찍습니다.',
    takeaway: '위의 별 카드에서는 오른쪽으로 두 길이 나갑니다. 아래에서 찍을 자리를 정하면 오른쪽에 한 가지 결과가 남습니다.',
    example: ['빈 칸 세 개', '왼쪽부터 첫 빈 칸', '1번 칸의 별'],
    prompt: '위의 지시처럼 별을 찍을 자리만 직접 골라 보세요. 아래의 구체적인 지시와 비교합니다.',
    description: '위에서 별을 찍으라는 지시는 자리를 정하지 않습니다. 예를 들어 1번 칸에 찍거나 3번 칸에 찍을 수 있습니다. 아래에서 왼쪽부터 첫 빈 칸에 별을 찍으라고 하면 1번 칸에만 별이 찍힙니다.'
  },
  {
    label: '같은 절차 전달',
    title: '같은 절차를 받은 동생도 같은 무늬를 만들 수 있습니다',
    body: '원하는 결과를 만들기 위해 따라 할 수 있게 정리한 절차를 알고리즘이라고 합니다. 빈 카드에서 출발해 같은 두 지시를 같은 순서로 따랐더니 나와 동생의 무늬가 같습니다.',
    takeaway: '나와 동생이 각각 빈 카드로 시작합니다. 둘 다 원을 찍고 별을 찍어서 원, 별, 빈 칸으로 끝납니다.',
    example: ['나와 동생의 빈 카드', '같은 알고리즘 실행', '두 카드 모두 원 · 별 · 빈 칸'],
    prompt: '위에서 내가 쓴 지시를 동생에게 보내세요. 동생의 빈 카드에는 어떤 무늬가 생길까요?',
    description: '나와 동생은 각각 빈 카드에서 시작합니다. 두 줄에 같은 알고리즘이 있습니다. 왼쪽부터 첫 빈 칸에 원을 찍고, 같은 방법으로 별을 찍습니다. 두 결과 모두 원, 별, 빈 칸입니다.'
  },
  {
    label: '새 무늬 전달',
    title: '원하는 무늬를 만들 지시를 순서대로 전합니다',
    body: '이번에 원하는 무늬는 별, 별, 원입니다. 세 칸을 차례로 채울 지시를 골라 보냅니다. 동생이 만든 카드가 원하는 무늬와 자리마다 같은지 확인합니다.',
    takeaway: '보낸 지시의 1·2·3번과 완성한 도장의 자리를 차례로 확인해 보세요.',
    example: ['별 · 별 · 원이 목표', '별, 별, 원 순서로 전달', '동생의 카드와 목표 일치'],
    prompt: '목표 무늬를 보고 동생에게 보낼 지시 카드 세 장을 순서대로 고르세요. 모두 고른 뒤 전달하고 결과를 확인하세요.',
    description: '빈 카드와 왼쪽부터 첫 빈 칸을 채우는 별, 별, 원 순서의 지시가 있습니다. 동생의 결과인 별, 별, 원을 목표와 같은 자리끼리 비교하면 세 칸 모두 같습니다.'
  }
];

const slug = 'repeatable-instructions';
const byId = id => document.getElementById(id);
const workspace = document.querySelector('.workspace');
const viewport = byId('scene');
const drawing = byId('stamp-drawing');
const viewWidth = 620;
const viewHeight = 280;
const center = {x: viewWidth / 2, y: viewHeight / 2};
const camera = {x: 0, y: 0, zoom: 1};
const maxZoom = 2.2;
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
const state = {index: -1, cards: [], position: null, applied: false};

function text(parent, x, y, value, className = 'caption') {
  svg('text', {x, y, class: className}, parent).textContent = value;
}

function rect(parent, x, y, width, height, className, rx = 6) {
  svg('rect', {x, y, width, height, rx, class: className}, parent);
}

function flow(parent, d) {
  svg('path', {d, class: 'flow'}, parent);
}

function stamp(parent, shape, x, y) {
  svg('use', {href: '#stamp-' + shape, x: x - 12, y: y - 12, width: 24, height: 24}, parent);
}

function paper(parent, values, x, y, numbered = false) {
  values.forEach((shape, i) => {
    const cell = x + (i - 1) * 37;
    if (numbered) text(parent, cell, y - 24, i + 1, 'small');
    rect(parent, cell - 16, y - 17, 32, 34, shape ? 'surface' : 'empty');
    if (shape) stamp(parent, shape, cell, y);
  });
}

function command(parent, shape, x, y, number) {
  rect(parent, x - 27, y - 19, 54, 38, shape ? 'instruction' : 'pending-card');
  text(parent, x - 14, y + 6, number, 'step-no');
  if (shape) stamp(parent, shape, x + 10, y);
  else text(parent, x + 10, y + 6, '·', 'step-no');
}

function filled(paperValues, cards) {
  const result = [...paperValues];
  for (const shape of cards) result[result.indexOf(null)] = shape;
  return result;
}

function singleRow(from, shape, result, y, number = 1) {
  paper(drawing, from, 101, y, true);
  paper(drawing, result, 519, y, true);
  command(drawing, shape, 310, y, number);
  text(drawing, 310, y - 31, placeRule);
  flow(drawing, `M 166 ${y} H 273`);
  if (result !== from) flow(drawing, `M 347 ${y} H 454`);
}

function sequenceRow(cards, y, applied) {
  const [first, second] = cards;
  paper(drawing, empty, 64, y);
  command(drawing, first, 184, y, 1);
  paper(drawing, applied ? filled(empty, [first]) : empty, 309, y);
  command(drawing, second, 433, y, 2);
  paper(drawing, applied ? filled(empty, cards) : empty, 556, y);
  if (first) flow(drawing, `M 122 ${y} H 152`);
  if (!applied) return;
  flow(drawing, `M 215 ${y} H 250`);
  flow(drawing, `M 367 ${y} H 401`);
  flow(drawing, `M 465 ${y} H 497`);
}

function ambiguousPlacement(practicing) {
  paper(drawing, empty, 101, 85, true);
  command(drawing, star, 310, 85, 1);
  text(drawing, 310, 55, '별 찍기');
  text(drawing, 519, 22, '가능한 결과의 예');
  text(drawing, 426, 93, '?', 'heading');
  flow(drawing, 'M 166 85 H 272');
  for (const [position, y] of [[0, 53], [2, 117]]) {
    const selected = !practicing || state.position === position;
    const result = [...empty];
    if (selected) {
      result[position] = star;
      flow(drawing, `M 347 85 H 395 L 453 ${y}`);
    }
    paper(drawing, result, 519, y);
  }
  svg('line', {x1: 29, y1: 157, x2: 590, y2: 157, class: 'rule'}, drawing);
  singleRow(empty, star, oneStar, 224);
}

function deliveredPattern(cards, applied) {
  const result = applied ? filled(empty, cards) : empty;
  text(drawing, 101, 33, '빈 카드');
  text(drawing, 310, 27, '전달한 지시', 'heading');
  text(drawing, 310, 48, placeRule, 'small');
  text(drawing, 519, 33, '동생이 만든 카드');
  paper(drawing, empty, 101, 89);
  for (let i = 0; i < 3; i++) command(drawing, cards[i], 244 + i * 66, 89, i + 1);
  paper(drawing, result, 519, 89);
  if (cards.length) flow(drawing, 'M 164 89 H 208');
  if (applied) flow(drawing, 'M 404 89 H 454');
  text(drawing, 425, 232, '만들 무늬');
  paper(drawing, targetPattern, 519, 226);
  if (!applied) return;
  const matches = result.map((shape, i) => shape === targetPattern[i]);
  matches.forEach((match, i) => {
    const x = 519 + (i - 1) * 37;
    svg('line', {x1: x, y1: 114, x2: x, y2: 201, class: 'match-lines'}, drawing);
    rect(drawing, x - 12, 145, 24, 24, match ? 'match-chip' : 'miss-chip', 12);
    text(drawing, x, 163, match ? '✓' : '×', 'step-no');
  });
  text(drawing, 310, 168, matches.every(Boolean) ? '같은 무늬' : '다른 자리가 있어요', 'heading');
}

function practiceDescription() {
  const {index, cards, position, applied} = state;
  if (index === 0) return applied
    ? '1번 칸에 별이 찍혔습니다. 2번과 3번 칸은 비어 있습니다.'
    : '세 칸이 모두 비어 있습니다. 별 카드의 실행을 기다립니다.';
  if (index === 1) return applied
    ? '1번 칸의 별 옆에 원을 찍었습니다. 3번 칸은 비어 있습니다.'
    : '위에서 1번 칸에 별을 찍었습니다. 아래는 그 카드에서 시작해 원 카드의 실행을 기다립니다.';
  if (index === 2) {
    if (!applied) return '위에서는 별을 먼저 찍고 원을 찍습니다. 아래는 같은 빈 카드에서 시작해 순서를 고르기를 기다립니다.';
    return cards[0] === star
      ? '위아래에서 모두 별을 먼저 찍고 원을 찍어, 별, 원, 빈 칸이 되었습니다.'
      : '위는 별, 원, 빈 칸입니다. 아래는 원을 먼저 찍고 별을 찍어, 원, 별, 빈 칸이 되었습니다.';
  }
  if (index === 3) {
    if (position === null) return '위의 별 지시는 자리를 고르기를 기다립니다. 아래의 구체적인 지시는 1번 칸에 별을 찍습니다.';
    return position === 0
      ? '위에서 1번을 골라 별이 1번 칸에 있습니다. 아래에서도 별이 1번 칸에 있습니다.'
      : '위에서 3번을 골라 별이 3번 칸에 있습니다. 아래의 구체적인 지시에서는 별이 1번 칸에 있습니다.';
  }
  if (index === 4) return applied
    ? '나와 동생이 같은 순서로 원과 별을 찍어 두 카드 모두 원, 별, 빈 칸입니다.'
    : '내 카드는 원, 별, 빈 칸입니다. 동생은 빈 카드에서 같은 지시를 실행하기를 기다립니다.';
  if (!applied) {
    return [
      '목표는 별, 별, 원입니다. 빈 카드에서 시작하며 아직 고른 지시가 없습니다.',
      '첫 번째 지시 카드를 골랐습니다. 나머지 두 장을 골라 보세요.',
      '두 장을 골랐습니다. 마지막 지시 카드를 골라 보세요.',
      '세 장을 골랐습니다. 전달하고 실행하면 동생의 결과를 볼 수 있습니다.'
    ][cards.length];
  }
  const differs = cards.flatMap((shape, i) => shape === targetPattern[i] ? [] : [i + 1]);
  if (!differs.length) return '세 자리의 도장이 모두 같습니다. 목표 무늬를 전달했습니다.';
  return `목표와 다른 칸은 ${differs.join(', ')}번입니다. 카드를 비우고 다시 골라 보세요.`;
}

function describeDelivery() {
  const current = state.cards.map(shape => shape === star ? '별' : '원');
  const description = byId('scene-desc');
  description.textContent = practiceDescription();
  if (!current.length) return;
  description.append(document.createTextNode(' '), document.createTextNode('고른 지시'), document.createTextNode(' '));
  current.forEach((label, index) => {
    if (index) description.append(document.createTextNode(' · '));
    description.append(document.createTextNode(label));
  });
}

function renderScene() {
  const practicing = coursePracticeStarted && !workspace.classList.contains('course-reading');
  const {index, cards, applied} = state;
  drawing.replaceChildren();
  if (index === 0) {
    singleRow(empty, star, !practicing || applied ? oneStar : empty, 141);
  } else if (index === 1) {
    singleRow(empty, star, oneStar, 83);
    svg('line', {x1: 29, y1: 140, x2: 590, y2: 140, class: 'rule'}, drawing);
    singleRow(oneStar, circle, !practicing || applied ? filled(oneStar, [circle]) : oneStar, 204, 2);
  } else if (index === 2) {
    text(drawing, 310, 33, placeRule, 'heading');
    sequenceRow(starCircle, 96, true);
    svg('line', {x1: 29, y1: 146, x2: 590, y2: 146, class: 'rule'}, drawing);
    sequenceRow(practicing ? cards : circleStar, 196, !practicing || applied);
  } else if (index === 3) {
    ambiguousPlacement(practicing);
  } else if (index === 4) {
    text(drawing, 310, 28, '알고리즘', 'heading');
    text(drawing, 310, 50, placeRule);
    text(drawing, 64, 81, '나');
    text(drawing, 64, 184, '동생');
    sequenceRow(circleStar, 107, true);
    svg('line', {x1: 29, y1: 151, x2: 590, y2: 151, class: 'rule'}, drawing);
    sequenceRow(circleStar, 210, !practicing || applied);
  } else {
    deliveredPattern(practicing ? cards : targetPattern, !practicing || applied);
  }
  if (practicing && index === 5) describeDelivery();
  else byId('scene-desc').textContent = practicing ? practiceDescription() : lesson[index].description;
}

const practiceOptions = [
  [['별 카드 실행', () => { state.applied = true; }]],
  [['원 카드 실행', () => { state.applied = true; }]],
  [
    ['별 먼저', () => { state.cards = starCircle; state.applied = true; }],
    ['원 먼저', () => { state.cards = circleStar; state.applied = true; }]
  ],
  [
    ['1번 칸에 찍기', () => { state.position = 0; }],
    ['3번 칸에 찍기', () => { state.position = 2; }]
  ],
  [['동생에게 전하기', () => { state.applied = true; }]],
  [
    ['별 카드 추가', () => { state.cards.push(star); }],
    ['원 카드 추가', () => { state.cards.push(circle); }]
  ]
];

function updatePractice(announce) {
  const {index, cards, applied} = state;
  if (index === 5) {
    for (const button of byId('choices').children) button.disabled = cards.length === 3;
    byId('run-stamps').disabled = cards.length !== 3 || applied;
    byId('clear-stamps').disabled = !cards.length;
  }
  byId('stamp-status').textContent = announce ? practiceDescription() : '';
  renderScene();
}

function renderPractice(step) {
  byId('stamp-prompt').textContent = step.prompt;
  byId('run-actions').hidden = state.index !== 5;
  byId('choices').replaceChildren(...practiceOptions[state.index].map(([label, perform]) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'action';
    button.textContent = label;
    button.onclick = () => {
      perform();
      updatePractice(true);
    };
    return button;
  }));
  updatePractice(false);
}

byId('run-stamps').onclick = () => {
  state.applied = true;
  updatePractice(true);
};
byId('clear-stamps').onclick = () => {
  state.cards = [];
  state.applied = false;
  updatePractice(true);
};

function showStep(index, announce = true) {
  state.index = index;
  state.cards = [];
  state.position = null;
  state.applied = false;
  const step = lesson[index];
  byId('step-title').textContent = step.title;
  byId('body').textContent = step.body;
  byId('takeaway').textContent = step.takeaway;
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  for (const [position, button] of stepButtons.entries()) {
    if (position === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  }
  renderPractice(step);
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${step.title}`;
}

function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/${slug}/${index + 1}`);
  showStep(index);
}

const stepButtons = lesson.map(({label}, index) => {
  const item = document.createElement('li');
  const button = document.createElement('button');
  const number = document.createElement('span');
  button.type = 'button';
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.onclick = () => goToStep(index);
  item.append(button);
  byId('steps').append(item);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
byId('zoom-in').onclick = () => zoomBy(.3);
byId('zoom-out').onclick = () => zoomBy(-.3);
enableCameraDrag();

viewport.addEventListener('keydown', event => {
  if (camera.zoom === 1) return;
  const direction = {ArrowLeft: [-1, 0], ArrowUp: [0, -1], ArrowRight: [1, 0], ArrowDown: [0, 1]}[event.key];
  if (!direction) return;
  event.preventDefault();
  setCamera(camera.x + direction[0] * 18, camera.y + direction[1] * 18, camera.zoom);
});

window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
window.addEventListener('keydown', event => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  const action = {
    ArrowLeft: () => goToStep(state.index - 1),
    ArrowRight: () => goToStep(state.index + 1),
    '+': () => zoomBy(.3),
    '-': () => zoomBy(-.3),
    '0': resetView
  }[event.key];
  if (!action) return;
  event.preventDefault();
  action();
});

new MutationObserver(renderScene).observe(workspace, {attributes: true, attributeFilter: ['class']});
const initial = routeIndex();
history.replaceState(null, '', `#/${slug}/${initial + 1}`);
setCamera(0, 0, 1);
showStep(initial, false);
</script>
</body>
</html>
