<html lang="ko">
<head>
<meta charset="utf-8">

<title>인터넷의 큰 그림 · 레슨 0.7</title>
<style>
:root{color-scheme:light;--ink:#142620;--muted:#43574f;--border:#cbd9d0;--paper:#f4f7ef;--panel:#fff;--accent:#0f766e;--request:#187959;--response:#5362a0;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.65 system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled,button[aria-disabled=true]{cursor:default;opacity:.5}
:focus-visible{outline:3px solid #a24c14;outline-offset:3px}
.shell{max-width:1280px;margin:auto;padding:clamp(16px,2.5vw,32px)}
header{margin-bottom:20px}
h1,h2,p{margin:0}
.eyebrow{color:var(--accent);font-size:.875rem;font-weight:700;margin-bottom:6px}
h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.12;letter-spacing:-.065em}
header p{color:var(--muted);margin-top:10px}
.workspace{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(360px,1fr);gap:20px;align-items:stretch}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:18px;overflow:hidden}
.stage-top,.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;flex-wrap:wrap}
.stage-top h2,.timeline h2{font-size:1rem}
.status{color:var(--accent);font-size:.875rem;font-weight:700}
.stage{background:#eaf3eb;border-block:1px solid var(--border)}
svg{display:block;width:100%;height:auto;max-height:520px}
#scene{touch-action:none;user-select:none}
#scene:focus-visible{outline-offset:-4px}
#scene.is-zoomed{cursor:grab}
#scene.is-dragging{cursor:grabbing}
.view-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--border)}
.view-scale{min-width:4ch;text-align:center;color:var(--muted);font:700 .875rem var(--mono)}
.view-hint{color:var(--muted);font-size:.875rem;margin-inline-start:auto}
.touch-hint{display:none}
@media(pointer:coarse){.mouse-hint{display:none}.touch-hint{display:inline}}
.iso-grid{fill:none;stroke:#86ad97;stroke-width:.6;stroke-opacity:.24}
.node .face{stroke-width:.8;stroke-linejoin:round}
.node .shadow{fill:#1f4434;opacity:.16}
.node .highlight{fill:none;stroke:#fff;stroke-opacity:.75;stroke-width:1.1;stroke-linecap:round}
.casing{fill:none;stroke:#eaf3eb;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.wire{fill:none;stroke-linecap:round;stroke-linejoin:round}
.wire.request{stroke:var(--request);stroke-width:2.6}
.wire.response{stroke:var(--response);stroke-width:2.2;stroke-dasharray:6 5}
.chevron{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chevron.request{stroke:var(--request)}
.chevron.response{stroke:var(--response)}
.tag rect{fill:#fff;fill-opacity:.94;stroke:#c9d6ce;stroke-width:.8}
.tag text{font:600 12px system-ui,sans-serif;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.badge{transition:opacity .37s}
.badge rect{fill:#fff6ef;stroke:#a24c14;stroke-width:.9}
.badge text{font:700 11px var(--mono);fill:#a24c14;text-anchor:middle;dominant-baseline:central;letter-spacing:.02em}
.badge.ok rect{fill:#f1f7f2;stroke:#7fa891}
.badge.ok text{fill:#2f6b4f}
.packet{stroke:white;stroke-width:1.6}
.packet-halo{opacity:.22}
@media(max-width:600px){.tag text{font-size:17px}.badge text{font-size:15px}}
@media(prefers-reduced-motion:reduce){.badge{transition:none}}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.875rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sample{width:22px;border-top:3px solid var(--request)}
.sample.return{border-top:3px dashed var(--response)}
.actions,.navigation{display:flex;gap:8px;flex-wrap:wrap}
.action{border:1px solid #9fb7a9;background:white;border-radius:9px;padding:7px 12px;min-height:44px;font-size:.875rem;font-weight:650}
.action:hover:not(:disabled):not([aria-disabled=true]){background:#e4f3f1}
.primary{background:var(--accent);color:white;border-color:var(--accent)}
.primary:hover:not(:disabled){background:#115e59}
.timeline{padding:15px 18px}
.timeline-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.timeline-top span{font:700 .875rem var(--mono);color:var(--muted)}
.steps{list-style:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:0;margin:0;gap:8px}
@media(max-width:640px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.steps button{height:100%;min-height:52px;text-align:left;width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:#f6f8f5;font-size:.875rem;line-height:1.45;display:flex;gap:7px;align-items:center}
.steps button:hover{border-color:var(--accent)}
.steps button[aria-current=step]{background:#d5efeb;border-color:var(--accent);font-weight:750}
.step-number{font:700 .875rem var(--mono);color:var(--accent)}
.explanation{padding:clamp(20px,2.4vw,32px);display:flex;flex-direction:column;gap:20px}
.explanation h2{font-size:clamp(1.5rem,2.3vw,2.1rem);letter-spacing:-.055em;line-height:1.3}
.explanation p{color:var(--muted);font-size:1.0625rem;line-height:1.75}
.takeaway p{font-size:1rem}
.takeaway{padding:12px 14px;background:#e9f5f3;border-left:3px solid var(--accent);border-radius:0 9px 9px 0}
.takeaway strong{display:block;color:var(--accent);font-size:.875rem}
.navigation{justify-content:space-between;margin-top:auto;padding-top:8px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(max-width:980px){.workspace{grid-template-columns:1fr}.navigation{margin-top:0}}
@media(max-width:420px){.shell{padding:18px 12px}.stage-top,.controls,.timeline,.view-controls{padding-inline:12px}.view-hint{flex-basis:100%;margin-inline-start:0}.steps{gap:5px}.steps button{padding-inline:6px}}
</style>

<body>
<main class="shell">
  <header><p class="eyebrow">0장 컴퓨팅 둘러보기 · 레슨 0.7</p><h1>인터넷의 큰 그림</h1><p>메시지 하나는 어떻게 지구 반대편까지 갈까요? 내 노트북에서 출발한 패킷이 여러 기계를 건너 서버에 닿고, 답장이 돌아오는 길을 따라가 보세요.</p></header>

            </defs>

              <path id="grid" class="iso-grid" mask="url(#grid-mask)"></path>

            </g>
          </svg>
        </div>

    </section>
  </div>
  <div class="sr-only" id="announcement" role="status"></div>
</main>
<script>
// World positions are on the floor grid. Linked machines share an x or y coordinate so lanes stay straight.
// Four backbone routers form a square, so a packet has two ways across: via r1 or via r2. The square is 10
// wide and the home router 9 back, so on a narrow screen (17px names) router B's name clears router A's badge
// and the home router's name clears the ISP's.
const entities = {
  laptop: { world: [0, -15], label: '내 노트북', shape: 'client' },
  home: { world: [0, -9], label: '공유기', shape: 'router' },
  isp: { world: [0, 0], label: '통신사', shape: 'isp', tag: 'corner' },
  r1: { world: [10, 0], label: '라우터 A', shape: 'router' },
  r2: { world: [0, 10], label: '라우터 B', shape: 'router', tag: 'corner' },

  server: { world: [18, 10], label: '해외 서버', shape: 'server' },
};
const all = ['laptop', 'home', 'isp', 'r1', 'r2', 'r3', 'server'];
const there = [['laptop', 'home', 'request'], ['home', 'isp', 'request'], ['isp', 'r1', 'request'], ['r1', 'r3', 'request'], ['r3', 'server', 'request']];

const lesson = [
  {

    description: '노트북과 공유기가 있습니다. 메시지가 패킷 세 개로 나뉘어 공유기로 갑니다.',

  },
  {

    example: ["집 밖의 목적지", "공유기에서 통신사로", "다음 네트워크에 도착"],

    nodes: all,

    links: [['server', 'r3', 'response'], ['r3', 'r1', 'response'], ['r1', 'isp', 'response'], ['isp', 'home', 'response'], ['home', 'laptop', 'response']],

    example: ["라우터 A 고장", "패킷이 B 쪽으로 우회", "같은 해외 서버에 도착"],

    takeaway: '라우터 A 위에 "고장"이 뜨고, 패킷은 통신사에서 라우터 B를 거쳐 돌아갑니다.',

const byId = (id) => document.getElementById(id);
const viewport = byId('scene');
const viewWidth = 620;
const viewHeight = 280;
const maxZoom = 3;
const center = { x: viewWidth / 2, y: viewHeight / 2 };
const camera = { x: 0, y: 0, zoom: 1 };
const pointers = new Map();
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));



// Convert from screen pixels to fixed viewport coordinates, accounting for SVG letterboxing.


viewport.addEventListener('pointerdown', (event) => {
  if (event.button !== 0 || pointers.size >= 2) return;
  if (event.pointerType !== 'touch' && camera.zoom === 1) return;
  pointers.set(event.pointerId, viewportPoint(event));
  viewport.setPointerCapture(event.pointerId);
});
viewport.addEventListener('pointermove', (event) => {
  if (!pointers.has(event.pointerId)) return;
  const before = pointerGeometry();
  pointers.set(event.pointerId, viewportPoint(event));
  const after = pointerGeometry();
  const pinch = pointers.size === 2;
  if (pinch && (before.distance < 1 || after.distance < 1)) return;
  const zoom = pinch ? camera.zoom * after.distance / before.distance : camera.zoom;
  zoomBetween(zoom, before.point, after.point);
  viewport.classList.toggle('is-dragging', !pinch && camera.zoom > 1);
});
for (const eventName of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  viewport.addEventListener(eventName, (event) => {
    if (pointers.delete(event.pointerId)) viewport.classList.remove('is-dragging');
  });
}



byId('zoom-in').onclick = () => zoomBy(.25);
byId('zoom-out').onclick = () => zoomBy(-.25);
viewport.addEventListener('keydown', (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const directions = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const direction = directions[event.key];
  if (direction && camera.zoom > 1) {
    event.preventDefault();
    setCamera(camera.x + direction[0] * 28 / camera.zoom, camera.y + direction[1] * 28 / camera.zoom, camera.zoom);
  } else if (event.key === '+' || event.key === '=' || event.key === '-') {
    event.preventDefault();
    zoomBy(event.key === '-' ? -.25 : .25);
  } else if (event.key === '0') {
    event.preventDefault();
    resetView();
  }
});
setCamera(0, 0, 1);

const motion = matchMedia('(prefers-reduced-motion: reduce)');
const storageKey = 'internet-lab:v1:step';
const state = { index: 0, playing: !motion.matches, elapsed: 0, lastFrame: null, frame: null };
const segmentMs = 850;
const transitionMs = 370;
const nodeViews = new Map();
const linkViews = new Map();
let transition = null;
let paths = [];


// The same world-to-screen projection observed in the reference bundle.
const project = (x, y, z = 0) => [14 * (x + y), 7 * (x - y) - z];
const point = (x, y, z) => project(x, y, z).map((value) => +value.toFixed(2)).join(',');
const mix = (a, b, t) => a + (b - a) * t;
const laneColors = { request: '#187959', response: '#5362a0' };
const laneHeight = 12;
const laneGap = .42;
const rise = 10;

// Fit the scene into the 620x280 viewport. Measured from the union of all steps.
byId('world').setAttribute('transform', 'translate(220 150) scale(.78)');

const halo = svg('circle', { class: 'packet-halo', r: 9 }, byId('packets'));
const packet = svg('circle', { class: 'packet', r: 4.6 }, byId('packets'));

const gridLines = [];
for (let i = -18; i <= 18; i += 2) {
  gridLines.push(`M${point(i, -18, 0)}L${point(i, 18, 0)}M${point(-18, i, 0)}L${point(18, i, 0)}`);
}
byId('grid').setAttribute('d', gridLines.join(''));

const shapes = {
  client: { half: 1.6, height: 26, colors: { top: '#f4f7f5', left: '#d7dfdb', right: '#b8c6c0', stroke: '#8c9d96' } },
  router: { half: 1.3, height: 9, colors: { top: '#e3ebf6', left: '#b9c9de', right: '#93a8c4', stroke: '#6f86a6' } },
  isp: { half: 1.9, height: 34, colors: { top: '#f6efe0', left: '#e3d2b0', right: '#c9b287', stroke: '#9c8458' } },
  server: { half: 1.8, height: 40, colors: { top: '#e6eff6', left: '#bfd4e3', right: '#95b3c8', stroke: '#7896ab' } },
  db: { radius: 1.8, height: 40, colors: { top: '#eaeef9', stroke: '#7a87b5' } },
};

// Soft floor shadow, offset away from the light (top left).
function drawShadow(node, half) {
  const corners = [[-half + .5, -half - .3], [half + 1.1, -half - .3], [half + 1.1, half], [-half + .5, half]];
  svg('polygon', { class: 'shadow', points: corners.map(([x, y]) => point(x, y, 0)).join(' '), filter: 'url(#soft-shadow)' }, node);
}

// Box drawn around its own floor center: front-left face, front-right face, top.
function drawBox(node, kind) {
  const { half: h, height: H, colors: c } = shapes[kind];
  drawShadow(node, h);
  const left = [[-h, -h, 0], [h, -h, 0], [h, -h, H], [-h, -h, H]];
  const right = [[h, -h, 0], [h, h, 0], [h, h, H], [h, -h, H]];
  const top = [[-h, -h, H], [h, -h, H], [h, h, H], [-h, h, H]];
  for (const [corners, fill] of [[left, c.left], [right, c.right], [top, c.top]]) {
    svg('polygon', { class: 'face', points: corners.map((p) => point(...p)).join(' '), fill, stroke: c.stroke }, node);
  }
  svg('path', { class: 'highlight', d: `M${point(-h, -h, H)}L${point(h, -h, H)}L${point(h, h, H)}` }, node);
  if (kind === 'router') {
    // Two antennas and a row of lights.
    for (const x of [-h + .4, h - .4]) {
      svg('path', { d: `M${point(x, h - .3, H)}L${point(x, h - .3, H + 12)}`, stroke: c.stroke, 'stroke-width': 1.6, 'stroke-linecap': 'round' }, node);
    }
    for (let k = 0; k < 4; k++) {
      const [cx, cy] = project(-h + .5 + k * .55, -h, H / 2);
      svg('circle', { cx, cy, r: 1.3, fill: '#2f9a63' }, node);
    }
  } else if (kind === 'isp' || kind === 'server') {
    // Rack slots with status lights on the front face.
    for (const z of [H * .25, H * .45, H * .65, H * .85]) {
      svg('path', { d: `M${point(-h + .4, -h, z)}L${point(h - 1.1, -h, z)}`, stroke: c.stroke, 'stroke-width': 1.4, 'stroke-linecap': 'round', opacity: .55 }, node);
      const [cx, cy] = project(h - .55, -h, z);
      svg('circle', { cx, cy, r: 1.6, fill: '#2f9a63' }, node);
    }
  } else if (kind === 'client') {
    // A screen on the front face.
    const screen = [[-h + .35, -h, 7], [h - .35, -h, 7], [h - .35, -h, H - 6], [-h + .35, -h, H - 6]];
    svg('polygon', { points: screen.map((p) => point(...p)).join(' '), fill: '#34514a', opacity: .85 }, node);
    const glare = [screen[2], screen[3], [-h + .35, -h, H - 10], [h - .35, -h, H - 10]];
    svg('polygon', { points: glare.map((p) => point(...p)).join(' '), fill: '#fff', opacity: .12 }, node);
  }
  return { right: project(h, 0, 0), corner: project(h, -h, 0), top: -H - 14 * h };
}

function drawDatabase(node) {
  const { radius: r, height: H, colors: c } = shapes.db;
  drawShadow(node, r * .95);
  // A floor circle of radius r projects to an ellipse with a 2:1 ratio.
  const rx = 14 * Math.SQRT2 * r;
  const ry = 7 * Math.SQRT2 * r;
  svg('path', { class: 'face', d: `M${-rx} ${-H}V0A${rx} ${ry} 0 0 0 ${rx} 0V${-H}Z`, fill: 'url(#db-body)', stroke: c.stroke }, node);
  for (const k of [1 / 3, 2 / 3]) {
    const y = -H * k;
    svg('path', { d: `M${-rx} ${y}A${rx} ${ry} 0 0 0 ${rx} ${y}`, fill: 'none', stroke: c.stroke, 'stroke-width': .8, opacity: .7 }, node);
    svg('path', { d: `M${-rx + 2} ${y - 2}A${rx} ${ry} 0 0 0 ${rx - 2} ${y - 2}`, fill: 'none', stroke: '#fff', 'stroke-width': .9, opacity: .35 }, node);
  }
  svg('ellipse', { class: 'face', cx: 0, cy: -H, rx, ry, fill: c.top, stroke: c.stroke }, node);
  svg('ellipse', { cx: 0, cy: -H, rx: rx * .62, ry: ry * .62, fill: 'none', stroke: c.stroke, 'stroke-width': .7, opacity: .35 }, node);
  return { right: [rx * .7, ry * .7], corner: [0, ry], top: -H - ry };
}

// Name plates sit on the floor beside the shape so they never cover it.
const plates = [];
function sizePlate(plate) {
  const size = parseFloat(getComputedStyle(plate.label).fontSize);
  const width = plate.label.getComputedTextLength() + size * 1.5;
  const height = size + 8;
  const x = plate.centered ? plate.x : plate.x + width / 2 - 6;
  plate.label.setAttribute('x', x);
  plate.label.setAttribute('y', plate.y);
  Object.entries({ x: x - width / 2, y: plate.y - height / 2, width, height, rx: height / 2 })
    .forEach(([key, value]) => plate.rect.setAttribute(key, value));
}
function addPlate(node, className, x, y, text, centered = true) {
  const group = svg('g', { class: className }, node);
  const plate = { group, rect: svg('rect', {}, group), label: svg('text', {}, group), x, y, centered };
  plate.label.textContent = text;
  plates.push(plate);
  sizePlate(plate);
  return plate;
}
matchMedia('(max-width: 600px)').addEventListener('change', () => plates.forEach(sizePlate));

function createNode(id) {
  const node = svg('g', { class: 'node ' + id, 'data-node': id }, byId('nodes'));
  const entity = entities[id];
  const anchors = entity.shape === 'db' ? drawDatabase(node) : drawBox(node, entity.shape);
  const atCorner = entity.tag === 'corner';
  const [x, y] = atCorner ? anchors.corner : anchors.right;
  addPlate(node, 'tag', x, y + (atCorner ? 16 : 10), entity.label, atCorner);
  const badge = addPlate(node, 'badge', 0, anchors.top - 14, '');
  badge.baseY = badge.y;
  badge.group.style.opacity = 0;
  return { node, badge };
}

function setBadge(view, spec) {
  const { group, label } = view.badge;
  if (spec) {
    group.classList.toggle('ok', spec.tone === 'ok');
    label.textContent = spec.text;
    // `lift` raises a badge whose router sits where wires come in from both sides at its top.
    view.badge.y = view.badge.baseY - (spec.lift ?? 0);
    sizePlate(view.badge);
  }
  group.style.opacity = spec ? 1 : 0;
}

// Centerline between two floor points along the grid axes: x first, then y, then x.
function centerline([ax, ay], [bx, by]) {
  if (Math.abs(ax - bx) < 1e-6 || Math.abs(ay - by) < 1e-6) return [[ax, ay], [bx, by]];
  const mx = (ax + bx) / 2;
  return [[ax, ay], [mx, ay], [mx, by], [bx, by]];
}

// Shift a centerline to the right-hand side of its travel direction,
// so a request and its response run as two parallel lanes.
function offsetLane(points, gap) {
  const shifts = [];
  for (let i = 0; i < points.length - 1; i++) {
    const dx = Math.sign(points[i + 1][0] - points[i][0]);
    const dy = Math.sign(points[i + 1][1] - points[i][1]);
    shifts.push(dx ? { y: dx * gap } : { x: -dy * gap });
  }
  return points.map(([x, y], i) => {
    let nx = x, ny = y;
    for (const shift of [shifts[i - 1], shifts[i]]) {
      if (shift?.x !== undefined) nx = x + shift.x;
      if (shift?.y !== undefined) ny = y + shift.y;
    }
    return [nx, ny];
  });
}

function updateGeometry(view) {
  const a = nodeViews.get(view.start);
  const b = nodeViews.get(view.end);
  const screen = offsetLane(centerline([a.wx, a.wy], [b.wx, b.wy]), laneGap)
    .map(([x, y]) => project(x, y, laneHeight));
  const d = 'M' + screen.map((p) => p.join(' ')).join('L');
  view.casing.setAttribute('d', d);
  view.line.setAttribute('d', d);
  // Direction marker near the middle of the longest segment.
  let best = -1, index = 0;
  for (let i = 0; i < screen.length - 1; i++) {
    const length = Math.hypot(screen[i + 1][0] - screen[i][0], screen[i + 1][1] - screen[i][1]);
    if (length > best) { best = length; index = i; }
  }
  const [p, q] = [screen[index], screen[index + 1]];
  const t = screen.length === 2 ? .42 : .5;
  const angle = Math.atan2(q[1] - p[1], q[0] - p[0]) * 180 / Math.PI;
  const transform = `translate(${mix(p[0], q[0], t)} ${mix(p[1], q[1], t)}) rotate(${angle})`;
  view.chevronCasing.setAttribute('transform', transform);
  view.chevron.setAttribute('transform', transform);
}

function createLink(key, from, to, kind) {
  const casing = svg('path', { class: 'casing', 'data-link': key }, byId('casings'));
  const group = svg('g', { class: 'lane', 'data-link': key }, byId('links'));
  const line = svg('path', { class: 'wire ' + kind }, group);
  const chevronCasing = svg('path', { class: 'casing', d: 'M-5 -5.5L2.5 0L-5 5.5', 'stroke-width': 6 }, group);
  const chevron = svg('path', { class: 'chevron ' + kind, d: 'M-5 -5.5L2.5 0L-5 5.5' }, group);
  return { casing, group, line, chevronCasing, chevron, kind, start: from, end: to, from: 0, opacity: 0 };
}

function renderScene(step, animate) {
  byId('scene-desc').textContent = step.description;
  for (const view of nodeViews.values()) {
    view.from = [view.wx, view.wy, view.opacity, view.lift];
    view.to = [view.wx, view.wy, 0, rise];
  }
  for (const id of step.nodes) {
    const [x, y] = step.positions?.[id] ?? entities[id].world;
    if (!nodeViews.has(id)) {
      const view = createNode(id);
      Object.assign(view, { wx: x, wy: y, opacity: 0, lift: rise, from: [x, y, 0, rise] });
      nodeViews.set(id, view);
    }
    const view = nodeViews.get(id);
    view.to = [x, y, 1, 0];
    setBadge(view, step.badges?.[id]);
  }
  for (const view of linkViews.values()) {
    view.from = view.opacity;
    view.to = 0;
  }
  paths = step.links.map(([from, to, kind]) => {
    const key = `${from}-${to}-${kind}`;
    if (!linkViews.has(key)) linkViews.set(key, createLink(key, from, to, kind));
    const view = linkViews.get(key);
    view.to = 1;
    return view;
  });
  transition = animate && !motion.matches ? performance.now() : null;
  updateScene(transition === null ? 1 : 0);
}

function updateScene(t) {
  const ease = t * t * (3 - 2 * t);
  for (const view of nodeViews.values()) {
    [view.wx, view.wy, view.opacity, view.lift] = view.from.map((value, index) => mix(value, view.to[index], ease));
    const [x, y] = project(view.wx, view.wy);
    view.node.setAttribute('transform', `translate(${x} ${y + view.lift})`);
    view.node.setAttribute('opacity', view.opacity);
  }
  const parent = byId('nodes');
  const depthOrder = [...nodeViews.values()].sort((a, b) => project(a.wx, a.wy)[1] - project(b.wx, b.wy)[1]);
  if (depthOrder.some((view, index) => parent.children[index] !== view.node)) {
    parent.append(...depthOrder.map((view) => view.node));
  }
  for (const [id, view] of linkViews) {
    view.opacity = mix(view.from, view.to, ease);
    view.group.setAttribute('opacity', view.opacity);
    view.casing.setAttribute('opacity', view.opacity * .9);
    updateGeometry(view);
    if (t !== 1) continue;
    if (view.to === 0) {
      view.group.remove();
      view.casing.remove();
      linkViews.delete(id);
    } else view.length = view.line.getTotalLength();
  }
  if (t !== 1) return;
  for (const [id, view] of nodeViews) {
    if (view.to[2] !== 0) continue;
    view.node.remove();
    nodeViews.delete(id);
  }
}

function paint() {
  const segment = Math.floor(state.elapsed / segmentMs);
  const path = paths[segment];
  const visible = path && transition === null && !motion.matches;
  for (const circle of [packet, halo]) circle.setAttribute('visibility', visible ? 'visible' : 'hidden');
  if (!visible) return;
  const at = path.line.getPointAtLength(path.length * ((state.elapsed % segmentMs) / segmentMs));
  for (const circle of [packet, halo]) {
    circle.setAttribute('cx', at.x);
    circle.setAttribute('cy', at.y);
    circle.setAttribute('fill', laneColors[path.kind]);
  }
}

function tick(now) {
  state.frame = null;
  if (transition !== null) {
    const progress = Math.max(0, Math.min((now - transition) / transitionMs, 1));
    updateScene(progress);
    if (progress === 1) transition = null;
    state.lastFrame = null;
  }
  if (state.playing && state.lastFrame !== null) {
    const cycle = paths.length * segmentMs + 600;
    state.elapsed = (state.elapsed + Math.min(now - state.lastFrame, 80)) % cycle;
  }
  state.lastFrame = now;
  paint();
  if (state.playing || transition !== null) state.frame = requestAnimationFrame(tick);
}

function syncPlayback() {
  if (state.frame !== null) cancelAnimationFrame(state.frame);
  state.frame = null;
  state.lastFrame = null;
  const reduced = motion.matches;
  if (reduced && transition !== null) {
    updateScene(1);
    transition = null;
  }
  paint();
  if (!reduced && (state.playing || transition !== null)) state.frame = requestAnimationFrame(tick);
}

function showStep(index, announce = true) {
  state.index = index;
  state.elapsed = 0;
  const step = lesson[index];
  byId('step-title').textContent = step.title;
  byId('body').textContent = step.body;
  byId('takeaway').textContent = step.takeaway;
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  stepButtons.forEach((button, i) => {
    if (i === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  try { localStorage.setItem(storageKey, String(index)); } catch {}
  renderScene(step, announce);
  syncPlayback();
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${step.title}`;
}

function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/internet/${index + 1}`);
  showStep(index);
}

function routeIndex() {
  const match = /^#\/internet\/(\d+)$/.exec(location.hash);
  const routed = match ? Number(match[1]) - 1 : -1;
  if (routed >= 0 && routed < lesson.length) return routed;
  try {
    const index = Number(localStorage.getItem(storageKey));
    if (Number.isInteger(index) && index >= 0 && index < lesson.length) return index;
  } catch {}
  return 0;
}

const stepButtons = lesson.map(({ label }, index) => {
  const listItem = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  const number = document.createElement('span');
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.addEventListener('click', () => goToStep(index));
  listItem.append(button);
  byId('steps').append(listItem);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
motion.addEventListener('change', () => {
  if (motion.matches) state.playing = false;
  syncPlayback();
});
window.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});
const initial = routeIndex();
history.replaceState(null, '', `#/internet/${initial + 1}`);
showStep(initial, false);
</script>
</body>
</html>
