<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="../shared/device-access.js?v=1f73c765843f36b1"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="같은 카드를 그리고 저장 여부를 바꿔 보며 메모리와 저장장치의 역할을 살펴보세요.">
<title>일하는 동안의 기억과 저장</title>
<link rel="stylesheet" href="../shared/reading-lesson.css">
<style>
#storage-drawing { text-anchor: middle; fill: var(--ink); }
#storage-drawing .heading { font: 720 17px system-ui, sans-serif; }
#storage-drawing .caption { font: 700 14px system-ui, sans-serif; }
#storage-drawing .small { font: 650 12px system-ui, sans-serif; }
#storage-drawing .window { fill: #f8fcfa; stroke: #617e70; stroke-width: 1.6; }
#storage-drawing .window-bar { fill: #d0e5da; }
#storage-drawing .icon-stroke { fill: #497163; }
#storage-drawing .empty { fill: #fbfdfa; stroke: #879d90; stroke-width: 1.5; stroke-dasharray: 4 4; }
#storage-drawing .folder { fill: #faf3de; stroke: #8a723b; stroke-width: 1.5; }
#storage-drawing .flow { fill: none; stroke: #176b57; stroke-width: 2.4; marker-end: url(#storage-tip); }
#storage-drawing .copy { stroke: #445789; marker-end: url(#storage-copy-tip); }
#storage-drawing .reading { stroke-dasharray: 5 4; }
#storage-drawing .quiet { fill: #4c6256; }
#storage-drawing .rule { stroke: #9cb3a5; stroke-width: 1; }
#scene.is-zoomed { cursor: grab; touch-action: none; }
#scene.is-dragging { cursor: grabbing; }
.storage-actions .action { min-height: 44px; }
</style>
<link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../shared/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="../shared/course.css?v=d9c4c7ece46ac390">
<script src="../shared/engine.js?v=18f6c6ea5ff4412f"></script>
<script defer blocking="render" src="../shared/catalog.js"></script>
<script defer blocking="render" src="./computer.en.js"></script>
<script defer blocking="render" src="../shared/i18n.js"></script>
<script defer blocking="render" src="../shared/course.js?v=42f6f4d09f421784"></script>
</head>
<body>
<main class="shell">
  <header>
    <p class="eyebrow">0장 컴퓨팅 둘러보기</p>
    <h1>일하는 동안의 기억과 저장</h1>
    <p>창을 닫고 나서 어떤 그림을 다시 열 수 있을까요?</p>
  </header>
  <div class="workspace">
    <div>
      <section class="panel" aria-labelledby="stage-heading">
        <div class="stage-top"><h2 id="stage-heading">작업 창과 파일 목록</h2></div>
        <div class="stage">
          <svg id="scene" viewBox="0 0 620 280" role="img" tabindex="0" aria-labelledby="scene-title scene-desc">
            <title id="scene-title">작업 중인 카드와 저장한 파일</title>
            <desc id="scene-desc"></desc>
            <defs>
              <marker id="storage-tip" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto">
                <path d="M 0 0 L 9 5 L 0 10 Z" fill="#176b57"/>
              </marker>
              <marker id="storage-copy-tip" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="9" refY="5" orient="auto">
                <path d="M 0 0 L 9 5 L 0 10 Z" fill="#445789"/>
              </marker>
              <symbol id="storage-star" viewBox="0 0 38 32">
                <rect x="1" y="1" width="36" height="30" rx="4" fill="#fff8e9" stroke="#8c6935" stroke-width="1.5"/>
                <path d="m19 5 3.3 6.7 7.4 1.1-5.4 5.2 1.3 7.4-6.6-3.5-6.6 3.5 1.3-7.4-5.4-5.2 7.4-1.1Z" fill="#f4d072" stroke="#855b31" stroke-width="1"/>
              </symbol>
              <symbol id="storage-wave" viewBox="0 0 38 32">
                <rect x="1" y="1" width="36" height="30" rx="4" fill="#edf6ff" stroke="#447089" stroke-width="1.5"/>
                <path d="M5 16h3l2-5 3 10 3-14 3 18 3-16 3 12 3-7 2 2h3" fill="none" stroke="#285d7c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </symbol>
            </defs>
            <g id="storage-drawing" aria-hidden="true"></g>
          </svg>
        </div>
        <div class="view-controls" role="group" aria-label="장면 보기">
          <button class="action" id="zoom-out" type="button" aria-label="장면 축소">−</button>
          <output id="view-scale" aria-label="현재 배율" aria-live="off">100%</output>
          <button class="action" id="zoom-in" type="button" aria-label="장면 확대">+</button>
        </div>
        <div class="controls"></div>
        <nav class="timeline" aria-labelledby="timeline-heading">
          <div class="timeline-top"><h2 id="timeline-heading">타임라인</h2><span id="count"></span></div>
          <ol class="steps" id="steps"></ol>
        </nav>
      </section>
      <div class="hands-on">
        <p id="storage-prompt" class="try"></p>
        <p id="storage-status" class="readout" role="status"></p>
        <div id="choices" class="storage-actions"></div>
      </div>
    </div>
    <section class="panel explanation" aria-labelledby="step-title">
      <h2 id="step-title"></h2>
      <p id="body"></p>
      <div class="takeaway"><strong>관찰 포인트</strong><p id="takeaway"></p></div>
      <nav class="navigation" aria-label="이전 및 다음 단계">
        <button class="action" id="prev" type="button">이전 단계</button>
        <button class="action primary" id="next" type="button">다음 단계</button>
      </nav>
    </section>
  </div>
  <div id="announcement" class="sr-only" role="status"></div>
</main>
<script>
const star = 'star';
const wave = 'wave';
const closed = 'closed';
const off = 'off';
const pending = 'pending';
const starFile = '별 카드';
const audioFile = '녹음 파일';

const lesson = [
  {
    label: '카드 그리기',
    title: '별을 그리면 먼저 작업 창에 보입니다',
    body: '자동 저장을 끈 그림 앱에서 새 카드를 엽니다. 별을 그리면 작업 창에 별이 생깁니다. 파일 목록은 비어 있습니다.',
    takeaway: '새로 생긴 별은 오른쪽 위 작업 창에 있습니다. 아래의 두 파일 목록은 그대로 비어 있습니다.',
    example: ['새 작업 창', '별 그리기', '작업 창에만 별'],
    prompt: '빈 카드에 별을 그려 보세요. 파일 목록에도 별이 생길까요?',
    actions: ['별 그리기'],
    moments: [
      ['새 작업', null, null, '새 작업 창과 파일 목록이 비어 있습니다.'],
      ['별 그린 뒤', star, null, '작업 창에 별이 생겼습니다. 파일 목록은 비어 있습니다.']
    ],
    description: '왼쪽 작업 창은 빈 카드입니다. 별을 그리면 오른쪽 작업 창에 별이 생깁니다. 아래 파일 목록은 두 시점 모두 비어 있습니다.'
  },
  {
    label: '저장 없이 닫기',
    title: '저장하지 않고 닫으면 새 창에 별이 돌아오지 않습니다',
    body: '‘저장 안 함’을 고르고 창을 닫습니다. 별을 담은 파일을 만들지 않았으므로 앱에서 새 작업을 열면 빈 카드가 나옵니다.',
    takeaway: '위쪽 별 카드는 창을 닫을 때 없어집니다. 네 시점 모두 아래 파일 목록이 비어 있습니다.',
    example: ['작업 창의 별', '저장 안 함 · 창 닫기', '새 작업은 빈 카드'],
    prompt: '저장하지 않는 쪽을 따라가 보세요. 새 작업을 열고 별 카드가 있는지 확인합니다.',
    actions: ['저장 안 함', '창 닫기', '새 작업 열기'],
    moments: [
      ['그린 카드', star, null, '작업 창에 별 카드가 있고 파일 목록은 비어 있습니다.'],
      ['저장 안 함', star, null, '저장하지 않기로 했습니다. 창을 닫기 전에는 별이 보입니다.'],
      ['창 닫힘', closed, null, '창을 닫아 작업 중인 별이 사라졌습니다. 파일 목록은 비어 있습니다.'],
      ['새 작업 열기', null, null, '새 작업은 빈 카드입니다. 파일 목록에도 별 카드가 없습니다.']
    ],
    description: '별이 있는 작업 창에서 저장 안 함을 고르고 창을 닫습니다. 앱에서 새 작업을 열면 빈 카드입니다. 처음부터 끝까지 아래 파일 목록에는 별 카드가 없습니다.'
  },
  {
    label: '저장하고 닫기',
    title: '저장한 별 카드는 파일 목록에서 다시 열 수 있습니다',
    body: '다시 같은 별 카드를 그리고 저장합니다. 별 카드 한 장이 파일로 복사됩니다. 창을 닫아도 파일 목록에 별 카드가 남아 있어서 다시 열 수 있습니다.',
    takeaway: '둘째 열에는 별 카드가 두 곳에 보입니다. 셋째 열에서 창을 닫은 뒤에는 파일 목록에만 남습니다.',
    example: ['같은 별 카드', '저장 · 창 닫기', '목록에서 별 카드 열기'],
    prompt: '저장하고 창을 닫아 보세요. 파일 목록의 별 카드를 열면 어디에 보일까요?',
    actions: ['파일에 저장', '창 닫기', '파일 열기'],
    moments: [
      ['그린 카드', star, null, '작업 창에 별 카드가 있고 파일 목록은 비어 있습니다.'],
      ['저장', star, star, '별 카드가 파일로 복사되었습니다. 작업 창에도 별이 남아 있습니다.'],
      ['창 닫힘', closed, star, '창을 닫았습니다. 작업 중인 별은 사라지고 파일 목록에는 별 카드가 남았습니다.'],
      ['파일 열기', star, star, '파일에서 작업 창으로 별 카드가 다시 들어왔습니다. 파일도 그대로 남아 있습니다.']
    ],
    description: '같은 별 카드를 그립니다. 저장하면 별이 작업 창과 아래 파일 목록에 함께 있습니다. 창을 닫아도 목록에 파일이 남습니다. 저장 파일을 열면 같은 별이 위의 새 작업 창에도 보입니다.'
  },
  {
    label: '메모리와 저장장치',
    title: '작업 중인 내용과 보관한 파일은 다른 곳에 있습니다',
    body: '컴퓨터는 작업 중인 내용을 메모리에 둡니다. 전원을 끄면 이 메모리의 내용이 사라집니다. 저장장치에 둔 파일은 남으므로 다시 켠 뒤 열 수 있습니다.',
    takeaway: '전원을 끈 열에서 위 메모리는 비고 아래 저장장치에는 별 카드가 남습니다. 파일을 열면 같은 별이 위로 올라옵니다.',
    example: ['메모리와 저장장치에 별', '전원 끄기 · 다시 켜기', '남은 파일을 메모리로 열기'],
    prompt: '전원을 끈 뒤 다시 켜고 파일을 열어 보세요. 전원이 꺼진 동안 별은 어디에 남았나요?',
    actions: ['전원 끄기', '다시 켜고 파일 열기'],
    moments: [
      ['저장 직후', star, star, '메모리의 작업 중인 별과 저장장치의 별 카드 파일이 함께 있습니다.'],
      ['전원 끔', off, star, '전원을 껐습니다. 메모리는 비고 저장장치에는 별 카드 파일이 남았습니다.'],
      ['다시 켠 뒤 파일 열기', star, star, '전원을 다시 켜고 별 카드 파일을 열었습니다. 별 카드가 메모리와 화면에 다시 나타났습니다.']
    ],
    description: '위는 작업 중인 내용을 두는 메모리이고 아래는 저장한 파일을 두는 저장장치입니다. 전원을 끄면 위 메모리는 비고 아래에 별 카드 파일이 남습니다. 다시 켜고 파일을 열면 아래 저장장치의 별 카드가 위 메모리로 읽힙니다.'
  },
  {
    label: '녹음에도 적용',
    title: '녹음을 다시 열려면 소리도 파일로 저장합니다',
    body: '자동 저장을 끈 녹음 앱에서도 같은 일이 일어납니다. 녹음을 끝내면 소리가 작업 창에 보입니다. 녹음 파일을 만들어야 창을 닫은 뒤에도 다시 열고 보낼 수 있습니다.',
    takeaway: '두 줄의 왼쪽 소리 무늬는 같습니다. 아래 줄에서만 파일에 소리가 남아 다시 연 창에서도 같은 무늬를 볼 수 있습니다.',
    example: ['작업 창에 같은 녹음', '한쪽만 파일로 저장', '저장한 소리만 다시 열기'],
    prompt: '친구에게 소리 파일을 보내려고 합니다. 이 앱에서 녹음을 어떻게 닫아야 다시 열 수 있을까요?',
    description: '두 줄 모두 같은 녹음으로 시작합니다. 위에서는 저장하지 않고 닫아서 파일 목록과 새 작업 창이 비어 있습니다. 아래에서는 파일로 저장하고 닫아서 파일 목록에 소리가 남고 다시 연 창에도 같은 소리 무늬가 보입니다.'
  }
];

const slug = 'computer';
const byId = id => document.getElementById(id);
const workspace = document.querySelector('.workspace');
const viewport = byId('scene');
const drawing = byId('storage-drawing');
const viewWidth = 620;
const viewHeight = 280;
const center = {x: viewWidth / 2, y: viewHeight / 2};
const camera = {x: 0, y: 0, zoom: 1};
const maxZoom = 2.2;
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
const state = {index: -1, phase: 0, saved: null};
const columnCenters = {2: [157, 462], 3: [106, 310, 514], 4: [85, 235, 385, 535]};

function text(parent, x, y, value, className = 'caption') {
  svg('text', {x, y, class: className}, parent).textContent = value;
}

function rect(parent, x, y, width, height, className, rx = 7) {
  return svg('rect', {x, y, width, height, rx, class: className}, parent);
}

function flow(parent, d, kind = '') {
  svg('path', {d, class: 'flow ' + kind}, parent);
}

function thumbnail(parent, work, x, y, size = 38) {
  svg('use', {href: '#storage-' + work, x: x - size / 2, y: y - size / 2, width: size, height: size}, parent);
}

function workWindow(parent, x, y, content, compact = false) {
  const height = compact ? 51 : 62;
  const top = y - height / 2;
  const bar = compact ? 10 : 13;
  if (content === closed || content === off || content === pending) {
    rect(parent, x - 55, top, 110, height, 'empty');
    const label = content === pending ? '아직 열지 않음' : content === closed ? '창 닫힘' : '비어 있음';
    text(parent, x, y + 5, label, 'caption quiet');
    return;
  }
  rect(parent, x - 55, top, 110, height, 'window');
  rect(parent, x - 54, top + 1, 108, bar, 'window-bar', 5);
  svg('circle', {cx: x - 44, cy: top + bar / 2 + 1, r: 2, class: 'icon-stroke'}, parent);
  svg('circle', {cx: x - 37, cy: top + bar / 2 + 1, r: 2, class: 'icon-stroke'}, parent);
  if (content) thumbnail(parent, content, x, y + bar / 2, compact ? 32 : 38);
  else rect(parent, x - 18, y + bar / 2 - 13, 36, 26, 'empty', 4);
}

function fileFolder(parent, x, y, content, compact = false) {
  if (!content) {
    rect(parent, x - 53, y - 17, 106, 34, 'empty');
    text(parent, x, y + 5, '비어 있음', 'small quiet');
    return;
  }
  svg('path', {d: `M ${x - 55} ${y - 11} v -9 h 32 l 7 7 h 66 q 5 0 5 5 v 22 q 0 5 -5 5 h -100 q -5 0 -5 -5 Z`, class: 'folder'}, parent);
  thumbnail(parent, content, x - 32, y + 1, compact ? 24 : 27);
  text(parent, x + 17, y + 6, content === star ? starFile : audioFile, 'small');
}

function columnDiagram(step, lastVisible) {
  const centers = columnCenters[step.moments.length];
  const previewed = step.moments.slice(0, lastVisible + 1);
  previewed.forEach(([label, work, file], index) => {
    const x = centers[index];
    const parent = svg('g', {}, drawing);
    text(parent, x, 33, label, 'heading');
    workWindow(parent, x, 110, work);
    fileFolder(parent, x, 225, file);

    if (!index) {
      text(parent, x, 64, state.index === 3 ? '메모리 · 작업 중' : '작업 창');
      text(parent, x, 194, state.index === 3 ? '저장장치 · 보관' : '파일 목록');
      return;
    }
    const previousX = centers[index - 1];
    const previousFile = step.moments[index - 1][2];
    flow(parent, `M ${previousX + 59} 110 H ${x - 61}`);
    if (file && previousFile) flow(parent, `M ${previousX + 59} 225 H ${x - 61}`);
    if (file && !previousFile) {
      flow(parent, `M ${x} 145 V 198`, 'copy');
      text(parent, x + 47, 174, '파일로 복사', 'small');
    }
    const opened = work && file && previousFile && index === step.moments.length - 1;
    if (opened) {
      flow(parent, `M ${x} 198 V 146`, 'copy reading');
      text(parent, x - 57, 175, '파일 불러오기', 'small');
    }
  });
}

function recordingRow(y, saved, reopened) {
  workWindow(drawing, 106, y, wave, true);
  fileFolder(drawing, 310, y, saved ? wave : null, true);
  if (saved !== null) {
    text(drawing, 310, y - 34, saved ? '저장하고 닫기' : '저장 안 하고 닫기');
    flow(drawing, `M 166 ${y} H 250`);
  }
  workWindow(drawing, 514, y, reopened ? (saved ? wave : null) : pending, true);
  if (reopened) flow(drawing, `M 370 ${y} H 452`);
}

function compareRecordings(practicing) {
  text(drawing, 106, 31, '녹음한 소리', 'heading');
  text(drawing, 310, 31, '파일 목록', 'heading');
  text(drawing, 514, 31, '다시 연 창', 'heading');
  if (practicing) {
    recordingRow(150, state.saved, state.phase === 2);
  } else {
    recordingRow(104, false, true);
    svg('line', {x1: 29, y1: 151, x2: 590, y2: 151, class: 'rule'}, drawing);
    recordingRow(213, true, true);
  }
}

function practiceDescription() {
  const step = lesson[state.index];
  if (step.moments) return step.moments[state.phase][3];
  if (state.phase === 0) return '작업 창에 녹음이 있습니다. 저장하고 닫을지 고르면 됩니다.';
  if (state.phase === 1) return state.saved
    ? '창을 닫았습니다. 파일 목록에 녹음이 남았습니다.'
    : '창을 닫았습니다. 파일 목록에 녹음이 없습니다.';
  return state.saved
    ? '다시 연 창에 녹음이 있습니다. 이 파일을 친구에게 보낼 수 있습니다.'
    : '다시 연 창이 비어 있고 보낼 파일이 없습니다. 다시 녹음하고 저장하는 쪽을 골라 보세요.';
}

function renderScene() {
  const practicing = coursePracticeStarted && !workspace.classList.contains('course-reading');
  const step = lesson[state.index];
  drawing.replaceChildren();
  if (step.moments) columnDiagram(step, practicing ? state.phase : step.moments.length - 1);
  else compareRecordings(practicing);
  byId('scene-desc').textContent = practicing ? practiceDescription() : step.description;
}

function actionButton(label, perform, enabled = true) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'action';
  button.textContent = label;
  button.disabled = !enabled;
  button.onclick = () => {
    perform();
    updatePractice(true);
    byId('choices').querySelector('button:enabled')?.focus({preventScroll: true});
  };
  return button;
}

function updatePractice(announce) {
  const step = lesson[state.index];
  let buttons;
  if (step.actions) {
    buttons = step.actions.map((label, i) => actionButton(label, () => state.phase++, i === state.phase));
  } else {
    buttons = [
      actionButton('저장하고 닫기', () => { state.saved = true; state.phase = 1; }, state.phase === 0),
      actionButton('저장 안 하고 닫기', () => { state.saved = false; state.phase = 1; }, state.phase === 0),
      actionButton('다시 열기', () => { state.phase = 2; }, state.phase === 1),
      actionButton('다시 녹음', () => { state.saved = null; state.phase = 0; }, state.phase === 2)
    ];
  }
  byId('choices').replaceChildren(...buttons);
  byId('storage-status').textContent = announce ? practiceDescription() : '';
  renderScene();
}

function renderPractice(step) {
  byId('storage-prompt').textContent = step.prompt;
  updatePractice(false);
}

function showStep(index, announce = true) {
  state.index = index;
  state.phase = 0;
  state.saved = null;
  const step = lesson[index];
  byId('step-title').textContent = step.title;
  byId('body').textContent = step.body;
  byId('takeaway').textContent = step.takeaway;
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  for (const [position, button] of stepButtons.entries()) {
    if (position === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  }
  renderPractice(step);
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${step.title}`;
}

function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/${slug}/${index + 1}`);
  showStep(index);
}

const stepButtons = lesson.map(({label}, index) => {
  const item = document.createElement('li');
  const button = document.createElement('button');
  const number = document.createElement('span');
  button.type = 'button';
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.onclick = () => goToStep(index);
  item.append(button);
  byId('steps').append(item);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
byId('zoom-in').onclick = () => zoomBy(.3);
byId('zoom-out').onclick = () => zoomBy(-.3);
enableCameraDrag();

viewport.addEventListener('keydown', event => {
  if (camera.zoom === 1) return;
  const direction = {ArrowLeft: [-1, 0], ArrowUp: [0, -1], ArrowRight: [1, 0], ArrowDown: [0, 1]}[event.key];
  if (!direction) return;
  event.preventDefault();
  setCamera(camera.x + direction[0] * 18, camera.y + direction[1] * 18, camera.zoom);
});

window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
window.addEventListener('keydown', event => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  const action = {
    ArrowLeft: () => goToStep(state.index - 1),
    ArrowRight: () => goToStep(state.index + 1),
    '+': () => zoomBy(.3),
    '-': () => zoomBy(-.3),
    '0': resetView
  }[event.key];
  if (!action) return;
  event.preventDefault();
  action();
});

new MutationObserver(renderScene).observe(workspace, {attributes: true, attributeFilter: ['class']});
const initial = routeIndex();
history.replaceState(null, '', `#/${slug}/${initial + 1}`);
setCamera(0, 0, 1);
showStep(initial, false);
</script>
</body>
</html>
