const layers = new Map();
let circuit, views, wires;
const project = (x, y, z = 0) => [14 * (x + y), 7 * (x - y) - z];
const point = (x, y, z) => project(x, y, z).map((value) => +value.toFixed(2)).join(',');
// Screen position of a (u, v) floor point: u = x + y, v = x - y.
const flat = (u, v, z = 0) => [14 * u, 7 * v - z];
const mix = (a, b, t) => a + (b - a) * t;
const laneHeight = 3;

function boxFaces(h, H) {
  return {
    left: [[-h, -h, 0], [h, -h, 0], [h, -h, H], [-h, -h, H]],
    right: [[h, -h, 0], [h, h, 0], [h, h, H], [h, -h, H]],
    top: [[-h, -h, H], [h, -h, H], [h, h, H], [-h, h, H]],
  };
}
function drawFaces(node, h, H) {
  const faces = {};
  for (const [name, corners] of Object.entries(boxFaces(h, H))) {
    faces[name] = svg('polygon', { class: 'face ' + name, points: corners.map((p) => point(...p)).join(' ') }, node);
  }
  const highlight = svg('path', { class: 'highlight', d: `M${point(-h, -h, H)}L${point(h, -h, H)}L${point(h, h, H)}` }, node);
  return { faces, highlight };
}

// Plates are small labels whose box is sized to the text.
function circuitPlate(node, className, x, y, text, { pad = 1.5, round = true } = {}) {
  const group = svg('g', { class: className }, node);
  const plate = { group, rect: svg('rect', {}, group), label: svg('text', {}, group), x, y, pad, round };
  plate.label.textContent = circuitText(text);
  sizePlate(plate);
  return plate;
}
// Move a plate beside a box: side -1 = left of it, 1 = right of it, so stacked nodes keep their names apart.
function besidePlate(plate, side, h) {
  plate.x = side * (28 * h + 5 + plate.rect.getBBox().width / 2);
  sizePlate(plate);
}

// Sizes: half-width h on the floor (a box covers u ± 2h) and height H.
const size = { IN: [.78, 10], NOT: [1.05, 14], AND: [1.15, 14], OR: [1.15, 14], XOR: [1.15, 14], HA: [1.4, 17], FA: [1.4, 17], LAMP: [1.05, 11] };
const blockName = { HA: '반가산기', FA: '전가산기' };
// A box has two outputs: `h0.s` (sum, lower right) and `h0.c` (carry, upper right).
const nodeOf = (ref) => ref.split('.')[0];
const outOffset = (ref) => ref.endsWith('.s') ? .7 : ref.endsWith('.c') ? -.7 : 0;
const switchHigh = 18;  // a switch stands up to this height when on

function shapeSwitch(view, H) {
  const h = size.IN[0];
  for (const [name, corners] of Object.entries(boxFaces(h, H))) {
    view.faces[name].setAttribute('points', corners.map((p) => point(...p)).join(' '));
  }
  view.highlight.setAttribute('d', `M${point(-h, -h, H)}L${point(h, -h, H)}L${point(h, h, H)}`);
  view.digit.setAttribute('y', -H + .5);
  view.plate.group.setAttribute('transform', `translate(0 ${(size.IN[1] - H) / 2})`);
}

function createNode(spec) {
  const [h, H] = size[spec.type];
  const kind = spec.type === 'IN' ? 'switch' : spec.type === 'LAMP' ? 'lamp' : 'gate ' + spec.type;
  const node = svg('g', { class: 'node ' + kind, transform: `translate(${flat(spec.u, spec.v).join(' ')})` }, layers.get('nodes'));
  const view = { spec, node };
  if (spec.type === 'IN') {
    const spill = [[-h, -h], [h, -h], [h, h], [-h, h]].map(([x, y]) => point(x * 1.9, y * 1.9, 0)).join(' ');
    svg('polygon', { class: 'glow', points: spill, filter: 'url(#soft-glow)' }, node);
    view.faces = {};
    for (const name of ['left', 'right', 'top']) view.faces[name] = svg('polygon', { class: 'face ' + name }, node);
    view.highlight = svg('path', { class: 'highlight' }, node);
    view.digit = svg('text', { class: 'digit', x: 0 }, node);
    view.plate = circuitPlate(node, 'tag', 0, -H / 2 - 4, spec.label ?? spec.id, { pad: 1.3 });
    besidePlate(view.plate, -1, h);
    shapeSwitch(view, H);
    return view;
  }
  Object.assign(view, drawFaces(node, h, H));
  if (spec.type === 'LAMP') {
    svg('circle', { class: 'halo', cx: 0, cy: -H - 9, r: 17, filter: 'url(#soft-glow)' }, node);
    svg('circle', { class: 'bulb', cx: 0, cy: -H - 9, r: 8.5 }, node);
    besidePlate(circuitPlate(node, 'tag', 0, -H / 2, spec.label ?? '램프'), 1, h);
    return view;
  }
  view.plate = circuitPlate(node, 'tag', 0, -H - 14 * h - 12, blockName[spec.type] ?? spec.type, { pad: 1.3, round: false });
  if (blockName[spec.type]) return view;  // a box's two outputs show on their wires
  // The gate's output value, on a badge just past its right corner.
  const badge = svg('g', { class: 'bit-badge' }, layers.get('badges'));
  badge.setAttribute('transform', `translate(${14 * (spec.u + 2 * h + .95)} ${7 * spec.v - 13})`);
  svg('circle', { r: 10 }, badge);
  view.badgeText = svg('text', {}, badge);
  view.badge = badge;
  return view;
}

// Wires run on the floor like a schematic: right from the source, then up or down at `mid`,
// then right into the port. The part under each box is hidden by the box.
function createWire(from, to, port, mid) {
  const src = views.get(nodeOf(from)).spec, dst = views.get(to).spec;
  const ports = [[0], [-.9, .9], [-1.1, 0, 1.1]][dst.in.length - 1];
  const pv = dst.v + ports[port];
  const sv = src.v + outOffset(from);
  const turn = mid ?? (src.u + dst.u) / 2;
  const route = [[src.u, sv], [turn, sv], [turn, pv], [dst.u, pv]].map(([u, v]) => flat(u, v, laneHeight));
  const d = 'M' + route.map((p) => p.join(' ')).join('L');
  svg('path', { class: 'casing', d }, layers.get('casings'));
  const group = svg('g', {}, layers.get('links'));
  const line = svg('path', { class: 'wire idle', d }, group);
  const [p, q] = route.slice(-2);
  const at = [mix(p[0], q[0], .35), mix(p[1], q[1], .35)];
  const chevron = svg('path', { class: 'gate-arrow idle', d: 'M-5 -4L3 0L-5 4Z', transform: `translate(${at.join(' ')})` }, group);
  return { from, to, port, line, chevron, turn, sv, pv };
}

// One output that feeds several inputs splits on one column, and a dot marks each split,
// so a crossing without a dot reads as two wires passing.
function markSplits() {
  const groups = new Map();
  for (const wire of wires) {
    wire.dots = [];
    const key = wire.from + '|' + wire.turn.toFixed(2);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(wire);
  }
  const round = (v) => Math.round(v * 1000) / 1000;
  for (const group of groups.values()) {
    if (group.length < 2) continue;
    const sv = round(group[0].sv), ends = group.map((wire) => round(wire.pv));
    const lo = Math.min(sv, ...ends), hi = Math.max(sv, ...ends);
    for (const v of new Set([sv, ...ends])) {
      const degree = (v > lo) + (v < hi) + (v === sv) + ends.includes(v);
      if (degree < 3) continue;
      const [x, y] = flat(group[0].turn, v, laneHeight);
      group[0].dots.push(svg('circle', { class: 'split idle', cx: x, cy: y, r: 3.4 }, layers.get('links')));
    }
  }
}

function evaluate(inputs) {
  const values = {};
  for (const spec of circuit.nodes) {
    const [a, b, c] = (spec.in ?? []).map((ref) => values[ref]);
    if (spec.type === 'HA') { values[spec.id + '.s'] = a ^ b; values[spec.id + '.c'] = a & b; continue; }
    if (spec.type === 'FA') { values[spec.id + '.s'] = a ^ b ^ c; values[spec.id + '.c'] = a & b | c & (a ^ b); continue; }
    values[spec.id] = spec.type === 'IN' ? inputs[spec.id]
      : spec.type === 'NOT' ? 1 - a : spec.type === 'AND' ? a & b : spec.type === 'OR' ? a | b
      : spec.type === 'XOR' ? a ^ b : a;
  }
  return values;
}

function buildScene() {
  views = new Map();
  // Labels keep at least 13px on screen at 1280 wide (about 1.06 screen px per figure unit), however small the circuit is drawn.
  const scale = fit(circuit.nodes, tableBeside()).scale;
  layers.get('world').style.setProperty('--label-size', Math.max(14, 13 / 1.06 / scale).toFixed(1) + 'px');
  // Painter's order: nodes higher on screen first.
  const ordered = [...circuit.nodes].sort((a, b) => a.v - b.v || a.u - b.u);
  for (const spec of ordered) views.set(spec.id, createNode(spec));
  wires = [];
  for (const spec of circuit.nodes) {
    (spec.in ?? []).forEach((from, port) => wires.push(createWire(from, spec.id, port, spec.mids?.[port])));
  }
  markSplits();
  const {x, y, scale: s} = fit(circuit.nodes, tableBeside());
  layers.get('world').setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${s.toFixed(3)})`);
}

// Steps that draw the same circuit share one layout, so nothing moves when a later step adds the table.
function tableBeside() {
  const shape = JSON.stringify(circuit.nodes);
  return circuits.some(other => other?.table && JSON.stringify(other.nodes) === shape);
}

// Scale and centre the circuit; switch names stand to its left and lamp names to its right.
function fit(nodes, beside) {
  const xs = nodes.map((n) => 14 * n.u), ys = nodes.map((n) => 7 * n.v);
  const left = Math.min(...xs) - 70, right = Math.max(...xs) + (beside ? 135 : 90);
  const top = Math.min(...ys) - 58, bottom = Math.max(...ys) + 24;
  const width = beside ? 400 : 590, middle = beside ? 210 : 310;
  const scale = Math.min(1.9, width / (right - left), 232 / (bottom - top));
  return {scale, x: middle - scale * (left + right) / 2, y: 126 - scale * (top + bottom) / 2};
}

// Show every value: switches stand up and glow, badges and lamps follow, each wire takes its source's value.
function showValues(values) {
  for (const [id, view] of views) {
    const on = values[id] === 1;
    view.node.classList.toggle('on', on);
    if (view.digit) {
      view.digit.textContent = String(values[id]);
      shapeSwitch(view, on ? switchHigh : size.IN[1]);
    }
    if (view.badge) {
      view.badge.classList.toggle('on', on);
      view.badgeText.textContent = String(values[id]);
    }
  }
  for (const wire of wires) {
    const on = values[wire.from] === 1;
    for (const part of [wire.line, wire.chevron, ...wire.dots]) {
      part.classList.toggle('signal', on);
      part.classList.toggle('idle', !on);
    }
  }
}

const cell = (tag, text, className = '') => Object.assign(document.createElement(tag), { textContent: circuitText(String(text)), className });
const number = (inputs, name, n) => Array.from({ length: n }, (_, k) => inputs[name + k] << k).reduce((a, b) => a + b, 0);

// Step 3: every input pair of the half adder, the current one highlighted.
function truthTable() {
  const table = cell('table', '', 'truth');
  table.append(cell('caption', '진리표'));
  const head = document.createElement('tr');
  for (const name of ['A', 'B', '올림 C', '합 S']) head.append(Object.assign(cell('th', name), { scope: 'col' }));
  table.append(head);
  for (let row = 0; row < 4; row++) {
    const a = row >> 1, b = row & 1;
    const tr = document.createElement('tr');
    for (const value of [a, b, a & b, a ^ b]) tr.append(cell('td', value));
    tr.classList.toggle('current', a === circuit.inputs.A && b === circuit.inputs.B);
    table.append(tr);
  }
  return table;
}

// Steps 6 and 7: column addition as done by hand, carries written small above.
function columnSum() {
  const n = circuit.bits, a = number(circuit.inputs, 'A', n), b = number(circuit.inputs, 'B', n), sum = a + b;
  const table = cell('table', '', 'truth column-sum');
  table.append(cell('caption', '세로셈 · 위의 작은 수는 받아올림'));
  const digit = (value, k) => value >> k & 1;
  const carryInto = (k) => k > 0 && ((a & ((1 << k) - 1)) + (b & ((1 << k) - 1))) >> k & 1;
  const rows = [
    ['carry', '올림', (k) => carryInto(k) ? '1' : '', ''],
    ['A', 'A', (k) => k < n ? digit(a, k) : '', a],
    ['B', '+ B', (k) => k < n ? digit(b, k) : '', b],
    ['sum', '합', (k) => digit(sum, k), sum],
  ];
  for (const [name, label, at, decimal] of rows) {
    const tr = document.createElement('tr');
    tr.className = name;
    tr.append(cell('th', label));
    for (let k = n; k >= 0; k--) tr.append(cell('td', at(k)));
    tr.append(cell('td', decimal === '' ? '' : '= ' + decimal, 'decimal'));
    table.append(tr);
  }
  return table;
}

function drawFigure(index, {hide, changed}) {
  const root = byId('figure');
  const defs = svg('defs', {}, root);
  const glow = svg('filter', { id: 'soft-glow', x: '-120%', y: '-120%', width: '340%', height: '340%' }, defs);
  svg('feGaussianBlur', { stdDeviation: 5 }, glow);
  const world = svg('g', {}, root);
  layers.set('world', world);
  for (const name of ['casings', 'links', 'nodes', 'badges', 'marks']) layers.set(name, svg('g', {}, world));
  circuit = circuits[index];
  buildScene();
  const values = evaluate(circuit.inputs);
  showValues(values);
  for (const id of hide) {
    const view = views.get(id);
    if (!view) continue;
    if (view.badgeText) {
      view.badgeText.textContent = '?';
      view.badge.classList.remove('on');
    }
    view.node.classList.remove('on');
    if (view.spec.type === 'LAMP') svg('text', { class: 'circuit-unknown', x: 0, y: -20 }, view.node).textContent = '?';
    for (const wire of wires.filter((wire) => nodeOf(wire.from) === id)) {
      wire.line.setAttribute('class', 'wire unknown');
      wire.chevron.setAttribute('class', 'gate-arrow unknown');
    }
  }
  for (const id of changed) {
    const view = views.get(id);
    if (!view) continue;
    for (const face of view.node.querySelectorAll('.face')) face.setAttribute('data-changed', '');
    if (view.badge) view.badge.querySelector('circle').setAttribute('data-changed', '');
  }
  // Carry order: ①②③ beside the rising part of each carry wire, bottom place first.
  for (const [from, mark] of circuit.order ?? []) {
    const wire = wires.find((wire) => wire.from === from);
    const [x, y] = flat(wire.turn, (wire.sv + wire.pv) / 2, laneHeight);
    svg('text', { class: 'carry-order', x: x + 9, y }, layers.get('marks')).textContent = mark;
  }
  if (circuit.name) {
    const box = layers.get('nodes').getBBox();
    const [x, y] = [box.x + box.width / 2, box.y - 6];
    const label = svg('text', { class: 'circuit-name', x, y }, layers.get('marks'));
    label.textContent = circuitText(circuit.name);
  }
  if (!hide.includes('expr')) svg('text', { class: 'circuit-expression', x: 310, y: 268 }, root).textContent = circuitText(circuit.expr);
  if (circuit.table) {
    const slot = svg('foreignObject', { x: 412, y: circuit.table === 'truth' ? 62 : 70, width: 200, height: 130 }, root);
    const table = circuit.table === 'truth' ? truthTable() : columnSum();
    if (changed.includes('진리표')) table.setAttribute('data-changed', '');
    slot.append(table);
  }
}

</script>
</body>
</html>
