const byId = id => document.getElementById(id);
const viewport = byId('scene');
const drawing = byId('figure');
const viewWidth = 620;
const viewHeight = 280;
const center = {x: viewWidth / 2, y: viewHeight / 2};
const camera = {x: 0, y: 0, zoom: 1};
const maxZoom = 2.2;
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

function text(parent, x, y, value, className = '') {
  svg('text', {x, y, class: className}, parent).textContent = value;
}

function line(parent, x1, y1, x2, y2, className) {
  svg('line', {x1, y1, x2, y2, class: className}, parent);
}

function wave(t) {
  return 7.4 + 6.9 * Math.sin(12 * Math.PI * t + .7) * Math.exp(-2.9 * t) * Math.min(1, 18 * t);
}

function graph(parent, left, right, top, bottom, clapped, count = 0, {heightAxis = false, grid = false, extraTicks = false, odd = false} = {}) {
  const y = value => bottom - (bottom - top) * value / 15;
  const x = fraction => left + (right - left) * fraction;
  if (heightAxis) {
    for (const height of [0, 5, 10, 15]) {
      text(parent, left - 15, y(height) + 4, height, 'number');
      line(parent, left - 5, y(height), grid ? right : left, y(height), grid ? 'guide' : 'axis');
    }
  }
  if (extraTicks) {
    for (let index = 1; index < 16; index += 2) line(parent, x(index / 16), bottom, x(index / 16), bottom + 4, 'axis');
  }
  line(parent, left, top, left, bottom, 'axis');
  line(parent, left, bottom, right + 13, bottom, 'flow');
  const samples = Array.from({length: count}, (_, index) => {
    const time = index / count;
    return {at: index * 16 / count, x: x(time), y: y(wave(time)), value: wave(time)};
  });
  for (const sample of samples) line(parent, sample.x, bottom, sample.x, y(sample.value), 'guide');
  const points = Array.from({length: 181}, (_, index) => {
    const time = index / 180;
    return `${x(time).toFixed(1)} ${y(clapped ? wave(time) : 7.4).toFixed(1)}`;
  });
  svg('path', {d: 'M' + points.join(' L'), class: 'signal'}, parent);
  for (const sample of samples) {
    line(parent, sample.x, bottom - 3, sample.x, bottom + 4, 'axis');
    const dot = svg('circle', {cx: sample.x, cy: sample.y, r: 4.4, class: 'dot'}, parent);
    if (odd && sample.at % 2) dot.setAttribute('data-changed', '');
  }
  return samples;
}

function sampledWave(count, depth, withRecords, options = {}) {
  const {blank, heightAxis, grid, extraTicks, odd, changedHeights} = options;
  text(drawing, 310, 37, '같은 손뼉의 신호', 'heading');
  text(drawing, 40, 37, '높이');
  const bottom = 174;
  const samples = graph(drawing, 75, 568, 56, bottom, true, count, {heightAxis, grid, extraTicks, odd});
  text(drawing, 568, bottom + (withRecords ? -10 : 20), '16 ms', 'number');

  if (!withRecords) {
    const [first, second] = samples;
    const bracket = `M${first.x} 206 v6 H${second.x} v-6`;
    svg('path', {d: bracket, class: 'axis'}, drawing);
    text(drawing, (first.x + second.x) / 2, 229, `${16 / count} ms`, 'number');
    text(drawing, first.x, bottom + 20, '0 ms', 'number');
    text(drawing, 310, 247, `16 ms 동안 ${count}번 측정`, 'heading');
    return;
  }

  const spacing = 15 / (2 ** depth - 1);
  text(drawing, 29, 193, '잰 높이', 'row-label');
  text(drawing, 29, 237, '기록', 'row-label');
  for (const {at, x, y, value} of samples) {
    const code = Math.round(value / spacing);
    const level = code * spacing;
    const width = count === 16 ? 28 : 43;
    const numberStyle = count === 16 ? 'number dense' : 'number';
    text(drawing, x, 192, value.toFixed(2), numberStyle);
    if (odd && at === 3) text(drawing, x, y - 10, '11.39', 'number');
    line(drawing, x, 195, x, 212, 'flow');
    const box = svg('rect', {x: x - width / 2, y: 216, width, height: 30, rx: 5, class: 'code'}, drawing);
    if ((odd && at % 2) || (changedHeights && level !== Math.round(value))) box.setAttribute('data-changed', '');
    if (blank) continue;
    text(drawing, x, 229, String(level), 'number');
    text(drawing, x, 242, code.toString(2).padStart(depth, '0'), numberStyle);
  }
  if (!blank) text(drawing, 315, 271, `${count}개 × ${depth}비트 = ${count * depth}비트 기록`);
}

function drawFigure(index, {hide, changed}) {
  const preview = hide.includes('answer');
  if (index === 0) microphone();
  else if (index === 1) sampledWave(8, 4, false);
  else if (index === 2) sampledWave(8, 4, true, {heightAxis: true, blank: preview});
  else if (index === 3 && preview) sampledWave(8, 4, true, {heightAxis: true, extraTicks: true});
  else if (index === 3) sampledWave(16, 4, true, {heightAxis: true, odd: changed.includes('odd-samples')});
  else sampledWave(16, preview ? 4 : 2, true, {heightAxis: true, grid: true, blank: preview, changedHeights: changed.includes('record-levels')});
}

byId('zoom-in').onclick = () => zoomBy(.3);
byId('zoom-out').onclick = () => zoomBy(-.3);
enableCameraDrag();

viewport.addEventListener('keydown', event => {
  if (camera.zoom === 1) return;
  const direction = {ArrowLeft: [-1, 0], ArrowUp: [0, -1], ArrowRight: [1, 0], ArrowDown: [0, 1]}[event.key];
  if (!direction) return;
  event.preventDefault();
  setCamera(camera.x + direction[0] * 18, camera.y + direction[1] * 18, camera.zoom);
});

window.addEventListener('keydown', event => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  const zoom = {'+': () => zoomBy(.3), '-': () => zoomBy(-.3), '0': resetView}[event.key];
  if (zoom) {
    event.preventDefault();
    zoom();
  }
});
setCamera(0, 0, 1);
</script>
