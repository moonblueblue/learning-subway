const slug = 'what-os-does';
const byId = id => document.getElementById(id);
const viewport = byId('scene');
const drawing = byId('figure');
const viewWidth = 620;
const viewHeight = 280;
const center = {x: viewWidth / 2, y: viewHeight / 2};
const camera = {x: 0, y: 0, zoom: 1};
const maxZoom = 2.2;
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

// Every drawn element joins a named group so the frame can highlight or hide it by the card's names.
// Shapes marked data-edge are the ones whose outline turns teal when their group is highlighted.
function named(parent, name) {
  return svg('g', {'data-name': name}, parent);
}

function caption(group, x, y, value, tone = '') {
  svg('text', {x, y, class: 'os-text ' + tone, 'text-anchor': 'middle'}, group).textContent = value;
}

function panel(group, x, y, width, height, tone = '') {
  svg('rect', {x, y, width, height, rx: 8, class: 'os-card ' + tone, 'data-edge': ''}, group);
}

function arrow(group, x1, y1, x2, y2, reply = false) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const tipLength = 8;
  const inset = (tipLength - 1) / Math.hypot(dx, dy);
  const tone = reply ? 'os-reply' : '';
  svg('line', {x1, y1, x2: x2 - dx * inset, y2: y2 - dy * inset, class: 'os-line ' + tone, 'data-edge': ''}, group);
  svg('polygon', {'data-arrowhead': '', 'data-edge': '', points: `${-tipLength},-5 0,0 ${-tipLength},5`, class: 'os-tip ' + tone,
    transform: `translate(${x2} ${y2}) rotate(${Math.atan2(dy, dx) * 180 / Math.PI})`}, group);
}

function picture(group, x, y, kind, size = 1) {
  const image = svg('g', {transform: `translate(${x} ${y}) scale(${size})`}, group);
  svg('rect', {x: -33, y: -23, width: 66, height: 46, rx: 4, fill: '#d9ecfa', stroke: '#638178'}, image);
  svg('circle', {cx: 15, cy: -12, r: 5, fill: '#f4bd67'}, image);
  if (kind === 'sea') {
    svg('path', {d: 'M-31 5Q-17 -1 -2 5Q14 1 31 6V18Q31 21 28 21H-28Q-31 21-31 18Z', fill: '#458abe'}, image);
    svg('path', {d: 'M-23 12q8 -4 16 0m11 2q8 -4 16 0', fill: 'none', stroke: '#fff', 'stroke-width': 1.5}, image);
  } else {
    svg('path', {d: 'M-31 13L-14 3 1 11 15 4 31 13V18Q31 21 28 21H-28Q-31 21-31 18Z', fill: '#85ad66'}, image);
    svg('path', {d: 'M-17 -12L-28 9H-6ZM3 -9L-6 10H12Z', fill: '#306953'}, image);
    svg('path', {d: 'M-19 9h4v6h-4zM1 9h4v5H1z', fill: '#6b4f3b'}, image);
  }
}

const filename = kind => kind === 'sea' ? '바다.jpg' : '숲.jpg';

function folderWindow(group) {
  const folder = named(group, '폴더');
  panel(folder, 26, 64, 211, 153);
  caption(folder, 131.5, 90, '사진 폴더');
  for (const [index, kind] of ['sea', 'woods'].entries()) {
    const x = 84 + index * 94;
    const tile = named(group, index === 0 ? '바다 파일' : '숲 파일');
    panel(tile, x - 42, 103, 84, 92, index === 0 ? 'os-picked' : '');
    picture(tile, x, 134, kind, .86);
    caption(tile, x, 179, filename(kind), 'os-small');
  }
  const app = named(group, '앱 패널');
  panel(app, 381, 69, 210, 143, 'os-app');
  caption(app, 486, 98, '사진 앱');
  panel(app, 399, 119, 174, 67, 'os-empty');
  caption(app, 486, 159, '파일 열기', 'os-small');
  const click = named(group, '두 번 누름');
  caption(click, 310, 134, '두 번 누름', 'os-small');
  arrow(click, 243, 155, 373, 155);
  caption(named(group, '열 파일'), 486, 143, filename('sea'), 'os-small');
}

function readFile(group) {
  const kind = 'sea';
  const cards = [[125, '사진 앱', 'os-app', '앱 패널'], [310, '운영체제', 'os-system', '운영체제 패널'],
    [496, '저장 장치', 'os-device', '저장 장치 패널']];
  const places = {};
  for (const [x, label, color, name] of cards) {
    const width = color === 'os-system' ? 156 : 144;
    places[name] = named(group, name);
    panel(places[name], x - width / 2, 99, width, 88, color);
    caption(places[name], x, 124, label);
  }
  const request = named(group, '요청 화살표');
  caption(request, 310, 74, '파일 요청 · {0}'.replace('{0}', filename(kind)), 'os-small');
  arrow(request, 201, 114, 227, 114);
  arrow(request, 392, 114, 419, 114);
  picture(places['저장 장치 패널'], 496, 146, kind, .65);
  caption(places['저장 장치 패널'], 496, 177, filename(kind), 'os-small');
  const reply = named(group, '반환 화살표');
  arrow(reply, 419, 167, 392, 167, true);
  arrow(reply, 227, 167, 201, 167, true);
  caption(reply, 310, 163, '파일 반환', 'os-small');
  const arrived = named(group, '파일 도착');
  caption(arrived, 125, 162, '파일 도착', 'os-small');
  caption(arrived, 125, 178, filename(kind), 'os-small');
  caption(named(group, '원본'), 496, 211, '원본이 남음', 'os-small');
}

function screen(group, x, y, kind) {
  svg('rect', {x: x - 69, y: y - 43, width: 138, height: 83, rx: 8, class: 'os-card os-monitor', 'data-edge': ''}, group);
  picture(group, x, y - 2, kind, 1.35);
  svg('path', {d: `M${x} ${y + 40}v10m-25 2h50`, class: 'os-device-line'}, group);
}

function waveform(group, x, y) {
  svg('path', {d: `M${x - 42} ${y}h12l5 -9 6 17 5 -22 8 28 7 -19 5 6 5 -11 5 18 6 -10h13`, class: 'os-device-line'}, group);
}

function speaker(group, x, y) {
  svg('path', {d: `M${x-40} ${y-12}h15l20 -15v54l-20 -15h-15z`, fill: '#326c5d', 'data-edge': ''}, group);
  svg('path', {d: `M${x + 6} ${y-13}q18 13 0 26m12 -36q34 23 0 46`, class: 'os-device-line'}, group);
}

function output(group, music = false) {
  const kind = 'sea';
  const app = named(group, '앱 패널');
  panel(app, 27, 83, 151, 121, 'os-app');
  caption(app, 102.5, 109, music ? '음악 앱' : '사진 앱');
  if (music) {
    svg('polygon', {points: '65,136 65,156 83,146', fill: '#327263'}, app);
    caption(app, 120, 152, '재생', 'os-small');
    waveform(app, 102, 175);
  } else {
    picture(app, 102.5, 147, kind);
    caption(app, 102.5, 186, filename(kind), 'os-small');
  }
  arrow(named(group, '앱 화살표'), 185, 146, 226, 146);
  const system = named(group, '운영체제 패널');
  panel(system, 232.5, 100, 152, 90, 'os-system');
  caption(system, 308.5, 133, '운영체제');
  caption(system, 308.5, 161, music ? '소리 재생 요청' : '화면 표시 요청', 'os-small');
  arrow(named(group, '장치 화살표'), 391, 146, 434, 146);
  const device = named(group, '장치');
  if (music) speaker(device, 518, 144);
  else screen(device, 518, 146, kind);
  caption(named(group, '장치 이름'), 518, 221, music ? '스피커' : '화면');
}

const drawers = [folderWindow, readFile, group => output(group), group => output(group, true)];

// A highlighted group colours the outline of its edge shapes and its words (frame spec 3.7 rule 2).
// A hidden group is left out after drawing, so everything else keeps its place.
function drawFigure(index, {hide = [], changed = []}) {
  drawing.replaceChildren();
  drawers[index](drawing);
  for (const name of hide) drawing.querySelector(`[data-name="${name}"]`)?.remove();
  for (const name of changed) {
    for (const element of drawing.querySelector(`[data-name="${name}"]`)?.querySelectorAll('[data-edge], text') ?? []) {
      element.setAttribute('data-changed', '');
    }
  }
}

byId('zoom-in').onclick = () => zoomBy(.3);
byId('zoom-out').onclick = () => zoomBy(-.3);
enableCameraDrag();

viewport.addEventListener('keydown', event => {
  if (camera.zoom === 1) return;
  const direction = {ArrowLeft: [-1, 0], ArrowUp: [0, -1], ArrowRight: [1, 0], ArrowDown: [0, 1]}[event.key];
  if (!direction) return;
  event.preventDefault();
  setCamera(camera.x + direction[0] * 18, camera.y + direction[1] * 18, camera.zoom);
});

window.addEventListener('keydown', event => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === '+') zoomBy(.3);
  else if (event.key === '-') zoomBy(-.3);
  else if (event.key === '0') resetView();
  else return;
  event.preventDefault();
});
setCamera(0, 0, 1);
</script>
