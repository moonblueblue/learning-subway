<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="컴퓨터와 시스템이 실제로 어떻게 돌아가는지, 개념 하나하나를 단계별 도식과 직접 조작하는 데모로 들여다봅니다.">
<title>How It Runs</title>
<style>
:root{color-scheme:light;--ink:#142620;--muted:#43574f;--border:#cbd9d0;--paper:#f4f7ef;--panel:#fff;--accent:#12634b;--active:#d9eee1}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.65 system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}
:focus-visible{outline:3px solid #a24c14;outline-offset:3px}
a{color:inherit}
.shell{max-width:1120px;margin:auto;padding:clamp(16px,4vw,48px)}
header{margin-bottom:clamp(24px,4vw,40px)}
h1{margin:0;font-size:clamp(2rem,5vw,3.25rem);line-height:1.12;letter-spacing:-.05em}
.lead{margin:12px 0 0;color:var(--muted);max-width:44rem}
h2{margin:0 0 4px;font-size:1.25rem}
.note{margin:0 0 16px;color:var(--muted);font-size:.9375rem}
section+section{margin-top:clamp(28px,4vw,44px)}
.roadmaps,.topics{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.roadmaps{grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.topics{grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.card h3{margin:0;font-size:1.0625rem}
.card p{margin:4px 0 0;color:var(--muted);font-size:.9375rem}
.id{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.8125rem;color:var(--accent)}
.start{display:inline-block;margin-top:12px;padding:6px 12px;border-radius:8px;background:var(--active);text-decoration:none;font-weight:600}
details{margin-top:8px}
summary{cursor:pointer;color:var(--accent);font-size:.9375rem}
.lessons{margin:8px 0 0;padding-left:1.1rem;font-size:.9375rem}
.lessons li+li{margin-top:2px}
</style>
<script defer src="./shared/catalog.js"></script>
</head>
<body>
<main class="shell">
<header>
<h1>How It Runs</h1>
<p class="lead">컴퓨터와 시스템이 실제로 어떻게 돌아가는지, 개념 하나하나를 단계별 도식과 직접 조작하는 데모로 들여다봅니다. 로드맵을 따라가거나, 주제에서 필요한 레슨만 골라 봅니다.</p>
</header>
<section aria-labelledby="roadmaps-title">
<h2 id="roadmaps-title">로드맵</h2>
<p class="note">직군이나 목표에 맞춰 레슨을 순서대로 엮은 길입니다.</p>
<ul class="roadmaps" id="roadmaps"></ul>
</section>
<section aria-labelledby="topics-title">
<h2 id="topics-title">주제</h2>
<p class="note">레슨은 주제 하나에만 속하고, 여러 로드맵이 같은 레슨을 함께 씁니다.</p>
<ul class="topics" id="topics"></ul>
</section>
</main>
<script>
addEventListener('DOMContentLoaded', () => {
  const make = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  };
  const titles = new Map(courseCatalog.topics.flatMap((topic) =>
    topic.lessons.map((lesson) => [topic.id + '/' + lesson.id, lesson.title])));

  for (const roadmap of courseCatalog.roadmaps) {
    const lessons = roadmap.chapters.flatMap((chapter) =>
      [chapter, ...chapter.tracks].flatMap((group) => group.lessons));
    const card = make('li', 'card');
    card.append(make('h3', '', roadmap.title), make('span', 'id', roadmap.id),
      make('p', '', roadmap.chapters.length + '개 장 · 레슨 ' + lessons.length + '개'));
    const start = make('a', 'start', titles.get(lessons[0].ref) + '부터 시작');
    start.href = './' + lessons[0].ref + '.html?roadmap=' + encodeURIComponent(roadmap.id);
    card.append(start);
    document.getElementById('roadmaps').append(card);
  }

  for (const topic of courseCatalog.topics) {
    const card = make('li', 'card');
    card.append(make('h3', '', topic.title), make('span', 'id', topic.id),
      make('p', '', '레슨 ' + topic.lessons.length + '개'));
    const details = make('details');
    details.append(make('summary', '', '레슨 보기'));
    const list = make('ol', 'lessons');
    for (const lesson of topic.lessons) {
      const item = make('li');
      const link = make('a', '', lesson.title);
      link.href = './' + topic.id + '/' + lesson.id + '.html';
      item.append(link);
      list.append(item);
    }
    details.append(list);
    card.append(details);
    document.getElementById('topics').append(card);
  }
});
</script>
</body>
</html>
