<style>
:root{color-scheme:light;--ink:#142620;--muted:#43574f;--border:#cbd9d0;--paper:#f4f7ef;--panel:#fff;--accent:#0f766e;--request:#187959;--response:#5362a0;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}

.node .highlight{fill:none;stroke:#fff;stroke-opacity:.75;stroke-width:1.1;stroke-linecap:round}
.switch{cursor:pointer}

<script>
const byId = (id) => document.getElementById(id);
const workspace = document.querySelector('.workspace');
const viewport = byId('scene');
const viewWidth = 620;
const viewHeight = 280;
const maxZoom = 3;
const center = { x: viewWidth / 2, y: viewHeight / 2 };
const camera = { x: 0, y: 0, zoom: 1 };
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));



// Convert from screen pixels to fixed viewport coordinates, accounting for SVG letterboxing.


// A press that starts on a scene object and ends without moving counts as a tap on it.
// Track the press separately so clicking still works after a drag captures the pointer.
let tap = null;
viewport.addEventListener('pointerdown', (event) => {
  const target = event.target.closest?.('[data-hit]');
  tap = target && event.button === 0 && event.isPrimary
    ? { hit: target.dataset.hit, x: event.clientX, y: event.clientY, id: event.pointerId }
    : null;
});
viewport.addEventListener('pointerup', (event) => {
  if (tap && tap.id === event.pointerId && Math.hypot(event.clientX - tap.x, event.clientY - tap.y) < 8) {
    sceneTap(tap.hit);
  }
  tap = null;
});
viewport.addEventListener('pointercancel', () => { tap = null; });

enableCameraDrag();



byId('zoom-in').onclick = () => zoomBy(.25);
byId('zoom-out').onclick = () => zoomBy(-.25);
viewport.addEventListener('keydown', (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const directions = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const direction = directions[event.key];
  if (direction && camera.zoom > 1) {
    event.preventDefault();
    setCamera(camera.x + direction[0] * 28 / camera.zoom, camera.y + direction[1] * 28 / camera.zoom, camera.zoom);
  } else if (event.key === '+' || event.key === '=' || event.key === '-') {
    event.preventDefault();
    zoomBy(event.key === '-' ? -.25 : .25);
  } else if (event.key === '0') {
    event.preventDefault();
    resetView();
  }
});
setCamera(0, 0, 1);

const motion = matchMedia('(prefers-reduced-motion: reduce)');
const count = 16;

// Sixteen distinct numbers between 1 and 99, sorted. `shuffled` keeps the same numbers in a mixed order.
function makeNumbers(seed) {
  let x = seed;
  const random = () => (x = (x * 1103515245 + 12345) % 2147483648) / 2147483648;
  const set = new Set();
  while (set.size < count) set.add(1 + Math.floor(random() * 99));
  const sorted = [...set].sort((a, b) => a - b);
  const shuffled = [...sorted];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return { sorted, shuffled, random };
}

const sizes = [16, 1000, 1000000];
const workedSorted = [1, 4, 9, 10, 16, 24, 26, 30, 35, 37, 41, 43, 61, 81, 84, 99];
const workedShuffled = [61, 4, 99, 35, 26, 81, 16, 43, 9, 1, 30, 10, 41, 24, 37, 84];
const lesson = [
  {
    readingDiagram: {
      title: "정렬되지 않으면 앞에서부터 확인한다",
      description: "정렬되지 않으면 앞에서부터 확인한다",

function drawFaces(node, h, H, fills) {
  const faces = {
    left: [[-h, -h, 0], [h, -h, 0], [h, -h, H], [-h, -h, H]],
    right: [[h, -h, 0], [h, h, 0], [h, h, H], [h, -h, H]],
    top: [[-h, -h, H], [h, -h, H], [h, h, H], [-h, h, H]],
  };
  for (const [name, corners] of Object.entries(faces)) {
    const attrs = { class: 'face ' + name, points: corners.map((p) => point(...p)).join(' ') };
    if (fills) Object.assign(attrs, { fill: fills[name], stroke: fills.stroke });
    svg('polygon', attrs, node);
  }
  svg('path', { class: 'highlight', d: `M${point(-h, -h, H)}L${point(h, -h, H)}L${point(h, h, H)}` }, node);
}

// Plates are small labels whose box is sized to the text.
let plates = [];
function addPlate(node, className, x, y, text, { pad = 1.5, round = true } = {}) {
  const group = svg('g', { class: className }, node);
  const plate = { group, rect: svg('rect', {}, group), label: svg('text', {}, group), x, y, pad, round };
  plate.label.textContent = text;
  plates.push(plate);
  sizePlate(plate);
  return plate;
}

function boxState(i) {
  if (state.found && state.numbers[i] === state.target) return 'found';
  // A box opened on the way stays open after its side is thrown away, so the picked middles stand out from the rest.
  if (state.openedSet.has(i)) return 'open';
  if (step().mode === 'binary' && (i < state.lo || i > state.hi)) return 'out';
  return 'closed';
}
function shownBoxValue(index, kind) {
  if (kind === 'out') return '×';
  if (kind === 'closed') return '?';
  return String(state.numbers[index]);
}

function paint() {
  const s = step();
  byId('world').setAttribute('display', s.mode === 'shuffle' ? 'none' : '');
  drawShuffle();
  if (s.mode === 'shuffle') {
    syncControls();
    return;
  }
  for (const group of byId('world').querySelectorAll('.mode-group')) group.classList.toggle('hidden', group.dataset.mode !== (s.mode === 'compare' ? 'compare' : 'boxes'));
  if (s.mode === 'compare') {
    towers[0].target = towerHeight(worstLinear(state.size));
    towers[1].target = towerHeight(worstBinary(state.size));
    towers[0].plate.label.textContent = `${worstLinear(state.size).toLocaleString('ko-KR')}번`;
    towers[1].plate.label.textContent = `${worstBinary(state.size)}번`;
    dataPlate.label.textContent = `데이터 ${state.size.toLocaleString('ko-KR')}개 · 최악일 때 여는 횟수 · 높이는 로그 눈금`;
    sizePlate(dataPlate);
  } else {
    targetPlate.label.textContent = state.opened ? `찾는 수 ${state.target} · 연 상자 ${state.opened}개` : `찾는 수 ${state.target}`;
    sizePlate(targetPlate);
    const order = [...state.openedSet].map((i) => `${i + 1}번 ${state.numbers[i]}`);
    orderPlate.group.classList.toggle('hidden', s.mode !== 'binary' || !order.length);
    orderPlate.label.textContent = order.length ? `정렬됨 · 열어 본 가운데 ${order.join(' → ')}` : '';
    sizePlate(orderPlate);
    boxes.forEach((box, i) => {
      const kind = boxState(i);
      box.node.setAttribute('class', `node box ${kind}`);
      box.digit.textContent = shownBoxValue(i, kind);
      box.target = kind === 'found' ? high : kind === 'out' ? sunk : low;
    });
  }
  animate();
  syncControls();
}

let shapeFrame = null;
function animate() {
  if (shapeFrame !== null) return;
  const frameStep = () => {
    shapeFrame = null;
    let moving = false;
    for (const item of [...boxes, ...towers]) {
      const next = motion.matches ? item.target : mix(item.height, item.target, .22);
      item.height = Math.abs(next - item.target) < .3 ? item.target : next;
      if (item.height !== item.target) moving = true;
      (item.plate ? shapeTower : shapeBox)(item, item.height);
    }
    if (moving) shapeFrame = requestAnimationFrame(frameStep);
  };
  frameStep();
}

// ---------- HTML controls ----------
const boxButtons = [];
function buildControls() {
  const row = byId('box-buttons');
  for (let i = 0; i < count; i++) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'box-button';
    button.addEventListener('click', () => openBox(i));
    row.append(button);
    boxButtons.push(button);
  }
  byId('new-round').onclick = () => {
    state.playing = false;
    state.solved = '';
    state.round++;
    newRound();
    paint();
    syncPlayback();
    syncTask();
    byId('announcement').textContent = `새 문제. 찾는 수 ${state.target}`;
  };
  for (const n of sizes) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'action choice-button';
    button.textContent = `${n.toLocaleString('ko-KR')}개`;
    button.dataset.value = n;
    button.addEventListener('click', () => userChange(() => { state.size = n; }, `데이터 ${n.toLocaleString('ko-KR')}개.`));
    byId('size-choices').append(button);
  }
}
function syncControls() {
  const s = step();
  byId('box-area').hidden = !['linear', 'binary'].includes(s.mode);
  byId('try').hidden = s.mode === 'shuffle';
  byId('readout').hidden = s.mode === 'shuffle';
  byId('shuffle-choices').hidden = s.mode !== 'shuffle';
  if (s.mode === 'shuffle') return;
  byId('size-area').hidden = s.mode !== 'compare';
  boxButtons.forEach((button, i) => {
    const kind = boxState(i);
    button.className = `box-button ${kind}`;
    button.textContent = shownBoxValue(i, kind);
    button.disabled = state.found || kind === 'out' || kind === 'open';
    const status = kind === 'closed' ? '닫힘' : kind === 'out' ? '미개봉 제외' : String(state.numbers[i]);
    button.setAttribute('aria-label', `${i + 1}번 상자, ${status}`);
  });
  for (const button of document.querySelectorAll('#size-choices button')) button.setAttribute('aria-pressed', String(Number(button.dataset.value) === state.size));
  byId('readout').replaceChildren(...readout());
}
function readout() {
  const s = step();
  const strong = (text, className) => {
    const element = document.createElement('b');
    if (className) element.className = className;
    element.textContent = text;
    return element;
  };
  if (s.mode === 'compare') {
    return ['데이터 ', strong(`${state.size.toLocaleString('ko-KR')}개`), ' → 하나씩 최대 ', strong(`${worstLinear(state.size).toLocaleString('ko-KR')}번`),
      ' · 반씩 최대 ', strong(`${worstBinary(state.size)}번`, 'total')];
  }
  const parts = ['찾는 수 ', strong(String(state.target)), ' · 연 상자 ', strong(`${state.opened}개`, 'total')];
  if (s.mode === 'binary' && !state.found) parts.push(` · 남은 범위 ${state.hi - state.lo + 1}개`);
  if (state.hint) parts.push(` · ${state.hint}`);
  return parts;
}

// ---------- Searching ----------
function newRound() {
  const { sorted, shuffled, random } = makeNumbers(state.round * 7919 + 17);
  const binary = step().mode === 'binary';
  state.numbers = state.round === 0 ? (binary ? workedSorted : workedShuffled) : (binary ? sorted : shuffled);
  state.target = state.round === 0 ? 84 : sorted[Math.floor(random() * count)];
  state.openedSet = new Set();
  state.opened = 0;
  state.lo = 0;
  state.hi = count - 1;
  state.found = false;
  state.hint = '';
  // The demo's order of boxes to open.
  if (step().mode === 'binary') {
    state.plan = [];
    let lo = 0, hi = count - 1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      state.plan.push(mid);
      if (state.numbers[mid] === state.target) break;
      if (state.numbers[mid] < state.target) lo = mid + 1; else hi = mid - 1;
    }
  } else state.plan = [...Array(count).keys()];
}
function revealBox(i) {
  if (state.found || state.openedSet.has(i) || i < state.lo || i > state.hi) return false;
  state.openedSet.add(i);
  state.opened++;
  const value = state.numbers[i];
  if (value === state.target) {
    state.found = true;
    state.hint = `${i + 1}번 상자에서 찾았습니다`;
  } else if (step().mode === 'binary') {
    if (value < state.target) { state.lo = i + 1; state.hint = `${value}은(는) 찾는 수보다 작습니다 → 왼쪽을 버립니다`; }
    else { state.hi = i - 1; state.hint = `${value}은(는) 찾는 수보다 큽니다 → 오른쪽을 버립니다`; }
  } else state.hint = `${value}, 아닙니다`;
  return true;
}
function openBox(i) {
  if (!['linear', 'binary'].includes(step().mode)) return;
  userChange(() => { revealBox(i); }, '');
  byId('announcement').textContent = state.hint;
}
function sceneTap(hit) {
  if (hit?.startsWith('b')) openBox(Number(hit.slice(1)));
}
function userChange(change, message) {
  if (state.playing) {
    // The learner takes over from the demo: start a fresh search.
    state.playing = false;
    if (step().mode !== 'compare') newRound();
  }
  state.solved = '';
  change();
  paint();
  syncPlayback();
  if (message) byId('announcement').textContent = message;
  syncTask();
  checkTask();
}

// ---------- Try-it problems ----------
function syncTask() {
  const tasks = step().tasks;
  const done = progress[state.index];
  const allDone = done >= tasks.length;
  byId('try').classList.toggle('solved', state.solved !== '');
  byId('try-text').textContent = state.solved !== '' ? tasks[done - 1].text
    : allDone ? '이 단계의 문제를 모두 풀었습니다. 자유롭게 해 보세요.' : tasks[done].text;
  byId('try-result').textContent = state.solved === '' ? ''
    : `✓ 맞았습니다. ${state.solved}${allDone ? ' · 이 단계의 문제를 모두 풀었습니다.' : ''}`;
  byId('try-next').hidden = state.solved === '' || allDone;
}
function checkTask() {
  const tasks = step().tasks;
  const done = progress[state.index];
  if (state.solved !== '' || done >= tasks.length || !tasks[done].check(state)) return;
  progress[state.index] = done + 1;
  state.solved = tasks[done].result?.(state) ?? `${state.opened}번 만에 찾았습니다`;
  syncTask();
}
byId('try-next').onclick = () => { state.solved = ''; syncTask(); };

// ---------- Demo playback ----------
let frame = null, lastFrame = null;
function demoTick() {
  const s = step();
  if (s.mode === 'compare') {
    state.size = sizes[(sizes.indexOf(state.size) + 1) % sizes.length];
    paint();
    state.wait = 2600;
    return;
  }
  if (state.found) {
    state.round++;
    newRound();
    paint();
    state.wait = 900;
    return;
  }
  const next = state.plan.find((i) => !state.openedSet.has(i) && i >= state.lo && i <= state.hi);
  revealBox(next);
  if (state.index === 1) state.playing = false;
  paint();
  state.wait = state.found ? 2200 : s.mode === 'binary' ? 1300 : 520;
}
function tick(now) {
  frame = null;
  const elapsed = lastFrame === null ? 0 : Math.min(now - lastFrame, 80);
  lastFrame = now;
  if (state.playing) {
    state.wait -= elapsed;
    if (state.wait <= 0) demoTick();
    frame = requestAnimationFrame(tick);
  } else lastFrame = null;
}
function syncPlayback() {
  const reduced = motion.matches;
  if (reduced) state.playing = false;
  if (state.playing && frame === null) frame = requestAnimationFrame(tick);
}

// ---------- Steps and routing ----------
const legends = {
  linear: '<span><i class="dot"></i>닫힌 상자</span><span><i class="dot open"></i>열어 본 상자</span><span><i class="dot on"></i>찾은 상자</span>',
  binary: '<span><i class="dot open"></i>열어 본 상자</span><span><i class="dot out"></i>버린 범위</span><span><i class="dot on"></i>찾은 상자</span>',
  shuffle: '',
  compare: '<span><i class="dot warn"></i>하나씩 찾기</span><span><i class="dot on"></i>반씩 줄이기</span><span>기둥 높이 = 최악일 때 여는 횟수(로그 눈금)</span>',
};
function startStep() {
  state.size = 16;
  state.round = 0;
  newRound();
  state.wait = 900;
  state.protectedLeft = null;
  byId('shuffle-feedback').textContent = '';
  if (motion.matches && !coursePracticeStarted) showFinished();
  if (coursePracticeStarted && state.index === 2) revealBox(7);
}
// Nothing plays with reduced motion, so the still picture shows a finished search instead of sixteen closed boxes:
// the example's worst case for one at a time (the last box), a target right of the middle for halving, and a million
// items for the comparison (0.6 review: closed boxes alone said nothing about how the search went).
function showFinished() {
  const s = step();
  if (s.mode === 'compare') { state.size = 1000000; return; }
  if (s.mode === 'shuffle') return;
  if (state.index === 1) { revealBox(7); return; }
  const at = s.mode === 'binary' ? 14 : count - 1;
  state.target = state.numbers[at];
  let lo = 0, hi = count - 1;
  state.plan = [];
  if (s.mode === 'binary') {
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      state.plan.push(mid);
      if (state.numbers[mid] === state.target) break;
      if (state.numbers[mid] < state.target) lo = mid + 1; else hi = mid - 1;
    }
  } else state.plan = [...Array(count).keys()];
  for (const i of state.plan) if (!state.found) revealBox(i);
}
function showStep(index, announce = true) {
  state.index = index;
  state.playing = lessonDemoEnabled() && step().mode !== 'shuffle';
  startStep();
  const s = step();
  byId('step-title').textContent = s.title;
  byId('body').textContent = s.body;
  byId('takeaway').textContent = s.takeaway;
  byId('scene-desc').textContent = s.description;
  byId('legend').innerHTML = legends[s.mode];
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  stepButtons.forEach((button, i) => {
    if (i === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  byId('world').setAttribute('transform', s.mode === 'compare' ? 'translate(310 205) scale(.9)' : 'translate(310 150) scale(1.04)');
  state.solved = '';
  syncTask();
  paint();
  syncShuffleDescription();
  syncPlayback();
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${s.title}`;
}
function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/search/${index + 1}`);
  showStep(index);
}
const stepButtons = lesson.map(({ label }, index) => {
  const listItem = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  const number = document.createElement('span');
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.addEventListener('click', () => goToStep(index));
  listItem.append(button);
  byId('steps').append(listItem);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
motion.addEventListener('change', () => {
  if (lessonDemoEnabled() && step().mode !== 'shuffle') state.playing = true;
  syncPlayback();
});
window.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});

function syncShuffleDescription() {
  if (step().mode !== 'shuffle') return;
  const practicing = coursePracticeStarted && !workspace.classList.contains('course-reading');
  byId('scene-desc').textContent = !practicing ? step().description
    : state.protectedLeft === true ? '섞인 카드의 가운데 30보다 목표 81이 큽니다. 왼쪽 두 번째 카드에 81이 있습니다.'
    : '섞인 카드 여덟 장 중 네 번째의 30만 보입니다. 찾는 수는 81입니다.';
  drawShuffle();
}
function chooseShuffle(keep) {
  state.protectedLeft = keep;
  byId('shuffle-feedback').textContent = keep
    ? '맞았습니다. 왼쪽의 두 번째 상자에서 81이 나왔습니다.'
    : '이 경우에도 그렇게 할 수 있는지 다시 생각해 보세요.';
  syncShuffleDescription();
}
byId('shuffle-discard').onclick = () => chooseShuffle(false);
byId('shuffle-keep').onclick = () => chooseShuffle(true);
new MutationObserver(syncShuffleDescription).observe(workspace, {attributes: true, attributeFilter: ['class']});

buildScaleFigure();
buildBoxes();
buildTowers();
buildControls();
const initial = routeIndex();
history.replaceState(null, '', `#/search/${initial + 1}`);
state.index = initial;
showStep(initial, false);
</script>
</body>
</html>
