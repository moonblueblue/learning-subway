<dialog id="rag-dialog" role="dialog" aria-labelledby="rag-heading">
  <header class="rag-header">
    <h2 id="rag-heading">실행 결과</h2>
    <form method="dialog"><button class="action">닫기</button></form>
  </header>
  <p id="rag-load-error" role="alert"></p>
  <section id="rag-report" data-rag-panel="report">
    <div class="rag-fields">
      <label>시험 사례<select id="rag-case"></select></label>
      <label>보기<select id="rag-view">
        <option value="answer">답변·인용</option>
        <option value="retrieval">검색 순위</option>
        <option value="trace">실행 추적</option>
        <option value="evaluation">분리 평가</option>
        <option value="summary">시험셋 집계</option>
      </select></label>
    </div>
    <section data-rag-view="answer">
      <p id="rag-outcome" class="rag-status" role="status"></p>
      <p id="rag-request" data-no-i18n class="rag-line"></p>
      <p id="rag-citation" class="rag-line"></p>
      <p id="rag-quote" data-no-i18n></p>
      <p id="rag-tool-result"></p>
      <button id="rag-more-quote" type="button" class="action" hidden>다음 원문</button>
    </section>
    <section data-rag-view="retrieval" hidden>
      <p id="rag-limits"></p>
      <table><thead><tr><th scope="col">순위</th><th scope="col">근거 ID</th><th scope="col">BM25</th></tr></thead><tbody id="rag-ranking"></tbody></table>
    </section>
    <section data-rag-view="trace" hidden>
      <p id="rag-executions"></p>
      <ol id="rag-trace"></ol>
    </section>
    <section data-rag-view="evaluation" hidden>
      <p id="rag-grade"></p>
      <p id="rag-diagnosis"></p>
      <p id="rag-gold" class="rag-line"></p>
      <p id="rag-gold-quote" class="rag-line" data-no-i18n></p>
    </section>
    <section data-rag-view="summary" hidden>
      <p id="rag-summary"></p>
      <table><tbody id="rag-scores"></tbody></table>
    </section>
    <div class="rag-actions">
      <button id="rag-edit-from-report" class="action" type="button">입력 편집</button>
      <button id="rag-open-downloads" class="action" type="button">파일 받기</button>
    </div>
  </section>
  <form data-rag-panel="editor" id="rag-editor-form" hidden>
    <label>문서·사용자·사례 JSON<textarea id="rag-editor" spellcheck="false"></textarea></label>
    <div class="rag-actions">
      <button id="rag-apply-input" class="action primary" type="submit">색인·실행</button>
      <button id="rag-reset-input" class="action" type="button">기본 입력</button>
      <button id="rag-cancel-editor" class="action" type="button">실행 결과</button>
    </div>
    <p id="rag-error" role="alert"></p>
  </form>
  <section data-rag-panel="downloads" hidden>
    <div class="rag-download-grid">
      <button id="rag-download-input" class="action" type="button">입력 JSON</button>
      <button id="rag-download-runner" class="action" type="button">Node 실행기</button>
      <button id="rag-download-state" class="action" type="button">설치 상태 JSON</button>
      <button id="rag-download-report" class="action" type="button">보고서 JSON</button>
    </div>
    <div class="rag-actions">
      <button id="rag-back" class="action" type="button">실행 결과</button>
      <label>명령<select id="rag-command-mode">
        <option value="install">빈 폴더에 설치</option>
        <option value="run">설치 상태 재실행</option>
      </select></label>
    </div>
    <code id="rag-command" tabindex="0"></code>
  </section>
</dialog>
