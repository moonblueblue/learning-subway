<body>
<main class="shell">
  <header>
    <p class="eyebrow">4장 자료구조와 알고리즘 · 레슨 4.8</p>
    <h1>최단 경로</h1>
    <p class="lead">지도 앱은 가장 빠른 길을 어떻게 찾을까요? 길마다 걸리는 시간이 적힌 그래프에서 다익스트라 알고리즘을 한 걸음씩 돌려 보세요.</p>
  </header>
  <div class="workspace">
    <div>
      <section class="panel" id="stage-panel" aria-labelledby="stage-heading">
        <div class="stage-top"><h2 id="stage-heading">시간이 적힌 길</h2></div>
        <div class="stage">
          <svg id="scene" viewBox="0 0 620 280" role="img" tabindex="0" aria-labelledby="scene-title scene-desc">
            <title id="scene-title">길마다 걸리는 시간이 적힌 그래프에서 A로부터의 가장 빠른 시간을 구하는 장면</title><desc id="scene-desc"></desc>
            <defs>
              <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
              <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
              <radialGradient id="grid-fade"><stop offset=".45" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
              <mask id="grid-mask"><rect x="-460" y="-260" width="920" height="520" fill="url(#grid-fade)"/></mask>
            </defs>
            <g id="world" aria-hidden="true">
              <path id="grid" class="iso-grid" mask="url(#grid-mask)"></path>
              <g id="casings"></g><g id="links"></g><g id="nodes"></g><g id="packets"></g>
            </g>
          </svg>
        </div>
        <div class="hands-on">
          <div class="try" id="try">
            <p><strong>해 보기</strong><span id="try-text"></span></p>
            <p class="try-result" id="try-result" role="status"></p>
            <div class="try-choices" id="try-choices" role="group" aria-label="예측 고르기"></div>
          </div>
          <p class="readout" id="readout"></p>
          <div class="algo-row" id="mode-row" role="group" aria-label="길 고르기"></div>
          <div class="algo-row" id="run-row"><span class="row-name">다익스트라</span><button class="action primary" id="step-tick" type="button">한 걸음</button><button class="action primary" id="step-all" type="button">끝까지</button><button class="action" id="restart" type="button">처음부터</button></div>
          <table class="truth dist-table" id="table"></table>
        </div>
        <div class="view-controls" role="group" aria-label="장면 보기">
          <button class="action" id="zoom-out" type="button" aria-label="장면 축소">−</button>
          <output class="view-scale" id="view-scale" aria-label="현재 배율" aria-live="off">100%</output>
          <button class="action" id="zoom-in" type="button" aria-label="장면 확대">+</button>
          <span class="view-hint"><span class="mouse-hint">확대 후 드래그로 이동</span><span class="touch-hint">두 손가락으로 확대</span></span>
        </div>
        <div class="controls">
          <div class="legend" aria-label="범례"><span><i class="pill"></i>확정 전 시간</span><span><i class="dot settleddot"></i>확정된 곳</span><span><i class="pill cut"></i>방금 줄어든 시간</span><span><i class="sample relaxb"></i>시간을 줄인 길</span><span><i class="sample tree"></i>지금 쓰는 앞 곳 길</span><span><i class="sample path"></i>가장 빠른 길</span></div>

<script>
const byId = (id) => document.getElementById(id);
const viewport = byId('scene');
const viewWidth = 620;
const viewHeight = 280;
const maxZoom = 3;
const center = { x: viewWidth / 2, y: viewHeight / 2 };
const camera = { x: 0, y: 0, zoom: 1 };
const pointers = new Map();
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));



// Convert from screen pixels to fixed viewport coordinates, accounting for SVG letterboxing.


// A press that starts on a switch and ends without moving toggles that switch.
// Tracked separately from the camera pointers so it also works when the pointer is captured.
let tap = null;
viewport.addEventListener('pointerdown', (event) => {
  const target = event.target.closest?.('[data-input]');
  tap = target && event.button === 0 && pointers.size === 0
    ? { input: target.dataset.input, x: event.clientX, y: event.clientY, id: event.pointerId }
    : null;
});
viewport.addEventListener('pointerup', (event) => {
  if (tap && tap.id === event.pointerId && Math.hypot(event.clientX - tap.x, event.clientY - tap.y) < 8) {
    toggleInput(tap.input);
  }
  tap = null;
});
viewport.addEventListener('pointercancel', () => { tap = null; });

viewport.addEventListener('pointerdown', (event) => {
  if (event.button !== 0 || pointers.size >= 2) return;
  if (event.pointerType !== 'touch' && camera.zoom === 1) return;
  pointers.set(event.pointerId, viewportPoint(event));
  viewport.setPointerCapture(event.pointerId);
});
viewport.addEventListener('pointermove', (event) => {
  if (!pointers.has(event.pointerId)) return;
  const before = pointerGeometry();
  pointers.set(event.pointerId, viewportPoint(event));
  const after = pointerGeometry();
  const pinch = pointers.size === 2;
  if (pinch && (before.distance < 1 || after.distance < 1)) return;
  const zoom = pinch ? camera.zoom * after.distance / before.distance : camera.zoom;
  zoomBetween(zoom, before.point, after.point);
  viewport.classList.toggle('is-dragging', !pinch && camera.zoom > 1);
});
for (const eventName of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  viewport.addEventListener(eventName, (event) => {
    if (pointers.delete(event.pointerId)) viewport.classList.remove('is-dragging');
  });
}



byId('zoom-in').onclick = () => zoomBy(.25);
byId('zoom-out').onclick = () => zoomBy(-.25);
viewport.addEventListener('keydown', (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const directions = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const direction = directions[event.key];
  if (direction && camera.zoom > 1) {
    event.preventDefault();
    setCamera(camera.x + direction[0] * 28 / camera.zoom, camera.y + direction[1] * 28 / camera.zoom, camera.zoom);
  } else if (event.key === '+' || event.key === '=' || event.key === '-') {
    event.preventDefault();
    zoomBy(event.key === '-' ? -.25 : .25);
  } else if (event.key === '0') {
    event.preventDefault();
    resetView();
  }
});
setCamera(0, 0, 1);
// Shortest paths with travel times. The graph is the one from 4.7, now with minutes on every road.
const places = {
  A: [0, 0], B: [5.5, -6.4], C: [5.5, 6.4], D: [11.2, -9.6], E: [11.2, 0], F: [11.2, 9.6], G: [16.9, -4.9], H: [16.9, 4.9], I: [22.6, 0],
};
const roads = { AB: 4, AC: 2, BD: 5, BE: 1, CE: 8, CF: 3, DG: 2, EG: 7, EH: 2, FH: 4, GI: 3, HI: 5 };
const names = Object.keys(places);
const other = (road, p) => road[0] === p ? road[1] : road[0];

// Dijkstra's algorithm as a list of moves: each move settles the unsettled place with the smallest known time,
// then tries every road out of it (relaxing), recording the distance table after the move.
function dijkstra(weights) {
  const dist = Object.fromEntries(names.map((n) => [n, Infinity]));
  const prev = {};
  const done = new Set();
  dist.A = 0;
  const moves = [];
  while (done.size < names.length) {
    const u = names.filter((n) => !done.has(n)).sort((a, b) => dist[a] - dist[b] || a.localeCompare(b))[0];
    done.add(u);
    const relaxed = [];
    for (const [road, w] of Object.entries(weights)) {
      if (!road.includes(u)) continue;
      const v = other(road, u);
      if (done.has(v)) continue;
      const better = dist[u] + w < dist[v];
      relaxed.push({ road, to: v, via: dist[u] + w, old: dist[v], better });
      if (better) { dist[v] = dist[u] + w; prev[v] = u; }
    }
    moves.push({ place: u, relaxed, dist: { ...dist }, prev: { ...prev }, done: [...done] });
  }

// Small boxes far apart, so every road and its minutes stay visible between the boxes.
const H = 12, half = .55;

function buildScene() {
  for (const id of ['casings', 'links', 'nodes', 'packets']) byId(id).replaceChildren();
  nodeViews = {};
  roadViews = {};
  for (const road of Object.keys(roads)) {
    const [a, b] = road;
    const d = `M${flat(...places[a], 4).join(' ')}L${flat(...places[b], 4).join(' ')}`;
    svg('path', { class: 'casing', d }, byId('casings'));
    const line = svg('path', { class: 'road', d }, byId('links'));
    const mid = flat((places[a][0] + places[b][0]) / 2, (places[a][1] + places[b][1]) / 2, 4);
    const tag = svg('g', { class: 'weight', transform: `translate(${mid.join(' ')})` }, byId('packets'));
    svg('rect', { x: -8, y: -7, width: 16, height: 14, rx: 4 }, tag);
    const text = svg('text', {}, tag);
    roadViews[road] = { line, tag, text };
  }
  Object.entries(places).sort(([, p], [, q]) => p[1] - q[1]).forEach(([name, at]) => {
    const node = svg('g', { class: 'node place', transform: `translate(${flat(...at).join(' ')})` }, byId('nodes'));
    drawShadow(node, half);
    drawBox(node, half, H);
    svg('text', { class: 'place-name', x: 0, y: -H + .5 }, node).textContent = name;
    // Known time, a pill on the floor right under the box's front corner: off the faces and below every road,
    // which leave the box sideways at a slope of at most 0.56.
    const badge = svg('g', { class: 'dist', transform: `translate(0 ${14 * half + 11})` }, node);
    const pill = svg('rect', { x: -14, y: -7, width: 28, height: 14, rx: 7 }, badge);
    const text = svg('text', {}, badge);
    nodeViews[name] = { node, badge, pill, text };

  const scale = Math.min(1.7, 590 / (right - left), 268 / (bottom - top));

}
function paint() {
  const preview = document.querySelector(motion.matches ? '.workspace.course-reading' : '.workspace.course-reading.course-step-preview') ? lesson[state.index].readingSearch : null;

  const done = new Set(last ? last.done : []);
  const running = lesson[state.index].mode !== 'compare';
  for (const [name, view] of Object.entries(nodeViews)) {
    view.node.setAttribute('class', 'node place' + (done.has(name) ? ' settled' : '') + (last?.place === name ? ' current' : ''));
    view.badge.style.display = running ? '' : 'none';
    view.text.textContent = dist[name] === Infinity ? '∞' : `${dist[name]}분`;
    view.badge.classList.toggle('changed', Boolean(last?.relaxed.some((r) => r.to === name && r.better)));
  }
  for (const [road, view] of Object.entries(roadViews)) {
    view.text.textContent = w[road];
    view.line.setAttribute('class', 'road' + (jam && road === 'HI' ? ' jam' : ''));
    view.tag.classList.toggle('jam', jam && road === 'HI');
  }
  if (last) {
    for (const r of last.relaxed) roadViews[r.road].line.classList.add(r.better ? 'relax-better' : 'relax');
    for (const n of last.done) if (last.prev[n]) roadViews[roadOf(n, last.prev[n])].line.classList.add('tree');
  }
  const path = preview ? (preview.path ? pathTo('I', last.prev) : null) : state.highlight ?? (state.pos >= state.moves.length && state.moves.length && running ? pathTo('I', last.prev) : null);
  if (path) for (let i = 1; i < path.length; i++) roadViews[roadOf(path[i - 1], path[i])].line.classList.add('path');
  syncTable(dist, done, last);
  // Size each time pill to its text after the page has translated it ('11분' → '11 min').
  requestAnimationFrame(() => {
    for (const view of Object.values(nodeViews)) {
      let width = 30;
      try { width = Math.max(22, view.text.getComputedTextLength() + 10); } catch { /* hidden */ }
      Object.entries({ x: -width / 2, width }).forEach(([k, v]) => view.pill.setAttribute(k, v));

  });

  // or the smallest of the waiting candidates.
  byId('example-note')?.remove();
  if (preview?.note === 'sum' && path) {
    const legs = path.slice(1).map((n, i) => w[roadOf(path[i], n)]);
    exampleNote(`${jam ? 'H–I 정체 5 → 12분 · ' : ''}A → I: ${path.join('–')} = ${legs.join(' + ')} = ${legs.reduce((a, b) => a + b, 0)}분`);
  } else if (preview?.note === 'settle' && last) {
    exampleNote(`미확정 중 가장 가까운 ${last.place}를 ${dist[last.place]}분으로 확정`);
  } else if (preview?.note === 'pick' && last) {
    const before = moves.at(-2);
    const waiting = names.filter((n) => !before.done.includes(n) && before.dist[n] !== Infinity);
    exampleNote(`후보 ${waiting.map((n) => `${n} ${before.dist[n]}분`).join(' · ')} → 가장 작은 ${last.place}를 꺼냄`);

}
function syncTable(dist, done, last) {
  const table = byId('table');
  table.hidden = lesson[state.index].mode === 'compare';
  if (table.hidden) return;
  table.replaceChildren(Object.assign(document.createElement('caption'), { textContent: '거리표 · A에서 걸리는 시간' }));
  const head = document.createElement('tr');
  head.append(Object.assign(document.createElement('th'), { textContent: '' }));
  for (const n of names) head.append(Object.assign(document.createElement('th'), { textContent: n }));
  table.append(head);
  const rows = [['시간', (n) => dist[n] === Infinity ? '∞' : dist[n]], ['앞 곳', (n) => (last?.prev ?? {})[n] ?? (n === 'A' ? '출발' : '–')], ['확정', (n) => done.has(n) ? '✓' : '']];
  for (const [label, get] of rows) {
    const tr = document.createElement('tr');
    tr.append(Object.assign(document.createElement('th'), { textContent: label }));
    for (const n of names) {
      const td = Object.assign(document.createElement('td'), { textContent: get(n) });
      if (label === '시간' && last?.relaxed.some((r) => r.to === n && r.better)) td.className = 'changed';
      if (done.has(n)) td.classList.add('settled');
      tr.append(td);
    }
    table.append(tr);
  }
}

  if (state.pos >= state.moves.length) return;
  const m = state.moves[state.pos++];
  const changes = m.relaxed.map((r) => r.better ? `${r.to}: ${r.old === Infinity ? '∞' : r.old} → ${r.via}분` : `${r.to}: ${r.via}분은 더 느려 그대로`);
  report(`${m.place} 확정 (${m.dist[m.place]}분) · ${changes.length ? changes.join(', ') : '새로 볼 길 없음'}`);
  paint();
  if (state.pos >= state.moves.length) finish(user);
}
function finish(user) {
  state.auto = false;
  state.finished = true;
  const last = state.moves.at(-1);
  const path = pathTo('I', last.prev);
  report(`모두 확정했습니다. I까지 가장 빠른 길: ${path.join('–')}, ${last.dist.I}분${state.jam ? ' (H–I 정체 중)' : ''}`);
  if (user) afterUser();
}
function runAll(user) {
  if (state.pos >= state.moves.length) startRun();
  state.auto = true;
  state.user = user;
  state.next = 0;
  if (motion.matches) { while (state.pos < state.moves.length) stepOnce(user); }
  else kick();
}
function showPath(kind, user) {
  const w = weights();
  const path = kind === 'fewest' ? fewestRoads : pathTo('I', dijkstra(w).at(-1).prev);
  state.highlight = path;
  state.shown[kind] = true;
  paint();
  const sums = path.slice(1).map((p, i) => w[roadOf(path[i], p)]);
  report(`${kind === 'fewest' ? '길 수가 가장 적은 길' : '가장 빠른 길'}: ${path.join('–')} · 길 ${path.length - 1}개 · ${sums.join(' + ')} = ${timeOf(path, w)}분`);
  if (user) afterUser();
}
function buildControls() {
  const mode = lesson[state.index].mode;
  const row = byId('mode-row');
  row.replaceChildren();
  const add = (text, onClick, cls = 'action') => {
    const b = Object.assign(document.createElement('button'), { type: 'button', className: cls, textContent: text });
    b.addEventListener('click', () => { takeOver(); onClick(b); });
    row.append(b);
    return b;
  };
  if (mode === 'compare') {
    add('길 수가 가장 적은 길 (너비 우선)', () => showPath('fewest', true), 'action primary');
    add('가장 빠른 길', () => showPath('fastest', true), 'action primary');
  }
  if (mode === 'jam') {
    const b = add('H–I 정체: 꺼짐', (button) => { state.jam = !state.jam; button.textContent = `H–I 정체: ${state.jam ? '켜짐 (12분)' : '꺼짐'}`; button.setAttribute('aria-pressed', String(state.jam)); startRun(); report(state.jam ? 'H–I 길이 막혀 12분이 됐습니다. 다시 실행해 보세요.' : 'H–I 정체를 껐습니다.'); }, 'action pick');
    b.id = 'jam';
    b.setAttribute('aria-pressed', 'false');
  }
  byId('run-row').hidden = mode === 'compare';
}
byId('step-tick').onclick = () => { takeOver(); if (state.pos >= state.moves.length) startRun(); stepOnce(true); };
byId('step-all').onclick = () => { takeOver(); runAll(true); };
byId('restart').onclick = () => { takeOver(); startRun(); report('처음부터 다시 시작합니다.'); };
function report(text) { byId('readout').textContent = text; byId('announcement').textContent = text; }

// ---------- Tasks ----------
const currentTask = () => lesson[state.index].tasks[progress[state.index]];
function syncTask() {
  const tasks = lesson[state.index].tasks;
  const task = currentTask();
  const choices = byId('try-choices');
  choices.replaceChildren();
  byId('try').classList.toggle('solved', Boolean(state.solved) && !task?.ask);
  if (task?.ask) {
    byId('try-text').textContent = task.ask;
    byId('try-result').textContent = state.wrong || (state.solved ? `✓ 맞았습니다. ${state.solved}` : '');
    for (const choice of task.choices) {
      const b = Object.assign(document.createElement('button'), { type: 'button', className: 'action choice-button', textContent: choice });
      b.addEventListener('click', () => answer(choice));
      choices.append(b);
    }
    return;
  }
  byId('try-text').textContent = task ? task.text : (state.solved ? '' : '이 단계의 문제를 모두 풀었습니다. 자유롭게 해 보세요.');
  byId('try-result').textContent = state.solved ? `✓ 맞았습니다. ${state.solved}${progress[state.index] >= tasks.length ? ' · 이 단계의 문제를 모두 풀었습니다.' : ''}` : '';
}
// Only the learner's own actions count, so the demo cannot solve a problem.
function afterUser() {
  const task = currentTask();
  if (task && !task.ask && task.test(state)) { progress[state.index]++; state.solved = task.ok; state.wrong = ''; }
  syncTask();
}
function answer(choice) {
  const task = currentTask();
  if (choice !== task.answer) { state.wrong = `✗ ${choice}이(가) 아닙니다. 다시 골라 보세요.`; syncTask(); return; }
  progress[state.index]++;
  state.wrong = '';
  state.solved = task.why;
  syncTask();
}

// ---------- Frame loop and demo ----------
let frame = null, lastFrame = null;
function kick() { if (frame === null) frame = requestAnimationFrame(tick); }
function tick(now) {
  frame = null;
  const elapsed = lastFrame === null ? 0 : Math.min(now - lastFrame, 80);
  lastFrame = now;
  if (state.auto) {
    state.next -= elapsed;
    if (state.next <= 0) { stepOnce(state.user); state.next = 1100; }
  } else if (state.playing) {
    state.wait -= elapsed;
    if (state.wait <= 0) demoTick();
  }
  if (state.auto || state.playing) frame = requestAnimationFrame(tick);
  else lastFrame = null;
}
function takeOver() {
  if (!state.playing) return;
  state.playing = false;
  state.auto = false;
  startRun();
  syncPlayback();
}
function demoTick() {
  document.querySelector('.course-step-preview')?.dispatchEvent(new Event('course-playback-start'));
  const mode = lesson[state.index].mode;
  const p = state.demoPosition++;
  if (mode === 'compare') { showPath(p % 2 ? 'fastest' : 'fewest', false); state.wait = 3200; return; }
  if (mode === 'jam') { state.jam = p % 2 === 1; const b = byId('jam'); if (b) b.textContent = `H–I 정체: ${state.jam ? '켜짐 (12분)' : '꺼짐'}`; }
  startRun();
  runAll(false);
  state.wait = state.moves.length * 1100 + 3000;
}
function syncPlayback() {
  const reduced = motion.matches;
  if (reduced) state.playing = false;
  if (state.playing) kick();
}

// ---------- Steps and routing ----------
function showStep(index, announce = true) {
  state.index = index;
  state.playing = !motion.matches;
  const s = lesson[index];
  state.solved = '';
  state.wrong = '';
  state.demoPosition = 0;
  state.shown = {};
  state.jam = false;
  state.auto = false;
  byId('step-title').textContent = s.title;
  byId('body').textContent = s.body;
  byId('takeaway').textContent = s.takeaway;
  byId('scene-desc').textContent = s.description;
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  stepButtons.forEach((button, i) => {
    if (i === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  try { localStorage.setItem(storageKey, String(index)); } catch {}
  buildScene();
  buildControls();
  startRun();
  report(s.mode === 'compare' ? '두 버튼으로 두 길의 시간을 비교해 보세요.' : '"한 걸음"으로 하나씩, "끝까지"로 한 번에 실행해 보세요.');
  syncTask();
  state.wait = 800;
  syncPlayback();
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${s.title}`;
}
function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/shortest/${index + 1}`);
  showStep(index);
}
function routeIndex() {
  const match = /^#\/shortest\/(\d+)$/.exec(location.hash);
  const routed = match ? Number(match[1]) - 1 : -1;
  if (routed >= 0 && routed < lesson.length) return routed;
  try {
    const stored = localStorage.getItem(storageKey);
    const index = Number(stored);
    if (stored !== null && Number.isInteger(index) && index >= 0 && index < lesson.length) return index;
  } catch {}
  return 0;
}
const stepButtons = lesson.map(({ label }, index) => {
  const listItem = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  const number = document.createElement('span');
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.addEventListener('click', () => goToStep(index));
  listItem.append(button);
  byId('steps').append(listItem);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
motion.addEventListener('change', () => {
  if (!motion.matches) state.playing = true;
  syncPlayback();
});
window.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});
const initial = routeIndex();
history.replaceState(null, '', `#/shortest/${initial + 1}`);
state.index = -1;
showStep(initial, false);
</script>
</body>
</html>
