const byId = id => document.getElementById(id);
const viewport = byId('scene');
const viewWidth = 620;
const viewHeight = 280;
const center = {x: viewWidth / 2, y: viewHeight / 2};
const camera = {x: 0, y: 0, zoom: 1};
const maxZoom = 2.2;
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
document.getElementById('zoom-in').onclick = () => zoomBy(.25);
document.getElementById('zoom-out').onclick = () => zoomBy(-.25);
enableCameraDrag();
viewport.addEventListener('keydown', event => {
  if (event.altKey || event.ctrlKey || event.metaKey) return;
  const pan = {ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1]}[event.key];
  if (pan && camera.zoom > 1) {
    event.preventDefault();
    setCamera(camera.x + pan[0] * 18, camera.y + pan[1] * 18, camera.zoom);
  } else if (event.key === '+' || event.key === '-' || event.key === '0') {
    event.preventDefault();
    if (event.key === '0') resetView();
    else zoomBy(event.key === '+' ? .25 : -.25);
  }
});
setCamera(0, 0, 1);

const setOverlapY = Math.sqrt(110 ** 2 - 60 ** 2);
const setTop = 150 - setOverlapY;
const setBottom = 150 + setOverlapY;
const overlapStart = `M 300 ${setTop}`;
const vennRegions = [
  '',
  `${overlapStart} A 110 110 0 0 1 300 ${setBottom} A 110 110 0 0 1 300 ${setTop} Z`,
  `${overlapStart} A 110 110 0 1 1 300 ${setBottom} A 110 110 0 1 1 300 ${setTop} Z`,
  `${overlapStart} A 110 110 0 0 0 300 ${setBottom} A 110 110 0 1 1 300 ${setTop} Z`,
];
const vennResults = ['2는 A에도 B에도 있다','A ∩ B = {2} · 둘 다에 있는 것',
  'A ∪ B = {1, 2, 3} · 어느 한쪽에라도 있는 것','A − B = {1} · A에는 있고 B에는 없는 것'];
const vennText = value => window.courseI18n?.translate(value) ?? value;

function drawFigure(index, {hide, changed}) {
  const root = svg('svg', {x:30, y:0, width:560, height:280, viewBox:'0 0 600 300'}, byId('figure'));
  const step = index - 1;
  const region = !hide.includes('칠') && vennRegions[step];
  if (region) {
    const defs = svg('defs', {}, root);
    const clip = svg('clipPath', {id:'set-region-clip'}, defs);
    svg('path', {d:region}, clip);
    const hatch = svg('pattern', {id:'venn-kind-a', width:6, height:6, patternUnits:'userSpaceOnUse'}, defs);
    svg('rect', {width:6, height:6, class:'part-segment kind-a'}, hatch);
    svg('path', {d:'M-2 2L2 -2M0 6L6 0M4 8L8 4', class:'part-pattern-line'}, hatch);
    svg('rect', {width:600, height:300, fill:'url(#venn-kind-a)','clip-path':'url(#set-region-clip)','data-name':'칠'}, root);
  }
  for (const [id,x,anchor,label] of [['A',240,'start','A = {1, 2}'],['B',360,'end','B = {2, 3}']]) {
    svg('circle', {cx:x,cy:150,r:110,class:'venn-set','data-name':'원 '+id},root);
    svg('text',{x:id==='A'?180:420,y:28,class:'venn-label','text-anchor':anchor},root).textContent=label;
  }
  if (region && changed.includes('칠')) svg('path', {d:region,fill:'none','data-changed':''},root);
  for (const [i,x] of [175,300,425].entries()) {
    const g=svg('g',{'data-name':'원소 '+(i+1)},root);
    svg('circle',{cx:x,cy:150,r:18,class:'venn-element'},g);
    svg('text',{x,y:155,class:'venn-label','text-anchor':'middle'},g).textContent=i+1;
  }
  if (!hide.includes('결과 글')) {
    const attrs = {x:300,y:286,class:'venn-label','text-anchor':'middle','data-name':'결과 글'};
    if (changed.includes('결과 글')) attrs['data-changed']='';
    svg('text',attrs,root).textContent=vennText(vennResults[step]);
  }
}
