const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
const state = {cards: [], applied: false};

function text(parent, x, y, value, className = 'caption') {
  svg('text', {x, y, class: className}, parent).textContent = value;
}

function rect(parent, x, y, width, height, className, rx = 6) {
  return svg('rect', {x, y, width, height, rx, class: className}, parent);
}

function flow(parent, d) {
  svg('path', {d, class: 'flow'}, parent);
}

function stamp(parent, shape, x, y) {
  svg('use', {href: '#stamp-' + shape, x: x - 12, y: y - 12, width: 24, height: 24}, parent);
}

function paper(parent, values, x, y, numbered = false, changed = []) {
  values.forEach((shape, i) => {
    const cell = x + (i - 1) * 37;
    if (numbered) text(parent, cell, y - 24, i + 1, 'small');
    const frame = rect(parent, cell - 16, y - 17, 32, 34, shape ? 'surface' : 'empty');
    if (changed.includes(i)) frame.setAttribute('data-changed', '');
    if (shape) stamp(parent, shape, cell, y);
  });
}

function command(parent, shape, x, y, number, changed = false) {
  const frame = rect(parent, x - 27, y - 19, 54, 38, shape ? 'instruction' : 'pending-card');
  if (changed) frame.setAttribute('data-changed', '');
  // The order on an instruction card is a circled number, so it never reads as a box number (card, 2026-11-28).
  text(parent, x - 14, y + 6, typeof number === 'number' ? '①②③④⑤⑥⑦⑧⑨'[number - 1] : number, 'step-no');
  if (shape) stamp(parent, shape, x + 10, y);
  else text(parent, x + 10, y + 6, '·', 'step-no');
}

function filled(paperValues, cards) {
  const result = [...paperValues];
  for (const shape of cards) result[result.indexOf(null)] = shape;
  return result;
}

function singleRow(from, shape, result, y, number = 1, highlight = [], hidden = false) {
  paper(drawing, from, 101, y, true);
  paper(drawing, result, 519, y, true, highlight);
  command(drawing, shape, 310, y, number);
  text(drawing, 310, y - 31, placeRule);
  flow(drawing, `M 166 ${y} H 273`);
  if (hidden) text(drawing, 401, y + 6, '?', 'heading');
  else flow(drawing, `M 347 ${y} H 454`);
}

function sequenceRow(cards, y, applied, changed = false, wholeRow = false) {
  const [first, second] = cards;
  paper(drawing, empty, 64, y, false, wholeRow ? [0, 1, 2] : []);
  command(drawing, first, 184, y, 1, changed);
  paper(drawing, applied ? filled(empty, [first]) : empty, 309, y, false, changed ? [0, 1, 2] : []);
  command(drawing, second, 433, y, 2, changed);
  paper(drawing, applied ? filled(empty, cards) : empty, 556, y, false, changed ? [0, 1, 2] : []);
  if (first) flow(drawing, `M 122 ${y} H 152`);
  if (!applied) return;
  flow(drawing, `M 215 ${y} H 250`);
  flow(drawing, `M 367 ${y} H 401`);
  flow(drawing, `M 465 ${y} H 497`);
}

function ambiguousPlacement(hidden, changed) {
  paper(drawing, empty, 101, 85, true);
  command(drawing, star, 310, 85, 1);
  text(drawing, 310, 55, '별 찍기');
  text(drawing, 426, 93, '?', 'heading');
  flow(drawing, 'M 166 85 H 272');
  if (!hidden) {
    text(drawing, 519, 22, '가능한 결과의 예');
    for (const [position, y] of [[0, 53], [2, 117]]) {
      const result = [...empty];
      result[position] = star;
      flow(drawing, `M 347 85 H 395 L 453 ${y}`);
      paper(drawing, result, 519, y, false, changed ? [0, 1, 2] : []);
    }
  }
  svg('line', {x1: 29, y1: 157, x2: 590, y2: 157, class: 'rule'}, drawing);
  singleRow(empty, star, oneStar, 224);
}

function deliveredPattern(cards, applied, target) {
  const result = applied ? filled(empty, cards) : empty;
  text(drawing, 101, 33, '빈 카드');
  text(drawing, 310, 27, '전달한 지시', 'heading');
  text(drawing, 310, 48, placeRule, 'small');
  text(drawing, 519, 33, '동생이 만든 카드');
  paper(drawing, empty, 101, 89);
  for (let i = 0; i < 3; i++) command(drawing, cards[i], 244 + i * 66, 89, i + 1);
  paper(drawing, result, 519, 89);
  if (cards.length) flow(drawing, 'M 164 89 H 208');
  if (applied) flow(drawing, 'M 404 89 H 454');
  text(drawing, 425, 232, '만들 무늬');
  paper(drawing, target, 519, 226);
  if (!applied) return;
  const matches = result.map((shape, i) => shape === target[i]);
  matches.forEach((match, i) => {
    const x = 519 + (i - 1) * 37;
    svg('line', {x1: x, y1: 114, x2: x, y2: 201, class: 'match-lines'}, drawing);
    rect(drawing, x - 12, 145, 24, 24, match ? 'match-chip' : 'miss-chip', 12);
    text(drawing, x, 163, match ? '✓' : '×', 'step-no');
  });
  text(drawing, 310, 168, matches.every(Boolean) ? '같은 무늬' : '다른 자리가 있어요', 'heading');
}

function practiceDescription() {
  const {cards, applied} = state;
  if (!applied) {
    return [
      '목표는 별, 원, 원입니다. 빈 카드에서 시작하며 아직 고른 지시가 없습니다.',
      '첫 번째 지시 카드를 골랐습니다. 나머지 두 장을 골라 보세요.',
      '두 장을 골랐습니다. 마지막 지시 카드를 골라 보세요.',
      '세 장을 골랐습니다. 전달하고 실행하면 동생의 결과를 볼 수 있습니다.'
    ][cards.length];
  }
  const differs = cards.flatMap((shape, i) => shape === practiceTarget[i] ? [] : [i + 1]);
  if (!differs.length) return '세 자리의 도장이 모두 같습니다.';
  return `목표와 다른 칸은 ${differs.join(', ')}번입니다. 카드를 비우고 다시 골라 보세요.`;
}

function describeDelivery() {
  const description = byId('scene-desc');
  description.textContent = practiceDescription();
  if (!state.cards.length) return;
  description.append(' ', document.createTextNode('고른 지시'), ' ');
  state.cards.forEach((shape, index) => {
    if (index) description.append(' · ');
    description.append(document.createTextNode(shape === star ? '별' : '원'));
  });
}

function drawFigure(index, {hide, changed}) {
  const hidden = hide.includes('result');
  if (index === 0) {
    singleRow(empty, star, oneStar, 141);
  } else if (index === 1) {
    singleRow(empty, star, oneStar, 83);
    svg('line', {x1: 29, y1: 140, x2: 590, y2: 140, class: 'rule'}, drawing);
    singleRow(oneStar, circle, hidden ? oneStar : filled(oneStar, [circle]), 204, 2,
      changed.includes('next-circle') ? [1] : [], hidden);
  } else if (index === 2) {
    text(drawing, 310, 33, placeRule, 'heading');
    sequenceRow(starCircle, 96, true);
    svg('line', {x1: 29, y1: 146, x2: 590, y2: 146, class: 'rule'}, drawing);
    sequenceRow(circleStar, 196, !hidden, changed.includes('reordered-cards'));
  } else if (index === 3) {
    ambiguousPlacement(hidden, changed.includes('possible-results'));
  } else if (index === 4) {
    text(drawing, 310, 28, '알고리즘', 'heading');
    text(drawing, 310, 50, placeRule);
    text(drawing, 64, 81, '나');
    text(drawing, 64, 184, '동생');
    sequenceRow(circleStar, 107, true);
    svg('line', {x1: 29, y1: 151, x2: 590, y2: 151, class: 'rule'}, drawing);
    const siblingChanged = changed.includes('sibling-row');
    sequenceRow(circleStar, 210, true, siblingChanged, siblingChanged);
  } else {
    deliveredPattern(pictureTarget, true, pictureTarget);
  }
}

function updatePractice(announce) {
  const {cards, applied} = state;
  for (const button of byId('choices').children) button.disabled = cards.length === 3;
  byId('run-stamps').disabled = cards.length !== 3 || applied;
  byId('clear-stamps').disabled = !cards.length;
  // The visible status line shows only the card's result sentences; picking progress goes to the scene description.
  byId('stamp-status').textContent = announce && applied ? practiceDescription() : '';
  drawing.replaceChildren();
  deliveredPattern(cards, applied, practiceTarget);
  describeDelivery();
}

const lessonHooks = {
  onStep() {
    state.cards = [];
    state.applied = false;
  },
  onPractice(open) {
    if (open) updatePractice(false);
    else {
      drawing.replaceChildren();
      deliveredPattern(pictureTarget, true, pictureTarget);
      byId('scene-desc').textContent = lesson.steps[5].description;
    }
  }
};

byId('stamp-prompt').textContent = "목표 무늬를 보고 동생에게 보낼 지시 카드 세 장을 순서대로 고르세요. 모두 고른 뒤 전달하고 결과를 확인하세요.";
for (const [shape, name] of [[star, '별 카드 추가'], [circle, '원 카드 추가']]) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'action';
  button.textContent = name;
  button.addEventListener('click', () => {
    state.cards.push(shape);
    updatePractice(true);
  });
  byId('choices').append(button);
}
byId('run-actions').hidden = false;
byId('run-stamps').onclick = () => {
  state.applied = true;
  updatePractice(true);
};
byId('clear-stamps').onclick = () => {
  state.cards = [];
  state.applied = false;
  updatePractice(true);
};

byId('zoom-in').onclick = () => zoomBy(.3);
byId('zoom-out').onclick = () => zoomBy(-.3);
enableCameraDrag();

viewport.addEventListener('keydown', event => {
  if (camera.zoom === 1) return;
  const direction = {ArrowLeft: [-1, 0], ArrowUp: [0, -1], ArrowRight: [1, 0], ArrowDown: [0, 1]}[event.key];
  if (!direction) return;
  event.preventDefault();
  setCamera(camera.x + direction[0] * 18, camera.y + direction[1] * 18, camera.zoom);
});

window.addEventListener('keydown', event => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  const zoom = {'+': () => zoomBy(.3), '-': () => zoomBy(-.3), '0': resetView}[event.key];
  if (zoom) {
    event.preventDefault();
    zoom();
  }
});
setCamera(0, 0, 1);
</script>
</body>
