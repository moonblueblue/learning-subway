<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="어느 단계에서 위치 또는 지침이 처음 틀렸을까요?">
<title>불량 검사와 지침 검색 · 졸업 과제</title>
<link rel="stylesheet" href="../shared/reading-lesson.css">
<link rel="stylesheet" href="./defect-inspection-retrieval/workbench.css">
<link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../shared/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../shared/apple-touch-icon.png">
<link rel="stylesheet" href="../shared/course.css">
<script src="../shared/engine.js"></script>
<script defer blocking="render" src="../shared/catalog.js"></script>
<script defer blocking="render" src="./defect-inspection-retrieval.en.js"></script>
<script defer blocking="render" src="../shared/i18n.js"></script>
<script defer blocking="render" src="../shared/course.js?v=f434a855a63bd8ea"></script>
</head>
<body>
<main class="shell">
  <header><p class="eyebrow">비전·멀티모달 인식 · 졸업 과제</p><h1>불량 검사와 지침 검색</h1><p>어느 단계에서 위치 또는 지침이 처음 틀렸을까요?</p></header>
  <div class="workspace">
    <div>
      <section class="panel" aria-labelledby="stage-heading">
        <div class="stage-top"><h2 id="stage-heading">검사 비교</h2></div>
        <div class="stage"><svg id="scene" viewBox="0 0 620 280" role="img" aria-labelledby="scene-title scene-desc"><title id="scene-title">불량 검사와 지침 검색</title><desc id="scene-desc"></desc></svg></div>
        <div class="controls"><div class="actions" id="inspection-actions">
          <button type="button" id="open-results" class="action primary">검사 결과</button>
          <button type="button" id="edit-data" class="action">입력 편집</button>
        </div></div>
        <nav class="timeline" aria-labelledby="timeline-heading">
          <div class="timeline-top"><h2 id="timeline-heading">타임라인</h2><span id="count"></span></div>
          <ol class="steps" id="steps"></ol>
        </nav>
      </section>
      <div class="hands-on">
        <p class="try"><strong>다른 입력으로 확인</strong></p>
        <div class="actions inspection-practice-actions">
          <button type="button" id="practice-open-results" class="action primary">검사 결과</button>
          <button type="button" id="practice-edit-data" class="action">입력 편집</button>
        </div>
        <p id="prompt" class="try"></p>
        <p id="feedback" class="readout" role="status"></p>
        <div id="choices"></div>
      </div>
    </div>
    <section class="panel explanation" aria-labelledby="step-title">
      <h2 id="step-title"></h2><p id="body"></p>
      <div class="takeaway"><strong>관찰 포인트</strong><p id="takeaway"></p></div>
      <nav class="navigation" aria-label="이전 및 다음 단계"><button class="action" id="prev" type="button">이전 단계</button><button class="action primary" id="next" type="button">다음 단계</button></nav>
    </section>
  </div>
  <div class="sr-only" id="announcement" role="status"></div>
</main>
<dialog id="inspection-workbench" class="inspection-workbench" aria-labelledby="inspection-heading">
  <header>
    <h2 id="inspection-heading">검사 결과</h2>
    <form method="dialog"><button class="action">닫기</button></form>
  </header>
  <section data-panel="results">
    <p id="reference-status" class="status" role="status"></p>
    <div class="inspection-fields">
      <label>사례<select id="case-select"></select></label>
      <label>보기<select id="view-select">
        <option value="overlay">영역 겹치기</option>
        <option value="rankings">지침 순위</option>
        <option value="conditions">촬영 조건</option>
        <option value="lighting">조명 쌍</option>
        <option value="summary">오류 합계</option>
      </select></label>
    </div>
    <div data-result="overlay" class="inspection-result">
      <p id="overlap-status" class="status"></p>
      <div class="inspection-picture">
        <svg id="inspection-image" role="img"></svg>
        <div>
          <label>상자<select id="overlay-mode">
            <option value="both">둘 다</option><option value="truth">정답만</option><option value="prediction">예측만</option>
          </select></label>
          <div class="inspection-key"><span>정답 G</span><span>예측 P</span></div>
        </div>
      </div>
    </div>
    <div data-result="rankings" class="inspection-result" hidden>
      <p id="expected-manual"></p><p id="top-manuals"></p>
      <div class="inspection-fields">
        <label>검색 영역<select id="search-mode"><option value="predicted">예측 P</option><option value="oracle">정답 G</option></select></label>
        <label>순위<select id="rank-select"></select></label>
      </div>
      <p id="manual-detail"></p><p id="manual-distance"></p>
    </div>
    <div data-result="conditions" class="inspection-result" hidden>
      <p><strong id="capture-role"></strong> · <code id="capture-metadata"></code></p>
      <p id="condition-status" class="status"></p>
      <p id="split-cameras"></p><p id="split-time"></p>
    </div>
    <div data-result="lighting" class="inspection-result" hidden>
      <label>비교 쌍<select id="pair-select"></select></label>
      <p id="pair-status" class="status"></p>
      <div id="pair-paths">
        <p id="pair-a"></p><p id="pair-b"></p><p id="pair-capture"></p>
      </div>
    </div>
    <div data-result="summary" class="inspection-result" hidden>
      <p id="summary-cases"></p><p id="summary-detection"></p>
      <p id="summary-localization"></p><p id="summary-retrieval"></p>
    </div>
    <div class="actions">
      <button type="button" id="edit-from-results" class="action">입력 편집</button>
      <button type="button" id="open-downloads" class="action">파일 받기</button>
    </div>
  </section>
  <section data-panel="edit" hidden>
    <form id="edit-form" novalidate>
      <div class="inspection-fields">
        <label>편집 항목<select id="edit-mode">
          <option value="gain">조명 이득</option><option value="pixel">픽셀</option>
          <option value="settings">검출 설정</option><option value="import">JSON 가져오기</option>
        </select></label>
        <label id="edit-case-field">사례<select id="edit-case-select"></select></label>
      </div>
      <div data-edit="gain">
        <label>이득 (0.10–1.50)<input id="light-gain" type="number" inputmode="decimal" min=".10" max="1.50" step="any" required></label>
      </div>
      <div data-edit="pixel" class="inspection-fields three" hidden>
        <label>x<input id="pixel-x" type="number" inputmode="numeric" min="0" step="1" required></label>
        <label>y<input id="pixel-y" type="number" inputmode="numeric" min="0" step="1" required></label>
        <label>픽셀값<input id="pixel-value" type="number" inputmode="numeric" min="0" max="255" step="1" required></label>
      </div>
      <div data-edit="settings" class="inspection-fields three" hidden>
        <label>대비 문턱<input id="condition-contrast" type="number" inputmode="numeric" min="1" max="255" step="1" required></label>
        <label>최소 픽셀<input id="condition-min-cells" type="number" inputmode="numeric" min="1" max="1024" step="1" required></label>
        <label>IoU 문턱<input id="condition-iou" type="number" inputmode="decimal" min=".01" max="1" step="any" required></label>
      </div>
      <div data-edit="import" hidden>
        <label>입력 JSON · 최대 512 KiB<input id="input-json" type="file" accept=".json,application/json" required></label>
      </div>
      <p id="input-status" role="status"></p>
      <div class="actions">
        <button type="submit" class="action primary" id="run-input">실행</button>
        <button type="button" class="action" id="reset-data">기본값 복원</button>
        <button type="button" class="action" id="results-from-edit">결과 보기</button>
      </div>
    </form>
  </section>
  <section data-panel="downloads" hidden>
    <p>현재 실행의 입력과 보고서를 저장합니다.</p>
    <p><code>node defect-inspection.js inspection-input.json inspection-report.json</code></p>
    <div class="actions">
      <button type="button" class="action" id="download-data">입력 JSON</button>
      <button type="button" class="action" id="download-runner">실행기 JS</button>
      <button type="button" class="action" id="download-report">보고서 JSON</button>
      <button type="button" class="action" id="results-from-downloads">결과 보기</button>
    </div>
  </section>
</dialog>
