<body>
<main class="shell">
  <header>
    <p class="eyebrow">3장 컴퓨터를 바닥부터 · 레슨 3.2</p>
    <h1>덧셈기</h1>
    <p class="lead">게이트를 엮으면 어떻게 1 + 1을 계산할까요? 스위치로 두 수를 넣고 합과 올림이 램프에 켜지는 모습을 보세요.</p>
  </header>
  <div class="workspace">
    <div>
      <section class="panel" aria-labelledby="stage-heading">
        <div class="stage-top"><h2 id="stage-heading">스위치, 덧셈 회로, 램프</h2></div>
        <div class="stage">
          <svg id="scene" viewBox="0 0 620 280" role="img" tabindex="0" aria-labelledby="scene-title scene-desc">
            <title id="scene-title">두 수의 비트가 덧셈 회로를 지나 합과 올림 램프로 가는 장면</title><desc id="scene-desc"></desc>
            <defs>
              <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
              <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
              <radialGradient id="grid-fade"><stop offset=".45" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
              <mask id="grid-mask"><rect x="-460" y="-260" width="920" height="520" fill="url(#grid-fade)"/></mask>
            </defs>
            <g id="world" aria-hidden="true">
              <path id="grid" class="iso-grid" mask="url(#grid-mask)"></path>
              <g id="casings"></g><g id="links"></g><g id="nodes"></g><g id="badges"></g><g id="packets"></g>
            </g>
          </svg>
        </div>
        <div class="hands-on">
          <div class="try" id="try">
            <p><strong>해 보기</strong><span id="try-text"></span></p>
            <p class="try-result" id="try-result" role="status"></p>
            <button class="action" id="try-next" type="button" hidden>다음 문제</button>
          </div>
          <p class="readout" id="readout"></p>
          <div class="controls-row">
            <div class="input-row" id="input-buttons" role="group" aria-label="입력 스위치 켜고 끄기"></div>

          <output class="view-scale" id="view-scale" aria-label="현재 배율" aria-live="off">100%</output>

        </div>

<script>
// Each step is a small circuit. Nodes are listed in signal order (inputs first, lamps last).
// `u` runs left to right on screen and `v` top to bottom; on the floor that is x = (u + v) / 2, y = (u - v) / 2.
// `in` names the nodes feeding a gate. An adder block (HA, FA) has two outputs, written `id.s` (sum) and
// `id.c` (carry). `mids` is the u where each incoming wire turns, so wires in the same column do not overlap.
// Steps with `outs` show a truth table of those lamps; steps with `bits` treat the switches as two
// binary numbers A and B and show column addition instead. `demo` lists what the autoplay sets:
// switch values in input order, or [A, B] as numbers when the step has `bits`.
const num = (v, name, bits) => Array.from({ length: bits }, (_, k) => v[name + k] << k).reduce((a, b) => a + b, 0);
const lesson = [
  {
    label: '반가산기',
    example: ["1 + 1", "XOR = 0 · AND = 1", "합 0 · 올림 1"],
    title: '한 자리 덧셈은 게이트 두 개면 된다',
    body: '이진수 한 자리끼리 더하면 0 + 0 = 0, 0 + 1 = 1, 1 + 1 = 10입니다. 결과는 두 자리라서 이 자리에 남는 합(S)과 윗자리로 넘기는 올림(C)으로 나눕니다. 합은 두 입력이 다를 때 1이므로 3.1에서 만든 XOR, 올림은 둘 다 1일 때만 1이므로 AND입니다. 이 회로를 반가산기라고 합니다.',
    takeaway: '1 + 1이면 XOR는 0, AND는 1을 내보내 올림 램프만 켜집니다. 램프 두 개를 올림, 합 순서로 읽으면 10, 곧 2입니다. 진리표의 올림 열은 AND, 합 열은 XOR의 진리표와 같습니다.',
    description: '스위치 A와 B가 위쪽 XOR와 아래쪽 AND로 갈라져 들어갑니다. XOR는 합 램프, AND는 올림 램프로 이어집니다.',
    nodes: [
      { id: 'A', type: 'IN', u: 0, v: -5 },
      { id: 'B', type: 'IN', u: 0, v: 5 },
      { id: 'x', type: 'XOR', in: ['A', 'B'], u: 9, v: -5, mids: [3.4, 5.6] },
      { id: 'a', type: 'AND', in: ['A', 'B'], u: 9, v: 5, mids: [4.5, 3.4] },
      { id: 'S', type: 'LAMP', in: ['x'], u: 16, v: -5, label: '합 S' },
      { id: 'C', type: 'LAMP', in: ['a'], u: 16, v: 5, label: '올림 C' },
    ],
    outs: [['C', '올림 C'], ['S', '합 S']],
    demo: [[0, 1], [1, 1], [1, 0], [0, 0]],
    staticInitial: [1, 1],

// A press that starts on a switch and ends without moving toggles that switch.
// Tracked separately from the camera pointers so it also works when the pointer is captured.
let tap = null;
viewport.addEventListener('pointerdown', (event) => {
  const target = event.target.closest?.('[data-input]');
  tap = target && event.button === 0 && pointers.size === 0
    ? { input: target.dataset.input, x: event.clientX, y: event.clientY, id: event.pointerId }
    : null;
});
viewport.addEventListener('pointerup', (event) => {
  if (tap && tap.id === event.pointerId && Math.hypot(event.clientX - tap.x, event.clientY - tap.y) < 8) {
    toggleInput(tap.input);
  }
  tap = null;
});
viewport.addEventListener('pointercancel', () => { tap = null; });

viewport.addEventListener('pointerdown', (event) => {
  if (event.button !== 0 || pointers.size >= 2) return;
  if (event.pointerType !== 'touch' && camera.zoom === 1) return;
  pointers.set(event.pointerId, viewportPoint(event));
  viewport.setPointerCapture(event.pointerId);
});
viewport.addEventListener('pointermove', (event) => {
  if (!pointers.has(event.pointerId)) return;
  const before = pointerGeometry();
  pointers.set(event.pointerId, viewportPoint(event));
  const after = pointerGeometry();
  const pinch = pointers.size === 2;
  if (pinch && (before.distance < 1 || after.distance < 1)) return;
  const zoom = pinch ? camera.zoom * after.distance / before.distance : camera.zoom;
  zoomBetween(zoom, before.point, after.point);
  viewport.classList.toggle('is-dragging', !pinch && camera.zoom > 1);
});
for (const eventName of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  viewport.addEventListener(eventName, (event) => {

function boxFaces(h, H) {
  return {
    left: [[-h, -h, 0], [h, -h, 0], [h, -h, H], [-h, -h, H]],
    right: [[h, -h, 0], [h, h, 0], [h, h, H], [h, -h, H]],

  }
  const highlight = svg('path', { class: 'highlight', d: `M${point(-h, -h, H)}L${point(h, -h, H)}L${point(h, h, H)}` }, node);

}

function createNode(spec) {
  const [h, H] = size[spec.type];
  const kind = spec.type === 'IN' ? 'switch' : spec.type === 'LAMP' ? 'lamp' : 'gate ' + spec.type;
  const node = svg('g', { class: 'node ' + kind, transform: `translate(${flat(spec.u, spec.v).join(' ')})` }, byId('nodes'));
  const view = { spec, node, height: H, heightFrom: H, heightTo: H };
  drawShadow(node, h);
  if (spec.type === 'IN') {

    const spill = [[-h, -h], [h, -h], [h, h], [-h, h]].map(([x, y]) => point(x * 1.9, y * 1.9, 0)).join(' ');
    svg('polygon', { class: 'glow', points: spill, filter: 'url(#soft-glow)' }, node);
    view.faces = {};
    for (const name of ['left', 'right', 'top']) view.faces[name] = svg('polygon', { class: 'face ' + name }, node);
    view.highlight = svg('path', { class: 'highlight' }, node);

function createWire(from, to, port, mid) {
  const src = views.get(nodeOf(from)).spec, dst = views.get(to).spec;
  const ports = [[0], [-.9, .9], [-1.1, 0, 1.1]][dst.in.length - 1];
  const pv = dst.v + ports[port];
  const sv = src.v + outOffset(from);
  const turn = mid ?? (src.u + dst.u) / 2;
  const route = [[src.u, sv], [turn, sv], [turn, pv], [dst.u, pv]].map(([u, v]) => flat(u, v, laneHeight));
  const d = 'M' + route.map((p) => p.join(' ')).join('L');
  const casing = svg('path', { class: 'casing', d }, byId('casings'));
  const group = svg('g', {}, byId('links'));
  const line = svg('path', { class: 'wire idle', d }, group);
  // Chevron on the last straight part, pointing into the gate.
  const [p, q] = route.slice(-2);
  const at = [mix(p[0], q[0], .35), mix(p[1], q[1], .35)];
  const chevron = svg('path', { class: 'chevron idle', d: 'M-4.5 -5L2.5 0L-4.5 5', transform: `translate(${at.join(' ')})` }, group);
  const startLen = 14 * 2 * size[src.type][0] * .8;
  const endLen = 14 * (2 * size[dst.type][0] - Math.abs(ports[port])) * .9;
  return { from, to, port, line, casing, chevron, startLen, endLen };
}

function evaluate(inputs) {
  const values = {};
  for (const spec of lesson[state.index].nodes) {
    const [a, b, c] = (spec.in ?? []).map((ref) => values[ref]);
    if (spec.type === 'HA') { values[spec.id + '.s'] = a ^ b; values[spec.id + '.c'] = a & b; continue; }
    if (spec.type === 'FA') { values[spec.id + '.s'] = a ^ b ^ c; values[spec.id + '.c'] = a & b | c & (a ^ b); continue; }
    values[spec.id] = spec.type === 'IN' ? inputs[spec.id]
      : spec.type === 'NOT' ? 1 - a : spec.type === 'AND' ? a & b : spec.type === 'OR' ? a | b
      : spec.type === 'XOR' ? a ^ b : a;
  }
  return values;
}

// How many wires a signal crosses from the switches to each node.
function depths() {
  const depth = {};
  for (const spec of lesson[state.index].nodes) {
    depth[spec.id] = spec.in ? 1 + Math.max(...spec.in.map((ref) => depth[nodeOf(ref)])) : 0;
  }
  return depth;
}

function buildScene() {
  for (const id of ['casings', 'links', 'nodes', 'badges', 'packets']) byId(id).replaceChildren();
  plates = [];
  packets = [];
  events = [];
  views = new Map();
  const step = lesson[state.index];
  // Painter's order: nodes higher on screen first.
  const ordered = [...step.nodes].sort((a, b) => a.v - b.v || a.u - b.u);
  for (const spec of ordered) views.set(spec.id, createNode(spec));
  wires = [];
  for (const spec of step.nodes) {
    (spec.in ?? []).forEach((from, port) => wires.push(createWire(from, spec.id, port, spec.mids?.[port])));
  }
  fitWorld(step.nodes);
}

// Scale and centre the circuit in the 620 x 280 viewport.
function fitWorld(nodes) {
  const xs = nodes.map((n) => 14 * n.u), ys = nodes.map((n) => 7 * n.v);
  const left = Math.min(...xs) - 70, right = Math.max(...xs) + 90;
  const top = Math.min(...ys) - 50, bottom = Math.max(...ys) + 22;
  const scale = Math.min(1.9, 580 / (right - left), 262 / (bottom - top));
  const x = 310 - scale * (left + right) / 2, y = 142 - scale * (top + bottom) / 2;
  byId('world').setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${scale.toFixed(3)})`);
}

// Show one node's value: light it, light its outgoing wires, and send a "1" down each of them.
function showNode(id, send) {
  const view = views.get(id);
  for (const ref of [id, id + '.s', id + '.c']) if (ref in state.values) state.shown[ref] = state.values[ref];
  if (!view) return;
  const on = state.values[id] === 1;
  view.node.classList.toggle('on', on);
  if (view.digit) {
    view.digit.textContent = String(state.values[id]);
    view.heightFrom = view.height;
    view.heightTo = on ? switchHigh : size.IN[1];
    view.anim = motion.matches ? null : { start: performance.now(), ms: 300 };
    if (!view.anim) { view.height = view.heightTo; shapeSwitch(view, view.height); }
  }
  if (view.badge) {
    view.badge.classList.toggle('on', on);
    view.badgeText.textContent = String(state.values[id]);
  }
  for (const wire of wires) {
    if (nodeOf(wire.from) !== id) continue;
    const on = state.values[wire.from] === 1;
    for (const part of [wire.line, wire.chevron]) {
      part.classList.toggle('signal', on);
      part.classList.toggle('idle', !on);
    }
    if (on && send) sendPacket(wire);
  }
  kick();
}

function sendPacket(wire) {
  if (motion.matches) return;
  const group = svg('g', {}, byId('packets'));
  svg('circle', { class: 'packet-halo', r: 8.5 }, group);
  svg('circle', { class: 'packet', r: 4.4 }, group);
  svg('text', { class: 'packet-label', y: -9.5 }, group).textContent = '1';
  packets.push({ group, wire, start: performance.now(), duration: gateDelay });
  kick();
}

function movePackets(now) {
  packets = packets.filter((packet) => {
    const t = (now - packet.start) / packet.duration;
    const { line, startLen, endLen, from } = packet.wire;
    // A packet disappears on arrival, and when its source turns back to 0 mid-flight.
    if (t >= 1 || !line.isConnected || state.shown[from] !== 1) { packet.group.remove(); return false; }
    const total = line.getTotalLength();
    const at = line.getPointAtLength(mix(Math.min(startLen, total), Math.max(total - endLen, 0), Math.max(t, 0)));
    packet.group.setAttribute('transform', `translate(${at.x} ${at.y})`);
    return true;
  });
}

// Set the switches. Every node then shows its new value once the signal has had time to reach it,
// one wire (gateDelay) per gate. With reduced motion everything updates at once.
function setInputs(next, { send = true } = {}) {
  state.inputs = { ...next };
  state.values = evaluate(state.inputs);
  events = [];
  const depth = depths();
  const now = performance.now();
  for (const spec of lesson[state.index].nodes) {
    if (motion.matches || depth[spec.id] === 0) showNode(spec.id, send);
    else events.push({ at: now + depth[spec.id] * gateDelay, id: spec.id, send });
  }
  syncControls();
  kick();
}

function demoTick() {
  const step = lesson[state.index];
  setInputs(comboInputs(step.demo[state.demoPosition]));
  state.demoPosition = (state.demoPosition + 1) % step.demo.length;
  state.wait = 1500 + Math.max(...Object.values(depths())) * gateDelay;
}

// A demo entry is switch values in input order, or [A, B] as numbers in steps with `bits`.
function comboInputs(combo) {
  const step = lesson[state.index];
  if (!step.bits) return Object.fromEntries(inputIds().map((id, k) => [id, combo[k]]));
  return Object.fromEntries(inputIds().map((id) => [id, combo[id[0] === 'A' ? 0 : 1] >> Number(id.slice(1)) & 1]));
}

const inputIds = () => lesson[state.index].nodes.filter((n) => n.type === 'IN').map((n) => n.id);

function tick(now) {
  frame = null;
  const elapsed = lastFrame === null ? 0 : Math.min(now - lastFrame, 80);
  lastFrame = now;
  if (state.playing) {
    state.wait -= elapsed;
    if (state.wait <= 0) demoTick();
  }
  const due = events.filter((event) => event.at <= now);
  events = events.filter((event) => event.at > now);
  for (const event of due) showNode(event.id, event.send);
  let animating = false;
  for (const view of views.values()) {
    if (!view.anim) continue;
    const t = clamp((now - view.anim.start) / view.anim.ms, 0, 1);
    const ease = t * t * (3 - 2 * t);
    view.height = mix(view.heightFrom, view.heightTo, ease);
    shapeSwitch(view, view.height);
    if (t === 1) view.anim = null; else animating = true;
  }
  movePackets(now);
  if (!(state.playing || events.length || packets.length || animating)) lastFrame = null;
  else if (frame === null) frame = requestAnimationFrame(tick);
}

function kick() {
  if (frame === null && (state.playing || events.length || packets.length || [...views.values()].some((v) => v.anim))) {
    frame = requestAnimationFrame(tick);
  }
}

function syncPlayback() {
  const reduced = motion.matches;
  if (reduced) {
    state.playing = false;
    for (const packet of packets) packet.group.remove();
    packets = [];
  }
  kick();
}

// The HTML input buttons mirror the scene's switches and are the keyboard and screen reader controls.
// Steps with `bits` group them into two numbers, A and B, highest place first.
let inputButtons = [];
const placeName = (id) => `${2 ** Number(id.slice(1))}의 자리`;
function makeButton(id, text) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'input-button';
  const name = document.createElement('span');
  name.className = 'name';
  name.textContent = text;
  const digit = document.createElement('span');
  digit.className = 'bit';
  button.append(name, digit);
  button.addEventListener('click', () => toggleInput(id));
  inputButtons.push({ id, button, digit });
  return button;
}
function buildButtons() {
  const step = lesson[state.index];
  const box = byId('input-buttons');
  box.replaceChildren();
  box.classList.toggle('numbers', Boolean(step.bits));
  inputButtons = [];
  if (!step.bits) {
    for (const spec of step.nodes.filter((n) => n.type === 'IN')) box.append(makeButton(spec.id, '스위치 ' + (spec.label ?? spec.id)));
    return;
  }
  for (const name of ['A', 'B']) {
    const row = document.createElement('div');
    row.className = 'number-row';
    row.append(Object.assign(document.createElement('span'), { className: 'number-name', textContent: name }));
    for (let k = step.bits - 1; k >= 0; k--) row.append(makeButton(name + k, name + k));
    row.append(Object.assign(document.createElement('output'), { className: 'number-value', id: 'value-' + name }));
    box.append(row);
  }
}

// Truth table (steps with `outs`): every combination of the inputs, the current one highlighted,
// and a check on the rows the learner has made with their own hands.
// Steps with `bits` show column addition instead: carries, A, B and the sum, one column per place.
const rowIndex = (inputs) => inputIds().reduce((index, id) => index * 2 + inputs[id], 0);
const cell = (tag, text, className = '') => Object.assign(document.createElement(tag), { textContent: text, className });
function buildTable() {
  const step = lesson[state.index];
  const table = byId('truth');
  table.replaceChildren();
  table.className = step.bits ? 'truth column-sum' : 'truth';
  if (step.bits) {
    const caption = cell('caption', '세로셈 · 위에 작게 쓴 수는 받아올림');
    table.append(caption);
    for (const name of ['carry', 'A', 'B', 'sum']) {
      const tr = document.createElement('tr');
      tr.className = name;
      tr.append(cell('th', { carry: '올림', A: 'A', B: '+ B', sum: '합' }[name]));
      for (let k = step.bits; k >= 0; k--) tr.append(cell('td', ''));
      tr.append(cell('td', '', 'decimal'));
      table.append(tr);
    }
    return;
  }
  const ids = inputIds();
  const names = Object.fromEntries(step.nodes.map((n) => [n.id, n.label ?? n.id]));
  table.append(cell('caption', '진리표 · 직접 만든 줄에 ✓'));
  const head = document.createElement('tr');
  for (const id of ids) head.append(Object.assign(cell('th', names[id]), { scope: 'col' }));
  step.outs.forEach(([, label], k) => head.append(Object.assign(cell('th', label, k === 0 ? 'out' : ''), { scope: 'col' })));
  head.append(cell('td', '', 'seen'));
  table.append(head);
  for (let row = 0; row < 2 ** ids.length; row++) {
    const inputs = Object.fromEntries(ids.map((id, k) => [id, row >> (ids.length - 1 - k) & 1]));
    const values = evaluate(inputs);
    const tr = document.createElement('tr');
    for (const id of ids) tr.append(cell('td', inputs[id]));
    step.outs.forEach(([id], k) => tr.append(cell('td', values[id], (k === 0 ? 'out' : '') + (values[id] ? ' one' : ''))));
    tr.append(cell('td', '', 'seen'));
    table.append(tr);
  }
}

function syncColumnSum(step) {
  const n = step.bits;
  const a = num(state.values, 'A', n), b = num(state.values, 'B', n);
  const rows = [...byId('truth').querySelectorAll('tr')];
  const digits = { A: a, B: b, sum: a + b };
  rows.forEach((tr) => {
    const tds = [...tr.querySelectorAll('td')];
    for (let k = n; k >= 0; k--) {
      const td = tds[n - k];
      if (tr.className === 'carry') {
        // The carry into place k comes from adding the places below it.
        const carry = k > 0 && ((a & (2 ** k - 1)) + (b & (2 ** k - 1))) >= 2 ** k;
        td.textContent = carry ? '1' : '';
      } else {
        td.textContent = k === n && tr.className !== 'sum' ? '' : String(digits[tr.className] >> k & 1);
        td.classList.toggle('one', tr.className === 'sum' && (digits.sum >> k & 1) === 1);
      }
    }
    if (tr.className !== 'carry') tds[n + 1].textContent = '= ' + digits[tr.className];
  });
  byId('value-A').textContent = '= ' + a;
  byId('value-B').textContent = '= ' + b;
}

function syncControls() {
  const step = lesson[state.index];
  for (const { id, button, digit } of inputButtons) {
    const on = state.inputs[id] === 1;
    button.setAttribute('aria-pressed', String(on));
    button.setAttribute('aria-label', `${step.bits ? `${id[0]}의 ${placeName(id)}` : '스위치 ' + id}, ${on ? '켜짐 1' : '꺼짐 0'}`);
    digit.textContent = on ? '1' : '0';
  }
  if (step.bits) syncColumnSum(step);
  else {
    const current = rowIndex(state.inputs);
    [...byId('truth').querySelectorAll('tr')].slice(1).forEach((tr, row) => {
      tr.classList.toggle('current', row === current);
      tr.lastChild.textContent = state.seen.has(row) ? '✓' : '';
    });
  }
  const [lead, result, tail] = step.expr(state.values);
  const bold = document.createElement('b');
  bold.textContent = result;
  byId('readout').replaceChildren(lead, bold, tail);
}

// Show the current try-it problem, or the result when the learner has just solved one.
function syncTask() {
  const tasks = lesson[state.index].tasks;
  const done = progress[state.index];
  const allDone = done >= tasks.length;
  byId('try').classList.toggle('solved', state.solved !== '');
  byId('try-text').textContent = state.solved !== '' ? tasks[done - 1].text
    : allDone ? '이 단계의 문제를 모두 풀었습니다. 스위치를 자유롭게 눌러 보세요.' : tasks[done].text;
  byId('try-result').textContent = state.solved === '' ? ''
    : `✓ 맞았습니다. ${state.solved}${allDone ? ' · 이 단계의 문제를 모두 풀었습니다.' : ''}`;
  byId('try-next').hidden = state.solved === '' || allDone;
}

// Only the learner's own changes count, so the demo cannot solve a problem.
function checkTask() {
  const tasks = lesson[state.index].tasks;
  const done = progress[state.index];
  if (state.solved !== '' || done >= tasks.length || !tasks[done].test(state.values, state.seen)) return;
  progress[state.index] = done + 1;
  state.solved = tasks[done].ok;
  syncTask();
}

byId('try-next').onclick = () => {
  state.solved = '';
  syncTask();
  inputButtons[0]?.button.focus();
};

function toggleInput(id) {
  if (!(id in state.inputs)) return;
  state.playing = false;
  state.solved = '';  // a new move dismisses the last result and brings up the next problem
  const next = { ...state.inputs, [id]: 1 - state.inputs[id] };
  state.seen.add(rowIndex(next));
  setInputs(next);
  syncPlayback();
  byId('announcement').textContent = `스위치 ${id} ${next[id] ? '켜짐' : '꺼짐'}. ${byId('readout').textContent}`;
  syncTask();
  checkTask();
}

function startStep() {
  const step = lesson[state.index];
  state.demoPosition = 0;
  state.seen = new Set();
  buildScene();
  buildButtons();
  buildTable();
  // Start from the demo's last combination so the first tick visibly changes something.
  // A still picture (reduced motion) shows `staticInitial` when the step's example needs other inputs than the demo's first.
  const first = motion.matches ? step.staticInitial ?? step.demo[0] : step.demo[step.demo.length - 1];
  setInputs(comboInputs(first), { send: true });
  state.wait = 900;
}

function showStep(index, announce = true) {
  state.index = index;
  state.playing = !motion.matches;
  const step = lesson[index];
  startStep();
  byId('step-title').textContent = step.title;
  byId('body').textContent = step.body;
  byId('takeaway').textContent = step.takeaway;
  byId('scene-desc').textContent = step.description;
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  stepButtons.forEach((button, i) => {
    if (i === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  try { localStorage.setItem(storageKey, String(index)); } catch {}
  state.solved = '';
  syncTask();
  syncPlayback();
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${step.title}`;
}

function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/adder/${index + 1}`);
  showStep(index);
}

function routeIndex() {
  const match = /^#\/adder\/(\d+)$/.exec(location.hash);
  const routed = match ? Number(match[1]) - 1 : -1;
  if (routed >= 0 && routed < lesson.length) return routed;
  try {
    const stored = localStorage.getItem(storageKey);
    const index = Number(stored);
    if (stored !== null && Number.isInteger(index) && index >= 0 && index < lesson.length) return index;
  } catch {}
  return 0;
}

const stepButtons = lesson.map(({ label }, index) => {
  const listItem = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  const number = document.createElement('span');
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.addEventListener('click', () => goToStep(index));
  listItem.append(button);
  byId('steps').append(listItem);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
motion.addEventListener('change', () => {
  if (!motion.matches) state.playing = true;
  syncPlayback();
});
window.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});
const initial = routeIndex();
history.replaceState(null, '', `#/adder/${initial + 1}`);
showStep(initial, false);
</script>
</body>
</html>
