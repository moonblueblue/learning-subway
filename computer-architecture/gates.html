<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="스위치를 켜고 끄며 AND, OR, NOT 게이트가 신호를 어떻게 바꾸는지 진리표와 함께 살펴보세요.">
<title>논리 게이트 · 레슨 3.1</title>
<style>
:root{color-scheme:light;--ink:#142620;--muted:#43574f;--border:#cbd9d0;--paper:#f4f7ef;--panel:#fff;--accent:#12634b;--request:#187959;--response:#5362a0;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.65 system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled,button[aria-disabled=true]{cursor:default;opacity:.5}
:focus-visible{outline:3px solid #a24c14;outline-offset:3px}
.shell{max-width:1280px;margin:auto;padding:clamp(16px,2.5vw,32px)}
header{margin-bottom:20px}
h1,h2,p{margin:0}
.eyebrow{color:var(--accent);font-size:.875rem;font-weight:700;margin-bottom:6px}
h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.12;letter-spacing:-.065em}
header p.lead{color:var(--muted);margin-top:10px}
.workspace{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(360px,1fr);gap:20px;align-items:stretch}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:18px;overflow:hidden}
.stage-top,.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;flex-wrap:wrap}
.stage-top h2,.timeline h2{font-size:1rem}
.status{color:var(--accent);font-size:.875rem;font-weight:700}
.stage{background:#eaf3eb;border-block:1px solid var(--border)}
svg{display:block;width:100%;height:auto;max-height:520px}
#scene{touch-action:pan-y;user-select:none}
#scene:focus-visible{outline-offset:-4px}
#scene.is-zoomed{cursor:grab;touch-action:none}
#scene.is-dragging{cursor:grabbing}
.hands-on{padding:14px 18px;border-bottom:1px solid var(--border);display:grid;gap:12px}
.try{display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:#eef5ed;border-left:3px solid var(--accent);border-radius:0 9px 9px 0;min-height:64px}
.try strong{color:var(--accent);font-size:.875rem;margin-right:6px}
.try-result{color:var(--accent);font-weight:700}
.try-result:empty{display:none}
.try.solved{background:#d2f4dd}
.readout{font-size:1rem;color:var(--muted)}
.readout b{color:var(--ink);font:700 1.1rem var(--mono);letter-spacing:.04em}
.switch-actions{display:flex;gap:8px;align-items:center}
.view-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--border)}
.view-scale{min-width:4ch;text-align:center;color:var(--muted);font:700 .875rem var(--mono)}
.view-hint{color:var(--muted);font-size:.875rem;margin-inline-start:auto}
.touch-hint{display:none}
@media(pointer:coarse){.mouse-hint{display:none}.touch-hint{display:inline}}
.iso-grid{fill:none;stroke:#86ad97;stroke-width:.6;stroke-opacity:.24}
.node .face{stroke-width:.8;stroke-linejoin:round}
.node .shadow{fill:#1f4434;opacity:.16}
.node .highlight{fill:none;stroke:#fff;stroke-opacity:.75;stroke-width:1.1;stroke-linecap:round}
.switch{cursor:pointer}
.switch .face,.switch .glow,.switch .digit,.switch .tag rect,.switch .tag text{transition:fill .18s,stroke .18s,opacity .18s}
.switch .left{fill:#d3dad6;stroke:#8c9d96}
.switch .right{fill:#b9c4be;stroke:#8c9d96}
.switch .top{fill:#eef1ef;stroke:#8c9d96}
.switch.on .left{fill:#a5d6b6;stroke:#4f8f6b}
.switch.on .right{fill:#78b592;stroke:#4f8f6b}
.switch.on .top{fill:#d2f4dd;stroke:#4f8f6b}
.switch .glow{fill:#4fcf87;opacity:0}
.switch.on .glow{opacity:.55}
.switch .digit{font:700 12px var(--mono);text-anchor:middle;dominant-baseline:central;fill:#7c8c85}
.switch.on .digit{fill:#0f5a3c}
.switch.on .tag rect{stroke:var(--accent)}
.switch.on .tag text{fill:var(--accent)}
.casing{fill:none;stroke:#eaf3eb;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.wire{fill:none;stroke-linecap:round;stroke-linejoin:round}
.wire.signal{stroke:var(--request);stroke-width:2.6}
.chevron{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chevron.signal{stroke:var(--request)}
.tag rect{fill:#fff;fill-opacity:.94;stroke:#c9d6ce;stroke-width:.8}
.tag text{font:600 12px system-ui,sans-serif;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.875rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sample{width:22px;border-top:3px solid var(--request)}
.dot{width:13px;height:13px;border-radius:4px;border:1px solid #8c9d96;background:#eef1ef}
.dot.on{border-color:#4f8f6b;background:#bfecce}
.actions,.navigation{display:flex;gap:8px;flex-wrap:wrap}
.action{border:1px solid #9fb7a9;background:white;border-radius:9px;padding:7px 12px;min-height:44px;font-size:.875rem;font-weight:650}
.action:hover:not(:disabled):not([aria-disabled=true]){background:#e8f4eb}
.primary{background:var(--accent);color:white;border-color:var(--accent)}
.primary:hover:not(:disabled){background:#0a4c3a}
.timeline{padding:15px 18px}
.timeline-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.timeline-top span{font:700 .875rem var(--mono);color:var(--muted)}
.steps{list-style:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0;margin:0;gap:8px}
.steps button{height:100%;min-height:52px;text-align:left;width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:#f6f8f5;font-size:.875rem;line-height:1.45;display:flex;gap:7px;align-items:center}
.steps button:hover{border-color:var(--accent)}
.steps button[aria-current=step]{background:#d9efe2;border-color:var(--accent);font-weight:750}
.step-number{font:700 .875rem var(--mono);color:var(--accent)}
.explanation{padding:clamp(20px,2.4vw,32px);display:flex;flex-direction:column;gap:20px}
.explanation h2{font-size:clamp(1.5rem,2.3vw,2.1rem);letter-spacing:-.055em;line-height:1.3}
.explanation p{color:var(--muted);font-size:1.0625rem;line-height:1.75}
.takeaway p{font-size:1rem}
.takeaway{padding:12px 14px;background:#eef5ed;border-left:3px solid var(--accent);border-radius:0 9px 9px 0}
.takeaway strong{display:block;color:var(--accent);font-size:.875rem}
.navigation{justify-content:space-between;margin-top:auto;padding-top:8px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(max-width:980px){.workspace{grid-template-columns:1fr}.navigation{margin-top:0}}
@media(max-width:560px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.wire.idle{stroke:#a9b8b0;stroke-width:2;stroke-dasharray:4 4}
.chevron.idle{stroke:#a9b8b0}
.gate .left{fill:#dfe4f2;stroke:#7d88b4}
.gate .right{fill:#c4cbe3;stroke:#7d88b4}
.gate .top{fill:#f1f3fa;stroke:#7d88b4}
.gate.OR .left{fill:#f3e2d3;stroke:#b48a64}
.gate.OR .right{fill:#e5cdb6;stroke:#b48a64}
.gate.OR .top{fill:#fbf3ec;stroke:#b48a64}
.gate.NOT .left{fill:#eadcf0;stroke:#9a77ad}
.gate.NOT .right{fill:#d9c4e3;stroke:#9a77ad}
.gate.NOT .top{fill:#f7f0fa;stroke:#9a77ad}
.gate .face{transition:fill .18s}
.gate.on .top{fill:#d2f4dd;stroke:#4f8f6b}
.gate .tag text{font:800 12px var(--mono);letter-spacing:.04em}
.gate.AND .tag rect{stroke:#7d88b4}.gate.AND .tag text{fill:#3c4a85}
.gate.OR .tag rect{stroke:#b48a64}.gate.OR .tag text{fill:#7a4b1f}
.gate.NOT .tag rect{stroke:#9a77ad}.gate.NOT .tag text{fill:#5f3a73}
.lamp .left{fill:#d7dfdb;stroke:#8c9d96}
.lamp .right{fill:#b8c6c0;stroke:#8c9d96}
.lamp .top{fill:#f4f7f5;stroke:#8c9d96}
.lamp .bulb{fill:#e6ebe8;stroke:#8c9d96;stroke-width:1;transition:fill .2s,stroke .2s}
.lamp .halo{fill:#ffd34d;opacity:0;transition:opacity .2s}
.lamp.on .bulb{fill:#ffd34d;stroke:#c9940f}
.lamp.on .halo{opacity:.7}
.lamp.on .tag rect{stroke:#c9940f}
.bit-badge circle{fill:#fff;stroke:#a9b8b0;stroke-width:1.1;transition:fill .18s,stroke .18s}
.bit-badge text{font:700 10.5px var(--mono);fill:#7c8c85;text-anchor:middle;dominant-baseline:central}
.bit-badge.on circle{fill:#d2f4dd;stroke:var(--accent)}
.bit-badge.on text{fill:#0f5a3c}
.packet{stroke:white;stroke-width:1.6;fill:var(--request)}
.packet-halo{opacity:.22;fill:var(--request)}
.packet-label{font:700 9.5px var(--mono);fill:#0f5a3c;text-anchor:middle;paint-order:stroke;stroke:#eaf3eb;stroke-width:3px;stroke-linejoin:round}
.controls-row{display:flex;gap:12px 18px;align-items:flex-start;flex-wrap:wrap}
.input-row{display:flex;gap:8px;flex-wrap:wrap}
.input-button{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:64px;min-height:56px;padding:4px 10px;border:1px solid #9fb7a9;border-radius:10px;background:#f6f8f5;line-height:1.2}
.input-button .name{font:700 .8125rem var(--mono);color:var(--muted)}
.input-button .bit{font:700 1.2rem var(--mono);color:#7c8c85}
.input-button:hover{border-color:var(--accent)}
.input-button[aria-pressed=true]{background:#d2f4dd;border-color:var(--accent)}
.input-button[aria-pressed=true] .name,.input-button[aria-pressed=true] .bit{color:#0f5a3c}
.truth{border-collapse:collapse;font:600 .9375rem var(--mono);text-align:center}
.truth caption{font:700 .8125rem system-ui,sans-serif;color:var(--muted);text-align:left;margin-bottom:4px}
.truth th,.truth td{border:1px solid var(--border);padding:3px 12px;min-width:44px}
.truth th{background:#f3f6f2;font-size:.8125rem}
.truth th.out,.truth td.out{border-left:2px solid #9fb7a9}
.truth td.out.one{color:#8a6300;background:#fff7d6}
.truth tr.current td{background:#d9efe2;font-weight:800}
.truth tr.current td.out.one{background:#ffe9a0}
.truth tr.current td.seen{background:none}
.truth td.seen{width:26px;min-width:26px;padding:0 4px;border:none;color:var(--accent);font-family:system-ui,sans-serif;text-align:left}
.sample.idle{border-top:2px dashed #a9b8b0}
.dot.lamp-on{border-color:#c9940f;background:#ffd34d;border-radius:50%}
@media(max-width:600px){.tag text,.gate .tag text{font-size:16px}.packet-label{font-size:13px}.bit-badge text{font-size:13px}}
@media(prefers-reduced-motion:reduce){.switch .face,.switch .glow,.switch .digit,.switch .tag rect,.switch .tag text,.gate .face,.lamp .bulb,.lamp .halo,.bit-badge circle{transition:none}}
@media(max-width:420px){.shell{padding:18px 12px}.stage-top,.controls,.timeline,.view-controls,.hands-on{padding-inline:12px}.view-hint{flex-basis:100%;margin-inline-start:0}.steps{gap:5px}.steps button{padding-inline:6px}.truth th,.truth td{padding-inline:8px;min-width:36px}}
</style>

<body>
<main class="shell">
  <header>
    <p class="eyebrow">3장 컴퓨터를 바닥부터 · 레슨 3.1</p>
    <h1>논리 게이트</h1>
    <p class="lead">AND, OR, NOT은 신호를 어떻게 바꿀까요? 스위치를 켜고 끄며 램프가 언제 켜지는지 찾아보세요.</p>
  </header>
  <div class="workspace">
    <div>
      <section class="panel" aria-labelledby="stage-heading">
        <div class="stage-top"><h2 id="stage-heading">스위치, 게이트, 램프</h2><span class="status" id="status">재생 중</span></div>
        <div class="stage">
          <svg id="scene" viewBox="0 0 620 280" role="img" tabindex="0" aria-labelledby="scene-title scene-desc">
            <title id="scene-title">스위치 신호가 게이트를 지나 램프로 가는 장면</title><desc id="scene-desc"></desc>
            <defs>
              <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
              <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
              <radialGradient id="grid-fade"><stop offset=".45" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
              <mask id="grid-mask"><rect x="-460" y="-260" width="920" height="520" fill="url(#grid-fade)"/></mask>
            </defs>
            <g id="world" aria-hidden="true">
              <path id="grid" class="iso-grid" mask="url(#grid-mask)"></path>
              <g id="casings"></g><g id="links"></g><g id="nodes"></g><g id="badges"></g><g id="packets"></g>
            </g>
          </svg>
        </div>
        <div class="hands-on">
          <div class="try" id="try">
            <p><strong>해 보기</strong><span id="try-text"></span></p>
            <p class="try-result" id="try-result" role="status"></p>
            <button class="action" id="try-next" type="button" hidden>다음 문제</button>
          </div>
          <p class="readout" id="readout"></p>
          <div class="controls-row">
            <div class="input-row" id="input-buttons" role="group" aria-label="입력 스위치 켜고 끄기"></div>
            <table class="truth" id="truth"></table>
          </div>
        </div>
        <div class="view-controls" role="group" aria-label="장면 보기">
          <button class="action" id="zoom-out" type="button" aria-label="장면 축소">−</button>
          <output class="view-scale" id="view-scale" aria-label="현재 배율" aria-live="off">100%</output>
          <button class="action" id="zoom-in" type="button" aria-label="장면 확대">+</button>
          <button class="action" id="view-reset" type="button">원래 보기</button>
          <span class="view-hint"><span class="mouse-hint">장면의 스위치를 눌러도 됩니다 · 확대 후 드래그로 이동</span><span class="touch-hint">장면의 스위치를 눌러도 됩니다 · 두 손가락으로 확대</span></span>
        </div>
        <div class="controls">
          <div class="legend" aria-label="범례"><span><i class="sample"></i>1이 흐르는 선</span><span><i class="sample idle"></i>0인 선</span><span><i class="dot on"></i>켜짐 = 1</span><span><i class="dot lamp-on"></i>램프 켜짐</span></div>
          <div class="actions"><button class="action" id="pause" type="button">일시정지</button><button class="action" id="replay" type="button">다시 보기</button></div>
        </div>
        <nav class="timeline" aria-labelledby="timeline-heading">
          <div class="timeline-top"><h2 id="timeline-heading">타임라인</h2><span id="count"></span></div>
          <ol class="steps" id="steps"></ol>
        </nav>
      </section>
    </div>
    <section class="panel explanation" aria-labelledby="step-title">
      <h2 id="step-title"></h2><p id="body"></p>
      <div class="takeaway"><strong>관찰 포인트</strong><p id="takeaway"></p></div>
      <nav class="navigation" aria-label="이전 및 다음 단계"><button class="action" id="prev" type="button">이전 단계</button><button class="action primary" id="next" type="button">다음 단계</button></nav>
    </section>
  </div>
  <div class="sr-only" id="announcement" role="status"></div>
</main>
<script>
// Each step is a small circuit. Nodes are listed in signal order (inputs first, lamp last).
// `u` runs left to right on screen and `v` top to bottom; on the floor that is x = (u + v) / 2, y = (u - v) / 2.
// `in` names the nodes feeding a gate, and `mids` is the u where each incoming wire turns
// (so wires that cross the same column do not overlap). `demo` lists the input values the
// autoplay cycles through, and each task's `test` gets the current values and how many
// truth-table rows the learner has made.
const lesson = [
  {
    label: 'NOT',
    example: ["입력 0", "NOT이 신호를 반전", "램프 1"],
    title: 'NOT은 신호를 뒤집는다',
    body: '논리 게이트는 0과 1을 받아서 0이나 1을 내보내는 작은 회로입니다. 가장 단순한 NOT 게이트는 입력 하나를 받아 반대로 바꿉니다. 스위치 A가 꺼져 있으면(0) 램프가 켜지고(1), A를 켜면 램프가 꺼집니다.',
    takeaway: 'A가 0이면 NOT 뒤의 선에 1이 흘러 램프가 켜집니다. A를 켜면 1이 NOT까지 간 뒤 멈추고, 그 뒤 선은 점선(0)이 됩니다. 입력이 하나라 진리표는 두 줄뿐입니다.',
    description: '스위치 A에서 나온 선이 NOT 게이트를 지나 램프로 이어집니다. A가 꺼지면 램프가 켜지고, A가 켜지면 램프가 꺼집니다.',
    nodes: [
      { id: 'A', type: 'IN', u: 0, v: 0 },
      { id: 'n', type: 'NOT', in: ['A'], u: 7, v: 0 },
      { id: 'L', type: 'LAMP', in: ['n'], u: 14, v: 0 },
    ],
    demo: [[0], [1]],
    expr: (v) => `NOT A = NOT ${v.A} = ${v.L}`,
    tasks: [
      { text: '스위치를 눌러 램프를 꺼 보세요.', test: (v) => v.L === 0, ok: 'A = 1이면 NOT은 0을 내보냅니다.' },
      { text: '다시 램프를 켜 보세요.', test: (v) => v.L === 1, ok: 'A = 0이면 NOT은 1을 내보냅니다.' },
    ],
  },
  {
    label: 'AND',
    example: ["입력 1과 0", "AND는 둘 다 1일 때 켜짐", "램프 0"],
    title: 'AND는 둘 다 1일 때만 1',
    body: 'AND 게이트는 입력 두 개를 받아, 둘 다 1일 때만 1을 내보냅니다. 스위치 두 개를 한 줄로 이어 놓은 전등과 같습니다. 하나라도 꺼져 있으면 전기가 끝까지 가지 못합니다. 2.1에서 본 "그리고"와 같은 규칙입니다.',
    takeaway: 'A와 B 중 하나만 켜면 1이 AND까지는 가지만 그 뒤 선은 0으로 남습니다. 진리표 네 줄 가운데 램프가 켜지는 줄은 1, 1 하나뿐입니다.',
    description: '스위치 A와 B의 선이 AND 게이트로 모이고, AND에서 램프로 선이 이어집니다. 두 스위치가 모두 켜졌을 때만 램프가 켜집니다.',
    nodes: [
      { id: 'A', type: 'IN', u: 0, v: -5 },
      { id: 'B', type: 'IN', u: 0, v: 5 },
      { id: 'g', type: 'AND', in: ['A', 'B'], u: 9, v: 0 },
      { id: 'L', type: 'LAMP', in: ['g'], u: 16, v: 0 },
    ],
    demo: [[1, 0], [1, 1], [0, 1], [0, 0]],
    expr: (v) => `A AND B = ${v.A} AND ${v.B} = ${v.L}`,
    tasks: [
      { text: '램프를 켜 보세요.', test: (v) => v.L === 1, ok: '1 AND 1 = 1입니다.' },
      { text: 'B는 켠 채로 램프를 꺼 보세요.', test: (v) => v.B === 1 && v.L === 0, ok: '0 AND 1 = 0입니다. 하나만 켜져서는 부족합니다.' },
      { text: '진리표의 네 줄을 모두 직접 만들어 보세요.', test: (v, seen) => seen === 4, ok: '램프가 켜진 줄은 1, 1 하나뿐입니다.' },
    ],
  },
  {
    label: 'OR',
    example: ["입력 1과 0", "OR는 하나만 1이어도 켜짐", "램프 1"],

const byId = (id) => document.getElementById(id);
const viewport = byId('scene');
const viewWidth = 620;
const viewHeight = 280;
const maxZoom = 3;
const center = { x: viewWidth / 2, y: viewHeight / 2 };
const camera = { x: 0, y: 0, zoom: 1 };
const pointers = new Map();
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));



// Convert from screen pixels to fixed viewport coordinates, accounting for SVG letterboxing.


// A press that starts on a switch and ends without moving toggles that switch.
// Tracked separately from the camera pointers so it also works when the pointer is captured.
let tap = null;
viewport.addEventListener('pointerdown', (event) => {
  const target = event.target.closest?.('[data-input]');
  tap = target && event.button === 0 && pointers.size === 0
    ? { input: target.dataset.input, x: event.clientX, y: event.clientY, id: event.pointerId }
    : null;
});
viewport.addEventListener('pointerup', (event) => {
  if (tap && tap.id === event.pointerId && Math.hypot(event.clientX - tap.x, event.clientY - tap.y) < 8) {
    toggleInput(tap.input);
  }
  tap = null;
});
viewport.addEventListener('pointercancel', () => { tap = null; });

viewport.addEventListener('pointerdown', (event) => {
  if (event.button !== 0 || pointers.size >= 2) return;
  if (event.pointerType !== 'touch' && camera.zoom === 1) return;
  pointers.set(event.pointerId, viewportPoint(event));
  viewport.setPointerCapture(event.pointerId);

viewport.addEventListener('pointermove', (event) => {
  if (!pointers.has(event.pointerId)) return;
  const before = pointerGeometry();
  pointers.set(event.pointerId, viewportPoint(event));
  const after = pointerGeometry();
  const pinch = pointers.size === 2;
  if (pinch && (before.distance < 1 || after.distance < 1)) return;
  const zoom = pinch ? camera.zoom * after.distance / before.distance : camera.zoom;

  viewport.classList.toggle('is-dragging', !pinch && camera.zoom > 1);

for (const eventName of ['pointerup', 'pointercancel', 'lostpointercapture']) {

byId('zoom-in').onclick = () => zoomBy(.25);
byId('zoom-out').onclick = () => zoomBy(-.25);
byId('view-reset').onclick = resetView;
viewport.addEventListener('keydown', (event) => {

const motion = matchMedia('(prefers-reduced-motion: reduce)');
const storageKey = 'gates-lab:v1:step';
const gateDelay = 560;   // ms for a signal to cross one wire, so one gate "thinks" per wire
const state = { index: 0, inputs: {}, values: {}, shown: {}, playing: !motion.matches, userPaused: false,
  demoPosition: 0, wait: 0, solved: '', seen: new Set() };
const progress = lesson.map(() => 0);  // try-it problems solved in each step
let views = new Map();   // node id -> drawn node
let wires = [];          // { from, to, port, line, casing, chevron, startLen, endLen }
let events = [];         // pending { at, id }: when a node shows its new value
let packets = [];
let frame = null;
let lastFrame = null;


// The same world-to-screen projection as the other labs.
const project = (x, y, z = 0) => [14 * (x + y), 7 * (x - y) - z];
const point = (x, y, z) => project(x, y, z).map((value) => +value.toFixed(2)).join(',');
// Screen position of a (u, v) floor point: u = x + y, v = x - y.
const flat = (u, v, z = 0) => [14 * u, 7 * v - z];
const mix = (a, b, t) => a + (b - a) * t;
const laneHeight = 3;

const gridLines = [];
for (let i = -24; i <= 40; i += 2) {
  gridLines.push(`M${point(i, -24, 0)}L${point(i, 40, 0)}M${point(-24, i, 0)}L${point(40, i, 0)}`);
}
byId('grid').setAttribute('d', gridLines.join(''));


function boxFaces(h, H) {
  return {
    left: [[-h, -h, 0], [h, -h, 0], [h, -h, H], [-h, -h, H]],
    right: [[h, -h, 0], [h, h, 0], [h, h, H], [h, -h, H]],
    top: [[-h, -h, H], [h, -h, H], [h, h, H], [-h, h, H]],
  };
}
function drawFaces(node, h, H) {
  const faces = {};
  for (const [name, corners] of Object.entries(boxFaces(h, H))) {
    faces[name] = svg('polygon', { class: 'face ' + name, points: corners.map((p) => point(...p)).join(' ') }, node);
  }
  const highlight = svg('path', { class: 'highlight', d: `M${point(-h, -h, H)}L${point(h, -h, H)}L${point(h, h, H)}` }, node);
  return { faces, highlight };
}

// Plates are small labels whose box is sized to the text.
let plates = [];
function addPlate(node, className, x, y, text, { pad = 1.5, round = true } = {}) {
  const group = svg('g', { class: className }, node);
  const plate = { group, rect: svg('rect', {}, group), label: svg('text', {}, group), x, y, pad, round };
  plate.label.textContent = text;
  plates.push(plate);
  sizePlate(plate);
  return plate;
}
matchMedia('(max-width: 600px)').addEventListener('change', () => plates.forEach(sizePlate));

// Sizes: half-width h on the floor (a box covers u ± 2h) and height H.
const size = { IN: [.78, 10], NOT: [1.05, 14], AND: [1.15, 14], OR: [1.15, 14], LAMP: [1.05, 11] };
const switchHigh = 18;  // a switch pops up to this height when on

function shapeSwitch(view, H) {
  const h = size.IN[0];
  for (const [name, corners] of Object.entries(boxFaces(h, H))) {
    view.faces[name].setAttribute('points', corners.map((p) => point(...p)).join(' '));
  }
  view.highlight.setAttribute('d', `M${point(-h, -h, H)}L${point(h, -h, H)}L${point(h, h, H)}`);
  view.digit.setAttribute('y', -H + .5);
  view.plate.group.setAttribute('transform', `translate(0 ${size.IN[1] - H})`);
}

function createNode(spec) {
  const [h, H] = size[spec.type];
  const kind = spec.type === 'IN' ? 'switch' : spec.type === 'LAMP' ? 'lamp' : 'gate ' + spec.type;
  const node = svg('g', { class: 'node ' + kind, transform: `translate(${flat(spec.u, spec.v).join(' ')})` }, byId('nodes'));
  const view = { spec, node, height: H, heightFrom: H, heightTo: H };
  drawShadow(node, h);
  if (spec.type === 'IN') {
    node.dataset.input = spec.id;
    const spill = [[-h, -h], [h, -h], [h, h], [-h, h]].map(([x, y]) => point(x * 1.9, y * 1.9, 0)).join(' ');
    svg('polygon', { class: 'glow', points: spill, filter: 'url(#soft-glow)' }, node);
    view.faces = {};
    for (const name of ['left', 'right', 'top']) view.faces[name] = svg('polygon', { class: 'face ' + name }, node);
    view.highlight = svg('path', { class: 'highlight' }, node);
    view.digit = svg('text', { class: 'digit', x: 0 }, node);
    view.plate = addPlate(node, 'tag', 0, -H - 14 * h - 13, spec.id, { pad: 1.3 });
    shapeSwitch(view, H);
    return view;
  }
  Object.assign(view, drawFaces(node, h, H));
  if (spec.type === 'LAMP') {
    svg('circle', { class: 'halo', cx: 0, cy: -H - 9, r: 17, filter: 'url(#soft-glow)' }, node);
    svg('circle', { class: 'bulb', cx: 0, cy: -H - 9, r: 8.5 }, node);
    const [cx, cy] = project(h, -h, 0);
    addPlate(node, 'tag', cx + 4, cy + 13, '램프');

  view.plate = addPlate(node, 'tag', 0, -H - 14 * h - 12, spec.type, { pad: 1.3, round: false });

  const badge = svg('g', { class: 'bit-badge', transform: `translate(${14 * (2 * h + .9)} -12)` }, byId('badges'));
  badge.setAttribute('transform', `translate(${14 * (spec.u + 2 * h + .95)} ${7 * spec.v - 13})`);
  svg('circle', { r: 8 }, badge);
  view.badgeText = svg('text', {}, badge);
  view.badge = badge;
  return view;
}

// Wires run on the floor like a schematic: right from the source, then up or down at `mid`,
// then right into the gate's port. The part under each box is hidden by the box.
function createWire(from, to, port, mid) {
  const src = views.get(from).spec, dst = views.get(to).spec;
  const ports = dst.in.length === 1 ? [0] : [-.9, .9];
  const pv = dst.v + ports[port];
  const turn = mid ?? (src.u + dst.u) / 2;
  const route = [[src.u, src.v], [turn, src.v], [turn, pv], [dst.u, pv]].map(([u, v]) => flat(u, v, laneHeight));
  const d = 'M' + route.map((p) => p.join(' ')).join('L');
  const casing = svg('path', { class: 'casing', d }, byId('casings'));
  const group = svg('g', {}, byId('links'));
  const line = svg('path', { class: 'wire idle', d }, group);
  // Chevron on the last straight part, pointing into the gate.
  const [p, q] = route.slice(-2);
  const at = [mix(p[0], q[0], .35), mix(p[1], q[1], .35)];
  const chevron = svg('path', { class: 'chevron idle', d: 'M-4.5 -5L2.5 0L-4.5 5', transform: `translate(${at.join(' ')})` }, group);
  const startLen = 14 * 2 * size[src.type][0] * .8;
  const endLen = 14 * (2 * size[dst.type][0] - Math.abs(ports[port])) * .9;
  return { from, to, port, line, casing, chevron, startLen, endLen };
}

function evaluate(inputs) {
  const values = {};
  for (const spec of lesson[state.index].nodes) {
    const [a, b] = (spec.in ?? []).map((id) => values[id]);
    values[spec.id] = spec.type === 'IN' ? inputs[spec.id]
      : spec.type === 'NOT' ? 1 - a : spec.type === 'AND' ? a & b : spec.type === 'OR' ? a | b : a;
  }
  return values;
}

// How many wires a signal crosses from the switches to each node.
function depths() {
  const depth = {};
  for (const spec of lesson[state.index].nodes) {
    depth[spec.id] = spec.in ? 1 + Math.max(...spec.in.map((id) => depth[id])) : 0;
  }
  return depth;
}

function buildScene() {
  for (const id of ['casings', 'links', 'nodes', 'badges', 'packets']) byId(id).replaceChildren();
  plates = [];
  packets = [];
  events = [];
  views = new Map();
  const step = lesson[state.index];
  // Painter's order: nodes higher on screen first.
  const ordered = [...step.nodes].sort((a, b) => a.v - b.v || a.u - b.u);
  for (const spec of ordered) views.set(spec.id, createNode(spec));
  wires = [];
  for (const spec of step.nodes) {
    (spec.in ?? []).forEach((from, port) => wires.push(createWire(from, spec.id, port, spec.mids?.[port])));
  }
  fitWorld(step.nodes);
}

// Scale and centre the circuit in the 620 x 280 viewport.
function fitWorld(nodes) {
  const xs = nodes.map((n) => 14 * n.u), ys = nodes.map((n) => 7 * n.v);
  const left = Math.min(...xs) - 34, right = Math.max(...xs) + 44;
  const top = Math.min(...ys) - 62, bottom = Math.max(...ys) + 30;
  const scale = Math.min(1.9, 570 / (right - left), 250 / (bottom - top));
  const x = 310 - scale * (left + right) / 2, y = 142 - scale * (top + bottom) / 2;
  byId('world').setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${scale.toFixed(3)})`);
}

// Show one node's value: light it, light its outgoing wires, and send a "1" down each of them.
function showNode(id, send) {
  const value = state.values[id];
  state.shown[id] = value;
  const view = views.get(id);
  if (!view) return;
  const on = value === 1;
  view.node.classList.toggle('on', on);
  if (view.digit) {
    view.digit.textContent = String(value);
    view.heightFrom = view.height;
    view.heightTo = on ? switchHigh : size.IN[1];
    view.anim = motion.matches ? null : { start: performance.now(), ms: 300 };
    if (!view.anim) { view.height = view.heightTo; shapeSwitch(view, view.height); }
  }
  if (view.badge) {
    view.badge.classList.toggle('on', on);
    view.badgeText.textContent = String(value);
  }
  for (const wire of wires) {
    if (wire.from !== id) continue;
    for (const part of [wire.line, wire.chevron]) {
      part.classList.toggle('signal', on);
      part.classList.toggle('idle', !on);
    }
    if (on && send) sendPacket(wire);
  }
  kick();
}

function sendPacket(wire) {
  if (motion.matches) return;
  const group = svg('g', {}, byId('packets'));
  svg('circle', { class: 'packet-halo', r: 8.5 }, group);
  svg('circle', { class: 'packet', r: 4.4 }, group);
  svg('text', { class: 'packet-label', y: -9.5 }, group).textContent = '1';
  packets.push({ group, wire, start: performance.now(), duration: gateDelay });
  kick();
}

function movePackets(now) {
  packets = packets.filter((packet) => {
    const t = (now - packet.start) / packet.duration;
    const { line, startLen, endLen, from } = packet.wire;
    // A packet disappears on arrival, and when its source turns back to 0 mid-flight.
    if (t >= 1 || !line.isConnected || state.shown[from] !== 1) { packet.group.remove(); return false; }
    const total = line.getTotalLength();
    const at = line.getPointAtLength(mix(Math.min(startLen, total), Math.max(total - endLen, 0), Math.max(t, 0)));
    packet.group.setAttribute('transform', `translate(${at.x} ${at.y})`);
    return true;
  });
}

// Set the switches. Every node then shows its new value once the signal has had time to reach it,
// one wire (gateDelay) per gate. With reduced motion everything updates at once.
function setInputs(next, { send = true } = {}) {
  state.inputs = { ...next };
  state.values = evaluate(state.inputs);
  events = [];
  const depth = depths();
  const now = performance.now();
  for (const spec of lesson[state.index].nodes) {
    if (motion.matches || depth[spec.id] === 0) showNode(spec.id, send);
    else events.push({ at: now + depth[spec.id] * gateDelay, id: spec.id, send });
  }
  syncControls();
  kick();
}

function demoTick() {
  const step = lesson[state.index];
  const combo = step.demo[state.demoPosition];
  setInputs(Object.fromEntries(inputIds().map((id, k) => [id, combo[k]])));
  state.demoPosition = (state.demoPosition + 1) % step.demo.length;
  state.wait = 1500 + Math.max(...Object.values(depths())) * gateDelay;
}

const inputIds = () => lesson[state.index].nodes.filter((n) => n.type === 'IN').map((n) => n.id);

function tick(now) {
  frame = null;
  const elapsed = lastFrame === null ? 0 : Math.min(now - lastFrame, 80);
  lastFrame = now;
  if (state.playing) {
    state.wait -= elapsed;
    if (state.wait <= 0) demoTick();
  }
  const due = events.filter((event) => event.at <= now);
  events = events.filter((event) => event.at > now);
  for (const event of due) showNode(event.id, event.send);
  let animating = false;
  for (const view of views.values()) {
    if (!view.anim) continue;
    const t = clamp((now - view.anim.start) / view.anim.ms, 0, 1);
    const ease = t * t * (3 - 2 * t);
    view.height = mix(view.heightFrom, view.heightTo, ease);
    shapeSwitch(view, view.height);
    if (t === 1) view.anim = null; else animating = true;
  }
  movePackets(now);
  if (!(state.playing || events.length || packets.length || animating)) lastFrame = null;
  else if (frame === null) frame = requestAnimationFrame(tick);
}

function kick() {
  if (frame === null && (state.playing || events.length || packets.length || [...views.values()].some((v) => v.anim))) {
    frame = requestAnimationFrame(tick);
  }
}

function syncPlayback() {
  const reduced = motion.matches;
  if (reduced) {
    state.playing = false;
    for (const packet of packets) packet.group.remove();
    packets = [];
  }
  byId('status').textContent = reduced ? '모션 감소 · 직접 조작' : state.playing ? '재생 중' : '일시정지됨';
  byId('pause').textContent = state.playing ? '일시정지' : '재생';
  byId('pause').disabled = reduced;
  byId('replay').disabled = reduced;
  kick();
}

// The HTML input buttons mirror the scene's switches and are the keyboard and screen reader controls.
let inputButtons = [];
function buildButtons() {
  const row = byId('input-buttons');
  row.replaceChildren();
  inputButtons = inputIds().map((id) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'input-button';
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = '스위치 ' + id;

    digit.className = 'bit';
    button.append(name, digit);
    button.addEventListener('click', () => toggleInput(id));

}

// Truth table: every combination of the inputs, the current one highlighted,
// and a check on the rows the learner has made with their own hands.
const rowIndex = (inputs) => inputIds().reduce((index, id) => index * 2 + inputs[id], 0);
function buildTable() {
  const ids = inputIds();
  const table = byId('truth');
  table.replaceChildren();
  const caption = document.createElement('caption');
  caption.textContent = '진리표 · 직접 만든 줄에 ✓';
  const head = document.createElement('tr');
  for (const id of ids) head.append(Object.assign(document.createElement('th'), { scope: 'col', textContent: id }));
  head.append(Object.assign(document.createElement('th'), { scope: 'col', className: 'out', textContent: '램프' }));
  head.append(Object.assign(document.createElement('td'), { className: 'seen' }));
  table.append(caption, head);
  for (let row = 0; row < 2 ** ids.length; row++) {
    const inputs = Object.fromEntries(ids.map((id, k) => [id, row >> (ids.length - 1 - k) & 1]));
    const out = evaluate(inputs).L;
    const tr = document.createElement('tr');
    for (const id of ids) tr.append(Object.assign(document.createElement('td'), { textContent: inputs[id] }));
    tr.append(Object.assign(document.createElement('td'), { className: 'out' + (out ? ' one' : ''), textContent: out }));
    tr.append(Object.assign(document.createElement('td'), { className: 'seen' }));
    table.append(tr);
  }
}

function syncControls() {
  for (const { id, button, digit } of inputButtons) {
    const on = state.inputs[id] === 1;
    button.setAttribute('aria-pressed', String(on));
    button.setAttribute('aria-label', `스위치 ${id}, ${on ? '켜짐 1' : '꺼짐 0'}`);
    digit.textContent = on ? '1' : '0';
  }
  const current = rowIndex(state.inputs);
  [...byId('truth').querySelectorAll('tr')].slice(1).forEach((tr, row) => {
    tr.classList.toggle('current', row === current);
    tr.lastChild.textContent = state.seen.has(row) ? '✓' : '';
  });
  const text = lesson[state.index].expr(state.values);
  const [left, ...rest] = text.split(' = ');
  const bold = document.createElement('b');
  bold.textContent = rest.pop();
  byId('readout').replaceChildren(`${[left, ...rest].join(' = ')} = `, bold,
    state.values.L ? ' → 램프 켜짐' : ' → 램프 꺼짐');
}

// Show the current try-it problem, or the result when the learner has just solved one.
function syncTask() {
  const tasks = lesson[state.index].tasks;
  const done = progress[state.index];
  const allDone = done >= tasks.length;
  byId('try').classList.toggle('solved', state.solved !== '');
  byId('try-text').textContent = state.solved !== '' ? tasks[done - 1].text
    : allDone ? '이 단계의 문제를 모두 풀었습니다. 스위치를 자유롭게 눌러 보세요.' : tasks[done].text;
  byId('try-result').textContent = state.solved === '' ? ''
    : `✓ 맞았습니다. ${state.solved}${allDone ? ' · 이 단계의 문제를 모두 풀었습니다.' : ''}`;
  byId('try-next').hidden = state.solved === '' || allDone;
}

// Only the learner's own changes count, so the demo cannot solve a problem.
function checkTask() {
  const tasks = lesson[state.index].tasks;
  const done = progress[state.index];
  if (state.solved !== '' || done >= tasks.length || !tasks[done].test(state.values, state.seen.size)) return;
  progress[state.index] = done + 1;
  state.solved = tasks[done].ok;
  syncTask();
}

byId('try-next').onclick = () => {
  state.solved = '';
  syncTask();
  inputButtons[0]?.button.focus();
};

function toggleInput(id) {
  if (!(id in state.inputs)) return;
  state.playing = false;
  state.solved = '';  // a new move dismisses the last result and brings up the next problem
  const next = { ...state.inputs, [id]: 1 - state.inputs[id] };
  state.seen.add(rowIndex(next));
  setInputs(next);
  syncPlayback();
  byId('announcement').textContent = `스위치 ${id} ${next[id] ? '켜짐' : '꺼짐'}. 램프 ${state.values.L ? '켜짐' : '꺼짐'}.`;
  syncTask();
  checkTask();
}

function startStep() {
  const step = lesson[state.index];
  state.demoPosition = 0;
  state.seen = new Set();
  buildScene();
  buildButtons();
  buildTable();
  // Start from the demo's last combination so the first tick visibly changes something.
  const first = motion.matches ? step.demo[0] : step.demo[step.demo.length - 1];
  setInputs(Object.fromEntries(inputIds().map((id, k) => [id, first[k]])), { send: true });
  state.wait = 900;
}

function showStep(index, announce = true) {
  state.index = index;
  if (!state.userPaused) state.playing = !motion.matches;
  const step = lesson[index];
  startStep();
  byId('step-title').textContent = step.title;
  byId('body').textContent = step.body;
  byId('takeaway').textContent = step.takeaway;
  byId('scene-desc').textContent = step.description;
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  stepButtons.forEach((button, i) => {
    if (i === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  try { localStorage.setItem(storageKey, String(index)); } catch {}
  state.solved = '';
  syncTask();
  syncPlayback();
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${step.title}`;
}

function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/gates/${index + 1}`);
  showStep(index);
}

function routeIndex() {
  const match = /^#\/gates\/(\d+)$/.exec(location.hash);
  const routed = match ? Number(match[1]) - 1 : -1;
  if (routed >= 0 && routed < lesson.length) return routed;
  try {
    const stored = localStorage.getItem(storageKey);
    const index = Number(stored);
    if (stored !== null && Number.isInteger(index) && index >= 0 && index < lesson.length) return index;
  } catch {}
  return 0;
}

const stepButtons = lesson.map(({ label }, index) => {
  const listItem = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  const number = document.createElement('span');
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.addEventListener('click', () => goToStep(index));
  listItem.append(button);
  byId('steps').append(listItem);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
byId('pause').onclick = () => {
  state.playing = !state.playing;
  state.userPaused = !state.playing;
  if (state.playing && state.wait <= 0) state.wait = 400;
  syncPlayback();
  byId('announcement').textContent = byId('status').textContent;
};
byId('replay').onclick = () => {
  state.playing = true;
  state.userPaused = false;
  startStep();
  syncPlayback();
  byId('announcement').textContent = '현재 단계 다시 재생';
};
window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
motion.addEventListener('change', () => {
  if (!motion.matches && !state.userPaused) state.playing = true;
  syncPlayback();
});
window.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});
const initial = routeIndex();
history.replaceState(null, '', `#/gates/${initial + 1}`);
showStep(initial, false);
</script>
</body>
</html>
