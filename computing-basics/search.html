<script>
const byId = (id) => document.getElementById(id);
const workspace = document.querySelector('.workspace');
const viewport = byId('scene');
const viewWidth = 620;
const viewHeight = 280;
const maxZoom = 3;
const center = { x: viewWidth / 2, y: viewHeight / 2 };
const camera = { x: 0, y: 0, zoom: 1 };
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));



// Convert from screen pixels to fixed viewport coordinates, accounting for SVG letterboxing.


// A press that starts on a scene object and ends without moving counts as a tap on it.
// Track the press separately so clicking still works after a drag captures the pointer.
let tap = null;
viewport.addEventListener('pointerdown', (event) => {
  const target = event.target.closest?.('[data-hit]');
  tap = target && event.button === 0 && event.isPrimary
    ? { hit: target.dataset.hit, x: event.clientX, y: event.clientY, id: event.pointerId }
    : null;
});
viewport.addEventListener('pointerup', (event) => {
  if (tap && tap.id === event.pointerId && Math.hypot(event.clientX - tap.x, event.clientY - tap.y) < 8) {
    sceneTap(tap.hit);
  }
  tap = null;
});
viewport.addEventListener('pointercancel', () => { tap = null; });

enableCameraDrag();



byId('zoom-in').onclick = () => zoomBy(.25);
byId('zoom-out').onclick = () => zoomBy(-.25);
viewport.addEventListener('keydown', (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const directions = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const direction = directions[event.key];
  if (direction && camera.zoom > 1) {
    event.preventDefault();
    setCamera(camera.x + direction[0] * 28 / camera.zoom, camera.y + direction[1] * 28 / camera.zoom, camera.zoom);
  } else if (event.key === '+' || event.key === '=' || event.key === '-') {
    event.preventDefault();
    zoomBy(event.key === '-' ? -.25 : .25);
  } else if (event.key === '0') {
    event.preventDefault();
    resetView();
  }
});
setCamera(0, 0, 1);

const motion = matchMedia('(prefers-reduced-motion: reduce)');
const count = 16;

// Sixteen distinct numbers between 1 and 99, sorted. `shuffled` keeps the same numbers in a mixed order.
function makeNumbers(seed) {
  let x = seed;
  const random = () => (x = (x * 1103515245 + 12345) % 2147483648) / 2147483648;
  const set = new Set();
  while (set.size < count) set.add(1 + Math.floor(random() * 99));
  const sorted = [...set].sort((a, b) => a - b);
  const shuffled = [...sorted];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return { sorted, shuffled, random };
}

const workedSorted = [1, 4, 9, 10, 16, 24, 26, 30, 35, 37, 41, 43, 61, 81, 84, 99];
const workedShuffled = [61, 4, 99, 35, 26, 81, 16, 43, 9, 1, 30, 10, 41, 24, 37, 84];
const lesson = {
  "question": "찾는 수보다 가운데 값이 작을 때, 언제 왼쪽 상자를 보지 않아도 될까?",
  "terms": [
    {
      "term": "확인",
      "meaning": "상자 하나를 열어 찾는 수와 비교하는 일. 레슨에서 세는 \"일의 양\"의 단위",
      "step": 1

    left: [[-h, -h, 0], [h, -h, 0], [h, -h, H], [-h, -h, H]],
    right: [[h, -h, 0], [h, h, 0], [h, h, H], [h, -h, H]],
    top: [[-h, -h, H], [h, -h, H], [h, h, H], [-h, h, H]],
  };
  for (const [name, corners] of Object.entries(faces)) {
    const attrs = { class: 'face ' + name, points: corners.map((p) => point(...p)).join(' ') };
    if (fills) Object.assign(attrs, { fill: fills[name], stroke: fills.stroke });
    svg('polygon', attrs, node);
  }
  svg('path', { class: 'highlight', d: `M${point(-h, -h, H)}L${point(h, -h, H)}L${point(h, h, H)}` }, node);
}

// Plates are small labels whose box is sized to the text.
let plates = [];
function addPlate(node, className, x, y, text, { pad = 1.5, round = true } = {}) {
  const group = svg('g', { class: className }, node);
  const plate = { group, rect: svg('rect', {}, group), label: svg('text', {}, group), x, y, pad, round };
  plate.label.textContent = text;
  plates.push(plate);
  sizePlate(plate);
  return plate;
}

// ---------- Boxes in a row on the floor diagonal ----------
const spacing = 1.3;
const half = .52;
const low = 11, high = 20, sunk = 3;
const boxes = [];
let targetPlate, orderPlate;
function buildBoxes() {
  const boxGroup = svg('g', { class: 'mode-group', 'data-mode': 'boxes' }, byId('nodes'));
  for (let i = 0; i < count; i++) {
    const c = (i - (count - 1) / 2) * spacing;
    const [bx, by] = project(c, c);
    const node = svg('g', { class: 'node box', 'data-hit': `b${i}`, transform: `translate(${bx} ${by})` }, boxGroup);
    drawShadow(node, half);
    const faces = {};
    for (const name of ['left', 'right', 'top']) faces[name] = svg('polygon', { class: 'face ' + name }, node);
    const highlight = svg('path', { class: 'highlight' }, node);
    const digit = svg('text', { class: 'digit', x: 0 }, node);
    const index = svg('text', { class: 'box-index', x: 0, y: 20 }, node);
    index.textContent = i + 1;
    boxes.push({ node, faces, highlight, digit, height: low, target: low });
  }
  // The number to find floats above the middle of the row.
  targetPlate = addPlate(boxGroup, 'total', 0, -62, '찾는 수 ?', { pad: 1.1, round: false });
  // Halving: the opened middles in order, under the row, so the still picture shows how the range shrank.
  orderPlate = addPlate(boxGroup, 'tag', 0, 52, '', { pad: 1.6, round: false });
}
function shapeBox(box, H) {
  const h = half;
  const faces = {
    left: [[-h, -h, 0], [h, -h, 0], [h, -h, H], [-h, -h, H]],
    right: [[h, -h, 0], [h, h, 0], [h, h, H], [h, -h, H]],
    top: [[-h, -h, H], [h, -h, H], [h, h, H], [-h, h, H]],
  };
  for (const [name, corners] of Object.entries(faces)) box.faces[name].setAttribute('points', corners.map((p) => point(...p)).join(' '));
  box.highlight.setAttribute('d', `M${point(-h, -h, H)}L${point(h, -h, H)}L${point(h, h, H)}`);
  box.digit.setAttribute('y', -H + .5);
}

function comparisonText(parent, x, y, value, className = '') {
  svg('text', {x, y, class: className}, parent).textContent = value;
}
function comparisonBox(parent, x, y, width, height, tone = '') {
  svg('rect', {x: x - width / 2, y: y - height / 2, width, height, class: tone, rx: 7}, parent);
}
function comparisonArrow(parent, start, end, y) {
  svg('line', {x1: start, x2: end, y1: y, y2: y, class: 'comparison-arrow'}, parent);
}

const shuffleNumbers = {
  sorted: [1, 4, 9, 30, 61, 81, 84, 99],
  mixed: [1, 84, 9, 30, 61, 81, 4, 99],
  exercise: [9, 81, 1, 30, 61, 84, 4, 99]
};

function shuffleRow(drawing, items, y, target, {discard = false, hide = false} = {}) {
  items.forEach((value, index) => {
    const x = 61 + 71 * index;
    const shown = !hide || index === 3;
    const focus = index === 3 || (shown && value === target);
    const tone = [focus && 'comparison-focus', discard && index < 4 && 'comparison-excluded'].filter(Boolean).join(' ');
    comparisonBox(drawing, x, y, 52, 38, tone);
    comparisonText(drawing, x, y + 6, shown ? value : '?');
  });
}

function drawShuffle(drawing, hide) {
  comparisonText(drawing, 310, 39, '두 줄 모두 목표 84 · 가운데 비교 30 < 84', 'comparison-caption');
  comparisonText(drawing, 194, 81, '작은 수부터 · 왼쪽 네 개 제외');
  shuffleRow(drawing, shuffleNumbers.sorted, 115, 84, {discard: true});
  svg('line', {x1: 28, x2: 592, y1: 150, y2: 150, class: 'comparison-rule'}, drawing);
  comparisonText(drawing, 194, 190, hide ? '섞은 순서' : '섞은 순서 · 왼쪽에도 84');
  shuffleRow(drawing, shuffleNumbers.mixed, 224, 84, {hide});
}
function searchBox(drawing, x, y, width, height, value, {excluded, open, found} = {}) {
  const className = ['search-box', excluded && 'comparison-excluded',
    (open || found) && 'comparison-focus', found && 'comparison-found'].filter(Boolean).join(' ');
  comparisonBox(drawing, x, y, width, height, className);
  comparisonText(drawing, x, y + 5, value);
}

function drawFigure(index, {hide}) {
  const g = byId('figure');
  g.setAttribute('class', 'search-comparison');
  if (index === 4) { drawShuffle(g, hide.includes('mixed-values')); return; }
  if (index === 2) {
    comparisonText(g, 24, 24, '정렬한 16개 · 찾는 수 84', 'search-start');
    const opened = [7, 11, 13, 14];
    opened.forEach((at, row) => {
      const y = 64 + row * 56;
      comparisonText(g, 28, y + 4, (row + 1) + '회', 'search-small');
      workedSorted.forEach((value, i) => {
        const x = 66 + i * 34;
        const earlier = opened.slice(0, row).includes(i);
        const excluded = i < at;
        const open = i === at;
        const found = open && row === opened.length - 1;
        searchBox(g, x, y, 30, 34, excluded || open ? value : '?', {excluded, open: earlier || open, found});
        if (open) comparisonText(g, x, y - 22, found ? '= 84 · 발견' : '< 84', 'search-small');
        if (row === opened.length - 1) comparisonText(g, x, 266, i + 1, 'search-small');
      });
    });
    return;
  }
  const boxes = index === 0 ? workedShuffled : workedSorted;
  const hidden = hide.includes('excluded');
  comparisonText(g, 24, 24, index === 0 ? '섞인 16개 · 찾는 수 84' : '정렬한 16개 · 찾는 수 84', 'search-start');
  boxes.forEach((value, i) => {
    const x = 32 + 37 * i;
    const excluded = index === 1 && !hidden && i < 7;
    const open = index === 1 && i === 7;
    const found = index === 0 && i === 15;
    comparisonText(g, x, 122, i + 1, 'search-small');
    searchBox(g, x, 150, 32, 38, index === 0 || open || excluded ? value : '?', {excluded, open, found});
  });
  if (index === 0) {
    comparisonArrow(g, 32, 587, 190);
    comparisonText(g, 587, 106, '발견', 'search-small');
    comparisonText(g, 603, 214, '16회 확인', 'search-end');
    return;
  }
  comparisonText(g, 291, 108, '30 < 84', 'search-small');
  comparisonText(g, 603, 24, '1회 확인', 'search-end');
  if (!hidden) {
    [[16, 307, '1–8번 제외 · 모두 30 이하'], [312, 603, '남은 후보 8개']].forEach(([a, b, label]) => {
      svg('path', {d: `M${a} 187v5h${b - a}v-5`, class: 'search-bracket'}, g);
      comparisonText(g, (a + b) / 2, 212, label);
    });
  }
}

// ---------- Drawing ----------
function boxState(i) {
  if (state.found && state.numbers[i] === state.target) return 'found';
  // A box opened on the way stays open after its side is thrown away, so the picked middles stand out from the rest.
  if (state.openedSet.has(i)) return 'open';
  if (step().mode === 'binary' && (i < state.lo || i > state.hi)) return 'out';
  return 'closed';
}
function shownBoxValue(index, kind) {
  if (kind === 'out') return '×';
  if (kind === 'closed') return '?';
  return String(state.numbers[index]);
}

function paint() {
  targetPlate.label.textContent = state.opened ? `찾는 수 ${state.target} · 연 상자 ${state.opened}개` : `찾는 수 ${state.target}`;
  sizePlate(targetPlate);
  const order = [...state.openedSet].map(i => `${i + 1}번 ${state.numbers[i]}`);
  orderPlate.group.classList.toggle('hidden', !order.length);
  orderPlate.label.textContent = order.length ? `정렬됨 · 열어 본 가운데 ${order.join(' → ')}` : '';
  sizePlate(orderPlate);
  boxes.forEach((box, i) => {
    const kind = boxState(i);
    box.node.setAttribute('class', `node box ${kind}`);
    box.digit.textContent = shownBoxValue(i, kind);
    box.target = kind === 'found' ? high : kind === 'out' ? sunk : low;
  });
  animate();
  syncControls();
}

let shapeFrame = null;
function animate() {
  if (shapeFrame !== null) return;
  const frameStep = () => {
    shapeFrame = null;
    let moving = false;
    for (const item of boxes) {
      const next = motion.matches ? item.target : mix(item.height, item.target, .22);
      item.height = Math.abs(next - item.target) < .3 ? item.target : next;
      if (item.height !== item.target) moving = true;
      shapeBox(item, item.height);
    }
    if (moving) shapeFrame = requestAnimationFrame(frameStep);
  };
  frameStep();
}

// ---------- HTML controls ----------
const boxButtons = [];
function buildControls() {
  const row = byId('box-buttons');
  for (let i = 0; i < count; i++) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'box-button';
    button.addEventListener('click', () => openBox(i));
    row.append(button);
    boxButtons.push(button);
  }
  byId('new-round').onclick = () => {
    state.playing = false;
    state.solved = '';
    state.round++;
    newRound();
    paint();
    syncTask();
    byId('announcement').textContent = `새 문제. 찾는 수 ${state.target}`;
  };
}
function syncControls() {
  boxButtons.forEach((button, i) => {
    const kind = boxState(i);
    button.className = `box-button ${kind}`;
    button.textContent = shownBoxValue(i, kind);
    button.disabled = !practiceReady || state.found || kind === 'out' || kind === 'open';
    const status = kind === 'closed' ? '닫힘' : kind === 'out' ? '미개봉 제외' : String(state.numbers[i]);
    button.setAttribute('aria-label', `${i + 1}번 상자, ${status}`);
  });
  const i = [...state.openedSet].at(-1);
  const value = state.numbers[i];
  const symbol = value === state.target ? '=' : value < state.target ? '<' : '>';
  const comparison = i === undefined ? '' : ` · ${value} ${symbol} ${state.target}`;
  const remaining = state.found ? 0 : state.hi - state.lo + 1;
  byId('readout').replaceChildren(
    document.createTextNode(`찾는 수 ${state.target}`), ' · ',
    document.createTextNode(`${state.opened}회 확인`), comparison, ' · ',
    document.createTextNode(`남은 후보 ${remaining}개`)
  );
}
// ---------- Searching ----------
function newRound() {
  const { sorted, shuffled, random } = makeNumbers(state.round * 7919 + 17);
  const binary = step().mode === 'binary';
  state.numbers = state.round === 0 ? (binary ? workedSorted : workedShuffled) : (binary ? sorted : shuffled);
  state.target = state.round === 0 ? 84 : sorted[Math.floor(random() * count)];
  state.openedSet = new Set();
  state.opened = 0;
  state.lo = 0;
  state.hi = count - 1;
  state.found = false;
  state.hint = '';
  // The demo's order of boxes to open.
  if (step().mode === 'binary') {
    state.plan = [];
    let lo = 0, hi = count - 1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      state.plan.push(mid);
      if (state.numbers[mid] === state.target) break;
      if (state.numbers[mid] < state.target) lo = mid + 1; else hi = mid - 1;
    }
  } else state.plan = [...Array(count).keys()];
}
function revealBox(i) {
  if (state.found || state.openedSet.has(i) || i < state.lo || i > state.hi) return false;
  state.openedSet.add(i);
  state.opened++;
  const value = state.numbers[i];
  if (value === state.target) {
    state.found = true;
    state.hint = `${i + 1}번 상자에서 찾았습니다`;
  } else if (step().mode === 'binary') {
    if (value < state.target) { state.lo = i + 1; state.hint = `${value}은(는) 찾는 수보다 작습니다 → 왼쪽을 버립니다`; }
    else { state.hi = i - 1; state.hint = `${value}은(는) 찾는 수보다 큽니다 → 오른쪽을 버립니다`; }
  } else state.hint = `${value}, 아닙니다`;
  return true;
}
function openBox(i) {
  if (!practiceReady) return;
  userChange(() => { revealBox(i); }, '');
  byId('announcement').replaceChildren(...[...byId('readout').childNodes].map(node => node.cloneNode(true)));
}
function sceneTap(hit) {
  if (hit?.startsWith('b')) openBox(Number(hit.slice(1)));
}
function userChange(change) {
  change();
  paint();
  syncTask();
}

let practiceReady = false;
function syncTask() {
  byId('try-result').textContent = !state.found ? ''
    : state.opened <= 5 ? `${state.opened}번 만에 찾았습니다. 남은 상자의 가운데를 열면 16개는 많아야 5번입니다.`
      : `${state.opened}번 걸렸습니다. 가운데가 아닌 상자를 열면 한 번에 버리는 상자가 줄어듭니다. 새 문제로 다시 해 보세요.`;
}

const lessonHooks = {
  onStep(index) { state.index = index; },
  onPractice(open) {
    practiceReady = open;
    byId('world').toggleAttribute('hidden', !open);
    if (open) byId('figure').setAttribute('visibility', 'hidden');
    else byId('figure').removeAttribute('visibility');
    if (!open) return;
    state.round = 0;
    newRound();
    byId('try-text').textContent = step().practice.goal;
    byId('try-result').textContent = '';
    paint();
  },
};
buildBoxes();
buildControls();
</script>
</body>
</html>
