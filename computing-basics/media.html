<style>

:focus-visible{outline:3px solid #a24c14;outline-offset:3px}

@media(prefers-reduced-motion:reduce){.mode-group,.pixel{transition:none}}
</style>

<body>
<main class="shell">
  <header>
    <p class="eyebrow">0장 컴퓨팅 둘러보기 · 레슨 0.3</p>
    <h1>이미지와 소리</h1>
    <p class="lead">사진과 소리는 어떻게 숫자가 될까요? 픽셀을 칠하고, 색을 섞고, 소리를 잘게 나눠 보세요.</p>
  </header>
  <div class="workspace">
    <div>
      <section class="panel" aria-labelledby="stage-heading">
        <div class="stage-top"><h2 id="stage-heading">화면과 숫자</h2><span class="status" id="status">재생 중</span></div>
        <div class="stage">
          <svg id="scene" viewBox="0 0 620 280" role="img" tabindex="0" aria-labelledby="scene-title scene-desc">

            <defs>
              <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
              <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
              <radialGradient id="grid-fade"><stop offset=".45" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
              <mask id="grid-mask"><rect x="-460" y="-260" width="920" height="520" fill="url(#grid-fade)"/></mask>
            </defs>
            <g id="world" aria-hidden="true">

<script>
const byId = (id) => document.getElementById(id);
const viewport = byId('scene');
const viewWidth = 620;
const viewHeight = 280;
const maxZoom = 3;
const center = { x: viewWidth / 2, y: viewHeight / 2 };
const camera = { x: 0, y: 0, zoom: 1 };
const pointers = new Map();
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));



// Convert from screen pixels to fixed viewport coordinates, accounting for SVG letterboxing.


// A press that starts on a scene object and ends without moving counts as a tap on it.
// Tracked separately from the camera pointers so it also works when the pointer is captured.
let tap = null;
viewport.addEventListener('pointerdown', (event) => {
  const target = event.target.closest?.('[data-hit]');
  tap = target && event.button === 0 && pointers.size === 0
    ? { hit: target.dataset.hit, x: event.clientX, y: event.clientY, id: event.pointerId }
    : null;
});
viewport.addEventListener('pointerup', (event) => {
  if (tap && tap.id === event.pointerId && Math.hypot(event.clientX - tap.x, event.clientY - tap.y) < 8) {
    sceneTap(tap.hit);
  }
  tap = null;
});
viewport.addEventListener('pointercancel', () => { tap = null; });

viewport.addEventListener('pointerdown', (event) => {
  if (event.button !== 0 || pointers.size >= 2) return;
  if (event.pointerType !== 'touch' && camera.zoom === 1) return;
  pointers.set(event.pointerId, viewportPoint(event));
  viewport.setPointerCapture(event.pointerId);
});
viewport.addEventListener('pointermove', (event) => {
  if (!pointers.has(event.pointerId)) return;
  const before = pointerGeometry();
  pointers.set(event.pointerId, viewportPoint(event));
  const after = pointerGeometry();
  const pinch = pointers.size === 2;
  if (pinch && (before.distance < 1 || after.distance < 1)) return;
  const zoom = pinch ? camera.zoom * after.distance / before.distance : camera.zoom;
  zoomBetween(zoom, before.point, after.point);
  viewport.classList.toggle('is-dragging', !pinch && camera.zoom > 1);
});
for (const eventName of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  viewport.addEventListener(eventName, (event) => {
    if (pointers.delete(event.pointerId)) viewport.classList.remove('is-dragging');
  });
}



byId('zoom-in').onclick = () => zoomBy(.25);
byId('zoom-out').onclick = () => zoomBy(-.25);
byId('view-reset').onclick = resetView;
viewport.addEventListener('keydown', (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const directions = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const direction = directions[event.key];
  if (direction && camera.zoom > 1) {
    event.preventDefault();
    setCamera(camera.x + direction[0] * 28 / camera.zoom, camera.y + direction[1] * 28 / camera.zoom, camera.zoom);
  } else if (event.key === '+' || event.key === '=' || event.key === '-') {
    event.preventDefault();
    zoomBy(event.key === '-' ? -.25 : .25);
  } else if (event.key === '0') {
    event.preventDefault();
    resetView();
  }
});
setCamera(0, 0, 1);

const motion = matchMedia('(prefers-reduced-motion: reduce)');
const storageKey = 'media-lab:v1:step';
const size = 8;  // the picture is 8 × 8 pixels

// Demo pictures, one byte per row (1 = lit).
const pictures = {
  heart: [0x00, 0x66, 0xFF, 0xFF, 0xFF, 0x7E, 0x3C, 0x18],
  smile: [0x3C, 0x42, 0xA5, 0x81, 0xA5, 0x99, 0x42, 0x3C],
  letter: [0x18, 0x24, 0x42, 0x42, 0x7E, 0x42, 0x42, 0x00],
};
const fromBytes = (rows) => rows.flatMap((row) => Array.from({ length: size }, (_, c) => row >> (size - 1 - c) & 1));
// Four-level pictures: a left-to-right gradient, and the heart with a shaded edge.
const gradient = Array.from({ length: size * size }, (_, i) => Math.floor((i % size) / 2));
const shadedHeart = fromBytes(pictures.heart).map((on, i) => {
  if (!on) return 0;
  const r = Math.floor(i / size), c = i % size;
  return r <= 2 && c <= 3 ? 3 : r >= 5 ? 1 : 2;
});

const colors = {

    takeaway: '곡선이 원래 소리이고, 막대가 컴퓨터가 적어 둔 높이입니다. 샘플을 늘리면 막대가 촘촘해지고, 샘플 크기를 줄이면 높이가 계단처럼 거칠어집니다.',
    description: '부드러운 소리 파형 곡선 아래에 같은 간격으로 막대가 서 있습니다. 막대 높이는 그 순간 잰 파형의 높이를 정해진 단계로 반올림한 값입니다.',
    initial: () => ({ samples: 16, depth: 4 }),
    demo: { sweep: true, interval: 90 },
    tasks: [
      { text: '샘플을 32개로 늘려 보세요. 막대가 곡선에 더 가까워집니다.', check: (s) => s.samples === 32 },
      { text: '샘플 크기를 2비트로 줄여 보세요. 높이가 4단계뿐이라 거칠어집니다.', check: (s) => s.depth === 2 },
      { text: '전체 크기가 정확히 128비트가 되게 맞춰 보세요.', check: (s) => s.samples * s.depth === 128 },

const sameColor = (a, b) => a.every((v, i) => v === b[i]);
const rowValue = (s, r) => s.image.slice(r * size, r * size + size).reduce((value, bit) => value * 2 + (bit ? 1 : 0), 0);
const step = () => lesson[state.index];
const state = { index: 0, playing: !motion.matches, userPaused: false, wait: 0, demoPosition: 0, solved: '',
  image: Array(size * size).fill(0), color: [0, 0, 0], samples: 16, depth: 4, playhead: -1 };
const progress = lesson.map(() => 0);

const project = (x, y, z = 0) => [14 * (x + y), 7 * (x - y) - z];
const point = (x, y, z) => project(x, y, z).map((value) => +value.toFixed(2)).join(',');
const mix = (a, b, t) => a + (b - a) * t;

const gridLines = [];
for (let i = -20; i <= 20; i += 2) {
  gridLines.push(`M${point(i, -20, 0)}L${point(i, 20, 0)}M${point(-20, i, 0)}L${point(20, i, 0)}`);
}
byId('grid').setAttribute('d', gridLines.join(''));


function drawFaces(node, h, H, fills) {
  const faces = {
    left: [[-h, -h, 0], [h, -h, 0], [h, -h, H], [-h, -h, H]],
    right: [[h, -h, 0], [h, h, 0], [h, h, H], [h, -h, H]],
    top: [[-h, -h, H], [h, -h, H], [h, h, H], [-h, h, H]],
  };
  for (const [name, corners] of Object.entries(faces)) {
    const attrs = { class: 'face ' + name, points: corners.map((p) => point(...p)).join(' ') };
    if (fills) Object.assign(attrs, { fill: fills[name], stroke: fills.stroke });
    svg('polygon', attrs, node);
  }
  svg('path', { class: 'highlight', d: `M${point(-h, -h, H)}L${point(h, -h, H)}L${point(h, h, H)}` }, node);
}

// Plates are small labels whose box is sized to the text.
let plates = [];
function addPlate(node, className, x, y, text, { pad = 1.5, round = true } = {}) {
  const group = svg('g', { class: className }, node);
  const plate = { group, rect: svg('rect', {}, group), label: svg('text', {}, group), x, y, pad, round };
  plate.label.textContent = text;
  plates.push(plate);
  sizePlate(plate);
  return plate;
}
matchMedia('(max-width: 600px)').addEventListener('change', () => plates.forEach(sizePlate));

// ---------- The monitor: an 8 × 8 pixel screen on the front-left face of a box ----------
const monitor = { h: 3.4, H: 128, margin: .32, base: 10 };
const cell = (2 * monitor.h - 2 * monitor.margin) / size;   // pixel width in floor units
const rowHeight = cell * 15.6;                              // pixel height in screen pixels, so pixels look square
const pixelShades = {
  2: ['#22352f', '#e3f6e9'],
  4: ['#22352f', '#557366', '#9fc2b0', '#e8f8ee'],
};

const groups = {};
const pixelViews = [];
let rowLabels = [];
function buildMonitor() {
  const group = svg('g', { class: 'mode-group node', 'data-mode': 'screen' }, byId('nodes'));
  const { h, H, margin, base } = monitor;
  drawShadow(group, h);
  drawFaces(group, h, H, { top: '#f4f7f5', left: '#d7dfdb', right: '#b8c6c0', stroke: '#8c9d96' });
  // Dark bezel behind the pixels.
  const bezel = [[-h + margin * .6, -h, base - 4], [h - margin * .6, -h, base - 4], [h - margin * .6, -h, base + rowHeight * size + 4], [-h + margin * .6, -h, base + rowHeight * size + 4]];
  svg('polygon', { points: bezel.map((p) => point(...p)).join(' '), fill: '#1b2b26' }, group);
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      const x0 = -h + margin + c * cell + .03, x1 = x0 + cell - .06;
      const z0 = base + (size - 1 - r) * rowHeight + .8, z1 = z0 + rowHeight - 1.6;
      const quad = [[x0, -h, z0], [x1, -h, z0], [x1, -h, z1], [x0, -h, z1]];
      const pixel = svg('polygon', { class: 'pixel', 'data-hit': `p${r * size + c}`, points: quad.map((p) => point(...p)).join(' ') }, group);
      pixelViews.push(pixel);
    }
  }
  // Row labels to the left of the screen: bits and the row's value.
  rowLabels = [];
  for (let r = 0; r < size; r++) {
    const [x, y] = project(-h, -h, base + (size - 1 - r) * rowHeight + rowHeight / 2);
    rowLabels.push(svg('text', { class: 'row-label', x: x - 10, y }, group));
  }
  const [lx, ly] = project(h, -h, 0);
  addPlate(group, 'tag', lx, ly + 16, '화면');
  groups.screen = group;
}

// ---------- Color: three light columns feeding the screen ----------
const channelNames = ['빨강', '초록', '파랑'];
const channelColors = [
  { top: '#ffb3ad', left: '#f0776d', right: '#c9483f', stroke: '#a8392f', wire: '#d0473d' },
  { top: '#b6f0c4', left: '#5fcf7d', right: '#329852', stroke: '#2a7b43', wire: '#2f9a50' },
  { top: '#b9cbff', left: '#6f8ff0', right: '#4361c4', stroke: '#3550a6', wire: '#4565d0' },
];
const towerAt = [[-11.2, -5.2], [-9.4, -3.4], [-7.6, -1.6]];
let towers = [];
function buildTowers() {
  const group = svg('g', { class: 'mode-group', 'data-mode': 'color' }, byId('nodes'));
  const wires = svg('g', { class: 'mode-group', 'data-mode': 'color' }, byId('links'));
  towers = channelColors.map((c, i) => {
    const [x, y] = towerAt[i];
    // Wire along x to under the monitor, then along y into it.
    const d = 'M' + [[x, y], [0, y], [0, 0]].map(([a, b]) => project(a, b, 3).join(' ')).join('L');
    svg('path', { class: 'casing', d }, wires);
    svg('path', { class: 'wire', d, stroke: c.wire, 'stroke-width': 2.6 }, wires);
    const node = svg('g', { class: 'node', transform: `translate(${project(x, y)})` }, group);
    drawShadow(node, .7);
    const faces = {};
    for (const name of ['left', 'right', 'top']) faces[name] = svg('polygon', { class: 'face', fill: c[name], stroke: c.stroke }, node);
    const highlight = svg('path', { class: 'highlight' }, node);
    const plate = addPlate(node, 'tag place', 0, 0, '0', { pad: 1.1 });
    const [nx, ny] = project(.7, -.7, 0);
    addPlate(node, 'tag', nx, ny + 14, channelNames[i]);
    return { node, faces, highlight, plate, height: 6 };
  });
  groups.color = group;
  groups.colorWires = wires;
}
function shapeTower(tower, H) {
  const h = .7;
  const faces = {
    left: [[-h, -h, 0], [h, -h, 0], [h, -h, H], [-h, -h, H]],
    right: [[h, -h, 0], [h, h, 0], [h, h, H], [h, -h, H]],
    top: [[-h, -h, H], [h, -h, H], [h, h, H], [-h, h, H]],
  };
  for (const [name, corners] of Object.entries(faces)) tower.faces[name].setAttribute('points', corners.map((p) => point(...p)).join(' '));
  tower.highlight.setAttribute('d', `M${point(-h, -h, H)}L${point(h, -h, H)}L${point(h, h, H)}`);
  tower.plate.y = -H - 14 * h - 13;
  sizePlate(tower.plate);
}

// ---------- Sound: a wave and sample bars standing on the floor diagonal ----------
const soundSpan = 17;           // floor units covered by the samples
const soundStart = -10.5;
const waveHeight = 92;          // pixels from the floor to the highest point
const wave = (t) => .5 + .34 * Math.sin(2 * Math.PI * 1.5 * t) + .12 * Math.sin(2 * Math.PI * 4.5 * t + .6);
let soundGroup, soundBars, wavePath, playheadLine;
function buildSound() {
  soundGroup = svg('g', { class: 'mode-group', 'data-mode': 'sound' }, byId('nodes'));
  soundBars = svg('g', {}, soundGroup);
  const curve = [];
  for (let k = 0; k <= 160; k++) {
    const t = k / 160, c = soundStart + soundSpan * t;
    curve.push(project(c, c, 4 + waveHeight * wave(t)).join(' '));
  }
  wavePath = svg('path', { class: 'wave', d: 'M' + curve.join('L') }, soundGroup);
  playheadLine = svg('path', { class: 'playhead' }, soundGroup);
  const [x, y] = project(soundStart + soundSpan + 1.2, soundStart + soundSpan + 1.2, 0);
  addPlate(soundGroup, 'tag', x, y + 10, '소리 파형');
  groups.sound = soundGroup;
}
function drawSamples() {
  soundBars.replaceChildren();
  const n = state.samples, levels = 2 ** state.depth;
  const w = Math.min(.36, soundSpan / n * .3);
  for (let k = 0; k < n; k++) {
    const t = (k + .5) / n, c = soundStart + soundSpan * t;
    const level = Math.round(wave(t) * (levels - 1));
    const H = 4 + waveHeight * level / (levels - 1);
    const node = svg('g', { class: 'node sample' + (k === state.playhead ? ' active' : ''), transform: `translate(${project(c, c)})` }, soundBars);
    const faces = {
      left: [[-w, -w, 0], [w, -w, 0], [w, -w, H], [-w, -w, H]],
      right: [[w, -w, 0], [w, w, 0], [w, w, H], [w, -w, H]],
      top: [[-w, -w, H], [w, -w, H], [w, w, H], [-w, w, H]],
    };
    for (const [name, corners] of Object.entries(faces)) svg('polygon', { class: 'face ' + name, points: corners.map((p) => point(...p)).join(' ') }, node);
    if (n <= 16) svg('text', { class: 'sample-value', x: 0, y: -H - 14 * w - 7 }, node).textContent = level;
  }
  if (state.playhead >= 0) {
    const t = (state.playhead + .5) / n, c = soundStart + soundSpan * t;
    playheadLine.setAttribute('d', `M${project(c, c, 0).join(' ')}L${project(c, c, waveHeight + 18).join(' ')}`);
  } else playheadLine.setAttribute('d', '');
}

// ---------- Drawing the current state ----------
function paint() {
  const s = step();
  for (const group of byId('world').querySelectorAll('.mode-group')) {
    const mode = group.dataset.mode;
    const visible = mode === s.mode || (mode === 'screen' && s.mode !== 'sound');
    group.classList.toggle('hidden', !visible);
  }
  if (s.mode === 'pixels') {
    const shades = pixelShades[s.levels];
    pixelViews.forEach((pixel, i) => {
      pixel.setAttribute('fill', shades[state.image[i]]);
      pixel.classList.toggle('lit', state.image[i] > 0);
    });
    rowLabels.forEach((label, r) => {
      const row = state.image.slice(r * size, r * size + size);
      label.textContent = s.levels === 2
        ? `${row.join('').replace(/(.{4})(.{4})/, '$1 $2')} = ${rowValue(state, r)}`
        : row.map((v) => v.toString(2).padStart(2, '0')).join(' ');
    });
  } else if (s.mode === 'color') {
    const fill = `rgb(${state.color.join(',')})`;
    pixelViews.forEach((pixel) => { pixel.setAttribute('fill', fill); pixel.classList.remove('lit'); });
    rowLabels.forEach((label) => { label.textContent = ''; });
    towers.forEach((tower, i) => {
      tower.target = 6 + state.color[i] / 255 * 70;
      tower.plate.label.textContent = String(state.color[i]);
    });
    animateTowers();
  } else {
    drawSamples();
  }
  syncControls();
}

// Columns grow smoothly toward their target height.
let towerFrame = null;
function animateTowers() {
  if (towerFrame !== null) return;
  const stepFrame = () => {
    towerFrame = null;
    let moving = false;
    for (const tower of towers) {
      const next = motion.matches ? tower.target : mix(tower.height, tower.target, .25);
      tower.height = Math.abs(next - tower.target) < .3 ? tower.target : next;
      if (tower.height !== tower.target) moving = true;
      shapeTower(tower, tower.height);
    }
    if (moving) towerFrame = requestAnimationFrame(stepFrame);
  };
  stepFrame();
}

// ---------- HTML controls ----------
const pixelButtons = [];
function buildControls() {
  const grid = byId('pixel-grid');
  for (let i = 0; i < size * size; i++) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'pixel-button';
    button.addEventListener('click', () => cyclePixel(i));
    grid.append(button);
    pixelButtons.push(button);
  }
  byId('pixels-clear').onclick = () => userChange(() => { state.image.fill(0); }, '그림을 모두 지웠습니다.');
  byId('pixels-invert').onclick = () => userChange(() => {
    const top = step().levels - 1;
    state.image = state.image.map((v) => top - v);
  }, '밝기를 반전했습니다.');

  const channels = byId('channels');
  channelNames.forEach((name, i) => {
    const row = document.createElement('div');
    row.className = 'channel';
    row.style.setProperty('--swatch', channelColors[i].wire);
    const id = 'channel-' + i;
    row.innerHTML = `<label for="${id}"><i></i>${name}</label><input type="range" id="${id}" min="0" max="255" step="1"><output for="${id}"></output>` +
      `<button class="action" type="button" data-set="0">0</button><button class="action" type="button" data-set="255">255</button>`;
    const input = row.querySelector('input');
    input.addEventListener('input', () => userChange(() => { state.color[i] = Number(input.value); }, `${name} ${input.value}.`, true));
    row.querySelectorAll('[data-set]').forEach((button) => button.addEventListener('click', () =>
      userChange(() => { state.color[i] = Number(button.dataset.set); }, `${name} ${button.dataset.set}.`)));
    channels.append(row);
  });

  const choice = (container, values, key, unit) => values.forEach((value) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'action choice-button';
    button.textContent = `${value}${unit}`;
    button.dataset.value = value;
    button.addEventListener('click', () => userChange(() => { state[key] = value; }, `${key === 'samples' ? '샘플 수' : '샘플 크기'} ${value}${unit}.`));
    container.append(button);
  });
  choice(byId('sample-choices'), [8, 16, 32], 'samples', '개');
  choice(byId('depth-choices'), [2, 4], 'depth', '비트');
}

function syncControls() {
  const s = step();
  for (const mode of document.querySelectorAll('.mode')) mode.hidden = mode.dataset.mode !== s.mode;
  if (s.mode === 'pixels') {
    const shades = pixelShades[s.levels];
    pixelButtons.forEach((button, i) => {
      const v = state.image[i];
      button.style.background = shades[v];
      button.setAttribute('aria-pressed', String(v > 0));
      button.setAttribute('aria-label', `${Math.floor(i / size) + 1}행 ${i % size + 1}열, ${s.levels === 2 ? (v ? '켜짐' : '꺼짐') : '밝기 ' + v.toString(2).padStart(2, '0')}`);
    });
  }
  if (s.mode === 'color') {
    channelNames.forEach((_, i) => {
      const input = byId('channel-' + i);
      if (Number(input.value) !== state.color[i]) input.value = state.color[i];
      input.nextElementSibling.textContent = state.color[i];
    });
  }
  if (s.mode === 'sound') {
    for (const button of document.querySelectorAll('#sample-choices button')) button.setAttribute('aria-pressed', String(Number(button.dataset.value) === state.samples));
    for (const button of document.querySelectorAll('#depth-choices button')) button.setAttribute('aria-pressed', String(Number(button.dataset.value) === state.depth));
  }
  byId('readout').replaceChildren(...readout());
}

function readout() {
  const s = step();
  const strong = (text, className) => {
    const element = document.createElement('b');
    if (className) element.className = className;
    element.textContent = text;
    return element;
  };
  if (s.mode === 'pixels') {
    const bitsPer = Math.log2(s.levels);
    return ['8 × 8 = 64칸 × ', strong(`${bitsPer}비트`), ' = ', strong(`${64 * bitsPer}비트`, 'total'), ` = ${8 * bitsPer}바이트`];
  }
  if (s.mode === 'color') {
    const binary = state.color.map((v) => v.toString(2).padStart(8, '0')).join(' ');
    return ['RGB ', strong(`(${state.color.join(', ')})`), ' → ', strong(binary), ' = ', strong('3바이트', 'total')];
  }
  return ['샘플 ', strong(`${state.samples}개`), ' × ', strong(`${state.depth}비트`), ' = ', strong(`${state.samples * state.depth}비트`, 'total')];
}

// ---------- Changes ----------
function cyclePixel(i) {
  const levels = step().levels;
  userChange(() => { state.image[i] = (state.image[i] + 1) % levels; },
    `${Math.floor(i / size) + 1}행 ${i % size + 1}열 ${levels === 2 ? (state.image[i] ? '끔' : '켬') : '밝기 바꿈'}.`);
}
function sceneTap(hit) {
  if (hit?.startsWith('p') && step().mode === 'pixels') cyclePixel(Number(hit.slice(1)));
}

function userChange(change, message, quiet = false) {
  state.playing = false;
  state.playhead = -1;
  state.solved = '';
  change();
  paint();
  syncPlayback();
  if (!quiet) byId('announcement').textContent = message;
  syncTask();
  checkTask();
}

// ---------- Try-it problems ----------
function syncTask() {
  const tasks = step().tasks;
  const done = progress[state.index];
  const allDone = done >= tasks.length;
  byId('try').classList.toggle('solved', state.solved !== '');
  byId('try-text').textContent = state.solved !== '' ? tasks[done - 1].text
    : allDone ? '이 단계의 문제를 모두 풀었습니다. 자유롭게 바꿔 보세요.' : tasks[done].text;
  byId('try-result').textContent = state.solved === '' ? ''
    : `✓ 맞았습니다. ${state.solved}${allDone ? ' · 이 단계의 문제를 모두 풀었습니다.' : ''}`;
  byId('try-next').hidden = state.solved === '' || allDone;
}
function checkTask() {
  const tasks = step().tasks;
  const done = progress[state.index];
  if (state.solved !== '' || done >= tasks.length || !tasks[done].check(state)) return;
  progress[state.index] = done + 1;
  state.solved = tasks[done].result?.(state) ?? byId('readout').textContent;
  syncTask();
}
byId('try-next').onclick = () => { state.solved = ''; syncTask(); };

// ---------- Demo playback ----------
let frame = null, lastFrame = null;
function applyFrame(frameState) {
  if (frameState.image) state.image = [...frameState.image];
  if (frameState.color) state.color = [...frameState.color];
  paint();
}
function demoTick() {
  const demo = step().demo;
  if (demo.sweep) {
    state.playhead = (state.playhead + 1) % state.samples;
    drawSamples();
    state.wait = state.playhead === state.samples - 1 ? 900 : demo.interval;
    return;
  }
  state.demoPosition = (state.demoPosition + 1) % demo.frames.length;
  applyFrame(demo.frames[state.demoPosition]);
  state.wait = demo.interval;
}
function tick(now) {
  frame = null;
  const elapsed = lastFrame === null ? 0 : Math.min(now - lastFrame, 80);
  lastFrame = now;
  if (state.playing) {
    state.wait -= elapsed;
    if (state.wait <= 0) demoTick();
    frame = requestAnimationFrame(tick);
  } else lastFrame = null;
}
function syncPlayback() {
  const reduced = motion.matches;
  if (reduced) state.playing = false;
  byId('status').textContent = reduced ? '모션 감소 · 직접 조작' : state.playing ? '재생 중' : '일시정지됨';
  byId('pause').textContent = state.playing ? '일시정지' : '재생';
  byId('pause').disabled = reduced;
  byId('replay').disabled = reduced;
  if (!state.playing && step().mode === 'sound' && state.playhead >= 0) { state.playhead = -1; drawSamples(); }
  if (state.playing && frame === null) frame = requestAnimationFrame(tick);
}

// ---------- Steps and routing ----------
const legends = {
  pixels: '<span><i class="dot on"></i>켜진 칸</span><span><i class="dot"></i>꺼진 칸</span>',
  color: '<span><i class="swatch" style="--c:#d0473d"></i>빨강</span><span><i class="swatch" style="--c:#2f9a50"></i>초록</span><span><i class="swatch" style="--c:#4565d0"></i>파랑</span>',
  sound: '<span><i class="sample-line wave-line"></i>원래 소리</span><span><i class="dot on"></i>샘플 높이</span>',
};
function startStep() {
  const s = step();
  Object.assign(state, s.initial());
  state.demoPosition = 0;
  state.playhead = -1;
  state.wait = s.demo.sweep ? 600 : s.demo.interval;
  // Carry the picture over between the two pixel steps, rescaled to the new number of levels.
}
function showStep(index, announce = true) {
  const previous = lesson[state.index];
  const keep = previous.mode === 'pixels' && lesson[index].mode === 'pixels' && index !== state.index && announce;
  const kept = keep ? state.image.map((v) => (v * (lesson[index].levels - 1) / (previous.levels - 1)) | 0) : null;
  state.index = index;
  if (!state.userPaused) state.playing = !motion.matches;
  startStep();
  if (kept && !state.playing) state.image = kept;
  const s = step();
  byId('step-title').textContent = s.title;
  byId('body').textContent = s.body;
  byId('takeaway').textContent = s.takeaway;
  byId('scene-desc').textContent = s.description;
  byId('legend').innerHTML = legends[s.mode];
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  stepButtons.forEach((button, i) => {
    if (i === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  byId('world').setAttribute('transform', s.mode === 'sound' ? 'translate(330 182) scale(1.02)' : s.mode === 'color' ? 'translate(372 184) scale(.94)' : 'translate(352 188) scale(1.0)');
  try { localStorage.setItem(storageKey, String(index)); } catch {}
  state.solved = '';
  syncTask();
  paint();
  syncPlayback();
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${s.title}`;
}
function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/media/${index + 1}`);
  showStep(index);
}
function routeIndex() {
  const match = /^#\/media\/(\d+)$/.exec(location.hash);
  const routed = match ? Number(match[1]) - 1 : -1;
  if (routed >= 0 && routed < lesson.length) return routed;
  try {
    const stored = localStorage.getItem(storageKey);
    const index = Number(stored);
    if (stored !== null && Number.isInteger(index) && index >= 0 && index < lesson.length) return index;
  } catch {}
  return 0;
}
const stepButtons = lesson.map(({ label }, index) => {
  const listItem = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  const number = document.createElement('span');
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.addEventListener('click', () => goToStep(index));
  listItem.append(button);
  byId('steps').append(listItem);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
byId('pause').onclick = () => {
  state.playing = !state.playing;
  state.userPaused = !state.playing;
  if (state.playing && state.wait <= 0) state.wait = 400;
  syncPlayback();
  byId('announcement').textContent = byId('status').textContent;
};
byId('replay').onclick = () => {
  state.playing = true;
  state.userPaused = false;
  startStep();
  paint();
  syncPlayback();
  byId('announcement').textContent = '현재 단계 다시 재생';
};
window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
motion.addEventListener('change', () => {
  if (!motion.matches && !state.userPaused) state.playing = true;
  syncPlayback();
});
window.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});

buildMonitor();
buildTowers();
buildSound();
buildControls();
const initial = routeIndex();
history.replaceState(null, '', `#/media/${initial + 1}`);
state.index = initial;
showStep(initial, false);
</script>
</body>
</html>
