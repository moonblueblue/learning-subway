<title>가상 메모리 · 레슨 5.4</title>
<style>
:root{color-scheme:light;--ink:#142620;--muted:#43574f;--border:#cbd9d0;--paper:#f4f7ef;--panel:#fff;--accent:#0f766e;--request:#187959;--response:#5362a0;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}

.box.B .left{fill:#f2d3b4;stroke:#b06a2c}.box.B .right{fill:#e6bb91;stroke:#b06a2c}.box.B .top{fill:#fbe7d3;stroke:#b06a2c}
.box.os .left{fill:#d7dfdb;stroke:#8c9d96}.box.os .right{fill:#b8c6c0;stroke:#8c9d96}.box.os .top{fill:#eef1ef;stroke:#8c9d96}
.box.empty .face{fill:#fff;stroke:#b9c6be;stroke-dasharray:3 2}
.box.hot .top{fill:#ffd34d;stroke:#c9940f}

.map.blocked{stroke:#c0392b;stroke-width:3;stroke-dasharray:6 4;opacity:1}

.sample.disk{border-top:2px dashed #5362a0}

<body>
<main class="shell">
  <header>
    <p class="eyebrow">5장 운영체제와 네트워크 · 레슨 5.4</p>
    <h1>가상 메모리</h1>
    <p class="lead">프로그램마다 메모리를 혼자 쓰는 것처럼 보이는 이유는 무엇일까요? 가상 페이지가 페이지 테이블을 거쳐 RAM과 디스크로 이어지는 길을 따라가 보세요.</p>
  </header>
  <div class="workspace">
    <div>
      <section class="panel" id="stage-panel" aria-labelledby="stage-heading">
        <div class="stage-top"><h2 id="stage-heading">가상 페이지, RAM, 디스크</h2></div>
        <div class="stage">
          <svg id="scene" viewBox="0 0 620 280" role="img" tabindex="0" aria-labelledby="scene-title scene-desc">
            <title id="scene-title">프로세스 A와 B의 가상 페이지가 페이지 테이블을 따라 RAM 프레임이나 디스크로 이어지는 장면</title><desc id="scene-desc"></desc>
            <defs>
              <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
              <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
              <radialGradient id="grid-fade"><stop offset=".45" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
              <mask id="grid-mask"><rect x="-460" y="-260" width="920" height="520" fill="url(#grid-fade)"/></mask>
            </defs>
            <g id="world" aria-hidden="true">
              <path id="grid" class="iso-grid" mask="url(#grid-mask)"></path>
              <g id="casings"></g><g id="links"></g><g id="nodes"></g><g id="packets"></g>
            </g>
          </svg>
        </div>
        <div class="hands-on">
          <div class="try" id="try">
            <p><strong>해 보기</strong><span id="try-text"></span></p>
            <p class="try-result" id="try-result" role="status"></p>
            <div class="try-choices" id="try-choices" role="group" aria-label="예측 고르기"></div>
          </div>
          <p class="readout" id="readout"></p>
          <div class="algo-row" id="row-A" role="group" aria-label="A의 페이지 읽기"></div>
          <div class="algo-row" id="row-B" role="group" aria-label="B의 페이지 읽기"></div>
          <div class="algo-row" id="extra"></div>
          <div class="tables"><table class="truth" id="table-A"></table><table class="truth" id="table-B"></table></div>
        </div>
        <div class="view-controls" role="group" aria-label="장면 보기">
          <button class="action" id="zoom-out" type="button" aria-label="장면 축소">−</button>
          <output class="view-scale" id="view-scale" aria-label="현재 배율" aria-live="off">100%</output>
          <button class="action" id="zoom-in" type="button" aria-label="장면 확대">+</button>
          <span class="view-hint"><span class="mouse-hint">확대 후 드래그로 이동</span><span class="touch-hint">두 손가락으로 확대</span></span>
        </div>
        <div class="controls">
          <div class="legend" aria-label="범례"><span><i class="dot pa"></i>A의 페이지</span><span><i class="dot pb"></i>B의 페이지</span><span><i class="dot pos"></i>운영체제</span><span><i class="sample disk"></i>디스크로 가는 연결</span></div>
        </div>
        <nav class="timeline" aria-labelledby="timeline-heading">
          <div class="timeline-top"><h2 id="timeline-heading">타임라인</h2><span id="count"></span></div>
          <ol class="steps" id="steps"></ol>
        </nav>
      </section>
    </div>
    <section class="panel explanation" aria-labelledby="step-title">
      <h2 id="step-title"></h2><p id="body"></p>
      <div class="takeaway"><strong>관찰 포인트</strong><p id="takeaway"></p></div>
      <nav class="navigation" aria-label="이전 및 다음 단계"><button class="action" id="prev" type="button">이전 단계</button><button class="action primary" id="next" type="button">다음 단계</button></nav>

<script>
const byId = (id) => document.getElementById(id);
const viewport = byId('scene');
const viewWidth = 620;
const viewHeight = 280;
const maxZoom = 3;
const center = { x: viewWidth / 2, y: viewHeight / 2 };
const camera = { x: 0, y: 0, zoom: 1 };
const pointers = new Map();
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));



// Convert from screen pixels to fixed viewport coordinates, accounting for SVG letterboxing.


// A press that starts on a switch and ends without moving toggles that switch.
// Tracked separately from the camera pointers so it also works when the pointer is captured.
let tap = null;
viewport.addEventListener('pointerdown', (event) => {
  const target = event.target.closest?.('[data-input]');
  tap = target && event.button === 0 && pointers.size === 0
    ? { input: target.dataset.input, x: event.clientX, y: event.clientY, id: event.pointerId }
    : null;
});
viewport.addEventListener('pointerup', (event) => {
  if (tap && tap.id === event.pointerId && Math.hypot(event.clientX - tap.x, event.clientY - tap.y) < 8) {
    toggleInput(tap.input);
  }
  tap = null;
});
viewport.addEventListener('pointercancel', () => { tap = null; });

viewport.addEventListener('pointerdown', (event) => {
  if (event.button !== 0 || pointers.size >= 2) return;
  if (event.pointerType !== 'touch' && camera.zoom === 1) return;
  pointers.set(event.pointerId, viewportPoint(event));
  viewport.setPointerCapture(event.pointerId);
});
viewport.addEventListener('pointermove', (event) => {
  if (!pointers.has(event.pointerId)) return;
  const before = pointerGeometry();
  pointers.set(event.pointerId, viewportPoint(event));
  const after = pointerGeometry();
  const pinch = pointers.size === 2;
  if (pinch && (before.distance < 1 || after.distance < 1)) return;
  const zoom = pinch ? camera.zoom * after.distance / before.distance : camera.zoom;
  zoomBetween(zoom, before.point, after.point);
  viewport.classList.toggle('is-dragging', !pinch && camera.zoom > 1);
});
for (const eventName of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  viewport.addEventListener(eventName, (event) => {
    if (pointers.delete(event.pointerId)) viewport.classList.remove('is-dragging');
  });
}



byId('zoom-in').onclick = () => zoomBy(.25);
byId('zoom-out').onclick = () => zoomBy(-.25);
viewport.addEventListener('keydown', (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const directions = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const direction = directions[event.key];
  if (direction && camera.zoom > 1) {
    event.preventDefault();
    setCamera(camera.x + direction[0] * 28 / camera.zoom, camera.y + direction[1] * 28 / camera.zoom, camera.zoom);
  } else if (event.key === '+' || event.key === '=' || event.key === '-') {
    event.preventDefault();
    zoomBy(event.key === '-' ? -.25 : .25);
  } else if (event.key === '0') {
    event.preventDefault();
    resetView();
  }
});
setCamera(0, 0, 1);
// Virtual memory. Processes A and B each see pages 0–3 of their own; a page table maps each page to a
// frame of RAM or a slot on the disk. Frames 0 and 3 hold the operating system.
const lesson = [
  {
    label: '주소 바꾸기',
    readingRows: [["프로세스 A", "가상 페이지 0", "A의 표", "프레임 1"], ["프로세스 B", "가상 페이지 0", "B의 표", "프레임 2"]],
    example: ["A와 B 모두 페이지 0 읽기", "각자의 페이지 표 조회", "A는 프레임 1 · B는 프레임 2"],
    title: '프로그램이 보는 주소는 진짜 주소가 아니다',
    body: '5.1에서 프로세스마다 메모리가 따로였습니다. 비결은 가상 메모리입니다. 프로그램은 0번 페이지, 1번 페이지처럼 자기만의 가상 주소를 쓰고, 운영체제가 만든 페이지 테이블이 이를 RAM의 실제 칸(프레임)으로 바꿉니다. 주소를 바꾸는 일은 CPU 안의 하드웨어(MMU)가 매번 해 줍니다.',
    takeaway: 'A의 0번 페이지는 프레임 1에, B의 0번 페이지는 프레임 2에 있습니다. 둘 다 "0번"이라고 부르지만 실제 칸이 달라 서로 섞이지 않습니다.',
    description: '왼쪽에 프로세스 A와 B의 가상 페이지 0–3, 가운데에 RAM 프레임 여덟 개, 오른쪽에 디스크가 있습니다. 페이지마다 페이지 테이블이 가리키는 곳으로 선이 이어집니다.',
    mode: 'map',
    tasks: [
      { text: 'A의 0번 페이지와 B의 0번 페이지를 차례로 읽어 보세요.', test: (s) => s.read.has('A0') && s.read.has('B0'), ok: '같은 0번인데 프레임 1과 프레임 2로 갑니다.' },
      { ask: 'A와 B가 둘 다 "0번 페이지"에 값을 쓰면?', choices: ['서로 덮어쓴다', '각자 다른 프레임에 써서 섞이지 않는다'], answer: '각자 다른 프레임에 써서 섞이지 않는다', why: '페이지 테이블이 프로세스마다 따로 있어 같은 가상 번호도 다른 실제 칸으로 바뀝니다.' },
    ],
  },
  {

const motion = matchMedia('(prefers-reduced-motion: reduce)');
const storageKey = 'virtual-lab:v1:step';
const startTable = () => ({ A0: 'F1', A1: 'F4', A2: 'F6', A3: 'D0', B0: 'F2', B1: 'F5', B2: 'D1', B3: 'F7' });
const state = { index: 0, table: startTable(), lastUse: {}, clock: 0, read: new Set(), blocked: false, faults: 0, flash: null,
  playing: !motion.matches, wait: 0, solved: '', wrong: '', demoPosition: 0 };
const progress = lesson.map(() => 0);

const project = (x, y, z = 0) => [14 * (x + y), 7 * (x - y) - z];
const point = (x, y, z) => project(x, y, z).map((value) => +value.toFixed(2)).join(',');
const flat = (u, v, z = 0) => [14 * u, 7 * v - z];
const gridLines = [];
for (let i = -24; i <= 40; i += 2) gridLines.push(`M${point(i, -24, 0)}L${point(i, 40, 0)}M${point(-24, i, 0)}L${point(40, i, 0)}`);
byId('grid').setAttribute('d', gridLines.join(''));
function drawBox(node, h, H, cls) {
  const g = svg('g', { class: 'box ' + cls }, node);
  const faces = {
    left: [[-h, -h, 0], [h, -h, 0], [h, -h, H], [-h, -h, H]],
    right: [[h, -h, 0], [h, h, 0], [h, h, H], [h, -h, H]],
    top: [[-h, -h, H], [h, -h, H], [h, h, H], [-h, h, H]],
  };
  for (const [name, corners] of Object.entries(faces)) svg('polygon', { class: 'face ' + name, points: corners.map((p) => point(...p)).join(' ') }, g);
  return g;
}
function text(parent, x, y, value, cls) { const t = svg('text', { x, y, class: cls }, parent); t.textContent = value; return t; }

// ---------- Layout ----------
const rowsV = [-7.8, -2.6, 2.6, 7.8];
const pagePos = (p) => [p[0] === 'A' ? 0 : 4.6, rowsV[Number(p[1])]];
const framePos = (f) => { const n = Number(f.slice(1)); return [12.6 + (n % 2) * 3.8, rowsV[Math.floor(n / 2)]]; };
const diskPos = (d) => [23.4, rowsV[Number(d.slice(1))] + 2.6];
const where = (target) => target[0] === 'F' ? framePos(target) : diskPos(target);
const ownerOf = (frame) => Object.entries(state.table).find(([, t]) => t === frame)?.[0];

function paint() {
  for (const id of ['casings', 'links', 'nodes', 'packets']) byId(id).replaceChildren();
  // Zones.
  const zone = (u0, u1, label, cls) => {
    svg('polygon', { class: 'zone ' + cls, points: [[u0, -10.4], [u1, -10.4], [u1, 10.4], [u0, 10.4]].map(([u, v]) => flat(u, v).join(',')).join(' ') }, byId('casings'));
    text(byId('casings'), 14 * (u0 + u1) / 2, flat(0, 10.4)[1] + 20, label, 'zone-label');
  };
  zone(-1.6, 6.2, '가상 주소 (프로세스가 보는 것)', 'virtual');
  zone(10.8, 18.2, 'RAM 프레임', 'ram');
  zone(21.6, 25.2, '디스크', 'disk');
  // Mapping lines.
  for (const [page, target] of Object.entries(state.table)) {
    const a = flat(...pagePos(page), 4), b = flat(...where(target), 4);
    const cls = 'map ' + page[0] + (state.flash?.page === page ? ' hot' : '') + (target[0] === 'D' ? ' to-disk' : '');
    svg('path', { class: cls, d: `M${a.join(' ')}C${a[0] + 60} ${a[1]} ${b[0] - 60} ${b[1]} ${b.join(' ')}` }, byId('links'));
  }
  if (state.flash?.blocked) {
    const a = flat(...pagePos('A1'), 4), b = flat(...framePos('F5'), 4);
    svg('path', { class: 'map blocked', d: `M${a.join(' ')}L${b.join(' ')}` }, byId('links'));
    text(byId('packets'), (a[0] + b[0]) / 2, (a[1] + b[1]) / 2 - 6, '✗ 길 없음', 'blocked-label');
  }
  // Pages.
  for (const page of Object.keys(state.table)) {
    const g = svg('g', { class: 'node', transform: `translate(${flat(...pagePos(page)).join(' ')})` }, byId('nodes'));
    drawBox(g, .78, 8, 'page ' + page[0] + (state.flash?.page === page ? ' hot' : ''));
    text(g, 0, -7.5, `${page[0]}${page[1]}`, 'box-label');
  }
  text(byId('nodes'), ...flat(0, -10.4).map((n, i) => n + (i ? -8 : 0)), '프로세스 A', 'col-label A');
  text(byId('nodes'), ...flat(4.6, -10.4).map((n, i) => n + (i ? -8 : 0)), '프로세스 B', 'col-label B');
  // Frames.
  for (let n = 0; n < 8; n++) {
    const f = `F${n}`;
    const owner = ownerOf(f);
    const g = svg('g', { class: 'node', transform: `translate(${flat(...framePos(f)).join(' ')})` }, byId('nodes'));
    drawBox(g, .82, 6, 'frame ' + (owner ? owner[0] : 'os') + (state.flash?.frame === f ? ' hot' : '') + (state.flash?.evicted === f ? ' swapped' : ''));
    text(g, 0, -5.5, owner ? `${owner[0]}${owner[1]}` : 'OS', 'box-label');
    text(g, 0, 7 * .82 + 12, `프레임 ${n}`, 'frame-num');
  }
  // Disk slots.
  for (const d of ['D0', 'D1']) {
    const owner = ownerOf(d);
    const g = svg('g', { class: 'node', transform: `translate(${flat(...diskPos(d)).join(' ')})` }, byId('nodes'));
    drawBox(g, .82, 6, 'slot ' + (owner ? owner[0] : 'empty'));
    text(g, 0, -5.5, owner ? `${owner[0]}${owner[1]}` : '–', 'box-label');
  }
  const left = 14 * -1.6 - 30, right = 14 * 25.2 + 20, top = 7 * -10.4 - 24, bottom = 7 * 10.4 + 30;
  const scale = Math.min(1.6, 590 / (right - left), 268 / (bottom - top));
  byId('world').setAttribute('transform', `translate(${(310 - scale * (left + right) / 2).toFixed(1)} ${(140 - scale * (top + bottom) / 2).toFixed(1)}) scale(${scale.toFixed(3)})`);
  syncTables();
}
function syncTables() {
  for (const p of ['A', 'B']) {
    const table = byId('table-' + p);
    table.replaceChildren(Object.assign(document.createElement('caption'), { textContent: `${p}의 페이지 테이블` }));
    const head = document.createElement('tr');
    for (const h of ['가상 페이지', '있는 곳']) head.append(Object.assign(document.createElement('th'), { textContent: h }));
    table.append(head);
    for (let k = 0; k < 4; k++) {
      const t = state.table[`${p}${k}`];
      const tr = document.createElement('tr');
      tr.append(Object.assign(document.createElement('td'), { textContent: k }));
      tr.append(Object.assign(document.createElement('td'), { textContent: t[0] === 'F' ? `프레임 ${t.slice(1)}` : `디스크 ${t.slice(1)}`, className: t[0] === 'D' ? 'disk' : '' }));
      if (state.flash?.page === `${p}${k}`) tr.className = 'hot';
      table.append(tr);
    }
  }
}

// ---------- Actions ----------
function readPage(page, user) {
  state.clock++;
  const target = state.table[page];
  state.read.add(page);
  if (target[0] === 'F') {
    state.lastUse[page] = state.clock;
    state.flash = { page, frame: target };
    report(`${page[0]}의 ${page[1]}번 페이지 → 페이지 테이블 → 프레임 ${target.slice(1)}. RAM에서 바로 읽습니다.`);
  } else {
    // Page fault: evict the least recently used page in RAM to this disk slot, bring the page in.
    const inRam = Object.keys(state.table).filter((p) => state.table[p][0] === 'F');
    const victim = inRam.sort((a, b) => (state.lastUse[a] ?? 0) - (state.lastUse[b] ?? 0))[0];
    const frame = state.table[victim];
    state.table[victim] = target;
    state.table[page] = frame;
    state.lastUse[page] = state.clock;
    state.faults++;
    state.flash = { page, frame, evicted: frame };
    report(`페이지 부재! ${page[0]}의 ${page[1]}번은 디스크에 있습니다. 가장 오래 안 쓴 ${victim[0]}의 ${victim[1]}번을 디스크로 내리고, 프레임 ${frame.slice(1)}에 ${page[0]}의 ${page[1]}번을 올렸습니다. (부재 ${state.faults}번)`);
  }
  paint();
  if (user) afterUser();
}
function tryForbidden(user) {
  state.blocked = true;
  state.flash = { blocked: true };
  paint();
  report('A가 프레임 5(B의 1번 페이지)를 읽으려 했지만, A의 페이지 테이블에는 프레임 5로 가는 줄이 없습니다. MMU가 막고 운영체제가 A를 멈춥니다(세그멘테이션 오류).');
  if (user) afterUser();
}
function resetAll() {
  state.table = startTable();
  state.lastUse = { A0: 1, A1: 2, A2: 3, B0: 0, B1: 4, B3: 5 };
  state.clock = 6;
  state.read = new Set();
  state.blocked = false;
  state.faults = 0;
  state.flash = null;
  paint();
}
function buildControls() {
  const mode = lesson[state.index].mode;
  for (const p of ['A', 'B']) {
    const row = byId('row-' + p);
    row.replaceChildren(Object.assign(document.createElement('span'), { className: 'row-name', textContent: `${p} 읽기` }));
    for (let k = 0; k < 4; k++) {
      const b = Object.assign(document.createElement('button'), { type: 'button', className: 'action page-button ' + p, textContent: `${k}번 페이지` });
      b.addEventListener('click', () => { takeOver(); readPage(`${p}${k}`, true); });
      row.append(b);
    }
  }
  const extra = byId('extra');
  extra.replaceChildren();
  if (mode === 'protect') {
    const b = Object.assign(document.createElement('button'), { type: 'button', className: 'action primary', textContent: 'A가 프레임 5(B의 것) 읽기' });
    b.addEventListener('click', () => { takeOver(); tryForbidden(true); });
    extra.append(b);
  }
  const r = Object.assign(document.createElement('button'), { type: 'button', className: 'action', textContent: '처음 상태로' });
  r.addEventListener('click', () => { takeOver(); resetAll(); report('처음 상태로 되돌렸습니다.'); });
  extra.append(r);
}
function report(text) { byId('readout').textContent = text; byId('announcement').textContent = text; }

// ---------- Tasks ----------
const currentTask = () => lesson[state.index].tasks[progress[state.index]];
function syncTask() {
  const tasks = lesson[state.index].tasks;
  const task = currentTask();
  const choices = byId('try-choices');
  choices.replaceChildren();
  byId('try').classList.toggle('solved', Boolean(state.solved) && !task?.ask);
  if (task?.ask) {
    byId('try-text').textContent = task.ask;
    byId('try-result').textContent = state.wrong || (state.solved ? `✓ 맞았습니다. ${state.solved}` : '');
    for (const choice of task.choices) {
      const b = Object.assign(document.createElement('button'), { type: 'button', className: 'action choice-button', textContent: choice });
      b.addEventListener('click', () => answer(choice));
      choices.append(b);
    }
    return;
  }
  byId('try-text').textContent = task ? task.text : (state.solved ? '' : '이 단계의 문제를 모두 풀었습니다. 자유롭게 해 보세요.');
  byId('try-result').textContent = state.solved ? `✓ 맞았습니다. ${state.solved}${progress[state.index] >= tasks.length ? ' · 이 단계의 문제를 모두 풀었습니다.' : ''}` : '';
}
// Only the learner's own actions count, so the demo cannot solve a problem.
function afterUser() {
  const task = currentTask();
  if (task && !task.ask && task.test(state)) { progress[state.index]++; state.solved = task.ok; state.wrong = ''; }
  syncTask();
}
function answer(choice) {
  const task = currentTask();
  if (choice !== task.answer) { state.wrong = `✗ ${choice}이(가) 아닙니다. 다시 골라 보세요.`; syncTask(); return; }
  progress[state.index]++;
  state.wrong = '';
  state.solved = task.why;
  syncTask();
}

// ---------- Demo ----------
let frame = null, lastFrame = null;
function takeOver() {
  if (!state.playing) return;
  state.playing = false;
  resetAll();
  syncPlayback();
}
const demoPlans = { map: ['A0', 'B0', 'A2', 'B3'], protect: ['A1', 'forbid', 'B1'], fault: ['A0', 'A3', 'B2', 'A1', 'reset'] };
function demoTick() {
  document.querySelector('.course-step-preview')?.dispatchEvent(new Event('course-playback-start'));
  const plan = demoPlans[lesson[state.index].mode];
  const step = plan[state.demoPosition++ % plan.length];
  if (step === 'forbid') tryForbidden(false);
  else if (step === 'reset') resetAll();
  else readPage(step, false);
  state.wait = 2600;
}
function tick(now) {
  frame = null;
  const elapsed = lastFrame === null ? 0 : Math.min(now - lastFrame, 80);
  lastFrame = now;
  if (state.playing) {
    state.wait -= elapsed;
    if (state.wait <= 0) demoTick();
    frame = requestAnimationFrame(tick);
  } else lastFrame = null;
}
function syncPlayback() {
  const reduced = motion.matches;
  if (reduced) state.playing = false;
  if (state.playing && frame === null) frame = requestAnimationFrame(tick);
}

// ---------- Steps and routing ----------
function showStep(index, announce = true) {
  state.index = index;
  state.playing = !motion.matches;
  const s = lesson[index];
  state.solved = '';
  state.wrong = '';
  state.demoPosition = 0;
  byId('step-title').textContent = s.title;
  byId('body').textContent = s.body;
  byId('takeaway').textContent = s.takeaway;
  byId('scene-desc').textContent = s.description;
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  stepButtons.forEach((button, i) => {
    if (i === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  try { localStorage.setItem(storageKey, String(index)); } catch {}
  buildControls();
  resetAll();
  report('읽을 페이지를 눌러 보세요.');
  syncTask();
  state.wait = 900;
  syncPlayback();
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${s.title}`;
}
function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/virtual/${index + 1}`);
  showStep(index);
}
function routeIndex() {
  const match = /^#\/virtual\/(\d+)$/.exec(location.hash);
  const routed = match ? Number(match[1]) - 1 : -1;
  if (routed >= 0 && routed < lesson.length) return routed;
  try {
    const stored = localStorage.getItem(storageKey);
    const index = Number(stored);
    if (stored !== null && Number.isInteger(index) && index >= 0 && index < lesson.length) return index;
  } catch {}
  return 0;
}
const stepButtons = lesson.map(({ label }, index) => {
  const listItem = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  const number = document.createElement('span');
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.addEventListener('click', () => goToStep(index));
  listItem.append(button);
  byId('steps').append(listItem);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
motion.addEventListener('change', () => {
  if (!motion.matches) state.playing = true;
  syncPlayback();
});
window.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});
const initial = routeIndex();
history.replaceState(null, '', `#/virtual/${initial + 1}`);
state.index = -1;
showStep(initial, false);
</script>
</body>
