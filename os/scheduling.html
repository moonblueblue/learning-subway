    <h1>CPU 스케줄링</h1>
    <p class="lead">CPU 하나가 여러 일을 어떻게 번갈아 할까요? 같은 세 일을 여러 방법으로 줄 세워 기다린 시간을 비교해 보세요.</p>

<script>
const byId = (id) => document.getElementById(id);
const viewport = byId('scene');
const viewWidth = 620;
const viewHeight = 280;
const maxZoom = 3;
const center = { x: viewWidth / 2, y: viewHeight / 2 };
const camera = { x: 0, y: 0, zoom: 1 };
const pointers = new Map();
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));



// Convert from screen pixels to fixed viewport coordinates, accounting for SVG letterboxing.


// A press that starts on a switch and ends without moving toggles that switch.
// Tracked separately from the camera pointers so it also works when the pointer is captured.
let tap = null;
viewport.addEventListener('pointerdown', (event) => {
  const target = event.target.closest?.('[data-input]');
  tap = target && event.button === 0 && pointers.size === 0
    ? { input: target.dataset.input, x: event.clientX, y: event.clientY, id: event.pointerId }
    : null;
});
viewport.addEventListener('pointerup', (event) => {
  if (tap && tap.id === event.pointerId && Math.hypot(event.clientX - tap.x, event.clientY - tap.y) < 8) {
    toggleInput(tap.input);
  }
  tap = null;
});
viewport.addEventListener('pointercancel', () => { tap = null; });

viewport.addEventListener('pointerdown', (event) => {
  if (event.button !== 0 || pointers.size >= 2) return;
  if (event.pointerType !== 'touch' && camera.zoom === 1) return;
  pointers.set(event.pointerId, viewportPoint(event));
  viewport.setPointerCapture(event.pointerId);
});
viewport.addEventListener('pointermove', (event) => {
  if (!pointers.has(event.pointerId)) return;
  const before = pointerGeometry();
  pointers.set(event.pointerId, viewportPoint(event));
  const after = pointerGeometry();
  const pinch = pointers.size === 2;
  if (pinch && (before.distance < 1 || after.distance < 1)) return;
  const zoom = pinch ? camera.zoom * after.distance / before.distance : camera.zoom;
  zoomBetween(zoom, before.point, after.point);
  viewport.classList.toggle('is-dragging', !pinch && camera.zoom > 1);
});
for (const eventName of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  viewport.addEventListener(eventName, (event) => {
    if (pointers.delete(event.pointerId)) viewport.classList.remove('is-dragging');
  });
}



byId('zoom-in').onclick = () => zoomBy(.25);
byId('zoom-out').onclick = () => zoomBy(-.25);
viewport.addEventListener('keydown', (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const directions = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const direction = directions[event.key];
  if (direction && camera.zoom > 1) {
    event.preventDefault();
    setCamera(camera.x + direction[0] * 28 / camera.zoom, camera.y + direction[1] * 28 / camera.zoom, camera.zoom);
  } else if (event.key === '+' || event.key === '=' || event.key === '-') {
    event.preventDefault();
    zoomBy(event.key === '-' ? -.25 : .25);
  } else if (event.key === '0') {
    event.preventDefault();
    resetView();
  }
});
setCamera(0, 0, 1);
// CPU scheduling. Three jobs wait in the ready queue; one CPU runs one at a time. A policy decides the
// order, the run is worked out in advance as one entry per time unit, and the scene plays it back.
const jobs = [
  { id: 'P1', name: '동영상 변환', burst: 8, color: '#7a87b5' },
  { id: 'P2', name: '메일 보내기', burst: 4, color: '#4f9189' },
  { id: 'P3', name: '키 입력', burst: 2, color: '#c26a1e' },
];
const policies = {
  fcfs: { name: '먼저 온 순서 (FCFS)' },
  sjf: { name: '짧은 것 먼저 (SJF)' },
  rr: { name: '돌아가며 (라운드 로빈)' },
};
// Work out the run: timeline[t] = job id running in unit t; also count context switches.
function simulate(policy, slice = 2) {
  const left = Object.fromEntries(jobs.map((j) => [j.id, j.burst]));
  let queue = policy === 'sjf' ? [...jobs].sort((a, b) => a.burst - b.burst).map((j) => j.id) : jobs.map((j) => j.id);
  const timeline = [];
  while (queue.length) {
    const id = queue.shift();
    const run = policy === 'rr' ? Math.min(slice, left[id]) : left[id];
    for (let k = 0; k < run; k++) timeline.push(id);
    left[id] -= run;
    if (left[id] > 0) queue.push(id);
  }
  const finish = {}, firstRun = {};
  timeline.forEach((id, t) => { finish[id] = t + 1; if (firstRun[id] === undefined) firstRun[id] = t; });
  const wait = Object.fromEntries(jobs.map((j) => [j.id, finish[j.id] - j.burst]));
  const switches = timeline.filter((id, t) => t > 0 && timeline[t - 1] !== id).length;
  const avg = (o) => Math.round(10 * Object.values(o).reduce((a, b) => a + b, 0) / jobs.length) / 10;
  return { policy, slice, timeline, finish, firstRun, wait, switches, avgWait: avg(wait), avgFirst: avg(firstRun) };
}

const lesson = [
  {
    label: '먼저 온 순서',
    readingSchedule: {"policy": "fcfs", "slice": 2},
    example: ["작업 길이 8, 4, 2", "도착 순서대로 실행", "평균 대기 6.7"],
    title: 'CPU는 하나, 기다리는 일은 여럿',
    body: 'CPU 하나는 한 번에 한 프로세스(5.1)만 실행합니다. 실행할 차례를 기다리는 프로세스들은 준비 큐(4.3)에 줄을 섭니다. 무엇을 먼저 실행할지 정하는 것이 운영체제의 스케줄러입니다. 가장 단순한 방법은 먼저 온 순서대로 끝까지 실행하는 것입니다(FCFS).',
    takeaway: '긴 동영상 변환(8)이 먼저 오면 짧은 키 입력(2)은 12만큼 기다립니다. 평균 기다린 시간은 (0 + 8 + 12) ÷ 3 ≈ 6.7입니다. 긴 일 뒤에 짧은 일들이 줄줄이 막히는 것을 호송 효과라 합니다.',
    description: '왼쪽 준비 큐에 일 세 개가 서 있고, 가운데 CPU가 하나씩 실행합니다. 아래 바닥에는 시간 칸마다 어떤 일이 CPU를 썼는지 색 블록이 쌓입니다.',
    policies: ['fcfs'],

const motion = matchMedia('(prefers-reduced-motion: reduce)');
const storageKey = 'scheduling-lab:v1:step';
const state = { index: 0, policy: 'fcfs', slice: 2, run: null, t: 0, auto: false, results: {}, log: [], playing: !motion.matches,
  wait: 0, solved: '', wrong: '', demoPosition: 0, user: false, next: 0 };
const progress = lesson.map(() => 0);

const project = (x, y, z = 0) => [14 * (x + y), 7 * (x - y) - z];
const point = (x, y, z) => project(x, y, z).map((value) => +value.toFixed(2)).join(',');
const flat = (u, v, z = 0) => [14 * u, 7 * v - z];
const gridLines = [];
for (let i = -24; i <= 40; i += 2) gridLines.push(`M${point(i, -24, 0)}L${point(i, 40, 0)}M${point(-24, i, 0)}L${point(40, i, 0)}`);
byId('grid').setAttribute('d', gridLines.join(''));
function drawBox(node, h, H, fill, stroke) {
  const faces = {
    left: [[-h, -h, 0], [h, -h, 0], [h, -h, H], [-h, -h, H]],
    right: [[h, -h, 0], [h, h, 0], [h, h, H], [h, -h, H]],
    top: [[-h, -h, H], [h, -h, H], [h, h, H], [-h, h, H]],
  };
  const shade = { left: .25, right: .05, top: .55 };
  for (const [name, corners] of Object.entries(faces)) {
    svg('polygon', { class: 'face', points: corners.map((p) => point(...p)).join(' '), fill: fill ? mixWhite(fill, shade[name]) : undefined, stroke }, node);
  }
}
// Lighten a colour toward white by k (0 = as is, 1 = white): tops lightest, right faces darkest.
function mixWhite(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const c = [n >> 16, n >> 8 & 255, n & 255].map((v) => Math.round(v + (255 - v) * k));
  return `rgb(${c.join(',')})`;
}
const jobOf = (id) => jobs.find((j) => j.id === id);
function text(parent, x, y, value, cls) { const t = svg('text', { x, y, class: cls }, parent); t.textContent = value; return t; }

// ---------- Scene (redrawn every time unit) ----------
const unitU = 1.1;
function paint() {
  for (const id of ['casings', 'links', 'nodes', 'packets']) byId(id).replaceChildren();
  const preview = document.querySelector(motion.matches ? '.workspace.course-reading' : '.workspace.course-reading.course-step-preview') ? lesson[state.index].readingSchedule : null;
  const run = preview ? simulate(preview.policy, preview.slice) : state.run;
  const t = preview ? run.timeline.length : state.t;
  const timeline = run ? run.timeline.slice(0, t) : [];
  const left = Object.fromEntries(jobs.map((j) => [j.id, j.burst - timeline.filter((id) => id === j.id).length]));
  const current = run && t > 0 && t <= run.timeline.length ? run.timeline[t - 1] : null;
  // Ready queue: who is waiting now, in queue order (derived from the rest of the timeline).
  const upcoming = run ? [...new Set(run.timeline.slice(t))].filter((id) => id !== (run.timeline[t] === current ? current : null)) : jobs.map((j) => j.id);
  const waiting = upcoming.filter((id) => left[id] > 0 && id !== current);
  // Floor marks.
  const zone = (u0, u1, v0, v1, label, cls) => {
    svg('polygon', { class: 'zone ' + cls, points: [[u0, v0], [u1, v0], [u1, v1], [u0, v1]].map(([u, v]) => flat(u, v).join(',')).join(' ') }, byId('casings'));
    text(byId('casings'), ...flat(u0 + .8, v1).map((n, i) => n + (i ? 15 : 0)), label, 'zone-label');
  };
  zone(-1, 8.2, -7.5, -2.4, '준비 큐', 'queue');
  zone(13.6, 22, -7.5, -2.4, '끝난 일', 'done');
  // CPU.
  const cpu = svg('g', { class: 'node cpu', transform: `translate(${flat(10.9, -5).join(' ')})` }, byId('nodes'));
  drawShadow(cpu, 1.6);
  drawBox(cpu, 1.6, 9, '#3f4f4a', '#26322e');
  text(cpu, 0, 38, 'CPU', 'zone-label dark');
  if (current) drawJob(current, 10.9, -5, left[current] + 1, true, 9);
  waiting.forEach((id, k) => drawJob(id, 6.4 - k * 2.9, -5, left[id], false, 0));
  jobs.filter((j) => left[j.id] === 0 && j.id !== current).forEach((j, k) => drawJob(j.id, 15.4 + k * 2.7, -5, 0, false, 0, true));
  // Gantt strip on the floor: one cube per time unit.
  const total = jobs.reduce((s, j) => s + j.burst, 0);
  for (let k = 0; k < total; k++) {
    const u = k * unitU, v = 4;
    const cell = svg('g', { class: 'node cell', transform: `translate(${flat(u, v).join(' ')})` }, byId('nodes'));
    if (k < timeline.length) {
      const prev = timeline[k - 1];
      drawBox(cell, .48, 7, jobOf(timeline[k]).color, '#26322e');
      if (k > 0 && prev !== timeline[k]) svg('path', { class: 'switch-mark', d: `M${flat(-.55, -1.2).join(' ')}L${flat(-.55, 1.1, 0).join(' ')}` }, cell);
    } else {
      svg('polygon', { class: 'empty-cell', points: [[-.48, -.48], [.48, -.48], [.48, .48], [-.48, .48]].map(([x, y]) => point(x, y, 0)).join(' ') }, cell);
    }
    if (k % 2 === 0) text(cell, 0, 22, k, 'tick');
  }
  text(byId('casings'), ...flat(-1.4, 4).map((n, i) => n - (i ? 0 : 30)), '시간', 'zone-label');
  const right = 14 * 22 + 20, leftX = -60, top = -96, bottom = 7 * 4 + 34;
  // A still picture keeps a strip at the top for a note on what the order achieved.
  const strip = preview ? 30 : 0;
  const scale = Math.min(1.7, 590 / (right - leftX), (268 - strip) / (bottom - top));
  byId('world').setAttribute('transform', `translate(${(310 - scale * (leftX + right) / 2).toFixed(1)} ${(140 + strip / 2 - scale * (top + bottom) / 2).toFixed(1)}) scale(${scale.toFixed(3)})`);
  byId('example-note')?.remove();
  if (preview) {
    const finish = (id) => timeline.lastIndexOf(id) + 1;
    const first = (id) => timeline.indexOf(id);
    const switches = timeline.filter((id, k) => k && id !== timeline[k - 1]).length;
    if (preview.policy === 'rr') {
      exampleNote(`시간 조각 ${preview.slice} → 첫 실행 ${jobs.map((j) => `${j.id} ${first(j.id)}`).join(' · ')} · 교대 ${switches}번`);
    } else {
      const waits = jobs.map((j) => finish(j.id) - j.burst);
      const order = [...new Set(timeline)].map((id) => jobOf(id).burst).join(' → ');
      exampleNote(`${preview.policy === 'sjf' ? '짧은 일 먼저' : '도착 순서대로'} (${order}) → 대기 ${jobs.map((j, k) => `${j.id} ${waits[k]}`).join(' · ')} → 평균 ${(waits.reduce((a, b) => a + b, 0) / waits.length).toFixed(1)}`);
    }
  }
  syncStats(timeline, current);
}
// A job is a short block whose height shows the work left.
function drawJob(id, u, v, left, running, lift, done = false) {
  const job = jobOf(id);
  const g = svg('g', { class: 'node job' + (running ? ' running' : '') + (done ? ' finished' : ''), transform: `translate(${flat(u, v, lift).join(' ')})` }, byId('nodes'));
  if (!running) drawShadow(g, 1);
  const H = Math.max(left, done ? .6 : 1) * 5;
  drawBox(g, 1, H, job.color, '#26322e');
  text(g, 0, -H - 22, id, 'job-id');
  text(g, 0, -H - 10, done ? '끝' : `남은 ${left}`, 'job-left');
}

// ---------- Stats ----------
function syncStats(timeline, current) {
  const t = state.t;
  byId('clock').textContent = `시각 ${t}`;
  byId('now').textContent = current ? `${current} ${jobOf(current).name} 실행 중` : t === 0 ? '시작 전' : '모두 끝남';
  const run = state.run;
  const done = run && t >= run.timeline.length;
  byId('switches').textContent = run ? timeline.filter((id, k) => k > 0 && timeline[k - 1] !== id).length : 0;
  const table = byId('table');
  table.replaceChildren(Object.assign(document.createElement('caption'), { textContent: '기록 · 같은 세 일을 방법마다 실행한 결과' }));
  const head = document.createElement('tr');
  for (const name of ['방법', 'P1 기다림', 'P2 기다림', 'P3 기다림', '평균 기다림', '첫 실행까지 평균', '문맥 교환']) head.append(Object.assign(document.createElement('th'), { textContent: name }));
  table.append(head);
  for (const r of state.log) {
    const tr = document.createElement('tr');
    for (const v of [r.policy === 'rr' ? `라운드 로빈 (조각 ${r.slice})` : policies[r.policy].name, r.wait.P1, r.wait.P2, r.wait.P3, r.avgWait, r.avgFirst, r.switches]) tr.append(Object.assign(document.createElement('td'), { textContent: v }));
    table.append(tr);
  }
  if (!state.log.length) {
    const tr = document.createElement('tr');
    tr.append(Object.assign(document.createElement('td'), { textContent: '실행을 끝까지 하면 여기에 쌓입니다', colSpan: 7, className: 'empty' }));
    table.append(tr);
  }
  byId('run-all').disabled = Boolean(run && state.auto);
  void done;
}

// ---------- Running ----------
function start(policy, slice) {
  state.policy = policy;
  if (slice) state.slice = slice;
  state.run = simulate(policy, state.slice);
  state.t = 0;
  state.auto = false;
  syncPicks();
  paint();
}
function stepOnce(user) {
  const run = state.run;
  if (!run || state.t >= run.timeline.length) return;
  state.t++;
  const id = run.timeline[state.t - 1];
  const switched = state.t > 1 && run.timeline[state.t - 2] !== id;
  report(`시각 ${state.t - 1}–${state.t}: ${id} ${jobOf(id).name}${switched ? ' · 문맥 교환' : ''}`);
  paint();
  if (state.t >= run.timeline.length) finish(user);
}
function finish(user) {
  state.auto = false;
  const run = state.run;
  const key = run.policy === 'rr' ? (lesson[state.index].slices ? `rr${run.slice}` : 'rr') : run.policy;
  state.log = state.log.filter((r) => !(r.policy === run.policy && r.slice === run.slice));
  state.log.push(run);
  paint();
  report(`끝: 평균 기다린 시간 ${run.avgWait}, 첫 실행까지 평균 ${run.avgFirst}, 문맥 교환 ${run.switches}번`);
  if (user) { state.results[key] = true; if (run.policy === 'rr') state.results.rr = true; afterUser(); }
}
function runAll(user) {
  if (!state.run || state.t >= state.run.timeline.length) start(state.policy);
  state.auto = true;
  state.user = user;
  state.next = 0;
  if (motion.matches) { while (state.t < state.run.timeline.length) stepOnce(user); }
  else kick();
}
function buildControls() {
  const step = lesson[state.index];
  const row = byId('policy-row');
  row.replaceChildren(Object.assign(document.createElement('span'), { className: 'row-name', textContent: '방법' }));
  for (const id of step.policies) {
    const b = Object.assign(document.createElement('button'), { type: 'button', className: 'action pick', textContent: policies[id].name });
    b.dataset.policy = id;
    b.addEventListener('click', () => { takeOver(); start(id); report(`${policies[id].name}를 골랐습니다. "실행"을 누르세요.`); });
    row.append(b);
  }
  const sliceRow = byId('slice-row');
  sliceRow.hidden = !step.slices;
  sliceRow.replaceChildren(Object.assign(document.createElement('span'), { className: 'row-name', textContent: '시간 조각' }));
  for (const s of step.slices ?? []) {
    const b = Object.assign(document.createElement('button'), { type: 'button', className: 'action pick', textContent: s });
    b.dataset.slice = s;
    b.addEventListener('click', () => { takeOver(); start('rr', s); report(`시간 조각 ${s}로 바꿨습니다.`); });
    sliceRow.append(b);
  }
}
function syncPicks() {
  [...byId('policy-row').querySelectorAll('button')].forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.policy === state.policy)));
  [...byId('slice-row').querySelectorAll('button')].forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.slice) === state.slice)));
}
byId('run-step').onclick = () => { takeOver(); if (!state.run || state.t >= state.run.timeline.length) start(state.policy); stepOnce(true); };
byId('run-all').onclick = () => { takeOver(); runAll(true); };
function report(text) { byId('readout').textContent = text; byId('announcement').textContent = text; }

// ---------- Tasks ----------
const currentTask = () => lesson[state.index].tasks[progress[state.index]];
function syncTask() {
  const tasks = lesson[state.index].tasks;
  const task = currentTask();
  const choices = byId('try-choices');
  choices.replaceChildren();
  byId('try').classList.toggle('solved', Boolean(state.solved) && !task?.ask);
  if (task?.ask) {
    byId('try-text').textContent = task.ask;
    byId('try-result').textContent = state.wrong || (state.solved ? `✓ 맞았습니다. ${state.solved}` : '');
    for (const choice of task.choices) {
      const b = Object.assign(document.createElement('button'), { type: 'button', className: 'action choice-button', textContent: choice });
      b.addEventListener('click', () => answer(choice));
      choices.append(b);
    }
    return;
  }
  byId('try-text').textContent = task ? task.text : (state.solved ? '' : '이 단계의 문제를 모두 풀었습니다. 자유롭게 해 보세요.');
  byId('try-result').textContent = state.solved ? `✓ 맞았습니다. ${state.solved}${progress[state.index] >= tasks.length ? ' · 이 단계의 문제를 모두 풀었습니다.' : ''}` : '';
}
// Only the learner's own runs count, so the demo cannot solve a problem.
function afterUser() {
  const task = currentTask();
  if (task && !task.ask && task.test(state.results)) { progress[state.index]++; state.solved = task.ok; state.wrong = ''; }
  syncTask();
}
function answer(choice) {
  const task = currentTask();
  if (choice !== task.answer) { state.wrong = `✗ ${choice}이(가) 아닙니다. 다시 골라 보세요.`; syncTask(); return; }
  progress[state.index]++;
  state.wrong = '';
  state.solved = task.why;
  syncTask();
}

// ---------- Frame loop and demo ----------
let frame = null, lastFrame = null;
function kick() { if (frame === null) frame = requestAnimationFrame(tick); }
function tick(now) {
  frame = null;
  const elapsed = lastFrame === null ? 0 : Math.min(now - lastFrame, 80);
  lastFrame = now;
  if (state.auto) {
    state.next -= elapsed;
    if (state.next <= 0) { stepOnce(state.user); state.next = 520; }
  } else if (state.playing) {
    state.wait -= elapsed;
    if (state.wait <= 0) demoTick();
  }
  if (state.auto || state.playing) frame = requestAnimationFrame(tick);
  else lastFrame = null;
}
function takeOver() {
  if (!state.playing) return;
  state.playing = false;
  state.auto = false;
  start(state.policy);
  syncPlayback();
}
function demoTick() {
  document.querySelector('.course-step-preview')?.dispatchEvent(new Event('course-playback-start'));
  const step = lesson[state.index];
  const options = step.slices ? step.slices.map((s) => ['rr', s]) : step.policies.map((p) => [p, 2]);
  const [policy, slice] = options[state.demoPosition++ % options.length];
  start(policy, slice);
  runAll(false);
  state.wait = state.run.timeline.length * 520 + 2600;
}
function syncPlayback() {
  const reduced = motion.matches;
  if (reduced) state.playing = false;
  if (state.playing) kick();
}

// ---------- Steps and routing ----------
function showStep(index, announce = true) {
  state.index = index;
  state.playing = !motion.matches;
  const s = lesson[index];
  state.solved = '';
  state.wrong = '';
  state.demoPosition = 0;
  state.results = {};
  state.log = [];
  state.auto = false;
  state.slice = 2;
  byId('step-title').textContent = s.title;
  byId('body').textContent = s.body;
  byId('takeaway').textContent = s.takeaway;
  byId('scene-desc').textContent = s.description;
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  stepButtons.forEach((button, i) => {
    if (i === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  try { localStorage.setItem(storageKey, String(index)); } catch {}
  buildControls();
  start(s.policies.at(-1), s.slices ? 2 : undefined);
  report('방법을 고르고 "실행"을 눌러 보세요.');
  syncTask();
  state.wait = 800;
  syncPlayback();
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${s.title}`;
}
function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/scheduling/${index + 1}`);
  showStep(index);
}
function routeIndex() {
  const match = /^#\/scheduling\/(\d+)$/.exec(location.hash);
  const routed = match ? Number(match[1]) - 1 : -1;
  if (routed >= 0 && routed < lesson.length) return routed;
  try {
    const stored = localStorage.getItem(storageKey);
    const index = Number(stored);
    if (stored !== null && Number.isInteger(index) && index >= 0 && index < lesson.length) return index;
  } catch {}
  return 0;
}
const stepButtons = lesson.map(({ label }, index) => {
  const listItem = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  const number = document.createElement('span');
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.addEventListener('click', () => goToStep(index));
  listItem.append(button);
  byId('steps').append(listItem);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
motion.addEventListener('change', () => {
  if (!motion.matches) state.playing = true;
  syncPlayback();
});
window.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});
const initial = routeIndex();
history.replaceState(null, '', `#/scheduling/${initial + 1}`);
state.index = -1;
showStep(initial, false);
</script>
</body>
