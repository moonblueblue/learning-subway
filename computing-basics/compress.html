<style>

.switch{cursor:pointer}

.switch .left{fill:#d3dad6;stroke:#8c9d96}

<body>
<main class="shell">
  <header>
    <p class="eyebrow">0장 컴퓨팅 둘러보기 · 레슨 0.9</p>
    <h1>압축</h1>
    <p class="lead">카드의 색을 묶어 적으면 언제 저장 공간이 줄어들까요?</p>
  </header>
  <div class="workspace">
    <div>
      <section class="panel" aria-labelledby="stage-heading">
        <div class="stage-top"><h2 id="stage-heading">그림과 압축 결과</h2></div>
        <div class="stage">
          <svg id="scene" viewBox="0 0 620 280" role="img" tabindex="0" aria-labelledby="scene-title scene-desc">
            <title id="scene-title">그림과 줄마다의 압축 결과</title><desc id="scene-desc"></desc>
            <defs>
              <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
              <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
              <radialGradient id="grid-fade"><stop offset=".45" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
              <mask id="grid-mask"><rect x="-460" y="-260" width="920" height="520" fill="url(#grid-fade)"/></mask>
            </defs>
            <g id="world" aria-hidden="true">
              <path id="grid" class="iso-grid" mask="url(#grid-mask)"></path>
              <g id="casings"></g><g id="links"></g><g id="nodes"></g>
            </g>
          </svg>
        </div>
        <div class="hands-on">
          <div class="try" id="try">
            <p><strong>해 보기</strong><span id="try-text"></span></p>
            <p class="try-result" id="try-result" role="status"></p>
            <button class="action" id="try-next" type="button" hidden>다음 문제</button>
          </div>
          <p class="readout" id="readout"></p>
          <div id="row-actions" class="row-actions" hidden>
            <p>왼쪽부터 같은 색이 끝나는 칸의 번호를 누르세요.</p>
            <div id="row-ends" class="row-ends" role="group" aria-label="묶음의 마지막 칸"></div>
            <button class="action" id="row-unfold" type="button">저장한 묶음 펼치기</button>
            <p id="row-feedback" class="row-feedback" role="status"></p>
          </div>
          <div id="pixel-controls">
            <div class="pixel-area">
              <div class="pixel-grid" id="pixel-grid" role="group" aria-label="픽셀 칠하기"></div>
              <div class="switch-actions">
                <button class="action" id="pixels-clear" type="button">모두 지우기</button>
                <button class="action" id="pixels-invert" type="button">반전</button>

              <select id="decode-value"><option>0</option><option>1</option></select></div>

              <select id="decode-length"></select></div>
          </div>
          <div class="choices" id="block-choice">
            <div class="choice" role="group" aria-label="묶는 크기"><span>묶는 크기</span><div id="block-choices"></div></div>

<script>
const byId = (id) => document.getElementById(id);
const viewport = byId('scene');
const workspace = viewport.closest('.workspace');
const inPractice = () => coursePracticeStarted && !workspace.classList.contains('course-reading');
const viewWidth = 620;
const viewHeight = 280;
const maxZoom = 3;
const center = { x: viewWidth / 2, y: viewHeight / 2 };
const camera = { x: 0, y: 0, zoom: 1 };
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));



// Convert from screen pixels to fixed viewport coordinates, accounting for SVG letterboxing.


// A press that starts on a scene object and ends without moving counts as a tap on it.
// Track the press separately so clicking still works after a drag captures the pointer.
let tap = null;
viewport.addEventListener('pointerdown', (event) => {
  const target = event.target.closest?.('[data-hit]');
  tap = target && event.button === 0 && event.isPrimary
    ? { hit: target.dataset.hit, x: event.clientX, y: event.clientY, id: event.pointerId }
    : null;
});
viewport.addEventListener('pointerup', (event) => {
  if (tap && tap.id === event.pointerId && Math.hypot(event.clientX - tap.x, event.clientY - tap.y) < 8) {
    sceneTap(tap.hit);
  }
  tap = null;
});
viewport.addEventListener('pointercancel', () => { tap = null; });

enableCameraDrag();



byId('zoom-in').onclick = () => zoomBy(.25);
byId('zoom-out').onclick = () => zoomBy(-.25);
viewport.addEventListener('keydown', (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const directions = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const direction = directions[event.key];
  if (direction && camera.zoom > 1) {
    event.preventDefault();
    setCamera(camera.x + direction[0] * 28 / camera.zoom, camera.y + direction[1] * 28 / camera.zoom, camera.zoom);
  } else if (event.key === '+' || event.key === '=' || event.key === '-') {
    event.preventDefault();
    zoomBy(event.key === '-' ? -.25 : .25);
  } else if (event.key === '0') {
    event.preventDefault();
    resetView();
  }
});
setCamera(0, 0, 1);

const motion = matchMedia('(prefers-reduced-motion: reduce)');
const size = 8;  // the picture is 8 × 8 pixels

// Demo pictures, one byte per row (1 = lit).
const pictures = {
  heart: [0x00, 0x66, 0xFF, 0xFF, 0xFF, 0x7E, 0x3C, 0x18],
  smile: [0x3C, 0x42, 0xA5, 0x81, 0xA5, 0x99, 0x42, 0x3C],
  letter: [0x18, 0x24, 0x42, 0x42, 0x7E, 0x42, 0x42, 0x00],
};
const fromBytes = (rows) => rows.flatMap((row) => Array.from({ length: size }, (_, c) => row >> (size - 1 - c) & 1));
// Four-level pictures: a left-to-right gradient, and the heart with a shaded edge.
const gradient = Array.from({ length: size * size }, (_, i) => Math.floor((i % size) / 2));
const shadedHeart = fromBytes(pictures.heart).map((on, i) => {
  if (!on) return 0;
  const r = Math.floor(i / size), c = i % size;
  return r <= 2 && c <= 3 ? 3 : r >= 5 ? 1 : 2;
});

// Each step picks a `mode`: `rle` counts runs in a black-and-white picture,
// `lossy` averages blocks of a four-level picture. `tasks` are try-it problems.
const stripes = Array.from({ length: size * size }, (_, i) => Math.floor(i / size) % 2);
const checker = Array.from({ length: size * size }, (_, i) => (Math.floor(i / size) + i % size) % 2);
const horizon = Array.from({ length: size * size }, (_, i) => (Math.floor(i / size) >= 5 ? 1 : 0));
const selectedBlock = [0, 1, size, size + 1];
const lossyExample = [...shadedHeart];
selectedBlock.forEach((pixel, index) => { lossyExample[pixel] = [0, 2, 2, 0][index]; });
const lesson = [
  {
    label: '같은 색 묶기',
    bookmark: 1,
    readingDiagram: { figure: 'compress-encode-row', title: '같은 값 8개를 묶으면 4비트',
      description: '위의 0 여덟 칸을 한 묶음 0111로 저장합니다. 이를 펼친 아래 줄에도 0이 여덟 칸 있습니다.' },
    example: ["00000000 한 줄", "값 0 · 길이−1은 111", "저장 0111 · 4비트"],
    mode: 'rle',

// Runs of equal values in one row: [[value, count], ...].
function runs(row) {
  const result = [];
  for (const value of row) {
    const last = result[result.length - 1];
    if (last && last[0] === value) last[1]++;
    else result.push([value, 1]);
  }
  return result;
}
const rowOf = (image, r) => image.slice(r * size, r * size + size);
const lengthBits = (count) => (count - 1).toString(2).padStart(3, '0');
const encodeRun = ([value, count]) => `${value}|${lengthBits(count)}`;
const decodeRun = (word) => ({ value: Number(word[0]), count: Number.parseInt(word.slice(1), 2) + 1 });
const rleBits = (image) => [...Array(size).keys()].reduce((sum, r) => sum + runs(rowOf(image, r)).length * 4, 0);
// Average each block of the four-level picture, rounded to the nearest level.
function blocked(image, block) {
  if (block === 1) return [...image];
  return image.map((_, i) => {
    const r0 = Math.floor(Math.floor(i / size) / block) * block, c0 = Math.floor(i % size / block) * block;
    let sum = 0;
    for (let r = r0; r < r0 + block; r++) for (let c = c0; c < c0 + block; c++) sum += image[r * size + c];
    return Math.round(sum / (block * block));
  });
}

const point = (x, y, z) => project(x, y, z).map((value) => +value.toFixed(2)).join(',');
const mix = (a, b, t) => a + (b - a) * t;

function drawFaces(node, h, H, fills) {
  const faces = {
    left: [[-h, -h, 0], [h, -h, 0], [h, -h, H], [-h, -h, H]],
    right: [[h, -h, 0], [h, h, 0], [h, h, H], [h, -h, H]],
    top: [[-h, -h, H], [h, -h, H], [h, h, H], [-h, h, H]],
  };
  for (const [name, corners] of Object.entries(faces)) {
    const attrs = { class: 'face ' + name, points: corners.map((p) => point(...p)).join(' ') };
    if (fills) Object.assign(attrs, { fill: fills[name], stroke: fills.stroke });
    svg('polygon', attrs, node);
  }
  svg('path', { class: 'highlight', d: `M${point(-h, -h, H)}L${point(h, -h, H)}L${point(h, h, H)}` }, node);
}

// Plates are small labels whose box is sized to the text.
let plates = [];
function addPlate(node, className, x, y, text, { pad = 1.5, round = true } = {}) {
  const group = svg('g', { class: className }, node);
  const plate = { group, rect: svg('rect', {}, group), label: svg('text', {}, group), x, y, pad, round };
  plate.label.textContent = text;
  plates.push(plate);
  sizePlate(plate);
  return plate;
}

// ---------- The monitor: an 8 × 8 pixel screen on the front-left face of a box ----------
// h 4.0 makes a pixel row 14px tall, enough for a 10.5px row label leaning with the row without touching the next.
const monitor = { h: 4, H: 132, margin: .32, base: 10 };
const cell = (2 * monitor.h - 2 * monitor.margin) / size;   // pixel width in floor units
const rowHeight = cell * 15.6;                              // pixel height in screen pixels, so pixels look square
const pixelShades = {
  2: ['#22352f', '#e3f6e9'],
  4: ['#22352f', '#557366', '#9fc2b0', '#e8f8ee'],
};

const groups = {};
const pixelViews = [];
let liveDecode, liveBlock;
let blockOutline;
let rowLabels = [];
function buildMonitor() {
  const group = svg('g', { class: 'node' }, byId('nodes'));
  const { h, H, margin, base } = monitor;
  drawShadow(group, h);
  drawFaces(group, h, H, { top: '#f4f7f5', left: '#d7dfdb', right: '#b8c6c0', stroke: '#8c9d96' });
  // Dark bezel behind the pixels.
  const bezel = [[-h + margin * .6, -h, base - 4], [h - margin * .6, -h, base - 4], [h - margin * .6, -h, base + rowHeight * size + 4], [-h + margin * .6, -h, base + rowHeight * size + 4]];
  svg('polygon', { points: bezel.map((p) => point(...p)).join(' '), fill: '#1b2b26' }, group);
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      const x0 = -h + margin + c * cell + .03, x1 = x0 + cell - .06;
      const z0 = base + (size - 1 - r) * rowHeight + .8, z1 = z0 + rowHeight - 1.6;
      const quad = [[x0, -h, z0], [x1, -h, z0], [x1, -h, z1], [x0, -h, z1]];
      const pixel = svg('polygon', { class: 'pixel', 'data-hit': `p${r * size + c}`, points: quad.map((p) => point(...p)).join(' ') }, group);
      pixelViews.push(pixel);
    }
  }
  const left = -h + margin, right = left + cell * 2;
  const top = base + rowHeight * size, bottom = top - rowHeight * 2;
  const outline = [[left, top], [right, top], [right, bottom], [left, bottom]];
  blockOutline = svg('polygon', { class: 'selected-lossy-block',
    points: outline.map(([x, z]) => point(x, -h, z)).join(' ') }, group);
  // Each horizontal label sits beside the start of its encoded row.
  rowLabels = [];
  for (let r = 0; r < size; r++) {
    const [x, y] = project(-h, -h, base + (size - 1 - r) * rowHeight + rowHeight / 2);
    rowLabels.push(svg('text', { class: 'row-label', x: x - 15, y }, group));
  }
  const [lx, ly] = project(h, -h, 0);
  addPlate(group, 'tag', lx, ly + 16, '화면');
  groups.screen = group;
}

// ---------- Reading figures and the matching practice figures ----------
function createReadingFigure(index) {
  const template = document.createElement('template');
  template.id = lesson[index].readingDiagram.figure;
  document.body.append(template);
  return svg('g', { class: 'compression-figure' }, svg('svg', {}, template.content));
}

function figureText(group, x, y, content, className = '') {
  const text = svg('text', { x, y, class: className }, group);
  text.textContent = content;
}

function figureBox(group, cx, cy, width, height, className) {
  svg('rect', { x: cx - width / 2, y: cy - height / 2, width, height, rx: 5, class: className }, group);
}

function verticalArrow(group, x, from, to) {
  svg('path', { d: `M${x} ${from}V${to - 4}`, class: 'figure-wire' }, group);
  svg('path', { d: `M${x - 4} ${to - 7}h8L${x} ${to}Z`, class: 'figure-tip' }, group);
}

function horizontalArrow(group, from, to, y) {
  svg('path', { d: `M${from} ${y}H${to - 4}`, class: 'figure-wire' }, group);
  svg('path', { d: `M${to - 7} ${y - 4}v8L${to} ${y}Z`, class: 'figure-tip' }, group);
}

const rowCenter = (index) => 68 + index * 69;

function pixelTile(group, cx, cy, length, value, levels) {
  const shade = pixelShades[levels][value];
  svg('rect', { x: cx - length / 2, y: cy - length / 2, width: length, height: length,
    rx: 3, fill: shade, stroke: '#799688' }, group);
  const dark = levels === 2 ? value === 0 : value < 2;
  figureText(group, cx, cy + 6, value, `figure-digit${dark ? ' figure-light-text' : ''}`);
}

function drawGroupedRow(group, row, accepted, expanded) {
  const parts = runs(row);
  const stored = parts.slice(0, accepted).map(encodeRun);
  figureText(group, 310, 53, '원본 8비트');
  row.forEach((bit, i) => {
    pixelTile(group, rowCenter(i), 95, 36, bit, 2);
    figureText(group, rowCenter(i), 75, i + 1, 'figure-index');
  });
  let position = 0;
  parts.slice(0, accepted).forEach(([value, count], i) => {
    const left = rowCenter(position) - 17;
    const right = rowCenter(position + count - 1) + 17;
    const center = (left + right) / 2;
    svg('path', { d: `M${left} 116v6H${right}v-6`, class: 'figure-bracket' }, group);
    verticalArrow(group, center, 122, 140);
    figureBox(group, center, 158, 62, 32, 'figure-field');
    figureText(group, center, 164, stored[i], 'figure-bit');
    figureText(group, center, 191, `${value}×${count}`, 'figure-bit');
    position += count;
  });
  if (accepted === parts.length) {
    const sizeLabel = parts.length === 1 ? '저장 4비트' : '저장 32비트 · 같은 색 줄은 4비트';
    figureText(group, 310, 213, sizeLabel);
  }
  if (!expanded) return;
  const restored = stored.flatMap((code) => {
    const {value, count} = decodeRun(code.replace('|', ''));
    return Array(count).fill(value);
  });
  restored.forEach((bit, i) => pixelTile(group, rowCenter(i), 242, 32, bit, 2));
  figureText(group, 310, 275, restored.join('') === row.join('') ? '펼친 줄 = 원본 8칸' : '펼친 줄이 원본과 다릅니다');
}

function drawRestoreRow(group, word) {
  const { value, count } = decodeRun(word);
  figureText(group, 310, 63, '저장 4비트');
  figureText(group, 170, 100, '값 1비트');
  figureText(group, 450, 100, '길이−1 (3비트)');
  figureBox(group, 170, 126, 76, 32, 'figure-field');
  figureBox(group, 450, 126, 109, 32, 'figure-length');
  figureText(group, 170, 132, value, 'figure-digit');
  figureText(group, 450, 132, word.slice(1), 'figure-digit');
  figureText(group, 170, 173, `반복할 값 ${value}`);
  figureText(group, 450, 173, `${count - 1} + 1 = ${count}`, 'figure-bit');
  verticalArrow(group, 170, 144, 156);
  verticalArrow(group, 450, 144, 156);
  svg('path', { d: 'M170 178v13H450v-13', class: 'figure-wire' }, group);
  verticalArrow(group, 310, 191, 209);
  for (let i = 0; i < size; i++) {
    if (i < count) pixelTile(group, rowCenter(i), 234, 38, value, 2);
    else figureBox(group, rowCenter(i), 234, 38, 38, 'figure-empty');
  }
  figureText(group, 310, 276, `복원 ${count}비트`);
}

function paint() {

  const rowPractice = s.mode === 'rle' && inPractice();
  const decoding = s.mode === 'decode';
  groups.screen.style.display = decoding || rowPractice ? 'none' : '';
  liveRow.style.display = rowPractice ? '' : 'none';

  byId('scene-desc').textContent = rowPractice
    ? state.expanded ? s.readingDiagram.description : '왼쪽부터 같은 색이 끝나는 칸의 번호를 누르세요.'
    : s.description;
  if (rowPractice) {
    liveRow.replaceChildren();
    drawGroupedRow(liveRow, rowOf(state.image, 0), state.groupCount, state.expanded);
  }
  blockOutline.style.display = s.mode === 'lossy' ? '' : 'none';
  liveDecode.style.display = decoding ? '' : 'none';
  liveBlock.style.display = s.mode === 'lossy' ? '' : 'none';
  if (decoding) {
    liveDecode.replaceChildren();
    drawRestoreRow(liveDecode, state.word);
    syncControls();
    return;
  }
  const shades = pixelShades[s.levels];
  const image = shownImage();
  pixelViews.forEach((pixel, i) => {
    pixel.setAttribute('fill', shades[image[i]]);
    pixel.classList.toggle('lit', image[i] > 0);
  });
  rowLabels.forEach((label, r) => {
    if (s.mode === 'rle') {
      const parts = runs(rowOf(image, r));
      label.textContent = `${parts.map(encodeRun).join(' ')} → ${parts.length * 4}비트`;
    } else label.textContent = '';
  });
  if (s.mode === 'lossy') paintLiveBlock(image);
  syncControls();
}

const pixelButtons = [];
function buildControls() {
  for (let i = 0; i < size; i++) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'action';
    button.textContent = i + 1;
    button.onclick = () => {
      const parts = runs(rowOf(state.image, 0));
      const end = parts.slice(0, state.groupCount + 1).reduce((total, [, count]) => total + count, 0) - 1;
      if (i !== end) {
        byId('row-feedback').textContent = '다음 칸도 같은 색인지 보고, 그 색이 끝나는 칸을 고르세요.';
        return;
      }
      state.groupCount += 1;
      paint();
      byId('row-feedback').textContent = state.groupCount === parts.length
        ? '모든 묶음을 적었습니다. 저장한 묶음을 펼쳐 보세요.' : '다음 색의 마지막 칸을 고르세요.';
    };
    byId('row-ends').append(button);
  }
  byId('row-unfold').onclick = () => {
    state.expanded = true;
    paint();
    byId('row-feedback').textContent = '펼친 여덟 칸이 원본과 같은 순서입니다.';
  };

  const value = byId('decode-value');
  const length = byId('decode-length');
  for (let count = 1; count <= size; count++) {
    const bits = lengthBits(count);
    length.add(new Option(bits, bits));
  }
  value.onchange = length.onchange = () => userChange(() => {
    state.word = value.value + length.value;
  }, '저장 필드를 바꿨습니다.');

  const grid = byId('pixel-grid');
  for (let i = 0; i < size * size; i++) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'pixel-button';
    button.addEventListener('click', () => cyclePixel(i));
    grid.append(button);
    pixelButtons.push(button);
  }
  byId('pixels-clear').onclick = () => userChange(() => { state.image.fill(0); }, '그림을 모두 지웠습니다.');
  byId('pixels-invert').onclick = () => userChange(() => {
    const top = step().levels - 1;
    state.image = state.image.map((v) => top - v);
  }, '밝기를 반전했습니다.');
  for (const block of [1, 2, 4]) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'action choice-button';
    button.textContent = `${block}×${block}`;
    button.dataset.value = block;
    button.addEventListener('click', () => userChange(() => { state.block = block; }, `${block}×${block}로 묶었습니다.`));
    byId('block-choices').append(button);
  }
}

function syncControls() {
  const s = step();
  const decoding = s.mode === 'decode';
  const rowPractice = s.mode === 'rle' && inPractice();
  byId('row-actions').hidden = !rowPractice;
  byId('try').hidden = s.mode === 'rle';
  byId('pixel-controls').hidden = decoding || s.mode === 'rle';
  byId('decode-controls').hidden = !decoding;
  byId('block-choice').hidden = s.mode !== 'lossy';
  byId('readout').replaceChildren(...readout());
  if (rowPractice) {
    const parts = runs(rowOf(state.image, 0));
    const ends = new Set();
    let position = 0;
    parts.slice(0, state.groupCount).forEach(([, count]) => { position += count; ends.add(position); });
    [...byId('row-ends').children].forEach((button, i) => {
      button.disabled = i < position;
      button.setAttribute('aria-pressed', String(ends.has(i + 1)));
    });
    byId('row-unfold').disabled = state.groupCount !== parts.length || state.expanded;
    return;
  }
  if (decoding) {
    byId('decode-value').value = state.word[0];
    byId('decode-length').value = state.word.slice(1);
    return;
  }
  const shades = pixelShades[s.levels];
  pixelButtons.forEach((button, i) => {
    const v = state.image[i];
    button.style.background = shades[v];
    button.setAttribute('aria-pressed', String(v > 0));
    button.setAttribute('aria-label', `${Math.floor(i / size) + 1}행 ${i % size + 1}열, ${s.levels === 2 ? (v ? '켜짐' : '꺼짐') : '밝기 ' + v.toString(2).padStart(2, '0')}`);
  });
  for (const button of document.querySelectorAll('#block-choices button')) button.setAttribute('aria-pressed', String(Number(button.dataset.value) === state.block));
}

function readout() {
  const s = step();
  const strong = (text, className) => {
    const element = document.createElement('b');
    if (className) element.className = className;
    element.textContent = text;
    return element;
  };
  if (s.mode === 'rle') {
    if (inPractice()) {
      return state.groupCount === 0 ? ['원본 8비트']
        : [`원본 8비트 · 저장한 묶음 ${state.groupCount}개 × 4비트 = ${state.groupCount * 4}비트`];
    }
    const bits = rleBits(state.image);
    const ratio = Math.round(bits / 64 * 100);
    return ['원본 ', strong('64비트'), ' → 압축 ', strong(`${bits}비트`, 'total'), ` (원본의 ${ratio}%${bits > 64 ? ', 더 커짐' : ''})`];
  }
  if (s.mode === 'decode') {
    const { value, count } = decodeRun(state.word);
    return ['저장 ', strong(encodeRun([value, count])), ' → ', strong(String(value).repeat(count), 'total')];
  }
  const blocks = (size / state.block) ** 2;
  return ['원본 ', strong('128비트'), ` → ${state.block}×${state.block} 블록 ${blocks}개 × 2비트 = `, strong(`${blocks * 2}비트`, 'total')];
}
// ---------- Changes ----------
function cyclePixel(i) {
  const levels = step().levels;
  userChange(() => { state.image[i] = (state.image[i] + 1) % levels; },
    `${Math.floor(i / size) + 1}행 ${i % size + 1}열 ${levels === 2 ? (state.image[i] ? '끔' : '켬') : '밝기 바꿈'}.`);
}
function sceneTap(hit) {
  if (step().mode === 'lossy' && hit?.startsWith('p')) cyclePixel(Number(hit.slice(1)));
}

function userChange(change, message, quiet = false) {
  state.playing = false;
  state.solved = '';
  change();
  paint();
  syncPlayback();
  if (!quiet) byId('announcement').textContent = message;
  syncTask();
  checkTask();
}

// ---------- Try-it problems ----------
function syncTask() {
  const tasks = step().tasks;
  if (!tasks) return;
  const done = progress[state.index];
  const allDone = done >= tasks.length;
  byId('try').classList.toggle('solved', state.solved !== '');
  byId('try-text').textContent = state.solved !== '' ? tasks[done - 1].text
    : allDone ? '이 단계의 문제를 모두 풀었습니다. 자유롭게 바꿔 보세요.' : tasks[done].text;
  byId('try-result').textContent = state.solved === '' ? ''
    : `✓ 맞았습니다. ${state.solved}${allDone ? ' · 이 단계의 문제를 모두 풀었습니다.' : ''}`;
  byId('try-next').hidden = state.solved === '' || allDone;
}
function checkTask() {
  const tasks = step().tasks;
  if (!tasks) return;
  const done = progress[state.index];
  if (state.solved !== '' || done >= tasks.length || !tasks[done].check(state)) return;
  progress[state.index] = done + 1;
  state.solved = tasks[done].result?.(state) ?? byId('readout').textContent;
  syncTask();
}
byId('try-next').onclick = () => { state.solved = ''; syncTask(); };

// ---------- Demo playback ----------
let frame = null, lastFrame = null;
function applyFrame(frameState) {
  if (frameState.image) state.image = [...frameState.image];
  if (frameState.block) state.block = frameState.block;
  if (frameState.word) state.word = frameState.word;
  paint();
}
function demoTick() {
  if (viewport.querySelector('.course-diagram')) { state.wait = 400; return; }
  const demo = step().demo;
  state.demoPosition = (state.demoPosition + 1) % demo.frames.length;
  applyFrame(demo.frames[state.demoPosition]);
  state.wait = demo.interval;
}
function tick(now) {
  frame = null;
  const elapsed = lastFrame === null ? 0 : Math.min(now - lastFrame, 80);
  lastFrame = now;
  if (state.playing) {
    state.wait -= elapsed;
    if (state.wait <= 0) demoTick();
    frame = requestAnimationFrame(tick);
  } else lastFrame = null;
}
function syncPlayback() {
  const reduced = motion.matches;
  if (reduced) state.playing = false;
  if (state.playing && frame === null) frame = requestAnimationFrame(tick);
}
// ---------- Steps and routing ----------
const legends = {
  rle: '<span><i class="dot on"></i>1 (켜진 칸)</span><span><i class="dot"></i>0 (꺼진 칸)</span><span>값 1비트 · 길이−1 3비트</span>',
  decode: '<span><i class="dot on"></i>1 (켜진 칸)</span><span><i class="dot"></i>0 (꺼진 칸)</span>',
  lossy: '<span><i class="dot on"></i>밝은 칸</span><span><i class="dot"></i>어두운 칸</span><span>화면 = 묶어서 평균 낸 그림</span>',
};
function startStep() {
  const s = step();
  Object.assign(state, s.initial());
  state.demoPosition = 0;
  state.wait = s.demo.interval;
}
function showStep(index, announce = true) {
  state.index = index;
  state.playing = lessonDemoEnabled();
  startStep();
  state.groupCount = 0;
  state.expanded = false;
  byId('row-feedback').textContent = '';
  if (coursePracticeStarted && index === 0) progress.fill(0);
  const s = step();
  byId('step-title').textContent = s.title;
  byId('body').textContent = s.body;
  byId('takeaway').textContent = s.takeaway;
  byId('scene-desc').textContent = s.description;
  byId('legend').innerHTML = legends[s.mode];
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  stepButtons.forEach((button, i) => {
    if (i === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  const fit = { rle: 'translate(476 185) scale(.88)', lossy: 'translate(430 185) scale(.88)', decode: '' };
  byId('world').setAttribute('transform', fit[s.mode]);
  state.solved = '';
  syncTask();
  paint();
  syncPlayback();
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${s.title}`;
}
function fragmentForStep(index) {
  return `#/compress/${lesson[index].bookmark}`;
}
function routeIndex() {
  const match = /^#\/compress\/(\d+)$/.exec(location.hash);
  const index = match ? lesson.findIndex((entry) => entry.bookmark === Number(match[1])) : -1;
  return Math.max(0, index);
}
function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', fragmentForStep(index));
  showStep(index);
}
const stepButtons = lesson.map(({ label }, index) => {
  const listItem = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  const number = document.createElement('span');
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.addEventListener('click', () => goToStep(index));
  listItem.append(button);
  byId('steps').append(listItem);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
motion.addEventListener('change', () => {
  if (lessonDemoEnabled()) state.playing = true;
  syncPlayback();
});
window.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});

for (const index of [0, 2]) {
  const row = rowOf(lesson[index].initial().image, 0);
  drawGroupedRow(createReadingFigure(index), row, runs(row).length, true);
}
drawRestoreRow(createReadingFigure(1), lesson[1].initial().word);
drawLossyBlock();
buildMonitor();
liveDecode = svg('g', { id: 'decode-figure', class: 'compression-figure' }, byId('world'));
const liveRow = svg('g', { id: 'grouped-row', class: 'compression-figure' }, viewport);
liveBlock = svg('g', { id: 'lossy-figure', class: 'compression-figure' }, byId('world'));
buildControls();
new MutationObserver(paint).observe(workspace, {attributes: true, attributeFilter: ['class']});
const initial = routeIndex();
history.replaceState(null, '', fragmentForStep(initial));
state.index = initial;
showStep(initial, false);
</script>
</body>
</html>
