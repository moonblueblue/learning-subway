const slug = 'computer-tasks';
const byId = id => document.getElementById(id);
const workspace = document.querySelector('.workspace');
const viewport = byId('scene');
const drawing = byId('figure');
const viewWidth = 620;
const viewHeight = 280;
const center = {x: viewWidth / 2, y: viewHeight / 2};
const camera = {x: 0, y: 0, zoom: 1};
const maxZoom = 2.2;
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
// A 2.5D scene (figure guide 1): each row is a path on the floor. The thing the computer gets stands on a
// platform on the left, the computer box with its instruction plate in the middle, the screen on the right.
// A floor wire with filled triangle arrowheads runs left to right, and a value dot on the first wire says
// what is handed over. Two rows stand one behind the other; one row always takes the back place.
const columns = [0, 205, 410];           // world x of the three places (left, middle, right)
const rowFloor = [0, 134];                // world y of the back row and the front row
const iso = (x, y, z = 0) => [14 * (x + y), 7 * (x - y) - z];

function text(parent, x, y, value, className) {
  const label = svg('text', {x, y, class: className}, parent);
  label.textContent = value;
  return label;
}
function rect(parent, x, y, width, height, className, rx = 8) {
  return svg('rect', {x, y, width, height, rx, class: className}, parent);
}
// A standing panel (card, screen, frame, plate) with its thickness shown along the floor's depth axis.
function slab(parent, x, y, width, height, className, rx = 6, depth = 7) {
  const dx = depth, dy = -depth / 2;
  svg('polygon', {class: 'slab-side', points: `${x + width - 2},${y + 2} ${x + width - 2 + dx},${y + 2 + dy} ${x + width - 2 + dx},${y + height - 2 + dy} ${x + width - 2},${y + height - 2}`}, parent);
  svg('polygon', {class: 'slab-top', points: `${x + 2},${y + 2} ${x + 2 + dx},${y + 2 + dy} ${x + width - 2 + dx},${y + 2 + dy} ${x + width - 2},${y + 2}`}, parent);
  return rect(parent, x, y, width, height, className, rx);
}
// A faint floor grid along the two floor axes, fading towards the edges.
function floorGrid(parent) {
  const g = svg('g', {class: 'iso-grid'}, parent);
  for (let k = -16; k <= 22; k += 2) {
    const a = iso(k, -16), b = iso(k, 22), c = iso(-16, k), d = iso(22, k);
    svg('line', {x1: a[0], y1: a[1], x2: b[0], y2: b[1]}, g);
    svg('line', {x1: c[0], y1: c[1], x2: d[0], y2: d[1]}, g);
  }
}
function picture(parent, x, y, width, height, gray = false) {
  svg('use', {href: '#task-photo', x: x - width / 2, y: y - height / 2, width, height,
    ...(gray ? {style: 'filter: grayscale(1)'} : {})}, parent);
}
// A block standing on the floor at (cx, cy): half sizes hx, hy on the floor, height H, lifted by z.
function block(parent, cx, cy, hx, hy, H, kind, z = 0) {
  const g = svg('g', {class: 'block ' + kind, transform: `translate(${cx} ${cy})`}, parent);
  const at = (x, y, h) => iso(x, y, z + h).join(',');
  const faces = {
    left: [[-hx, -hy, 0], [hx, -hy, 0], [hx, -hy, H], [-hx, -hy, H]],
    right: [[hx, -hy, 0], [hx, hy, 0], [hx, hy, H], [hx, -hy, H]],
    top: [[-hx, -hy, H], [hx, -hy, H], [hx, hy, H], [-hx, hy, H]],
  };
  for (const [name, corners] of Object.entries(faces))
    svg('polygon', {class: 'face ' + name, points: corners.map(c => at(...c)).join(' ')}, g);
  return g;
}
const mark = (g, on) => { if (on) for (const face of g.querySelectorAll('.face, .panel, .screen')) face.setAttribute('data-changed', ''); return g; };

// The floor wire from one place to the next: it runs under both blocks, and the arrowhead sits on the open part.
function wire(parent, from, to, y, known) {
  const z = 3;
  svg('line', {x1: from, y1: y - z, x2: to, y2: y - z, class: known ? 'flow' : 'flow unknown'}, parent);
  const tip = from + (to - from) * .46;
  svg('polygon', {class: known ? 'flow-arrow' : 'flow-arrow unknown', points: `${tip + 4},${y - z} ${tip - 5},${y - z - 4.5} ${tip - 5},${y - z + 4.5}`}, parent);
}
// The dot is sized to the word it carries in the page's language, so "Photo" fits as well as "사진".
function valueDot(parent, x, y, value) {
  const shown = window.courseI18n?.translate(value) ?? value;
  const width = [...shown].reduce((sum, ch) => sum + (/[가-힣]/.test(ch) ? 16 : 9), 0);
  const g = svg('g', {class: 'value-dot'}, parent);
  svg('circle', {cx: x, cy: y - 3, r: Math.max(15, width / 2 + 7)}, g);
  text(g, x, y + 2, value, 'dot-label');
}

function drawInput(parent, kind, value, y, changed) {
  const x = columns[0];
  if (kind === 'key') {
    block(parent, x, y, 2.1, 2.1, 7, 'base');
    ['A', 'B'].forEach((key, i) => {
      const pressed = key === value;
      const offset = i ? .95 : -.95;
      const [kx, ky] = iso(offset, offset, 0);
      const cap = mark(block(parent, x + kx, y + ky, .82, .82, pressed ? 4 : 9, pressed ? 'key pressed' : 'key', 7), pressed && changed);
      const [tx, ty] = iso(0, 0, 7 + (pressed ? 4 : 9));
      text(cap, tx, ty + 6, key, 'key-label');
    });
    return;
  }
  block(parent, x, y, 1.45, 1.45, 6, 'base');
  if (kind === 'card') {
    twoCards.forEach((number, i) => {
      const cx = x + (i ? 25 : -25);
      slab(parent, cx - 20, y - 62, 40, 52, 'panel card', 6, 5);
      text(parent, cx, y - 25, number, 'value');
    });
  } else {
    slab(parent, x - 56, y - 82, 112, 72, 'panel frame', 6);
    picture(parent, x, y - 46, 96, 56);
  }
}

function drawComputer(parent, instruction, y, changed) {
  const x = columns[1];
  const g = mark(block(parent, x, y, 1.6, 1.6, 28, 'computer'), changed);
  // The instruction plate stands on the computer: the job, and under it what the job works out.
  const detail = instruction.detail;
  const height = detail ? 50 : 32;
  const top = y - 28 - 20 - height;
  const plate = slab(parent, x - 84, top, 168, height, 'panel instruction', 9, 6);
  if (changed) plate.setAttribute('data-changed', '');
  text(parent, x, top + 22, instruction.task, 'operation');
  if (detail) text(parent, x, top + 42, detail, 'detail');
  return g;
}

function drawOutput(parent, kind, outcome, y, changed) {
  const x = columns[2];
  block(parent, x, y, 1, 1, 8, 'base');
  if (kind === 'photo') {
    const frame = slab(parent, x - 62, y - 86, 124, 76, 'panel frame' + (outcome ? '' : ' waiting-frame'), 6);
    if (outcome) {
      picture(parent, x, y - 48, outcome.width, outcome.height, outcome.gray);
      if (changed) svg('rect', {x: x - outcome.width / 2, y: y - 48 - outcome.height / 2, width: outcome.width,
        height: outcome.height, rx: 5, class: 'result-border'}, parent).setAttribute('data-changed', '');
    } else text(parent, x, y - 43, '대기 중', 'caption waiting');
    return frame;
  }
  svg('rect', {x: x - 5, y: y - 22, width: 10, height: 14, class: 'neck'}, parent);
  const screen = slab(parent, x - 61, y - 84, 122, 62, 'screen', 7, 9);
  if (changed) screen.setAttribute('data-changed', '');
  const result = outcome?.result;
  text(parent, x, y - 53 + (result == null ? 0 : 5), result ?? '빈 화면', result == null ? 'caption screen-text' : 'value screen-text');
}

function drawRow(parent, kind, instruction, outcome, y, marks) {
  const row = svg('g', {class: 'row'}, parent);
  const handed = kind === 'key' ? instruction.key : kind === 'card' ? twoCards.join(', ') : '사진';
  // Wires first, so the blocks cover their ends and only the open stretch between places shows.
  wire(row, columns[0], columns[1], y, true);
  wire(row, columns[1], columns[2], y, Boolean(outcome));
  drawInput(row, kind, instruction.key, y, marks.includes('key'));
  drawComputer(row, instruction, y, marks.includes('job'));
  drawOutput(row, kind, outcome, y, marks.includes('output'));
  valueDot(row, (columns[0] + columns[1]) / 2 + 22, y, handed);
}

function drawFigure(index, {hide, changed}) {
  const step = lesson.steps[index];
  drawing.replaceChildren();
  // One fixed fit for every step (two rows and the headings' place), so nothing moves between steps.
  const world = svg('g', {transform: 'translate(152 146) scale(.79)'}, drawing);
  const fade = svg('radialGradient', {id: 'grid-fade', cx: .5, cy: .5, r: .5}, svg('defs', {}, drawing));
  svg('stop', {offset: 0, 'stop-color': '#fff'}, fade);
  svg('stop', {offset: 1, 'stop-color': '#000'}, fade);
  const mask = svg('mask', {id: 'grid-mask'}, drawing.querySelector('defs'));
  svg('rect', {x: -260, y: -260, width: 900, height: 560, fill: 'url(#grid-fade)'}, mask);
  floorGrid(svg('g', {mask: 'url(#grid-mask)', transform: 'translate(0 70)'}, world));
  step.headings?.forEach(([name, meaning], i) => {
    const title = text(world, columns[i], -158, name, 'heading');
    if (changed.includes('headings')) title.setAttribute('data-changed', '');
    text(world, columns[i], -136, meaning, 'caption');
  });
  // Back row first, so the front row stands in front of it.
  step.rows.forEach((option, position) => {
    const n = position + 1;
    const instruction = step.kind === 'key' ? {task: keyboard.task, key: option}
      : hide.includes('detail-' + n) ? {task: option.task} : option;
    const outcome = hide.includes('output-' + n) ? null : step.kind === 'key' ? {result: option} : option;
    const marks = changed.filter(id => id.endsWith('-' + n)).map(id => id.split('-')[0]);
    drawRow(world, step.kind, instruction, outcome, rowFloor[position], marks);
  });
}

byId('zoom-in').onclick = () => zoomBy(.3);
byId('zoom-out').onclick = () => zoomBy(-.3);
enableCameraDrag();

viewport.addEventListener('keydown', event => {
  if (camera.zoom === 1) return;
  const direction = {ArrowLeft: [-1, 0], ArrowUp: [0, -1], ArrowRight: [1, 0], ArrowDown: [0, 1]}[event.key];
  if (!direction) return;
  event.preventDefault();
  setCamera(camera.x + direction[0] * 18, camera.y + direction[1] * 18, camera.zoom);
});

window.addEventListener('keydown', event => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === '+') zoomBy(.3);
  else if (event.key === '-') zoomBy(-.3);
  else if (event.key === '0') resetView();
  else return;
  event.preventDefault();
});
setCamera(0, 0, 1);
</script>
