<style>

<body>
<main class="shell">
  <header>
    <p class="eyebrow">4장 자료구조와 알고리즘 · 레슨 4.5</p>
    <h1>해시 테이블</h1>
    <p class="lead">이름 하나로 값을 어떻게 한 번에 찾을까요? 이름을 계산해 칸 번호를 정하는 해시 테이블에 넣고 찾아 보세요.</p>
  </header>
  <div class="workspace">
    <div>
      <section class="panel" id="stage-panel" aria-labelledby="stage-heading">
        <div class="stage-top"><h2 id="stage-heading">해시 기계와 칸</h2></div>
        <div class="stage">
          <svg id="scene" viewBox="0 0 620 280" role="img" tabindex="0" aria-labelledby="scene-title scene-desc">
            <title id="scene-title">해시 기계가 이름을 계산해 칸 번호를 정하고, 칸 위에 이름이 쌓이는 장면</title><desc id="scene-desc"></desc>
            <defs>
              <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
              <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
              <radialGradient id="grid-fade"><stop offset=".45" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
              <mask id="grid-mask"><rect x="-460" y="-260" width="920" height="520" fill="url(#grid-fade)"/></mask>
            </defs>
            <g id="world" aria-hidden="true">
              <path id="grid" class="iso-grid" mask="url(#grid-mask)"></path>
              <g id="casings"></g><g id="links"></g><g id="nodes"></g><g id="packets"></g>
            </g>
          </svg>
        </div>
        <div class="hands-on">
          <div class="try" id="try">
            <p><strong>해 보기</strong><span id="try-text"></span></p>
            <p class="try-result" id="try-result" role="status"></p>
            <div class="try-choices" id="try-choices" role="group" aria-label="예측 고르기"></div>
          </div>
          <p class="readout" id="readout"></p>
          <div class="algo-row name-row" id="name-row" role="group" aria-label="이름 고르기"></div>
          <div class="stats-row"><span class="stats" id="stats"></span><button class="action" id="reset" type="button">처음 상태로</button></div>
        </div>

          <button class="action" id="zoom-out" type="button" aria-label="장면 축소">−</button>
          <output class="view-scale" id="view-scale" aria-label="현재 배율" aria-live="off">100%</output>
          <button class="action" id="zoom-in" type="button" aria-label="장면 확대">+</button>

        </div>
        <div class="controls">
          <div class="legend" aria-label="범례"><span><i class="dot hit"></i>찾은 이름</span><span><i class="dot freshdot"></i>방금 넣은 이름</span><span><i class="dot collide"></i>충돌한 칸</span></div>
        </div>

<script>
const byId = (id) => document.getElementById(id);
const viewport = byId('scene');
const viewWidth = 620;
const viewHeight = 280;
const maxZoom = 3;
const center = { x: viewWidth / 2, y: viewHeight / 2 };
const camera = { x: 0, y: 0, zoom: 1 };
const pointers = new Map();
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));



// Convert from screen pixels to fixed viewport coordinates, accounting for SVG letterboxing.


// A press that starts on a switch and ends without moving toggles that switch.
// Tracked separately from the camera pointers so it also works when the pointer is captured.
let tap = null;
viewport.addEventListener('pointerdown', (event) => {
  const target = event.target.closest?.('[data-input]');
  tap = target && event.button === 0 && pointers.size === 0
    ? { input: target.dataset.input, x: event.clientX, y: event.clientY, id: event.pointerId }
    : null;
});
viewport.addEventListener('pointerup', (event) => {
  if (tap && tap.id === event.pointerId && Math.hypot(event.clientX - tap.x, event.clientY - tap.y) < 8) {
    toggleInput(tap.input);
  }
  tap = null;
});
viewport.addEventListener('pointercancel', () => { tap = null; });

viewport.addEventListener('pointerdown', (event) => {
  if (event.button !== 0 || pointers.size >= 2) return;
  if (event.pointerType !== 'touch' && camera.zoom === 1) return;
  pointers.set(event.pointerId, viewportPoint(event));
  viewport.setPointerCapture(event.pointerId);
});
viewport.addEventListener('pointermove', (event) => {
  if (!pointers.has(event.pointerId)) return;
  const before = pointerGeometry();
  pointers.set(event.pointerId, viewportPoint(event));
  const after = pointerGeometry();
  const pinch = pointers.size === 2;
  if (pinch && (before.distance < 1 || after.distance < 1)) return;
  const zoom = pinch ? camera.zoom * after.distance / before.distance : camera.zoom;
  zoomBetween(zoom, before.point, after.point);
  viewport.classList.toggle('is-dragging', !pinch && camera.zoom > 1);
});
for (const eventName of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  viewport.addEventListener(eventName, (event) => {
    if (pointers.delete(event.pointerId)) viewport.classList.remove('is-dragging');
  });
}



byId('zoom-in').onclick = () => zoomBy(.25);
byId('zoom-out').onclick = () => zoomBy(-.25);
viewport.addEventListener('keydown', (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const directions = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  const direction = directions[event.key];
  if (direction && camera.zoom > 1) {
    event.preventDefault();
    setCamera(camera.x + direction[0] * 28 / camera.zoom, camera.y + direction[1] * 28 / camera.zoom, camera.zoom);
  } else if (event.key === '+' || event.key === '=' || event.key === '-') {
    event.preventDefault();
    zoomBy(event.key === '-' ? -.25 : .25);
  } else if (event.key === '0') {
    event.preventDefault();
    resetView();
  }
});
setCamera(0, 0, 1);
// A hash table of names. The hash is the sum of the characters' code numbers (0.2), and the bucket is
// that sum mod the table size. Names that land in the same bucket form a chain stacked on it.
const allNames = ['민수', '지아', '하준', '서연', '도윤', '예린', '시우', '하은', '주원', '지호', '수아', '건우'];
const missing = '하늘';
const codeSum = (name) => [...name].reduce((sum, ch) => sum + ch.codePointAt(0), 0);
const fmt = (value) => value.toLocaleString('ko-KR');

const lesson = [
  {
    label: '해시 함수',
    example: ["이름을 입력", "해시를 13칸으로 나눔", "계산한 칸에 저장"],
    title: '이름을 계산해서 칸 번호를 정한다',
    body: '해시 테이블은 이름(키)을 계산해서 저장할 칸을 정합니다. 여기서는 글자 코드(0.2)를 모두 더한 수를 칸 수 13으로 나눈 나머지(2.6)를 칸 번호로 씁니다. 이 계산을 해시 함수라고 합니다. 같은 이름은 언제나 같은 수가 나오므로 언제나 같은 칸으로 갑니다.',
    takeaway: '"민수"는 코드 합 97,812, 13으로 나눈 나머지 0이라 0번 칸에 들어갑니다. 이름을 넣을 때 계산 과정이 장면 왼쪽 해시 기계 위에 뜹니다.',
    description: '왼쪽에 해시 기계, 오른쪽에 0번부터 12번까지 칸 13개가 한 줄로 놓여 있습니다. 이름을 넣으면 기계가 칸 번호를 계산하고, 이름이 그 칸 위에 올라갑니다.',
    mode: 'insert', start: [], size: 13,
    tasks: [
      { text: '이름 세 개를 넣어 보세요.', test: (e) => e.count >= 3, ok: '이름마다 계산한 칸으로 바로 들어갔습니다.' },
      { ask: '"민수"를 나중에 찾을 때, 해시 함수는 몇 번 칸을 알려 줄까요?', choices: ['0번', '매번 다름', '맨 끝 칸'], answer: '0번', why: '같은 이름은 언제나 같은 코드 합, 같은 나머지가 나옵니다. 그래서 넣은 칸을 다시 찾을 수 있습니다.' },
    ],
  },
  {
    label: '한 번에 찾기',

const motion = matchMedia('(prefers-reduced-motion: reduce)');
const storageKey = 'hash-lab:v1:step';
const state = { index: 0, size: 13, table: [], order: [], busy: false, playing: !motion.matches, wait: 0,
  solved: '', wrong: '', demoPosition: 0 };
const progress = lesson.map(() => 0);
let timers = [];

const project = (x, y, z = 0) => [14 * (x + y), 7 * (x - y) - z];
const point = (x, y, z) => project(x, y, z).map((value) => +value.toFixed(2)).join(',');
const flat = (u, v, z = 0) => [14 * u, 7 * v - z];
const mix = (a, b, t) => a + (b - a) * t;
const gridLines = [];
for (let i = -24; i <= 40; i += 2) gridLines.push(`M${point(i, -24, 0)}L${point(i, 40, 0)}M${point(-24, i, 0)}L${point(40, i, 0)}`);
byId('grid').setAttribute('d', gridLines.join(''));
function drawBox(node, h, H, z0 = 0) {
  const faces = {
    left: [[-h, -h, z0], [h, -h, z0], [h, -h, z0 + H], [-h, -h, z0 + H]],
    right: [[h, -h, z0], [h, h, z0], [h, h, z0 + H], [h, -h, z0 + H]],
    top: [[-h, -h, z0 + H], [h, -h, z0 + H], [h, h, z0 + H], [-h, h, z0 + H]],
  };
  for (const [name, corners] of Object.entries(faces)) svg('polygon', { class: 'face ' + name, points: corners.map((p) => point(...p)).join(' ') }, node);
  svg('path', { class: 'highlight', d: `M${point(-h, -h, z0 + H)}L${point(h, -h, z0 + H)}L${point(h, h, z0 + H)}` }, node);
}
let plates = [];
function addPlate(node, className, x, y, text, { pad = 1.3, round = false } = {}) {
  const group = svg('g', { class: className }, node);
  const plate = { group, rect: svg('rect', {}, group), label: svg('text', {}, group), x, y, pad, round };
  plate.label.textContent = text;
  plates.push(plate);
  sizePlate(plate);
  return plate;
}
function setPlate(plate, text) { plate.label.textContent = text; sizePlate(plate); }
matchMedia('(max-width: 600px)').addEventListener('change', () => plates.forEach(sizePlate));

// ---------- Layout ----------
const wide = () => state.size > 13;
const spacing = () => wide() ? 2.05 : 2.15;
const cellHalf = () => wide() ? .6 : .72;
const itemHalf = () => wide() ? .5 : .6;
const itemH = 8.5;
// 13 buckets sit in one row; 29 buckets in two rows (0–14 behind, 15–28 in front) so names do not overlap.
const bucketPos = (k) => !wide() ? [k * spacing(), 0] : k < 15 ? [k * spacing(), -3.4] : [(k - 15) * spacing() + 1, 3.4];
const machineU = -5;
let machine;
function buildScene() {
  for (const id of ['casings', 'links', 'nodes', 'packets']) byId(id).replaceChildren();
  plates = [];
  // Hash machine.
  const m = svg('g', { class: 'node machine', transform: `translate(${flat(machineU, 0).join(' ')})` }, byId('nodes'));
  drawShadow(m, 1.4);
  drawBox(m, 1.4, 16);
  addPlate(m, 'tag', 0, 36, '해시 기계', { round: true });
  machine = { node: m, work: addPlate(m, 'tag work', 0, -16 - 14 * 1.4 - 16, '이름 → 칸 번호', { pad: 1.1 }) };
  // Buckets and their chains.
  for (let k = 0; k < state.size; k++) {
    const node = svg('g', { class: 'node bucket', 'data-bucket': k, transform: `translate(${flat(...bucketPos(k)).join(' ')})` }, byId('nodes'));
    drawShadow(node, cellHalf());
    drawBox(node, cellHalf(), 3);
    svg('text', { class: 'bucket-index', x: 0, y: 7 * 2 * cellHalf() + 12 }, node).textContent = k;
    state.table[k].forEach((name, i) => {
      const item = svg('g', { class: 'item', 'data-name': name }, node);
      drawBox(item, itemHalf(), itemH, 3 + i * (itemH + 1));
      svg('text', { class: 'item-label', x: 0, y: -(3 + i * (itemH + 1) + itemH) + .5 }, item).textContent = name;
      // Lower items in a chain are covered, so their name also goes on the front face.
      if (i < state.table[k].length - 1) svg('text', { class: 'item-side', x: -14 * itemHalf() + 1, y: 7 * itemHalf() - (3 + i * (itemH + 1) + itemH / 2) + 1 }, item).textContent = name;
    });
  }
  const right = 14 * Math.max(...Array.from({ length: state.size }, (_, k) => bucketPos(k)[0])) + 30, left = 14 * machineU - 50, top = wide() ? -110 : -96, bottom = wide() ? 66 : 46;
  const scale = Math.min(1.7, 590 / (right - left), 268 / (bottom - top));
  const x = 310 - scale * (left + right) / 2, y = 140 - scale * (top + bottom) / 2;
  byId('world').setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${scale.toFixed(3)})`);
}
const bucketNode = (k) => byId('nodes').querySelector(`[data-bucket="${k}"]`);
const itemNode = (name) => byId('nodes').querySelector(`[data-name="${name}"]`);

// ---------- Moving label ----------
function cancelAll() {
  timers.forEach(clearTimeout);
  timers = [];
  byId('packets').replaceChildren();
  state.busy = false;
}
function floatLabel(text, from, to, ms) {
  if (motion.matches) return;
  const g = svg('g', { class: 'mover' }, byId('packets'));
  svg('circle', { class: 'packet-halo', r: 9 }, g);
  svg('circle', { class: 'packet', r: 4.6 }, g);
  svg('text', { class: 'packet-label', y: -10 }, g).textContent = text;
  const start = performance.now();
  const step = (now) => {
    const t = Math.min((now - start) / ms, 1);
    const e = t * t * (3 - 2 * t);
    g.setAttribute('transform', `translate(${mix(from[0], to[0], e)} ${mix(from[1], to[1], e) - Math.sin(Math.PI * t) * 30})`);
    if (t < 1) requestAnimationFrame(step); else g.remove();
  };
  requestAnimationFrame(step);
}

// ---------- Operations ----------
const bucketOf = (name, size = state.size) => codeSum(name) % size;
const hashText = (name) => `${name} → 코드 합 ${fmt(codeSum(name))} → ${fmt(codeSum(name))} mod ${state.size} = ${bucketOf(name)}`;
function fill(names, size) {
  state.size = size;
  state.table = Array.from({ length: size }, () => []);
  state.order = [];
  for (const name of names) { state.table[bucketOf(name)].push(name); state.order.push(name); }
}
function insert(name, user) {
  if (state.busy) return;
  if (state.order.includes(name)) { report(`${name}은(는) 이미 들어 있습니다. 같은 이름은 한 번만 넣습니다.`); return; }
  state.busy = true;
  const k = bucketOf(name);
  setPlate(machine.work, `${fmt(codeSum(name))} mod ${state.size} = ${k}`);
  machine.node.classList.add('busy');
  later(500, () => {
    floatLabel(name, flat(machineU, 0, 40), flat(...bucketPos(k), 12 + state.table[k].length * (itemH + 1)), 700);
    later(720, () => {
      const collided = state.table[k].length > 0;
      state.table[k].push(name);
      state.order.push(name);
      machine.node.classList.remove('busy');
      buildScene();
      bucketNode(k)?.classList.add(collided ? 'collide' : 'hit');
      itemNode(name)?.classList.add('fresh');
      const load = state.order.length / state.size;
      report(`${hashText(name)}번 칸에 넣음${collided ? ' · 충돌! 이미 있는 이름 위에 쌓음' : ''} · 채움 비율 ${state.order.length} ÷ ${state.size} = ${load.toFixed(2)}`);
      syncStats();
      if (lesson[state.index].resize && state.size === 13 && load > .75) {
        later(1300, () => resize(user));
        return;
      }
      state.busy = false;
      syncControls();
      if (user) afterUser({ count: state.order.length, names: state.order, size: state.size });
    });
  });
  syncControls();
}
function resize(user) {
  report('채움 비율이 0.75를 넘었습니다. 칸을 29개로 늘리고 모든 이름의 칸을 다시 계산합니다.');
  byId('stage-panel').classList.add('resizing');
  later(700, () => {
    fill([...state.order], 29);
    buildScene();
    byId('stage-panel').classList.remove('resizing');
    const crowded = state.table.filter((chain) => chain.length > 1).length;
    report(`칸이 29개가 됐습니다. 채움 비율 ${state.order.length} ÷ 29 = ${(state.order.length / 29).toFixed(2)} · 두 개 이상 몰린 칸 ${crowded}개`);
    state.busy = false;
    syncStats();
    syncControls();
    if (user) afterUser({ count: state.order.length, names: state.order, size: state.size });
  });
}
function find(name, user) {
  if (state.busy) return;
  state.busy = true;
  const k = bucketOf(name);
  setPlate(machine.work, `${fmt(codeSum(name))} mod ${state.size} = ${k}`);
  machine.node.classList.add('busy');
  later(500, () => {
    floatLabel(name, flat(machineU, 0, 40), flat(...bucketPos(k), 14), 700);
    const chain = state.table[k];
    let compared = 0;
    const step = (i) => {
      if (i >= chain.length) return done(false);
      compared++;
      itemNode(chain[i])?.classList.add('compare');
      if (chain[i] === name) return done(true);
      later(450, () => step(i + 1));
    };
    const done = (found) => {
      machine.node.classList.remove('busy');
      bucketNode(k)?.classList.add(found ? 'hit' : 'miss');
      if (found) itemNode(name)?.classList.add('found');
      const listSteps = found ? state.order.indexOf(name) + 1 : state.order.length;
      report(`${hashText(name)}번 칸 · ${chain.length ? `이름 ${compared}개 비교` : '빈 칸'} → ${found ? '찾음' : '없음'} · 리스트였다면 ${listSteps}번 비교`);
      state.busy = false;
      syncControls();
      if (user) afterUser({ find: name, found });
    };
    later(720, () => { buildScene(); bucketNode(k)?.classList.add('look'); step(0); });
  });
  syncControls();
}

// ---------- Panel ----------
function buildControls() {
  const step = lesson[state.index];
  const row = byId('name-row');
  row.replaceChildren(Object.assign(document.createElement('span'), { className: 'row-name', textContent: step.mode === 'find' ? '찾기' : '넣기' }));
  for (const name of step.mode === 'find' ? [...allNames, missing] : allNames) {
    const b = Object.assign(document.createElement('button'), { type: 'button', className: 'action name-button', textContent: name });
    b.dataset.name = name;
    b.addEventListener('click', () => { takeOver(); if (step.mode === 'find') find(name, true); else insert(name, true); });
    row.append(b);
  }
}
function syncControls() {
  const step = lesson[state.index];
  [...byId('name-row').querySelectorAll('button')].forEach((b) => {
    b.disabled = state.busy && !state.playing;
    b.classList.toggle('inside', state.order.includes(b.dataset.name));
    b.setAttribute('aria-pressed', String(step.mode === 'insert' && state.order.includes(b.dataset.name)));
  });
  byId('reset').disabled = state.busy && !state.playing;
}
function syncStats() {
  const crowded = state.table.filter((chain) => chain.length > 1).length;
  byId('stats').textContent = `이름 ${state.order.length}개 · 칸 ${state.size}개 · 채움 비율 ${(state.order.length / state.size).toFixed(2)} · 충돌한 칸 ${crowded}개`;
}
function report(text) { byId('readout').textContent = text; byId('announcement').textContent = text; }
function resetTable() {
  cancelAll();
  const step = lesson[state.index];
  fill(step.start, step.size);
  buildScene();
  syncStats();
  syncControls();
}
byId('reset').onclick = () => { takeOver(); resetTable(); report('처음 상태로 되돌렸습니다.'); };

// ---------- Tasks ----------
const currentTask = () => lesson[state.index].tasks[progress[state.index]];
function syncTask() {
  const tasks = lesson[state.index].tasks;
  const task = currentTask();
  const choices = byId('try-choices');
  choices.replaceChildren();
  byId('try').classList.toggle('solved', Boolean(state.solved) && !task?.ask);
  if (task?.ask) {
    byId('try-text').textContent = task.ask;
    byId('try-result').textContent = state.wrong || (state.solved ? `✓ 맞았습니다. ${state.solved}` : '');
    for (const choice of task.choices) {
      const b = Object.assign(document.createElement('button'), { type: 'button', className: 'action choice-button', textContent: choice });
      b.addEventListener('click', () => answer(choice));
      choices.append(b);
    }
    return;
  }
  byId('try-text').textContent = task ? task.text : (state.solved ? '' : '이 단계의 문제를 모두 풀었습니다. 자유롭게 해 보세요.');
  byId('try-result').textContent = state.solved ? `✓ 맞았습니다. ${state.solved}${progress[state.index] >= tasks.length ? ' · 이 단계의 문제를 모두 풀었습니다.' : ''}` : '';
}
// Only the learner's own actions count, so the demo cannot solve a problem.
function afterUser(event) {
  const task = currentTask();
  if (task && !task.ask && task.test(event)) { progress[state.index]++; state.solved = task.ok; state.wrong = ''; }
  syncTask();
}
function answer(choice) {
  const task = currentTask();
  if (choice !== task.answer) { state.wrong = `✗ ${choice}이(가) 아닙니다. 다시 골라 보세요.`; syncTask(); return; }
  progress[state.index]++;
  state.wrong = '';
  state.solved = task.why;
  syncTask();
}

// ---------- Demo ----------
let frame = null, lastFrame = null;
function takeOver() {
  if (!state.playing) return;
  state.playing = false;
  resetTable();
  syncPlayback();
}
function demoTick() {
  if (state.busy) { state.wait = 300; return; }
  const step = lesson[state.index];
  if (step.mode === 'find') {
    const names = ['하은', '민수', missing, '시우'];
    find(names[state.demoPosition++ % names.length], false);
    state.wait = 3600;
    return;
  }
  const rest = allNames.filter((name) => !state.order.includes(name));
  if (!rest.length || (step.resize && state.size === 29) || (!step.resize && state.order.length >= 6)) { resetTable(); state.wait = 1200; return; }
  const pick = step.label === '충돌' ? ['하준', '지호', '지아', '도윤', '서연', '건우'].find((name) => !state.order.includes(name)) ?? rest[0] : rest[0];
  insert(pick, false);
  state.wait = step.resize ? 4200 : 2600;
}
function tick(now) {
  frame = null;
  const elapsed = lastFrame === null ? 0 : Math.min(now - lastFrame, 80);
  lastFrame = now;
  if (state.playing) {
    state.wait -= elapsed;
    if (state.wait <= 0) demoTick();
    frame = requestAnimationFrame(tick);
  } else lastFrame = null;
}
function syncPlayback() {
  const reduced = motion.matches;
  if (reduced) state.playing = false;
  if (state.playing && frame === null) frame = requestAnimationFrame(tick);
  syncControls();
}

// ---------- Steps and routing ----------
function showStep(index, announce = true) {
  state.index = index;
  state.playing = !motion.matches;
  const s = lesson[index];
  state.solved = '';
  state.wrong = '';
  state.demoPosition = 0;
  byId('step-title').textContent = s.title;
  byId('body').textContent = s.body;
  byId('takeaway').textContent = s.takeaway;
  byId('scene-desc').textContent = s.description;
  byId('count').textContent = `${index + 1} / ${lesson.length}`;
  byId('prev').disabled = index === 0;
  byId('next').disabled = index === lesson.length - 1;
  stepButtons.forEach((button, i) => {
    if (i === index) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  try { localStorage.setItem(storageKey, String(index)); } catch {}
  buildControls();
  resetTable();
  report(s.mode === 'find' ? '찾을 이름을 눌러 보세요.' : '넣을 이름을 눌러 보세요.');
  syncTask();
  state.wait = 800;
  syncPlayback();
  // Nothing plays with reduced motion, so the still picture runs the step's example once:
  // one name put in, a stored name found, two names that land in the same bucket, the tenth name that resizes.
  // The calculation goes in a note at the top of the scene.
  byId('example-note')?.remove();
  if (motion.matches) {
    const calc = (name, size = 13) => `${name} → ${fmt(codeSum(name))} mod ${size} = ${codeSum(name) % size}`;
    if (s.mode === 'find') { find('하은', false); exampleNote(`${calc('하은')} → ${bucketOf('하은')}번 칸에서 찾음`); }
    else if (s.resize) {
      const tenth = allNames.find((name) => !state.order.includes(name));
      insert(tenth, false);
      exampleNote(`13칸에 ${state.order.length}개 → 채움 비율 ${(state.order.length / 13).toFixed(2)} > 0.75 → 29칸으로 다시 나눔`);
    } else if (s.label === '충돌') { insert('지아', false); insert('도윤', false); exampleNote(`${calc('지아')} · ${calc('도윤')} → 같은 칸에 쌓음`); }
    else { insert('지아', false); exampleNote(`${calc('지아')} → ${bucketOf('지아')}번 칸에 넣음`); }
  }
  if (announce) byId('announcement').textContent = `${index + 1}단계. ${s.title}`;
}
function goToStep(index) {
  if (index < 0 || index >= lesson.length || index === state.index) return;
  history.pushState(null, '', `#/hash/${index + 1}`);
  showStep(index);
}
function routeIndex() {
  const match = /^#\/hash\/(\d+)$/.exec(location.hash);
  const routed = match ? Number(match[1]) - 1 : -1;
  if (routed >= 0 && routed < lesson.length) return routed;
  try {
    const stored = localStorage.getItem(storageKey);
    const index = Number(stored);
    if (stored !== null && Number.isInteger(index) && index >= 0 && index < lesson.length) return index;
  } catch {}
  return 0;
}
const stepButtons = lesson.map(({ label }, index) => {
  const listItem = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  const number = document.createElement('span');
  number.className = 'step-number';
  number.textContent = index + 1;
  button.append(number, document.createTextNode(label));
  button.addEventListener('click', () => goToStep(index));
  listItem.append(button);
  byId('steps').append(listItem);
  return button;
});
byId('prev').onclick = () => goToStep(state.index - 1);
byId('next').onclick = () => goToStep(state.index + 1);
window.addEventListener('hashchange', syncRoute);
window.addEventListener('popstate', syncRoute);
motion.addEventListener('change', () => {
  if (!motion.matches) state.playing = true;
  syncPlayback();
});
window.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    goToStep(state.index + (event.key === 'ArrowRight' ? 1 : -1));
  }
});
const initial = routeIndex();
history.replaceState(null, '', `#/hash/${initial + 1}`);
state.index = -1;
showStep(initial, false);
</script>
</body>
</html>
