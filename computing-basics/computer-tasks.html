const slug = 'computer-tasks';
const byId = id => document.getElementById(id);
const workspace = document.querySelector('.workspace');
const viewport = byId('scene');
const drawing = byId('figure');
const viewWidth = 620;
const viewHeight = 280;
const center = {x: viewWidth / 2, y: viewHeight / 2};
const camera = {x: 0, y: 0, zoom: 1};
const maxZoom = 2.2;
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
// The figure is a shared 2.5D scene (dist/shared/iso, figure guide 1 and 8). Each row is a lane across the
// floor: on the left a platform with what the computer gets, in the middle the computer box with the
// instruction plate standing on it, on the right the screen. Floor wires carry the value left to right, and
// the flow plays once when the step opens (figure guide 3-1): the value moves into the computer, then the
// result moves to the screen, which shows it on arrival.
const lane = {input: 0, computer: 215, output: 430};
const rowDepth = [0, 230];
const sceneBounds = [[-70, -45, 0], [500, -45, 0], [-70, 275, 0], [500, 275, 0], [215, -10, 82], [430, 0, 88]];

function picture(parent, x, y, width, height, gray = false) {
  const element = svg('use', {href: '#task-photo', x: x - width / 2, y: y - height / 2, width, height,
    ...(gray ? {style: 'filter: grayscale(1)'} : {})}, parent);
  return element;
}

function drawInput(s, kind, value, v, changed) {
  const u = lane.input;
  if (kind === 'key') {
    s.block(u, v, {w: 72, d: 72, h: 8, kind: 'base'});
    ['A', 'B'].forEach((key, i) => {
      const pressed = key === value;
      const ku = u + (i ? 21 : -21);
      const h = pressed ? 4 : 10;
      s.block(ku, v, {w: 24, d: 24, h, z: 8, r: 3, kind: pressed ? 'key-on' : 'key', changed: pressed && changed});
      const [x, y] = s.at(ku, v, 8 + h);
      const label = svg('text', {x, y: y + 6, class: 'key-label'}, s.layers.labels);
      label.textContent = key;
    });
    return;
  }
  s.block(u, v, {w: 64, d: 64, h: 8, kind: 'base'});
  if (kind === 'card') {
    twoCards.forEach((number, i) => {
      const cu = u + (i ? 22 : -22);
      s.block(cu, v, {w: 34, d: 6, h: 46, z: 8, r: 0, kind: 'panel', facing: 'front'});
      s.faceText(cu, v + 3, 8 + 15, number, 'value');
    });
  } else {
    s.block(u, v, {w: 104, d: 6, h: 66, z: 8, r: 0, kind: 'panel', facing: 'front'});
    const [x, y] = s.at(u, v + 3, 8 + 33);
    const scale = s.at(1, 0)[0] - s.at(0, 0)[0];
    picture(s.layers.labels, x, y, 96 * scale, 56 * scale);
  }
}

function drawComputer(s, instruction, v, changed) {
  const u = lane.computer;
  s.block(u, v, {w: 58, d: 58, h: 34, kind: 'computer', changed});
  // The instruction plate stands on the computer's top: the job, and under it what the job works out.
  const detail = instruction.detail;
  const h = detail ? 46 : 30;
  s.block(u, v - 30, {w: 150, d: 5, h, z: 34, r: 0, kind: 'plate', facing: 'front', changed});
  s.faceText(u, v - 27.5, 34 + h - 19, instruction.task, 'operation');
  if (detail) s.faceText(u, v - 27.5, 34 + 7, detail, 'detail');
}

function drawOutput(s, kind, outcome, v, changed, seq) {
  const u = lane.output;
  s.block(u, v, {w: 26, d: 26, h: 8, kind: 'stand'});
  if (kind === 'photo') {
    s.block(u, v, {w: 124, d: 6, h: 78, z: 8, r: 0, kind: outcome ? 'panel' : 'frame-empty', facing: 'front', changed});
    const [x, y] = s.at(u, v + 3, 8 + 39);
    if (outcome) {
      const scale = s.at(1, 0)[0] - s.at(0, 0)[0];
      const photo = picture(s.layers.labels, x, y, outcome.width * scale, outcome.height * scale, outcome.gray);
      photo.dataset.after = seq;
    } else {
      const wait = svg('text', {x, y: y + 5, class: 'caption waiting'}, s.layers.labels);
      wait.textContent = '대기 중';
    }
    return;
  }
  // The screen stands behind the middle of its stand, so the stand's front shows under it.
  s.block(u, v - 8, {w: 8, d: 4, h: 14, z: 8, r: 0, kind: 'stand', facing: 'front'});
  s.block(u, v - 8, {w: 122, d: 8, h: 64, z: 22, r: 0, kind: 'screen', facing: 'front', changed});
  const result = outcome?.result;
  const [x, y] = s.at(u, v - 4, 22 + 32);
  const text = svg('text', {x, y: y + (result == null ? 5 : 11), class: result == null ? 'caption screen-text' : 'value screen-text'}, s.layers.labels);
  text.textContent = result ?? '빈 화면';
  if (result != null) text.dataset.after = seq;
}

function drawRow(s, kind, instruction, outcome, v, marks) {
  const handed = kind === 'key' ? instruction.key : kind === 'card' ? twoCards.join(', ') : '사진';
  const result = kind === 'photo' ? '사진' : outcome?.result;
  // Wires first, so the blocks cover their ends and only the open stretch between places shows.
  // The moving value starts from the value dot and goes into the computer.
  const dotAt = lane.input + 52 + (lane.computer - 94) * .64;
  s.wire([[lane.input, v], [lane.computer, v]], {travel: [[52, v], [lane.computer - 42, v]], arrowAt: .3, seq: 1, carry: handed, moveFrom: [dotAt, v]});
  s.wire([[lane.computer, v], [lane.output, v]], outcome
    ? {travel: [[lane.computer + 42, v], [lane.output - 20, v]], seq: 2, carry: result}
    : {state: 'unknown', travel: [[lane.computer + 42, v], [lane.output - 20, v]]});
  drawInput(s, kind, instruction.key, v, marks.includes('key'));
  drawComputer(s, instruction, v, marks.includes('job'));
  drawOutput(s, kind, outcome, v, marks.includes('output'), 2);
  s.dot(dotAt, v, handed);
}

function drawFigure(index, {hide, changed}) {
  const step = lesson.steps[index];
  drawing.replaceChildren();
  // One fit for every step (both rows and the headings' place), so nothing moves between steps.
  const s = IsoScene.scene(drawing, {bounds: sceneBounds, headroom: 46, pad: 10});
  s.grid([-90, 520], [-70, 300], 26);
  step.headings?.forEach(([name, meaning], i) => {
    const x = s.at([lane.input, lane.computer, lane.output][i], 0)[0];
    const title = svg('text', {x, y: 20, class: 'heading'}, drawing);
    title.textContent = name;
    if (changed.includes('headings')) title.setAttribute('data-changed', '');
    svg('text', {x, y: 40, class: 'caption'}, drawing).textContent = meaning;
  });
  step.rows.forEach((option, position) => {
    const n = position + 1;
    const instruction = step.kind === 'key' ? {task: keyboard.task, key: option}
      : hide.includes('detail-' + n) ? {task: option.task} : option;
    const outcome = hide.includes('output-' + n) ? null : step.kind === 'key' ? {result: option} : option;
    const marks = changed.filter(id => id.endsWith('-' + n)).map(id => id.split('-')[0]);
    drawRow(s, step.kind, instruction, outcome, rowDepth[position], marks);
  });
  s.settle();
}

byId('zoom-in').onclick = () => zoomBy(.3);
byId('zoom-out').onclick = () => zoomBy(-.3);
enableCameraDrag();

viewport.addEventListener('keydown', event => {
  if (camera.zoom === 1) return;
  const direction = {ArrowLeft: [-1, 0], ArrowUp: [0, -1], ArrowRight: [1, 0], ArrowDown: [0, 1]}[event.key];
  if (!direction) return;
  event.preventDefault();
  setCamera(camera.x + direction[0] * 18, camera.y + direction[1] * 18, camera.zoom);
});

window.addEventListener('keydown', event => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === '+') zoomBy(.3);
  else if (event.key === '-') zoomBy(-.3);
  else if (event.key === '0') resetView();
  else return;
  event.preventDefault();
});
setCamera(0, 0, 1);
</script>
