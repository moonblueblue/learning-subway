const slug = 'computer-tasks';
const byId = id => document.getElementById(id);
const workspace = document.querySelector('.workspace');
const viewport = byId('scene');
const drawing = byId('figure');
const viewWidth = 620;
const viewHeight = 280;
const center = {x: viewWidth / 2, y: viewHeight / 2};
const camera = {x: 0, y: 0, zoom: 1};
const maxZoom = 2.2;
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
const columns = [111, 310, 509];

function text(parent, x, y, value, className) {
  svg('text', {x, y, class: className}, parent).textContent = value;
}

function rect(parent, x, y, width, height, className, rx = 8) {
  return svg('rect', {x, y, width, height, rx, class: className}, parent);
}

function picture(parent, x, y, width, height, gray = false) {
  svg('use', {href: '#task-photo', x: x - width / 2, y: y - height / 2, width, height,
    ...(gray ? {style: 'filter: grayscale(1)'} : {})}, parent);
}

function drawInput(parent, kind, value, y, changed) {
  if (kind === 'key') {
    rect(parent, 49, y - 32, 124, 64, 'surface', 12);
    ['A', 'B'].forEach((key, i) => {
      const selected = key === value;
      const x = 63 + i * 51;
      const top = y - 20 + (selected ? 4 : 0);
      const keyCap = rect(parent, x, top, 44, 40, selected ? 'selected' : 'surface', 6);
      if (selected && changed) keyCap.setAttribute('data-changed', '');
      text(parent, x + 22, top + 27, key, 'key-label');
    });
  } else if (kind === 'card') {
    twoCards.forEach((number, i) => {
      const x = 63 + i * 51;
      rect(parent, x, y - 25, 44, 50, 'surface');
      text(parent, x + 22, y + 11, number, 'value');
    });
  } else {
    picture(parent, columns[0], y, 96, 56);
  }
}

function drawOutput(parent, kind, operation, y, changed) {
  const x = columns[2];
  if (kind === 'photo') {
    rect(parent, x - 62, y - 35, 124, 70, 'expectation');
    if (operation) {
      picture(parent, x, y, operation.width, operation.height, operation.gray);
      if (changed) rect(parent, x - operation.width / 2, y - operation.height / 2, operation.width,
        operation.height, 'task-result-border', 5).setAttribute('data-changed', '');
    }
    else text(parent, x, y + 5, '대기 중', 'caption waiting');
    return;
  }
  const screen = rect(parent, x - 61, y - 30, 122, 57, 'screen');
  if (changed) screen.setAttribute('data-changed', '');
  rect(parent, x - 17, y + 31, 34, 4, 'foot', 2);
  const result = operation?.result;
  text(parent, x, y + (result == null ? 5 : 9), result ?? '빈 화면', result == null ? 'caption screen-text' : 'value screen-text');
}

function drawRow(kind, option, result, y, changed = []) {
  const row = svg('g', {}, drawing);
  const instruction = kind === 'key' ? keyboard : option;
  const outcome = kind === 'key' && result ? {result} : result;
  drawInput(row, kind, option, y, changed.includes('key'));
  if (kind === 'key' ? option : instruction) svg('line', {x1: 180, y1: y, x2: 224, y2: y, class: 'flow'}, row);
  if (outcome) svg('line', {x1: 395, y1: y, x2: 438, y2: y, class: 'flow'}, row);
  const job = rect(row, 231, y - 33, 158, 66, instruction ? 'instruction' : 'expectation', 11);
  if (changed.includes('job')) job.setAttribute('data-changed', '');
  const detail = instruction?.detail;
  text(row, columns[1], y + (detail ? -4 : 6), instruction?.task ?? '할 일 고르기', 'operation');
  if (detail) text(row, columns[1], y + 19, detail, 'caption');
  drawOutput(row, kind, outcome, y, changed.includes('output'));
}

function drawFigure(index, {hide, changed}) {
  const step = lesson.steps[index];
  drawing.replaceChildren();
  step.headings?.forEach(([name, meaning], i) => {
    text(drawing, columns[i], 35, name, 'heading');
    if (changed.includes('headings')) drawing.lastElementChild.setAttribute('data-changed', '');
    text(drawing, columns[i], 55, meaning, 'caption');
  });
  if (step.rows.length === 2) {
    svg('line', {x1: 38, y1: 164, x2: 582, y2: 164, class: 'comparison-rule'}, drawing);
  }
  step.rows.forEach((option, position) => {
    const n = position + 1;
    const job = hide.includes('detail-' + n) ? {task: option.task} : option;
    const result = hide.includes('output-' + n) ? null : option;
    const marks = changed.filter(id => id.endsWith('-' + n)).map(id => id.split('-')[0]);
    drawRow(step.kind, job, result, [112, 215][position], marks);
  });
}

byId('zoom-in').onclick = () => zoomBy(.3);
byId('zoom-out').onclick = () => zoomBy(-.3);
enableCameraDrag();

viewport.addEventListener('keydown', event => {
  if (camera.zoom === 1) return;
  const direction = {ArrowLeft: [-1, 0], ArrowUp: [0, -1], ArrowRight: [1, 0], ArrowDown: [0, 1]}[event.key];
  if (!direction) return;
  event.preventDefault();
  setCamera(camera.x + direction[0] * 18, camera.y + direction[1] * 18, camera.zoom);
});

window.addEventListener('keydown', event => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey ||
      event.target.closest?.('input, textarea, select, [contenteditable], [role="dialog"]')) return;
  if (event.key === '+') zoomBy(.3);
  else if (event.key === '-') zoomBy(-.3);
  else if (event.key === '0') resetView();
  else return;
  event.preventDefault();
});
setCamera(0, 0, 1);
</script>
